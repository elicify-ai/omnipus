version: "2"

linters:
  default: all
  disable:
    # TODO: Tweak for current project needs
    - containedctx
    - cyclop
    - depguard
    - dupword
    - err113
    - exhaustruct
    - funcorder
    - gochecknoglobals
    - godot
    - intrange
    - ireturn
    - nlreturn
    - noctx
    - noinlineerr
    - nonamedreturns
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5

    # TODO: Disabled, because they are failing at the moment, we should fix them and enable (step by step).
    - misspell # 0 with default settings, but 481 under this repo's `locale: US`
              # (flags British spellings: behaviour->behavior, artefact->artifact).
              # Style preference, not correctness. Enable only if US spelling is a
              # deliberate house rule — then fix all 481 rather than downgrading.
    # Measured 2026-08-20 with golangci-lint 2.12.2, --build-tags=goolm,stdjson,
    # --max-issues-per-linter=0 --max-same-issues=0:
    #   ineffassign 0   -> ENABLED (removed from this list)
    #   staticcheck 162 -> mostly QF1012/QF1008 quickfixes; tractable in one pass
    #   errcheck   1073 -> 412 production / 661 test
    #   gosec      2258 -> G304 621, G104 584, G306 365, G301 270
    # Re-measure before enabling any of the above; do not guess.
    - contextcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - gosec
    - lll
    - maintidx
    - mnd
    - modernize
    - nestif
    - nilnil
    - paralleltest
    - perfsprint
    - revive
    - staticcheck
    - tagalign
    - testifylint
    - thelper
    - unparam
    - usestdlibvars
    - usetesting

    # ADR-053 delivery: temporarily disabled — accumulated style drift from
    # the main merge (misspell comments, godoclint godoc retrofits, dupl
    # duplicated-code) is out of scope for the F4 delivery. (gofumpt, golines,
    # gci, godot removed: v2 calls them formatters, not linters.) Re-enable
    # after a dedicated style-cleanup commit post-merge.
    - dupl
    - godoclint
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 120
      statements: 40
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 20
    govet:
      enable-all: true
      disable:
        - fieldalignment
    lll:
      line-length: 120
      tab-width: 4
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - assign
        - case
        - condition
        - operation
        - return
    nakedret:
      max-func-lines: 3
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: argument-limit
          arguments:
            - 7
          severity: warning
        - name: banned-characters
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: comment-spacings
          arguments:
            - nolint
          severity: warning
        - name: cyclomatic
          disabled: true
        - name: file-header
          disabled: true
        - name: function-result-limit
          arguments:
            - 3
          severity: warning
        - name: function-length
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: modifies-value-receiver
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-receiver
          disabled: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - funlen
          - maintidx
          - gocognit
          - gocyclo
          # Test-file noise: near-identical table/subtest bodies (dupl) and
          # deliberate time.Local use for server-zone assertions (gosmopolitan)
          # are normal and expected in tests.
          - dupl
          - gosmopolitan
        path: _test\.go$
      - linters:
          - golines
        path: ^pkg/api/generated/
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"
