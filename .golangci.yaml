version: "2"

linters:
  default: all
  disable:
    # TODO: Tweak for current project needs
    - containedctx
    - cyclop
    - depguard
    - dupword
    - err113
    - exhaustruct
    - funcorder
    - gochecknoglobals
    - godot
    - intrange
    - ireturn
    - nlreturn
    - noctx
    - noinlineerr
    - nonamedreturns
    - tagliatelle
    - testpackage
    - varnamelen
    # wrapcheck: DISABLED until wrapping is done package-by-package under
    # scripts/check-no-unsafe-error-wrap.sh. The previous enablement
    # (0b4585ec0, reverted at ed86a62f9) wrapped ~377 files in one sweep
    # and broke 18 packages: it wrapped io.EOF in Read methods (stdlib
    # compares err == io.EOF) and wrapped nil successes into
    # `%!w(<nil>)`. Settings below are the carve-outs that must be in
    # place BEFORE wrapcheck is removed from this list. Plan for the
    # enablement pass: (1) guard is live and proven, (2) os.IsNotExist
    # sites migrated to errors.Is so wrapping those paths is safe,
    # (3) wrap one package, run that package's tests, (4) only then
    # remove this disable. Zero suppressions — do not path-exclude
    # findings to make a partial wrap look clean.
    - wrapcheck
    - wsl
    - wsl_v5

    # TODO: Disabled, because they are failing at the moment, we should fix them and enable (step by step).
    - misspell # 0 with default settings, but 481 under this repo's `locale: US`
              # (flags British spellings: behaviour->behavior, artefact->artifact).
              # Style preference, not correctness. Enable only if US spelling is a
              # deliberate house rule — then fix all 481 rather than downgrading.
    # Measured 2026-08-20 with golangci-lint 2.12.2, --build-tags=goolm,stdjson,
    # --max-issues-per-linter=0 --max-same-issues=0:
    #   ineffassign 0   -> ENABLED (removed from this list)
    #   staticcheck 162 -> mostly QF1012/QF1008 quickfixes; tractable in one pass
    #   errcheck   1073 -> 412 production / 661 test
    #   gosec      2258 -> G304 621, G104 584, G306 365, G301 270
    # Re-measure before enabling any of the above; do not guess.
    #
    # gosec: ENABLED (removed from this list) 2026-08-21, but SCOPED to
    # production files in the six security-critical packages only
    # (pkg/security, pkg/sandbox, pkg/audit, pkg/policy, pkg/credentials,
    # pkg/auth) via the path-except exclusion rule below — silent everywhere
    # else in the repo (still 2258 findings project-wide, untriaged). Full
    # repo-wide enablement is separate follow-up work.
    #
    # errcheck: ENABLED (removed from this list) 2026-08-22, SCOPED the same
    # way as gosec above — production AND test files in the same six
    # security-critical packages only, via the path-except exclusion rule
    # below. Findings were already fixed across those six packages in an
    # earlier pass; this closes the gap where nothing enforced the fix.
    # Silent everywhere else in the repo (1073 findings measured 2026-08-20,
    # untriaged, tracked as separate follow-up work, not this sweep's scope).
    - contextcheck
    - embeddedstructfieldcheck
    - errchkjson
    - exhaustive
    - forbidigo
    - funlen
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - lll
    - maintidx
    - mnd
    - modernize
    - nestif
    - paralleltest
    - perfsprint
    - revive
    - tagalign
    - testifylint
    - thelper
    - unparam
    - usestdlibvars
    - usetesting

    # ADR-053 delivery: temporarily disabled — accumulated style drift from
    # the main merge (misspell comments, godoclint godoc retrofits, dupl
    # duplicated-code) is out of scope for the F4 delivery. (gofumpt, golines,
    # gci, godot removed: v2 calls them formatters, not linters.) Re-enable
    # after a dedicated style-cleanup commit post-merge.
    - dupl
    - godoclint

    # recvcheck — disabled repo-wide (founder decision, 2026-09-16): Go's
    # encoding contracts FORCE mixed value/pointer receivers on exactly three
    # types in this repo, and the linter has found no real defect among them:
    #   - config.SecureString (pkg/config/security.go): UnmarshalJSON/
    #     UnmarshalYAML/UnmarshalText must be pointer receivers (they mutate
    #     in place), while MarshalJSON/MarshalYAML must stay VALUE receivers
    #     so non-addressable values (map values, bare values) still redact —
    #     guarded by pkg/config/security_test.go's NonAddressable cases.
    #   - workspace.DelegationEdge (pkg/workspace/delegation.go):
    #     UnmarshalJSON is a pointer receiver; Validate is deliberately a
    #     value receiver so composite-literal edges can call it directly.
    #   - agent.EventKind (pkg/agent/events.go): MarshalJSON is a value
    #     receiver (a pointer receiver would break fmt.Stringer for value
    #     instances); UnmarshalJSON is a pointer receiver.
    # Satisfying recvcheck here would weaken the SecureString redaction or
    # remove a deliberate nil guard / value-call ergonomics — fixes that make
    # the code worse to silence a linter that found nothing.
    - recvcheck
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 120
      statements: 40
    gocognit:
      min-complexity: 25
    gocyclo:
      min-complexity: 20
    govet:
      enable-all: true
      disable:
        - fieldalignment
    lll:
      line-length: 120
      tab-width: 4
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - assign
        - case
        - condition
        - operation
        - return
    nakedret:
      max-func-lines: 3
    # wrapcheck carve-outs. These apply the moment wrapcheck is enabled;
    # they are documented here so the enablement pass does not have to
    # invent them under pressure. Each one is a sentinel whose IDENTITY
    # is the contract — wrapping it breaks `==` comparisons that
    # errors.Is does not rescue.
    wrapcheck:
      # context errors are the one sanctioned bare passthrough (precedent
      # from the reverted enablement). Cancellation/deadline signals are
      # sentinel values that this codebase compares with == at production
      # sites (e.g. `ctx.Err() == context.DeadlineExceeded` in
      # pkg/agent/loop.go, pkg/sandbox/hardened_exec.go). Wrapping a
      # returned ctx.Err() would break those comparisons and prepend
      # noise ("Foo: context canceled") to a message whose whole point
      # is which sentinel it is. errors.Is stays correct for everything
      # else.
      ignore-interface-regexps:
        - ^context\.Context$
        # io.Reader.Read must return io.EOF bare. The standard library
        # (io.Copy, bufio, json.Decoder, http.MaxBytesReader, ...)
        # compares `err == io.EOF`; wrapping it turns a normal end-of-
        # stream into a hard failure. The same contract applies to
        # Write (short-write / ErrShortWrite), Seek, and the ReadAt/
        # WriteAt / ReadCloser / WriteCloser combinations. Observed
        # live on armReader.Read and boundedBody.Read in the reverted
        # change. The companion guard scripts/check-no-unsafe-error-wrap.sh
        # fails the build if a wrap is introduced in those methods even
        # when wrapcheck is off.
        - ^io\.
      ignore-package-globs:
        - context
        # Package io itself (io.ReadAll, io.Copy, io.NopCloser, ...).
        # io.ReadAll never returns EOF (EOF is success), but wrapping
        # other io errors at the decorator boundary is the same trap
        # as wrapping Read: the caller asked for an io.Reader, not a
        # wrapped failure. Glob `io` matches package "io" only, not
        # "io/fs" — fs.ErrNotExist wrapping is safe once callers use
        # errors.Is (and is wanted at package boundaries).
        - io
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: argument-limit
          arguments:
            - 7
          severity: warning
        - name: banned-characters
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: comment-spacings
          arguments:
            - nolint
          severity: warning
        - name: cyclomatic
          disabled: true
        - name: file-header
          disabled: true
        - name: function-result-limit
          arguments:
            - 3
          severity: warning
        - name: function-length
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: modifies-value-receiver
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-receiver
          disabled: true
  exclusions:
    paths:
      # node_modules is a JS dependency tree; the flatted package happens to
      # ship Go sample code. It is not our source and must never be linted.
      - node_modules
    generated: lax
    rules:
      # staticcheck S1016 — pkg/gateway/rest_workspace_instructions.go builds a
      # generated Response from a generated Request with an explicit struct
      # literal. staticcheck proposes converting one type into the other, which
      # is only legal because the two happen to share a shape TODAY. They are
      # distinct contract types (Hard Constraint #8: generated types are the
      # only legal cross-boundary types), so a field added to either would break
      # the wire silently. golangci-lint --fix applied this automatically and it
      # was deliberately reverted; keep it reverted.
      - linters:
          - staticcheck
        path: ^pkg/gateway/rest_workspace_instructions\.go$
        text: 'S1016'
      # ST1005 — Go's own convention exempts error strings that begin with a
      # proper noun. These lead with a provider/product name.
      - linters:
          - staticcheck
        path: ^pkg/(providers/azure/provider|tools/web)\.go$
        text: 'ST1005'
      # ST1005 — ValidateDoDDistinct's refusal (GOAL-FR-021/FR-047/FR-048) is
      # read verbatim by end users in the task create/edit dialog (fix wave:
      # task-validation-message-register). It is deliberately two full,
      # capitalized, period-terminated sentences of plain prose — Go's
      # lowercase-no-punctuation error-string convention is for log/wrap
      # readability, not for text a non-engineer reads in a UI.
      - linters:
          - staticcheck
        path: ^pkg/task/dod_distinct\.go$
        text: 'ST1005'
      # SA2001 — a deliberate lock-probe idiom (Lock immediately followed by
      # Unlock) proving the lock is acquirable / not deadlocked. The "empty
      # critical section" IS the test.
      - linters:
          - staticcheck
        path: ^pkg/tools/browser/reaper_lifecycle_test\.go$
        text: 'SA2001'
      # SA1012 — these tests deliberately pass a nil Context to prove the
      # function tolerates one. "Fixing" them deletes the coverage.
      - linters:
          - staticcheck
        path: ^pkg/tools/browser/.*_test\.go$
        text: 'SA1012'
      - linters:
          - staticcheck
        path: pkg/tools/browser/focus_emulation_test\.go
        text: 'SA1012:'

      - linters:
          - staticcheck
        path: pkg/tools/browser/text_selector_test\.go
        text: 'SA1012:'

      - linters:
          - staticcheck
        path: pkg/task/coverage_test\.go
        text: 'SA2001:'

      - linters:
          - staticcheck
        path: pkg/gateway/rest_preview\.go
        text: 'SA1019:'

      - linters:
          - staticcheck
        path: pkg/gateway/rest\.go
        text: 'S1016:'

      - linters:
          - staticcheck
        path: pkg/channels/wecom/media\.go
        text: 'S1016:'

      - linters:
          - staticcheck
        path: pkg/tools/correction_shared_types_test\.go
        text: 'QF1011:'

      - linters:
          - staticcheck
        path: cmd/omnipus/internal/run/run\.go
        text: 'ST1005:'
      # errorlint: ten test-file assertions that deliberately check EXACT
      # error identity/type — not "matches or wraps" — because the identity
      # itself IS the behavior under test (proving a function returns an
      # error UNWRAPPED, or proving Unwrap()/a passthrough field returns the
      # very same value). Converting these to errors.Is/errors.As would
      # silently accept a future regression to wrapping as still-passing.
      # Verified against each function's real implementation 2026-08-21.
      - linters:
          - errorlint
        path: ^pkg/channels/errutil_test\.go$
        source: 'if err != raw '
      - linters:
          - errorlint
        path: ^pkg/providers/error_classifier_test\.go$
        source: 'fe\.Unwrap\(\) != inner'
      - linters:
          - errorlint
        path: ^pkg/tools/message_test\.go$
        source: 'result\.Err != sendErr'
      - linters:
          - errorlint
        path: ^pkg/providers/fallback_multikey_test\.go$
        source: 'err\.\(\*(FallbackExhaustedError|FailoverError)\)'
      - linters:
          - errorlint
        path: ^pkg/providers/fallback_test\.go$
        source: 'err\.\(\*(FallbackExhaustedError|FailoverError)\)'
      - linters:
          - errorlint
        path: ^pkg/sandbox/dev_servers_reserve_test\.go$
        source: 'err\.\(GatewayCapError\)'
      - linters:
          - errorlint
        path: ^pkg/sandbox/dev_servers_test\.go$
        source: 'err\.\(GatewayCapError\)'
      # errorlint: PublishChildUnderParentLock's own doc comment
      # (pkg/session/lifecycle.go) states fn's error is passed through
      # UNCHANGED — "a non-nil error aborts both [writes]" — and
      # PublishChildUnderParentLock itself never wraps fnErr (returns it
      # directly). This test proves that passthrough by checking IDENTITY,
      # the same pattern as the ten cases above: converting to errors.Is
      # would still pass today but would also silently start passing if a
      # future change wrapped the error, hiding exactly the regression this
      # assertion exists to catch.
      - linters:
          - errorlint
        path: ^pkg/session/lifecycle_publish_child_test\.go$
        source: 'err != wantErr'
      # nilnil: three deliberate "callable unconditionally; a nil result means
      # no per-turn override, so fall back to the boot/global policy" contracts.
      # Each is documented at its declaration and every caller assigns the
      # result unconditionally. Converting them to a sentinel or a bool third
      # return would not fix a bug — it would rename "nil" to a different
      # meaningless-alone value, since nil here already IS the zero value the
      # callers expect.
      - linters:
          - nilnil
        path: ^pkg/sandbox/turn_policy\.go$
      - linters:
          - nilnil
        path: ^pkg/tools/shell\.go$
      - linters:
          - nilnil
        path: ^pkg/tools/browser/webrtc/turnserver(_stub)?\.go$
      # nilnil: readStoreOAuthCred/PeekStoreOAuthCred in oauth_token_source.go
      # deliberately return (nil, nil) for "nothing is stored for this
      # provider" — documented at each declaration. This is not "success with
      # an ambiguous empty result": every caller branches on the nil pointer
      # itself (never on error) to mean "not signed in", and one caller
      # (rest_sign_in.go's signInStatusFor) collapses err != nil and cred ==
      # nil into the identical "unknown status" response, so a sentinel error
      # would not let it distinguish anything it does not already handle the
      # same way. Converting to a sentinel would only rename the nil check to
      # an errors.Is check without changing behavior at any call site.
      - linters:
          - nilnil
        path: ^pkg/providers/oauth_token_source\.go$
      # nilnil: PublishChildUnderParentLock's fn callback (pkg/session/
      # lifecycle.go) documents nil child + nil error as "a parent-only
      # write — e.g. nothing to launch this call", NOT an ambiguous
      # not-found. This test's callback exercises exactly that documented
      # branch.
      - linters:
          - nilnil
        path: ^pkg/session/lifecycle_publish_child_test\.go$
        source: 'return nil, nil // no child to publish this call'
      # nilnil: MessageInboxStore.Latest deliberately returns (nil, nil) for
      # "no message found for this child" — its doc comment says so, and its
      # sole caller (pkg/tools/delegate_status.go's executeDurableStatus)
      # already checks err separately before branching on latest == nil, so
      # there is no ambiguity to resolve: nil unambiguously means not-found
      # here, the same way a map lookup's zero value would.
      - linters:
          - nilnil
        path: ^pkg/session/message_inbox\.go$
        source: 'return nil, nil$'
      # nilnil: parseDelegateGoal's own doc comment says neither
      # criteria-nor-dod supplied "means no goal at all — the default, and
      # the only case that returns (nil, nil)" — deliberate, not an
      # ambiguous not-found; every caller already treats a nil *GoalSpec as
      # "no goal".
      - linters:
          - nilnil
        path: ^pkg/tools/delegate_goal\.go$
        source: '^\t\treturn nil, nil$'
      # nilerr: Deliver's "best-effort wake" contract — the upward message is
      # already durably stored by the time a wake/notify attempt is made, so
      # a wake-transport failure is logged (WarnCF) and swallowed rather than
      # failing the whole Deliver call; the boot re-nudge (WP-D) covers a
      # missed wake later. Documented at both return sites and mirrored
      # deliberately by the test fake below (its own comment says so).
      - linters:
          - nilerr
        path: ^pkg/agent/steer_audience\.go$
        source: 'return steer\.Delivery\{MessageID: res\.MessageID, Outcome: steer\.DeliveryStoredNotWoken\}, nil'
      - linters:
          - nilerr
        path: ^pkg/tools/message_parent_test\.go$
        source: 'return steer\.Delivery\{MessageID: res\.MessageID, Outcome: steer\.DeliveryWoke\}, nil'
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - funlen
          - maintidx
          - gocognit
          - gocyclo
          # Test-file noise: near-identical table/subtest bodies (dupl) and
          # deliberate time.Local use for server-zone assertions (gosmopolitan)
          # are normal and expected in tests.
          - dupl
          - gosmopolitan
          # gosec: test-file findings (124 measured 2026-08-21 across the six
          # security-critical packages: G304 56, G301 17, G306 15, G204 12,
          # G302 7, G101 5, G115 4, G104 4, G112 2, G703 1, G102 1) are
          # test-fixture noise — temp dirs/files created and chmod'd by the
          # tests themselves to exercise the permission checks under test,
          # not production code paths. Excluded by path, not disabled.
          - gosec
        path: _test\.go$
      - linters:
          - golines
        path: ^pkg/api/generated/
      # gosec: scope to production files in the six security-critical
      # packages only (Constraint #6 packages: pkg/security, pkg/sandbox,
      # pkg/audit, pkg/policy, pkg/credentials, pkg/auth). path-except
      # excludes issues for files that do NOT match the pattern, i.e. keeps
      # gosec issues only inside this path — silent everywhere else in the
      # repo (2258 findings measured 2026-08-20, untriaged, tracked as
      # separate follow-up work, not this sweep's scope).
      - linters:
          - gosec
        path-except: ^pkg/(security|sandbox|audit|policy|credentials|auth)/
      # errcheck: scope to the same six security-critical packages (production
      # AND test files — unlike gosec above, test files are NOT excluded here;
      # an unchecked error in a security-package test is still worth catching).
      # path-except excludes issues for files that do NOT match the pattern,
      # i.e. keeps errcheck issues only inside this path — silent everywhere
      # else in the repo (1073 findings measured 2026-08-20, untriaged,
      # tracked as separate follow-up work, not this sweep's scope).
      - linters:
          - errcheck
        path-except: ^pkg/(security|sandbox|audit|policy|credentials|auth)/
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"
