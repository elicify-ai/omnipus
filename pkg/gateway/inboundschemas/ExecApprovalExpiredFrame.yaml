title: ExecApprovalExpiredFrame
description: >
  Server → client. Sent when an exec_approval_request times out before the
  user responds. The SPA should update the approval modal to an expired state.
  Matches the emit shape in pkg/gateway/ws_approval.go (timer.C branch).
type: object
required:
  - type
  - id
  - session_id
additionalProperties: false
properties:
  type:
    type: string
    const: exec_approval_expired
  id:
    type: string
    minLength: 1
    description: >
      The UUID of the approval request that expired. Matches the id from the
      preceding exec_approval_request frame.
  session_id:
    type: string
    minLength: 1
    description: Session in which the approval request was made.
  message:
    type: string
    description: Human-readable expiry message including tool name and timeout duration.
