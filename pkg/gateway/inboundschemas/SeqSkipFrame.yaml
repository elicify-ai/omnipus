title: SeqSkipFrame
description: >
  Server → client. Content-free placeholder substituted, both live and
  during reconnect journal-tail replay, for a ThinkingFrame this
  connection's gate hides (ADR-095 D2 Boundary 1) or for a
  ThinkingFrame payload superseded by a newer one at the same entry_id
  (spec D31). Carries zero thinking bytes: no text, entry_id, thinking
  metadata, or extension map. Passed through the ordinary contiguous
  sequence gate (src/store/chat/cursor.ts::gateFrameBySeq), advances
  the cursor (src/store/chat/slices/frames.ts::applySeqGate), and
  performs no transcript/UI mutation. Session-scoped (registered in
  SESSION_SCOPED_FRAME_TYPES).
type: object
required:
  - type
  - session_id
  - seq
additionalProperties: false
properties:
  type:
    type: string
    const: seq_skip
  session_id:
    type: string
    minLength: 1
  seq:
    type: integer
    format: int64
    minimum: 1
    description: >-
      The sequence position of the hidden or superseded thinking
      payload this placeholder occupies. Always present (unlike
      TokenFrame.seq, which is optional) — the placeholder's entire
      purpose is to keep the cursor contiguous at a definite position.
