title: MessageFrame
description: >
  Client → server. User chat message. Two variants:
    - Without session_id: server mints a new session and acks with session_started.
    - With session_id: message is appended to the existing session.
  The discriminant is the PRESENCE of session_id, not a different type value.
  Both variants share type: "message".

  content must always be present as a key, but MAY be an empty string when
  media is also present and non-empty — an attachment-only send legitimately
  has no caption (UAT Issue 5). The anyOf below enforces the actual
  invariant: content has at least 1 character, OR media has at least 1
  entry. A message with neither (empty content and no/empty media) is still
  rejected — this is NOT "content is always optional".
type: object
required:
  - type
  - content
additionalProperties: false
anyOf:
  - properties:
      content:
        minLength: 1
  - required:
      - media
    properties:
      media:
        minItems: 1
properties:
  type:
    type: string
    const: message
  content:
    type: string
    maxLength: 5242880
    description: >
      User message text. Maximum 5 MiB enforced by the server. May be an
      empty string ONLY when media is present and non-empty (an
      attachment-only send with no caption) — see the schema-level anyOf.
  session_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      If present, continue this existing session. If omitted, the server mints
      a new session and responds with a session_started frame.
  agent_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      Route this message to a specific agent by ID. If omitted the default
      agent (typically "main") handles the message.
  media:
    type: array
    description: >
      Optional media:// refs for files the user attached to this message
      (e.g. images uploaded via POST /api/v1/upload). The server threads each
      ref into the LLM content array as a multimodal content block so the
      agent can see the attachment. Empty or omitted for text-only messages.
    maxItems: 16
    items:
      type: string
      minLength: 1
      maxLength: 256
  metadata:
    type: object
    # additionalProperties: true — forward-compat, by design.
    # The metadata object is the wire's extension channel (currently
    # model_name, but future fields like request_id, traceparent, etc.
    # land here). strict() would silently reject future fields and break
    # the SPA mid-rollout.
    #
    # Validation policy is ASYMMETRIC across the boundary:
    #   - Outer MessageFrame is strict (additionalProperties: false) —
    #     the SPA rejects unknown top-level keys, so server-added fields
    #     land as a hard schema failure (visible, debuggable).
    #   - This nested `metadata` object is open (passthrough) — the SPA
    #     accepts unknown future keys without breaking, so the rollout
    #     of a new optional metadata field can ship server-side first.
    #   - Outbound (SPA → server): the W2-29 outbound validator still
    #     requires known fields to match their declared shape, AND
    #     unknown keys are logged + counted in dev mode (see
    #     src/lib/ws.ts::_parseServerFrame dev-debug + the matching
    #     outbound site). Drift on a *newly required* field is caught
    #     the moment the server starts requiring it — the validator
    #     rejects the missing required key, the SPA upgrades, ships.
    additionalProperties: true
    description: >
      Optional per-message metadata. Typed keys today: `model_name`
      (Phase 1, FR-010) — when the user picks a model in the chat
      composer, the picker value is sent as `metadata.model_name` so
      the server routes this turn to the chosen model, falling back to
      the agent's `model` config when absent; `workspace_id` — the
      active workspace this chat belongs to; and
      `workspace_setup_kickoff` (boolean) — a one-time marker that
      this message is the workspace setup kickoff for
      `metadata.workspace_id`.
    properties:
      model_name:
        type: string
        minLength: 1
        maxLength: 256
        description: >
          Model identifier to use for THIS turn only. The server honors
          this when present and falls back to the agent's configured
          `model` (and then to the active session's default) when
          absent. Empty string is treated the same as absent.
        example: "z-ai/glm-5-turbo"
      workspace_id:
        type: string
        minLength: 1
        maxLength: 128
        description: >
          Active workspace this chat belongs to (M4 workspace→turn binding).
          When the user sends a message from a workspace chat, the SPA sets
          this so the server tags the session with the workspace and any task
          the agent creates during the turn (task_create / delegation) lands on
          THIS workspace's board instead of the agent's default workspace.
          Stamped onto the session meta on first use; absent for the global
          (non-workspace) chat, where created tasks fall back to the default
          workspace.
        example: "01JXDEFAULT000000000000001"
      workspace_setup_kickoff:
        type: boolean
        description: >
          One-time marker that this message is the workspace-setup kickoff
          turn for `metadata.workspace_id`. When true, the server treats the
          frame as the one-time workspace-setup kickoff — the frame's
          `content` is ignored and replaced by a server-composed
          instruction; a system-role entry is recorded; the workspace's
          `setup_pending` flag is cleared exactly once (idempotency-guarded);
          duplicate and malformed kickoffs are rejected with an error frame.
          Absent/false for ordinary messages.
        example: true
