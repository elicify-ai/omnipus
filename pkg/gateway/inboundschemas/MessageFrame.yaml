title: MessageFrame
description: >
  Client → server. User chat message. Two variants:
    - Without session_id: server mints a new session and acks with session_started.
    - With session_id: message is appended to the existing session.
  The discriminant is the PRESENCE of session_id, not a different type value.
  Both variants share type: "message".
type: object
required:
  - type
  - content
additionalProperties: false
properties:
  type:
    type: string
    const: message
  content:
    type: string
    minLength: 1
    maxLength: 5242880
    description: User message text. Maximum 5 MiB enforced by the server.
  session_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      If present, continue this existing session. If omitted, the server mints
      a new session and responds with a session_started frame.
  agent_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      Route this message to a specific agent by ID. If omitted the default
      agent (typically "main") handles the message.
  media:
    type: array
    description: >
      Optional media:// refs for files the user attached to this message
      (e.g. images uploaded via POST /api/v1/upload). The server threads each
      ref into the LLM content array as a multimodal content block so the
      agent can see the attachment. Empty or omitted for text-only messages.
    maxItems: 16
    items:
      type: string
      minLength: 1
      maxLength: 256
  metadata:
    type: object
    description: >
      Optional per-message metadata. Currently only `model_name` is
      surfaced (Phase 1, FR-010). When the user picks a model in the
      chat composer, the picker value is sent as
      `metadata.model_name` so the server routes this turn to the
      chosen model. The server falls back to the agent's `model`
      config when this field is absent.
    additionalProperties: false
    properties:
      model_name:
        type: string
        minLength: 1
        maxLength: 256
        description: >
          Model identifier to use for THIS turn only. The server honors
          this when present and falls back to the agent's configured
          `model` (and then to the active session's default) when
          absent. Empty string is treated the same as absent.
        example: "z-ai/glm-5-turbo"
