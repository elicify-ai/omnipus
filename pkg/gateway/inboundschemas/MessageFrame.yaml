title: MessageFrame
description: >
  Client → server. User chat message. Two variants:
    - Without session_id: server mints a new session and acks with session_started.
    - With session_id: message is appended to the existing session.
  The discriminant is the PRESENCE of session_id, not a different type value.
  Both variants share type: "message".

  content must always be present as a key, but MAY be an empty string when
  media is also present and non-empty — an attachment-only send legitimately
  has no caption (UAT Issue 5). The anyOf below enforces the actual
  invariant: content has at least 1 character, OR media has at least 1
  entry. A message with neither (empty content and no/empty media) is still
  rejected — this is NOT "content is always optional".
type: object
required:
  - type
  - content
additionalProperties: false
anyOf:
  - properties:
      content:
        minLength: 1
  - required:
      - media
    properties:
      media:
        minItems: 1
properties:
  type:
    type: string
    const: message
  client_message_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      Client-generated correlation id for message-level delivery status.
      When present, the gateway echoes it in MessageStatusFrame after durable
      transcript persistence and after successful turn admission. Optional for
      compatibility with older clients.
  content:
    type: string
    maxLength: 5242880
    description: >
      User message text. Maximum 5 MiB enforced by the server. May be an
      empty string ONLY when media is present and non-empty (an
      attachment-only send with no caption) — see the schema-level anyOf.
  session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: >
      If present, continue this existing session. If omitted, the server mints
      a new session and responds with a session_started frame.
  agent_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      Route this message to a specific agent by ID. There is no default
      agent. Spec
      omnipus-system-agent K8 (FR-122, landing 1, WU-1): a frame without
      `session_id` MUST carry a nonblank `agent_id`; the server enforces this
      semantically (error frame "an agent must be named") with inbound
      validation on and off, and there is no default agent.
  recipient:
    $ref: ./AgentAddress.yaml
    description: >
      Optional request to a peer agent (session-core C-ADDRESS, FR-045): the
      {workspace_id, agent_id} pair the user @-addressed, sent from the
      owning chat named by session_id. Valid ONLY together with session_id —
      the server refuses a recipient without it, a pair that does not
      resolve to an eligible main, and a pair equal to the owning session's
      own pair. A refused recipient admits nothing. Distinct from agent_id,
      which the SPA sends on every message to route the owning chat.
  media:
    type: array
    description: >
      Optional media:// refs for files the user attached to this message
      (e.g. images uploaded via POST /api/v1/upload). The server threads each
      ref into the LLM content array as a multimodal content block so the
      agent can see the attachment. Empty or omitted for text-only messages.
    maxItems: 16
    items:
      type: string
      minLength: 1
      maxLength: 256
  auto_approve:
    type: boolean
    nullable: true
    description: >
      ADR-092 per-chat Auto-approve choice for the chat this message mints —
      meaningful only when session_id is absent (this frame is minting a new
      session); ignored when session_id is present, since an existing
      session's mode is changed exclusively via session_mode_update. Same
      value space and null semantics as SessionModeUpdateFrame.auto_approve:
      true loosens Auto-approve on for this one new chat (may loosen past
      the global default, because a human is present),
      false tightens it off, null/absent leaves it unset (the chat follows
      whatever the global default resolves to). Carrying the choice
      on the minting message itself — instead of a follow-up
      session_mode_update sent after the session_started ack — is what lets
      the choice gate the new chat's very first ask-policy tool call: a
      post-ack send can race the agent loop's own first LLM round trip.
    example: false
  metadata:
    type: object
    # additionalProperties: true — forward-compat, by design.
    # The metadata object is the wire's extension channel (currently
    # model_name, but future fields like request_id, traceparent, etc.
    # land here). strict() would silently reject future fields and break
    # the SPA mid-rollout.
    #
    # Validation policy is ASYMMETRIC across the boundary:
    #   - Outer MessageFrame is strict (additionalProperties: false) —
    #     the SPA rejects unknown top-level keys, so server-added fields
    #     land as a hard schema failure (visible, debuggable).
    #   - This nested `metadata` object is open (passthrough) — the SPA
    #     accepts unknown future keys without breaking, so the rollout
    #     of a new optional metadata field can ship server-side first.
    #   - Outbound (SPA → server): the W2-29 outbound validator still
    #     requires known fields to match their declared shape, AND
    #     unknown keys are logged + counted in dev mode (see
    #     src/lib/ws.ts::_parseServerFrame dev-debug + the matching
    #     outbound site). Drift on a *newly required* field is caught
    #     the moment the server starts requiring it — the validator
    #     rejects the missing required key, the SPA upgrades, ships.
    additionalProperties: true
    description: >
      Optional per-message metadata. Typed keys today: `model_name`
      (Phase 1, FR-010) — when the user picks a model in the chat
      composer, the picker value is sent as `metadata.model_name` so
      the server routes this turn to the chosen model, falling back to
      the agent's `model` config when absent; `workspace_id` — the
      active workspace this chat belongs to; and
      `workspace_setup_kickoff` (boolean) — a retired client kickoff
      marker that the server refuses (see the property below).
    properties:
      model_name:
        type: string
        minLength: 1
        maxLength: 256
        description: >
          Model identifier to use for THIS turn only. The server honors
          this when present and falls back to the agent's configured
          `model` (and then to the active session's default) when
          absent. Empty string is treated the same as absent.
        example: "z-ai/glm-5-turbo"
      workspace_id:
        type: string
        minLength: 1
        maxLength: 128
        description: >
          Active workspace this chat belongs to (M4 workspace→turn binding).
          When the user sends a message from a workspace chat, the SPA sets
          this so the server tags the session with the workspace and any task
          the agent creates during the turn (task_create / delegation) lands on
          THIS workspace's board instead of the agent's default workspace.
          Stamped onto the session meta on first use; absent for the global
          (non-workspace) chat, where created tasks fall back to the default
          workspace.
        example: "01JXDEFAULT000000000000001"
      workspace_setup_kickoff:
        type: boolean
        description: >
          Retired client kickoff marker (omnipus-system-agent K9, FR-047).
          The server is the only producer of the workspace-setup offer: right
          after a workspace is created with an empty team it posts the offer
          into Omnipus's existing main chat and clears that workspace's
          `setup_pending` exactly once. A client frame that carries this key
          is refused with an error frame and has no other effect — true is
          refused as a client kickoff ("workspace setup is started by the
          server when a workspace is created; a client kickoff is refused",
          with session_id echoed only when the frame carried one), and any
          other value, false included, is refused as malformed. Absent for
          ordinary messages.
        example: true
  workflow_start:
    $ref: './WorkflowStart.yaml'
    description: >
      Spec omnipus-system-agent K8 (FR-012). Optional target data naming the
      workflow (W1 / W18) and the target workspace the user picked on a
      screen. Data only, never an instruction.
