type: object
description: Per-model token breakdown within a session or usage summary.
required:
  - total
properties:
  in:
    type: integer
    minimum: 0
    description: >
      Uncached input (prompt) tokens for this model, as reported by the provider.
      Populated on the assistant-turn write path. Entries written before the
      provider split was recorded carry 0 here with the whole turn total in
      total, so a 0 means "not recorded", not "no input tokens".
    example: 820
  out:
    type: integer
    minimum: 0
    description: >
      Output (completion) tokens for this model, as reported by the provider.
      Populated on the assistant-turn write path. Entries written before the
      provider split was recorded carry 0 here with the whole turn total in
      total, so a 0 means "not recorded", not "no output tokens".
    example: 180
  cache_read:
    type: integer
    minimum: 0
    description: >
      Cache-read tokens (served from KV cache) for this model. Additive to
      total alongside in and out, matching the provider's own usage
      accounting (total = in + out + cache_read + cache_write) — NOT a
      subset of total.
    example: 150
  cache_write:
    type: integer
    minimum: 0
    description: >
      Cache-write tokens (written into a new cache entry) for this model.
      Additive to total alongside in and out — see cache_read's description.
    example: 25
  total:
    type: integer
    minimum: 0
    description: >
      Authoritative total tokens recorded for this model, as reported by the
      provider. Additive: total = in + out + cache_read + cache_write once
      the provider's input/output split has been recorded on an entry (a
      non-zero in and/or out). Entries predating that split carry 0 in both
      in and out while total still reflects the full turn (out was not yet
      split from cache/completion), so always read total directly rather
      than reconstructing it from the other fields.
    example: 1000
