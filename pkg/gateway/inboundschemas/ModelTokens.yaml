type: object
description: Per-model token breakdown within a session or usage summary.
required:
  - total
properties:
  in:
    type: integer
    minimum: 0
    description: >
      Uncached input (prompt) tokens for this model, as reported by the provider.
      Populated on the assistant-turn write path. Entries written before the
      provider split was recorded carry 0 here with the whole turn total in
      total, so a 0 means "not recorded", not "no input tokens".
    example: 820
  out:
    type: integer
    minimum: 0
    description: >
      Output (completion) tokens for this model, as reported by the provider.
      Populated on the assistant-turn write path. Entries written before the
      provider split was recorded carry 0 here with the whole turn total in
      total, so a 0 means "not recorded", not "no output tokens".
    example: 180
  cache_read:
    type: integer
    minimum: 0
    description: >
      Cache-read tokens (served from KV cache) for this model. A SUBSET of total,
      not additive to it.
    example: 150
  cache_write:
    type: integer
    minimum: 0
    description: >
      Cache-write tokens (written into a new cache entry) for this model. A SUBSET
      of total, not additive to it.
    example: 25
  total:
    type: integer
    minimum: 0
    description: >
      Authoritative total tokens recorded for this model. cache_read/cache_write
      are a subset of total, NOT additive — do not reconstruct total as
      in + out + cache_read + cache_write. Always prefer total over summing the
      components: entries predating the provider input/output split carry 0 in
      both in and out while total is correct.
    example: 1000
