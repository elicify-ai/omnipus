type: object
description: Per-model token breakdown within a session or usage summary.
required:
  - total
properties:
  in:
    type: integer
    minimum: 0
    description: >
      Uncached input tokens for this model. On the assistant-turn write path this
      stays 0 (the full turn total is recorded directly in total); it is only
      populated via the UpdateStats delta path.
    example: 0
  out:
    type: integer
    minimum: 0
    description: >
      Output-side tokens for this model. On the assistant-turn write path this
      stays 0 (per-model accounting records the authoritative total directly).
    example: 0
  cache_read:
    type: integer
    minimum: 0
    description: >
      Cache-read tokens (served from KV cache) for this model. A SUBSET of total,
      not additive to it.
    example: 150
  cache_write:
    type: integer
    minimum: 0
    description: >
      Cache-write tokens (written into a new cache entry) for this model. A SUBSET
      of total, not additive to it.
    example: 25
  total:
    type: integer
    minimum: 0
    description: >
      Authoritative total tokens recorded for this model. cache_read/cache_write
      are a subset of total, NOT additive — do not reconstruct total as
      in + out + cache_read + cache_write.
    example: 1000
