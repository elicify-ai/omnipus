title: VersionResponse
description: >
  Response from GET /api/v1/version. Returns build identity information.
  Used by the frontend to detect version drift and show "New version available"
  prompts (issue #110). No authentication required.
type: object
required:
  - version
  - build_sha
additionalProperties: false
properties:
  version:
    type: string
    description: Omnipus gateway version string (e.g. "0.1.0" or "dev").
    example: "0.1.0"
  build_sha:
    type: string
    description: >
      VCS revision SHA embedded at build time via debug.ReadBuildInfo().
      Value is "dev" when built outside a version-controlled tree or when
      vcs.revision is not set (e.g. go run).
    example: "abc1234def5678"
