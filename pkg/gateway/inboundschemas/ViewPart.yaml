title: ViewPart
description: >
  One drawn element of a saved view's part stack
  (view-kinds-design-2026-09-03 §2.2, §4).

  A view used to be ONE flat layout, and nothing composed. A financial report
  is a figures row plus a grouped table with subtotals plus an aging
  cross-table; a performance report is figures plus a chart plus a
  worst-offenders table. Neither fits "one layout", so all 69 views in the
  founder's imported vault were flat tables that totalled nothing.

  PARTS ARE NOT AN AUTHORING SURFACE. The agent picks one of the eight named
  view KINDS (ViewDef.kind); the composer emits the part stack that kind
  stands for, and the renderer walks it. Free part composition was considered
  and deliberately left out (design §2.3): it is untestable, and the raw
  `write_view` path already covers the tail.

  THE BINDING FIELDS ARE OPTIONAL HERE AND REQUIRED BY THE PART. This schema
  cannot say "a chart needs a date AND a number" without a per-part oneOf that
  oapi-codegen would inline as eight anonymous structs. The requirement table
  lives in the composer's gate G1, which refuses by NAME — "board needs an
  enum with at most 8 values; `status` has 26" — and that refusal is the
  surface an agent actually reads. What this schema does enforce is that a
  binding, when present, is a real non-empty property name: the loader refuses
  a blank one rather than rendering a part bound to nothing.
type: object
additionalProperties: false
required:
  - part
properties:
  part:
    type: string
    enum:
      - table
      - list
      - tiles
      - columns
      - calendar
      - figures
      - chart
      - crosstab
    x-enum-varnames:
      - ViewPartPartTable
      - ViewPartPartList
      - ViewPartPartTiles
      - ViewPartPartColumns
      - ViewPartPartCalendar
      - ViewPartPartFigures
      - ViewPartPartChart
      - ViewPartPartCrosstab
    description: >
      Which element this draws. Eight, and the list is closed.


      "table" — rows by columns. "list" — a name and one detail per row.
      "tiles" — a grid keyed on an image property. "columns" — status columns,
      i.e. a board, keyed on an enum property. "calendar" — a month grid keyed
      on a date property. "figures" — a headline row of numbers. "chart" — a
      line or bar over time, needing a date and a number. "crosstab" — rows by
      columns with aggregated cells, needing two group properties and a number.


      A value outside this set is a LOAD REJECTION, not a part that renders as
      a table. That is the same rule `layout` already carries and for the same
      measured reason: an unrecognised layout that fell back to a table scored
      CLEAN under the parity criterion while silently losing what the view
      actually asked for.
    example: figures
  number:
    type: string
    minLength: 1
    description: >
      The number property this part totals or plots. Required in practice by
      `figures`, `chart` and `crosstab`; meaningless on the others.


      If the property declares a companion unit (PropertyDef.unit_property),
      every total this part draws is computed ONCE PER UNIT VALUE and never
      across units (design §3 G2).
    example: amount
  unit:
    type: string
    minLength: 1
    description: >
      The companion unit property of `number`, named explicitly so the part
      records which pairing it was composed against.


      IT IS NEVER INFERRED. Pairing any number with any nearby enum works on
      invoices and is wrong the first time a record holds two amounts, which is
      why the pairing is declared on the record type (PropertyDef.unit_property)
      and merely restated here. A `unit` naming a property that is not the
      declared companion of `number` is the composer's to refuse.
    example: currency
  date:
    type: string
    minLength: 1
    description: >
      The date property this part lays out or plots against. Used by
      `calendar` and `chart`.
    example: due_date
  image:
    type: string
    minLength: 1
    description: The file/image property `tiles` draws its grid from.
    example: cover
  choice:
    type: string
    minLength: 1
    description: >
      The enum property `columns` draws its board columns from. The composer's
      gate G1 additionally requires it to hold at most 8 values — a board with
      26 columns is not a board.
    example: status
  aggregate:
    description: >
      The reduction `figures` and `crosstab` apply to `number`. Omitted means
      the part draws no aggregate of its own.
    allOf:
      - $ref: "./ViewPartAggregate.yaml"
    x-go-type: ViewPartAggregate
  grouping:
    type: array
    maxItems: 2
    description: >
      Grouping keys for this part, outermost first, each carrying its own
      direction — the SAME shape as ViewDef.grouping, deliberately, so a part's
      grouping and a view's grouping can never mean two different things.


      Omitted means this part declares NO grouping of its own, and the view's
      own `grouping` is what stands. The loader never copies one into the
      other: a part is returned exactly as its file wrote it, so a reader can
      always tell a part that asked for something from a part that inherited
      it.
    items:
      $ref: "./ViewGroupBy.yaml"
      x-go-type: ViewGroupBy
  subtotals:
    type: object
    description: >
      Per-group subtotal row, keyed by PROPERTY name, valued by the reduction
      to apply to it (design §4's `subtotals: {amount: sum}`).


      PER GROUP AND PER UNIT. A subtotal over a number carrying a companion
      unit is drawn once per unit value under G2, with the rows whose unit is
      missing shown, excluded and counted separately under G3 — never one
      combined figure, because a combined figure across currencies is a wrong
      number that looks right.
    additionalProperties:
      $ref: "./ViewPartAggregate.yaml"
      x-go-type: ViewPartAggregate
    example:
      amount: sum
  properties:
    type: array
    description: >
      Columns for the table-ish parts (`table`, `list`, `crosstab`), in this
      order. Omitted means this part names no columns of its own, and the
      view's own `properties` is what stands — which in turn, omitted, shows
      every declared property.


      Narrowing this changes what is RENDERED, never what is matched — the same
      rule ViewDef.properties carries, restated because a part-level column
      list is exactly where somebody would expect a filter to hide.
    items:
      type: string
      minLength: 1
    example: ["file.name", "client", "due_date", "amount"]
