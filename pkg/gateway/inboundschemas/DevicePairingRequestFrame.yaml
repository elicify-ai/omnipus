title: DevicePairingRequestFrame
description: >
  Server → client. Emitted when a remote device initiates a pairing request and
  needs operator approval. The SPA displays a pairing modal.
  The operator responds with a device_pairing_response frame.
  Fields map to the generated DevicePairingRequestFrame type in pkg/api/generated/.
type: object
required:
  - type
  - device_id
additionalProperties: false
properties:
  type:
    type: string
    const: device_pairing_request
  device_id:
    type: string
    minLength: 1
    description: Unique identifier for the device requesting pairing.
  fingerprint:
    type: string
    description: Device fingerprint for identity verification.
  pairing_code:
    type: string
    description: Human-readable pairing code to show in the UI for verbal confirmation.
  device_name:
    type: string
    description: Display name of the device (e.g., hostname or user-provided label).
  session_id:
    type: string
    description: >
      Optional session context. Absent for global pairing requests not tied to
      a specific session.
