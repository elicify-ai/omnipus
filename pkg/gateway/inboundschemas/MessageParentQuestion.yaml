type: object
title: MessageParentQuestion
description: >
  `message_parent` child tool call, `kind: question` (ADR-053 §5.1). An
  ordinary upward message: ADR-20261004 ("Steering commands: no person
  question", locked decision 6) removed the person-question pause — there
  is no `wait`/`authority`, the calling child is never parked, and no
  answer expiry exists. Counts toward the per-child unacked ceiling (D15,
  max 20 open question+blocker) — payload-only, see `MessageParentProgress`
  for the request/record split rationale.
required:
  - kind
  - text
additionalProperties: false
properties:
  kind:
    type: string
    enum:
      - question
    example: "question"
  message_id:
    type: string
    description: Optional child-supplied dedupe key.
    example: "sm_01J3ZQK8N2H8VXNRP5T7C9M4WK"
  text:
    type: string
    minLength: 1
    maxLength: 32768
    description: Untrusted question text.
    example: "Should I overwrite the existing config.json backup?"
  correlation_id:
    type: string
    description: >
      Optional child-supplied correlation id (server-generated when
      absent) that a subsequent `respond` will reference.
    example: "corr_01J3ZQK8N2H8VXNRP5T7C9M4WL"
