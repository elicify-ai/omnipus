title: RateLimitFrame
description: >
  Server → client (SEC-26). Notifies the SPA of a rate-limit denial so the
  chat UI can display an inline indicator. Global-scope events (e.g., daily cost
  cap) are broadcast to every connected client; agent/channel-scoped events are
  filtered by chatID on the server.
type: object
required:
  - type
  - session_id
  - scope
  - resource
  - policy_rule
  - retry_after_seconds
additionalProperties: false
properties:
  type:
    type: string
    const: rate_limit
  session_id:
    type: string
    description: Session that hit the rate limit (may be empty for global scope).
  scope:
    type: string
    enum:
      - agent
      - channel
      - global
    description: Scope at which the rate limit was applied.
  resource:
    type: string
    minLength: 1
    description: The resource that was rate-limited (e.g., a tool name or model ID).
  policy_rule:
    type: string
    minLength: 1
    description: The policy rule that triggered the rate limit.
  retry_after_seconds:
    type: number
    minimum: 0
    maximum: 86400
    description: Suggested back-off duration in seconds before retrying. Minimum 0 (no negative back-off); maximum 86400 (24 hours).
  agent_id:
    type: string
    description: Agent that triggered the rate limit.
  tool:
    type: string
    maxLength: 128
    description: Tool involved in the rate-limited call.

  seq:
    type: integer
    format: int64
    minimum: 1
    description: >-
      Per-session sequence number of this frame (#823 catch-up redesign). Strictly
      increasing and gap-free within the session, assigned by the gateway's per-session
      hub as the single chokepoint through which every session-scoped frame is published.
      Optional: absent on an unsequenced copy of this frame (for example a broadcast
      delivered to a tab that is not bound to this session) — the client only advances its
      per-session cursor for frames that carry seq. The client stores the highest seq it
      has applied per session and sends it back as since_seq on attach_session; frames at
      or below that cursor are ignored, which makes re-delivery idempotent.
