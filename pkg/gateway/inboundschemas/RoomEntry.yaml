title: RoomEntry
description: >
  One entry of a room transcript (spec omnipus-system-agent K26; FR-166).
  Group entries carry the authoring agent and the resolved addressees.
  Mirrored inline in contracts/asyncapi.yaml (components.schemas.RoomEntry)
  — keep both copies in sync by hand.
type: object
required:
  - id
  - room_id
  - seq
  - author
  - text
  - addressees
  - after_pause
  - deliveries
  - timestamp
additionalProperties: false
properties:
  id:
    type: string
    minLength: 1
    maxLength: 128
  room_id:
    type: string
    minLength: 1
    maxLength: 128
  seq:
    type: integer
    format: int64
    minimum: 1
    description: Position in the room transcript; strictly increasing.
  client_message_id:
    type: string
    minLength: 1
    maxLength: 128
    description: Echo of RoomMessageRequest.client_message_id for a person's entry.
  author:
    $ref: './RoomEntryAuthor.yaml'
  text:
    type: string
    maxLength: 65536
    description: >
      The message text. One group message size limit applies to a person's
      message and to an agent's answer (#1449 D24, D27): at most 65,536 UTF-8
      bytes (counted in bytes, not characters); an operator can lower this
      limit with session_messaging.steer_body, never raise it. maxLength
      states the same 65,536 maximum; the server counts the limit in UTF-8
      bytes, which is never less than the character count. May be empty
      when the entry carries attachments.
  attachments:
    type: array
    maxItems: 16
    items:
      $ref: './MediaPart.yaml'
    description: >
      Images and files of the entry (#1449 D3, FR-016, FR-020), in the order
      they were sent. Each part's url is the workspace media URL
      (/api/v1/media/workspace/<workspace id>/<id>). Absent means none. A
      file deleted later in the Library keeps its part here; fetching it then
      fails and the chat shows the file as unavailable (D26).
  addressees:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 128
    description: Resolved addressee agent ids. Never null.
  after_pause:
    type: boolean
    description: >
      True for an answer to work consumed before a /pause; such an answer
      never forwards its mentions (§6.11).
  deliveries:
    type: array
    items:
      $ref: './RoomDeliveryState.yaml'
    description: Per-member delivery states for this entry. Never null.
  timestamp:
    type: string
    format: date-time
