title: Mailbox
description: >
  One (agent, workspace) email mailbox account (M11). Email is a TOOL surface,
  not a conversational channel: a mailbox belongs to exactly one (agent,
  workspace) pair — an agent can hold a different mailbox in each workspace it
  belongs to (different roles, different inboxes), and several agents may each
  have mailboxes in the same workspace. The mailbox password is stored in the
  encrypted credential store and is NEVER returned by this endpoint — the
  `configured` flag reports whether a password is on file.
type: object
required:
- agent_id
- workspace_id
- enabled
- configured
additionalProperties: false
properties:
  agent_id:
    type: string
    description: ID of the agent that owns this mailbox.
    example: "mia"
  enabled:
    type: boolean
    description: >
      Whether the email tools (read_inbox, search_email, read_message,
      send_email, reply) are registered for the owning agent.
  workspace_id:
    type: string
    description: >
      ID of the workspace the mailbox surfaces in. Always present: a mailbox
      is addressed by its (agent, workspace) pair, so the server serializes
      this from the authoritative pair key — never from mutable state.
    example: "ws_my_workspace"
  imap_host:
    type: string
    description: IMAP server hostname (implicit TLS / IMAPS).
    example: "imap.example.com"
  imap_port:
    type: integer
    description: IMAP server port. Defaults to 993 when omitted.
    example: 993
  smtp_host:
    type: string
    description: SMTP server hostname.
    example: "smtp.example.com"
  smtp_port:
    type: integer
    description: SMTP server port. Defaults to 587 (STARTTLS); 465 selects implicit TLS.
    example: 587
  username:
    type: string
    description: The email address / login used for IMAP and SMTP authentication.
    example: "assistant@example.com"
  configured:
    type: boolean
    description: >
      True when a mailbox password is present in the credential store (the
      mailbox can authenticate). The password value itself is never returned.
  signature_html:
    type: string
    maxLength: 16384
    description: >
      Optional per-mailbox HTML signature (D2). Sanitized on save with the
      dedicated signature policy — operator HTML never ships raw into
      outbound mail. The plain-text signature part is derived at compose
      time and never stored. Absent or empty means no signature is applied.
      This is configuration, not mail content: storing it in config.json
      does not violate the no-local-mail-store rule (D6). A value longer
      than 16,384 characters is rejected with HTTP 400 on configure.
  sent_folder_name:
    type: string
    description: >
      Advanced override for the mailbox's Sent folder name. Empty (default)
      means the folder is auto-resolved by its standard name.
  drafts_folder_name:
    type: string
    description: >
      Advanced override for the mailbox's Drafts folder name. Empty (default)
      means the folder is auto-resolved by its standard name.
