title: CliValidateRequest
description: >
  Request body for POST /api/v1/system/cli-validate. A stateless check of a
  caller-supplied external CLI program, used by Check CLI in Settings ->
  Third-party agents: confirms the binary at cli_path actually runs and
  reports a version. It saves neither settings nor an agent. The shared
  program-file check runs first; the version handshake then runs on exactly
  the checked resolved pathname, with no second lookup, on Linux, macOS and
  Windows (runner.TestConnectionCheckedFile, the same checked-file handshake
  POST /api/v1/agents/{id}/runner/test uses).
type: object
required:
  - cli
  - cli_path
additionalProperties: false
properties:
  cli:
    $ref: './ExternalCli.yaml'
    x-go-type: ExternalCliTool
  cli_path:
    type: string
    maxLength: 4096
    description: >
      Filesystem path to the CLI binary to validate — either the detected
      prefill or an operator-entered override. An empty or whitespace-only
      value is classified "missing-binary" without a spawn attempt. Any other
      value is checked exactly as given, surrounding whitespace included, the
      same bytes Settings Save stores and every run checks; it must pass
      the program-file check (absolute, outside every agent-writable folder,
      a regular file; executable for the gateway user on Linux/macOS), else
      "path-not-allowed" and nothing is spawned.
    example: "/usr/local/bin/claude"
