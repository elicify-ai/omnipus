type: object
description: >
  The `api_key` variant of OnboardingCompleteRequest.provider (ADR-068,
  MAJ-014). Discriminated by `auth_method` following the ADR-034 inline
  oneOf mechanism; `api_key` is REQUIRED here and is not a property of the
  sign-in variant.
required:
  - auth_method
  - id
  - api_key
additionalProperties: false
properties:
  auth_method:
    type: string
    enum:
      - api_key
    description: Discriminator — this variant authenticates with an API key.
    example: api_key
  id:
    type: string
    minLength: 1
    maxLength: 64
    description: >
      Provider id (e.g. "anthropic", "openai", "openrouter", "gemini"). A
      catalog provider id, or — together with `endpoint` and `protocol` — the
      name of a custom endpoint. Anything else is rejected with 400.
    example: anthropic
  api_key:
    type: string
    minLength: 1
    description: API key for the provider. Stored encrypted (AES-256-GCM) in credentials.json.
    example: sk-ant-...
  model:
    type: string
    minLength: 1
    maxLength: 256
    description: >
      The model chosen for the first agent — the probe-validated pick from
      step 3, persisted as agents.defaults.default_model together with the
      provider id.
    example: claude-sonnet-4-6
  reasoning_effort:
    type: string
    maxLength: 32
    description: >
      Effort for the chosen model (effort-levels spec FR-067), persisted as
      agents.defaults.default_model.reasoning_effort in the completion's single
      configuration write, never on the provider row. null is refused.
  endpoint:
    type: string
    description: >
      Base URL, persisted as the provider entry's api_base. For a catalog
      provider: optional override of its base URL. For a custom endpoint (see
      `protocol`): required, the endpoint's base URL.
    example: https://llm.example.com/v1
  protocol:
    type: string
    enum:
      - openai-compatible
      - anthropic
    description: >
      Wire protocol of an operator-named custom endpoint (ADR-067 §3.2 item 3,
      clarification 2026-11-08, #1700). Send it only when `id` is NOT a catalog
      provider id: then `id`, `endpoint` (the base URL) and `protocol` together
      create a custom row, saved with custom=true, this protocol and endpoint
      as api_base; `model` is then required and `region` is refused. Must be
      absent for a catalog provider id (400 on field `id`). Omitted by older
      clients: the request then behaves exactly as before this field existed.
    example: openai-compatible
  region:
    type: string
    maxLength: 128
    description: >
      Issue #800 (Bedrock region contract): the selected region for a
      provider whose catalog entry carries `regions`
      (CatalogProvider.regions), persisted as the provider entry's `region`.
      Ignored for a provider whose catalog entry carries no `regions`.
    example: "eu-central-1"
