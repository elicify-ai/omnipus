title: RecordSort
description: >
  One sort key (ADR-068 D4, FR-010, §8 R-5).

  SORTING IS LEXICAL, and the SORT KEY IS THE FOLDED VALUE. An enum is no
  exception — there is no declared-position ordinal, and an author who wants a
  domain order writes it into the values: "1-lead", "2-qualified". The prefix
  sits in the operator's own file and does exactly what it looks like it does.

  Two clauses of R-5 a caller can rely on. The key is the FOLDED form, not the
  raw bytes, so "Won", "won" and "WON" — one value under case-insensitive
  matching — sort to one place instead of three while grouping collapses them
  into one group. TIES on the folded key break on RAW BYTE ORDER, so the order
  is TOTAL and byte-identical across runs and rebuilds. What renders is always
  the file's own spelling, never the sort key.
type: object
additionalProperties: false
required:
  - property
  - direction
properties:
  property:
    type: string
    minLength: 1
    description: The declared property to sort by, validated against the schema first (FR-023).
    example: "status"
  direction:
    type: string
    enum:
      - asc
      - desc
    x-enum-varnames:
      - RecordSortDirectionAsc
      - RecordSortDirectionDesc
    description: Ascending or descending, along the lexical order described above.
    example: "asc"
