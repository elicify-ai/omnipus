type: object
description: Returned on successful PATCH /users/{username}/role.
required:
  - username
  - role
additionalProperties: false
properties:
  username:
    type: string
    description: The affected user's login name.
    example: "alice"
  role:
    type: string
    enum:
      - admin
      - user
    description: >
      The new role. "user" is accepted for backward-compatible wire
      validation, but under the current single-user model this always reports
      "admin" regardless of what was requested on UserRoleChangeRequest (see
      rest_users.go's persistedRole).
    example: "user"
  requires_restart:
    type: boolean
    description: Present and true when hot-reload failed after the role change.
    example: false
  warning:
    type: string
    description: Human-readable explanation when requires_restart is true.
