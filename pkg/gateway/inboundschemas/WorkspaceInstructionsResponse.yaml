title: WorkspaceInstructionsResponse
description: >
  Response from GET /api/v1/workspaces/{id}/instructions. Returns the current
  content of the workspace's AGENT.md and the opaque SHA-256 revision of those
  bytes. An empty string means the file does not exist or has not been written
  yet; that empty state still has a revision.
type: object
required:
  - content
  - revision
additionalProperties: false
properties:
  content:
    type: string
    description: >
      Current content of the workspace's AGENT.md. Empty string when the file
      does not exist or has not been set yet.
    example: "Use TypeScript. Prefer functional components. Ship small PRs."
  revision:
    $ref: './ConfigurationRevision.yaml'
