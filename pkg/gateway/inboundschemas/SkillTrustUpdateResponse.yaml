title: SkillTrustUpdateResponse
description: >
  Response from PUT /api/v1/security/skill-trust.
  Returns save status and the now-active skill trust level.
type: object
required:
  - saved
  - requires_restart
  - applied_level
properties:
  saved:
    type: boolean
    description: True when the configuration was successfully persisted to disk.
    example: true
  requires_restart:
    type: boolean
    description: Always false — skill trust is hot-reloaded.
    example: false
  applied_level:
    type: string
    description: The skill trust level now active.
    enum:
      - block_unverified
      - warn_unverified
      - allow_all
    example: warn_unverified
  warning:
    type: string
    description: >
      Present when allow_all is selected — warns that hash verification is disabled.
    example: "skill_trust=allow_all disables hash verification — configure a trusted skills registry instead"
