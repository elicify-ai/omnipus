title: SecretRecipientDisplay
description: >
  Server-composed, value-free description of where a secret will be used
  (spec omnipus-system-agent K2; FR-065). Built by the server from the
  recorded recipient descriptor; a client never supplies it. `lines` are the
  display lines for the kind: endpoint (provider_key); transport + command
  or URL (mcp_env); channel instance + field (channel_credential); hosts +
  username + mailbox id (mailbox_password); workspace + agent + variable
  (agent_private); for unbound (a stored value with no recipient recorded)
  exactly the single fixed line "Stored in Settings; no recipient recorded".
  Mirrored inline in contracts/asyncapi.yaml
  (components.schemas.SecretRecipientDisplay) — keep both copies in sync by
  hand.
type: object
required:
  - kind
  - lines
additionalProperties: false
properties:
  kind:
    type: string
    enum:
      - provider_key
      - mcp_env
      - channel_credential
      - mailbox_password
      - agent_private
      - unbound
    description: Recipient kind.
  lines:
    type: array
    minItems: 1
    maxItems: 8
    items:
      type: string
      minLength: 1
      maxLength: 500
    description: Display lines, in order. Never null, never empty.
