title: MediaFrame
description: >
  Server → client. One or more media attachments generated by an agent tool
  (e.g., a browser screenshot, a file produced by a shell command). Emitted
  as a companion frame after the corresponding tool_call_result. The SPA
  renders the attachments inline in the assistant message bubble.
  IMPORTANT: parts MUST be an array (never null). The SPA iterates parts.map()
  directly — null would cause a runtime crash.
  Office-document preview (office-preview spec §5.2): a preview_document call's
  page thumbnails arrive as one frame per tool call with presentation
  "page_thumbnails", the producing tool_call_id and a preview record. The SPA
  groups media by (message, tool_call_id); frames without tool_call_id (for
  example browser screenshots) render inline exactly as before. Live
  (webchat SendMedia), replay and history producers emit the same projection.
type: object
required:
  - type
  - session_id
  - parts
additionalProperties: false
properties:
  type:
    type: string
    const: media
  session_id:
    type: string
    minLength: 1
    description: Session in which the media was produced.
  parts:
    type: array
    minItems: 0
    maxItems: 32
    items:
      $ref: MediaPart.yaml
    description: >
      Array of media attachments (never null). Non-empty in every case except
      one: it MAY be empty only when presentation is "page_thumbnails" and
      preview.outcome is "unavailable" (the person sees the persistent
      "page previews unavailable" card instead of thumbnails). The server
      guarantees this cross-field rule; JSON Schema here only enforces the
      array shape and the 32-part cap. Capped at 32 parts per frame to bound
      SPA render cost and payload size.
  tool_call_id:
    type: string
    minLength: 1
    description: >
      Id of the tool call that produced these media (the ToolCall.id of the
      transcript entry). Present on preview_document thumbnail frames, where it
      is the grouping key together with the message; a Retry
      (POST /sessions/{session_id}/previews/{tool_call_id}/retry) result arrives
      as a new frame carrying the same tool_call_id. Absent on frames that are
      not grouped (screenshots and other inline media).
  presentation:
    type: string
    enum:
      - inline
      - page_thumbnails
    default: inline
    description: >
      How the SPA presents the parts. "inline" (default when absent) is
      today's inline media rendering. "page_thumbnails" is a document-preview
      thumbnail group: the parts are pages in page order (MediaPart.page_number),
      navigation in the enlarged viewer stays inside the group, and per-image
      failure toasts are suppressed for this presentation only.
  preview:
    $ref: MediaPreview.yaml

  seq:
    type: integer
    format: int64
    minimum: 1
    description: >-
      Per-session sequence number of this frame (#823 catch-up redesign). Strictly
      increasing and gap-free within the session, assigned by the gateway's per-session
      hub as the single chokepoint through which every session-scoped frame is published.
      Optional: absent on an unsequenced copy of this frame (for example a broadcast
      delivered to a tab that is not bound to this session) — this seq is dedup state, never itself the resume cursor: the client's cursor is
      committed only by a completed catch-up (catch_up_complete) and is sent back as
      since_seq on attach_session (2026-10-26, architect ruling arch-q33 — an earlier
      sentence here described per-frame cursor advance, which was stale). Frames at
      or below that cursor are ignored, which makes re-delivery idempotent.
