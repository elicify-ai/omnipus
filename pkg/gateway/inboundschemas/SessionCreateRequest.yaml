type: object
description: Body for POST /sessions. Creates a new session for an agent.
additionalProperties: false
properties:
  agent_id:
    type: string
    description: >
      Agent ID that will own this session. Defaults to "main" when omitted.
      Must reference an existing agent (400 if not found).
    example: "jim"
  type:
    type: string
    enum:
      - chat
      - task
      - channel
    # Intentionally narrower than Session.type: "scheduled" is server-minted by a
    # fired schedule (NewScheduledSession), never client-created via POST /sessions.
    description: Session type. Defaults to "chat" when omitted.
    example: "chat"
