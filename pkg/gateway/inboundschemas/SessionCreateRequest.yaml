type: object
description: Body for POST /sessions. Creates a new session for an agent.
additionalProperties: false
properties:
  agent_id:
    type: string
    description: >
      Agent ID that will own this session. Defaults to "main" when omitted.
      Must reference an existing agent (400 if not found).
    example: "jim"
  type:
    type: string
    enum:
      - chat
      - task
      - channel
    # Intentionally narrower than Session.type: "scheduled" is server-minted by a
    # fired schedule (NewScheduledSession), never client-created via POST /sessions.
    description: Session type. Defaults to "chat" when omitted.
    example: "chat"
  workspace_id:
    type: string
    maxLength: 128
    description: >
      The workspace this session belongs to. Optional; omit it for a session
      that belongs to no workspace (the global/inbox chat), which is NOT the
      same as a default — an absent value stays absent and is never guessed at.

      Stamped straight onto the new session's meta, so a session created for a
      workspace chat carries its workspace from birth rather than from its
      first message. That gap is what ADR-075 FR-017 tripped over: the live
      browser panel reads the workspace off the attaching chat session's own
      meta, server-side, and the SPA's "Open browser" launcher creates its
      session here — with no workspace — before any message has been sent. An
      agent on more than one workspace's team was therefore refused (FR-033)
      and told to open the panel from a chat belonging to the workspace it
      meant, which is exactly where the click had come from.

      Must name a workspace that exists (400 otherwise). Membership is NOT
      checked here: the value is a preference, and every consumer that grants
      access on it re-checks membership itself — browser.ResolveBrowsingKeyForAgent
      honours it only when the agent really is on that workspace's team.
    example: "01M1H9JS5EHRYWDBM0BYA45NFM"
