title: MailboxListResponse
description: >
  All configured email mailbox accounts (M11). Cap-1 per workspace in 0.1.0,
  so the list is typically empty or a single entry. Returning a list (rather
  than a 404-on-absent single resource) lets the SPA learn "no mailbox is
  configured" without probing every agent's mailbox endpoint and generating
  console-visible 404s.
type: object
required:
- mailboxes
additionalProperties: false
properties:
  mailboxes:
    type: array
    description: Every configured mailbox, one entry per owning agent.
    items:
      $ref: ./Mailbox.yaml
