title: TokenFrame
description: >
  Server → client. A streaming token (partial LLM response text) for the given
  session. Multiple token frames are emitted during an agent turn; the SPA
  appends each token's content to the last assistant message bubble.
type: object
required:
  - type
  - session_id
  - content
additionalProperties: false
properties:
  type:
    type: string
    const: token
  session_id:
    type: string
    minLength: 1
    maxLength: 128
    description: Session this token belongs to.
  content:
    type: string
    maxLength: 65536
    description: Partial LLM response text to append. Maximum 64 KiB per token chunk.
  agent_id:
    type: string
    description: >
      Agent that produced this token. Identifies the origin agent for
      background/delegated sub-turns, where the client's active-agent
      session state would otherwise guess incorrectly.
  turn_id:
    type: string
    description: >-
      #823 catch-up redesign. Correlates this token with the turn that produced it. The
      client appends the token to the open bubble for this turn_id (creating one if none
      is open yet), rather than always appending to "the last assistant bubble" — the old
      rule breaks once a second tab or a delegated turn can interleave frames. Absent on
      frames emitted by the connection-scoped webchat Send fallback (no streamed text),
      which has no turn id and keeps the legacy "append to the current bubble" behaviour.
  message_id:
    type: string
    description: >-
      #823 catch-up redesign. Identifies the specific assistant message (bubble) this
      token belongs to, stable across a reconnect/catch-up. The same id is stamped on the
      persisted transcript entry, so a replayed or projected version of this message and
      its live tokens converge on one bubble instead of duplicating it.
  replace:
    type: boolean
    description: >
      Set only on a catch-up token: the frame's content REPLACES the open
      assistant bubble's content for this session instead of appending to it.
      The gateway emits it right after a reconnect when the in-flight turn's
      accumulated text may already be partly present on the client (the client
      applied some of that turn's tokens before the drop). Replacing rather
      than appending is what makes catch-up idempotent: applying the same
      catch-up token twice leaves the same text. Absent or false on ordinary
      streaming tokens, which append.
  seq:
    type: integer
    format: int64
    minimum: 1
    description: >-
      Per-session sequence number of this frame (#823 catch-up redesign). Strictly
      increasing and gap-free within the session, assigned by the gateway's per-session
      hub as the single chokepoint through which every session-scoped frame is published.
      Optional: absent on an unsequenced copy of this frame (for example a projection
      token sent inside a snapshot, which has no seq of its own) — the client only
      advances its per-session cursor for frames that carry seq. The client stores the
      highest seq it has applied per session and sends it back as since_seq on
      attach_session; frames at or below that cursor are ignored, which makes re-delivery
      idempotent.
