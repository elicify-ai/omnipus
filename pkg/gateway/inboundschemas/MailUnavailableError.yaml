title: MailUnavailableError
description: >
  Typed 503 body for a mail read that the gateway refused to dial:
  code=backoff (automatic poll during watcher backoff — carries the saved
  last error class and next_attempt_at) or code=busy (request queued past
  the per-mailbox concurrency cap beyond the request deadline — MIN-003).
  Shares error/code with ErrorResponse so generic handlers work unchanged.
type: object
additionalProperties: false
required:
  - error
  - code
properties:
  error:
    type: string
    description: Human-readable message, safe to display.
    example: "mailbox backing off; retrying at 12:34"
  code:
    type: string
    enum:
      - busy
      - backoff
    description: >
      Machine-readable discriminator. backoff = the automatic poll hit the
      watcher's backoff window; busy = the request queued past the
      per-mailbox concurrency cap beyond the request deadline (MIN-003).
      A client branches on it without string matching on the message.
  last_error_class:
    type: string
    enum:
      - timeout
      - dns
      - connect_refused
      - auth_failed
      - tls
      - folder_missing
      - server_error
    description: >
      Present when code=backoff — the watcher's saved upstream class (same
      closed enum as the 502 body's code field, MC-8).
  next_attempt_at:
    type: string
    format: date-time
    description: Present when code=backoff.
  reason:
    type: string
    enum:
      - pool_busy
      - account_busy
      - server_connection_limit
      - backoff
    description: >
      Safe refusal reason (mail-live-access-landing-order register row 7 —
      W0 is the single publisher; ADR-20261001 "Human Retry and upstream
      limits" row). pool_busy = the global eight-socket ceiling stayed
      exhausted past the bounded acquisition wait (distinct from an
      account-slot refusal — w1 spec §4.6). account_busy = the per-account
      two-slot work gate (the existing busy code's queue-timeout case).
      server_connection_limit = the server itself refused further
      connections and the response structurally established that limit —
      recognized only from the structural response, never promoted from
      unknown response text; the refused session is retired and the
      effective per-mailbox capacity for that server is reduced in-process.
      backoff = the watcher backoff gate. Present where applicable; absent
      = no more specific reason than code carries. Retry remains explicit
      and bounded: a human retry bypasses only backoff, never the
      semaphore, socket cap, TLS validation or mutation safeguards.
    example: "pool_busy"
