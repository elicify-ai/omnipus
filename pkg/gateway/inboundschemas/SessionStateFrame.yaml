title: SessionStateFrame
description: >
  Server → client (FR-052, FR-073, FR-081). One-shot frame emitted to each
  WebSocket connection immediately after authentication. Contains every
  pending tool approval (single-user model — no per-account scoping). The
  SPA reconciles its approval store against this frame on every WS reconnect.

  CRITICAL — nil-safety contract:
  pending_approvals MUST be an array (never null). The server coerces nil →
  []sessionStatePendingApproval{} before marshaling. The SPA calls
  frame.pending_approvals.map() directly — a null value would crash.
type: object
required:
  - type
  - user_id
  - pending_approvals
  - emitted_at
additionalProperties: false
properties:
  type:
    type: string
    const: session_state
  user_id:
    type: string
    description: >
      ID of the authenticated user. Empty string when the WS connection was
      established without a user context (e.g., dev-mode bypass).
  pending_approvals:
    type: array
    items:
      $ref: SessionStatePendingApproval.yaml
    maxItems: 1000
    description: >
      Snapshot of every pending tool approval. Always an array — never null.
      The server emits [] when no approvals are pending. Capped at 1000
      entries to bound server emit volume and SPA render cost.
  pending_asks:
    type: array
    items:
      $ref: AskUserQuestionCard.yaml
    maxItems: 64
    description: >
      askuserquestion-tool-spec v3 US-6 S1/FR-9 — snapshot of every PENDING
      AskUserQuestion card (global registry cap 64) so a reconnecting SPA
      re-hydrates its card + composer lock. Optional (older gateways omit
      it); absent/empty means no pending sets. Keep in sync by hand with
      contracts/asyncapi.yaml's inline SessionStateFrame.
  emitted_at:
    type: string
    format: date-time
    description: RFC 3339 timestamp of when the server computed this snapshot.
