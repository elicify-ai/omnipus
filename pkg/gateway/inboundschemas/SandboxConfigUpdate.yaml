type: object
description: >
  Partial-update body for PUT /security/sandbox-config.
  All fields are optional — only fields present in the request are updated.
  At least one field must be supplied (the server returns 400 otherwise).
  Flat fields take precedence over nested equivalents when both are present
  in the same request body.
  mode and allowed_paths are restart-gated
  (the response includes requires_restart=true when either changes).
  ssrf.allow_internal and shell_deny_patterns are hot-reloaded.
properties:
  mode:
    type: string
    enum:
      - 'off'
      - permissive
      - enforce
    description: >
      Kernel sandbox enforcement mode.
      "off" = no kernel enforcement (god-mode). "permissive" = log violations but
      allow. "enforce" = block violations. Restart-gated.
    example: "enforce"
  filesystem_model:
    type: string
    enum:
      - confined
      - open
    description: >
      Switch the ADR-062 filesystem model. "confined" restricts reads and
      execution to enumerated paths; "open" leaves both unrestricted apart from
      the secret set. Neither model changes what may be WRITTEN.

      Restart-gated, like `mode`: the running kernel profile was installed at
      boot and is not rebuilt in place, so the change is persisted and takes
      effect on the next start. Omit the field to leave the model unchanged.
    example: "confined"
  allow_network_outbound:
    type: boolean
    description: Allow agent tool calls to make outbound network connections.
    example: true
  allowed_paths:
    type: array
    items:
      type: string
    description: >
      List of host filesystem paths the agent is allowed to read/write.
      Restart-gated. Must be absolute paths; empty list clears all exceptions.
    example:
      - "/home/user/workspace"
  ssrf_enabled:
    type: boolean
    description: Enable SSRF (server-side request forgery) protection for HTTP tool calls.
    example: true
  ssrf_allow_internal:
    type: array
    items:
      type: string
    description: >
      Flat version of ssrf.allow_internal. Takes precedence when both are present.
      CIDR ranges or IP addresses the agent may reach despite SSRF blocking.
    example:
      - "10.0.0.1/32"
  ssrf:
    type: object
    description: Nested SSRF configuration sub-object. Flat fields take precedence.
    properties:
      allow_internal:
        type: array
        items:
          type: string
        description: CIDR ranges or IP addresses the agent may reach despite SSRF blocking.
        example:
          - "10.0.0.1/32"
  shell_deny_patterns:
    type: array
    items:
      type: string
    description: >
      Global fallback list of Go regexp patterns to block in shell commands.
      Per-agent custom_deny_patterns extend this list. Hot-reloaded.
    example:
      - "rm -rf /"
      - "curl.*169\\.254"
  workspace_path_guard:
    type: boolean
    description: >
      ADR-068 §6. Turns the IN-PROCESS bash workspace path guard on or off.
      Distinct from `mode`, which is the kernel sandbox — the two are separate
      boundaries and setting one has no effect on the other (UAT defect 002 was
      operators expecting otherwise). When true, a WRITE outside the agent's
      working directory needs an approved workspace mount; reads outside it are
      allowed either way. Restart-gated: it resolves into
      AgentDefaults.RestrictToWorkspace at boot. Ignored at runtime while
      OMNIPUS_AGENTS_DEFAULTS_RESTRICT_TO_WORKSPACE is set, which outranks it —
      see workspace_path_guard_env_override on the GET response.
    example: false
