type: object
description: >
  Request body for PUT /workspaces/{id}. Uses merge (partial-update) semantics —
  only fields present in the request body are updated; absent fields are unchanged.
required:
  - revision
properties:
  revision:
    $ref: './ConfigurationRevision.yaml'
  delegation:
    type: array
    description: Explicit replacement of the candidate graph. Omission preserves valid existing edges and applies the existing new-member seed rule; [] clears all edges.
    items:
      $ref: './WorkspaceDelegationEdge.yaml'
  name:
    type: string
    minLength: 1
    maxLength: 200
  description:
    type: string
    maxLength: 2000
  status:
    type: string
    enum: [active, archived]
    description: Archive or restore a workspace.
  pinned:
    type: boolean
  pin_order:
    type: integer
  core_team:
    type: array
    items:
      type: string
  member_configs:
    type: object
    additionalProperties:
      $ref: ./WorkspaceMemberConfig.yaml
    description: >
      Per-member (agentId → config) heartbeat settings. Merge semantics: when
      present, replaces the config for each listed agent and garbage-collects
      entries for agents no longer on the core team. session_id is server-managed
      (set at heartbeat-enable time) and ignored on input.
additionalProperties: false
minProperties: 2
