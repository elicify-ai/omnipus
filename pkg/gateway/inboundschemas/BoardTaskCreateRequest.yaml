type: object
required:
  - name
properties:
  name:
    type: string
    minLength: 1
    maxLength: 200
  description:
    type: string
    maxLength: 2000
  status:
    $ref: './GTDBoardTaskStatus.yaml'
  project_id:
    type: string
  agent_id:
    type: string
  prompt:
    type: string
    maxLength: 10000
  priority:
    type: integer
    minimum: 1
    maximum: 5
  milestone_id:
    type: string
