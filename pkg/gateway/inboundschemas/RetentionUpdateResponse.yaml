title: RetentionUpdateResponse
description: >
  Response from PUT /api/v1/security/retention.
  Returns save status and the currently active retention settings.
type: object
required:
  - saved
  - requires_restart
  - session_days
  - disabled
properties:
  saved:
    type: boolean
    description: True when the configuration was successfully persisted to disk.
    example: true
  requires_restart:
    type: boolean
    description: Always false — retention config is hot-reloaded.
    example: false
  session_days:
    type: integer
    minimum: 0
    description: Number of days to retain session logs. 0 = system default (90 days).
    example: 30
  disabled:
    type: boolean
    description: When true, retention sweeps are disabled and session logs are kept forever.
    example: false
