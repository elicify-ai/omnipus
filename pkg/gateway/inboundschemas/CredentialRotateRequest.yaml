title: CredentialRotateRequest
description: >
  Request body for POST /api/v1/credentials/rotate. Re-encrypts the entire
  credential vault under a new passphrase-derived key (Argon2id). Sensitive
  change. In the core edition (local auth mode) the request must carry a re-auth consent token in the X-Reauth-Token header — call POST /api/v1/auth/reauth first (Spec-6 FR-12.2); in the desktop and hosted editions (platform auth mode) the SPA confirms the change with the operator before sending and the wire guard is the authenticated session (ADR-0008 ruling 6).
type: object
required:
  - new_passphrase
additionalProperties: false
properties:
  new_passphrase:
    type: string
    minLength: 1
    description: New passphrase used to derive the new vault key. Must not be empty.
    example: "correct-horse-battery-staple"
