title: CommandRule
description: >
  One ADR-092 D3 operator shell command rule (sandbox.command_rules in
  config.json). Every rule names a program (`binary`) and, optionally, the
  leading argument words it applies to (`arg_prefix`). Rules are evaluated
  for every bash call in every mode, including God Mode. When several rules
  match the same command part, the strictest wins regardless of how
  specific each rule is: deny beats ask beats allow. A chained command
  (`a && b`, `a | b`, `a; b`) is split into its parts and each part must
  clear on its own. `binary` is matched against the program the command
  actually resolves to on the child's PATH (resolve-and-verify, ADR-092
  FR-040), never against raw command text, so a look-alike executable
  earlier on PATH does not satisfy an allow rule for the real one. On
  Windows the rule matches the whole command exactly (FR-041): no
  chained-part splitting, and `arg_prefix` must equal the full argument
  text. Rules bind to a command's leading program only; they do not see
  through interpreters (`sh -c '...'`, `xargs`, `find -exec`).
type: object
required:
  - action
  - binary
additionalProperties: false
properties:
  action:
    type: string
    enum:
      - allow
      - ask
      - deny
    description: >
      allow — run the matched command without a prompt, even when bash's
      tool policy is "ask". ask — always show the approval dialog for the
      matched command, even when bash's tool policy is "allow". deny —
      refuse the matched command outright, in every mode including God
      Mode.
    example: deny
  binary:
    type: string
    minLength: 1
    maxLength: 4096
    description: >
      The program the rule applies to: a bare command name (`git`,
      resolved on PATH) or an absolute path (`/usr/bin/git`). Must not
      contain whitespace or shell metacharacters.
    example: git
  arg_prefix:
    type: string
    maxLength: 4096
    description: >
      Optional leading argument words, matched whole-word: `run test`
      matches `npm run test -v` but not `npm run testfoo`. Omitted or empty
      means the rule applies to every invocation of `binary`.
    example: push
