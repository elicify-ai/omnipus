title: RoomMemberStateFrame
description: >
  Server → client (spec omnipus-system-agent K27, K45; FR-201, FR-213). A
  member's delivery state changed. THIS FILE EXISTS for the Constraint #8
  5-step process and the pkg/gateway/inboundschemas/ sync — the GENERATING
  copy is the inline schema in contracts/asyncapi.yaml. Keep both copies in
  sync by hand. Landing 1, WU-15 produces it.
type: object
required:
  - type
  - room_id
  - seq
  - delivery
additionalProperties: false
properties:
  type:
    type: string
    const: room_member_state
  room_id:
    type: string
    minLength: 1
    maxLength: 128
  seq:
    type: integer
    format: int64
    minimum: 1
  delivery:
    $ref: './RoomDeliveryState.yaml'
