title: ValidateTokenResponse
description: >
  Response from GET /api/v1/auth/validate. Confirms the current bearer token
  is valid and returns the associated user's role.
type: object
required:
  - username
  - role
properties:
  username:
    type: string
    description: The authenticated user's login name.
    example: "admin"
  role:
    type: string
    enum:
      - admin
      - user
    description: The RBAC role of the authenticated user.
    example: "admin"
