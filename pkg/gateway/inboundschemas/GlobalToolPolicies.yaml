title: GlobalToolPolicies
description: >
  Global tool policy configuration returned by GET /api/v1/security/tool-policies
  and accepted by PUT /api/v1/security/tool-policies.
type: object
required:
  - policies
additionalProperties: false
properties:
  policies:
    type: object
    description: >
      Complete per-tool policy map. Every static builtin tool name (the full
      catalog: general + browser + system.*-legacy-named sysagent tools) MUST
      be present as an explicit, literal key with an "allow"/"ask"/"deny"
      value — this is not a sparse override set with a fallback default.
      There is no default_policy field; coverage is enforced by hard
      validation at boot and at every write, never a silent runtime default.
      Never null — always the full map.
    additionalProperties:
      type: string
      enum:
        - allow
        - ask
        - deny
    example:
      bash: ask
      browser_evaluate: deny
