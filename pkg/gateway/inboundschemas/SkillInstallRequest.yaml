title: SkillInstallRequest
description: >
  Request body for POST /api/v1/skills/install. Exactly one source is required:
  a marketplace slug, or the opaque media ref returned as UploadedFile.ref for
  an authorized local .md/.zip upload. Replacing an installed skill requires its
  revision; an omitted revision requires target absence under the authoritative
  installation lock. version applies only to marketplace slug installs.
type: object
additionalProperties: false
oneOf:
  - required: [slug]
    not:
      required: [upload_id]
  - required: [upload_id]
    not:
      required: [slug]
properties:
  replace_local_changes:
    type: boolean
    description: Required true to replace an installed skill whose has_local_changes is true. Absent means false.
  revision:
    $ref: './ConfigurationRevision.yaml'
  slug:
    type: string
    minLength: 1
    maxLength: 128
    pattern: '^[a-z0-9][a-z0-9._-]*$'
    description: Slug of the skill to install from the ClawHub registry.
    example: "web-search"
  upload_id:
    type: string
    minLength: 1
    maxLength: 512
    description: >
      Opaque media ref returned in UploadedFile.ref for a caller-authorized
      uploaded .md SKILL.md file or bounded .zip skill package. Filesystem paths
      and UploadedFile.path values are not accepted.
  version:
    type: string
    maxLength: 64
    description: >
      Optional version to pin. When omitted the latest published version is
      installed.
    example: "1.4.0"
  category:
    $ref: './SkillCategory.yaml'
    x-go-type: SkillCategory
    description: >
      Skills & Tools spec C-5. The category stored with the installed skill.
      Absent: the skill file's metadata.category when it is one of the
      values, else uncategorised. Never written into the skill file.
      Ignored by POST /skills/install/review (the review returns
      suggested_category instead).
  review_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      Skills & Tools spec C-13. The review (from POST /skills/install/review)
      to publish. With review_id the server publishes exactly the staged
      folder of that review, never a fresh download; slug or upload_id
      must still name the same source the review staged. Current revision
      differs from the reviewed one, or the source differs → 409 "The
      skill changed after review. Review it again."; expired → 410 "This
      review expired. Open the skill again to review it." Idempotent per
      review: while publishing → 202 with SkillInstallReviewStatus; after
      installed → 200 with the same result and no second publish; after
      failed, expired or cancelled → the same terminal answer again.
      Refused (400) by POST /skills/install/review itself. Required for an
      unverified skill while skill trust is ask (without it → 409, C-3).
    example: rev_7f3a9c
