title: ToolApprovalResponse
description: >
  Response from POST /api/v1/tool-approvals/{approval_id}.
  Confirms that the approval action was processed.
type: object
required:
  - approval_id
  - action
  - status
properties:
  approval_id:
    type: string
    description: The approval ID that was resolved.
    example: appr_abc123
  action:
    type: string
    description: >
      The action that was applied. Echoes the request action (ADR-092 D4),
      including "allow" (approve-and-remember, renamed from "always").
    enum:
      - deny
      - allow_once
      - allow
      - cancel
    example: allow_once
  scope:
    type: string
    enum:
      - exact
      - prefix
    description: >
      Echoes the request's `scope` (ADR-092 D4/FR-024). Present only when
      action is "allow" AND the resolved approval was a D3/D4 command grant
      — omitted for a D7/D8 path-widening or network-widening grant, and
      omitted when action is not "allow".
    example: exact
  status:
    type: string
    description: Result status. Always "ok" when the action was accepted.
    enum:
      - ok
    example: ok
  grant_recorded:
    type: boolean
    description: >
      Present only when action is "allow". True when the grant was
      stored — a session command grant (scope: exact/prefix), or the
      pre-flight escalation's own path-widening/network-widening grant when
      this approval resolved a D7/D8 escalation instead of an ordinary
      tool-approval-required frame. False means this call was approved
      once, but the next identical call (or the next command needing the
      same widening) will ask again — the grant did not stick (missing
      session, agent, or tool identity on the approval).
