title: ToolApprovalResponse
description: >
  Response from POST /api/v1/tool-approvals/{approval_id}.
  Confirms that the approval action was processed.
type: object
required:
  - approval_id
  - action
  - status
properties:
  approval_id:
    type: string
    description: The approval ID that was resolved.
    example: appr_abc123
  action:
    type: string
    description: >
      The action that was applied. Echoes the request action, including
      "always" (approve-and-remember).
    enum:
      - approve
      - deny
      - cancel
      - always
    example: approve
  status:
    type: string
    description: Result status. Always "ok" when the action was accepted.
    enum:
      - ok
    example: ok
  grant_recorded:
    type: boolean
    description: >
      Present only when action is "always". True when the standing Always
      Allow grant was stored. False means this call was approved once, but
      the next identical call will ask again — the grant did not stick
      (missing session, agent, or tool identity on the approval).
