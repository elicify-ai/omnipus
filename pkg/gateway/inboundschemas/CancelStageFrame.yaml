title: CancelStageFrame
description: >
  Server → client (B3). Cancel progress notification sent by the gateway after
  the SPA sends a cancel frame. Three stages drive the progressive Stop-button
  label transition.
  NOTE: The field is "stage" (not "status") — see parallel gateway fix. The SPA
  validates stage values and drops frames with any value not in:
  {graceful, hard, detached}.
type: object
required:
  - type
  - session_id
  - stage
additionalProperties: false
properties:
  type:
    type: string
    const: cancel_stage
  session_id:
    type: string
    minLength: 1
    description: Session whose cancel state is being updated.
  stage:
    type: string
    enum:
      - graceful
      - hard
      - detached
    description: >
      graceful — cancel request acknowledged; agent is completing the current
                 tool call and will stop at the next safe checkpoint.
      hard     — graceful deadline expired; the agent turn is being force-killed.
      detached — the session has been detached from the running turn; the SPA
                 can now treat the session as idle.
      The SPA validates this field via isValidFrame() and drops frames with any
      other value (B3 fix for unknown-stage render crashes).

  seq:
    type: integer
    format: int64
    minimum: 1
    description: >-
      Per-session sequence number of this frame (#823 catch-up redesign). Strictly
      increasing and gap-free within the session, assigned by the gateway's per-session
      hub as the single chokepoint through which every session-scoped frame is published.
      Optional: absent on an unsequenced copy of this frame (for example a broadcast
      delivered to a tab that is not bound to this session) — the client only advances its
      per-session cursor for frames that carry seq. The client stores the highest seq it
      has applied per session and sends it back as since_seq on attach_session; frames at
      or below that cursor are ignored, which makes re-delivery idempotent.
