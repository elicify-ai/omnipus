title: RecordWriteRequestCreate
description: >
  CREATE one record: a new note at `path`, carrying a server-minted
  identifier (ADR-068 D14, FR-036, FR-040 to FR-044).

  THE CALLER SAYS `mode: create`. It is not inferred from the absence of
  `id`. The flat shape this replaced required only `type` and `properties`
  and left `id`, `path` and `version_token` as three independent optionals,
  so a caller that MEANT to update and omitted `id` — a bug, a dropped
  field, a response shape that changed — was silently reinterpreted as a
  create: it wrote a duplicate note, discarded the version token it had
  carefully supplied, and returned success. The two operations differ in
  what they do to a vault, so the caller declares which one it wants and a
  mistake is a 400 instead of a second note nobody asked for.

  `id` AND `version_token` ARE NOT ACCEPTED HERE (`additionalProperties:
  false`), and that is the half that makes the split worth having. A create
  has no prior version to compare, so a `version_token` sent with one could
  only ever be ignored — and a caller that sent one believed it was
  protected against a concurrent write when it was not. Sending either field
  on this variant is a schema violation, named in the 400, never dropped.

  A write is a SPLICE, never a re-serialisation. Comments, key order, blank
  lines and quoting style survive, and the file is byte-identical outside the
  patched span (FR-041). This is not a nicety: the vault is simultaneously a
  human's working notes, and a writer that re-serialises YAML degrades it a
  little on every touch until the operator stops trusting the agent.

  A write that violates the schema is REJECTED with the expected shape named,
  and no note is created (FR-042). Nothing is half-written.

  RELATIONS AND PERSON PROPERTIES ARE NOT WRITABLE HERE. They are modified
  through RelationWriteRequest's three explicit verbs (FR-045), because a
  read-then-write round trip that silently replaces a relation list is how the
  incumbent deletes relations and returns success.

  Derived values are never written into frontmatter (D9, FR-046) — a request
  naming a derived property is rejected, not honoured.
type: object
additionalProperties: false
required:
  - mode
  - type
  - path
  - properties
properties:
  mode:
    type: string
    enum:
      - create
    description: >
      Discriminator. Must be exactly "create" for this variant.
    example: "create"
  type:
    type: string
    minLength: 1
    description: The record type being created. Always required, on create and update alike.
    example: "company"
  path:
    type: string
    minLength: 1
    description: >
      Vault-relative path of the note to create. REQUIRED here — a create has
      to put the note somewhere, and the server never invents a location. A
      note already at this path is refused (the create is an O_EXCL create,
      not an overwrite), which is an ordinary caller-fixable outcome rather
      than a server fault.
    example: "CRM/Companies/Acme Ltd.md"
  properties:
    type: array
    minItems: 1
    description: >
      The properties to write, and only those. An entry whose `values` array
      is empty CLEARS that property (D3.2) — on a create that is a property
      the new note simply will not carry. A write of a list into a scalar
      property, or of a value outside a closed enum, is rejected with the
      expected shape named (FR-006, FR-011, FR-042).

      The record's `type` and `id` are seeded by the server and cannot be
      named here (ADR-068 D1/D7): writing through the identity keys would
      rename the record, and clearing one would leave it unreachable through
      every record door.
    items:
      $ref: "./RecordPropertyValue.yaml"
      x-go-type: RecordPropertyValue
