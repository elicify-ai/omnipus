title: ProviderUpdateRequest
description: >
  Request body for PUT /api/v1/providers/{id}. Adds or updates an LLM provider
  configuration. On new providers, api_key is required. On existing providers,
  api_key may be omitted to keep the current key.
type: object
additionalProperties: false
properties:
  protocol:
    type: string
    enum:
      - openai-compatible
      - anthropic
      - google
      - ollama
      - cli
    description: >
      Wire protocol to use (ADR-067 FR-013/FR-014). For a catalog provider:
      optional; absent → the catalog's primary; a protocol the provider does
      not offer → 400. For a custom row (id not in the catalog): required and
      restricted to openai-compatible | anthropic (400 otherwise).
    example: "openai-compatible"
  auth_method:
    type: string
    enum:
      - api_key
      - sign_in
    description: >
      Auth method for this row (ADR-068). Absent → api_key. sign_in is accepted
      only for providers whose catalog auth_methods include it (400 otherwise)
      and must not be combined with api_key.
    example: "api_key"
  api_base:
    type: string
    maxLength: 2048
    description: >
      Explicit base URL. Required for a custom row; optional override for a
      catalog provider (wins over the catalog row). SSRF-checked.
    example: "https://my-proxy.example.com/v1"
  api_key:
    type: string
    description: >
      API key for the provider. Stored encrypted (AES-256-GCM) in
      credentials.json. Required when adding a new provider; optional when
      updating an existing one (omit to leave the current key unchanged).
    example: "sk-abc123"
  model:
    type: string
    description: >
      Default model to use for this provider. Defaults to "default" when
      not specified on new providers.
    example: "gpt-4o"
  models:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 256
    maxItems: 500
    description: >
      User-supplied catalogue of model slugs for a provider that does NOT expose
      a live /models endpoint (custom / unknown OpenAI-compatible gateways). When
      present, these slugs replace the provider's stored catalogue and constrain
      the model picker. Ignored for providers WITH a live endpoint
      (has_models_endpoint=true), whose catalogue is fetched from upstream. Omit
      to leave the existing list unchanged; send an empty array to clear it.
    example:
      - "my-gateway/llama-3.3-70b"
      - "my-gateway/mixtral-8x7b"
