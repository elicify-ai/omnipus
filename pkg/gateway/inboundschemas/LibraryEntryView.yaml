title: LibraryEntryView
description: >
  Per-entry facts about a `.view` file, surfaced directly on the
  `LibraryEntry` so the tree can show its kind icon and the preview can
  open it without a second round trip (library-views-anywhere-spec
  D-CONTRACT, US-4). PRESENT IFF `is_view` is true on the parent entry —
  a single presence check replaces what would otherwise be six-to-nine
  independent "present iff inside a knowledge base" markers (R2-OBS-001),
  and mirrors `mount`'s own pattern of nesting related optional facts on
  `LibraryEntry` (the `LibraryEntryMount.yaml` precedent).

  A `.view` file outside every knowledge base never carries `is_view`
  (D-SCOPE, FD-1) and so never carries this object — it renders as a
  plain, unrunnable file (founder: "a view runs only inside a knowledge
  base").
type: object
additionalProperties: false
properties:
  kind:
    $ref: "./ViewKind.yaml"
    description: >
      The view's authored kind (`ViewDef.kind`), absent when the file
      does not declare one (legal under the schema — only `name` is
      required) or fails to parse. Never a fabricated default (EC-3).
  label:
    type: string
    description: >
      The view's `DisplayLabel()` — the human-readable label the Library
      tree shows without a second round trip. Absent when the file fails
      to parse.
  name:
    type: string
    minLength: 1
    description: >
      The view's authoritative `Def.Name`. Present iff the file parsed
      successfully AND `is_view` is true on the parent; absent whenever
      `rejection` is present (the only handle the preview has on a
      broken or duplicate-rejected view is `rejection_reason` and, for a
      duplicate, `conflict_paths`).
  collection_id:
    type: string
    description: >
      The opaque `kb_`-prefixed identifier of the ENCLOSING knowledge
      base (D-ADDRESS, R2-CRIT-003) — the same value
      `KnowledgeBaseViews.collection_id` carries for a `.base` file in
      the same collection, computed by the same `knowledgeCollectionID`
      function. The Library preview uses it together with `name` to
      call the existing `GET .../knowledge/view` endpoint directly,
      with no SPA-side enclosing-collection resolution step
      (BasePreview's own resolution path does not exist for non-`.base`
      entries, hence the round-2 contract addition).

      Present exactly when this object is present — D-SCOPE already
      guarantees an enclosing knowledge base at that point.
  rejection:
    $ref: "./ViewRejectionCode.yaml"
    description: >
      The loader's rejection code when the file is `is_view: true` but
      broken, oversize, or duplicate-rejected. Absent on a healthy view.
      When present, `rejection_reason` is also present, and — exactly
      when the code is `view_duplicate_name` — `conflict_paths` lists
      every colliding file (D-VALIDATE / R2-MAJ-005).
  rejection_reason:
    type: string
    minLength: 1
    description: >
      The operator-facing text the loader emitted with the rejection,
      verbatim from `ViewRejection.Reason` on the server. Present
      exactly when `rejection` is present. This is what the preview
      surfaces to a person opening a broken or duplicate-rejected view,
      so it never shows a blank or generic error.
  conflict_paths:
    type: array
    description: >
      Every file involved in a duplicate-name collision, collection-
      relative — the same two (or more) paths `ViewRejection.Paths`
      already carries on the server, now reaching the wire so a person
      can tell BOTH views apart. Present exactly when `rejection` is
      `view_duplicate_name`; absent otherwise (a parse failure names
      the single file involved through `path` on the entry itself).
    items:
      type: string
      minLength: 1
  derived_from:
    type: string
    minLength: 1
    description: >
      The collection-relative path of the `.base` file currently
      managing this view (the file's own `ViewDef.derived_from` field,
      D-PROVENANCE / FR-VA-009a). Present iff that field is set on the
      underlying `ViewDef` — the read-only / "derived" / "managed by"
      markers a UI surfaces from it are display-only and never
      influence what re-derivation may rewrite or delete (the
      pipeline-owned membership record is the authority for that, not
      this field, per R2-CRIT-001).
example:
  kind: "summary"
  label: "Open deals by owner"
  name: "open-by-owner"
  collection_id: "kb_abc123"