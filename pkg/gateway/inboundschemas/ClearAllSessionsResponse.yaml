title: ClearAllSessionsResponse
description: >
  Response from DELETE /api/v1/sessions/all (HTTP 200). Reports how many
  ordinary chats were deleted. Main chats are never deleted (a main chat goes
  only with its agent), so a "cleared" status does not mean every chat is gone:
  warnings count the chats that were kept (a turn that would not stop, storage
  that failed, or data that could not be read) and the main chats left alone.
type: object
required:
  - status
  - count
properties:
  status:
    type: string
    enum:
      - cleared
    example: cleared
  count:
    type: integer
    minimum: 0
    description: Number of ordinary chats deleted (main chats are not counted).
    example: 15
  warnings:
    type: array
    items:
      type: string
    description: >
      Fixed-text notices, never carrying a session id or path: how many chats
      were kept because they could not be deleted, and how many main chats were
      left alone. Absent when every chat was deleted and there are no main chats.
