title: AgentToolsUpdateRequest
description: >
  Replace tool settings using a complete effective policies map and explicit sparse
  override intent. revision and override_names are required. Only keys in
  override_names are persisted as local overrides; unlisted values must equal
  the current global ceiling or the request conflicts. Ordinary built-ins are
  editable; hidden capabilities remain fixed. Connector omission preserves and
  explicit empty removes assignments. The existing config wrapper is accepted.
type: object
additionalProperties: false
required:
  - revision
  - override_names
properties:
  revision:
    $ref: './ConfigurationRevision.yaml'
  override_names:
    type: array
    uniqueItems: true
    items:
      type: string
    description: Stored local override keys; an empty list removes all local overrides.
  config:
    $ref: AgentToolsCfg.yaml
  builtin:
    type: object
    description: Builtin tool policy configuration for this agent.
    required:
      - policies
    properties:
      policies:
        type: object
        additionalProperties:
          type: string
          enum:
            - allow
            - ask
            - deny
        description: >
          Complete per-tool policy map. Every static builtin tool name MUST be
          present as an explicit, literal key (e.g. "bash", "remember") with an
          "allow"/"ask"/"deny" value — this is not a sparse override set with a
          fallback default, and wildcard keys are not valid for the static
          builtin catalog. There is no default_policy field. Required
          on every request that includes builtin. Legacy callers that only
          have mode/visible available must resolve them to a complete
          policies map before sending this request; the server still accepts
          mode/visible alongside policies (ignored) for one release of
          transitional compatibility but no longer accepts them alone.
      mode:
        type: string
        description: >
          Legacy format, retained for one release of transitional
          compatibility. Ignored outright when a complete policies map is
          also present (policies always wins). Sent ALONE (no policies), mode
          does not successfully "build" a working policy on its own any more:
          under the mandatory coverage-validation model (no default_policy
          fallback), "explicit" converts visible[] into agent-level "allow"
          entries for just those names — it does not synthesize a deny-all
          baseline for every other static builtin tool — and "inherit"
          produces no per-tool entries at all. Both leave most static builtin
          tools without an explicit policy entry, so the request is rejected
          with 400 (a coverage-gap error) unless the global
          sandbox.tool_policies floor happens to cover every remaining tool.
          Callers must send a complete policies map to reliably succeed.
        enum:
          - explicit
          - inherit
      visible:
        type: array
        items:
          type: string
        description: >
          Legacy format: tool names converted to agent-level "allow" entries
          when mode="explicit". Ignored outright when policies is also
          present. Sent alone with mode="explicit", it does not cover every
          other static builtin tool, so the request is rejected with 400 for
          a coverage gap unless the global policy floor already covers the
          rest — see mode's description.
  mcp:
    type: object
    description: MCP server bindings for this agent.
    properties:
      servers:
        type: array
        description: List of MCP server bindings.
        items:
          $ref: './AgentToolsMcpServerBinding.yaml'
          x-go-type: AgentToolsMcpServerBinding
