type: object
description: >
  A single item in the board task list response. Equivalent to BoardTask.
  Defined as a plain object (not allOf) so that oapi-codegen emits
  []BoardTaskListItem rather than an inline anonymous struct in BoardTaskListResponse.
required:
  - id
  - name
  - status
  - created_at
  - updated_at
properties:
  id:
    type: string
    description: UUID task identifier
    example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
  name:
    type: string
    minLength: 1
    description: Task name.
    example: "Fix login bug"
  description:
    type: string
    maxLength: 2000
    description: Optional task description.
  status:
    type: string
    enum: [inbox, next, active, waiting, done, failed]
    description: GTD board task status.
  workspace_id:
    type: string
    description: >
      Optional workspace this task belongs to. Must be an existing workspace ID.
      If absent, task is unassigned.
    example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
  agent_id:
    type: string
    description: Optional agent responsible for this task.
    example: "mia"
  prompt:
    type: string
    maxLength: 10000
    description: Optional agent prompt attached to the task.
  priority:
    type: integer
    minimum: 1
    maximum: 5
    description: Task priority from 1 (highest) to 5 (lowest). Defaults to 3 when not specified.
  milestone_id:
    type: string
    description: Optional milestone this task belongs to.
  session_id:
    type: string
    description: Optional session linked to this task.
  result:
    type: string
    maxLength: 50000
    description: Optional task result or output.
  created_at:
    type: string
    format: date-time
    example: "2026-06-08T14:22:00Z"
  updated_at:
    type: string
    format: date-time
    example: "2026-06-08T15:00:00Z"
  owner:
    type: string
    description: "Username of the user who owns this resource. Set server-side at creation; read-only."
    example: "alice"
  start:
    type: string
    format: date-time
    description: >
      Optional start date/time (RFC 3339 UTC). When set, the task is
      scheduled to begin at this instant. Stored verbatim; no scheduling
      engine runs in v0.1.0 (shell only — engine is v0.2.0).
    example: "2026-07-01T09:00:00Z"
  due:
    type: string
    format: date-time
    description: >
      Optional due date/time (RFC 3339 UTC). Mirrors Milestone.due_date
      semantics — deadline for task completion.
    example: "2026-07-31T17:00:00Z"
  recurrence:
    type: string
    description: >
      Optional recurrence rule as a pinned RRULE string (RFC 5545, e.g.
      "FREQ=WEEKLY;BYDAY=MO"). Stored verbatim in v0.1.0; the recurrence
      execution engine is v0.2.0 (stored-not-run).
    example: "FREQ=WEEKLY;BYDAY=MO"
  blocked_by:
    type: array
    description: >
      Optional ordered list of GTD board task IDs that must complete before
      this task may be started. A write-time DAG validator rejects
      self-edges, 2-node cycles, and N-node cycles. Orphan edges (target
      task deleted) are dropped on load. Max depth 50.
    items:
      type: string
    example: ["01J1A2B3C4D5E6F7G8H9I0J1K2", "01J1A2B3C4D5E6F7G8H9I0J1K3"]
