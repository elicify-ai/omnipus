title: ModelCapabilities
description: >
  A single model's declared input-modality capabilities, as returned by
  GET /providers/model-capabilities (D18). Model vision capability is not
  knowable client-side at all otherwise — the SPA uses this to show a
  non-blocking warning toast before sending a vision attachment (e.g. a
  live-browser annotation, or an image attached via the composer) to an
  agent whose resolved model cannot accept images. This is advisory only:
  the reactive, server-side capability gate (pkg/agent/media_present.go)
  remains the authoritative backstop regardless of what the client shows.
type: object
required:
  - id
  - modalities
additionalProperties: false
properties:
  id:
    type: string
    description: >
      Canonical model identifier as used in the capability catalog — the
      bare model slug (no provider prefix), matching Agent.model, e.g.
      "gemini-2.5-flash" or "glm-5.2".
    example: "gemini-2.5-flash"
  modalities:
    type: array
    items:
      type: string
      enum:
        - text
        - image
        - pdf
        - audio
        - video
    description: >
      Input modalities this model accepts. A model with no "image" entry
      cannot process image attachments.
    example: ["text", "image", "pdf"]
