title: ViewGroupBy
description: >
  One grouping key of a saved view (ADR-068 D24.1, spec FR-018b).

  IT CARRIES A DIRECTION, AND THAT IS THE WHOLE REASON THIS TYPE EXISTS. The
  retired flat view format grouped by a bare list of property names with no
  direction field at all, so every `groupBy` direction in an imported Obsidian
  base was UNREPRESENTABLE ON THE WIRE — not merely untranslated. The founder's
  own vault carried 24 of them and every one was flattened to the default
  order in silence, which is the shape of failure this whole surface is
  written against: a view that imports without an error and then sorts its
  groups the wrong way, with nothing anywhere to say so.
type: object
additionalProperties: false
required:
  - property
properties:
  property:
    type: string
    minLength: 1
    description: >
      The property to group on. Grouping by a relation is supported (FR-029),
      and a record holding several values appears in EVERY group it belongs
      to (FR-028) rather than being assigned to one arbitrarily. The reserved
      namespaces `file.*` (FR-130) and `formula.*` (FR-140s) are valid here.
    example: "owner"
  direction:
    type: string
    enum:
      - asc
      - desc
    x-enum-varnames:
      - ViewGroupByDirectionAsc
      - ViewGroupByDirectionDesc
    description: >
      Order of the GROUPS themselves — not of the records inside them, which
      is `sort`'s job.


      Omitted means `asc`. That default is stated here rather than declared as
      a JSON Schema `default:` for the reason RecordFilter.yaml gives on
      `negate`: openapi-typescript promotes a defaulted property to REQUIRED
      while oapi-codegen still emits an optional pointer, so a `default:` here
      would make the two generated languages disagree about one field.


      Group order is LEXICAL over the case-folded key (ruling R-5/R-E) — an
      enum has no declared-position ordinal, and a domain order is expressed
      by prefixing the values (`1-lead`, `2-qualified`).
    example: "desc"
