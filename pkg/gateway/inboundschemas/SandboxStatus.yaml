title: SandboxStatus
description: >
  Runtime sandbox backend status returned by
  GET /api/v1/security/sandbox-status.
type: object
required:
  - backend
  - available
  - kernel_level
  - policy_applied
  - seccomp_enabled
  - bind_ports_count
properties:
  backend:
    type: string
    description: Name of the active sandbox backend.
    example: landlock
  available:
    type: boolean
    description: Whether the backend is available on this platform.
    example: true
  kernel_level:
    type: boolean
    description: >
      Whether the backend can enforce at the kernel level. True for Landlock
      on Linux 5.13+. False for the fallback (app-level) backend.
    example: true
  policy_applied:
    type: boolean
    description: >
      Whether kernel-level enforcement is actually live on this process.
      A kernel-capable backend may not have policy applied if Apply() was
      not called yet (e.g. sandbox mode is off).
    example: true
  abi_version:
    type: integer
    description: Landlock ABI version. Present on Linux with Landlock support.
    example: 4
  issue_ref:
    type: string
    description: >
      Set when a known kernel incompatibility is flagged. Do NOT hard-code
      the literal issue number in the SPA.
    example: "https://github.com/elicify-ai/omnipus/issues/123"
  blocked_syscalls:
    type: array
    items:
      type: string
    description: >
      List of syscall names blocked by seccomp (when active).
  seccomp_enabled:
    type: boolean
    description: Whether seccomp BPF filtering is currently active.
    example: true
  landlock_features:
    type: array
    items:
      type: string
    description: Landlock feature flags active on this kernel.
  notes:
    type: array
    items:
      type: string
    description: Human-readable notes about the sandbox state or limitations.
  mode:
    type: string
    description: Current sandbox enforcement mode (from ApplyState).
    example: enforce
  filesystem_model:
    type: string
    enum: [confined, open]
    description: >
      Which ADR-062 filesystem model is active. "confined" enumerates the
      paths that may be read and executed; "open" leaves reads and execution
      unrestricted apart from the secret set, and confines writes exactly as
      "confined" does. This never affects what an agent may WRITE.
      Surfaced because the two postures are indistinguishable from the
      outside: an operator cannot tell from behaviour whether a read
      succeeded because the model is open or because the path happened to be
      on the enumerated list.
    example: confined
  disabled_by:
    type: string
    description: >
      Reason the sandbox is disabled, if applicable. E.g. "config" or "kernel".
  landlock_enforced:
    type: boolean
    description: Whether Landlock file-system access rules are enforced.
  seccomp_enforced:
    type: boolean
    description: Whether seccomp syscall filtering is enforced.
  audit_only:
    type: boolean
    description: >
      True when the sandbox is in permissive (audit-only) mode —
      policy violations are logged but not blocked.
  bind_ports_count:
    type: integer
    minimum: 0
    description: >
      Number of bind-port allow-list rules installed by the kernel.
      Zero on FallbackBackend, Mode=Off, or Landlock ABI < 4.
    example: 2
  kernel_sandbox_active:
    type: boolean
    description: >
      ADR-091's platform predicate — whether a kernel sandbox is actually
      confining processes right now, the fact Auto-approve needs to decide
      anything: Linux — Landlock applied in enforce mode (`mode: enforce`
      above), not degraded. macOS — the Seatbelt backend's own
      active/enabled state, read directly rather than derived from
      `policy_applied` above, which reports the gateway's OWN confinement
      and is documented false on macOS by design (Seatbelt confines
      children only). Windows — always false, no kernel sandbox backend
      exists. Distinct from `policy_applied`/`kernel_level` above (which
      describe this process's own sandboxing posture, not specifically
      whether Auto's pre-flight has anything to check a command against).
    example: true
  auto_approve_effective:
    type: boolean
    description: >
      This gateway's current GLOBAL default for Auto-approve (mirrors
      SandboxConfig.auto_approve; reported here too so the chat-header
      badge doesn't need a second round-trip to Settings). This is the
      gateway-wide default, not a per-agent or per-chat resolution — this
      endpoint carries neither an agent nor a session, so it cannot see a
      per-agent `auto_approve_disabled` override or a chat's own
      session_mode_update modifier. The SPA composes the actual
      badge for one chat from three inputs: this field (the baseline),
      the active agent's `auto_approve_disabled` (from GET /agents/{id}),
      and the session's own resolved value once a
      session_mode_updated frame arrives (asyncapi.yaml).

      What the badge renders, keyed off this field and
      kernel_sandbox_active together (before any per-agent/per-chat
      override is folded in):
        - auto_approve_effective=false → "Ask": every tool currently
          resolved to "ask" always prompts, regardless of the kernel
          sandbox. kernel_sandbox_active is irrelevant to this reading.
        - auto_approve_effective=true, kernel_sandbox_active=true →
          "Auto": an "ask" tool call the kernel sandbox can positively
          confine auto-approves; anything it cannot still prompts.
        - auto_approve_effective=true, kernel_sandbox_active=false →
          "Auto → Ask" with a tooltip: Auto is configured on, but with no
          kernel sandbox to check a command against, the pre-flight can
          never positively clear anything, so every "ask" tool call
          prompts exactly as if Auto were off — a real, user-visible
          consequence of the platform/degradation state, not a bug.
    example: true
