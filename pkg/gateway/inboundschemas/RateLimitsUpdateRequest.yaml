title: RateLimitsUpdateRequest
description: >
  Request body for PUT /api/v1/security/rate-limits.
  Partial update — any subset of the three cap fields.
  Strict type validation rejects JSON strings in numeric fields, floats in integer fields,
  negative values, NaN/Inf, and overflow. Changes are hot-reloaded.
type: object
properties:
  daily_cost_cap_usd:
    type: number
    format: double
    minimum: 0
    description: Daily cost cap in USD. 0 = unlimited.
  max_agent_llm_calls_per_hour:
    type: integer
    format: int64
    minimum: 0
    description: Maximum LLM calls per hour. 0 = unlimited.
  max_agent_tool_calls_per_minute:
    type: integer
    format: int64
    minimum: 0
    description: Maximum tool calls per minute. 0 = unlimited.
