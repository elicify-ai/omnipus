title: BrowserWebRTCAnswerFrame
description: >
  Server → client. Pion SDP answer to a browser_webrtc_offer, sent once the
  gateway's relay has created the viewer PeerConnection and gathered its own
  ICE candidates (non-trickle — the answer is complete, no separate
  candidate frames follow). See ADR-047 D1/D4.
type: object
required:
  - type
  - sdp
additionalProperties: false
properties:
  type:
    type: string
    const: browser_webrtc_answer
  session_id:
    type: string
    maxLength: 128
    description: >-
      Echoes the session_id from the triggering browser_webrtc_offer, for
      client-side correlation only.
  sdp:
    type: string
    minLength: 1
    maxLength: 131072
    description: >-
      Complete SDP answer (application/sdp body) from the gateway's Pion
      viewer PeerConnection, ICE-gathering-complete (non-trickle).
  capture_generation:
    type: integer
    minimum: 1
    maximum: 9007199254740991
    description: >-
      Server-issued target and CSS geometry generation, scoped to the capture
      session. Input names the generation actually displayed; stale generations
      must be rejected. Viewer answers bind the negotiated stream to this value.
  capture_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >-
      Non-secret opaque capture-session identity. Generation claims are valid
      only within this capture; replacement invalidates all previous claims.
  offer_id:
    type: integer
    minimum: 1
    maximum: 9007199254740991
    description: >-
      Viewer negotiation attempt identity, unique on this WebSocket connection.
      The server echoes the offer value in its answer. A client must reject an
      answer for another attempt even when the capture generation is unchanged.
