title: UserContextRequest
description: >
  Request body for PUT /api/v1/user-context. Replaces the entire content of
  USER.md in the default workspace. Passing an empty string clears the file.
type: object
required:
  - content
additionalProperties: false
properties:
  content:
    type: string
    maxLength: 262144
    description: >
      Full replacement content for USER.md. May be empty to clear the file.
      Maximum 262144 bytes (256 KB). The underlying filesystem write via
      fileutil.WriteFileAtomic provides the physical limit; this schema
      constraint enforces a reasonable upper bound at the API layer.
    example: "I am a senior Go developer focused on distributed systems."
