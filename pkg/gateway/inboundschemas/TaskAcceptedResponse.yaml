title: TaskAcceptedResponse
description: >
  Response from POST /api/v1/tasks/{id}/start (HTTP 202 Accepted).
  Confirms that the task has been queued for execution.
type: object
required:
  - status
  - task_id
properties:
  status:
    type: string
    description: Acceptance status. Always "accepted".
    enum:
      - accepted
    example: accepted
  task_id:
    type: string
    description: The ID of the task that was accepted for execution.
    example: task_abc123
