title: MailMessage
description: >
  Full message for the Mail panel read path (GET
  /workspaces/{id}/mail/{agentId}/folders/{folder}/messages/{ref}) and the
  response of a panel draft edit (PUT .../folders/drafts/messages/{ref}).
  Carries every MailMessageSummary field plus the read-path extras. Fetching
  never writes flags (BODY.PEEK — round-2 MAJ-003); the only \Seen writers
  are the panel's seen endpoint and agent read_message (D38). bcc is
  returned only on the owner's own copies (drafts and Sent) and is null
  otherwise (§2.3 note). No message body text is persisted anywhere by
  Omnipus (D6) — this object is assembled live from the mail server.
type: object
additionalProperties: false
required:
  - message_id
  - uid
  - uidvalidity
  - folder
  - subject
  - from
  - from_name
  - to
  - cc
  - date
  - seen
  - is_draft
  - is_omnipus_draft
  - read_by_agent
  - reply_to
  - in_reply_to
  - references
  - body_text
  - has_html
  - bcc
  - attachments
  - body_markdown
  - markdown_lossy
properties:
  message_id:
    type: string
    nullable: true
    description: The Message-ID header value, or null when the mail carries none.
    example: "<abc123@example.com>"
  uid:
    type: integer
    format: int64
    minimum: 0
    maximum: 4294967295
    description: IMAP UID of the message within its folder.
    example: 123
  uidvalidity:
    type: integer
    format: int64
    minimum: 0
    maximum: 4294967295
    description: IMAP UIDVALIDITY of the folder.
    example: 456
  folder:
    type: string
    enum:
      - inbox
      - sent
      - drafts
    description: The folder slug the message lives in (MC-5).
    example: "drafts"
  subject:
    type: string
    description: Decoded subject (RFC 2047 decoded).
    example: "Quarterly report"
  from:
    type: string
    description: The From address (addr-spec).
    example: "assistant@example.com"
  from_name:
    type: string
    nullable: true
    description: Display name of the sender when present, else null.
  to:
    type: array
    description: To addresses.
    items:
      type: string
  cc:
    type: array
    description: Cc addresses (D26).
    items:
      type: string
  date:
    type: string
    format: date-time
    description: Message date (RFC 3339).
    example: "2026-09-26T10:30:00Z"
  seen:
    type: boolean
    description: Whether the message carries the \Seen flag.
  is_draft:
    type: boolean
    description: Whether the message carries the \Draft flag (MC-14).
  is_omnipus_draft:
    type: boolean
    description: Whether the X-Omnipus-Draft header is present (FR-029).
  read_by_agent:
    type: boolean
    description: >
      Whether the flag list carries the $OmnipusAgentRead keyword (D38,
      FR-039) — derived per fetch, never stored by Omnipus.
  reply_to:
    type: string
    nullable: true
    description: Reply-To address when the message carries one, else null.
  in_reply_to:
    type: string
    nullable: true
    description: In-Reply-To Message-ID when present, else null.
  references:
    type: string
    nullable: true
    description: References header (thread chain) when present, else null.
  body_text:
    type: string
    description: Decoded plain-text body.
  has_html:
    type: boolean
    description: >
      Whether an HTML body part exists. The HTML itself is never in this
      object — it is served only through the token-gated mail-preview routes
      (D13, §2.3a).
  bcc:
    type: array
    nullable: true
    description: >
      Bcc addresses — returned only on the owner's own copies (drafts and
      Sent); null on every other message (§2.3 note, D29/R2-3).
    items:
      type: string
  attachments:
    type: array
    description: Attachment descriptors (D28) — sanitized names, part indices.
    items:
      $ref: ./MailAttachment.yaml
  message_ref:
    type: string
    minLength: 5
    description: >
      Gateway-issued opaque message reference (correction I-03; register
      row 8) — same shape and rules as MailMessageSummary.message_ref. The
      detail result's issued reference: every follow-up operation on this
      message (attachment preview, save, reply context, seen) consumes it
      unchanged, and the gateway validates its embedded folder epoch,
      pair and configuration generation on the same lease that serves the
      follow-up — a mismatch is the typed 409 stale-reference refusal
      before any fetch or mutation.
    example: "uid:456:123"
  has_attachments:
    type: boolean
    description: >
      Paperclip indicator (F7) — same derivation and semantics as
      MailMessageSummary.has_attachments; carried consistently on the
      detail shape (register row 8). False is confirmed absence.
    example: true
  body_markdown:
    type: string
    nullable: true
    description: >
      The draft's editable Markdown source: the stored text/markdown part of
      an Omnipus draft whose X-Omnipus-Render-Hash matches the rendered text
      part; otherwise the server-derived Markdown of a foreign draft
      (FR-030) with markdown_lossy=true. Null on non-draft messages without
      an editable source.
  markdown_lossy:
    type: boolean
    description: >
      True when body_markdown was derived rather than read from a stored
      text/markdown part — editing such a draft may lose formatting (D24;
      the panel states the loss plainly).
  draft_cleanup_warning:
    type: string
    nullable: true
    description: >
      Set when the OLD draft copy could not be removed after a successful
      update-APPEND of the new copy (MAJ-009/MC-28 — the panel warns of a
      possible duplicate draft). Same underlying mechanism as the send path's
      draft_cleanup_warning (MailSendResponse), triggered by update instead
      of send. Null when cleanup succeeded, and always null on the read
      paths (GET message, list messages) — only the update endpoint can set
      it.
