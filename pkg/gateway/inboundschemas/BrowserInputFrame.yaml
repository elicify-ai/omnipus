title: BrowserInputFrame
description: >
  Client → server. A viewer input event to inject into the live browser via CDP
  Input.dispatch*. Only honoured while the viewer holds control (browser_control
  action=take). Coordinates are in device (CSS) pixels of the WebRTC video frame,
  UNLESS capture_width/capture_height are present — then x/y are in that
  capture-frame pixel space and the server rescales them into the tab's real
  CSS viewport before dispatch. See ADR-038 and
  docs/internal/browser-viewport-input-rootcause-2026-07-31.md (fault 3).
type: object
required:
  - type
  - kind
additionalProperties: false
properties:
  type:
    type: string
    const: browser_input
  kind:
    type: string
    enum:
      - mouse_move
      - mouse_down
      - mouse_up
      - wheel
      - key_down
      - key_up
      - text
      - navigate
      - navigate_back
      - reload
  x:
    type: number
    description: Device (CSS) x for mouse/wheel events.
  y:
    type: number
    description: Device (CSS) y for mouse/wheel events.
  capture_width:
    type: number
    minimum: 1
    maximum: 16384
    description: >-
      Intrinsic pixel width of the capture frame the client mapped x/y into
      (the <video> element's videoWidth in WebRTC mode). When present with
      capture_height, the server rescales x/y from this space into the tab's
      actual CSS viewport before CDP dispatch — keeping clicks accurate even
      when the encoder downscales the stream under CPU pressure or renders
      above DPR 1, where capture pixels no longer equal page CSS pixels
      (root cause 2026-07-31, fault 3). Absent (older client): x/y are
      dispatched as-is, assumed to already be CSS pixels.
  capture_height:
    type: number
    minimum: 1
    maximum: 16384
    description: >-
      Intrinsic pixel height of the capture frame the client mapped x/y into.
      See capture_width.
  button:
    type: string
    enum:
      - none
      - left
      - middle
      - right
      - back
      - forward
  delta_x:
    type: number
    description: Wheel delta X (wheel kind).
  delta_y:
    type: number
    description: Wheel delta Y (wheel kind).
  key:
    type: string
    maxLength: 64
    description: DOM key value (key_down/key_up), e.g. "Enter", "a".
  code:
    type: string
    maxLength: 64
    description: DOM code (key_down/key_up), e.g. "Enter", "KeyA".
  key_code:
    type: integer
    minimum: 0
    maximum: 255
    description: >-
      Windows virtual key code for key_down/key_up (the DOM
      KeyboardEvent.keyCode, e.g. Backspace=8, Enter=13, Tab=9, Delete=46,
      ArrowLeft/Up/Right/Down=37-40). CDP's Input.dispatchKeyEvent needs this to
      actually PERFORM editing/navigation key actions and modifier shortcuts
      (Ctrl+A/C/V) — key/code alone deliver an event but do not delete, submit,
      move the caret, or trigger the shortcut. See ADR-039.
  text:
    type: string
    maxLength: 8192
    description: Text to insert (text kind) or the character for a key event.
  modifiers:
    type: integer
    minimum: 0
    maximum: 15
    description: CDP modifier bitmask — Alt=1, Ctrl=2, Meta=4, Shift=8.
  url:
    type: string
    maxLength: 2048
    description: >-
      Destination URL for the navigate kind (user-driven address bar). The
      server applies the same SSRF/scheme validation as the browser_navigate
      tool before dispatching page.Navigate, and only while the viewer holds
      control. See ADR-039.
