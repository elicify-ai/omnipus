title: AuditEntry
description: >
  A single audit log record from the JSONL audit log file
  (~/.omnipus/system/audit.jsonl). Matches the Go pkg/audit.Entry struct.
type: object
required:
  - timestamp
  - event
properties:
  timestamp:
    type: string
    format: date-time
    description: ISO 8601 UTC timestamp of when the event was recorded.
    example: "2026-05-16T10:30:00Z"
  event:
    type: string
    pattern: '^[a-z_.]+$'
    description: >
      Event type identifier. Two naming families coexist and BOTH are legal:
      the original flat names (tool_call, exec, file_op, llm_call, policy_eval,
      rate_limit, ssrf, startup, shutdown) and the dot-separated hierarchical
      names that every newer event uses (skill.call, onboarding.admin_created,
      turn.cancel.attempt, browser.webrtc.stream_started, workspace.create, …).
      Custom values are permitted for extensibility — must match ^[a-z_.]+$
      (lowercase letters, underscores and dots only).

      The dot is REQUIRED here and must not be removed (issue #667). Over 50
      dot-separated names are declared in pkg/audit (audit.go, events.go) and
      emitted from production handlers, and more are registered as bare
      literals in pkg/audit.IsValidEventName for back-compat with audit files
      written before the project→workspace and milestone→task renames. Audit
      logs are append-only history that cannot be rewritten — the HMAC chain
      (pkg/audit/hmac.go) is computed over each entry's canonical JSON
      INCLUDING this field, so renaming events on disk would invalidate every
      chain link. A pattern that rejects dots therefore does not "validate"
      anything; it makes AuditLogResponse's `entries` array fail as a whole
      (src/lib/api.ts::request throws ApiSchemaError on the response, it does
      not drop single rows), blanking Settings → Security → Audit Log on any
      real install. Regression guard: pkg/audit/event_name_contract_test.go
      checks every declared event name against this very pattern, read from
      this file.
    example: tool_call
  decision:
    type: string
    description: >
      Outcome of the event evaluation. One of: allow, deny, error.
      May be absent for informational events.
    enum:
      - allow
      - deny
      - error
    example: allow
  agent_id:
    type: string
    description: ID of the agent that triggered the event. May be absent.
    example: jim
  session_id:
    type: string
    description: Session ID associated with the event. May be absent.
    example: sess_abc123
  user:
    type: string
    description: >
      Authenticated gateway principal that initiated the turn this entry
      belongs to (FR-017). For a CLI run authenticated via the dedicated
      CLI token this is "cli"; for a browser session it is the account's
      username.
      This is the WS-authenticated identity (carried on a dedicated field set
      only by the gateway WS path), not the channel-platform sender — so
      channel-originated turns and unauthenticated env-token / dev-bypass paths
      leave it absent. May be absent.
    example: cli
  tool:
    type: string
    description: Tool name when the event is a tool call. May be absent.
    example: workspace.shell
  command:
    type: string
    description: >
      Command string when the event is an exec event. May be absent.
    example: ls -la
  parameters:
    type: object
    description: Tool call parameters or other event-specific key-value pairs.
    additionalProperties: true
  policy_rule:
    type: string
    description: Policy rule that produced this decision. May be absent.
    example: "exec: ask"
  details:
    type: object
    description: Event-specific metadata. Structure varies by event type.
    additionalProperties: true
  actor:
    type: string
    description: >
      Authenticated username that performed the change. Present on
      security_setting_change records (see
      pkg/audit.SecurityChangeRecord); may be absent for other event types.
    example: admin
  resource:
    type: string
    description: >
      Dotted identifier of the config key that was mutated. Present on
      security_setting_change records, e.g. "gateway.god_mode". May be
      absent for other event types.
    example: gateway.god_mode
  old_value:
    type: object
    description: >
      The config value before the change, recursively redacted for
      sensitive keys. Present on security_setting_change records. May be
      absent for other event types.
    additionalProperties: true
  new_value:
    type: object
    description: >
      The config value after the change, recursively redacted for
      sensitive keys. Present on security_setting_change records. May be
      absent for other event types.
    additionalProperties: true
