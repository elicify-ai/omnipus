type: object
description: >
  The result of actually running a trivial test prompt through an
  external-CLI worker's real dispatch path. Always 200 (even for a failed
  run) — the outcome is carried in `ok`/`error`, not the HTTP status,
  matching POST /system/cli-validate's convention of using the body for
  domain-level failure rather than 4xx/5xx.
required:
  - ok
  - duration_ms
  - used_agent_workspace
additionalProperties: false
properties:
  ok:
    type: boolean
    description: Whether the CLI produced a real response before the bounded timeout/turn cap was reached.
  response_text:
    type: string
    description: >
      The CLI's actual final response text. Present when ok is true; absent
      (or empty) otherwise.
  error:
    type: string
    description: >
      A human-readable reason the run did not succeed (process failed to
      start, authentication failed, timed out, exceeded the bounded turn
      cap, or the CLI itself reported an error). Present when ok is false.
  duration_ms:
    type: integer
    description: Wall-clock time the run actually took, in milliseconds.
  used_agent_workspace:
    type: boolean
    description: >
      True when a saved agent's persistent directory was prepared for the
      test: its resolved home, or its workspace project-work folder when
      workspace lookup and preparation succeeded. Workspace preparation
      failure falls back to the agent home. That persistent directory is not
      removed by this handler. False denotes the scratch branch, but can also
      be returned by a failure before any directory or subprocess is
      prepared. The flag alone does not prove that a program ran.
