type: object
description: >
  Body for PUT /api/v1/integrations/providers/{id}. Configures a search or
  voice-input integration provider (FR-12.1). Setting an api_key stores it
  encrypted (AES-256-GCM) in credentials.json and writes only the credential
  reference to config.json. Setting active=true selects this provider as the
  active one for its kind. Integration edits are sensitive. In the core edition (local auth mode) the request must carry a re-auth consent token in the X-Reauth-Token header — call POST /api/v1/auth/reauth first (Spec-6 FR-12.2); in the desktop and hosted editions (platform auth mode) the SPA confirms the change with the operator before sending and the wire guard is the authenticated session (ADR-0008 ruling 6).
required:
  - kind
additionalProperties: false
properties:
  kind:
    type: string
    enum:
      - search
      - voice
    description: Whether this provider is a search engine or a voice transcriber.
    example: "search"
  api_key:
    type: string
    description: >
      API key for the provider. Stored encrypted; omit to leave the current key
      unchanged. Required when first configuring a key-requiring provider.
    example: "BSA-abc123"
  active:
    type: boolean
    description: When true, select this provider as the active one for its kind.
    example: true
