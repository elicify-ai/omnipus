title: TaskUpdateRequest
description: >
  Request body for PATCH /tasks/{id} — the unified partial-update body that
  replaces the two legacy update bodies (`TaskUpdateRequest` and
  `BoardTaskUpdateRequest`). No back-compat aliases. All fields are optional; only
  provided fields are updated (PATCH semantics). At least one field is required.

  `status` accepts the full 6-state vocabulary (ADR-051 D5). Note: `blocked` is normally an
  AUTO side-state managed by the dependency engine (set when a `blocked_by` dep is
  unmet, cleared to `next` when deps complete); setting it directly is allowed but
  the engine may override on the next dependency evaluation. Advancing a partial
  task to `next` is rejected server-side (Detail #8 — only fully-captured tasks may
  be triaged to `next`).
type: object
additionalProperties: false
minProperties: 1
properties:
  title:
    type: string
    minLength: 1
    maxLength: 200
    description: New task title.
    example: "Updated task title"
  description:
    type: string
    maxLength: 2000
    description: New free-form description.
    example: "Revised notes."
  prompt:
    type: string
    maxLength: 10000
    description: New agent prompt.
    example: "Re-run the analysis over 14 days instead of 7."
  status:
    type: string
    enum:
      - inbox
      - next
      - in_progress
      - blocked
      - done
      - failed
    description: New task status (6-state lifecycle, ADR-051 D5).
    example: "in_progress"
  agent_id:
    type: string
    description: Re-assign the task to this agent.
    example: "jim"
  priority:
    type: integer
    minimum: 1
    maximum: 5
    description: New task priority (1 highest .. 5 lowest).
    example: 2
  blocked_by:
    type: array
    items:
      type: string
    description: >
      Replacement dependency set (replaces the current `blocked_by` atomically).
      Write-time cycle validator rejects self-edges and cycles; max depth 50.
    example: []
  todos:
    type: array
    items:
      $ref: ./Todo.yaml
    description: Replacement checklist (replaces the current `todos` atomically).
  trigger:
    $ref: ./TaskTrigger.yaml
  due:
    type: string
    format: date-time
    description: New deadline (RFC 3339 UTC).
    example: "2026-08-15T17:00:00Z"
  clear_due:
    type: boolean
    description: >
      When true, clears the task's due date; ignored if `due` is also set to a
      value. Provides an unambiguous clear mechanism the FE can batch with other
      field updates (an empty `due` string is not a valid date-time and would be
      rejected).
    example: true
  tags:
    type: array
    maxItems: 16
    items:
      type: string
      maxLength: 64
    description: >
      Replacement tag set (ADR-049 D1) — replaces the current `tags`
      atomically. Lowercase, trimmed, deduplicated after normalization, at
      most 16 per task, each at most 64 characters.
    example:
      - "milestone:v1.0-launch"
  plan_id:
    type: string
    description: >
      New Plan grouping (ADR-049 D1/D4). Same-workspace FK — rejected 400 if
      the plan is in a different workspace.
    example: "01J3ZQK8N2H8VXNRP5T7C9M4WE"
  write_set:
    type: array
    items:
      type: string
    description: >
      ADR-053 §Contract Surface. Replacement set of concrete paths this plan
      member creates/edits — see `Task.write_set`. Meaningful only alongside
      `plan_id`; empty/absent for an exploratory member (D10) or a standalone
      task.
    example:
      - "pkg/plan/plan_lint.go"
  stream:
    type: string
    description: ADR-053 §Contract Surface — the parallel-group id this member belongs to.
    example: "stream-schema"
  is_join:
    type: boolean
    description: >
      ADR-053 §Contract Surface — true marks this member as an authored
      join/assemble member with its own criteria. Absent/false is the
      common case — no schema `default:` (see `Task.yaml`'s `is_join` for
      why: combining `default:` with an absent-from-`required` field
      makes openapi-typescript emit it as non-optional regardless).
    example: false
  criteria:
    type: array
    items:
      $ref: ./AcceptanceCriterionInput.yaml
    description: >
      Replacement acceptance-criteria set (ADR-049 D2/D5/FR-3) — replaces
      the current `criteria` atomically. Agent tool paths reject an update
      that reduces the count below 1. Items use the authoring-time
      `AcceptanceCriterionInput` shape (ADR-074 D2): `kind` may be omitted
      and is inferred server-side from the payload.
  max_attempts:
    type: integer
    minimum: 1
    nullable: true
    description: >
      New per-task override of the attempt ceiling before the goal loop
      wakes the owner (ADR-049 D7/FR-9). Null clears the override (inherit
      the global default).
    example: 5
  surface:
    type: string
    enum:
      - user
      - heartbeat
    description: New UI surface ownership (Detail #5).
    example: "user"
  result:
    type: string
    maxLength: 50000
    description: Task result or output summary.
    example: "Logs analyzed; 3 anomalies found."
  artifacts:
    type: array
    items:
      type: string
    description: Replacement list of artifact paths produced by the task.
    example:
      - "/workspace/report.pdf"
  started_at:
    type: string
    format: date-time
    description: When the task started execution.
    example: "2026-06-20T10:00:00Z"
  completed_at:
    type: string
    format: date-time
    description: When the task completed or failed.
    example: "2026-06-20T10:05:00Z"
