type: object
title: DelegateRespondResponse
description: >
  Response to `delegate` `action: respond` (ADR-053 §5.1): acknowledgement
  only. A native answer routes into the child's turn. An external-CLI answer
  is delivered to the same CLI conversation: applied by interrupt and resume
  when the run is underway, or queued until the helper finishes starting and
  then delivered to that conversation; otherwise it is refused. The
  acknowledgement does not say which of the two happened. No session is
  created or replaced by a respond.
required:
  - acknowledged
additionalProperties: false
properties:
  acknowledged:
    type: boolean
    description: True when the response was accepted and routed by `correlation_id`.
    example: true
