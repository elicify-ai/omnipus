type: object
description: >
  The REAL, computed command Omnipus would run for the previewed executor
  settings — argv sourced from the same buildArgs() each driver uses at real
  dispatch time, not a hand-maintained description. Purely informational;
  nothing here is persisted. Every token a real run would drop is surfaced
  in dropped_args rather than silently omitted: cli_args tokens the run
  filter strips (the safety filter, plus any model option, because the
  worker's model field sets the model), and a model option in the saved
  standard parameters when Omnipus passes the worker's own model. The
  operator can see and fix a mistyped or disallowed argument before saving
  instead of discovering later (via a server log line they never see) that
  it was ignored.
required:
  - binary
  - argv
  - command_line
  - prompt_delivery
  - dropped_args
additionalProperties: false
properties:
  binary:
    type: string
    description: >
      The program that would be spawned: the path a person saved in
      Settings -> Third-party agents for this CLI, exactly as saved. With no
      saved path, or a saved path that fails the program checks, the route
      refuses with 400 and the text a run would be refused with.
    example: claude
  argv:
    type: array
    items:
      type: string
    description: >
      The exact, ordered argument list that would be passed to the binary,
      already reflecting the previewed model/cli_args/
      max_tool_iterations and with the cli_args tokens the run filter drops
      already removed (see dropped_args for what was removed and why),
      followed by the person's saved standard parameters. From those only a
      model option is removed, and only when Omnipus passes the worker's own
      model; nothing else in them is filtered. Does not
      include a token for the task prompt itself for claude-code or codex
      (delivered via stdin, not argv — see prompt_delivery); for opencode the
      literal placeholder "<prompt>" appears in the position the real task
      prompt would occupy.
    example:
      - "-p"
      - "--output-format"
      - "stream-json"
      - "--verbose"
      - "--no-chrome"
      - "--model"
      - "sonnet"
      - "--dangerously-skip-permissions"
  command_line:
    type: string
    description: >
      argv joined into a single, shell-quoted display string (binary first),
      suitable for showing directly in the UI or copying into a terminal.
    example: 'claude -p --output-format stream-json --verbose --no-chrome --model sonnet --dangerously-skip-permissions'
  prompt_delivery:
    type: string
    enum:
      - stdin
      - "positional argument after --"
    description: >
      How the actual task prompt (soul + instructions, composed at real
      dispatch time) reaches this CLI — never a --prompt flag on any of the
      three supported CLIs. claude-code and codex read it from stdin; opencode
      receives it as the last positional argument after a literal "--"
      end-of-options separator.
  model_dropped_reason:
    type: string
    description: >
      Present only when a non-empty model was previewed but --model/-m was
      omitted from argv because it does not fit the target CLI's required
      shape (opencode requires "provider/model"). Absent when the model was
      applied as given or no model was previewed.
  dropped_args:
    type: array
    description: >
      Every token removed before it reached argv, with why. First the
      previewed cli_args tokens the run filter (argsafety.go) removed: the
      safety filter's tokens and any model option, which is always dropped
      because the worker's model field sets the model. Then any model option
      from the saved standard parameters, dropped because Omnipus passes the
      worker's own model. Empty when nothing was dropped.
    items:
      type: object
      required:
        - flag
        - reason
      additionalProperties: false
      properties:
        flag:
          type: string
          description: The exact token (or flag=value pair) that was dropped, from cli_args or the standard parameters.
        reason:
          type: string
          description: Why this token is not permitted for this CLI.
    example: []
