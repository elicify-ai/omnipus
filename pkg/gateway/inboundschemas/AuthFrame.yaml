title: AuthFrame
description: >
  Client → server. First frame sent by the SPA after the WebSocket connection
  opens. The server validates the token and, if accepted, begins dispatching
  the session_state frame followed by normal frame routing.
type: object
required:
  - type
  - token
additionalProperties: false
properties:
  type:
    type: string
    const: auth
  token:
    type: string
    minLength: 72
    maxLength: 72
    pattern: '^omnipus_[a-f0-9]{64}$'
    description: Bearer token obtained from /api/v1/auth/login. Format is "omnipus_" + 64 hex chars.
