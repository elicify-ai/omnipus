title: BrowserStatusFrame
description: >
  Server → client. Lifecycle / control status for the live browser connection.
  state=controlling means this viewer holds interactive control; released means
  control was dropped; error carries a human-readable message. See ADR-038.
type: object
required:
  - type
  - state
additionalProperties: false
properties:
  type:
    type: string
    const: browser_status
  state:
    type: string
    enum:
      - attached
      - idle
      - controlling
      - released
      - detached
      - error
  message:
    type: string
    maxLength: 512
  controller:
    type: string
    maxLength: 128
    description: >-
      The controlling user's display name/username, when state=controlling
      (the gateway sends the authenticated userID resolved for this
      connection, NOT an internal viewer/connection id). May be an empty
      string under token-based or dev-mode-bypass authentication, where no
      per-user identity is resolved — an empty controller does not mean
      nobody is in control.
  session_id:
    type: string
