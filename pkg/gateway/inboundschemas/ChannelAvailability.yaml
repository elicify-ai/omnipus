title: ChannelAvailability
description: >
  Whether a chat connection's adapter is running right now, read from the
  channel manager's existing records (channels spec T-7, FR-051). "running" is
  the adapter's own flag; a network loss does not necessarily clear it.
type: object
additionalProperties: false
required:
  - state
properties:
  state:
    type: string
    description: >
      running = registered and running; not_running = registered but not
      running (start failed or not started); not_loaded = not registered (for
      example the adapter could not be constructed).
    enum:
      - running
      - not_running
      - not_loaded
    example: running
  reason:
    type: string
    description: >
      Why the connection is not running. Present only when state is not
      running: the last start error, the construction failure, "not started"
      or "not loaded". Never contains a secret.
    maxLength: 500
    example: not started
