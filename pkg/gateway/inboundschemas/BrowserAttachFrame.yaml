title: BrowserAttachFrame
description: >
  Client → server. Binds this browser-live WebSocket connection to a
  workspace's browser and starts watching it for control-lock and tab-strip
  bookkeeping (video is carried exclusively by WebRTC — see
  BrowserWebRTCStateFrame, ADR-061). Per ADR-075 a browser belongs to a
  WORKSPACE, not to an agent: one workspace, one Chrome, one profile
  directory, one cookie jar, shared by every agent on that workspace's team.
  session_id RESOLVES the browsing context — the gateway reads the named chat
  session's own workspace_id from the session meta, server-side, and attaches
  to that workspace's browser. agent_id names who is asking and is checked for
  membership of that workspace; it is NO LONGER the binding key. When the
  session names no workspace the gateway falls back to the agent's own
  workspace membership, and REFUSES rather than tie-breaking when that is
  ambiguous (ADR-075 FR-033). See ADR-075, ADR-038 and ADR-043.
type: object
required:
  - type
  - session_id
  - agent_id
additionalProperties: false
properties:
  type:
    type: string
    const: browser_attach
  session_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >-
      The client's chat session id. Under ADR-075 FR-017 it RESOLVES the
      browsing context: the gateway reads THIS session's own workspace_id
      from the session meta, server-side, and attaches to that workspace's
      browser. No workspace identity is taken from the client — the client
      sends only a session id, and a session naming a workspace the agent is
      not on is ignored rather than honoured. It is still echoed back on
      outgoing browser_status / browser_tabs / browser_webrtc_* frames so the
      client can match them to this attach request. A session that names no
      workspace degrades to the agent's own unambiguous membership, and to
      FR-033's refusal when the agent is on more than one workspace.
      agent_id is no longer the binding key.
  agent_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >-
      The agent this panel is open on. It names WHO is asking and must be a
      member of the workspace session_id resolves to; it does not by itself
      select a browser, because a browser belongs to the workspace and every
      agent on that team shares it (ADR-075 FR-001).
