title: BrowserAttachFrame
description: >
  Client → server. Binds this browser-live WebSocket connection to a
  session's browser and starts the screencast. Per ADR-043 agents browse
  concurrently in isolated per-agent browser contexts within one shared
  Chrome; agent_id is the binding key (selects which agent's
  BrowserManager + browser context the live view attaches to), and
  session_id is correlation-only (the server binds to the active tab in
  that agent's context). See ADR-038 and ADR-043.
type: object
required:
  - type
  - session_id
  - agent_id
additionalProperties: false
properties:
  type:
    type: string
    const: browser_attach
  video_caps:
    type: array
    maxItems: 16
    items:
      type: string
      minLength: 1
      maxLength: 128
    description: >-
      Video codec strings this viewer's VideoDecoder.isConfigSupported
      reports as decodable (e.g. "avc1.4D401E", "vp8"), most-preferred
      first. Optional for wire-compat with clients that predate the video
      relay (treated as an empty array — no video-capable codec — by the
      gateway); the SPA MUST send it once it advertises capabilities
      (FR-005). An empty/absent array means no video-capable codec is
      available; if it intersects no codec the active/negotiable encoder can
      produce, the viewer gets the unavailable state, never JPEG or an A1
      fallback (FR-006, US-5, US-6, DS-1).
  audio_caps:
    type: array
    maxItems: 16
    items:
      type: string
      minLength: 1
      maxLength: 128
    description: >-
      Audio codec strings this viewer's AudioDecoder.isConfigSupported
      reports as decodable (e.g. "opus"). Optional, same wire-compat
      rationale as video_caps. An empty/absent array means audio is silently
      unavailable to this viewer — video streams normally either way
      (FR-005, FR-011, US-4).
  session_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >-
      The client's chat session id, carried for context/correlation and
      logging only — echoed back on outgoing browser_screencast /
      browser_status frames so the client can match them to this attach
      request. It does NOT select which browser tab the live view attaches
      to: the server binds to the active tab in the attaching agent's OWN
      browser context (per ADR-043, agents browse concurrently in isolated
      per-agent contexts within one shared Chrome — cookie/login state is
      not shared across agents), regardless of the value sent here.
      agent_id is the binding key.
  agent_id:
    type: string
    minLength: 1
    maxLength: 128
    description: Agent whose BrowserManager owns the live tab.
