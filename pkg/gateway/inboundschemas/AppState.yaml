title: AppState
description: >
  Application state returned by GET /api/v1/state. Reflects whether onboarding
  has been completed and optional diagnostic metadata.
type: object
required:
  - onboarding_complete
additionalProperties: false
properties:
  onboarding_complete:
    type: boolean
    description: Whether the first-run onboarding wizard has been completed.
    example: true
  last_doctor_run:
    type: string
    format: date-time
    description: RFC3339 timestamp of the last health-check run. Absent if never run.
    example: "2026-05-16T10:00:00Z"
  last_doctor_score:
    type: integer
    minimum: 0
    maximum: 100
    description: Score from the last health-check run (0–100, integer). Absent if never run.
    example: 85
  god_mode_available:
    type: boolean
    description: >
      True when the sandbox mode is "off" (no kernel enforcement). Indicates
      the gateway is running without sandbox protection.
    example: false
  god_mode_opted_in:
    type: boolean
    description: >
      True when the operator has explicitly opted into god mode (sandbox=off).
      Distinct from god_mode_available to allow UI differentiation.
    example: false
  dev_mode_bypass:
    type: boolean
    description: >
      True when gateway.dev_mode_bypass is enabled. Read-only — cannot be set
      via this endpoint. The SPA uses this to hide controls that are inoperative
      when bypass is active.
    example: false
  video_embed_hosts:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 253
    maxItems: 16
    description: >
      Allow-listed video-embed hostnames (ADR-083 D-C/D9, EMB-075/EMB-081).
      A note's markdown-link video embed is drawn as a locally-rendered,
      click-to-play frame only when its URL's host EXACTLY matches an
      entry here — never a prefix or suffix match, so a look-alike domain
      is never framed. This is the same allow-list the served
      Content-Security-Policy's frame-src directive carries (EMB-079); a
      test asserts the two are equal (EMB-080). The shipped default
      contains exactly one entry. An operator who empties this list turns
      video framing off entirely: no external host reaches the served
      policy, and every video embed falls back to a plain link. Read-only
      — this reflects an operator configuration key, not settable via
      this endpoint.
    example:
      - "www.youtube-nocookie.com"
