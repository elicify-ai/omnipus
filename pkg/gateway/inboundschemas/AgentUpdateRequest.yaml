type: object
description: >
  Body for PUT /agents/{id}. All fields are optional — only provided fields are updated.
  Locked (core) agents reject mutations to name, description, and soul. Exception
  (ADR-052 FR-038): locked `type: system` agents (e.g. the Judge) DO accept `soul`
  mutations — soul/rubric unification means the Judge's soul is its judging rubric,
  editable while the agent stays otherwise locked.
  model, timeout_seconds, and max_tool_iterations may be updated on locked agents.
  heartbeat, heartbeat_enabled, and heartbeat_interval are accepted but ignored on all agents
  (heartbeat is workspace-scoped, ADR-027).
  At least one field must be present (minProperties: 1) — empty patches are rejected 400.
  Fields not applicable to the agent's type (e.g. tools_cfg on subagent_3p) are rejected 400
  with code field_not_applicable_to_type.
minProperties: 1
additionalProperties: false
properties:
  updated_at:
    type: string
    format: date-time
    description: ISO 8601 timestamp from the last GET /agents/{id} response. When provided, the request is rejected with 409 Conflict if it does not match the current server value.
    example: "2026-06-19T12:34:56Z"
  name:
    type: string
    minLength: 1
    description: New display name. Rejected on locked agents.
    example: "My Renamed Agent"
  description:
    type: string
    description: >
      New description. Rejected on locked agents. Empty string removes it. For Subagent /
      subagent_3p, an empty string after trim is rejected 400 (description is required for
      workers per the routing contract).
    example: "Updated description"
  model:
    type: string
    description: New model slug. Allowed on all agents. With the O3 two-field model,
      pair with `provider` for explicit routing.
    example: "google/gemini-2.5-flash"
  provider:
    type: string
    maxLength: 64
    description: >
      New explicit routing key for the primary model (O3 two-field model). When
      set, resolution uses it directly and never infers a provider. Allowed on all
      agents. Send an empty string to clear it (fall back to default-provider
      resolution).
    example: "openrouter"
  context_window_override:
    type: integer
    minimum: 1
    nullable: true
    description: >
      Per-agent context-window override in tokens (ADR-066 D2 rung 1, D9).
      Lower-only — clamped to the model's capability on resolution (a WARN
      names the agent and the clamp). Send null to clear. Every write
      triggers a registry reload so the next turn uses the new window.
    example: 200000
  soul:
    type: string
    minLength: 1
    description: >
      New SOUL.md content (agent system prompt). Rejected on locked core
      agents. Exception (ADR-052 FR-038, soul/rubric unification): accepted
      for locked `type: system` agents (e.g. the Judge) — for those, this
      field IS the judging rubric, the only prompt-equivalent field a
      locked System Agent accepts. Writing this triggers a config reload.
      Whitespace-only is rejected as minLength violation.
    example: "You are a helpful assistant..."
  heartbeat:
    type: string
    description: >
      Accepted for backward compatibility but IGNORED — heartbeat is workspace-scoped (ADR-027).
    example: "Check queue every hour."
  timeout_seconds:
    type: integer
    description: New timeout in seconds per turn. Allowed on all agents.
    example: 600
  max_tool_iterations:
    type: integer
    description: New maximum tool calls per turn. Allowed on all agents.
    example: 100
  heartbeat_enabled:
    type: boolean
    description: >
      Accepted for backward compatibility but IGNORED — heartbeat is workspace-scoped (ADR-027).
    example: false
  heartbeat_interval:
    type: integer
    description: >
      Accepted for backward compatibility but IGNORED — heartbeat is workspace-scoped (ADR-027).
    example: 1800
  shell_policy:
    type: object
    description: >
      Per-agent shell command deny-pattern configuration. Rejected 400 on subagent_3p agents.
    properties:
      enable_deny_patterns:
        type: boolean
        example: true
      custom_deny_patterns:
        type: array
        items:
          type: string
        description: Must each be valid Go regexp patterns (400 on invalid regexp).
        example:
          - "rm -rf /"
  color:
    type: string
    pattern: '^#[0-9A-Fa-f]{6}$'
    description: Hex color code for agent avatar display (e.g. "#D4AF37").
    example: "#D4AF37"
  icon:
    type: string
    maxLength: 50
    description: Phosphor icon name for agent avatar (e.g. "Robot", "Octopus").
    example: "Robot"
  fallback_models:
    type: array
    maxItems: 2
    items:
      $ref: './FallbackModel.yaml'
    description: >
      Replace the agent's fallback model chain (Phase 1B / FR-005). Each
      entry carries its own provider so the fallback can route through
      a different provider than the primary (FR-007). Capped at 2 entries.
      Rejected 400 on subagent_3p agents (CLI handles its own retries).

      Wire format is always the object form `[{model, provider}]`. Legacy
      `[string]` payloads are normalized at config-load time (FR-006).
    example:
      - model: "claude-sonnet-4.6"
        provider: "anthropic"
  model_params:
    type: object
    description: >
      LLM sampling parameters applied to this agent's requests. Rejected 400 on
      subagent_3p agents (CLI may not support these flags).
    properties:
      temperature:
        type: number
        format: double
        description: Sampling temperature (0.0 – 2.0). Lower = more deterministic.
        example: 1.0
      max_tokens:
        type: integer
        description: Maximum tokens to generate per turn.
        example: 4096
      top_p:
        type: number
        format: double
        description: Nucleus sampling probability mass. 1.0 disables nucleus sampling.
        example: 1.0
  rate_limits:
    type: object
    description: Per-agent rate-limit overrides. When use_global_defaults is true the global policy applies.
    properties:
      use_global_defaults:
        type: boolean
        description: When true, global rate limits are used and per-agent overrides are ignored.
        example: true
      max_llm_calls_per_hour:
        type: integer
        description: Maximum LLM API calls per hour for this agent. Absent = no per-agent cap.
        example: 100
      max_tool_calls_per_minute:
        type: integer
        description: Maximum tool calls per minute for this agent. Absent = no per-agent cap.
        example: 60
      max_cost_per_day:
        type: number
        format: double
        description: Maximum USD cost per day for this agent. Absent = no per-agent cap.
        example: 5.0
  tools_cfg:
    $ref: './AgentToolsCfg.yaml'
  default:
    type: boolean
    description: >
      Send true to make this agent the global default that handles inbound
      messages with no more-specific routing rule — replacing whichever agent
      previously held it. Send false to clear the default, which only has an
      effect if this agent currently holds it (sending false for an agent
      that isn't the current default is a no-op). Omitting this field leaves
      the default unchanged. Main only — workers never default (rejected with
      400 if attempted).
    example: false
  skills:
    type: array
    uniqueItems: true
    items:
      type: string
    description: >
      Replace the agent's skill list. Only the skill IDs in this list will
      be granted; omitting this field leaves the existing list unchanged.
      Send an empty array to remove all skills. Rejected 400 on subagent_3p agents
      (CLI doesn't see Omnipus skills).
    example:
      - "web-research"
  voice:
    type: string
    nullable: true
    description: >
      Per-agent persona voice identifier. Schema-pinned; not active until v0.2.0 TTS.
      Send null to clear. Main only.
    example: "alloy"
  executor:
    $ref: './ExecutorConfig.yaml'
  memory_enabled:
    type: boolean
    description: >
      New value for the memory-injection gate (ADR-052 FR-039). When false,
      ContextBuilder skips memory injection for this agent's turns. Allowed
      on all agents.
    example: true
