type: object
description: >
  Partial agent update. Revision and at least one changed field are required.
  Ordinary built-in identity and soul are fixed; tool policies, connector assignments
  and skills are editable. Hidden Judge/Supervisor instructions are editable while
  their identity and capabilities remain fixed. Runtime applicability is validated
  before any mutation. Protected same-value echoes are still rejected.
minProperties: 2
additionalProperties: false
required:
  - revision
properties:
  revision:
    $ref: './ConfigurationRevision.yaml'
  mcp_servers:
    type: array
    description: Omission preserves assignments; an explicit empty list removes all assignments. Null is rejected.
    items:
      $ref: './AgentMCPBinding.yaml'
  tool_policy_changes:
    $ref: './ToolPolicyChanges.yaml'
  name:
    type: string
    minLength: 1
    description: New display name. Rejected on locked agents.
    example: "My Renamed Agent"
  description:
    type: string
    description: >
      New description. Rejected on locked agents. Empty string removes it. For Subagent /
      subagent_3p, an empty string after trim is rejected 400 (description is required for
      workers per the routing contract).
    example: "Updated description"
  model:
    type: string
    description: New model slug. Allowed on all agents. With the O3 two-field model,
      pair with `provider` for explicit routing.
    example: "google/gemini-2.5-flash"
  provider:
    type: string
    maxLength: 64
    description: >
      New explicit routing key for the primary model (O3 two-field model). When
      set, resolution uses it directly and never infers a provider. Allowed on all
      agents. Send an empty string to clear it (fall back to default-provider
      resolution).
    example: "openrouter"
  context_window_override:
    type: integer
    minimum: 1
    nullable: true
    description: >
      Per-agent context-window override in tokens (ADR-066 D2 rung 1, D9).
      Lower-only — clamped to the model's capability on resolution (a WARN
      names the agent and the clamp). Send null to clear. Every write
      triggers a registry reload so the next turn uses the new window.
    example: 200000
  soul:
    type: string
    minLength: 1
    description: >
      New SOUL.md content (agent system prompt). Rejected on locked core
      agents. Exception (ADR-052 FR-038, soul/rubric unification): accepted
      for locked `type: system` agents (e.g. the Judge) — for those, this
      field IS the judging rubric, the only prompt-equivalent field a
      locked System Agent accepts. Writing this triggers a config reload.
      Whitespace-only is rejected as minLength violation.
    example: "You are a helpful assistant..."
  max_tool_iterations:
    type: integer
    description: New maximum tool calls per turn. Allowed on all agents.
    example: 100
  color:
    type: string
    pattern: '^#[0-9A-Fa-f]{6}$'
    description: Hex color code for agent avatar display (e.g. "#D4AF37").
    example: "#D4AF37"
  icon:
    type: string
    maxLength: 50
    description: Phosphor icon name for agent avatar (e.g. "Robot", "Octopus").
    example: "Robot"
  fallback_models:
    type: array
    maxItems: 2
    items:
      $ref: './FallbackModel.yaml'
    description: >
      Replace the agent's fallback model chain (Phase 1B / FR-005). Each
      entry carries its own provider so the fallback can route through
      a different provider than the primary (FR-007). Capped at 2 entries.
      Rejected 400 on subagent_3p agents (CLI handles its own retries).

      Wire format is always the object form `[{model, provider}]`. Legacy
      `[string]` payloads are normalized at config-load time (FR-006).
    example:
      - model: "claude-sonnet-4.6"
        provider: "anthropic"
  model_params:
    type: object
    description: >
      LLM sampling parameters applied to this agent's requests. Rejected 400 on
      subagent_3p agents (CLI may not support these flags).
    properties:
      temperature:
        type: number
        format: double
        description: Sampling temperature (0.0 – 2.0). Lower = more deterministic.
        example: 1.0
      max_tokens:
        type: integer
        description: Maximum tokens to generate per turn.
        example: 4096
  tools_cfg:
    $ref: './AgentToolsCfg.yaml'
  default:
    type: boolean
    description: >
      Send true to make this agent the global default that handles inbound
      messages with no more-specific routing rule — replacing whichever agent
      previously held it. Send false to clear the default, which only has an
      effect if this agent currently holds it (sending false for an agent
      that isn't the current default is a no-op). Omitting this field leaves
      the default unchanged. Chat-capable core and custom Main agents only; workers, hidden and external
      agents cannot be defaults. This does not change workspace membership.
    example: false
  skills:
    type: array
    uniqueItems: true
    items:
      type: string
    description: >
      Replace the agent's skill list. Only the skill IDs in this list will
      be granted; omitting this field leaves the existing list unchanged.
      Send an empty array to remove all skills. Rejected 400 on subagent_3p agents
      (CLI doesn't see Omnipus skills).
    example:
      - "web-research"
  voice:
    type: string
    nullable: true
    description: >
      Per-agent persona voice identifier. Schema-pinned; not active until v0.2.0 TTS.
      Send null to clear. Main only.
    example: "alloy"
  executor:
    $ref: './ExecutorConfig.yaml'
  memory_enabled:
    type: boolean
    description: >
      New value for the memory-injection gate (ADR-052 FR-039). When false,
      ContextBuilder skips memory injection for this agent's turns. Editable where supported for ordinary/custom agents; fixed false on hidden roles.
    example: true
