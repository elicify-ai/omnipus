type: object
description: >
  Body for PUT /agents/{id}. All fields are optional — only provided fields are updated.
  Locked (core) agents reject mutations to name, description, soul, heartbeat, instructions.
  model, timeout_seconds, max_tool_iterations, steering_mode, tool_feedback,
  heartbeat_enabled, and heartbeat_interval may be updated on locked agents.
  At least one field must be present (minProperties: 1) — empty patches are rejected 400.
minProperties: 1
additionalProperties: false
properties:
  name:
    type: string
    minLength: 1
    description: New display name. Rejected on locked agents.
    example: "My Renamed Agent"
  description:
    type: string
    description: New description. Rejected on locked agents. Empty string removes it.
    example: "Updated description"
  model:
    type: string
    description: New model name. Allowed on all agents.
    example: "gpt-4o"
  soul:
    type: string
    description: >
      New SOUL.md content (agent system prompt). Rejected on locked agents.
      Writing this triggers a config reload.
    example: "You are a helpful assistant..."
  heartbeat:
    type: string
    description: >
      New HEARTBEAT.md content. Rejected on locked agents.
      Writing this triggers a config reload.
    example: "Check queue every hour."
  instructions:
    type: string
    description: >
      New AGENT.md body (after frontmatter). Rejected on locked agents.
      Writing this triggers a config reload.
    example: "Focus on Python only."
  timeout_seconds:
    type: integer
    description: New timeout in seconds per turn. Allowed on all agents.
    example: 600
  max_tool_iterations:
    type: integer
    description: New maximum tool calls per turn. Allowed on all agents.
    example: 100
  steering_mode:
    type: string
    description: New steering mode. Allowed on all agents.
    example: "one-at-a-time"
  tool_feedback:
    type: boolean
    description: Enable/disable tool feedback loop. Allowed on all agents.
    example: true
  heartbeat_enabled:
    type: boolean
    description: Enable/disable heartbeat loop. Allowed on all agents.
    example: false
  heartbeat_interval:
    type: integer
    description: New heartbeat interval in seconds. Allowed on all agents.
    example: 1800
  sandbox_profile:
    type: string
    enum:
      - workspace
      - workspace+net
      - host
      - off
    description: >
      New sandbox profile. "off" requires --allow-god-mode at gateway boot (403 otherwise).
    example: "workspace"
  shell_policy:
    type: object
    description: Per-agent shell command deny-pattern configuration.
    properties:
      enable_deny_patterns:
        type: boolean
        example: true
      custom_deny_patterns:
        type: array
        items:
          type: string
        description: Must each be valid Go regexp patterns (400 on invalid regexp).
        example:
          - "rm -rf /"
  color:
    type: string
    pattern: '^#[0-9A-Fa-f]{6}$'
    description: Hex color code for agent avatar display (e.g. "#D4AF37").
    example: "#D4AF37"
  icon:
    type: string
    maxLength: 50
    description: Phosphor icon name for agent avatar (e.g. "Robot", "Octopus").
    example: "Robot"
  fallback_models:
    type: array
    maxItems: 10
    items:
      type: string
    description: >
      Ordered list of fallback model IDs tried when the primary model returns an
      error. Each entry may be a bare model name or "provider/model" format.
    example:
      - "anthropic/claude-3.5-haiku"
  model_params:
    type: object
    description: LLM sampling parameters applied to this agent's requests.
    properties:
      temperature:
        type: number
        format: double
        description: Sampling temperature (0.0 – 2.0). Lower = more deterministic.
        example: 1.0
      max_tokens:
        type: integer
        description: Maximum tokens to generate per turn.
        example: 4096
      top_p:
        type: number
        format: double
        description: Nucleus sampling probability mass. 1.0 disables nucleus sampling.
        example: 1.0
  rate_limits:
    type: object
    description: Per-agent rate-limit overrides. When use_global_defaults is true the global policy applies.
    properties:
      use_global_defaults:
        type: boolean
        description: When true, global rate limits are used and per-agent overrides are ignored.
        example: true
      max_llm_calls_per_hour:
        type: integer
        description: Maximum LLM API calls per hour for this agent. Absent = no per-agent cap.
        example: 100
      max_tool_calls_per_minute:
        type: integer
        description: Maximum tool calls per minute for this agent. Absent = no per-agent cap.
        example: 60
      max_cost_per_day:
        type: number
        format: double
        description: Maximum USD cost per day for this agent. Absent = no per-agent cap.
        example: 5.0
  tools_cfg:
    $ref: './AgentToolsCfg.yaml'
  default:
    type: boolean
    description: >
      Whether this agent is the global default that handles inbound messages
      with no more-specific routing rule. At most one agent is default.
      Omitting this field leaves the flag unchanged.
    example: false
  skills:
    type: array
    uniqueItems: true
    items:
      type: string
    description: >
      Replace the agent's skill list. Only the skill IDs in this list will
      be granted; omitting this field leaves the existing list unchanged.
      Send an empty array to remove all skills.
    example:
      - "web-research"
