type: object
description: >
  A single configurable non-LLM integration provider as surfaced in Settings →
  Integrations (FR-12.1). Covers web-search providers (SearchProvider) and
  voice-input transcription providers (Transcriber). API keys are stored
  encrypted in credentials.json (via api_key_ref) — never returned in plaintext;
  configured is true when a key (or, for keyless providers like DuckDuckGo, the
  provider itself) is available.
  ADR-096: search rows additionally carry the provider's resolved web-search
  roles — default vs fallback — and its usability, and id is an enum derived
  from the single search-provider catalogue (FR-035). Voice rows keep today's
  shape: they report active only and leave the search-role fields unset.
required:
  - id
  - kind
  - display_name
  - configured
  - requires_key
additionalProperties: false
properties:
  id:
    type: string
    description: >
      Provider identifier, from the single integration catalogue — not free-form.
      The search ids (brave, tavily, perplexity, duckduckgo, searxng, glm, baidu,
      exa) derive from the searchProviderCatalogue (ADR-096 FR-035); the voice ids
      (elevenlabs, groq, audio-model) are listed so voice rows stay valid under
      this shared schema. searxng appears as a default only on installs whose
      configuration already resolved to it (ADR-096 D10).
    enum:
      - brave
      - tavily
      - perplexity
      - duckduckgo
      - searxng
      - glm
      - baidu
      - exa
      - elevenlabs
      - groq
      - audio-model
    example: "brave"
  kind:
    type: string
    enum:
      - search
      - voice
    description: Whether this provider supplies web search or voice-input transcription.
    example: "search"
  display_name:
    type: string
    description: Human-readable provider name for UI presentation.
    example: "Brave Search"
  configured:
    type: boolean
    description: >
      True when this provider is usable — an API key is present (or, for keyless
      providers such as DuckDuckGo, always true).
    example: true
  requires_key:
    type: boolean
    description: Whether this provider needs an API key to function.
    example: true
  active:
    type: boolean
    description: >
      True when this provider is the one currently selected for its kind. Voice
      rows: unchanged — the active transcriber. Search rows: true only when this
      row is the web-search default (ADR-096 D13 — no longer "whoever the old
      priority list picked"); kept so an older client still has the field. The
      Default/Fallback badges are built from default_search, fallback_search and
      the row's own usable flag instead.
    example: true
  usable:
    type: boolean
    description: >
      Search rows only; unset on voice rows. The tool's usability test (ADR-096
      Definitions): switched on and a required key resolves to a non-empty
      process value — or, for DuckDuckGo, simply switched on. False when the key
      name is set but the resolved key is empty ("key not reaching search"). This
      is the badge test; configured (the secret is in the vault) is not it.
    example: true
  fallback:
    type: boolean
    description: >
      Search rows only; unset on voice rows. True when this provider is the
      resolved web-search fallback — the provider tried once when the default
      fails with a hop-class failure (ADR-096 D4, D17).
    example: false
  fallback_automatic:
    type: boolean
    description: >
      Search rows only; unset on voice rows. True when this row is the fallback
      because the stored fallback value is absent and the automatic rule (R3)
      resolved it to DuckDuckGo — not because the operator picked the fallback
      radio. Set together with fallback: true.
    example: false
