title: SessionSnapshotFrame
description: >
  Server to client. Bounded latest-page metadata when attach_session cannot serve
  the requested live position (chat history paging D7/D10). Read the page before
  announcing replacement. Follow with current session_state, selected entry-derived
  history/tool/special/media frames carrying local history_origin, one replay done,
  uncovered active projection, then catch_up_complete(mode=snapshot) at this seq;
  held live frames follow in sequence order. No second entries array or manifest.
  First-open/follow-latest clients stage and commit this page once on completion.
  A historical reader instead keeps its rows, anchor, focus and measurements, stages
  the page into its separate bounded tail cache, refreshes authoritative controls,
  and revalidates only its already-held interval after complete. A reason does not
  authorize a passive jump to latest. A classified history-only failure sends no
  snapshot/wipe and may complete live_only controls instead. Partial failed control
  or socket delivery never acknowledges a successful catch-up.
type: object
required:
  - type
  - session_id
  - seq
  - has_earlier
  - has_later
  - page_info
additionalProperties: false
properties:
  type:
    type: string
    const: session_snapshot
  session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: Session whose latest history page and current controls follow.
  seq:
    type: integer
    format: int64
    minimum: 1
    description: >
      Live high-water W at bind/read cut, mirrored on catch_up_complete. Commit
      only after the full selected-page/current-control catch-up completes; not a
      history position. Subsequent held live frames continue at seq greater than W.
  boot_id:
    type: string
    description: >
      Gateway process identity, stored with the successfully completed live cursor;
      same role as SessionStateFrame.boot_id / AttachSessionFrame.boot_id.
  has_earlier:
    type: boolean
    description: Actual retained earlier groups; a reached closed clear needs explicit crossing.
  has_later:
    type: boolean
    description: Actual eligible retained later groups at this same page cut.
  next_before:
    type: string
    minLength: 47
    maxLength: 47
    pattern: '^hp1_[A-Za-z0-9_-]{43}$'
    description: Present iff has_earlier, equal to page_info.first_position.
  next_after:
    type: string
    minLength: 47
    maxLength: 47
    pattern: '^hp1_[A-Za-z0-9_-]{43}$'
    description: Present iff has_later, equal to page_info.last_position.
  page_info:
    $ref: './SessionHistoryPageInfo.yaml'
    description: Same latest-mode metadata/context/range as the shared REST reader; no entries array.
  reason:
    type: string
    enum:
      - cursor_ahead
      - retention_exceeded
      - unknown_position
      - boot_mismatch
    description: >
      Why snapshot replaces incremental catch-up: cursor_ahead is beyond the hub,
      retention_exceeded is an unservable retained journal range, unknown_position
      means no known cursor, boot_mismatch is a different gateway process and wins
      before ordinary servability checks. None forces a historical reader to latest.
  secret_requests:
    type: array
    maxItems: 1000
    items:
      $ref: './SessionStateSecretRequest.yaml'
    description: >
      Spec omnipus-system-agent K4 (FR-079). Pending and recent terminal
      secret requests visible to this connection, so a reloaded secret card
      restores its true state. Always an array when present, never null;
      absence of a request is never read as success. Optional: an emit that
      carries no secret-request state omits it.
