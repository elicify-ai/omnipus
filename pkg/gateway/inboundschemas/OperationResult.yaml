title: OperationResult
description: >
  Generic success/failure envelope for simple admin operations.
  Used by endpoints that perform an action and return only whether it succeeded.
type: object
required:
  - success
additionalProperties: false
properties:
  success:
    type: boolean
    description: True when the operation succeeded.
    example: true
  error:
    type: string
    description: Human-readable error message. Present only when success=false.
    example: no API key configured for this provider
