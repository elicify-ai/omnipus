type: object
description: >
  Body for POST /onboarding/probe-provider. Tests an API key against a provider
  and returns available models. Non-persistent — nothing is written to disk.
  CSRF-exempt. Returns 409 once onboarding is complete.
required:
  - id
  - api_key
additionalProperties: false
properties:
  id:
    type: string
    minLength: 1
    enum:
      - anthropic
      - anthropic-messages
      - openai
      - openrouter
      - gemini
      - google
      - ollama
      - azure
      - azure-openai
      - bedrock
      - litellm
      - groq
      - zhipu
      - z-ai
      - zai
      - nvidia
      - moonshot
      - shengsuanyun
      - deepseek
      - cerebras
      - vivgrid
      - volcengine
      - vllm
      - qwen
      - qwen-intl
      - qwen-international
      - dashscope-intl
      - qwen-us
      - dashscope-us
      - mistral
      - avian
      - longcat
      - modelscope
      - novita
      - coding-plan
      - alibaba-coding
      - qwen-coding
      - mimo
      - minimax
      - coding-plan-anthropic
      - alibaba-coding-anthropic
      - antigravity
      - claude-cli
      - claudecli
      - codex-cli
      - codexcli
      - github-copilot
      - copilot
    description: >
      Provider protocol identifier. Must be one of the recognized protocol names
      that Omnipus can connect to. Validated server-side against the known protocol
      registry (pkg/providers.IsKnownProtocol).
    example: "openrouter"
  api_key:
    type: string
    minLength: 1
    description: API key to test against the provider.
    example: "sk-or-..."
  endpoint:
    type: string
    description: >
      Optional override for the provider's API base URL. When omitted, the server
      uses the provider's well-known default endpoint.
    example: "https://openrouter.ai/api/v1"
