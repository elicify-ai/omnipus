title: SessionStateSecretRequest
description: >
  One entry of the `secret_requests` list on SessionStateFrame and
  SessionSnapshotFrame (spec omnipus-system-agent K4; FR-074, FR-079): a
  pending request, or a recent terminal one (value-free; at most the last
  32 terminal entries per session, §6.2), so a reloaded card restores its
  true state. Absence of an entry is never success. Same card fields as
  SecretRequestFrame plus `state`. Mirrored inline in
  contracts/asyncapi.yaml (components.schemas.SessionStateSecretRequest) —
  keep both copies in sync by hand.
type: object
required:
  - request_id
  - session_id
  - state
  - acting_agent_id
  - acting_agent_name
  - purpose
  - recipient
  - fields
  - updated_at
additionalProperties: false
properties:
  request_id:
    type: string
    minLength: 1
    maxLength: 128
  session_id:
    type: string
    minLength: 1
    maxLength: 255
  root_session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: Same value and semantics as SecretRequestFrame.root_session_id.
  state:
    type: string
    enum:
      - pending
      - submitted
      - cancelled
      - stopped
      - interrupted
      - refused
  continuation_unconfirmed:
    type: boolean
    description: >
      True only when state is `submitted` and the value-free continuation
      (the reference-only resume message) is not confirmed delivered: the
      latest ensure-delivery attempt failed or was revoked downstream.
      Absent once delivery is confirmed, the person stops the continuation,
      or the request reaches any non-submitted terminal state. Never carries
      or implies a secret value, cause, stage or reference name. (Train 2
      M13, T2-SF-02; K4, FR-079.)
  acting_agent_id:
    type: string
    minLength: 1
    maxLength: 128
  acting_agent_name:
    type: string
    minLength: 1
    maxLength: 128
  origin_label:
    type: string
    minLength: 1
    maxLength: 200
  workspace_id:
    type: string
    minLength: 1
    maxLength: 128
  owner:
    $ref: './AgentAddress.yaml'
    description: Present only for the agent_private kind.
  purpose:
    type: string
    minLength: 1
    maxLength: 500
  recipient:
    $ref: './SecretRecipientDisplay.yaml'
  fields:
    type: array
    minItems: 1
    maxItems: 8
    items:
      $ref: './SecretRequestField.yaml'
  reference_names:
    type: array
    maxItems: 8
    items:
      type: string
      minLength: 1
      maxLength: 256
    description: >
      Reference names the submitted values were stored under. Present only
      when state is `submitted`.
  updated_at:
    type: string
    format: date-time
    description: When the request last changed state.
