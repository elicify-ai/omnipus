type: object
description: >
  Body for POST /agents. Creates a new custom agent. A UUID is assigned by the server.
  The agent starts in "draft" status (no SOUL.md written yet).
required:
  - name
additionalProperties: false
properties:
  name:
    type: string
    minLength: 1
    description: Display name for the new agent.
    example: "My Custom Agent"
  description:
    type: string
    description: Short description of the agent's purpose.
    example: "Specialized data analysis assistant"
  model:
    type: string
    description: >
      Model name for LLM calls. When omitted, the global agents.defaults.model_name is used.
    example: "claude-sonnet-4-6"
  color:
    type: string
    description: Hex color code for the agent avatar.
    example: "#D4AF37"
  icon:
    type: string
    description: Phosphor icon name for the agent avatar.
    example: "ChartBar"
  tools_cfg:
    $ref: './AgentToolsCfg.yaml'
  fallback_models:
    type: array
    maxItems: 10
    items:
      type: string
    description: >
      Ordered list of fallback model IDs tried when the primary model returns an
      error. Each entry may be a bare model name or "provider/model" format.
    example:
      - "anthropic/claude-3.5-haiku"
  model_params:
    type: object
    description: LLM sampling parameters applied to this agent's requests.
    properties:
      temperature:
        type: number
        format: double
        description: Sampling temperature (0.0 – 2.0). Lower = more deterministic.
        example: 1.0
      max_tokens:
        type: integer
        description: Maximum tokens to generate per turn.
        example: 4096
      top_p:
        type: number
        format: double
        description: Nucleus sampling probability mass. 1.0 disables nucleus sampling.
        example: 1.0
  rate_limits:
    type: object
    description: Per-agent rate-limit overrides. When use_global_defaults is true the global policy applies.
    properties:
      use_global_defaults:
        type: boolean
        description: When true, global rate limits are used and per-agent overrides are ignored.
        example: true
      max_llm_calls_per_hour:
        type: integer
        description: Maximum LLM API calls per hour for this agent. Absent = no per-agent cap.
        example: 100
      max_tool_calls_per_minute:
        type: integer
        description: Maximum tool calls per minute for this agent. Absent = no per-agent cap.
        example: 60
      max_cost_per_day:
        type: number
        format: double
        description: Maximum USD cost per day for this agent. Absent = no per-agent cap.
        example: 5.0
  skills:
    type: array
    uniqueItems: true
    items:
      type: string
    description: >
      Initial list of skill IDs granted to this agent. An empty list (or
      absent field) means no skills are granted (opt-in, default none).
    example:
      - "web-research"
  executor:
    $ref: './ExecutorConfig.yaml'
