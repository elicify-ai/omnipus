type: object
description: >
  Returned on successful login or onboarding/complete. Contains the bearer
  token to use in subsequent Authorization headers and the username.
required:
  - token
  - username
additionalProperties: false
properties:
  token:
    $ref: './BearerToken.yaml'
  username:
    type: string
    description: The authenticated user's login name.
    example: "admin"
  warning:
    type: string
    description: >
      Non-fatal advisory message. Present on onboarding/complete for either of
      two independent reasons, mutually exclusive on a single response: (1)
      the credential store is locked and the API key was stored in plaintext,
      or (2) the provider API key was submitted but could not be positively
      verified — the provider was unreachable, the key has no credit, access
      is regionally/model restricted, or no endpoint was available to probe
      against. Absent entirely when the key was actively verified as valid.
      A key the provider actively confirms is WRONG is never represented via
      this field — that outcome rejects the request with 400 instead (see
      POST /onboarding/complete). Never present on POST /auth/login.
    example: "Couldn't reach OpenAI to check the key — check your internet connection. Continuing for now; the key will be used as entered."
