title: CliDetectEntry
description: >
  Host-side detection result for a single external-CLI runner binary
  (claude-code/codex/opencode). The gateway searches its own $PATH first,
  then a curated per-OS well-known-install-location list, and reports which
  strategy found the binary via `source`. Detection is a filesystem probe
  only — it never spawns a subprocess.
type: object
required:
  - installed
additionalProperties: false
properties:
  installed:
    type: boolean
    description: Whether the binary was located on $PATH or in a well-known install directory.
    example: true
  path:
    type: string
    nullable: true
    description: >
      Absolute, symlink-resolved path to the binary (the final file). Null
      when installed=false. Not the value to pre-fill into Settings ->
      Third-party agents: a versioned symlink target would break on the next
      package update; pre-fill from link_path when present, else this path.
    example: "/opt/homebrew/Cellar/claude/1.2.3/bin/claude"
  link_path:
    type: string
    nullable: true
    description: >
      The path as found on $PATH or in a well-known install folder, BEFORE
      symlink resolution (equal to `path` when no symlink is involved). Null
      when installed=false. The Settings -> Third-party agents screen
      pre-fills its program path from this value when present, else from
      `path`.
    example: "/opt/homebrew/bin/claude"
  source:
    type: string
    nullable: true
    enum:
      - path
      - well-known
    description: >
      How the binary was located: "path" when found via the gateway process's
      $PATH (exec.LookPath-equivalent, no shell), "well-known" when found only
      by scanning the curated per-OS candidate directories. Null when
      installed=false. $PATH results take precedence over well-known when both
      are present.
    example: "path"
