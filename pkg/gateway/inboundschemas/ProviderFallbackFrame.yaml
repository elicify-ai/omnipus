title: ProviderFallbackFrame
description: >
  Server → client (provider-messages spec §7.1 item 3). Announces that a turn
  was answered by the fallback model because another candidate could not answer
  (hard provider trouble or a rate-limit cooldown skip — the frame itself does
  NOT distinguish the two; that distinction lives only in the once-per-pair
  note rate and the session transcript, C-18/MIN-103 — the round-2 `reason`
  enum was dropped as unused, OBS-103).
type: object
required:
  - type
  - session_id
  - turn_id
  - answered_model
  - unavailable_model
  - unavailable_code
additionalProperties: false
properties:
  type:
    type: string
    const: provider_fallback
  session_id:
    type: string
    minLength: 1
    maxLength: 128
    description: Session whose turn fell back.
  turn_id:
    type: string
    minLength: 1
    maxLength: 128
    description: Turn that was answered by the fallback model.
  answered_model:
    type: string
    minLength: 1
    maxLength: 256
    description: Model id of the fallback candidate that answered. "Fallback model" naming lives in UI copy, not on the wire (D7).
  unavailable_model:
    type: string
    minLength: 1
    maxLength: 256
    description: Model id of the unavailable candidate — the PRIMARY (first candidate) in a multi-hop chain (MIN-103).
  unavailable_code:
    type: string
    enum:
      - rate_limited
      - model_retired
    description: The classified provider condition that made the unavailable candidate miss the turn. Gates the D12 pick-a-new-model hint in the persisted note (§6).
  seq:
    type: integer
    format: int64
    minimum: 1
    description: >-
      Per-session sequence number of this frame (#823 catch-up redesign). Strictly
      increasing and gap-free within the session, assigned by the gateway's per-session
      hub as the single chokepoint through which every session-scoped frame is published.
      Optional: absent on an unsequenced copy of this frame (for example a broadcast
      delivered to a tab that is not bound to this session) — the client only advances its
      per-session cursor for frames that carry seq. The client stores the highest seq it
      has applied per session and sends it back as since_seq on attach_session; frames at
      or below that cursor are ignored, which makes re-delivery idempotent.
