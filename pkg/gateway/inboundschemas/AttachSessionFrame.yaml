title: AttachSessionFrame
description: >
  Client → server. Requests the server to attach to a session and catch it up to the
  present. A snapshot replays a bounded latest page; an authorized history-only
  failure can instead deliver typed history_state=unavailable and live_only control
  catch-up, never a successful history snapshot. Authenticate and resolve session
  syntax/access/existence before validating history_limit, then history_min_rows,
  before bind/wipe. Keep inbound-validation on/off refusal parity. #823 catch-up
  redesign: since_seq/boot_id replace the retired timestamp cursor
  (`since`, removed). The server answers with the full servable incremental journal
  (session_state, journal entries after since_seq, catch_up_complete) or a bounded
  latest snapshot (session_snapshot, current session_state, selected historical
  frames, one replay done, uncovered active projection, catch_up_complete). Held
  live frames follow complete in order; replay done alone never completes attach.
  SessionSnapshotFrame explains why a snapshot is selected. A historical reader
  keeps/revalidates its own interval instead of passively jumping to the new tail.
type: object
required:
  - type
  - session_id
additionalProperties: false
properties:
  type:
    type: string
    const: attach_session
  session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: Session ID to attach to and catch up.
  history_limit:
    type: integer
    minimum: 20
    maximum: 100
    default: 40
    description: >
      Optional snapshot-only drawn-row target; never cuts a servable incremental
      journal. Validate after session access and before history_min_rows/bind/wipe.
      Null, wrong type, fraction, overflow or out-of-range values are refused by
      the session-scoped ErrorFrame message "history_limit must be an integer from
      20 to 100", with no successful complete, in both inbound validation modes.
  history_min_rows:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
    description: >
      Optional snapshot-only advisory two-screen row floor, from 1 to effective
      history_limit; default 20. Whole groups/floor override soft page bytes.
      After a valid history_limit, invalid/null/fraction/overflow/wrong-type values
      get "history_min_rows must be an integer from 1 to history_limit" before
      bind/wipe, with no catch_up_complete in either inbound validation mode.
  since_seq:
    type: integer
    format: int64
    minimum: 1
    description: >-
      #823 catch-up redesign. Highest per-session sequence number the SPA has already
      applied for this session. The server serves only frames with a strictly greater
      seq ("from since_seq + 1"), so re-attaching is idempotent and O(missed window)
      instead of O(full session history). Works for every session the client knows
      about, including ones that were not open in the UI during the outage — the client
      keeps one cursor per session. Omit for a first load or whenever the session's
      cursor is not known: the server then answers with a bounded latest snapshot
      (reason unknown_position). When the requested position can no longer be served
      from the retained journal, it likewise answers with session_snapshot (reason
      retention_exceeded or cursor_ahead). First open/follow-latest replaces its staged
      history page on complete; a historical reader preserves/revalidates its own
      bounded interval separately. Neither policy alters transport cursor semantics.
  boot_id:
    type: string
    description: >
      #823 review finding 7 — the gateway boot ID the SPA last saw for this
      session (from a prior session_state frame's own boot_id), sent back so
      the server can tell a genuinely-servable since_seq apart from one that
      only LOOKS servable because a restarted gateway's counter has not yet
      caught back up past it. Omit when unknown (a first load, or an older
      SPA build that predates this field): the server then falls back to
      since_seq alone, same as before this field existed. When present and it
      does not match the server's current boot_id, the server answers with a
      session_snapshot (reason boot_mismatch) regardless of what since_seq
      says — a numeric position from a previous gateway process carries no
      meaning against the current one's counter. Keep in sync by hand with
      contracts/asyncapi.yaml's inline AttachSessionFrame.
  ack_attention:
    type: boolean
    default: false
    description: >
      Optional. True means this attach is an acknowledgement of what was
      shown. It does not choose the bound. Defaults to false. A failed,
      background, or reconnect attach does not write the seen mark.
      Keep in sync by hand with contracts/asyncapi.yaml's inline
      AttachSessionFrame.
  attention_bound:
    type: integer
    format: int64
    minimum: 0
    description: >
      Optional integer on the acknowledging attach. The saved outcome/entry
      order, not a new counter. When an acknowledgement carries this number,
      the server advances the one shared seen mark to the lesser of this
      number and the current saved order (never lowering it). Absent means do
      not write the seen mark and do not substitute the current order. Keep in sync by hand with contracts/asyncapi.yaml's inline
      AttachSessionFrame.
