type: object
description: Standard error envelope returned by all non-2xx responses.
required:
  - error
properties:
  error:
    type: string
    description: Human-readable error message.
    example: "user not found"
  code:
    type: string
    description: >
      Machine-readable error code for programmatic branching (e.g.
      "csrf_missing", "rate_limited"). PUT
      /settings/third-party-agents uses "cli_path_invalid" (field
      clis.<cli>.path; details.cli, details.check one of not_absolute,
      not_found, not_regular_file, not_executable, agent_writable_location,
      location_unverifiable, windows_extension, windows_short_name,
      windows_stream; the response never carries the path, which goes to
      the server log only;
      location_unverifiable means the list of folders agents can write to (the
      Omnipus home, agent homes, workspace folders, workspace mounts, the
      extra folders the sandbox lets agents write and the per-user temporary
      folder) could not be read in full,
      so the location cannot be checked)
      and
      "cli_preset_invalid" (field clis.<cli>.preset_args; details.cli,
      details.check one of too_long, contains_nul, contains_line_break).
      "saved_not_refreshed" is a 500 whose write reached disk but whose
      running settings could not be refreshed; the settings endpoint that
      answers it is named here: PUT /settings/third-party-agents (existing),
      PUT /config and PUT /settings/context (Settings redesign #1519, C-6
      outcome table). A 500 with this code means saved, not in use — never
      "not saved".
      The package routes (/packages/export, /packages/import,
      /packages/import/{staging_id}/apply) use: export_selection_invalid,
      agent_not_found, core_agent_not_exportable, agent_prompt_missing,
      agent_file_unreadable (details.file, details.check one of link,
      not_regular, unreadable, too_large), audit_failed, not_a_package,
      package_too_new, element_schema_too_new, package_too_large
      (details.limit one of window, decoded, entries, manifest, agent_file,
      body), checksum_mismatch (details.file), manifest_mismatch
      (details.file or details.element), unsafe_path (details.file),
      unsafe_entry_type (details.file), no_supported_element,
      too_many_agents, element_type_not_supported, invalid_element,
      element_not_creatable (field, details.reason),
      external_worker_not_supported_yet, too_many_staged_imports,
      import_mode_not_available, staging_not_found, import_in_progress,
      workspace_not_found, default_workspace_missing,
      name_suffix_exhausted, import_rolled_back and
      import_rollback_incomplete (details.failed_step C1 or C2,
      details.leftovers, details.agent_id, details.staging_id).
    example: "csrf_missing"
  field:
    type: string
    description: >
      Names the request field the error is about (ADR-068 validation bodies,
      e.g. "provider", "model", "id", "auth", "api_key"). Present only on
      field-attributable 4xx validation errors.
    example: "provider"
  details:
    type: object
    description: >
      Optional structured details about the error. For `cli_path_invalid` and
      `cli_preset_invalid`: `cli` (`claude-code`, `codex` or `opencode`) and
      `check` (the failed check's name). No path is returned; path-check
      diagnostics are recorded in the server log. For `saved_not_refreshed`:
      `keys`, an array of the dotted config keys the body changed (for
      example ["gateway.log_level", "context.mcp_result_cap"]), which are
      also recorded as apply_failed entries in GET /config/pending-restart.
    additionalProperties: true
