title: DoneStats
description: >
  Statistics payload included in a done frame. Per-turn numeric fields default
  to 0 when not applicable (e.g., a turn with no LLM calls). The optional absolute
  session_tokens_total is omitted when unknown, never defaulted to 0. Additional diagnostic
  keys may be present from replay (frames_emitted, orphan_count,
  duplicate_tool_call_id_count, truncated_result_count, replay_error).
  additionalProperties: true is intentional — replay extras are allowed.
type: object
additionalProperties: true
properties:
  tokens:
    type: integer
    minimum: 0
    description: Total tokens consumed in this turn (input + output).
  session_tokens_total:
    type: integer
    minimum: 0
    readOnly: true
    description: >
      Authoritative absolute session-wide consumed-token total, with the same
      meaning as SessionStats.tokens_total. Present on live turn completion when
      authoritative usage is available; omitted on replay-terminating done frames.
      Omitted means unknown, never zero. Not a per-turn delta: tokens remains
      per-turn usage, and frames_emitted remains replay-only diagnostics.
  cost:
    type: number
    minimum: 0
    description: Total cost in USD for this turn.
  duration_ms:
    type: integer
    minimum: 0
    description: Wall-clock duration of the turn in milliseconds.
  # Replay-only diagnostics (present on done frames emitted by streamReplay)
  frames_emitted:
    type: integer
    minimum: 0
    description: Number of content frames emitted during replay. Replay-only.
  orphan_count:
    type: integer
    minimum: 0
    description: Tool calls whose parent span was not found. Replay-only.
  duplicate_tool_call_id_count:
    type: integer
    minimum: 0
    description: Tool call IDs that appeared more than once. Replay-only.
  truncated_result_count:
    type: integer
    minimum: 0
    description: Tool call results truncated to 1 MiB. Replay-only.
  replay_error:
    type: boolean
    description: >
      True when the done frame was synthesized after a replay error (W1-5).
      Replay-only.
  turn_failed:
    type: boolean
    description: >
      True when the turn ended with the engine's error fallback rather than
      a real model response. Empty-response exhaustion is an error; tool-limit
      and reconciliation endings instead carry interruption_reason and are not
      generic Failed outcomes. CLI/automation clients must treat either
      turn_failed=true or interruption_reason as non-success/incomplete.
  interruption_reason:
    type: string
    readOnly: true
    enum:
      - tool_limit
      - reconciliation_required
    description: >
      Server-produced cause of the current interruption. Omitted rather than null.
      Required for a newly recorded interrupted outcome; absent on other outcomes.
  truncated:
    type: boolean
    description: >
      ADR-087 D2 (finding #10). Mirrors Message.truncation_reason for the
      live `done` frame, so a turn cut off while the user is still watching
      renders the notice immediately instead of only after reload/reattach
      via replay. Only present when true. Absent on a normal turn.
  truncation_reason:
    type: string
    enum:
      - cancelled
      - max_output_tokens
    description: >
      ADR-087 D2 (finding #10). Mirrors Message.truncation_reason for the
      live `done` frame: narrows why `truncated` is true — "cancelled" (the
      user canceled the turn mid-stream) or "max_output_tokens" (the
      provider's output-token limit cut the answer off before it finished).
      Absent on a normal turn.
