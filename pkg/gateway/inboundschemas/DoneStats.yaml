title: DoneStats
description: >
  Statistics payload included in a done frame. All numeric fields default to 0
  when not applicable (e.g., a turn with no LLM calls). Additional diagnostic
  keys may be present from replay (frames_emitted, orphan_count,
  duplicate_tool_call_id_count, truncated_result_count, replay_error).
  additionalProperties: true is intentional — replay extras are allowed.
type: object
additionalProperties: true
properties:
  tokens:
    type: integer
    minimum: 0
    description: Total tokens consumed in this turn (input + output).
  cost:
    type: number
    minimum: 0
    description: Total cost in USD for this turn.
  duration_ms:
    type: integer
    minimum: 0
    description: Wall-clock duration of the turn in milliseconds.
  tokens_dropped:
    type: integer
    minimum: 0
    description: >
      Number of token frames dropped due to backpressure on the send channel.
      Only present when > 0.
  # Replay-only diagnostics (present on done frames emitted by streamReplay)
  frames_emitted:
    type: integer
    minimum: 0
    description: Number of content frames emitted during replay. Replay-only.
  orphan_count:
    type: integer
    minimum: 0
    description: Tool calls whose parent span was not found. Replay-only.
  duplicate_tool_call_id_count:
    type: integer
    minimum: 0
    description: Tool call IDs that appeared more than once. Replay-only.
  truncated_result_count:
    type: integer
    minimum: 0
    description: Tool call results truncated to 1 MiB. Replay-only.
  replay_error:
    type: boolean
    description: >
      True when the done frame was synthesized after a replay error (W1-5).
      Replay-only.
  turn_failed:
    type: boolean
    description: >
      True when the turn ended via the engine's error/limit fallback rather
      than a real model response. Three conditions trigger it: (1) the LLM
      returned an empty response after all retries and the engine substituted
      its internal error sentinel; (2) the tool-iteration limit was reached
      without a final response; (3) the generic empty-content exhaustion path
      at turn finalization resolved to the engine's error sentinel — but NOT
      when the caller supplied a custom success DefaultResponse (e.g. the
      heartbeat/system path's "Background task completed." string). Absent (or
      false) on a normal successful turn. This field is intentionally coarse —
      it signals that a failure occurred but carries no failure-reason
      granularity; a separate field would be needed for that detail.
      CLI/automation clients should check this field and exit non-zero when
      it is true.
