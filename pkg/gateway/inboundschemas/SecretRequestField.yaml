title: SecretRequestField
description: >
  One field of a secret card (spec omnipus-system-agent K1; FR-061). The
  card holds 1–8 fields; the user types one value per field, sent only in
  the authenticated REST submit (SecretSubmitRequest.values, keyed by
  `key`). Mirrored inline in contracts/asyncapi.yaml
  (components.schemas.SecretRequestField) — keep both copies in sync by
  hand.
type: object
required:
  - key
  - label
additionalProperties: false
properties:
  key:
    type: string
    pattern: '^[a-z][a-z0-9_]{0,31}$'
    description: Field key; the submit's `values` map uses exactly these keys.
  label:
    type: string
    minLength: 1
    maxLength: 80
    description: Field label shown on the card.
