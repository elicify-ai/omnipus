title: LibraryContentRequest
description: >
  Request body for PUT /api/v1/library/{workspace_id}/content. Writes text
  content to a file at the given workspace-relative path (library-spec.md
  D-5 editing scope), creating the file if it does not already exist and
  overwriting any existing content entirely. The path's parent directory
  must already exist within the workspace's work tree.
type: object
additionalProperties: false
required:
  - path
  - content
  - expect_version
properties:
  path:
    type: string
    minLength: 1
    description: >
      Workspace-relative path of the file to write, forward-slash
      separated. Never absolute and never containing a ".." segment
      (library-spec.md Constraints).
    example: "uploads/report.md"
  content:
    type: string
    maxLength: 10485760
    description: >
      Full replacement text content for the file, UTF-8. Maximum 10485760
      bytes (10 MB) — matches the threshold GET .../content uses to set
      too_large=true, so a file this endpoint can write is always one the
      read endpoint can subsequently render inline.
    example: "# Report\n\nStatus: green.\n"
  expect_version:
    type: string
    minLength: 1
    description: >
      The version token the caller last read for this file (ADR-083
      EMB-001/EMB-007, founder ruling N2) — the bare, UNQUOTED value of
      the ETag response header GET .../content or GET .../download most
      recently returned for this path, or the token echoed back by a
      previous PUT to this same endpoint. MANDATORY BY SERVER POLICY, with
      no exemption: a request with no expect_version, or an empty one, is
      refused with 400 rather than treated as "overwrite unconditionally".
      The write is refused with 409 (LibraryConflictError) when the
      file's current token no longer matches, so a change made by another
      writer since the caller's last read is never silently discarded.
      Sending the RFC-quoted wire form (with surrounding quotes) instead
      of the bare token is a shape error and is refused with 400, never
      409, so it can never be mistaken for a genuine conflict. The
      comparison and the write happen inside one acquisition of the same
      lock the agent write path takes.

      This field is REQUIRED (see the top-level "required" list above)
      — every caller, including the PDF annotation editor's save call and
      the plain-text editor's save call, now sends it (EMB-007c). The 409
      LibraryConflictError response carries both the expected_version the
      caller sent and the file's current actual_version, so a caller can
      reload, merge, and retry.
    example: "v1:9f2a7c40"
