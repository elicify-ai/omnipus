title: BrowserScreencastFrame
description: >
  Server → client. One CDP screencast frame (a JPEG snapshot of the live browser
  tab) plus the metadata needed to map viewer input coordinates back to the page.
  Screencast is repaint-driven, not fixed-FPS. See ADR-038.
type: object
required:
  - type
  - session_id
  - seq
  - data
  - width
  - height
additionalProperties: false
properties:
  type:
    type: string
    const: browser_screencast
  session_id:
    type: string
    minLength: 1
  seq:
    type: integer
    minimum: 0
    description: Monotonic frame sequence for this connection.
  data:
    type: string
    minLength: 1
    description: Base64-encoded JPEG image (no data URI prefix).
  width:
    type: integer
    minimum: 1
    description: Device (CSS) width of the frame in pixels.
  height:
    type: integer
    minimum: 1
    description: Device (CSS) height of the frame in pixels.
  page_scale:
    type: number
    description: CDP pageScaleFactor for the frame.
  offset_top:
    type: number
    description: CDP top offset in DIP.
  scroll_offset_x:
    type: number
  scroll_offset_y:
    type: number
