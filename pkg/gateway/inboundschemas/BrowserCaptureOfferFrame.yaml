title: BrowserCaptureOfferFrame
description: >
  Client (capture extension) → server (gateway). SDP offer from the
  encoder page's self-consuming tabCapture PeerConnection (ADR-047 D2),
  sent after a successful browser_capture_hello. Non-trickle: the encoder
  page gathers all ICE candidates before sending, so `sdp` is the complete
  offer. The gateway's Pion relay answers with browser_capture_answer and
  publishes the resulting media/audio tracks to every attached viewer PC.
  See ADR-047 D1/D2/D6.
type: object
required:
  - type
  - sdp
additionalProperties: false
properties:
  type:
    type: string
    const: browser_capture_offer
  sdp:
    type: string
    minLength: 1
    maxLength: 131072
    description: >-
      Complete SDP offer (application/sdp body) from the encoder page's
      ingest PeerConnection, ICE-gathering-complete (non-trickle).
  capture_generation:
    type: integer
    minimum: 1
    maximum: 9007199254740991
    description: >-
      Server-issued target and CSS geometry generation, scoped to the capture
      session. Input names the generation actually displayed; stale generations
      must be rejected. Viewer answers bind the negotiated stream to this value.
  target_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >-
      CDP page target identity for this capture generation. The encoder must
      verify its selected Chrome tab maps to this identity before offering.
  offer_id:
    type: integer
    minimum: 1
    maximum: 9007199254740991
    description: >-
      Encoder negotiation attempt identity on this ingest connection. The
      answer echoes this value; stale answers must never configure a newer
      peer even when the capture generation and target are unchanged.
