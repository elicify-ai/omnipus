title: TurnStartedFrame
description: >
  Server → client, live only (#1428 step 2, UAT-15 option A). Sent when a
  foreground turn of the chat session starts, to every connection bound to
  that session at that moment, so a tab knows the running turn's id before
  its first token (or when it never streams a token). Sent for every turn
  start: a new message, a queued follow-up, a redirect's new turn and a
  revived helper. The previous turn's done is always delivered before the
  next turn's turn_started. Delivered unsequenced: never numbered,
  journaled, persisted or replayed, so it has no seq property; a tab that
  reconnects learns the running turn from session_state.active_turn, which
  names the same turn. Mirrored inline in contracts/asyncapi.yaml
  (components.schemas.TurnStartedFrame) — keep both copies in sync by hand.
type: object
required:
  - type
  - session_id
  - active_turn
additionalProperties: false
properties:
  type:
    type: string
    const: turn_started
  session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: Chat session the turn runs in.
  active_turn:
    $ref: SessionStateActiveTurn.yaml
    description: >
      The turn that just started, in the same shape (and with the same values)
      as session_state.active_turn reports while it runs.
