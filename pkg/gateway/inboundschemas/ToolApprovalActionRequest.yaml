title: ToolApprovalActionRequest
description: >
  Request body for POST /api/v1/tool-approvals/{approval_id}.
  Resolves a pending tool call approval by approving, denying, or cancelling it.
type: object
additionalProperties: false
required:
  - action
properties:
  action:
    type: string
    description: Action to take on this approval.
    enum:
      - approve
      - deny
      - cancel
    example: approve
