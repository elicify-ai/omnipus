title: PerformanceSettings
description: >
  Agent concurrency and fan-out settings returned by GET /api/v1/performance.
  Controls the max-parallel gate for task/subagent dispatch — the SINGLE
  authority for agent concurrency (concurrency-gate consolidation,
  2026-08-04).
type: object
additionalProperties: false
properties:
  max_parallel_agents:
    type: integer
    minimum: 1
    description: >
      Maximum number of tasks/subagents that may run concurrently on the
      dispatch path. 0 (on the wire, surfaced here as the resolved effective
      value — see effective_max_parallel_agents) means "use the
      auto-detected default", sized from available memory
      (availableMemory / ~3.5 MB per agent), floored so a small box still
      functions. There is NO policy ceiling: an explicitly configured value
      is always honored as given (never silently clamped — only a
      floor applies). A configured value is bounded only by a documented
      PHYSICAL OS-thread-safety ceiling (around 2000) when left on
      auto-detect; an explicit value above that ceiling is still honored in
      full, with a server-side warning logged rather than the value being
      lowered. Overridden by the OMNIPUS_MAX_PARALLEL_AGENTS env var.
    example: 4
  effective_max_parallel_agents:
    type: integer
    minimum: 1
    description: >
      The resolved value actually in use (after applying the auto-detect
      memory-based heuristic or env-var override). Always present in
      responses; absent in requests.
    example: 4
  tools_on_demand:
    type: boolean
    description: >
      Tool-loading mode. true (default) — agents load tools on demand to keep
      each message small (the compressed tool manifest); a load step is required
      before a non-core tool is callable. false — every allowed tool is sent on
      every message with no loading step (more tokens per message). Maps to
      tools.manifest.compressed. Always present in responses.
    example: true
