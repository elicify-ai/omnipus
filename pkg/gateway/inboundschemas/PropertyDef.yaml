title: PropertyDef
description: >
  One declared property of a record type (ADR-068 D2, D3). EIGHT property
  types exist and no more: text, enum, relation, date, integer, decimal,
  person, checkbox.

  The count was seven through Draft 9. `checkbox` joined in spec Draft 11
  (FR-004c, ADR-068 D24.5) and this line is the record of when it changed —
  a rewrite of this sentence back to "seven" re-creates the staleness UAT
  case C-8 was written to catch. Before that, in ADR-068 revision 7, the
  membership changed while the count did not: `money` was deleted and
  `number` was split into `integer` and `decimal`.

  ARITY AND PRESENCE ARE BOTH REQUIRED FIELDS, deliberately. `many` and
  `required` carry no default and are never inferred, because the single
  most-reported failure in the research corpus is a scalar property silently
  becoming a list the moment a second value is added — after which every query
  written against it returns nothing, with no error (D3.1). A property whose
  arity is merely "absent" reproduces exactly that ambiguity on the wire.

  Property types are scoped to their record type (D3.3, FR-009): `status` on
  one type and `status` on another are unrelated declarations. This contract
  therefore never carries a vault-wide property table.

  ADR-068 D0: the product ships NO record types and NO properties of its own.
  Every PropertyDef on the wire came from a schema file the operator's vault
  declared. The names used in the examples here are illustrative of the
  mechanism only.
type: object
additionalProperties: false
required:
  - name
  - type
  - many
  - required
properties:
  name:
    type: string
    minLength: 1
    description: >
      The frontmatter key, exactly as the operator declared it. Never renamed
      and never prefixed by us — only fields Omnipus itself maintains carry
      the `omni_` prefix (D8), so removing Omnipus leaves a working note.
    example: "status"
  type:
    type: string
    enum:
      - text
      - enum
      - relation
      - date
      - integer
      - decimal
      - person
      - checkbox
    x-enum-varnames:
      - PropertyDefTypeText
      - PropertyDefTypeEnum
      - PropertyDefTypeRelation
      - PropertyDefTypeDate
      - PropertyDefTypeInteger
      - PropertyDefTypeDecimal
      - PropertyDefTypePerson
      - PropertyDefTypeCheckbox
    description: >
      "text" — prose, never validated. On the CURRENT query grammar (ruling
      R-B, the ten SQL operators of VaultFilterNode) a text property answers
      `=`, `<>`, `<`, `<=`, `>`, `>=`, `LIKE`, `IN`, `IS NULL` and
      `IS NOT NULL`. Comparison is case-INSENSITIVE over the folded value
      (ruling R-D) and `LIKE` is anchored as written — `%` and `_` are the
      only wildcards and they must be spelled. Full-text relevance retrieval
      is ADR-067's search surface, not this one.


      *The legacy seven-op vocabulary (`contains`, `is_absent`) survives ONLY
      in RecordFilter.yaml, which is the schema_version-1 view surface and is
      read verbatim under its own semantics (spec FR-018b). It is not the
      grammar of this property type; a v2 view or a knowledge_find request
      never speaks it.*
      "enum" — one of a closed SET (`values`). The set is closed; it is not
      ordered — sorting is lexical over the folded value (D4, R-5), and an
      author who wants a domain order prefixes the values: `1-lead`,
      `2-qualified`.
      "relation" — a typed edge to another record (D5); `to` names the target
      record type and `inverse` names the derived reverse direction.
      "date" — a day or an instant, comparable.
      "integer" — a signed 64-bit whole number, bound-checked and REFUSED
      outside int64 rather than saturated or widened to a float. `unit` is
      declared metadata, never glued into the property name.
      "decimal" — an exact, arbitrary-precision number, at most 100 decimal
      places; a value past the bound is refused naming it, never rounded.
      `unit` applies here too.
      "person" — a relation to a person record, kept distinct from a name
      typed as text so one vault cannot model the same concept both ways.
      "checkbox" — a YAML boolean (FR-004c, ADR-068 D24.5). The strings
      `true` and `false`, case-folded, parse; anything else is
      NON-CONFORMING and reported, never coerced. ABSENT IS THE THIRD STATE
      — "days I did not meditate" is a native question here rather than a
      trick with text. Defined operators: `=`, `<>`, `IN`, `IS NULL`,
      `IS NOT NULL`; the ordering operators are REFUSED naming the remedy
      (R-13's pattern), because a boolean has no order to compare on. It is
      the domain of the `checked` and `unchecked` aggregates
      (RecordAggregate.yaml, FR-150).
    example: "enum"
  many:
    type: boolean
    description: >
      Declared ARITY (D3.1). True means a list, false means a scalar. Writing
      a list to a scalar property is rejected with the expected shape named
      (FR-006), rather than silently widening the property.
    example: false
  required:
    type: boolean
    description: >
      True when a record of this type MUST carry the property. A record
      missing a required property is named by validation with the property and
      the reason (RecordProblem.code = missing_required).
    example: true
  label:
    type: string
    description: Human-readable label for display. Absent means render `name`.
    example: "Status"
  values:
    type: array
    description: >
      The closed value set. Present only when type is "enum", and then
      non-empty. THIS ORDER IS NOT THE SORT ORDER — it is the order a REJECTION
      lists the permitted values in, so the operator reads their own file back.


      Sorting and the `min`/`max` aggregates are LEXICAL OVER THE CASE-FOLDED
      VALUE (ruling R-5/R-E, FR-010): there is no declared-position ordinal,
      and `Won`, `won` and `WON` sort together exactly as they group together.
      A domain order is expressed by PREFIXING the values (`1-lead`,
      `2-qualified`) — visible in the operator's own file, doing exactly what
      it appears to do.
    items:
      $ref: "./EnumValueDef.yaml"
      x-go-type: EnumValueDef
  to:
    type: string
    minLength: 1
    description: >
      Target record type name. Present only when type is "relation" or
      "person". A relation pointing at a note that exists but is not of this
      type is a validation finding, not a silent accept (FR-034).
    example: "company"
  inverse:
    type: string
    minLength: 1
    description: >
      Name of the DERIVED reverse direction (D5). The inverse is computed from
      the index and is NEVER stored in any file (FR-032) — the hand-maintained
      reverse list is the field that drifts the first time anyone forgets.
    example: "deals"
  unit:
    type: string
    description: >
      Unit of measure for an "integer" or "decimal" property, declared as
      metadata rather than glued into the property name (D3). Absent means
      unitless.
    example: "minutes"
  formula:
    type: string
    minLength: 1
    description: >
      Present exactly when this property is DERIVED: the expression, as source
      text, that computes it (FR-140..FR-148, ADR-068 D24.3). Absent means the
      property is STORED — read out of a note's frontmatter like every other
      one. A derived property is never written into a note and never read from
      one; nothing about it reaches SQL.


      SOURCE TEXT, not a parse tree, for the same reason a view stores source
      (FR-141): it is human-diffable and it is comparable against the Obsidian
      original a vault was imported from.


      `type` AND `many` ANNOTATE THE RESULT, and they are CHECKED, not trusted.
      FR-143a requires every formula to have ONE static type and ONE arity,
      inferred at load before any record is read — because a formula whose type
      varies per record compares FALSE under R-1's different-domains rule with
      NO problem reported, which is a silently wrong answer wearing a type
      system. So the loader infers the expression's type and arity and REFUSES
      the schema when they disagree with what the property declared, naming
      both. A declaration nothing checks is a promise, not a type.


      REFUSED AT LOAD, each naming the property and the reason: an expression
      that does not parse (FR-140, naming the byte offset); one past FR-146's
      caps (64 nodes, depth 8 per formula; 16 formulas and 256 formula nodes
      per record type); one whose inferred type or arity contradicts `type` /
      `many`; one that produces a PRESENTATION value (`link()`, `icon()`,
      `format()`) — R-16 says a display value does not compare, so it cannot be
      a property; one on a `required` property, since nothing writes a derived
      value into a note and the requirement could never be satisfied; and one
      declaring `to` / `inverse` or a `relation` / `person` type, since a
      derived link is a presentation value rather than an edge the vault can
      target-check.


      A FORMULA MAY NAME ONLY STORED PROPERTIES OF ITS OWN RECORD TYPE, `file.`
      metadata, and literals. Naming another derived property — including
      itself — is REFUSED naming both. That is stricter than a view's
      `formulas:` map, where `formula.<name>` cross-references are legal and
      FR-148 checks their graph for cycles, and the reason is that the
      evaluator resolves a bare property name against the RECORD, where a
      derived property has no stored value: accepted, such a reference would
      evaluate to absence on every record and report nothing. Refusing it also
      makes FR-148's cycle case unreachable by construction rather than by a
      check that has to keep working — a self-reference is the smallest cycle
      and it is refused by this same rule.
    example: "amount * quantity"
