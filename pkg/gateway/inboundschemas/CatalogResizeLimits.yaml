title: CatalogResizeLimits
description: >
  Image resize limits applied by the media pipeline before an attachment is
  sent to a provider (ADR-067 [A-10]). The document carries one default and
  an optional per-provider value.
type: object
required:
  - long_edge_px
  - max_bytes
additionalProperties: false
properties:
  long_edge_px:
    type: integer
    minimum: 1
    description: Longest image edge in pixels after resize.
    example: 2000
  max_bytes:
    type: integer
    minimum: 1
    description: Maximum encoded image size in bytes.
    example: 5242880
  max_patches:
    type: integer
    minimum: 1
    description: >-
      Optional ceiling on the number of 32x32-pixel tiles a vision provider
      counts in an image, computed as ceil(width/32) * ceil(height/32)
      (e.g. OpenAI's 30,000-patch limit). Absent means the provider's patch
      accounting is unknown and no patch cap is applied for that row; a
      provider row without the field inherits the document default.
    example: 30000
