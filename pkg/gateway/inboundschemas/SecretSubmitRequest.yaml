title: SecretSubmitRequest
description: >
  Body of POST /api/v1/secret-requests/{id}/submit (spec
  omnipus-system-agent K5; FR-062, FR-063). Exactly one of `values` or
  `cancel: true`. The only place secret values ever travel. Semantic rules
  enforced by the handler with inbound validation on AND off (§7.2): the
  keys of `values` must equal the request's field keys; each value is
  4–16,384 bytes of UTF-8 without NUL; the whole body is at most 65,536
  bytes (413). The schema's character limits are deliberately no stricter
  than those byte rules. Errors never echo a value.
type: object
additionalProperties: false
oneOf:
  - required:
      - values
  - required:
      - cancel
properties:
  values:
    type: object
    minProperties: 1
    maxProperties: 8
    additionalProperties:
      type: string
      minLength: 1
      maxLength: 16384
    description: >
      Field key → typed value. Keys are the card's field keys
      (`^[a-z][a-z0-9_]{0,31}$`); the handler refuses any other key.
  cancel:
    type: boolean
    enum:
      - true
    description: The person cancelled the card; nothing is stored.
