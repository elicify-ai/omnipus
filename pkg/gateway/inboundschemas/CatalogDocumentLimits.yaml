title: CatalogDocumentLimits
description: >
  Inline-route PDF limits of a catalogue row (issue #1968). Every field is
  optional and resolved per field: the model row's document_limits, then the
  provider row's, then the catalogue's default_document_limits; a field that
  no level states means no client-side limit. Integer fields are inclusive
  (a value equal to the limit is allowed); 0 states "no limit" explicitly
  and stops the cascade. Byte values are bytes (1 MB = 1,000,000;
  1 MiB = 1,048,576, as each provider states). Limits are catalogue data
  only; the engine holds no limit value of its own.
type: object
additionalProperties: false
properties:
  inline_pdf:
    type: boolean
    x-go-name: InlinePDF
    description: >
      False when the provider has no inline PDF route, so PDFs are sent as
      extracted text. Absent at every level means true.
    example: true
  max_file_bytes:
    type: integer
    minimum: 0
    description: Maximum decoded size of one PDF in bytes.
    example: 50000000
  max_total_file_bytes:
    type: integer
    minimum: 0
    description: Maximum decoded size of all PDFs of one request in bytes.
    example: 50000000
  max_request_bytes:
    type: integer
    minimum: 0
    description: >
      Maximum size of the whole serialized request body in bytes (content,
      encoded media, tool definitions and JSON).
    example: 20000000
  max_pages_per_file:
    type: integer
    minimum: 0
    description: Maximum page count of one PDF.
    example: 100
  max_pages_per_request:
    type: integer
    minimum: 0
    description: Maximum page count of all PDFs of one request.
    example: 100
  max_documents_per_message:
    type: integer
    minimum: 0
    description: Maximum number of PDFs in one wire message.
    example: 5
  max_documents_per_request:
    type: integer
    minimum: 0
    description: Maximum number of PDFs in one request.
    example: 5
