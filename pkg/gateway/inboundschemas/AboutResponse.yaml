title: AboutResponse
description: >
  Gateway metadata returned by GET /api/v1/about.
type: object
required:
  - version
  - go_version
  - os
  - arch
  - uptime
  - uptime_seconds
  - pid
  - preview_enabled
  - warmup_timeout_seconds
  - frame_ancestors_fallback
  - device_pairing_enabled
additionalProperties: false
properties:
  version:
    type: string
    description: Omnipus gateway version string.
    example: "0.1.0"
  go_version:
    type: string
    description: Go runtime version string.
    example: "go1.22.3"
  os:
    type: string
    description: Operating system (GOOS).
    example: linux
  arch:
    type: string
    description: CPU architecture (GOARCH).
    example: amd64
  uptime:
    type: string
    description: Human-readable uptime string.
    example: "2h30m15s"
  uptime_seconds:
    type: integer
    minimum: 0
    description: Process uptime in seconds.
    example: 9015
  pid:
    type: integer
    description: Gateway process ID.
    example: 12345
  preview_enabled:
    type: boolean
    description: >
      Whether the preview feature (gateway.preview_enabled) is currently
      enabled. When true, `/preview/` is served on the main gateway listener
      (no separate preview listener/port/origin exists).
    example: true
  warmup_timeout_seconds:
    type: integer
    minimum: 0
    description: Dev-server warmup timeout from config.
    example: 30
  frame_ancestors_fallback:
    type: boolean
    description: >
      True when frame-ancestors is in fallback ('*') mode — the host is bound
      to 0.0.0.0/[::] and public_url is not set, degrading T-04 defence.
      The SPA can show a warning banner when this is true.
    example: false
  device_pairing_enabled:
    type: boolean
    description: >
      Whether the device-pairing feature (sandbox.experimental.device_pairing_enabled)
      is enabled. The pairing/approval scaffolding exists but is dark-launched
      behind this flag until the device-side request entry point is
      implemented. The SPA hides the Settings → Devices tab when false.
    example: false
