title: HealthResponse
description: >
  Response from GET /health. HTTP 200 with status "ok" when the gateway is
  serving; HTTP 503 with status "degraded" and a reason when a gateway-fatal
  condition holds (agent loop dead, config reload failed, default agent
  unloadable). The audit_* and catalog objects are FIELDS, not status
  drivers: they describe a subsystem that is degraded while the gateway
  itself is still serving, so an operator can see the problem without
  reading logs and without the process being taken out of a load balancer.
  No authentication required.
type: object
required:
  - status
additionalProperties: false
properties:
  status:
    type: string
    description: '"ok" when the gateway is serving; "degraded" alongside HTTP 503.'
    enum:
      - ok
      - degraded
    example: ok
  reason:
    type: string
    description: Why the gateway is degraded. Present only with status "degraded".
    example: "config reload failed: invalid provider entry"
  uptime:
    type: string
    description: Time since the gateway started, as a Go duration string. Absent on the degraded response.
    example: "3h12m5s"
  pid:
    type: integer
    description: Process id of the running gateway.
    example: 4711
  audit_logger:
    type: string
    enum:
      - ok
      - unavailable
      - unknown
    description: Whether the gateway constructed a working audit logger.
    example: ok
  audit_skipped:
    type: object
    description: >
      Cumulative counts of audit writes that fell through to slog because the
      logger was unavailable or a write failed with audit_fail_closed=false.
    additionalProperties: true
  audit_degraded:
    type: boolean
    description: >
      True when the operator asked for audit logging and it is not working, or
      when audit writes are being dropped. Does not change the HTTP status.
    example: false
  sandbox:
    type: object
    description: Sandbox state ({applied, mode, backend}) once Apply has completed. Absent when no sandbox hook is wired.
    additionalProperties: true
  catalog:
    type: object
    description: >
      ADR-067 FR-037 — the provider catalog's state. Degraded (with the last
      refresh error as the reason) when no document is loaded, the last
      refresh failed, the document arrived over the degraded raw-fallback
      transport, or the served document is stale (updated_at older than 14
      days). Absent when no catalog hook is wired. Does not change the HTTP
      status: a stale registry snapshot makes the model picker less accurate,
      it does not stop the gateway serving turns.
    additionalProperties: false
    required:
      - degraded
    properties:
      degraded:
        type: boolean
        example: false
      reason:
        type: string
        description: The catalog's own explanation. Present only when degraded.
        example: "catalog: served document is stale: updated_at 2026-08-01T03:00:00Z is 360h0m0s old"
