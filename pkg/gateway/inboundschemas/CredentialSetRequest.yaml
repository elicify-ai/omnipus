title: CredentialSetRequest
description: >
  Request body for POST /api/v1/credentials. Stores an encrypted credential.
  The key must be non-empty; the value is stored AES-256-GCM encrypted.
type: object
required:
  - key
  - value
additionalProperties: false
properties:
  key:
    type: string
    description: Credential key name.
    example: OPENAI_API_KEY
  value:
    type: string
    description: Credential value (stored encrypted).
    example: "sk-abc123..."
