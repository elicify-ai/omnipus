title: RecordRowKind
description: >
  The kind of row a `knowledge_find` call may return (ADR-068 D15.3, spec FR-076a).
  Extracted to its own schema so this enum lives in one place — the same pattern
  ViewKind.yaml applies to `ViewDef.kind`, applied here to `VaultFindRequest.kind`,
  which the contract shape test would otherwise misread as an inline kind enum.
type: string
enum:
  - note
  - record
  - task
  - attachment
x-enum-varnames:
  - Note
  - Record
  - Task
  - Attachment
example: "note"