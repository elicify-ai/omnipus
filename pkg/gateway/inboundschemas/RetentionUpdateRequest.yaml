title: RetentionUpdateRequest
description: >
  Request body for PUT /api/v1/security/retention.
  Partial update — any subset of the two retention fields.
  Strict type validation rejects JSON strings for session_days,
  floats with fractional parts for session_days, and non-boolean
  values for disabled. An empty body {} is accepted as a no-op.
type: object
additionalProperties: false
properties:
  session_days:
    type: integer
    minimum: 0
    description: >
      Number of days to retain session logs. 0 means use the system default
      (90 days). Floats and strings are rejected with 400.
    example: 30
  disabled:
    type: boolean
    description: >
      When true, retention sweeps are disabled and session logs are kept forever.
      Strings ("true"/"false") and numbers are rejected with 400.
    example: false
