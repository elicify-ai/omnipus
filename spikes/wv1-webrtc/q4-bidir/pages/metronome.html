<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WV1 Metronome — beep+flash sync + interactive drive target</title>
<style>
  html, body { margin: 0; height: 100%; background: #050505; color: #eee; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; overflow: hidden; }
  body.flash { background: #ffffff; color: #000; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
  #tick { font-size: 14vw; font-weight: bold; font-variant-numeric: tabular-nums; }
  #clock { font-size: 3vw; margin-top: 1vh; font-variant-numeric: tabular-nums; }
  #label { font-size: 1.6vw; opacity: .6; margin-top: 1vh; text-align: center; max-width: 80vw; }
  /* Q4: drawing canvas for click-dots + mousemove trail. pointer-events:none
     so it never intercepts hit-testing -- all input listeners are on
     `document`, this is purely a visual record of what CDP dispatched. */
  #draw { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  /* HUD: text echo + wheel value + live event counter, top-left, above the
     canvas but never intercepting input either. */
  #hud { position: absolute; top: 8px; left: 8px; z-index: 3; pointer-events: none; font-size: 16px; line-height: 1.5; text-shadow: 0 0 4px #000, 0 0 4px #000; }
  #textecho { background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 4px; display: inline-block; min-width: 4ch; }
  #wheelval, #eventcount { background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 4px; }
</style>
</head>
<body>
<canvas id="draw"></canvas>
<div id="hud">
  <div>typed: <span id="textecho">|</span></div>
  <div id="wheelval">wheel: 0</div>
  <div id="eventcount">events: 0</div>
</div>
<div id="wrap">
  <div id="tick">0</div>
  <div id="clock">--:--:--.---</div>
  <div id="label">WV1 metronome — flash + 880Hz/150ms beep, once per second (A/V sync proof). Click to paint, type to echo, scroll to change the wheel value.</div>
</div>
<script>
'use strict';
const BEAT = 1.0;        // seconds between beats
const BEEP_DUR = 0.15;   // seconds
const FREQ = 880;        // Hz
const LOOKAHEAD = 0.1;   // schedule beats within this window (seconds)
const SCHEDULE_INTERVAL_MS = 25;

let ctx = null;
let nextBeatTime = 0;
let tickCount = 0;
let started = false;

function startAudio() {
  if (started) return;
  started = true;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume().catch(() => {});
  nextBeatTime = ctx.currentTime + 0.2;
  setInterval(scheduler, SCHEDULE_INTERVAL_MS);
  requestAnimationFrame(updateClock);
}

function scheduler() {
  while (nextBeatTime < ctx.currentTime + LOOKAHEAD) {
    scheduleBeat(nextBeatTime);
    nextBeatTime += BEAT;
  }
}

// Both the audible beep and the visual flash are derived from the SAME
// scheduled time `time` (Web Audio's high-precision clock): the oscillator
// is started precisely at `time` via the Web Audio scheduler, and the
// flash is triggered via a setTimeout whose delay is computed from that
// same `time` minus the current audio clock. A human seeing the flash and
// hearing the beep together is direct evidence of A/V sync through the
// whole capture->WebRTC->relay->viewer pipeline.
function scheduleBeat(time) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = FREQ;
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(0.9, time + 0.01);
  gain.gain.setValueAtTime(0.9, time + BEEP_DUR - 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + BEEP_DUR);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(time);
  osc.stop(time + BEEP_DUR + 0.02);

  const delayMs = Math.max(0, (time - ctx.currentTime) * 1000);
  tickCount++;
  document.getElementById('tick').textContent = String(tickCount);
  setTimeout(() => {
    document.body.classList.add('flash');
    setTimeout(() => document.body.classList.remove('flash'), BEEP_DUR * 1000);
  }, delayMs);
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toISOString().split('T')[1].replace('Z', '');
  requestAnimationFrame(updateClock);
}

// This page is opened in the encoder Chrome with
// --autoplay-policy=no-user-gesture-required, so AudioContext.resume()
// succeeds without a gesture. Click fallback covers manual/human testing
// in a normal browser tab where autoplay policy applies.
window.addEventListener('load', startAudio);
document.body.addEventListener('click', startAudio);

// ============================================================================
// Q4: interactive drive target. window.__events is the GROUND TRUTH the
// verification harness reads back (via the Go relay's inputbridge ->
// Runtime.evaluate) to confirm every event the viewer sent over the WebRTC
// data channel actually arrived as a real DOM input event on this page,
// dispatched via CDP Input.dispatchMouseEvent/dispatchKeyEvent.
// ============================================================================
window.__events = [];
const MAX_EVENTS = 5000;
function recordEvent(e) {
  window.__events.push(e);
  if (window.__events.length > MAX_EVENTS) window.__events.shift();
  document.getElementById('eventcount').textContent = 'events: ' + window.__events.length;
}

const canvas = document.getElementById('draw');
const dctx = canvas.getContext('2d');
function resizeCanvas() {
  // Redraw would be lost on resize, but this capture target's viewport is
  // fixed (headless default 800x600, per wv1-spike-results.md Q3), so this
  // only matters for manual/human testing in a resizable window.
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let dotSeq = 0;
let lastMove = null;

document.addEventListener('mousedown', (e) => {
  dotSeq++;
  dctx.fillStyle = '#39ff6a';
  dctx.beginPath();
  dctx.arc(e.clientX, e.clientY, 6, 0, Math.PI * 2);
  dctx.fill();
  dctx.strokeStyle = '#000';
  dctx.lineWidth = 1;
  dctx.stroke();
  dctx.fillStyle = '#fff';
  dctx.font = 'bold 12px monospace';
  dctx.fillText(String(dotSeq), e.clientX + 9, e.clientY - 9);
  recordEvent({ type: 'mousedown', x: e.clientX, y: e.clientY, button: e.button, seq: dotSeq, ts: Date.now() });
});
document.addEventListener('mouseup', (e) => {
  recordEvent({ type: 'mouseup', x: e.clientX, y: e.clientY, button: e.button, ts: Date.now() });
});
document.addEventListener('mousemove', (e) => {
  if (lastMove) {
    dctx.strokeStyle = 'rgba(255, 220, 0, 0.4)';
    dctx.lineWidth = 1.5;
    dctx.beginPath();
    dctx.moveTo(lastMove.x, lastMove.y);
    dctx.lineTo(e.clientX, e.clientY);
    dctx.stroke();
  }
  lastMove = { x: e.clientX, y: e.clientY };
  recordEvent({ type: 'mousemove', x: e.clientX, y: e.clientY, ts: Date.now() });
});

let wheelVal = 0;
document.addEventListener(
  'wheel',
  (e) => {
    wheelVal += e.deltaY;
    document.getElementById('wheelval').textContent = 'wheel: ' + wheelVal.toFixed(0);
    recordEvent({ type: 'wheel', deltaY: e.deltaY, wheelVal, ts: Date.now() });
  },
  { passive: true },
);

let typedText = '';
document.addEventListener('keydown', (e) => {
  if (e.key === 'Backspace') typedText = typedText.slice(0, -1);
  else if (e.key === 'Enter') typedText += '⏎';
  else if (e.key.length === 1) typedText += e.key;
  document.getElementById('textecho').textContent = (typedText || '') + '|';
  recordEvent({ type: 'keydown', key: e.key, code: e.code, ts: Date.now() });
});
document.addEventListener('keyup', (e) => {
  recordEvent({ type: 'keyup', key: e.key, code: e.code, ts: Date.now() });
});

// window.__resetEvents() lets a verification run clear ground truth
// between test phases (e.g. before the stress test) without reloading the
// page (a reload would also reset the metronome tick counter / audio
// scheduling, which we want to keep running continuously).
window.__resetEvents = function () {
  window.__events = [];
  document.getElementById('eventcount').textContent = 'events: 0';
  return { ok: true };
};
</script>
</body>
</html>
