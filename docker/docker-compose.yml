services:
  # ─────────────────────────────────────────────
  # Omnipus Agent (one-shot query)
  #   docker compose -f docker/docker-compose.yml run --rm omnipus-agent mia "Hello"
  # ─────────────────────────────────────────────
  omnipus-agent:
    image: ghcr.io/elicify-ai/omnipus:latest
    container_name: omnipus-agent
    profiles:
      - agent
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.omnipus
    # The old "agent" subcommand was removed in the CLI redesign; the one-shot
    # form is now `omnipus <agent-name> "<prompt>"`. Leaving the binary alone as
    # the entrypoint lets the agent name and prompt come from `run` arguments.
    entrypoint: ["omnipus"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # Omnipus Gateway (long-running)
  #   docker compose -f docker/docker-compose.yml --profile gateway up
  #
  # Port: 5000 = SPA + REST/WS API + agent preview iframes. ADR-044 put
  # /preview/ on this same listener, so there is only ONE port to publish;
  # the gateway.preview_port key it used to need was deleted with it.
  # Bound to 127.0.0.1 by default so the gateway is not reachable from the
  # public network without an explicit reverse proxy. Change to 0.0.0.0:5000
  # if you intentionally want LAN/WAN exposure.
  # ─────────────────────────────────────────────
  omnipus-gateway:
    image: ghcr.io/elicify-ai/omnipus:latest
    container_name: omnipus-gateway
    restart: on-failure
    profiles:
      - gateway
    ports:
      - "127.0.0.1:5000:5000"
    # OMNIPUS_GATEWAY_PORT keeps the in-container listener on the same port as
    # the host mapping above (datamodel.Init() seeds 5000 as well, so this is
    # explicit rather than required). OMNIPUS_GATEWAY_HOST=0.0.0.0 is required:
    # the default bind is loopback, which inside a container is the container's
    # own loopback, so the published port would reach nothing.
    environment:
      - OMNIPUS_GATEWAY_PORT=5000
      - OMNIPUS_GATEWAY_HOST=0.0.0.0
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.omnipus
