id: delegation-and-stop
title: An agent hands work to a helper, and how Stop reaches both
source: release/v0.1.1 @ 6fbf4b43c
summary: 'Delegating is fire-and-forget for the parent. The delegate tool writes a durable record for a new helper session, asks the launcher to start it (or queue it if too many agents run), and returns
  at once with the helper''s session id. The helper''s turn then runs on its own goroutine, outside the message bus and outside the parent''s turn, so cancelling the parent''s turn does not reach it on
  its own. When the helper finishes, its answer is appended to the parent''s durable inbox and the parent is woken: injected into the parent''s live turn if one is running, otherwise as a new "system" message
  on the bus that starts a new parent turn. Stop is one shared function (StopSession) with two scopes. Plain Stop affects the session only: it stamps a durable stop marker, asks that session''s running
  turn to stop, and requests a hard abort 3 seconds later; it leaves its helpers and its background shell processes running. Stop all (the Tree option) does the same for the session and every helper under
  it, found through the lifecycle store, and also kills the background shells of the whole tree. Redirect is Stop followed by a new instruction.

  '
