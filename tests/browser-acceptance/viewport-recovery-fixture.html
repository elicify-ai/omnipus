<!doctype html><meta charset="utf-8"><title>One-shot renderer resize stall</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:repeating-linear-gradient(#183650 0px,#183650 99px,#276c91 100px,#276c91 199px);font:16px sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}input,button{position:fixed;top:64%;height:9%;font-size:20px;box-sizing:border-box}input{left:8%;top:78%;width:38%}#arm{left:8%;width:38%}button{left:54%;width:38%}
</style>
<canvas id="pixels"></canvas><input id="text" aria-label="Native scroll text"><button id="arm">Arm next resize</button><button id="click">Count click and focus text</button>
<script>
const params=new URL(location.href).searchParams;
const nonce=Number(params.get('nonce'));
const duration=params.get('duration');
if(duration!==null&&duration!=='6000'&&duration!=='11000')throw Error('Resize stall duration must be 6000 or 11000');
const stallMs=duration===null?6000:Number(duration);
if(!Number.isInteger(nonce)||nonce<1||nonce>65535)throw Error('Valid fixture nonce required');
const canvas=document.getElementById('pixels'),ctx=canvas.getContext('2d'),text=document.getElementById('text');
// Eight pixel words: nonce, clicks, armed count, started stalls, CSS width,
// completed stalls, CSS height, errors. Exact text follows those words.
const state={nonce,clicks:0,armed:0,started:0,width:0,completed:0,height:0,errors:0};
let armed=false;
function paint(){
 const w=canvas.width=document.documentElement.clientWidth,h=canvas.height=document.documentElement.clientHeight;
 canvas.style.width=w+'px';canvas.style.height=h+'px';
 state.width=w;state.height=h;
 ctx.fillStyle='#ff00ff';ctx.fillRect(0,0,w,h);ctx.fillStyle='#151515';ctx.fillRect(w*.025,h*.025,w*.95,h*.95);
 const words=[...Object.values(state),...Array.from({length:32},(_,i)=>text.value.charCodeAt(i)||0)];
 const bits=[];words.forEach((v,index)=>{for(let i=0;i<(index<8?32:16);i++)bits.push((v>>>i)&1)});
 bits.forEach((b,i)=>{ctx.fillStyle=b?'#fff':'#000';ctx.fillRect(w*(.1+(i%32)*.8/32),h*(.06+Math.floor(i/32)*.5/24),w*.8/32,h*.5/24)});
}
document.getElementById('arm').addEventListener('click',e=>{if(!e.isTrusted)state.errors++;armed=true;state.armed++;paint()});
addEventListener('resize',()=>{
 if(armed){armed=false;state.started++;const until=performance.now()+stallMs;while(performance.now()<until){}state.completed++}
 paint();
});
text.addEventListener('input',e=>{if(!e.isTrusted||text.value.length>32)state.errors++;paint()});
document.getElementById('click').addEventListener('click',e=>{if(!e.isTrusted)state.errors++;state.clicks++;text.focus();paint()});
paint();
</script>
