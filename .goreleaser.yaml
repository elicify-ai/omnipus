# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
#
# v0.1 release matrix — Tier 1 platforms only:
#   - linux/amd64, linux/arm64, darwin/arm64
# Deferred (planned, not in v0.1): darwin/amd64 (Intel), windows/amd64 (#113),
# linux/{riscv64,loong64,arm,mipsle}, freebsd/*, netbsd/*.
#
# Module path is still github.com/dapicom-ai/omnipus (go.mod). Renaming to
# elicify-ai is a separate refactor — until then, LDFLAGS must target the
# dapicom-ai path that the binary actually carries.
version: 2

git:
  ignore_tags:
    - nightly
    - ".*-nightly.*"

before:
  hooks:
    - go mod tidy
    - go generate ./...
    # Embed SPA into pkg/gateway/spa/ before any go build runs.
    # pkg/gateway/embed.go has //go:embed all:spa and pkg/gateway/spa/ is
    # gitignored. Vite builds into dist/spa; we mirror it into the embed target.
    # Mirrors .github/workflows/cross-platform.yml:50-58 — the proven pattern.
    # npm install (not npm ci): CI's npm is strict about transitive lock
    # entries; redoc's core-js@3.49.0 subdep doesn't appear in our top-level
    # lock and breaks `npm ci` even though `npm install` resolves cleanly.
    # The release pipeline doesn't need lock-strict installs — deterministic
    # JS output comes from `npm run build` + Vite's content-hashed asset names.
    - npm install --no-audit --no-fund
    - npm run build
    # Vite outputs to dist/; goreleaser also uses dist/ as its artifact dir.
    # After mirroring the SPA into the embed target, wipe dist/ so goreleaser
    # can write its own artifacts there (or it errors "dist is not empty").
    - sh -c 'rm -rf pkg/gateway/spa && cp -r dist/spa pkg/gateway/spa && rm -rf dist'

builds:
  - id: omnipus
    env:
      - CGO_ENABLED=0
    tags:
      - goolm
      - stdjson
    ldflags:
      - -s -w
      - -X github.com/dapicom-ai/omnipus/pkg/config.Version={{ .Version }}
      - -X github.com/dapicom-ai/omnipus/pkg/config.GitCommit={{ .ShortCommit }}
      - -X github.com/dapicom-ai/omnipus/pkg/config.BuildTime={{ .Date }}
      - -X github.com/dapicom-ai/omnipus/pkg/config.GoVersion={{ .Env.GOVERSION }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/omnipus
    ignore:
      # darwin/amd64 (Intel Mac) is deferred to v0.1.1. Cross-compile target
      # works, but we haven't smoke-tested it in CI (cross-platform.yml uses
      # macos-latest = arm64). Adding macos-13 runner is a v0.1.1 task.
      - goos: darwin
        goarch: amd64

dockers_v2:
  - id: omnipus
    dockerfile: docker/Dockerfile.goreleaser
    extra_files:
      - docker/entrypoint.sh
    ids:
      - omnipus
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/omnipus"
    tags:
      - '{{ if isEnvSet "NIGHTLY_BUILD" }}nightly{{ else }}{{ .Tag }}{{ end }}'
      - '{{ if isEnvSet "NIGHTLY_BUILD" }}nightly{{ else }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64

archives:
  - formats: [tar.gz]
    # Matches uname -s / uname -m output:
    #   omnipus_Linux_x86_64.tar.gz, omnipus_Linux_arm64.tar.gz,
    #   omnipus_Darwin_arm64.tar.gz.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

nfpms:
  - id: omnipus
    ids:
      - omnipus
    package_name: omnipus
    file_name_template: >-
      {{ .PackageName }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    vendor: elicify-ai
    homepage: https://github.com/elicify-ai/omnipus
    maintainer: omnipus contributors
    description: Omnipus — multi-agent orchestration, sovereign, sandboxed, single binary.
    license: MIT
    formats:
      - rpm
      - deb
    bindir: /usr/bin

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  disable: '{{ isEnvSet "NIGHTLY_BUILD" }}'
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
