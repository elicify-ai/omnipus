# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
#
# v0.1 release matrix — Tier 1 platforms only:
#   - linux/amd64, linux/arm64, darwin/arm64
# Deferred (planned, not in v0.1): darwin/amd64 (Intel), windows/amd64 (#113),
# linux/{riscv64,loong64,arm,mipsle}, freebsd/*, netbsd/*.
#
# Module path is github.com/elicify-ai/omnipus (go.mod), matching the repo's
# actual GitHub org — LDFLAGS below target that path.
version: 2

git:
  ignore_tags:
    - nightly
    - ".*-nightly.*"

before:
  hooks:
    - go mod tidy
    - go generate ./...
    # Embed SPA into pkg/gateway/spa/ before any go build runs.
    # pkg/gateway/embed.go has //go:embed all:spa and pkg/gateway/spa/ is
    # gitignored. Vite builds into dist/spa; we mirror it into the embed target.
    # Mirrors .github/workflows/cross-platform.yml:50-58 — the proven pattern.
    # npm install (not npm ci): CI's npm is strict about transitive lock
    # entries; redoc's core-js@3.49.0 subdep doesn't appear in our top-level
    # lock and breaks `npm ci` even though `npm install` resolves cleanly.
    # The release pipeline doesn't need lock-strict installs — deterministic
    # JS output comes from `npm run build` + Vite's content-hashed asset names.
    - npm install --no-audit --no-fund
    - npm run build
    # Vite outputs to dist/; goreleaser also uses dist/ as its artifact dir.
    # After mirroring the SPA into the embed target, wipe dist/ so goreleaser
    # can write its own artifacts there (or it errors "dist is not empty").
    - sh -c 'rm -rf pkg/gateway/spa && cp -r dist/spa pkg/gateway/spa && rm -rf dist'
    # ADR-052 Phase 1: bundle a pinned full Chrome-for-Testing build alongside
    # the binary so each per-OS package ships a version-pinned, integrity-
    # verified Chrome. Only run for linux/amd64 in Phase 1 — darwin/arm64 and
    # windows/amd64 land in Phases 3 and 4 (the macOS notarization decision +
    # Windows allocator work). See docs/internal/architecture/ADR-052-*.md §D2
    # + SEC-ADR052-003 (security review mandates the CfT X-Goog-Hash md5
    # verification + chrome.sha256 emit on every build).
    #
    # Pipeline (the scripts/cft-bundle.sh helper does steps 1-5; this hook
    # only gates on platform + delegates):
    #   1. Fetch the live CfT "last-known-good-versions-with-downloads.json"
    #      manifest via curl (same URL pkg/tools/browser/installer.go's
    #      cftManifestURL uses at runtime).
    #   2. Parse with python3 to resolve the chrome-linux64.zip URL for the
    #      Stable channel's "chrome" build (full Chrome, NOT
    #      chrome-headless-shell — per ADR D2 the bundled build must be
    #      full Chrome).
    #   3. Download chrome-linux64.zip to a temp dir + verify X-Goog-Hash md5
    #      against the response header (mirrors verifyGoogHashMD5 in
    #      pkg/tools/browser/installer.go:414-461 — M2 / SEC-ADR052-003).
    #   4. Unzip into dist/chromium/ (goreleaser's working dir).
    #   5. Compute SHA-256 of dist/chromium/chrome-linux64/chrome and write
    #      to dist/chromium/chrome.sha256 — the integrity manifest the
    #      runtime reads back and verifies at first launch
    #      (chrome.sha256 reader: cmd/omnipus/internal/doctor/command.go's
    #      readChromeSHA — BOM/CRLF/comment/prefix tolerant per
    #      SEC-ADR052-004).
    - sh -c 'test "{{ .Os }}" = "linux" && test "{{ .Arch }}" = "amd64" && bash scripts/cft-bundle.sh || echo "ADR-052: skipping chrome bundling for {{ .Os }}/{{ .Arch }} (Phase 1 is linux/amd64 only)"'

builds:
  - id: omnipus
    env:
      - CGO_ENABLED=0
    tags:
      - goolm
      - stdjson
    ldflags:
      - -s -w
      - -X github.com/elicify-ai/omnipus/pkg/config.Version={{ .Version }}
      - -X github.com/elicify-ai/omnipus/pkg/config.GitCommit={{ .ShortCommit }}
      - -X github.com/elicify-ai/omnipus/pkg/config.BuildTime={{ .Date }}
      - -X github.com/elicify-ai/omnipus/pkg/config.GoVersion={{ .Env.GOVERSION }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/omnipus
    ignore:
      # darwin/amd64 (Intel Mac) is deferred to v0.1.1. Cross-compile target
      # works, but we haven't smoke-tested it in CI (cross-platform.yml uses
      # macos-latest = arm64). Adding macos-13 runner is a v0.1.1 task.
      - goos: darwin
        goarch: amd64

dockers_v2:
  - id: omnipus
    dockerfile: docker/Dockerfile.goreleaser
    extra_files:
      - docker/entrypoint.sh
    ids:
      - omnipus
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/omnipus"
    tags:
      - '{{ if isEnvSet "NIGHTLY_BUILD" }}nightly{{ else }}{{ .Tag }}{{ end }}'
      - '{{ if isEnvSet "NIGHTLY_BUILD" }}nightly{{ else }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64

archives:
  - formats: [tar.gz]
    # Matches uname -s / uname -m output:
    #   omnipus_Linux_x86_64.tar.gz, omnipus_Linux_arm64.tar.gz,
    #   omnipus_Darwin_arm64.tar.gz.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    # ADR-052 Phase 1: include the pinned Chrome-for-Testing payload + its
    # integrity manifest in the per-OS archive. The archive's `files`
    # defaults to the binary only; chromium/ is added explicitly so
    # install.sh / package managers lay it down alongside `omnipus`. The
    # pre-build hook above creates dist/chromium/ before goreleaser packs.
    files:
      - omnipus
      - chromium/**/*

nfpms:
  - id: omnipus
    ids:
      - omnipus
    package_name: omnipus
    file_name_template: >-
      {{ .PackageName }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    vendor: elicify-ai
    homepage: https://github.com/elicify-ai/omnipus
    maintainer: omnipus contributors
    description: Omnipus — multi-agent orchestration, sovereign, sandboxed, single binary.
    license: MIT
    formats:
      - rpm
      - deb
    bindir: /usr/bin
    # ADR-052 Phase 1: drop chromium/ alongside the binary in the system
    # package so .deb / .rpm installs land chrome at /usr/share/omnipus/chromium
    # (nfpm honors files: globs as relative to the build dir; the package
    # owns the directory layout — install.sh handles the move for tar.gz).
    files:
      - omnipus
      - chromium/**/*

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  disable: '{{ isEnvSet "NIGHTLY_BUILD" }}'
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
