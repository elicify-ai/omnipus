# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
#
# v0.1 release matrix — Tier 1 platforms only:
#   - linux/amd64, linux/arm64, darwin/arm64
# Deferred (planned, not in v0.1): darwin/amd64 (Intel), windows/amd64 (#113),
# linux/{riscv64,loong64,arm,mipsle}, freebsd/*, netbsd/*.
#
# Module path is github.com/elicify-ai/omnipus (go.mod), matching the repo's
# actual GitHub org — LDFLAGS below target that path.
version: 2

git:
  ignore_tags:
    - nightly
    - ".*-nightly.*"

before:
  hooks:
    - go mod tidy
    - go generate ./...
    # Embed SPA into pkg/gateway/spa/ before any go build runs.
    # pkg/gateway/embed.go has //go:embed all:spa and pkg/gateway/spa/ is
    # gitignored. Vite builds into dist/spa; we mirror it into the embed target.
    # Mirrors .github/workflows/cross-platform.yml:50-58 — the proven pattern.
    # npm install (not npm ci): CI's npm is strict about transitive lock
    # entries; redoc's core-js@3.49.0 subdep doesn't appear in our top-level
    # lock and breaks `npm ci` even though `npm install` resolves cleanly.
    # The release pipeline doesn't need lock-strict installs — deterministic
    # JS output comes from `npm run build` + Vite's content-hashed asset names.
    - npm install --no-audit --no-fund
    - npm run build
    # Vite outputs to dist/; goreleaser also uses dist/ as its artifact dir.
    # After mirroring the SPA into the embed target, wipe dist/ so goreleaser
    # can write its own artifacts there (or it errors "dist is not empty").
    - sh -c 'rm -rf pkg/gateway/spa && cp -r dist/spa pkg/gateway/spa && rm -rf dist'
    # ADR-052 Phase 1: bundle a pinned full Chrome-for-Testing build alongside
    # the binary so each per-OS+arch package ships a version-pinned,
    # integrity-verified Chrome. The chrome bundling itself runs from the
    # per-arch `builds.hooks.pre` below (after the SPA mirror, just before
    # the per-arch go build) — cft-bundle.sh accepts an arch arg, walks the
    # live CfT manifest for that arch's Stable-channel chrome zip, and
    # cleanly no-ops (exit 0, log a warning) when CfT has no build for the
    # arch. As of 2026-07-21 CfT publishes {linux64, mac-arm64, mac-x64,
    # win32, win64}; linux-arm64 is NOT published — the arm64 linux archive
    # therefore ships without a chromium/ payload and the runtime falls
    # back to managed download. Darwin/windcome in Phases 3/4. See
    # docs/internal/architecture/ADR-052-*.md §D2 + SEC-ADR052-003.
    #
    # Pipeline (scripts/cft-bundle.sh implements all five steps per arch):
    #   1. Fetch CfT last-known-good-versions-with-downloads.json.
    #   2. Parse with jq (no python3 dependency) to resolve the chrome
    #      zip URL for the Stable channel's "chrome" build (full Chrome,
    #      NOT chrome-headless-shell — per ADR D2 the bundled build must
    #      be full Chrome).
    #   3. Download + verify X-Goog-Hash md5 against the response header
    #      (mirrors verifyGoogHashMD5 in pkg/tools/browser/installer.go —
    #      M2 / SEC-ADR052-003). Repeated X-Goog-Hash header lines are
    #      concatenated (the CORS-folding pattern — see CORR-008).
    #   4. Unzip into dist/chromium/ (goreleaser's working dir), wiping
    #      any prior arch's payload first.
    #   5. Compute SHA-256 of dist/chromium/<subdir>/chrome and write
    #      dist/chromium/chrome.sha256 — the integrity manifest the
    #      runtime reads back and verifies at first launch.

builds:
  - id: omnipus
    env:
      - CGO_ENABLED=0
    tags:
      - goolm
      - stdjson
    ldflags:
      - -s -w
      - -X github.com/elicify-ai/omnipus/pkg/config.Version={{ .Version }}
      - -X github.com/elicify-ai/omnipus/pkg/config.GitCommit={{ .ShortCommit }}
      - -X github.com/elicify-ai/omnipus/pkg/config.BuildTime={{ .Date }}
      - -X github.com/elicify-ai/omnipus/pkg/config.GoVersion={{ .Env.GOVERSION }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/omnipus
    ignore:
      # darwin/amd64 (Intel Mac) is deferred to v0.1.1. Cross-compile target
      # works, but we haven't smoke-tested it in CI (cross-platform.yml uses
      # macos-latest = arm64). Adding macos-13 runner is a v0.1.1 task.
      - goos: darwin
        goarch: amd64
    hooks:
      pre:
        # ADR-052 Phase 1: per-arch bundled-Chrome-for-Testing payload.
        # Runs AFTER the global `before.hooks` SPA mirror (which wipes
        # dist/) and BEFORE the go build for this arch. cft-bundle.sh:
        #   - downloads + verifies the per-arch CfT chrome zip,
        #   - stages dist/chromium/<subdir>/chrome + chrome.sha256,
        #   - no-ops (exit 0 + warning) when CfT has no build for the arch
        #     (today: linux/arm64 — CfT publishes no linux-arm64 build).
        # The `archives.files: chromium/**/*` glob below picks up the
        # staged chromium/ for whichever arch goreleaser is currently
        # archiving; the per-arch `rm -rf dist/chromium` inside
        # cft-bundle.sh prevents leakage between arches.
        - cmd: bash scripts/cft-bundle.sh {{ .Arch }}
          dir: .

dockers_v2:
  - id: omnipus
    dockerfile: docker/Dockerfile.goreleaser
    extra_files:
      - docker/entrypoint.sh
    ids:
      - omnipus
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/omnipus"
    tags:
      - '{{ if isEnvSet "NIGHTLY_BUILD" }}nightly{{ else }}{{ .Tag }}{{ end }}'
      - '{{ if isEnvSet "NIGHTLY_BUILD" }}nightly{{ else }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64

archives:
  - formats: [tar.gz]
    # Matches uname -s / uname -m output:
    #   omnipus_Linux_x86_64.tar.gz, omnipus_Linux_arm64.tar.gz,
    #   omnipus_Darwin_arm64.tar.gz.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    # ADR-052 Phase 1: include the pinned Chrome-for-Testing payload + its
    # integrity manifest in the per-OS archive. The archive's `files`
    # defaults to the binary only; chromium/ is added explicitly so
    # install.sh / package managers lay it down alongside `omnipus`. The
    # pre-build hook above creates dist/chromium/ before goreleaser packs.
    files:
      - omnipus
      - chromium/**/*

nfpms:
  - id: omnipus
    ids:
      - omnipus
    package_name: omnipus
    file_name_template: >-
      {{ .PackageName }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    vendor: elicify-ai
    homepage: https://github.com/elicify-ai/omnipus
    maintainer: omnipus contributors
    description: Omnipus — multi-agent orchestration, sovereign, sandboxed, single binary.
    license: MIT
    formats:
      - rpm
      - deb
    bindir: /usr/bin
    # ADR-052 Phase 1: drop chromium/ alongside the binary in the system
    # package so .deb / .rpm installs land chrome at /usr/share/omnipus/chromium
    # (GoReleaser v2 / nfpm v2 uses `contents:` instead of the v1 `files:` key
    # — each entry is an explicit {src, dst} mapping).
    contents:
      - src: ./omnipus
        dst: /usr/bin/omnipus
      - src: ./dist/chromium/**/*
        dst: /usr/share/omnipus/chromium

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  disable: '{{ isEnvSet "NIGHTLY_BUILD" }}'
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
