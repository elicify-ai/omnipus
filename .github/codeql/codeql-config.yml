# CodeQL configuration for omnipus.
# Reference: https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning

name: "Omnipus CodeQL config"

# Stick with the existing query packs — security-extended + security-and-quality.
# Defined as a flat string list because GitHub's parser rejects the YAML object
# form (`queries: { name: ..., uses: ... }`) when passed via `config-file:`.
queries:
  - uses: security-extended
  - uses: security-and-quality

# Restrict scanning to source files we own. Vendored binaries (esbuild ships a
# pre-compiled Go binary inside vite that bundles its own Go runtime — every
# Go stdlib CVE then surfaces as a critical alert on a tool we never run at
# runtime) and Playwright/Vite generated artefacts drown the real signal in
# false positives.
#
# Notes per ecosystem:
#  - node_modules/**       — generated by npm ci; chrome-headless-shell &
#                            esbuild bundle their own runtimes which trigger
#                            ~80 noise alerts.
#  - dist/**               — Vite production output, regenerated from src.
#  - pkg/gateway/spa/**    — //go:embed sync of dist/spa, regenerated.
#  - test-results/**       — Playwright traces, never shipped.
#  - tests/perf/results/** — historical perf trend artefacts, JSON only.
#  - **/*.gen.go,
#    src/lib/api/generated/**, src/routeTree.gen.ts
#                          — codegen output, scanned via the source schemas.
paths-ignore:
  - node_modules
  - dist
  - pkg/gateway/spa
  - test-results
  - tests/perf/results
  - "**/*.gen.go"
  - src/lib/api/generated
  - src/routeTree.gen.ts

  # Test files own their own threat model: tempdir creation, TOCTOU patterns,
  # unused-import noise, and "negation always true" are all idiomatic and
  # intentional in test code (parametric assertions, helpers shared across
  # the suite, deliberate path setups for /tmp-scoped fixtures). CodeQL's
  # `js/file-system-race`, `js/path-injection`, and unused-variable alerts
  # on these files add ~24 findings that aren't actionable as security
  # issues. Production code under pkg/, src/, and cmd/ stays in scope.
  - "tests/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*_test.go"
