name: Nightly Evals

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit report + results back
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build SPA
        run: |
          npm ci
          npm run build
          rm -rf pkg/gateway/spa
          cp -r dist/spa pkg/gateway/spa

      - name: Build omnipus
        # -tags goolm,stdjson required — main.go is //go:build stdjson gated.
        run: CGO_ENABLED=0 go build -tags goolm,stdjson -o omnipus ./cmd/omnipus/

      - name: Read central e2e model
        # One committed source of truth for the real-LLM models (a primary and a
        # fallback pair). Every model or provider literal in live config is banned
        # (scripts/check-no-hardcoded-e2e-model.sh). The eval-runner reads the same
        # file itself (agent AND judge default to its primary, with its fallback —
        # founder decision 2026-09-27); this step exports it for the job-start check.
        run: |
          set -euo pipefail
          bash scripts/e2e-model.sh env >> "$GITHUB_ENV"

      - name: Check the primary LLM (job start)
        # One 1-token call to the primary (--strict). If it is unavailable (429 / 5xx /
        # timeout / no connection) the whole run uses the fallback for the agent and
        # the judge: a ::warning:: and a job-summary line say so. A rejected key
        # (401/403), any other answer, or a missing key fails the step. Prints only
        # the status and the error type the provider names, never the body or the key.
        env:
          MINIMAX_API_KEY_CI: ${{ secrets.MINIMAX_API_KEY_CI }}
        run: |
          set -euo pipefail
          route=$(bash scripts/e2e-model.sh preflight --strict --route-out "$RUNNER_TEMP/llm-route.json")
          echo "$route" >> "$GITHUB_ENV"

      - name: Upload LLM route
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llm-route-evals
          path: ${{ runner.temp }}/llm-route.json
          if-no-files-found: ignore

      - name: Run evals
        env:
          # Keys by provider (evals/cmd/eval-runner, evalKeyEnvs): the MiniMax
          # primary reads MINIMAX_API_KEY_CI (there is no separate eval key), the
          # OpenRouter fallback reads OPENROUTER_API_KEY_EVAL.
          MINIMAX_API_KEY_CI: ${{ secrets.MINIMAX_API_KEY_CI }}
          OPENROUTER_API_KEY_EVAL: ${{ secrets.OPENROUTER_API_KEY_EVAL }}
          OMNIPUS_MASTER_KEY: ${{ secrets.OMNIPUS_MASTER_KEY_EVAL }}
          OMNIPUS_BIN: ./omnipus
        run: |
          set -euo pipefail
          : "${LLM_ROUTE:?LLM_ROUTE is not set — the 'Check the primary LLM' step must run first}"
          if [ "$LLM_ROUTE" = "fallback" ]; then
            # The primary is unavailable: agent and judge both run on the fallback.
            export AGENT_MODEL="$E2E_FALLBACK_PROVIDER/$E2E_FALLBACK_MODEL"
            export JUDGE_MODEL="$E2E_FALLBACK_PROVIDER/$E2E_FALLBACK_MODEL"
          fi
          mkdir -p evals/results
          go run ./evals/cmd/eval-runner \
            --scenarios evals/scenarios \
            --out "evals/results/$(date +%Y-%m-%d).jsonl" \
            --report evals/REPORT.md

      - name: Commit report
        run: |
          git config user.name "omnipus-evals-bot"
          git config user.email "evals@noreply.local"
          git add evals/REPORT.md evals/results/
          git diff --cached --quiet || git commit -m "evals: nightly run $(date -u +%Y-%m-%d)"
          git push || echo "no changes to push"
