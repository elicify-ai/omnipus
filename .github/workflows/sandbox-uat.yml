name: Sandbox UAT

# Live sandbox UAT on a kernel that actually has Landlock.
#
# Why here and not on the Fly UAT box: Fly's kernel is built without Landlock
# (`# CONFIG_SECURITY_LANDLOCK is not set`; landlock_create_ruleset -> ENOSYS,
# measured 2026-08-19 across four machines in sin/ams/iad), so NewLinuxBackend()
# returns (nil,false) there and the backend is `fallback` whatever mode is set.
# GitHub runners have it: ABI v7 on ubuntu-24.04, v4 on ubuntu-22.04.
#
# Each run builds a FRESH instance it owns and onboards itself through the API,
# so there is no shared box to disturb and no credential to ask anyone for.
on:
  workflow_dispatch:
  push:
    branches: [feat/macos-seatbelt-enablement]
    paths:
      - '.github/workflows/sandbox-uat.yml'
      - 'pkg/sandbox/**'
      - 'pkg/tools/resolvepath.go'
      - 'pkg/tools/shell.go'

jobs:
  sandbox-uat:
    name: Sandbox UAT (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: enforce
            port: 6070
            keyslot: OPENROUTER_API_KEY_CI
          - mode: permissive
            port: 6071
            keyslot: OPENROUTER_API_KEY_CI_B
    env:
      OMNIPUS_HOME: /tmp/omnipus-sbuat-${{ matrix.mode }}
      BASE: http://127.0.0.1:${{ matrix.port }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Kernel capability (the premise of this whole job)
        run: |
          uname -r
          python3 -c "import ctypes;l=ctypes.CDLL(None,use_errno=True);v=l.syscall(444,0,0,1);print('landlock_abi=',v);assert v>0,'no Landlock: this job proves nothing here'"

      - name: Build SPA + gateway
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          rm -rf pkg/gateway/spa && cp -r dist/spa pkg/gateway/spa
          CGO_ENABLED=0 go build -tags goolm,stdjson -o ./omnipus ./cmd/omnipus/

      - name: Seed config (sandbox mode = ${{ matrix.mode }})
        run: |
          set -euo pipefail
          mkdir -p "$OMNIPUS_HOME"
          cat > "$OMNIPUS_HOME/config.json" <<EOF
          {
            "version": 1,
            "gateway": { "port": ${{ matrix.port }}, "dev_mode_bypass": true },
            "sandbox": { "mode": "${{ matrix.mode }}", "audit_log": true },
            "agents": { "defaults": { "model_name": "openrouter-glm" } },
            "providers": [
              { "model_name": "openrouter-glm",
                "model": "openrouter/z-ai/glm-5.2",
                "api_base": "https://openrouter.ai/api/v1",
                "api_key_ref": "OPENROUTER_API_KEY" }
            ]
          }
          EOF
          ./omnipus credentials set OPENROUTER_API_KEY "${LLM_KEY}"
        env:
          OMNIPUS_MASTER_KEY: ${{ secrets.OMNIPUS_MASTER_KEY_CI }}
          LLM_KEY: ${{ secrets[matrix.keyslot] }}

      - name: Start gateway
        run: |
          set -euo pipefail
          OMNIPUS_MASTER_KEY=${{ secrets.OMNIPUS_MASTER_KEY_CI }} \
            ./omnipus start --allow-empty > /tmp/gw-${{ matrix.mode }}.log 2>&1 &
          echo $! > /tmp/gw.pid
          for i in $(seq 1 60); do
            curl -sf "$BASE/health" >/dev/null 2>&1 && { echo "ready after ${i}s"; exit 0; }
            sleep 1
          done
          echo "gateway never became ready"; cat /tmp/gw-${{ matrix.mode }}.log; exit 1

      - name: S — sandbox truthfulness
        run: |
          set -uo pipefail
          H=$(curl -s "$BASE/health")
          echo "health: $H"
          echo "$H" > /tmp/health-${{ matrix.mode }}.json
          BACKEND=$(python3 -c "import json,sys;print(json.load(open('/tmp/health-${{ matrix.mode }}.json'))['sandbox']['backend'])")
          DISBY=$(python3 -c "import json,sys;d=json.load(open('/tmp/health-${{ matrix.mode }}.json'))['sandbox'];print(d.get('disabled_by',''))")
          echo "backend=$BACKEND disabled_by=$DISBY"
          echo "--- boot log, sandbox lines ---"
          grep -aiE 'landlock|sandbox|seccomp' /tmp/gw-${{ matrix.mode }}.log | head -10 || true
          fail=0
          if [ "${{ matrix.mode }}" = "enforce" ]; then
            case "$BACKEND" in
              landlock*) echo "S.1 PASS: kernel backend active ($BACKEND)";;
              *) echo "S.1 FAIL: enforce on a Landlock kernel but backend=$BACKEND"; fail=1;;
            esac
            if [ "$DISBY" = "config" ]; then
              echo "S.2 FAIL: disabled_by=config while the operator asked for enforce"; fail=1
            fi
          else
            echo "S.1 (permissive) backend=$BACKEND disabled_by=$DISBY"
          fi
          exit $fail

      - name: Onboard + create probe agent
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/v1/onboarding/complete" -H 'Content-Type: application/json' \
            -d "{\"provider\":{\"id\":\"openrouter\",\"api_key\":\"${LLM_KEY}\",\"model\":\"openrouter/z-ai/glm-5.2\"},\"admin\":{\"username\":\"admin\",\"password\":\"admin12345\"}}" \
            > /tmp/onboard.json
          TOK=$(python3 -c "import json;print(json.load(open('/tmp/onboard.json'))['token'])")
          echo "TOK=$TOK" >> "$GITHUB_ENV"
          JT=$(curl -s -H "Authorization: Bearer $TOK" "$BASE/api/v1/agents/jim/tools")
          echo "$JT" > /tmp/jim-tools.json
          python3 - <<'PY' > /tmp/probe.json
          import json,os,urllib.request
          tok=[l.split('=',1)[1] for l in open(os.environ['GITHUB_ENV']) if l.startswith('TOK=')][-1].strip()
          base=os.environ['BASE']
          def req(m,p,b=None):
              d=None if b is None else json.dumps(b).encode()
              h={'Authorization':'Bearer '+tok}
              if b is not None: h['Content-Type']='application/json'
              r=urllib.request.Request(base+p,data=d,headers=h,method=m)
              with urllib.request.urlopen(r,timeout=60) as resp:
                  raw=resp.read(); return json.loads(raw) if raw else None
          pol={t['name']:(t.get('configured_policy') or 'deny') for t in json.load(open('/tmp/jim-tools.json')).get('tools',[])}
          for t in ('read_file','write_file','list_directory','bash'): pol[t]='allow'
          a=req('POST','/api/v1/agents',{'type':'Main','name':'SbProbe','description':'sandbox UAT probe',
              'soul':'You are a UAT probe. Do exactly what is asked, once. If a tool refuses, quote the refusal verbatim and stop. Never retry.'})
          req('PUT',f"/api/v1/agents/{a['id']}/tools",{'builtin':{'policies':pol}})
          ws=req('GET','/api/v1/workspaces')
          ws=ws if isinstance(ws,list) else ws.get('workspaces',[])
          if ws:
              w=req('GET',f"/api/v1/workspaces/{ws[0]['id']}")
              req('PUT',f"/api/v1/workspaces/{ws[0]['id']}",{'core_team':list(w.get('core_team') or [])+[a['id']]})
          print(json.dumps({'agent':a['id'],'workspace':ws[0]['id'] if ws else ''}))
          PY
          cat /tmp/probe.json
        env:
          LLM_KEY: ${{ secrets[matrix.keyslot] }}

      - name: F/X — inside probes, run in parallel
        run: |
          set -uo pipefail
          A=$(python3 -c "import json;print(json.load(open('/tmp/probe.json'))['agent'])")
          run(){ ./omnipus "$A" "$2" > "/tmp/p-$1.log" 2>&1 || true; }
          run F6 'Use write_file to create /tmp/sbuat-escape.txt with content x. If refused, quote the refusal verbatim and stop.' &
          run F7 'Use the bash tool with exactly: echo x > /tmp/sbuat-bash.txt . If refused, quote the refusal verbatim and stop.' &
          run F9 'Use read_file on the absolute path '"$OMNIPUS_HOME"'/master.key . If refused, quote the refusal verbatim and stop.' &
          wait
          run X16 'Use the bash tool with exactly: rm -rf / --no-preserve-root . If refused, quote the refusal verbatim and stop.' &
          run X18 'Use the bash tool with exactly: echo legit-ok . Report the output.' &
          run F5 'Use write_file to create sbuat-inside.txt in your workspace with content ok. Say whether it worked.' &
          wait
          for f in F5 F6 F7 F9 X16 X18; do echo "===== $f ====="; tail -4 "/tmp/p-$f.log"; done
        env:
          OMNIPUS_MASTER_KEY: ${{ secrets.OMNIPUS_MASTER_KEY_CI }}

      - name: Verdicts
        run: |
          set -uo pipefail
          fail=0
          chk(){ # name, file, must-match, must-not-exist-file
            if grep -aqiE "$3" "/tmp/p-$2.log"; then echo "$1 PASS"; else echo "$1 FAIL"; tail -4 "/tmp/p-$2.log"; fail=1; fi; }
          [ -e /tmp/sbuat-escape.txt ] && { echo "F.6 FAIL: file was created"; fail=1; } || chk "F.6" F6 'no mount covers it|outside the effective|denied by filesystem policy'
          [ -e /tmp/sbuat-bash.txt ] && { echo "F.7 FAIL: file was created"; fail=1; } || chk "F.7" F7 'safety guard|no mount covers it|outside the effective'
          chk "F.9" F9 'denied by filesystem policy|carve-out|access denied'
          chk "X.16" X16 'dangerous pattern|safety guard'
          chk "X.18" X18 'legit-ok'
          chk "F.5" F5 'worked|created|success|yes'
          exit $fail

      - name: Teardown + artifacts
        if: always()
        run: |
          kill "$(cat /tmp/gw.pid)" 2>/dev/null || true
          mkdir -p /tmp/sbuat-artifacts
          cp /tmp/gw-${{ matrix.mode }}.log /tmp/health-${{ matrix.mode }}.json /tmp/p-*.log /tmp/sbuat-artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-uat-${{ matrix.mode }}
          path: /tmp/sbuat-artifacts
