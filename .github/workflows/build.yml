name: build

on:
  # Run on every PR so cross-compile breakage (NetBSD, mipsle, riscv64, …)
  # fails fast in review instead of landing on main. Before 2026-05-30 this
  # workflow ran only on push:main, which meant `make build-all` was post-
  # merge-only: any cross-compile regression would sit red on main for
  # weeks (the NetBSD failure that triggered this change was red for >1
  # month). Keep `push:main` so a successful merge still produces a build
  # artifact for the release-drafter / nightly tooling that depends on it.
  pull_request: { }
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # pkg/gateway/*.go is tagged //go:build !cgo (pure-Go per CLAUDE.md hard
      # constraint #2). Without CGO_ENABLED=0 the gateway package is excluded
      # from the build and main.go fails to link.
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build SPA
        # pkg/gateway/embed.go has //go:embed all:spa and pkg/gateway/spa/ is
        # gitignored. Vite builds into dist/spa; we copy it into the embed
        # target before go build reads the directive.
        run: |
          npm ci
          npm run build
          rm -rf pkg/gateway/spa
          cp -r dist/spa pkg/gateway/spa

      - name: Build
        run: make build-all
