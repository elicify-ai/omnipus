name: Weekly Lite Build

# WhatsApp native (whatsmeow) ships in the DEFAULT build and is covered by the
# main build/test workflows. This job guards the opposite path: the `lite`
# variant that opts OUT of whatsmeow via `-tags lite` to keep the binary small.
# It ensures the build-tag split (whatsapp_native_stub.go) keeps compiling so the
# lite variant doesn't rot.
#
# Schedule-only, deliberately (2026-08-22 — decided from evidence, not
# preference):
#   - It is NOT a required status check on main (confirmed via the branch
#     protection API) — it has never gated a merge, PR-triggering bought no
#     enforcement, only extra runs.
#   - `gh run list` showed it used to double as a `pull_request: paths:`
#     trigger. In practice that filter did not reliably narrow anything: one
#     long-lived PR (#551, branch feature/plan-swimlane-board) re-triggered
#     it 17 times in a single day on commits that touched neither
#     `pkg/channels/whatsapp_native/**` nor this file — because a
#     `pull_request`-triggered workflow runs the copy of the YAML committed
#     on the PR's own branch, so a branch that forked before a path-filter
#     change carries the old, unfiltered trigger for as long as it stays
#     unmerged. A path filter you can't rely on isn't doing its job.
#   - A break here is real (the lite variant is a shipped, ~58MB-smaller
#     build option) but explicitly not urgent — nothing else exercises
#     `-tags lite` at all, so weekly is the whole safety net either way, and
#     finding out within a week is an acceptable bound for a non-urgent,
#     non-merge-gating signal.
# If lite-variant coverage ever needs to be PR-time, make it a required
# check first — otherwise it is cost (extra runner spin-ups, extra
# notifications) without an enforcement benefit.

on:
  schedule:
    - cron: '0 3 * * 0'   # Sunday 03:00 UTC
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CGO_ENABLED: "0"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build SPA
        shell: bash
        run: |
          npm ci
          npm run build
          rm -rf pkg/gateway/spa
          cp -r dist/spa pkg/gateway/spa

      - name: Build lite variant (no whatsmeow)
        shell: bash
        run: go build -tags goolm,stdjson,lite ./...

      - name: Test lite stub path
        shell: bash
        run: go test -tags goolm,stdjson,lite -count=1 ./pkg/channels/whatsapp_native/...

      - name: Vet lite variant
        shell: bash
        run: go vet -tags goolm,stdjson,lite ./pkg/channels/whatsapp_native/...
