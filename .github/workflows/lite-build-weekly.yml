name: Weekly Lite Build

# WhatsApp native (whatsmeow) ships in the DEFAULT build and is covered by the
# main build/test workflows. This job guards the opposite path: the `lite`
# variant that opts OUT of whatsmeow via `-tags lite` to keep the binary small.
# It ensures the build-tag split (whatsapp_native_stub.go) keeps compiling so the
# lite variant doesn't rot.

on:
  schedule:
    - cron: '0 3 * * 0'   # Sunday 03:00 UTC
  pull_request:
    paths:
      - 'pkg/channels/whatsapp_native/**'
      - '.github/workflows/lite-build-weekly.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CGO_ENABLED: "0"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build SPA
        shell: bash
        run: |
          npm ci
          npm run build
          rm -rf pkg/gateway/spa
          cp -r dist/spa pkg/gateway/spa

      - name: Build lite variant (no whatsmeow)
        shell: bash
        run: go build -tags goolm,stdjson,lite ./...

      - name: Test lite stub path
        shell: bash
        run: go test -tags goolm,stdjson,lite -count=1 ./pkg/channels/whatsapp_native/...

      - name: Vet lite variant
        shell: bash
        run: go vet -tags goolm,stdjson,lite ./pkg/channels/whatsapp_native/...
