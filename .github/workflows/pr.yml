name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # ADR-067 step 1: run the SAME checks on a direct push to a release branch
  # or main, not just on pull_request. Before this, pr.yml was
  # pull_request-only, so a commit merged straight to a release branch (no
  # PR into it) ran CodeQL and nothing else — 23 commits did exactly that.
  # See the `changes` job below for how path filtering fails open (never
  # closed) for this event type: dorny/paths-filter has no PR diff to
  # compare against on a push, so its filter steps are skipped entirely for
  # push, and every gated job's `code`/`go`/`spa` input defaults to 'true'.
  push:
    branches:
      - release/**
      - main
  # Allow manual runs on feature branches without opening a PR.
  workflow_dispatch:

# Six playwright e2e shards (llm-chat, llm-agents, llm-light, llm-hot-reload,
# llm-verifier-eval, llm-conformance) call a real paid LLM (openrouter/z-ai/glm-5.2),
# so every push to a PR branch spends money. Cancel the superseded run on each new
# push instead of letting it burn through the full 17-job/9-shard fan-out. For a
# release-branch/main push (no `pull_request` context), `github.event.pull_request.number`
# is empty so the group falls back to `github.ref` (e.g. refs/heads/release/v0.1.1) —
# still one group per branch, so a rapid run of pushes to the same release branch
# cancels its own superseded run exactly like a PR branch does.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changed paths
    # Feeds three outputs every other job in this workflow gates on (path
    # filtering): `code`, `go`, `spa`.
    #
    # `code` is the broad gate. Conservative by design: it is only 'false'
    # when EVERY changed file in a pull_request is a doc/markdown/license
    # file (docs/**, **/*.md, LICENSE, NOTICE, .preview-doc/**) — none of
    # which any job in this workflow reads (see
    # docs/internal/false-green-patterns.md and CLAUDE.md's record of
    # file-scoped changes breaking a DIFFERENT package's tests, which rules
    # out any narrower, package-level filter — see that doc for the two
    # concrete incidents).
    #
    # `go` and `spa` (ADR-067 step 12, L1 language-split filtering) are a
    # NARROWER, additional gate layered on top of `code` — a handful of
    # Tier 1/2 jobs skip when their own language wasn't touched, on top of
    # (never instead of) the `code` check. `go` is 'true' whenever a changed
    # file is a *.go file, or one of the non-.go inputs that change Go
    # behaviour without touching a .go file: go.mod, go.sum, Makefile,
    # .golangci.yaml, contracts/** (the OpenAPI/AsyncAPI specs the generated
    # Go types come from), and .github/** (this workflow's own definition —
    # a change to the workflow must never be filtered against a stale copy
    # of its own filter). `spa` mirrors that for frontend inputs — src/**,
    # public/**, index.html, package.json/package-lock.json, vite.config.ts,
    # vite.lib.config.ts, tsconfig*.json, eslint.config.js — plus the same
    # Makefile/contracts/**/.github/** force-full set (Makefile drives the
    # `spa-embed` build target; contracts/** regenerates the TS wire types
    # under src/lib/api/generated/).
    #
    # ADR-067 §4.2 explicitly REJECTS anything finer than this file-type
    # split as unsound (an errcheck sweep confined to pkg/audit produced 62
    # govet findings repo-wide; a pkg/tools/registry.go change broke judge
    # tests in pkg/agent, a package it doesn't appear in) — `go`/`spa` are
    # the entire selection boundary here. No per-package Go selection exists
    # or should be added.
    #
    # Any doubt defaults to running everything: non-pull_request events
    # (push to release/**|main, or workflow_dispatch — neither has a PR diff
    # to filter against) always get code=true AND go=true AND spa=true, and
    # if a filter step below doesn't run or doesn't succeed, the fallback in
    # "Decide" still defaults every output to 'true' — fail open, never fail
    # closed into a silent skip. This is also what ADR-067 §4.3 requires for
    # a release-branch push ("merge into a release branch always runs
    # unscoped").
    #
    # That fail-open claim holds ONLY because both dorny/paths-filter steps
    # below carry `continue-on-error: true`. It was false before they did:
    # a filter-step failure failed this JOB, and every consumer gates on
    # `success()` / `needs.changes.result == 'success'`, so the whole
    # workflow skipped while "Decide" cheerfully wrote code=true to an
    # output nobody could reach. Do not remove those two lines.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
      go: ${{ steps.decide.outputs.go }}
      spa: ${{ steps.decide.outputs.spa }}
    steps:
      - name: Filter changed paths — anything-but-docs (pull_request only)
        # dorny/paths-filter's GitHub-API mode needs no checkout for
        # pull_request events. Non-pull_request events (push to
        # release/**|main, or workflow_dispatch) have no PR to diff against,
        # so this step is skipped for them and the fail-open default in
        # "Decide" below applies.
        id: filter
        if: github.event_name == 'pull_request'
        # REQUIRED for the fail-open contract this job documents to actually
        # hold at the JOB level. Without it, a dorny/paths-filter failure
        # (GitHub API 5xx, secondary rate limit, token scope) fails this STEP,
        # which fails the whole `changes` job. "Decide" below still runs
        # (`if: always()`) and still writes code/go/spa = 'true', but that
        # output reaches nobody: every consumer additionally gates on
        # `success()` or `needs.changes.result == 'success'`, so the entire
        # workflow silently skips — fail CLOSED, the exact opposite of the
        # documented behaviour. `continue-on-error` keeps the job green so the
        # fail-open default is load-bearing.
        #
        # It does NOT weaken the check below: `steps.<id>.outcome` is the
        # result BEFORE continue-on-error is applied (`conclusion` is the one
        # after), so a failed filter still reports outcome == 'failure' and
        # "Decide" correctly falls through to the 'true' branch.
        continue-on-error: true
        uses: dorny/paths-filter@v4
        with:
          # 'every' quantifier + all-negated patterns: a changed file only
          # satisfies ALL of these negations if it is NOT under docs/**,
          # NOT a .md file, and NOT LICENSE/NOTICE/.preview-doc/**. The
          # non_docs output is then 'true' iff at least one changed file is
          # a real (non-doc) file — dorny/paths-filter's documented recipe
          # for an "anything-but-docs" check.
          predicate-quantifier: 'every'
          filters: |
            non_docs:
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!NOTICE'
              - '!.preview-doc/**'

      - name: Filter changed paths — Go / SPA language split (pull_request only)
        # A SEPARATE dorny/paths-filter invocation, not more filters bolted
        # onto the step above: `predicate-quantifier` is a per-invocation
        # setting, not per-filter, and cannot be mixed — the step above needs
        # 'every' (ALL changed files must be non-doc), while go/spa need the
        # ordinary 'some' quantifier (AT LEAST ONE changed file matches AT
        # LEAST ONE pattern). This step omits predicate-quantifier, which
        # defaults to 'some'. Same pull_request-only guard, same fail-open
        # rationale as the step above.
        id: lang_filter
        if: github.event_name == 'pull_request'
        # Same fail-open requirement as the step above — see its comment for
        # why this is load-bearing rather than cosmetic.
        continue-on-error: true
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.golangci.yaml'
              - 'contracts/**'
              - '.github/**'
              # scripts/** is force-full for the same reason .github/** is: a
              # script in there decides WHAT the Go gates run.
              # scripts/race-packages.sh is the SOLE source of the -race
              # package list, so a PR editing only that file used to get
              # go=false, skip `test` entirely, and gut the race surface with
              # nothing red. A change to a gate's own definition must never be
              # filtered against a stale copy of that definition.
              - 'scripts/**'
            spa:
              - 'src/**'
              # tests/** is SPA source too: eslint.config.js lints src/ AND
              # tests/ (tests/ is not in its `ignores` list), and
              # vite.config.ts's vitest `include` is
              # ['src/**/*.test.{ts,tsx}', 'tests/**/*.test.{ts,tsx}'].
              # Without this line a PR touching only tests/ set spa=false, so
              # `lint-spa` and `vitest` both skipped and eslint violations
              # plus broken tests/** unit tests merged green.
              - 'tests/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'vite.lib.config.ts'
              # playwright.config.ts and packages/** became type-checked when
              # tsconfig.tests.json (tests/ + playwright.config.ts) and
              # tsconfig.app.json's "packages/ui/src" include were added. Without
              # them listed here a PR touching only one of those files sets
              # spa=false, `typecheck` skips, and the gate that now covers them
              # never runs — a gate that exists but is never triggered is the
              # same false green as no gate at all.
              - 'playwright.config.ts'
              - 'packages/**'
              - 'tsconfig*.json'
              - 'eslint.config.js'
              - 'Makefile'
              - 'contracts/**'
              - '.github/**'
              # Same force-full rationale as the `go` filter above:
              # scripts/check-vitest-coverage.mjs is what decides whether the
              # vitest matrix actually covers every test file, so it must not
              # be changeable without the SPA gates running.
              - 'scripts/**'

      - name: Decide whether the full job set must run
        id: decide
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ steps.filter.outcome }}" = "success" ] \
             && [ "${{ steps.filter.outputs.non_docs }}" = "false" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

          # go/spa: same fail-open shape as code above. A pull_request whose
          # lang_filter step ran successfully gets the REAL per-language
          # answer; every other case (non-pull_request event, or the step
          # didn't run/succeed) defaults to 'true' for both.
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ steps.lang_filter.outcome }}" = "success" ]; then
            echo "go=${{ steps.lang_filter.outputs.go }}" >> "$GITHUB_OUTPUT"
            echo "spa=${{ steps.lang_filter.outputs.spa }}" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "spa=true" >> "$GITHUB_OUTPUT"
          fi

  setup:
    name: Install Node dependencies
    # ADR-067 step 3 (§7.1): npm ci ran in 11 of 20 pull-request jobs, each
    # installing ~1,018 packages, measured ~5 minutes cold — the single
    # largest cost in the workflow, dominating the Tier 1 budget closely
    # enough that tiering barely mattered. This job installs ONCE; every job
    # that needs node_modules downloads the already-built tree as an
    # artifact instead of re-running npm ci.
    #
    # Chosen over actions/setup-node's built-in `cache: npm` option: that
    # caches ~/.npm (npm's download cache), not node_modules — every
    # consuming job would still have to run `npm ci` itself (dependency
    # resolution, integrity checks, ~1,018 package extractions/links to
    # disk), just against a warm local cache instead of the network. This
    # repo has no "postinstall" script in package.json and no npm
    # "workspaces" entry (both checked), so node_modules is a single flat,
    # symlink-free tree — safe to tar up once and extract verbatim wherever
    # it's needed. That is strictly less work per consuming job than even a
    # cache-warmed `npm ci`, and it removes 10 of the 11 registry round
    # trips entirely rather than just speeding them up.
    # actions/upload-artifact already compresses in transit, so the archive
    # step below does not add its own compression on top.
    #
    # Cost trade-off: this adds one serialized ~5-minute step ahead of Tier 1
    # (Tier 1's own node-consuming jobs previously paid that same ~5 minutes
    # each, but in PARALLEL, so Tier 1 wall-clock is roughly unchanged). What
    # it removes is a duplicate ~5-minute npm ci from every OTHER
    # node-consuming job, including the slow Tier 2/3 jobs (test, security,
    # perf-smoke, playwright) that previously paid it too despite already
    # running after Tier 1 had cleared — that is where the real wall-clock
    # and billed-runner-minute savings land: roughly 55 runner-minutes of
    # duplicated npm ci (11 x ~5 min) drops to roughly 5 (this job) + a
    # handful of ~1-minute download+extract steps.
    runs-on: ubuntu-latest
    needs: [changes]
    if: success() && needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Node dependencies
        run: npm ci

      - name: Archive node_modules
        run: tar -cf node_modules.tar node_modules

      - name: Upload node_modules artifact
        # The name is keyed on run_id ONLY — deliberately NOT run_id +
        # run_attempt. "Re-run failed jobs" increments run_attempt but does
        # NOT re-run jobs that already succeeded, so this job does not run
        # again and no attempt-2 artifact is ever produced. With run_attempt
        # in the name, all 11 consuming jobs then died at their download step
        # ("Unable to find an artifact with the name ..."), i.e. every partial
        # re-run failed 11 jobs for an infra reason unrelated to the code.
        # An artifact belongs to the RUN, not the attempt, so a run_id-only
        # name is still visible to later attempts of the same run.
        #
        # `overwrite: true` is the other half: on "Re-run ALL jobs" this job
        # DOES run again, and re-uploading the same name into the same run is
        # a 409 conflict without it. Together the two make both re-run modes
        # work.
        uses: actions/upload-artifact@v7
        with:
          name: node-modules-${{ github.run_id }}
          path: node_modules.tar
          retention-days: 1
          overwrite: true

  e2e-shard-check:
    name: E2E shard plan check
    # Fast, dependency-free drift guard that runs on EVERY PR (not just e2e-triggering
    # ones): fails if any tests/e2e/*.spec.ts is unassigned in tests/e2e/shards.json (it
    # would silently never run) or the plan references a deleted spec. Same check the
    # e2e-plan job runs before building the matrix, but with no `needs:` so it gives
    # immediate feedback and still covers PRs whose paths skip the heavy e2e chain.
    runs-on: ubuntu-latest
    needs: [changes]
    if: success() && needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify every e2e spec is assigned to exactly one shard
        run: scripts/e2e-shards.sh check

  cli-verb-guard:
    name: CLI Removed-Verb Guard
    # US-11 AC4 (FR-013): fail if any removed CLI verb reappears in infra.
    # Scanned directories: docker/, .github/, deploy/, scripts/,
    #   cmd/omnipus-launcher-tui/ — NOT docs/ (may discuss history).
    # The regex matches "<binary> <removed-verb>" in any form an infra script
    # might invoke it (plain, path-prefixed, variable-prefixed). The gateway
    # alias is kept and excluded by scanning for the removed verbs only:
    #   removed: agent auth status cron migrate model skills
    #   kept:    start gateway credentials audit doctor version onboard
    runs-on: ubuntu-latest
    needs: [changes]
    if: success() && needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for removed CLI verbs in infra
        run: |
          set -euo pipefail
          # The separator is [[:space:],] with optional surrounding quotes, not
          # plain whitespace: a JSON/YAML array form puts a quote-comma-quote
          # between the binary and the verb, and the whitespace-only pattern was
          # blind to it. That blind spot was live: docker/docker-compose.yml had
          # a removed verb in exactly that shape, and so did the launcher TUI
          # (an exec.Command with the binary and verb as separate arguments), in
          # directories this guard scans — and it reported clean. Both are fixed;
          # the pattern is widened so the next one cannot hide the same way.
          PATTERN='(omnipus|[A-Za-z0-9_./-]*omnipus|\$[A-Z_]+)["'"'"']?[[:space:],]+["'"'"']?(agent|auth|status|cron|migrate|model|skills)\b'
          DIRS=(docker .github deploy scripts cmd/omnipus-launcher-tui)
          FOUND=$(grep -rE "$PATTERN" --include="*.sh" --include="*.yml" --include="*.yaml" \
            --include="Dockerfile*" --include="*.go" \
            "${DIRS[@]}" 2>/dev/null | grep -v "^Binary" || true)
          if [ -n "$FOUND" ]; then
            echo "ERROR: removed CLI verb found in infra. Update callers to use 'omnipus start', 'omnipus credentials', etc." >&2
            echo "" >&2
            echo "$FOUND" >&2
            exit 1
          fi
          echo "OK: no removed CLI verbs in infra."

  browser-tests-gated:
    name: "#615 CI Guard: browser real-Chrome test gating"
    # #615 regression guard (structural/grep-based check, no Go build needed,
    # so this job stays fast): every pkg/tools/browser test that can launch a
    # real Chrome (or trigger the ~100MB Chrome-for-Testing download that
    # precedes it) must call the package's own skipIfNoBrowser(t) convention.
    # #615 found 17 tests that didn't — 15 gated only by the wrong/no-op
    # testing.Short(), and 2 with no gate at all. See
    # scripts/check-browser-tests-gated.sh.
    #
    # The SECOND #615 guard this job used to also run — a checker that
    # diffed this workflow's "-race package list" against
    # deploy/ci-worker/runci.sh's copy — is gone. scripts/race-packages.sh is
    # now the single source both files consume (see that script's header for
    # why a comparator was the wrong fix): there is no longer a second copy
    # for a lockstep checker to compare against.
    runs-on: ubuntu-latest
    # Not gated behind fast-tier: this is itself a fast, dependency-free
    # structural guard (same character as e2e-shard-check/cli-verb-guard
    # above) with nothing expensive downstream of it, so there is nothing
    # for it to short-circuit. Still path-filtered like every other job.
    needs: [changes]
    if: success() && needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify pkg/tools/browser real-Chrome tests are skipIfNoBrowser-gated
        run: bash scripts/check-browser-tests-gated.sh

  browser-e2e:
    name: "#615: real-Chrome browser tests"
    # Restores the real-Chrome coverage that #615's skipIfNoBrowser conversion
    # silently removed. Before that conversion these 16 tests were gated by
    # testing.Short(), which no gate here sets, so they ran and passed in the
    # plain "Tests" job (`ok .../pkg/tools/browser 48.108s`). Converting them to
    # skipIfNoBrowser was correct — it removed an undeclared ~100MB in-test
    # Chrome-for-Testing download from every gate — but skipIfNoBrowser's CI
    # branch fires on every GitHub runner (GitHub always sets CI=true), so
    # without this job the coverage would be zero while every gate stayed green.
    #
    # This is a SEPARATE job rather than OMNIPUS_BROWSER_E2E=1 on the "Tests"
    # job for two reasons: (a) the whole point is that Chrome is a DECLARED
    # dependency installed by an action, which we want on exactly one job
    # rather than slowing the main suite; (b) a Chrome/driver provisioning
    # failure then reads as "browser-e2e red" instead of failing the entire
    # test matrix for a reason unrelated to the code under review — the
    # missing-browser false-RED trap documented in deploy/ci-worker/CLAUDE.md.
    runs-on: ubuntu-latest
    needs: [changes, fast-tier, setup]
    if: success() && needs.changes.outputs.code == 'true'
    env:
      CGO_ENABLED: "0"
      # Opts past skipIfNoBrowser's CI branch. Set ONLY here.
      OMNIPUS_BROWSER_E2E: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Chrome (declared dependency, not an in-test download)
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Verify Chrome resolves under a name skipIfNoBrowser probes
        # skipIfNoBrowser (pkg/tools/browser/browser_e2e_test.go) probes
        # EXACTLY these four names via exec.LookPath. Bare `chrome` is NOT
        # among them, and setup-chrome can install the executable under that
        # name — so checking for "some chrome binary" would pass while every
        # test still skipped. Check the names the code actually looks for.
        run: |
          set -euo pipefail
          for n in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$n" >/dev/null 2>&1; then
              echo "found $n: $("$n" --version)"; exit 0
            fi
          done
          echo "::error::No Chrome binary under a name skipIfNoBrowser probes" >&2
          echo "PATH candidates present: $(command -v chrome || true)" >&2
          exit 1

      - name: "G-2 gate: chrome.tabCapture against a SECOND Chrome process"
        # ADR-075 / browser-workspace-ownership-spec FR-045, SC-012a.
        #
        # This is a MEASUREMENT GATE, not coverage. It answers one yes/no
        # question the per-workspace browser pool's whole design rests on:
        # ADR-048 proved chrome.tabCapture cannot capture a tab in a
        # CDP-CREATED browser context; the pool claims a tab in a SEPARATE
        # Chrome PROCESS's own default context does not inherit that
        # restriction. If this step goes red, the pool design is wrong and
        # must be revisited — it is not a flake to retry.
        #
        # Its OWN step with its OWN -run filter, deliberately NOT folded into
        # the whole-package step below: that step asserts `passes >= 180`, a
        # floor a single-test invocation trips by construction. (The spike
        # also runs inside that whole-package step, as any package test does;
        # this step is what makes its verdict individually visible and
        # individually blocking.)
        #
        # The test itself uses requireBrowserOrFail
        # (pkg/tools/browser/browser_e2e_test.go), which t.Fatal's exactly
        # where skipIfNoBrowser would t.Skip — a missing browser reads RED
        # here, not green. The assertions below are the second half of the
        # same rule: `go test` exits 0 when everything skips, and a `-run`
        # regex that matches nothing also exits 0. A gate that did not run
        # has answered nothing, so "exited 0" is never accepted as the
        # verdict on its own.
        run: |
          set -euo pipefail
          go test -v -tags goolm,stdjson -count=1 -timeout 600s \
            -run '^TestSpike_CaptureAgainstSecondChrome$' \
            ./pkg/tools/browser 2>&1 | tee /tmp/g2-second-chrome.log

          if grep -q 'no tests to run' /tmp/g2-second-chrome.log; then
            echo "::error::G-2: the -run filter matched no test — TestSpike_CaptureAgainstSecondChrome was renamed or removed. The gate did not run." >&2
            exit 1
          fi

          skips=$(grep -c -- '--- SKIP' /tmp/g2-second-chrome.log || true)
          if [ "$skips" -ne 0 ]; then
            echo "::error::G-2: the gate SKIPPED ($skips skip(s)). A skipped gate is a FAILED gate — it proves nothing about chrome.tabCapture against a second Chrome." >&2
            grep -- '--- SKIP' /tmp/g2-second-chrome.log >&2
            exit 1
          fi

          passes=$(grep -c -- '--- PASS' /tmp/g2-second-chrome.log || true)
          if [ "$passes" -ne 1 ]; then
            echo "::error::G-2: expected exactly one '--- PASS' line, got $passes. The gate's result is not what this step asserts on." >&2
            exit 1
          fi

          echo "G-2 PASS: chrome.tabCapture reached a tab in a SECOND Chrome process's default browser context."

      - name: Run pkg/tools/browser real-Chrome tests
        # Assert the tests RAN — do not just assert the process exited 0.
        # `go test` exits 0 when every test skips, which is exactly how #615's
        # real-Chrome coverage went to zero while all gates stayed green.
        #
        # Two deliberate choices here:
        #  * NON-recursive ./pkg/tools/browser. Every skipIfNoBrowser call site
        #    is in the top-level package; the subpackages carry unrelated skips
        #    (webrtc/inputdc_backpressure_test.go ends in an UNCONDITIONAL
        #    t.Skip), so a recursive skip-ban would fail this job on every run
        #    for reasons that have nothing to do with Chrome.
        #  * Assert on skipIfNoBrowser's OWN skip reasons plus a floor on the
        #    pass count, rather than banning every SKIP. Platform-gated skips
        #    are legitimate; a browser skip is the failure this job exists to
        #    catch. The floor catches the case where the suite runs but the
        #    gated tests silently vanish.
        run: |
          set -euo pipefail
          go test -v -tags goolm,stdjson -count=1 -timeout 900s ./pkg/tools/browser 2>&1 | tee /tmp/browser-e2e.log

          if grep -qE 'skipping browser E2E test|no managed Chrome for' /tmp/browser-e2e.log; then
            echo "::error::skipIfNoBrowser skipped — real-Chrome coverage is NOT running despite OMNIPUS_BROWSER_E2E=1" >&2
            grep -E 'skipping browser E2E test|no managed Chrome for' /tmp/browser-e2e.log >&2
            exit 1
          fi

          passes=$(grep -c -- '--- PASS' /tmp/browser-e2e.log || true)
          echo "pkg/tools/browser passing tests: $passes"
          # Ratchet, not a magic number: the real count with a working browser
          # is >=180 (verified against a live run with OMNIPUS_BROWSER_E2E=1),
          # not the 40 this floor was previously set to — a 40-test floor lets
          # coverage collapse by ~75% and still pass. Raise this number (never
          # lower it without re-verifying the true count) as more tests land.
          if [ "$passes" -lt 180 ]; then
            echo "::error::Only $passes tests passed; expected >=180 real-Chrome-capable tests. Coverage has silently shrunk." >&2
            exit 1
          fi

      # pkg/gateway/embed.go has //go:embed all:spa and pkg/gateway/spa/ is
      # gitignored, so the package does not COMPILE without a built SPA. This
      # job ran Go tests against pkg/gateway without ever building one, and
      # failed at "pattern all:spa: no matching files found" -> "[setup failed]"
      # -- a compile error wearing a test failure's clothes. Pre-existing: the
      # same job fails identically on release/v0.1.1.
      #
      # Same three steps every other Go-testing job here already uses
      # (cgo-gate, lint, vuln_check), so there is one way to provision the SPA
      # rather than two.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download node_modules artifact
        uses: actions/download-artifact@v7
        with:
          name: node-modules-${{ github.run_id }}

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Build SPA for the gateway embed
        run: |
          set -euo pipefail
          npm run build
          rm -rf pkg/gateway/spa
          cp -r dist/spa pkg/gateway/spa
          # Fail loudly here rather than 200 lines later inside `go test`.
          test -d pkg/gateway/spa/assets || { echo "::error::SPA sync failed: pkg/gateway/spa/assets missing" >&2; exit 1; }

      - name: Run pkg/gateway real-Chrome tests
        # Same skip-detection + pass-floor pattern as the pkg/tools/browser
        # step above, extended to close a second #615-shaped hole: this
        # package duplicates the skipIfNoBrowser convention as
        # browserWSSkipIfNoBrowser (pkg/gateway/browser_ws_test.go), and the
        # main "Tests" job never sets OMNIPUS_BROWSER_E2E — so every test
        # gated by it, including TestBrowserWS_Input_Navigate_SSRFBlocked_
        # FullRoundTrip (a security control, not just coverage), has been
        # running in NO environment at all.
        #
        # Targeted -run rather than a whole-package run, deliberately: unlike
        # pkg/tools/browser (a package that IS the browser feature),
        # pkg/gateway is a ~2,000-test package where only these four tests
        # are Chrome-gated. A whole-package pass-floor here would either be
        # guessed without ever having been measured (this job cannot run the
        # full gateway suite twice just to derive one), or duplicate the main
        # "Tests" job's own (now-fixed) assertion pass-for-pass for zero new
        # signal. Naming the four exactly means the floor below is exact and
        # verified by grep, not estimated — but it also means a FUTURE test
        # gated by browserWSSkipIfNoBrowser won't be swept in here
        # automatically; grep for new call sites the next time this list is
        # touched.
        run: |
          set -euo pipefail
          go test -v -tags goolm,stdjson -count=1 -timeout 300s \
            -run '^(TestBrowserWS_Input_Navigate_SSRFBlocked_FullRoundTrip|TestBrowserWS_Control_ControlledByOther_BroadcastsToSecondConnection|TestBrowserWS_Attach_AnnouncesWebRTCAvailabilityOnSameConnection|TestHandleBrowserInspect_Success_MarshalsTagTextHtml)$' \
            ./pkg/gateway 2>&1 | tee /tmp/gateway-browser-e2e.log

          if grep -qE 'skipping browser E2E test|no managed Chrome for' /tmp/gateway-browser-e2e.log; then
            echo "::error::browserWSSkipIfNoBrowser skipped — pkg/gateway real-Chrome coverage is NOT running despite OMNIPUS_BROWSER_E2E=1" >&2
            grep -E 'skipping browser E2E test|no managed Chrome for' /tmp/gateway-browser-e2e.log >&2
            exit 1
          fi

          passes=$(grep -c -- '--- PASS' /tmp/gateway-browser-e2e.log || true)
          echo "pkg/gateway real-Chrome passing tests: $passes"
          if [ "$passes" -lt 4 ]; then
            echo "::error::Only $passes of the 4 known browserWSSkipIfNoBrowser-gated pkg/gateway tests passed. Coverage has silently shrunk (or one of the four was renamed/removed without updating this step)." >&2
            exit 1
          fi

  typecheck:
    name: TypeScript Type Check
    # Runs `tsc -b --noEmit` (project-references build mode) against the repo
    # root. Note: `tsc --noEmit` (without -b) silently no-ops on a
    # project-references root (no "include"/"files") and always exits 0. The
    # `-b` flag is required to actually type-check the referenced sub-projects.
    # See F6 in the Phase 7 review findings.
    #
    # ADR-067 step 12: skips when no SPA-relevant file changed (see the
    # `changes` job's `spa` filter and its force-full list). `code` is still
    # checked too — `spa` narrows on top of it, never replaces it.
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: success() && needs.changes.outputs.code == 'true' && needs.changes.outputs.spa == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download node_modules artifact
        uses: actions/download-artifact@v7
        with:
          name: node-modules-${{ github.run_id }}

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Run TypeScript type check
        run: npm run typecheck

  lint-spa:
    name: ESLint (SPA)
    # eslint.config.js runs @eslint/js + typescript-eslint at stock,
    # unweakened severities (see that file's header). This repo had no SPA
    # lint job at all before this — the config was decorative on its own.
    # Existing pre-existing violations are recorded as an explicit,
    # ratcheting baseline in scripts/check-eslint-ratchet.sh rather than
    # silenced in config; the ratchet fails the build on any NEW violation
    # and also fails if the baseline goes stale after a cleanup, so debt
    # can only move down, never back up. No continue-on-error: violations
    # must be visible as red on every PR, same as every other lint job in
    # this workflow.
    #
    # ADR-067 step 12: skips when no SPA-relevant file changed (see the
    # `changes` job's `spa` filter and its force-full list). `code` is still
    # checked too — `spa` narrows on top of it, never replaces it.
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: success() && needs.changes.outputs.code == 'true' && needs.changes.outputs.spa == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download node_modules artifact
        uses: actions/download-artifact@v7
        with:
          name: node-modules-${{ github.run_id }}

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Run ESLint (must be clean — no baseline, no ratchet)
        run: npm run lint

  vitest:
    name: Vitest — ${{ matrix.group }}
    # ADR-067 step 12: skips when no SPA-relevant file changed (see the
    # `changes` job's `spa` filter and its force-full list). `code` is still
    # checked too — `spa` narrows on top of it, never replaces it.
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: success() && needs.changes.outputs.code == 'true' && needs.changes.outputs.spa == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Group A: lib, store, routes, test — fast pure-logic units.
          # tests/e2e/fixtures/ belongs here despite living outside src/:
          # vite.config.ts's vitest `include` covers
          # 'tests/**/*.test.{ts,tsx}' as well as src/, and the pure-logic
          # unit tests for the Playwright fixtures (selectors.test.ts) are
          # vitest tests, not Playwright specs — vitest's include matches
          # *.test.ts only, so the sibling *.spec.ts Playwright files are not
          # picked up by this pattern. It ran in NO shard until 2026-08-23.
          - group: lib-store
            patterns: "src/lib/ src/store/ src/routes/ src/test/ tests/e2e/fixtures/"
          # Group B: chat components — heaviest component group
          - group: components-chat
            patterns: "src/components/chat/"
          # Group C: agents + settings + skills + shared + ui components
          - group: components-agents-settings
            patterns: "src/components/agents/ src/components/settings/ src/components/skills/ src/components/shared/ src/components/ui/"
          # Group D: layout components
          - group: components-layout
            patterns: "src/components/layout/"
          # Group E: workspaces — the largest single group (v0.3 flagship)
          - group: components-workspaces
            patterns: "src/components/workspaces/"
          # Group F: everything else with tests. NOTE: this matrix is an
          # ALLOWLIST — a test file matching no group is silently never run
          # while the job still reports green. scripts/check-vitest-coverage.mjs
          # fails the build if that happens, so add new directories HERE (or to
          # a group above) rather than letting them go unexecuted.
          - group: components-misc
            patterns: "src/components/screens/ src/components/browser/ src/components/calendar/ src/components/library/ src/components/connectors/ src/components/providers/ src/components/search/ src/components/sessions/ src/hooks/ src/assets/ src/styles/"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download node_modules artifact
        uses: actions/download-artifact@v7
        with:
          name: node-modules-${{ github.run_id }}

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Verify every test file is covered by some vitest group
        # An unmatched test file is silently never run while this job still
        # reports green — see the script header for the 116-file incident.
        run: node scripts/check-vitest-coverage.mjs

      - name: Run Vitest (${{ matrix.group }})
        env:
          VITEST_PATTERNS: ${{ matrix.patterns }}
        # Each space-separated token in VITEST_PATTERNS is a separate vitest path
        # filter (substring match against the full path). Split explicitly into an
        # array rather than relying on unquoted word-splitting, so the intent is
        # stated in the code instead of in a comment shellcheck cannot verify.
        run: |
          read -ra patterns <<< "$VITEST_PATTERNS"
          if [ ${#patterns[@]} -eq 0 ]; then
            echo "ERROR: VITEST_PATTERNS is empty for group '${{ matrix.group }}' —" >&2
            echo "an unfiltered run would silently test everything or nothing." >&2
            exit 1
          fi
          npx vitest run --reporter=verbose "${patterns[@]}"

  wire-types-lint:
    name: Wire-Types Lint
    # Enforces hard-constraint #8 (CLAUDE.md contract-first rule): every wire-
    # format type that crosses the gateway/SPA boundary must live in the contract
    # spec and be generated — not hand-written. A hand-written struct in
    # pkg/gateway/*.go (name ending in Frame/Response/Request/Payload, ≥2 json
    # tags) or a hand-written `export interface …Frame|…Response` in src/lib/
    # fails this job.
    #
    # The baseline (existing pre-Phase-7 findings) will fail until Phase 7 cleans
    # them up. This job intentionally does NOT use continue-on-error — violations
    # must be visible as red on every PR.
    #
    # Developer opt-out for confirmed false positives:
    #   Go:  add `// not-wire-format` on the `type Foo struct {` line
    #   TS:  add `// not-wire-format` on the `export interface Foo` line
    runs-on: ubuntu-latest
    needs: [changes]
    if: success() && needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run wire-types lint self-tests
        # F8 (round-2 review): the script's --self-test mode (35+ synthetic
        # pattern assertions covering every rule, including the F8 additions
        # ST-23/ST-24) previously ran nowhere in CI — a regression in the
        # lint's own regex logic could ship silently since nothing exercised
        # it. Run BEFORE the real scan below so a broken pattern is caught
        # before it either false-negatives on a real finding or false-
        # positives across the whole tree.
        run: bash scripts/check-no-handwritten-wire-types.sh --self-test

      - name: Run wire-types lint
        # No language runtimes needed beyond bash + python3 (both present on
        # ubuntu-latest). The script exits 1 if any hand-written wire-format
        # types are found; exit 0 means clean.
        run: bash scripts/check-no-handwritten-wire-types.sh

  tool-error-status-lint:
    name: Tool-Error-From-Status Lint
    # Regression guard for issue #617: an SPA tool-call component must never
    # derive its ERROR state from AssistantUI's `status.type === 'incomplete'`
    # — a finished tool call always carries a truthy result, so that status
    # can never be true for a real failure (see this job's script for the
    # full mechanism). This exact anti-pattern was independently introduced
    # across several component families before being fixed; this job stops a
    # third recurrence rather than relying on review alone.
    #
    # Developer note: this check has no opt-out comment (unlike the wire-
    # types lint) — the two legitimate exceptions (isCancelledStatus's own
    # reason-qualified check, and GenericToolCall's `|| !!error`-disjuncted
    # form) are structurally excluded by the script itself, not via a
    # per-line annotation. If this fires, read the real outcome instead — see
    # the script's header comment for the correct pattern.
    runs-on: ubuntu-latest
    needs: [changes]
    if: success() && needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run tool-error-from-status lint
        # python3-based (not `grep -P`) so it behaves identically on
        # contributors' local macOS/BSD-grep machines and on this
        # ubuntu-latest runner — see the script's header comment.
        run: bash scripts/check-no-tool-error-from-status.sh

      - name: Run JPEG-screencast removal guard
        # ADR-061: the JPEG live-browser fallback is deleted and WebRTC is the
        # only live-video path. Long-lived branches cut before the removal
        # still contain the whole pipeline, so a merge re-adds it as an
        # ordinary, conflict-free addition. This is the mechanical half of
        # CLAUDE.md's "Retired surfaces — do NOT reintroduce" rule.
        run: bash scripts/check-no-jpeg-screencast.sh

      - name: Run E2E auth cross-talk guard
        # POST /api/v1/auth/login re-mints the SINGLE-SLOT session_token_hash,
        # invalidating the shared storageState cookie for every spec that runs
        # after the caller. dev_mode_bypass masks that on every route except
        # GET /api/v1/providers, so the failure surfaces far from its cause.
        # Self-test first — a guard that cannot fail is no guard
        # (docs/internal/false-green-patterns.md).
        run: |
          bash scripts/check-e2e-login-crosstalk.sh --self-test
          bash scripts/check-e2e-login-crosstalk.sh

      - name: Run removed-providers guard self-check
        # Proves the guard below can still go red (ADR-068 spec SC-001) before
        # its verdict is trusted — see docs/internal/false-green-patterns.md.
        run: bash scripts/check-no-removed-providers-selfcheck.sh

      - name: Run removed-providers guard
        # ADR-068 §2.4: antigravity, claude-cli and the OpenAI device-code flow
        # are deleted greenfield with no trace outside the historical records in
        # scripts/no-removed-providers.allow. Branches cut before the deletion
        # re-add them on merge as an ordinary addition — keep the deletion.
        run: bash scripts/check-no-removed-providers.sh

      - name: Run ADR-067 greenfield guard self-test
        # Proves the guard below can still go red (11 planted violations, one
        # per rule) before its verdict is trusted — see
        # docs/internal/false-green-patterns.md.
        run: bash scripts/check-greenfield-providers.sh --self-test

      - name: Run ADR-067 greenfield guard
        # ADR-067 SC-008 / SC-009 / US-11.AC2: pkg/providers/capabilities is
        # folded into pkg/providers/catalog, the prefix-stripping resolver is
        # gone, neither pkg/providers nor pkg/config carries alias / migration
        # / deprecation machinery, and the SPA's bundled catalog is deleted.
        # A branch cut before ADR-067 re-adds the alias path on merge as an
        # ordinary addition — KEEP THE DELETION.
        run: bash scripts/check-greenfield-providers.sh

  verify-contracts:
    name: Verify Contracts
    # Ensure generated wire-format types (TS + Go) match the spec files.
    # Failure means someone edited a spec without running gen-contracts.sh,
    # or edited a generated file directly. Fix: run `make gen-contracts` locally
    # and commit the regenerated diff.
    # Cross-cutting (Go + TS both), so left gated on `code` alone — not
    # narrowed to `go` or `spa` individually (ADR-067 step 12 only splits
    # the exclusively-Go and exclusively-frontend suites).
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: success() && needs.changes.outputs.code == 'true'
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download node_modules artifact
        uses: actions/download-artifact@v7
        with:
          name: node-modules-${{ github.run_id }}

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Install oapi-codegen
        # Pin to a known-good version that matches the generated file headers.
        # The binary is placed on PATH via GOPATH/bin which Go's setup-go action
        # adds to PATH automatically.
        #
        # Bumped from v2.4.1 → v2.7.0 to match the version that produced the
        # committed pkg/api/generated/*.gen.go files (see header comment).
        # v2.4.1 generates a subset (no Valid() enum methods, no Bearer auth
        # context-key type, different anonymous-response numbering), so the
        # previous pin caused make verify-contracts to fail on every PR with
        # a phantom drift diff. The codebase has been using v2.7.0 output
        # since commit 6acaf2b on 2026-05-18.
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.0

      - name: Run verify-contracts
        # gen-contracts.sh lints both specs, regenerates all artifacts, then
        # git diff --exit-code fails the job if any file was modified.
        # A non-zero exit means the committed generated files are stale.
        run: make verify-contracts

  lint:
    name: Linter
    # ADR-067 step 12: skips when no Go-relevant file changed (see the
    # `changes` job's `go` filter and its force-full list). `code` is still
    # checked too — `go` narrows on top of it, never replaces it. Still
    # needs Node/npm to build the SPA embed target below, purely because
    # go:embed requires it to exist for the Go build to compile — that need
    # is unconditional whenever this job runs at all, independent of whether
    # any SPA source itself changed.
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: success() && needs.changes.outputs.code == 'true' && needs.changes.outputs.go == 'true'
    env:
      # Omnipus ships a pure-Go binary (CLAUDE.md hard constraint #2), so tests
      # run with cgo disabled to match the release build. This is the
      # enforcement mechanism for that constraint — the packages themselves
      # carry no !cgo build tags (see the cgo-gate job, which builds the module
      # under both CGO_ENABLED=0 and =1).
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download node_modules artifact
        uses: actions/download-artifact@v7
        with:
          name: node-modules-${{ github.run_id }}

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Build SPA
        # pkg/gateway/embed.go has //go:embed all:spa and pkg/gateway/spa/ is
        # gitignored. Vite builds into dist/spa; we copy it into the embed
        # target so go vet/build/lint can compile the !cgo gateway files.
        run: |
          set -euo pipefail
          npm run build
          rm -rf pkg/gateway/spa
          cp -r dist/spa pkg/gateway/spa

      - name: Run go generate
        run: go generate ./...

      - name: Golangci Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --build-tags=goolm,stdjson

  fast-tier:
    name: Fast tier checks passed
    # Aggregator (Task B tiering): every SLOW-tier job below needs this
    # instead of listing all 8 fast jobs individually. It has no work of
    # its own — it exists purely so a cheap failure (e.g. a lint typo)
    # short-circuits the expensive tier (full Go suite, Playwright, ...)
    # instead of both running concurrently and burning 15+ minutes for
    # nothing. If any of its needs failed, or was skipped by the path
    # filter, this job is itself skipped too (default `success()` semantics
    # on `needs:`), which cascades the skip down through every SLOW job's
    # own needs on it.
    #
    # ADR-067 step 12 changes this: `typecheck`, `lint-spa`, and `lint` are
    # now independently skippable (spa==false or go==false respectively)
    # even when `code` is true. A skipped need is NOT a success under
    # GitHub's default `needs` semantics, so a bare `success()` here would
    # cascade-skip THIS job whenever any one of those three legitimately
    # skips — taking every Tier 2/3 job down with it, including ones from
    # the OTHER cohort that still needed to run (e.g. a pure-SPA PR
    # legitimately skipping `lint` (go==false) must not also take `vitest`
    # (spa==true, needs fast-tier) down with it). So this job cannot rely on
    # bare success(): each of the three conditionally-skippable needs is
    # explicitly allowed to be 'skipped' as well as 'success'; every other
    # need (still gated on `code` alone, unchanged) must be a real
    # 'success' — a genuine failure or cancellation of ANY need still blocks
    # this job exactly as before.
    #
    # `!cancelled()` (not a bare custom expression, and deliberately not
    # `always()`) is required as the leading term: GitHub implicitly ANDs a
    # bare `success()` onto ANY `if:` that doesn't itself call one of
    # success()/always()/failure()/cancelled() — so without this, the
    # tolerant `(... == 'skipped')` clauses below would be silently
    # overridden by that same implicit success() gate this whole comment is
    # working around. `!cancelled()` is GitHub's own documented alternative
    # to `always()` here: it drops the implicit success() gate (letting the
    # explicit per-need checks below be the ONLY gate) without also making
    # this job eligible to start while the run itself is being cancelled,
    # which bare `always()` would.
    #
    # `setup` is listed as a need and checked explicitly. It is NOT redundant
    # bookkeeping: `typecheck`, `lint-spa` and `lint` all consume setup's
    # node_modules artifact AND are all explicitly tolerated as 'skipped'
    # above, so a broken `npm ci` skips all three and this job tolerates all
    # three. The only thing that used to stop a failed setup from clearing the
    # whole fast tier was `verify-contracts` happening to also consume the
    # artifact while NOT being tolerant of a skip — one undeclared edge
    # carrying the entire cascade. Stated directly here instead.
    # `setup` is gated on `code == 'true'` exactly like this job, so whenever
    # this job is eligible at all setup has really run: no 'skipped'
    # tolerance is wanted or correct for it. Same shape the `playwright` job
    # already uses.
    runs-on: ubuntu-latest
    needs:
      - changes
      - setup
      - e2e-shard-check
      - cli-verb-guard
      - typecheck
      - lint-spa
      - wire-types-lint
      - tool-error-status-lint
      - verify-contracts
      - lint
    if: >-
      !cancelled() &&
      needs.changes.outputs.code == 'true' &&
      needs.changes.result == 'success' &&
      needs.setup.result == 'success' &&
      needs.e2e-shard-check.result == 'success' &&
      needs.cli-verb-guard.result == 'success' &&
      (needs.typecheck.result == 'success' || needs.typecheck.result == 'skipped') &&
      (needs.lint-spa.result == 'success' || needs.lint-spa.result == 'skipped') &&
      needs.wire-types-lint.result == 'success' &&
      needs.tool-error-status-lint.result == 'success' &&
      needs.verify-contracts.result == 'success' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    steps:
      - name: Fast tier green
        run: echo "All fast-tier checks passed — slow tier is cleared to run."

  vuln_check:
    name: Security Check
    # ADR-067 step 12: skips when no Go-relevant file changed (see the
    # `changes` job's `go` filter and its force-full list). `code` is still
    # checked too — `go` narrows on top of it, never replaces it.
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: success() && needs.changes.outputs.code == 'true' && needs.changes.outputs.go == 'true'
    env:
      GOFLAGS: -tags=goolm,stdjson
      # See comment on the lint job above.
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download node_modules artifact
        uses: actions/download-artifact@v7
        with:
          name: node-modules-${{ github.run_id }}

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Build SPA
        # govulncheck runs a build under the hood; the gateway embed target
        # must exist for that build to succeed.
        run: |
          set -euo pipefail
          npm run build
          rm -rf pkg/gateway/spa
          cp -r dist/spa pkg/gateway/spa

      - name: Run Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
          # The action runs its OWN setup-go with go-version-input:stable and
          # GOTOOLCHAIN=local, so it ignores both the job's Setup Go step and
          # go.mod's toolchain. Pin it to the patched stdlib (go1.26.6
          # clears GO-2026-6218/6090/6089/6088/5972/5026). Keep this
          # in sync with the `go` directive in go.mod.
          go-version-input: '1.26.6'

  cgo-gate:
    name: CGO_ENABLED=0 Build Gate
    # Omnipus is a pure-Go single binary (CLAUDE.md hard constraint #2: no CGo,
    # no external C libs). This gate runs an explicit CGO_ENABLED=0 build of the
    # entire module so a CGo dependency sneaking into any package fails CI
    # loudly and early — independent of the test job. Among other things this
    # protects bleve's pure-Go scorch backend (no leveldb/rocksdb CGo kvstore).
    #
    # ADR-067 step 12: skips when no Go-relevant file changed (see the
    # `changes` job's `go` filter and its force-full list). `code` is still
    # checked too — `go` narrows on top of it, never replaces it.
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: success() && needs.changes.outputs.code == 'true' && needs.changes.outputs.go == 'true'
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download node_modules artifact
        uses: actions/download-artifact@v7
        with:
          name: node-modules-${{ github.run_id }}

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Build SPA
        # pkg/gateway/embed.go has //go:embed all:spa and pkg/gateway/spa/ is
        # gitignored. Vite builds into dist/spa; we copy it into the embed
        # target so the CGO=0 build can resolve the //go:embed directive.
        run: |
          set -euo pipefail
          npm run build
          rm -rf pkg/gateway/spa
          cp -r dist/spa pkg/gateway/spa

      - name: CGO_ENABLED=0 build (all packages)
        # Build every package in the module with CGO disabled. Any package that
        # transitively requires CGo (cgo import, or a dep tagged //go:build cgo)
        # fails to compile here. The canonical build tags match CI/release.
        run: go build -tags goolm,stdjson ./...

      - name: CGO_ENABLED=0 vet (smoke)
        # go vet under CGO=0 is the canonical vet for this module: production
        # and release builds are always CGO_ENABLED=0.
        run: go vet -tags goolm,stdjson ./...

      - name: CGO_ENABLED=1 build (all packages)
        # The counterpart to the CGO=0 build above, and the gate CLAUDE.md has
        # always documented but CI never actually ran (every job pinned
        # CGO_ENABLED=0). It does NOT permit CGo — CGO=0 above still proves the
        # module is CGo-free. It proves every package still COMPILES when cgo is
        # enabled, which is what `go test -race` requires (race forces cgo).
        #
        # This exists because ~70 production files (all of pkg/gateway, plus
        # tests/integration|perf|security) once carried //go:build !cgo, so
        # under CGO_ENABLED=1 those packages compiled to nothing and could never
        # be race-tested. This step fails loudly if such a tag comes back.
        env:
          CGO_ENABLED: "1"
        run: go build -tags goolm,stdjson ./...


  hermetic-build:
    name: Hermetic Build Gate (catalog snapshot)
    # T067-06 / ADR-067 FR-006, US-2.AC5 (spec test T48): the provider catalog
    # is a committed, git-tracked snapshot embedded via //go:embed — the build
    # must never fetch it (or any Go module) from the network. After a
    # warm-cache step, `make build` runs with GOPROXY=off so any build-time
    # module fetch fails loudly. The job also pins the snapshot mechanics:
    # the file is git-tracked, pkg/providers/catalog carries exactly one
    # //go:embed and no //go:generate that could reach the network.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Snapshot git-tracked, single go:embed, no go:generate
        run: |
          set -euo pipefail
          git ls-files --error-unmatch pkg/providers/catalog/data/providers_catalog.json
          embed_count=$(grep -rh --include='*.go' '^//go:embed' pkg/providers/catalog | wc -l)
          if [ "$embed_count" -ne 1 ]; then
            echo "expected exactly one //go:embed in pkg/providers/catalog, found $embed_count"
            grep -rn --include='*.go' '^//go:embed' pkg/providers/catalog || true
            exit 1
          fi
          if grep -rn --include='*.go' '^//go:generate' pkg/providers/catalog; then
            echo "pkg/providers/catalog must not carry //go:generate directives (hermetic build)"
            exit 1
          fi

      - name: Warm Go module cache (the only step allowed to fetch modules)
        run: go mod download

      - name: Hermetic make build (GOPROXY=off)
        # GOFLAGS uses the -tags= equals form on purpose: the Makefile's
        # `GOFLAGS?=` lets this env value override it (so it must carry the
        # canonical build tags), AND the go tool parses the same value from
        # the environment, where the space form (`-tags goolm,stdjson`) is
        # rejected as a non-flag argument.
        env:
          GOPROXY: "off"
          GOFLAGS: "-v -tags=goolm,stdjson -mod=mod"
        run: make build


  test:
    name: Tests
    # ADR-067 step 12: skips when no Go-relevant file changed (see the
    # `changes` job's `go` filter and its force-full list). `code` is still
    # checked too — `go` narrows on top of it, never replaces it. Downstream
    # `security`/`perf-smoke` (needs: this job) and `e2e-plan`/`playwright`
    # (needs: this job too, but NOT go-gated — they exercise the full stack
    # and must still run on an spa-only change) each account for this job's
    # possible 'skipped' result explicitly — see their own comments.
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: success() && needs.changes.outputs.code == 'true' && needs.changes.outputs.go == 'true'
    env:
      # See comment on the lint job above.
      CGO_ENABLED: "0"
      # OPENROUTER_API_KEY is required by tests that boot a real gateway via
      # testutil.StartTestGateway (the test_harness override hook was removed
      # 2026-05-10; tests now hit real OpenRouter for any LLM-driven path).
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_CI }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download node_modules artifact
        uses: actions/download-artifact@v7
        with:
          name: node-modules-${{ github.run_id }}

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Build SPA
        run: |
          set -euo pipefail
          npm run build
          rm -rf pkg/gateway/spa
          cp -r dist/spa pkg/gateway/spa

      - name: Run go generate
        run: go generate ./...

      - name: Run go test
        # Flake filter (mirrors deploy/ci-worker/runci.sh run_gotest): a package
        # that FAILS the full parallel run but PASSES when re-run isolated (-p 1)
        # is a timing flake under GitHub-runner CPU oversubscription, not a real
        # failure — pkg/agent's async delegation/cancel tests are the usual
        # offenders. A package that fails BOTH times is a real failure; a
        # non-zero exit with no package-level `FAIL <pkg>` line (a build/setup
        # error) is a real failure too and is never swallowed.
        #
        # DATA RACE carve-out: this step doesn't pass -race itself (that's the
        # dedicated step below), but a "DATA RACE" marker in the output — e.g.
        # a future GOFLAGS change, or a test binary that shells out with -race
        # — is never routed through the flake filter. A race that only
        # manifests under parallel package execution and vanishes under -p 1
        # is the textbook signature of a genuine concurrency bug, not CI
        # flakiness; defense in depth here is cheap.
        #
        # --- FAIL carve-out (docs/internal/false-green-patterns.md: "contention
        # causes timeouts; it does not cause assertion failures. A `--- FAIL`
        # line is real signal under any load."): the isolated re-run below
        # exists ONLY for the hang/contention signature — a package that fails
        # with a bare `FAIL <pkg>` summary and NO per-test `--- FAIL` line
        # (a timeout, a deadlock, a panic mid-run). A `--- FAIL: TestName` line
        # means a specific assertion failed, which contention does not cause —
        # so it is never given a second isolated attempt to "pass clean",
        # exactly like DATA RACE above. Checked on the whole run's output
        # rather than per-package, same as the DATA RACE check, and for the
        # same reason: it must not be possible for a real assertion failure
        # elsewhere in the run to be laundered by scoping the check too
        # narrowly.
        run: |
          set +e
          # -timeout 30m: go test's DEFAULT is 10 minutes PER PACKAGE, and
          # pkg/agent has been measured at 752s (12.5 min) on a developer
          # machine under load. A package that exceeds it fails with
          # "panic: test timed out after 10m0s" -- a timeout, not an assertion,
          # and one that looks nothing like the failure it actually is. The
          # other workflows here already pass -timeout explicitly
          # (cross-platform.yml, and pr.yml's own e2e steps at 600s/900s/300s);
          # this step was the one that inherited the default.
          out=$(go test -tags goolm,stdjson -count=1 -timeout 30m ./... 2>&1)
          code=$?
          echo "$out"
          # DATA RACE is checked BEFORE the exit-code short-circuit on purpose: a
          # race can be reported without flipping the overall `go test` exit code
          # (e.g. a test that shells out with -race and only inspects the child's
          # stdout, or ignores cmd.Run()'s error). Checking after `[ $code -eq 0 ]`
          # would skip exactly the case this carve-out's own rationale describes.
          #
          # Native bash substring match — NOT `printf ... | grep -q`. Under
          # GitHub's `bash -eo pipefail`, `grep -q` exits on the FIRST match and
          # closes the pipe, `printf` then dies of SIGPIPE (141), and pipefail
          # makes the whole pipeline 141 — so the test evaluated FALSE and this
          # carve-out was silently skipped whenever the race report appeared more
          # than one pipe buffer (64 KB) from the end of $out. Real `go test`
          # output is megabytes, so that was the COMMON case; it only "worked"
          # against small synthetic fixtures. No pipe, no subprocess, no SIGPIPE.
          if [[ $out == *"DATA RACE"* ]]; then
            echo ""
            echo "=== DATA RACE detected in parallel run — this is never excused by an isolated re-run ==="
            failed=$(printf '%s\n' "$out" | grep -aE '^FAIL[[:space:]]' | awk '{print $2}' | grep -a '/' | sort -u)
            if [ -n "$failed" ]; then
              for p in $failed; do
                echo "REAL FAILURE (data race detected — never excused): $p"
              done
            else
              echo "REAL FAILURE (data race detected — never excused): race detected but no package-level FAIL line matched; see full output above"
            fi
            exit 1
          fi
          # Same native-substring reasoning as DATA RACE above — no grep -q on
          # the multi-megabyte $out.
          if [[ $out == *"--- FAIL"* ]]; then
            echo ""
            echo "=== --- FAIL detected — an assertion failure is never excused by an isolated re-run ==="
            failed=$(printf '%s\n' "$out" | grep -aE '^FAIL[[:space:]]' | awk '{print $2}' | grep -a '/' | sort -u)
            if [ -n "$failed" ]; then
              for p in $failed; do
                echo "REAL FAILURE (assertion failure detected — never excused): $p"
              done
            else
              echo "REAL FAILURE (assertion failure detected — never excused): --- FAIL detected but no package-level FAIL line matched; see full output above"
            fi
            exit 1
          fi
          # No race and no assertion failure detected — now the ordinary
          # short-circuit applies. What reaches the flake filter below is
          # exclusively the hang/contention signature: a bare `FAIL <pkg>`
          # summary with no `--- FAIL` line anywhere in the run.
          [ $code -eq 0 ] && exit 0
          failed=$(printf '%s\n' "$out" | grep -aE '^FAIL[[:space:]]' | awk '{print $2}' | grep -a '/' | sort -u)
          [ -z "$failed" ] && exit $code
          echo ""
          echo "=== FLAKE FILTER: re-running failed packages isolated (-p 1): $failed ==="
          rc=0
          for p in $failed; do
            if go test -tags goolm,stdjson -count=1 -p 1 "$p" >/tmp/rr.log 2>&1; then
              echo "FLAKE (passed isolated): $p"
            else
              echo "REAL FAILURE (failed twice): $p"; grep -aE '^--- FAIL' /tmp/rr.log | head; rc=1
            fi
          done
          exit $rc

      - name: Run pkg/sandbox Landlock tests
        # Same skip-detection + pass-floor pattern as browser-e2e's
        # pkg/tools/browser step, applied to a second silent-coverage-loss
        # exposure: every Landlock-backed test in pkg/sandbox degrades to
        # t.Skip when the Landlock backend is unavailable (kernel too old,
        # ABI too low, running as root), and `go test` exits 0 when every one
        # of them skips — the exact #615 shape. Verified separately that the
        # dedicated Fly worker's kernel has Landlock compiled out entirely, so
        # a green from that worker carries zero kernel-sandbox signal; this
        # step exists so the SAME loss on THIS (GitHub-hosted) runner is loud
        # instead of silent, whichever way it turns out.
        #
        # Targeted -run at the specific tests whose skip path is "the
        # Landlock backend itself is unavailable" (backend selection, ABI
        # gate, subprocess enforcement, and the redteam suites that require a
        # real Landlock-confined child) — not a whole-package run. pkg/sandbox
        # is a ~230-test package covering Windows Job Objects, macOS
        # sandbox-exec, and general policy logic that has nothing to do with
        # Landlock and legitimately skips for unrelated platform reasons; a
        # blanket skip-ban or a whole-package pass-floor guessed without ever
        # running it would be exactly the kind of manufactured-green threshold
        # this task exists to remove. The floor below (10) is exact and
        # verified by grep, not estimated — but as with the pkg/gateway step
        # above, a future Landlock-gated test needs adding to this list by
        # hand; grep for new "Landlock (backend )?not available|Landlock
        # unavailable|Landlock ABI v4" call sites the next time this is
        # touched.
        run: |
          set -euo pipefail
          go test -v -tags goolm,stdjson -count=1 -timeout 300s \
            -run '^(TestSandboxBackend_LinuxFull|TestSandboxBackend_LandlockFallbackChain|TestApplyOnABI4_EINVAL_HardFails|TestLandlock_ApplySubprocess|TestLandlock_BindBlockedSubprocess|TestLandlock_BindAllowedSubprocess|TestLandlock_WorkspaceReroot_StaysInsideBootGrant|TestRedteam_RawTCP_Egress_Blocked|TestRedteam_MasterKey_Exfil_Blocked|TestRedteam_Credentials_Exfil_Blocked)$' \
            ./pkg/sandbox 2>&1 | tee /tmp/sandbox-landlock.log

          if grep -qE 'Landlock (backend )?not available|Landlock unavailable|Landlock ABI v4' /tmp/sandbox-landlock.log; then
            echo "::error::Landlock backend unavailable on this runner — pkg/sandbox kernel-sandbox tests are NOT exercising Landlock. This carries zero kernel-sandbox signal even though the job is green." >&2
            grep -E 'Landlock (backend )?not available|Landlock unavailable|Landlock ABI v4' /tmp/sandbox-landlock.log >&2
            exit 1
          fi

          passes=$(grep -c -- '--- PASS' /tmp/sandbox-landlock.log || true)
          echo "pkg/sandbox Landlock-backed passing tests: $passes"
          if [ "$passes" -lt 10 ]; then
            echo "::error::Only $passes of the 10 known Landlock-backed pkg/sandbox tests passed. Coverage has silently shrunk (or one of the ten was renamed/removed without updating this step)." >&2
            exit 1
          fi

  # Split out of `test` (ADR-067 parallelism pass). Measured on a real run,
  # the single Tests job spent 355s on `go test` and then a further 648s on
  # `go test -race` — 58% of an 18.7-minute job, running strictly AFTER the
  # unit pass for no reason other than sharing a job. The race pass covers a
  # different, smaller package list (scripts/race-packages.sh) and consumes
  # nothing the unit pass produces, so the two are independent and now run
  # concurrently on separate runners.
  #
  # This costs an extra checkout, Go cache and SPA build. That is the
  # deliberate trade: compute for wall clock.
  test-race:
    name: Race Tests
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: success() && needs.changes.outputs.code == 'true' && needs.changes.outputs.go == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download node_modules artifact
        uses: actions/download-artifact@v7
        with:
          name: node-modules-${{ github.run_id }}

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Build SPA
        run: |
          set -euo pipefail
          npm run build
          rm -rf pkg/gateway/spa
          cp -r dist/spa pkg/gateway/spa

      - name: Run go generate
        run: go generate ./...

      - name: Run go test -race (concurrency-sensitive packages)
        # The PACKAGE LIST itself lives in scripts/race-packages.sh (F5,
        # #615/#617/#618 hardening review) — that is the single source both
        # this step and deploy/ci-worker/runci.sh's run_gorace consume, so
        # they can no longer drift. The comments below explain WHY each
        # package earned its place; edit scripts/race-packages.sh, not this
        # comment block, to add or remove one.
        #
        # pkg/agent is now INCLUDED. It was excluded for "2 pre-existing races in
        # unrelated tests"; a full `go test -race -count=1 -p 1 ./pkg/agent/` run
        # on 2026-07-26 reported ZERO data races (ok, 124.6s), so the exclusion
        # was stale and Constraint #7 ("pre-existing is never a closure path")
        # applies. If a race reappears here it is a real finding, not a flake —
        # the DATA RACE carve-out above makes it unexcusable.
        # The packages below cover the full concurrency
        # contract introduced by MutateConfig, WithConfig, SaveConfigLocked,
        # and the single-user bypass, plus ADR-054's pkg/entity (64-shard
        # striped mutex + sidecar flock) and pkg/agentstore.
        # pkg/gateway used to be excluded because every gateway file carried
        # //go:build !cgo, so under CGO_ENABLED=1 the package compiled to
        # nothing and the test invocation failed. That tag has been removed
        # (the pure-Go guarantee is enforced by the CGO_ENABLED=0 gate, not by
        # a build tag), so pkg/gateway is now race-buildable. The old claim
        # that "race coverage for the gateway is provided by the CGO=0 test job"
        # was false — -race requires cgo, so a CGO_ENABLED=0 job runs no race
        # detector at all. pkg/gateway is now INCLUDED below.
        #
        # It earned its place immediately: the first race run of that
        # newly-unlocked surface found TWO real production races, both fixed —
        # retentionToolResultSweepFn read by the boot sweep goroutine five lines
        # before it was assigned (60bc0446), and Manager.StopAll closing worker
        # queues while dispatchOutbound was still sending on them, which panics
        # (f5cfa241). Neither was reachable by any gate that existed before.
        #
        # tests/integration is included for the same reason — it is where the
        # second race actually surfaced, and it is the only suite that exercises
        # a real gateway boot+shutdown cycle. Both were verified locally under
        # -race (single run and -count=3, zero reports) before being added here;
        # the timeout below is raised to accommodate them.
        #
        # pkg/logger is included (99d4e729's logMessage fix, guarded by
        # logger_race_test.go): logMessage read the package-level
        # `logger`/`fileLogger` globals with no RLock while four mutators wrote
        # under Lock, on the path of every log call in the binary — reverting
        # the fix would have kept CI green forever without this line, since the
        # package's only other coverage is the plain (non-race) `go test` job
        # above, which cannot detect a race by construction. The package's
        # whole race suite (a single 300ms-deadline goroutine-hammer test plus
        # the ordinary unit tests) completes in ~1.3s under -race — negligible
        # next to the headroom the 240s→600s raise already bought
        # pkg/agent/pkg/gateway/tests/integration. (Timeout was raised again,
        # 600s→900s, when pkg/task/pkg/plan/pkg/tools/pkg/providers joined
        # below — see that entry for why. The 900s figure in the invocation
        # further down covers the FIRST (parallel) `go test` call.
        #
        # CORRECTION (round-2 review, F7): this comment used to claim "there
        # is no 600s left anywhere in this step by design" — false on its own
        # terms, since the flake-filter's per-package isolated re-run further
        # down in this same step passed `-timeout 600s`. Beyond the false
        # claim, that asymmetry was backwards: the isolated `-p 1` re-run
        # forces serial execution of whatever it was given, which is SLOWER
        # per-package than the parallel run's shared CPU budget, yet it was
        # given LESS time. With pkg/tools/... now in the glob (see below), a
        # merely-slow package that trips the flake filter for an unrelated
        # reason (a transient parallel-run hiccup, not a real failure) could
        # time out again in isolation and get stamped "REAL FAILURE (failed
        # twice)" — a false RED read as a code defect, not an infra timing
        # issue. Fixed by raising the isolated re-run's timeout to 900s too,
        # matching the parallel run instead of undercutting it.)
        #
        # pkg/task, pkg/plan, pkg/tools and pkg/providers were added 2026-08-10,
        # and they earned it on the first run: `go test -race ./pkg/tools/...`
        # reported TWO data races on a commit where every existing gate was
        # green — one in production code (pkg/task's normalizeCriteria wrote
        # server-set IDs through the CALLER's slice, so two goroutines
        # normalising slices that share a backing array raced) and one in a
        # test. Neither was reachable by any gate that existed before: this
        # list is the only race surface in the project, and it omitted the
        # packages holding the tool registry, the delegation tool, the task
        # store and every LLM provider. Timeout raised 600s → 900s here to
        # accommodate the four added packages (pkg/tools in particular pulls
        # in pkg/tools/browser — see that entry below for the further cost
        # that package added on top).
        #
        # pkg/tools/browser joined the recursive glob on 2026-08-11 (#615).
        # It was originally left off `./pkg/tools/...` on the theory that the
        # package "launches real Chrome and hits missing dbus headlessly" —
        # that diagnosis was WRONG: the package already ran its real-Chrome
        # tests and PASSED in the plain (non-race) `go test ./...` gate above
        # on these same runners (e.g. run 31184160184: `ok
        # .../pkg/tools/browser 48.108s`), so dbus availability cannot explain
        # a race-only exclusion. The real cause was that its 15 real-Chrome
        # tests (plus two more found ungated entirely during the #615 fix —
        # see pkg/tools/browser/coordinator_test.go's
        # TestCoordinator_OwnershipMarker_RoundTrip and
        # coordinator_window_size_test.go's
        # TestCoordinator_Register_CreateTargetParams_PinsWindowSize) were
        # only gated by `testing.Short()` (or, for those two, not gated at
        # all) instead of the package's own `skipIfNoBrowser` convention, and
        # two tight wall-clock assertions in coldstart_bound_test.go were
        # exactly the shape pkg/task hit in the entry above (race
        # instrumentation blowing a <200ms bound). Both are fixed: every
        # real-Chrome test now uses skipIfNoBrowser, and the two wall-clock
        # assertions now use a //go:build race / !race split bound
        # (runFirstAttachPromptBound) exactly like pkg/task's livenessBound.
        # `go test -race ./pkg/tools/...` is verified race-clean before this
        # change lands.
        #
        # CORRECTION (found in the #615/#617/#618 hardening review, F1): the
        # line that used to sit here framed skipIfNoBrowser's CI check as
        # having "also removed an undeclared ~100MB Chrome-for-Testing
        # network download from every CI gate" — true, but stated as a pure
        # benefit. It was not: skipIfNoBrowser's own CI branch (`CI != "" &&
        # OMNIPUS_BROWSER_E2E == ""` → skip) fires unconditionally on every
        # GitHub-hosted runner (GitHub always sets `CI=true`), and
        # `OMNIPUS_BROWSER_E2E` was set NOWHERE in .github/, deploy/,
        # Makefile, or scripts/ — so this step's real-Chrome coverage for
        # pkg/tools/browser went from 16 tests actually running (verified:
        # `ok .../pkg/tools/browser 48.108s` above) to ZERO, silently, with
        # every gate still green. The "browser-e2e" job further down in this
        # workflow restores that coverage with Chrome as a declared
        # dependency (not the undeclared in-test download #615 removed) —
        # see that job's own comment for why it is a separate job rather
        # than just setting OMNIPUS_BROWSER_E2E=1 here.
        #
        # DATA RACE carve-out (never routed through the flake filter): a race
        # that manifests under the default parallel `-p` (NumCPU) run but
        # disappears when the same package is re-run isolated at -p 1 is the
        # textbook signature of a genuine concurrency bug — shared state
        # racing under real parallelism — not a timing flake. The flake filter
        # below exists only for ordinary (non-race) test failures that are
        # sensitive to GitHub-runner CPU oversubscription; it must never be
        # allowed to excuse an actual detected race. So: if "DATA RACE" shows
        # up anywhere in the first run's output, fail immediately and skip the
        # isolated re-run/flake-filter path entirely — a race is never given a
        # second chance to "pass isolated".
        env:
          CGO_ENABLED: "1"
        run: |
          set +e
          # race-packages.sh prints one package path per line. Read them into an
          # array instead of relying on unquoted command-substitution splitting.
          # The old form carried a suppression comment for SC2046 with an
          # explanation appended after the rule id on the same line. shellcheck
          # rejects that as malformed (SC1125) and ignores it, so the
          # suppression never actually applied — the same trap as a nosec
          # annotation with trailing prose. An array removes the need for one.
          mapfile -t race_pkgs < <(scripts/race-packages.sh)
          if [ ${#race_pkgs[@]} -eq 0 ]; then
            echo "ERROR: scripts/race-packages.sh produced no packages." >&2
            echo "Refusing to run: a bare 'go test -race' with no package list" >&2
            echo "would report a pass without testing the intended packages." >&2
            exit 1
          fi
          out=$(go test -race -tags goolm,stdjson -count=1 -timeout 900s "${race_pkgs[@]}" 2>&1)
          code=$?
          echo "$out"
          # DATA RACE is checked BEFORE the exit-code short-circuit on purpose: a
          # race can be reported without flipping the overall `go test` exit code
          # (e.g. a test that shells out with -race and only inspects the child's
          # stdout, or ignores cmd.Run()'s error). Checking after `[ $code -eq 0 ]`
          # would skip exactly the case this carve-out's own rationale describes.
          #
          # Native bash substring match — NOT `printf ... | grep -q`. Under
          # GitHub's `bash -eo pipefail`, `grep -q` exits on the FIRST match and
          # closes the pipe, `printf` then dies of SIGPIPE (141), and pipefail
          # makes the whole pipeline 141 — so the test evaluated FALSE and this
          # carve-out was silently skipped whenever the race report appeared more
          # than one pipe buffer (64 KB) from the end of $out. Real `go test`
          # output is megabytes, so that was the COMMON case; it only "worked"
          # against small synthetic fixtures. No pipe, no subprocess, no SIGPIPE.
          if [[ $out == *"DATA RACE"* ]]; then
            echo ""
            echo "=== DATA RACE detected in parallel run — skipping flake filter entirely ==="
            failed=$(printf '%s\n' "$out" | grep -aE '^FAIL[[:space:]]' | awk '{print $2}' | grep -a '/' | sort -u)
            if [ -n "$failed" ]; then
              for p in $failed; do
                echo "REAL FAILURE (data race detected — never excused): $p"
              done
            else
              echo "REAL FAILURE (data race detected — never excused): race detected but no package-level FAIL line matched; see full output above"
            fi
            exit 1
          fi
          # No race detected — now the ordinary short-circuit applies.
          [ $code -eq 0 ] && exit 0
          failed=$(printf '%s\n' "$out" | grep -aE '^FAIL[[:space:]]' | awk '{print $2}' | grep -a '/' | sort -u)
          [ -z "$failed" ] && exit $code
          echo ""
          echo "=== FLAKE FILTER (-race): re-running failed packages isolated (-p 1): $failed ==="
          rc=0
          for p in $failed; do
            if go test -race -tags goolm,stdjson -count=1 -timeout 900s -p 1 "$p" >/tmp/rr_race.log 2>&1; then
              echo "FLAKE (passed isolated): $p"
            else
              echo "REAL FAILURE (failed twice): $p"; grep -aE '^--- FAIL|DATA RACE' /tmp/rr_race.log | head; rc=1
            fi
          done
          exit $rc

  security:
    name: Security Tests
    # ADR-067 step 12: skips when no Go-relevant file changed (see the
    # `changes` job's `go` filter and its force-full list). `code` is still
    # checked too — `go` narrows on top of it, never replaces it. This is
    # redundant with `test`'s own go-gate (needs: test, whose default
    # cascade-skip would take this job down too) but stated explicitly here
    # for clarity rather than relying on that cascade alone.
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: success() && needs.changes.outputs.code == 'true' && needs.changes.outputs.go == 'true'
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Download node_modules artifact
        uses: actions/download-artifact@v7
        with:
          name: node-modules-${{ github.run_id }}
      - name: Extract node_modules
        run: tar -xf node_modules.tar
      - name: Build SPA
        run: |
          npm run build
          rm -rf pkg/gateway/spa
          cp -r dist/spa pkg/gateway/spa
      # NOTE: the security test suite runs BEFORE govulncheck/grype on purpose.
      # Previously a govulncheck failure failed this job at an earlier step and the
      # suite never executed — so a dependency CVE silently removed the security
      # test signal. Scanners still fail the job; they just no longer mask the tests.
      - name: Run security test suite
        run: CGO_ENABLED=0 go test -tags goolm,stdjson -v -count=1 -timeout 10m ./tests/security/...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        # govulncheck fails with non-zero on any vulnerability with a fixed version.
        # Use -mode=source for the full dependency analysis.
        run: govulncheck -tags goolm,stdjson ./...
      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
      - name: Run grype (dependency CVE scan — informational)
        # PR-time grype runs informational only (continue-on-error).
        # The weekly job (security-weekly.yml) is the blocking gate at
        # --fail-on high and uploads SARIF to GitHub code-scanning.
        # Rationale: pre-existing dep CVEs (tracked in #95) would block
        # every PR until a cross-cutting upgrade sweep lands. PR-time
        # annotations remain visible to reviewers.
        #
        # Excludes mirror the weekly job (see security-weekly.yml for the
        # per-path rationale) — keep both lists in sync with .grype.yaml.
        continue-on-error: true
        run: |
          "$(go env GOPATH)/bin/grype" dir:. --fail-on high --only-fixed --add-cpes-if-none \
            --exclude './node_modules/**' \
            --exclude './dist/**' \
            --exclude './pkg/gateway/spa/**' \
            --exclude './test-results/**' \
            --exclude './tests/perf/results/**' \
            --exclude './pkg/api/generated/**' \
            --exclude './src/lib/api/generated/**' \
            --exclude './src/routeTree.gen.ts'
  perf-smoke:
    name: Perf Smoke
    # ADR-067 step 12: skips when no Go-relevant file changed (see the
    # `changes` job's `go` filter and its force-full list). `code` is still
    # checked too — `go` narrows on top of it, never replaces it. Redundant
    # with `test`'s own go-gate (needs: test) but stated explicitly here for
    # clarity rather than relying on that cascade alone.
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: success() && needs.changes.outputs.code == 'true' && needs.changes.outputs.go == 'true'
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download node_modules artifact
        uses: actions/download-artifact@v7
        with:
          name: node-modules-${{ github.run_id }}

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Build SPA
        run: |
          set -euo pipefail
          npm run build
          rm -rf pkg/gateway/spa
          cp -r dist/spa pkg/gateway/spa

      - name: Run SLO gates (no 2000-session load)
        # Runs only the *SLO* tests C1 wrote — boot, per-turn, transcript,
        # media resolve, compaction bounds. Skips the 2000-session load test
        # (guarded by OMNIPUS_RUN_LOAD_TEST env — not set here).
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -tags goolm,stdjson \
            -run '^(TestBootUnder1Second|TestPerTurnSLO|TestNoTranscriptDataLoss|TestMediaResolveSLO|TestCompactionBoundsMemory)$' \
            -timeout 5m -v ./tests/perf/...

  # Emits the E2E shard matrix from tests/e2e/shards.json (the single source of truth,
  # also consumed by deploy/ci-worker/runci.sh). `check` FAILS the workflow if any spec on
  # disk is unassigned (it would silently never run) or the plan references a deleted spec,
  # so the matrix and the runci.sh fan-out can never drift from the specs on disk.
  e2e-plan:
    name: E2E shard plan
    runs-on: ubuntu-latest
    # Not listed in either named tier — it's a cheap script eval, not part of
    # the expensive tier fast-tier exists to protect. Its needs on `test`
    # (unchanged from before this change) already short-circuits it whenever
    # fast-tier fails, since `test` itself needs fast-tier below.
    #
    # ADR-067 step 12: `test` is now go-gated (skips when go==false), but
    # `playwright` — which needs THIS job's matrix output — is deliberately
    # NOT go/spa-restricted: it exercises the full stack end-to-end and must
    # still run on an spa-only PR even though `test` legitimately skipped in
    # that case. A bare success() on `needs: test` would treat that
    # legitimate skip as a failure and cascade-skip this job (and therefore
    # playwright) too, so `test` is explicitly allowed to be 'skipped' here.
    # A genuine test FAILURE (result == 'failure'/'cancelled') still blocks,
    # exactly as before.
    #
    # `!cancelled()` leads the expression for the same reason as `fast-tier`
    # above: without a status-check function, GitHub implicitly ANDs its own
    # `success()` onto this `if:`, which would silently defeat the
    # `(... == 'skipped')` tolerance below. `!cancelled()` is GitHub's
    # documented alternative to `always()` for this — it removes the
    # implicit gate without making the job eligible to start mid-cancellation.
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.code == 'true' &&
      needs.changes.result == 'success'
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compute shard matrix from tests/e2e/shards.json
        id: plan
        run: |
          set -euo pipefail
          scripts/e2e-shards.sh check
          echo "matrix=$(scripts/e2e-shards.sh matrix)" >> "$GITHUB_OUTPUT"

  playwright:
    name: E2E — ${{ matrix.group }}
    # Deliberately NOT go/spa-restricted (unlike vuln_check/cgo-gate/test/
    # security/perf-smoke/lint above, or typecheck/lint-spa/vitest below):
    # this exercises the full stack through a real browser and must still
    # run on an spa-only PR, so it stays gated on `code` alone. Its `test`
    # need is therefore explicitly allowed to be 'skipped' (go==false) as
    # well as 'success' — see the comment on `e2e-plan` above for why a bare
    # success() here would be wrong. A genuine failure/cancellation of any
    # need still blocks, exactly as before.
    #
    # `!cancelled()` leads the expression for the same reason as `fast-tier`
    # and `e2e-plan` above: without a status-check function, GitHub
    # implicitly ANDs its own `success()` onto this `if:`, which would
    # silently defeat the `(... == 'skipped')` tolerance below.
    runs-on: ubuntu-latest
    needs: [changes, e2e-plan, setup]
    if: >-
      !cancelled() &&
      needs.changes.outputs.code == 'true' &&
      needs.changes.result == 'success' &&
      needs.e2e-plan.result == 'success' &&
      needs.setup.result == 'success'
    strategy:
      fail-fast: false
      # Groups, key slots, and spec lists come from tests/e2e/shards.json via the e2e-plan
      # job — NOT hardcoded here — so pr.yml and deploy/ci-worker/runci.sh cannot drift.
      matrix: ${{ fromJSON(needs.e2e-plan.outputs.matrix) }}
    env:
      OMNIPUS_HOME: /tmp/omnipus-e2e
      # Per-shard LLM keys — runner-agnostic (secrets inject identically on a GitHub-hosted
      # or an external/self-hosted runner). _B/_C are OPTIONAL: unset ⇒ the "Resolve shard
      # LLM key" step falls back to key A, so a repo with only OPENROUTER_API_KEY_CI still
      # runs (every shard uses key A, i.e. today's single-key behavior). Pinning each
      # concurrent LLM shard to its own key keeps them off one shared rate-limit window.
      OPENROUTER_KEY_A: ${{ secrets.OPENROUTER_API_KEY_CI }}
      OPENROUTER_KEY_B: ${{ secrets.OPENROUTER_API_KEY_CI_B }}
      OPENROUTER_KEY_C: ${{ secrets.OPENROUTER_API_KEY_CI_C }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download node_modules artifact
        uses: actions/download-artifact@v7
        with:
          name: node-modules-${{ github.run_id }}

      - name: Extract node_modules
        run: tar -xf node_modules.tar

      - name: Build SPA
        # Vite outputs to dist/spa/. Must be synced into pkg/gateway/spa/ before
        # go build so the //go:embed directive in pkg/gateway/embed.go resolves.
        # The assets/ subdir contains hashed bundles that change every build;
        # remove it first to avoid stale hashed chunks being embedded alongside
        # the new ones. See CLAUDE.md "Build & E2E Testing" for full rationale.
        run: npm run build

      - name: Sync SPA into embed target
        run: |
          set -euo pipefail
          rm -rf pkg/gateway/spa
          cp -r dist/spa pkg/gateway/spa

      - name: Verify SPA sync
        # Fail fast if the sync produced an empty embed target. An empty assets/
        # directory means go build would embed a broken SPA and Playwright tests
        # would load a blank page — better to catch this here than in test output.
        run: |
          set -euo pipefail
          if [ -z "$(ls -A pkg/gateway/spa/assets 2>/dev/null)" ]; then
            echo "SPA sync failed: pkg/gateway/spa/assets is empty or missing" >&2
            exit 1
          fi

      - name: Build gateway binary
        # Build to /tmp/omnipus-ci so self-managed-gateway specs (hot-reload,
        # user-crud) that use setup.ts DEFAULT_OMNIPUS_BINARY find it. Also
        # keep a copy as ./omnipus for the global-setup gateway.
        run: |
          # -tags goolm,stdjson is required: cmd/omnipus/main.go is gated
          # //go:build stdjson as a deliberate fail-fast against tag-less builds
          # ("function main is undeclared" otherwise). Matches the canonical
          # build tags (cross-platform.yml, Makefile).
          CGO_ENABLED=0 go build -tags goolm,stdjson -o /tmp/omnipus-ci ./cmd/omnipus/
          cp /tmp/omnipus-ci ./omnipus

      - name: Prepare gateway home directory
        # Fresh directory every run — never reuse state between jobs.
        run: |
          set -euo pipefail
          rm -rf /tmp/omnipus-e2e
          mkdir -p /tmp/omnipus-e2e

      - name: Resolve shard LLM key
        # Map this shard's key_slot (from shards.json) to an OpenRouter key and expose it to
        # every later step as OPENROUTER_API_KEY_CI via $GITHUB_ENV — so the seed/onboard/
        # verify/test steps below need no per-step secret wiring. Slots b/c fall back to key A
        # when their secret is unset, so the workflow still runs with only the primary key
        # configured (every shard on key A = today's single-key behavior). add-mask keeps the
        # resolved value out of logs (a/b/c are registered secrets and thus already masked).
        run: |
          set -euo pipefail
          case "${{ matrix.key_slot }}" in
            b) KEY="${OPENROUTER_KEY_B:-$OPENROUTER_KEY_A}" ;;
            c) KEY="${OPENROUTER_KEY_C:-$OPENROUTER_KEY_A}" ;;
            *) KEY="${OPENROUTER_KEY_A}" ;;
          esac
          if [ -z "$KEY" ]; then
            echo "::error::No OpenRouter key resolved for slot '${{ matrix.key_slot }}'. Set the OPENROUTER_API_KEY_CI secret (and optionally _B / _C)." >&2
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "OPENROUTER_API_KEY_CI=$KEY" >> "$GITHUB_ENV"

      - name: Seed gateway config
        # providers is a flat array of ModelConfig entries (see pkg/config/config.go).
        # Each row's `provider` (catalog id) is EXPLICIT and REQUIRED — the old
        # "<protocol>/<model>" prefix-splitting migration was deleted (ADR-067
        # FR-034, C1 fix): a row with no `provider` fails config load with
        # "provider is required" instead of being guessed. `model` is the bare
        # catalog model id. agents.defaults.default_model must match one provider
        # entry's (provider, model) pair exactly.
        # dev_mode_bypass unblocks onboarding endpoints that require bearer auth
        # before an admin account exists (CLAUDE.md "Build & E2E Testing").
        #
        # IMPORTANT — do NOT add any "tools": {"delegate": {"enabled": false}} or any
        # other tools.<name>.enabled=false entry here. migrateDeprecatedToolEnableFlags
        # (pkg/config/migration.go) converts those into sandbox.tool_policies deny
        # entries at config-load time, which would deny delegate for ALL agents and break
        # T24 (cancel cascade) and the handoff/subagent E2E tests.
        # Instead, tool policies are set explicitly under sandbox.tool_policies below.
        #
        # sandbox.audit_log must be true at BOOT (it is restart-gated) for T26.
        # sandbox.tool_policies.delegate = "allow" is explicit so no migration run can
        # override it (an existing "allow" policy is never downgraded by the migrator).
        run: |
          set -euo pipefail
          cat > /tmp/omnipus-e2e/config.json <<'EOF'
          {
            "version": 1,
            "gateway": {
              "port": 6060,
              "dev_mode_bypass": true
            },
            "sandbox": {
              "audit_log": true,
              "tool_policies": {
                "delegate": "allow"
              }
            },
            "agents": {
              "defaults": {
                "default_model": {
                  "provider": "openrouter",
                  "model": "z-ai/glm-5.2"
                },
                "auto_recap_enabled": true
              }
            },
            "providers": [
              {
                "provider": "openrouter",
                "model": "z-ai/glm-5.2",
                "api_base": "https://openrouter.ai/api/v1",
                "api_key_ref": "OPENROUTER_API_KEY"
              }
            ]
          }
          EOF

      - name: Seed OpenRouter credential
        # omnipus credentials set writes the key into credentials.json (AES-256-GCM).
        # The credential name MUST match the provider's api_key_ref in config.json
        # (OPENROUTER_API_KEY, uppercase — matches the env-var convention documented
        # in pkg/config/config.go:924-927).
        run: |
          set -euo pipefail
          ./omnipus credentials set OPENROUTER_API_KEY "${OPENROUTER_API_KEY_CI}"
        env:
          # OPENROUTER_API_KEY_CI is set per-shard in "Resolve shard LLM key" via $GITHUB_ENV.
          OMNIPUS_MASTER_KEY: ${{ secrets.OMNIPUS_MASTER_KEY_CI }}

      - name: Start gateway
        # Redirect all output to a log file so the step does not block.
        # The PID is captured so the teardown step can kill it cleanly.
        # --allow-empty permits gateway boot without a fully configured provider,
        # which is needed in case the credential seed step is extended in future.
        #
        # OMNIPUS_GATEWAY_ORPHANED_TURN_GRACE_SECONDS=20 (ADR-045): the orphan-
        # foreground-turn watchdog only arms when the LAST WebSocket watcher on
        # a session disconnects, so a short 20s grace here reaps a genuinely
        # leaked (finished-tab) live turn quickly without ever touching an
        # open-tab turn or a transcript-seeded replay test (those have no live
        # turn to begin with). This is the fix for the "Group-A variance"
        # family of load-dependent failures: a Playwright test that navigates
        # away mid-turn without clicking Stop used to leave a real agent loop
        # running indefinitely, queuing against the shared OpenRouter
        # rate-limit window and starving later tests' tool calls. Production
        # default (300s) is untouched — this override applies only to the e2e
        # gateway process.
        run: |
          OMNIPUS_MASTER_KEY=${{ secrets.OMNIPUS_MASTER_KEY_CI }} \
            OMNIPUS_GATEWAY_ORPHANED_TURN_GRACE_SECONDS=20 \
            ./omnipus start --allow-empty > /tmp/omnipus.log 2>&1 &
          GATEWAY_PID=$!
          echo "${GATEWAY_PID}" > /tmp/omnipus.pid

          sleep 0.5
          if ! kill -0 "${GATEWAY_PID}" 2>/dev/null; then
            echo "Gateway process died immediately. Panic log:" >&2
            cat /tmp/omnipus-e2e/logs/gateway_panic.log 2>/dev/null || echo "(no panic log)" >&2
            cat /tmp/omnipus.log >&2
            exit 1
          fi

      - name: Wait for gateway to be ready
        # Poll /health every second for up to 60 s. The 60 s ceiling is a
        # generous safety net for CI runner cold-start latency, not an accepted
        # budget. If the gateway does not respond, the gateway-log artifact
        # (uploaded below) contains the full output.
        run: |
          set -euo pipefail
          timeout 60 bash -c 'until curl -sf http://localhost:6060/health; do sleep 1; done' \
            || (echo "Gateway did not become ready within 60 s — check gateway-log artifact" >&2 && exit 1)

      - name: Complete onboarding via API
        # Drive onboarding programmatically to skip the UI wizard. Must pass
        # the REAL OpenRouter key: the onboarding handler appends a second
        # provider entry (with api_key_ref="openrouter_API_KEY" — mixed case)
        # and the agent's model lookup picks this newer entry. If a placeholder
        # key goes in here, every LLM call 401s even though the seed provider
        # has a valid key.
        # Model must match the seeded provider's (provider, model) pair — the
        # exact key ADR-067's GetModelConfig matches on — so the onboarding
        # handler updates the existing entry instead of writing a second,
        # divergent one.
        run: |
          set -euo pipefail
          # -sf DISCARDS the server's answer: on any non-2xx, curl exits 22
          # having printed nothing, so the step fails with no reason anywhere in
          # the log. Every E2E shard has been failing here on this branch and on
          # release/v0.1.1 alike, and the log says only that a step failed.
          # A silent failure in the diagnostic path is the worst kind.
          #
          # Capture status and body instead, and print the body on failure. The
          # key is registered with add-mask, so it stays masked in whatever the
          # server echoes back.
          body=$(jq -n --arg key "${OPENROUTER_API_KEY_CI}" \
            '{provider:{id:"openrouter",auth_method:"api_key",api_key:$key,model:"z-ai/glm-5.2"},admin:{username:"admin",password:"admin123"}}' \
            | curl -s -o /tmp/onboard-body.txt -w '%{http_code}' \
                -X POST http://localhost:6060/api/v1/onboarding/complete \
                -H 'Content-Type: application/json' \
                -d @-)
          if [ "$body" != "200" ] && [ "$body" != "204" ]; then
            echo "::error::onboarding/complete returned HTTP $body" >&2
            echo "--- response body ---" >&2
            head -c 2000 /tmp/onboard-body.txt >&2 || true
            echo >&2
            echo "--- gateway log tail ---" >&2
            tail -40 "${OMNIPUS_HOME:-/tmp/omnipus-e2e}/logs/gateway.log" 2>/dev/null >&2 || echo "(no gateway log at ${OMNIPUS_HOME:-/tmp/omnipus-e2e}/logs/gateway.log)" >&2
            exit 1
          fi
        # OPENROUTER_API_KEY_CI comes from "Resolve shard LLM key" (per-shard, via $GITHUB_ENV).

      # T0.4: Preflight — fail fast if OPENROUTER_API_KEY_CI is unset.
      # This catches mis-configured CI runs before any Playwright step executes,
      # giving a clear error message instead of per-test LLM timeout failures.
      - name: Verify OPENROUTER_API_KEY_CI is set
        # Resolved per-shard in "Resolve shard LLM key" and inherited via $GITHUB_ENV.
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY_CI:-}" ]; then
            echo "ERROR: OPENROUTER_API_KEY_CI secret is not set in this repository." >&2
            echo "This secret is required for the Playwright E2E suite." >&2
            echo "Add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          echo "OPENROUTER_API_KEY_CI is set (${#OPENROUTER_API_KEY_CI} chars)."

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # OPENROUTER_API_KEY_CI is inherited per-shard from $GITHUB_ENV (Resolve shard LLM key).
        # Mirror it onto OPENROUTER_API_KEY so self-managed gateways
        # (tests/e2e/setup.ts startGateway → onboardAdmin) send the same live
        # key instead of sk-test-placeholder, which OpenRouter 400s.
        #
        # --reporter=html,list,json ADDS the json reporter on top of
        # playwright.config.ts's own `reporter: [['html'], ['list']]` — the
        # CLI --reporter flag fully REPLACES the config's reporter list rather
        # than appending to it, so html and list are re-listed here with their
        # defaults (matching the config's own un-configured entries) purely so
        # the existing playwright-report/ artifact upload below keeps working;
        # json is the new addition the next step reads. PLAYWRIGHT_JSON_OUTPUT_NAME
        # routes the json reporter's output to a file instead of stdout.
        #
        # Do not treat a green exit code here as the full verdict: Playwright's
        # own exit status reflects only `unexpected` (failed-after-all-retries)
        # results. A skipped test and a test that failed once and then passed
        # under playwright.config.ts's retries: 3 both exit 0 — see the next
        # step, which reads the json reporter's stats block to catch both.
        env:
          OMNIPUS_URL: http://localhost:6060
          OPENROUTER_API_KEY: ${{ env.OPENROUTER_API_KEY_CI }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: /tmp/pw-results.json
        run: npx playwright test ${{ matrix.specs }} --reporter=html,list,json

      - name: Fail on skipped or flaky Playwright tests
        # Two ways this suite went green without being green:
        #  * skipped>0 — two tests were silently skipped in the last green
        #    run. `npx playwright test` does not fail on a skip; it's not a
        #    Playwright "failure" by definition.
        #  * flaky>0 — retries: 3 (playwright.config.ts) turned a real
        #    failure green last Saturday: a test that fails once and then
        #    passes on retry is reported as "flaky", not "unexpected", and
        #    does not fail the run either.
        # The json reporter's own stats block is the one place both counts
        # are unambiguous — read that instead of re-deriving them from
        # console text. Runs unconditionally (always()) so it still reports
        # accurately even when the run step above already failed outright.
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f /tmp/pw-results.json ]; then
            echo "::error::Playwright JSON report not found at /tmp/pw-results.json — cannot verify skipped/flaky counts" >&2
            exit 1
          fi
          # jq exits 0 and prints "null" (or nothing, on an empty file) for a
          # missing/malformed key -- set -e does NOT catch that, and the old
          # `[ "$skipped" -gt 0 ]` check silently evaluated false on a
          # non-numeric value (stderr: "integer expected"), letting a killed
          # Playwright run that left an empty or truncated report file pass
          # this gate. `jq -e` exits 1 on null/absent; the numeric guard below
          # closes the empty-file case even -e alone doesn't catch. Verified
          # in isolation (empty file, and valid JSON missing .stats) before
          # this landed -- both previously passed silently, both now fail.
          skipped=$(jq -e '.stats.skipped' /tmp/pw-results.json) || { echo "::error::Playwright JSON report has no readable .stats.skipped -- cannot verify coverage" >&2; exit 1; }
          flaky=$(jq -e '.stats.flaky' /tmp/pw-results.json) || { echo "::error::Playwright JSON report has no readable .stats.flaky -- cannot verify coverage" >&2; exit 1; }
          expected=$(jq -e '.stats.expected' /tmp/pw-results.json) || { echo "::error::Playwright JSON report has no readable .stats.expected -- cannot verify coverage" >&2; exit 1; }
          unexpected=$(jq -e '.stats.unexpected' /tmp/pw-results.json) || { echo "::error::Playwright JSON report has no readable .stats.unexpected -- cannot verify coverage" >&2; exit 1; }
          for statname in skipped flaky expected unexpected; do
            val="${!statname}"
            case "$val" in
              ''|*[!0-9]*)
                echo "::error::Playwright stats.$statname is not a plain non-negative integer (got: '$val') -- treating report as unverifiable" >&2
                exit 1
                ;;
            esac
          done
          echo "Playwright stats: expected=$expected skipped=$skipped flaky=$flaky unexpected=$unexpected"
          rc=0
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped Playwright test(s) were skipped — coverage silently shrank. See docs/internal/false-green-patterns.md." >&2
            rc=1
          fi
          if [ "$flaky" -gt 0 ]; then
            echo "::error::$flaky Playwright test(s) only passed after a retry (flaky) — retries: 3 masked a real failure. See docs/internal/false-green-patterns.md." >&2
            rc=1
          fi
          exit $rc

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-${{ matrix.group }}
          # Re-running all jobs reuses this run_id, so the same artifact name is
          # uploaded twice and upload-artifact 409s — failing an always()/failure()
          # step and the job, for a reason unrelated to the code under test.
          overwrite: true
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload gateway logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-logs-${{ matrix.group }}
          # Re-running all jobs reuses this run_id, so the same artifact name is
          # uploaded twice and upload-artifact 409s — failing an always()/failure()
          # step and the job, for a reason unrelated to the code under test.
          overwrite: true
          path: |
            /tmp/omnipus.log
            /tmp/omnipus-e2e/logs/
          retention-days: 7

      - name: Stop gateway
        if: always()
        run: |
          if [ -f /tmp/omnipus.pid ]; then
            kill "$(cat /tmp/omnipus.pid)" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # The single required check.
  #
  # Branch protection currently names JOB IDS (typecheck, lint, test, security,
  # perf-smoke, playwright, wire-types-lint, verify-contracts). GitHub reports
  # check runs under a job's DISPLAY NAME, and every one of those jobs sets
  # `name:` — so the required contexts match nothing that is ever emitted, and
  # `playwright` is a matrix job that can only ever emit "E2E — <group>". The
  # practical effect is that no result from this workflow gates any merge.
  #
  # Requiring eight name strings that must each stay in sync with a `name:`
  # field is the kind of duplicated definition that drifts silently. This job
  # exists so protection can require exactly ONE context that cannot drift:
  # it depends on every gate and re-derives the verdict from their results.
  #
  # Semantics, deliberately:
  #   failure/cancelled in ANY dependency -> fail. No exceptions, no allowlist.
  #   skipped                             -> pass. Language scoping means a
  #                                          Go-only PR legitimately skips the
  #                                          SPA jobs and vice versa.
  #   changes must have SUCCEEDED         -> otherwise "everything skipped"
  #                                          reads as success while nothing ran.
  ci-required:
    name: CI
    if: always()
    needs:
      - changes
      - setup
      - typecheck
      - lint-spa
      - vitest
      - wire-types-lint
      - tool-error-status-lint
      - verify-contracts
      - cli-verb-guard
      - e2e-shard-check
      - lint
      - fast-tier
      - vuln_check
      - cgo-gate
      - test
      - test-race
      - security
      - perf-smoke
      - e2e-plan
      - playwright
      - browser-tests-gated
      - browser-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to have passed or legitimately skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"

          # `changes` decides what runs. If it did not succeed, every downstream
          # skip is meaningless and "all skipped" must not read as a pass.
          changes_result=$(echo "$RESULTS" | python3 -c \
            'import json,sys; print(json.load(sys.stdin)["changes"]["result"])')
          if [ "$changes_result" != "success" ]; then
            echo "FAIL: the 'changes' job did not succeed (result: $changes_result)." >&2
            echo "Every other job's skip is therefore uninterpretable — refusing to pass." >&2
            exit 1
          fi

          bad=$(echo "$RESULTS" | python3 -c \
            'import json,sys; d=json.load(sys.stdin); print(" ".join(sorted(k for k,v in d.items() if v["result"] not in ("success","skipped"))))')
          if [ -n "$bad" ]; then
            echo "FAIL: these jobs did not pass:" >&2
            for j in $bad; do echo "  - $j" >&2; done
            exit 1
          fi
          echo "OK: every gate passed or was legitimately skipped."
