name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan on Sunday 02:17 UTC — odd minute to avoid the top-of-hour scheduler rush
    - cron: '17 2 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Pull in security-extended + security-and-quality queries so we catch
          # both vulnerability classes and high-confidence code-quality bugs.
          queries: security-extended,security-and-quality

      # Use Go autobuild — works for the simple `go build` path that the
      # repo uses today. If we ever need build tags (`goolm,stdjson`) for
      # CodeQL, switch to a manual build step.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
