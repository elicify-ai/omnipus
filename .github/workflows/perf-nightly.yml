name: Nightly Perf

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

jobs:
  perf:
    name: Perf (benchmarks + SLOs + 2000-session load)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # commits perf-nightly results + report
    env:
      CGO_ENABLED: "0"
      OMNIPUS_RUN_LOAD_TEST: "1"
      # Perf benchmarks (BenchmarkBootHealth, BenchmarkCompactionMemory) hit
      # real OpenRouter — startPerfGateway seeds a stub key if this env var
      # is unset, which then 401s in-bench. Wire the repo secret so benches
      # actually run end-to-end in CI.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_CI }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build SPA
        run: |
          set -euo pipefail
          npm ci
          npm run build
          rm -rf pkg/gateway/spa
          cp -r dist/spa pkg/gateway/spa

      - name: Run benchmarks + SLOs + 2000-session load
        # ulimit MUST be raised in the same shell step that runs go test —
        # a separate `run:` step gets its own shell and the limit doesn't
        # propagate. Previous configuration ran `ulimit -n 4096 || true` as
        # its own step, which was a no-op for the actual test execution:
        # all 2000 WebSocket sessions dropped frames because the runner's
        # default 1024-fd cap was hit during the connection ramp.
        #
        # 8192 gives 2× headroom over the 4096 originally targeted (2000
        # sessions × ~2 fds each = ~4000 used at peak, plus listener +
        # logging + Go runtime overhead).
        run: |
          set -euo pipefail
          ulimit -n 8192
          echo "fd limit: $(ulimit -n)"
          mkdir -p tests/perf/results
          CGO_ENABLED=0 go test -tags goolm,stdjson \
            -run '^(TestBootUnder1Second|TestPerTurnSLO|TestNoTranscriptDataLoss|TestMediaResolveSLO|TestCompactionBoundsMemory|TestLoad2000Sessions)$' \
            -timeout 15m -v ./tests/perf/...
          # -benchtime=1x: exactly one iteration per benchmark. The CI
          # workflow's job is to verify benchmarks compile and run cleanly
          # (smoke test), not to produce statistically meaningful timing —
          # the per-op numbers from one iteration on a noisy shared runner
          # are not actionable. Real timing data comes from
          # BenchmarkPerTurnScripted's percentile metrics (still produced
          # at 1x because each iteration internally samples N latencies),
          # and from the dedicated perf-nightly box (gate by
          # OMNIPUS_PERF_NIGHTLY=1) when we have one.
          #
          # -benchtime=3s previously caused BenchmarkCompactionMemory to
          # exceed the 10-minute step timeout on shared runners — each
          # iteration is ~11s wall-time (gateway boot + 100 turns + close),
          # and Go's adaptive scaler overshoots the target.
          CGO_ENABLED=0 go test -tags goolm,stdjson \
            -bench=. -benchtime=1x -benchmem -run='^$' \
            -timeout 8m ./tests/perf/... | tee tests/perf/results/bench-$(date -u +%Y-%m-%d).txt

      - name: Commit perf results
        run: |
          set -euo pipefail
          git config user.name "omnipus-perf-bot"
          git config user.email "perf@noreply.local"
          git add tests/perf/results/
          git diff --cached --quiet || git commit -m "perf: nightly run $(date -u +%Y-%m-%d)"
          git push || echo "no changes to push"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: tests/perf/results/
          retention-days: 30
