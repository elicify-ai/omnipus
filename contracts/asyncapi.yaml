asyncapi: 3.0.0
info:
  title: Omnipus WebSocket API
  version: 0.1.0
  description: "Bidirectional WebSocket protocol for the Omnipus gateway.\nThe SPA (browser client) connects to /api/v1/chat/ws,\
    \ authenticates with an auth frame, then exchanges structured JSON frames for chat streaming, tool call tracking, session\
    \ replay, tool approvals, rate limiting, and cancel progress.\nAll frames are JSON objects with a \"type\" discriminator\
    \ field.\nFrame naming convention:\n  Client → server (\"send\" from SPA perspective)\n  Server → client (\"receive\"\
    \ from SPA perspective)\n\nNil-safety contract (Ava-chat bug lesson):\n  Fields that the SPA reads via Object.keys(),\
    \ .map(), .length, or spread\n  MUST be required and typed as object/array in this spec so the contract\n  test (Phase\
    \ 4) catches any backend regression where Go emits null.\n  Specifically: args in ToolApprovalRequiredFrame, pending_approvals\
    \ in\n  SessionStateFrame, parts in MediaFrame, params in ToolCallStartFrame.\n"
  contact:
    name: Omnipus contributors
    url: https://omnipus.ai
  license:
    name: MIT
servers:
  gateway:
    host: localhost:6060
    pathname: /api/v1/chat/ws
    protocol: ws
    description: 'Main WebSocket endpoint. Serves the SPA chat stream. The host and port are governed by gateway.port in config.json
      (default 6060). For TLS deployments behind a reverse proxy, this becomes wss:// at the public hostname.

      '
defaultContentType: application/json
channels:
  chat:
    address: /api/v1/chat/ws
    description: 'Primary bidirectional chat channel. Carries all client→server send frames and all server→client receive
      frames. Upgraded from HTTP by the gateway on GET /api/v1/chat/ws with Upgrade: websocket.

      '
    servers:
    - $ref: '#/servers/gateway'
    messages:
      AuthFrame:
        $ref: '#/components/messages/AuthFrame'
      MessageFrame:
        $ref: '#/components/messages/MessageFrame'
      CancelFrame:
        $ref: '#/components/messages/CancelFrame'
      PingFrame:
        $ref: '#/components/messages/PingFrame'
      AttachSessionFrame:
        $ref: '#/components/messages/AttachSessionFrame'
      DevicePairingResponseFrame:
        $ref: '#/components/messages/DevicePairingResponseFrame'
      SessionCloseFrame:
        $ref: '#/components/messages/SessionCloseFrame'
      WhatsAppPairingSubscribeFrame:
        $ref: '#/components/messages/WhatsAppPairingSubscribeFrame'
      SessionStartedFrame:
        $ref: '#/components/messages/SessionStartedFrame'
      TokenFrame:
        $ref: '#/components/messages/TokenFrame'
      DoneFrame:
        $ref: '#/components/messages/DoneFrame'
      ErrorFrame:
        $ref: '#/components/messages/ErrorFrame'
      ToolCallStartFrame:
        $ref: '#/components/messages/ToolCallStartFrame'
      ToolCallResultFrame:
        $ref: '#/components/messages/ToolCallResultFrame'
      ToolResultProjectionFrame:
        $ref: '#/components/messages/ToolResultProjectionFrame'
      SubagentStartFrame:
        $ref: '#/components/messages/SubagentStartFrame'
      SubagentMessageFrame:
        $ref: '#/components/messages/SubagentMessageFrame'
      SubagentStateFrame:
        $ref: '#/components/messages/SubagentStateFrame'
      SubagentEndFrame:
        $ref: '#/components/messages/SubagentEndFrame'
      TaskStatusChangedFrame:
        $ref: '#/components/messages/TaskStatusChangedFrame'
      TaskRunStatusFrame:
        $ref: '#/components/messages/TaskRunStatusFrame'
      ReplayMessageFrame:
        $ref: '#/components/messages/ReplayMessageFrame'
      ReplayErrorFrame:
        $ref: '#/components/messages/ReplayErrorFrame'
      RateLimitFrame:
        $ref: '#/components/messages/RateLimitFrame'
      MediaFrame:
        $ref: '#/components/messages/MediaFrame'
      AgentSwitchedFrame:
        $ref: '#/components/messages/AgentSwitchedFrame'
      ToolApprovalRequiredFrame:
        $ref: '#/components/messages/ToolApprovalRequiredFrame'
      SessionStateFrame:
        $ref: '#/components/messages/SessionStateFrame'
      SystemOverloadFrame:
        $ref: '#/components/messages/SystemOverloadFrame'
      ReplayWarningFrame:
        $ref: '#/components/messages/ReplayWarningFrame'
      CancelStageFrame:
        $ref: '#/components/messages/CancelStageFrame'
      PongFrame:
        $ref: '#/components/messages/PongFrame'
      SessionCloseAckFrame:
        $ref: '#/components/messages/SessionCloseAckFrame'
      DevicePairingRequestFrame:
        $ref: '#/components/messages/DevicePairingRequestFrame'
      WhatsAppPairingFrame:
        $ref: '#/components/messages/WhatsAppPairingFrame'
      NotificationFrame:
        $ref: '#/components/messages/NotificationFrame'
      GoalStatusFrame:
        $ref: '#/components/messages/GoalStatusFrame'
      LoopStatusFrame:
        $ref: '#/components/messages/LoopStatusFrame'
      PlanStatusFrame:
        $ref: '#/components/messages/PlanStatusFrame'
      JudgeVerdictFrame:
        $ref: '#/components/messages/JudgeVerdictFrame'
      ReplayErrorTypedFrame:
        $ref: '#/components/messages/ReplayErrorTypedFrame'
  browser:
    address: /api/v1/browser/ws
    description: 'Live interactive browser channel (ADR-038). A dedicated WebSocket, separate from the chat channel, carrying
      session/control/tab-strip lifecycle frames (server → client), viewer input / control frames (client → server), and
      WebRTC signaling (ADR-047/ADR-061) for the live browser panel. Video is carried exclusively by WebRTC — there is no
      screencast frame stream on this channel. Authenticated with the same first-message auth frame as the chat channel.

      '
    servers:
    - $ref: '#/servers/gateway'
    messages:
      AuthFrame:
        $ref: '#/components/messages/AuthFrame'
      BrowserAttachFrame:
        $ref: '#/components/messages/BrowserAttachFrame'
      BrowserInputFrame:
        $ref: '#/components/messages/BrowserInputFrame'
      BrowserControlFrame:
        $ref: '#/components/messages/BrowserControlFrame'
      BrowserDetachFrame:
        $ref: '#/components/messages/BrowserDetachFrame'
      BrowserTabActionFrame:
        $ref: '#/components/messages/BrowserTabActionFrame'
      BrowserViewportFrame:
        $ref: '#/components/messages/BrowserViewportFrame'
      BrowserWebRTCOfferFrame:
        $ref: '#/components/messages/BrowserWebRTCOfferFrame'
      ErrorFrame:
        $ref: '#/components/messages/ErrorFrame'
      BrowserStatusFrame:
        $ref: '#/components/messages/BrowserStatusFrame'
      BrowserTabsFrame:
        $ref: '#/components/messages/BrowserTabsFrame'
      BrowserWebRTCAnswerFrame:
        $ref: '#/components/messages/BrowserWebRTCAnswerFrame'
      BrowserWebRTCStateFrame:
        $ref: '#/components/messages/BrowserWebRTCStateFrame'
  browserCaptureIngest:
    address: /api/v1/browser/capture-ingest
    description: 'Capture-ingest channel (ADR-047 D2/D6). A loopback-only WebSocket between the gateway and the gateway-owned
      tabCapture MV3 extension''s encoder page (chrome-extension://<id>/encoder.html) running inside the managed headless
      Chrome — never exposed to agents or reachable from outside the host. Not a trust boundary by network position alone:
      every connection authenticates with a per-stream capability token (browser_capture_hello) minted by the gateway and
      injected via CDP Page.addScriptToEvaluateOnNewDocument. Carries the ingest leg''s non-trickle SDP offer/answer and lifecycle
      control (recapture on active-tab switch, shutdown, health-check ping).

      '
    servers:
    - $ref: '#/servers/gateway'
    messages:
      BrowserCaptureHelloFrame:
        $ref: '#/components/messages/BrowserCaptureHelloFrame'
      BrowserCaptureOfferFrame:
        $ref: '#/components/messages/BrowserCaptureOfferFrame'
      ErrorFrame:
        $ref: '#/components/messages/ErrorFrame'
      BrowserCaptureAnswerFrame:
        $ref: '#/components/messages/BrowserCaptureAnswerFrame'
      BrowserCaptureControlFrame:
        $ref: '#/components/messages/BrowserCaptureControlFrame'
operations:
  sendAuth:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: 'Authenticate the WebSocket connection. Must be the first frame sent after the connection opens. The server validates
      the token and emits a session_state frame on success, or an error frame on failure.

      '
    messages:
    - $ref: '#/channels/chat/messages/AuthFrame'
  sendMessage:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: 'Send a user chat message. Omit session_id to start a new session (server responds with session_started); include
      session_id to continue an existing session.

      '
    messages:
    - $ref: '#/channels/chat/messages/MessageFrame'
  sendCancel:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: 'Request cancellation of the in-progress agent turn for a session. The server responds with cancel_stage frames
      (graceful → hard → detached) and eventually a done frame.

      '
    messages:
    - $ref: '#/channels/chat/messages/CancelFrame'
  sendPing:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: 'Heartbeat ping sent every 30 seconds by the SPA to keep the connection alive through proxies. The server responds
      with a PongFrame so the SPA observes a server-originated frame during idle periods (without it, the client liveness
      check would force-close after 60 s of silence). The gorilla/websocket protocol-level ping/pong cycle continues to run
      independently as defense-in-depth NAT-keepalive.

      '
    messages:
    - $ref: '#/channels/chat/messages/PingFrame'
  sendAttachSession:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: 'Attach to an existing session and replay its transcript. The server emits replay_message, tool_call_start, tool_call_result,
      subagent_start, subagent_end, and media frames in order, then a done frame.

      '
    messages:
    - $ref: '#/channels/chat/messages/AttachSessionFrame'
  sendDevicePairingResponse:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: 'Admin''s approval or rejection of a pending device pairing request. Sent in response to a device_pairing_request
      frame.

      '
    messages:
    - $ref: '#/channels/chat/messages/DevicePairingResponseFrame'
  sendSessionClose:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: 'Explicit session close request. The server unregisters the session, fires CloseSession on the agent loop, and
      responds with session_close_ack.

      '
    messages:
    - $ref: '#/channels/chat/messages/SessionCloseFrame'
  sendWhatsAppPairingSubscribe:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: 'Start or stop receiving whatsapp_pairing (QR/status) frames for a channel on THIS connection. The SPA sends
      active:true when an operator opens a channel''s pairing UI and active:false when they leave, so the QR pairing secret
      is delivered only to the connection that is watching it (#283).

      '
    messages:
    - $ref: '#/channels/chat/messages/WhatsAppPairingSubscribeFrame'
  receiveSessionStarted:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'New session ID minted by the server. Emitted when the SPA sent a message frame without a session_id. The SPA
      must store this as activeSessionId.

      '
    messages:
    - $ref: '#/channels/chat/messages/SessionStartedFrame'
  receiveToken:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'Partial LLM response text. Multiple token frames are emitted per turn. The SPA appends each to the current assistant
      message bubble.

      '
    messages:
    - $ref: '#/channels/chat/messages/TokenFrame'
  receiveDone:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'Terminal frame for a turn (live or replay). Exactly one done frame per turn. Contains per-turn token/cost/duration
      statistics.

      '
    messages:
    - $ref: '#/channels/chat/messages/DoneFrame'
  receiveError:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'Error notification. May be global (auth failure) or session-scoped. Does NOT terminate the WebSocket connection.

      '
    messages:
    - $ref: '#/channels/chat/messages/ErrorFrame'
  receiveToolCallStart:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'A tool execution has begun. The SPA renders a "running" tool call badge on the current assistant message.

      '
    messages:
    - $ref: '#/channels/chat/messages/ToolCallStartFrame'
  receiveToolCallResult:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'A tool execution has completed. The SPA updates the badge status to success or error and records the result.

      '
    messages:
    - $ref: '#/channels/chat/messages/ToolCallResultFrame'
  receiveToolResultProjection:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'A tool result already delivered to this session was capped or emptied in place in the model''s window (ADR-066 D5).
      The SPA updates the matching tool call''s rendering (recall mark visible only under Verbose chat); the full content stays
      in the archive and the gateway tool_results/ store.

      '
    messages:
    - $ref: '#/channels/chat/messages/ToolResultProjectionFrame'
  receiveSubagentStart:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'Opening bracket of a subagent span (FR-H-004). The SPA creates a collapsible span container in the assistant
      message.

      '
    messages:
    - $ref: '#/channels/chat/messages/SubagentStartFrame'
  receiveSubagentMessage:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      ADR-053 §Contract Surface — "Mid-span subagent frames". A mid-span
      typed-message ping (progress/checkpoint/artifact/blocker/question/
      decision_request/error/handback/steer/respond) riding between the
      subagent_start/subagent_end brackets. Feeds pill/panel/board live;
      full-fidelity data is fetched via delegate.inbox/peek.
    messages:
      - $ref: '#/channels/chat/messages/SubagentMessageFrame'
  receiveSubagentState:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      ADR-053 §Contract Surface — "Mid-span subagent frames". A mid-span
      live lifecycle ping (SessionLifecycleRecord.state projection) plus
      optional steering-receipt acknowledgement, riding between the
      subagent_start/subagent_end brackets.
    messages:
      - $ref: '#/channels/chat/messages/SubagentStateFrame'
  receiveSubagentEnd:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'Closing bracket of a subagent span (FR-H-004). The SPA transitions the span to a terminal status with duration
      and optional result.

      '
    messages:
    - $ref: '#/channels/chat/messages/SubagentEndFrame'
  receiveTaskStatusChanged:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'A task''s status changed. The SPA invalidates its tasks query cache.

      '
    messages:
    - $ref: '#/channels/chat/messages/TaskStatusChangedFrame'
  receiveTaskRunStatus:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'A task RUN''s status changed (open or close), stamped with its occurrence_ms when it realizes a scheduled recurring
      instant (ADR-050 / task-run-history-spec §3.8). Distinct from TaskStatusChangedFrame: a recurring occurrence''s queued→in_progress→
      done transition does not move Task.status between distinct values the calendar reads, so this additive frame is what
      drives a live per-occurrence chip update. The SPA invalidates its task-occurrences and task-runs query caches on receipt.

      '
    messages:
    - $ref: '#/channels/chat/messages/TaskRunStatusFrame'
  receiveReplayMessage:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'One replayed transcript entry during a session attach. The SPA reconstructs the conversation from these frames.

      '
    messages:
    - $ref: '#/channels/chat/messages/ReplayMessageFrame'
    - $ref: '#/channels/chat/messages/ReplayErrorFrame'
  receiveRateLimit:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'A rate-limit denial was applied to an agent action (SEC-26). The SPA displays an inline rate-limit indicator.

      '
    messages:
    - $ref: '#/channels/chat/messages/RateLimitFrame'
  receiveMedia:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'One or more media attachments generated by a tool. The SPA renders them inline in the assistant message bubble.

      '
    messages:
    - $ref: '#/channels/chat/messages/MediaFrame'
  receiveAgentSwitched:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'The active agent for a session changed (switch_agent, ADR-071 D4). The SPA updates the active agent in the
      session store.

      '
    messages:
    - $ref: '#/channels/chat/messages/AgentSwitchedFrame'
  receiveToolApprovalRequired:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'A tool call is paused for ask-policy approval (FR-011, FR-082). The SPA enqueues it in the tool approval store
      and shows a modal to the admin. CRITICAL: args must never be null — see nil-safety contract in schema.

      '
    messages:
    - $ref: '#/channels/chat/messages/ToolApprovalRequiredFrame'
  receiveSessionState:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'One-shot approval state snapshot emitted on every WS reconnect (FR-052, FR-073, FR-081). The SPA reconciles
      its approval store against this. pending_approvals is always an array, never null.

      '
    messages:
    - $ref: '#/channels/chat/messages/SessionStateFrame'
  receiveSystemOverload:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'System at capacity — an agent action was blocked (FR-016, MAJ-009). The SPA shows a warning toast.

      '
    messages:
    - $ref: '#/channels/chat/messages/SystemOverloadFrame'
  receiveReplayWarning:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'Transcript contained duplicate tool_call_ids. Emitted just before the terminal done frame during replay. The
      SPA shows a one-shot warning toast.

      '
    messages:
    - $ref: '#/channels/chat/messages/ReplayWarningFrame'
  receiveCancelStage:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'Cancel progress notification (B3). Three stages: graceful → hard → detached. The SPA updates the stop-button
      label based on the stage. CRITICAL: stage must be validated — invalid values are dropped by isValidFrame().

      '
    messages:
    - $ref: '#/channels/chat/messages/CancelStageFrame'
  receivePong:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'Pong response to a client PingFrame. Lets the SPA''s liveness check see a server-originated frame during idle
      so it does not force-close after 60 s of inactivity. Carries no payload beyond the type discriminator.

      '
    messages:
    - $ref: '#/channels/chat/messages/PongFrame'
  receiveSessionCloseAck:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'Acknowledgement of a session_close client request. The server confirms the session has been closed.

      '
    messages:
    - $ref: '#/channels/chat/messages/SessionCloseAckFrame'
  receiveDevicePairingRequest:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'A remote device is requesting pairing and needs admin approval. The SPA shows a pairing modal. The admin responds
      with device_pairing_response.

      '
    messages:
    - $ref: '#/channels/chat/messages/DevicePairingRequestFrame'
  receiveWhatsAppPairing:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'The WhatsApp native/QR channel published a pairing update (a QR code to scan or a status change). The SPA renders
      the QR and live waiting → linked status (#283).

      '
    messages:
    - $ref: '#/channels/chat/messages/WhatsAppPairingFrame'
  receiveNotification:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: 'A notification was raised for the authenticated user (e.g. a scheduled run failed). The SPA adds it to the header
      notification center and bumps the unread badge. Delivered only to the recipient user''s connections (#264).

      '
    messages:
    - $ref: '#/channels/chat/messages/NotificationFrame'
  receiveGoalStatus:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      Status push for the session's active /goal loop (ADR-049 D6/D7).
      Emitted on round completion, state change, and clear/stop. Session-
      scoped.
    messages:
      - $ref: '#/channels/chat/messages/GoalStatusFrame'

  receiveLoopStatus:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      Status push for the session's active /loop (ADR-049 D6/D7). Emitted on
      run completion, state change, and stop. Session-scoped.
    messages:
      - $ref: '#/channels/chat/messages/LoopStatusFrame'

  receivePlanStatus:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      Status push for a Plan (ADR-049 D4/D7). Emitted on phase change, state
      transition, progress change, and pause/resume. Not session-scoped — a
      Plan is a standalone workspace-scoped entity.
    messages:
      - $ref: '#/channels/chat/messages/PlanStatusFrame'

  receiveJudgeVerdict:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      Live push of a judge adjudication (ADR-049 D2/D4/NFR-5) — the WS
      carrier of a judge verdict. The other carrier is the persisted
      session-transcript entry (Message.type=judge_verdict); both carry the
      same shape so they cannot silently disagree.
    messages:
      - $ref: '#/channels/chat/messages/JudgeVerdictFrame'
  # ── Browser live channel (ADR-038) ──────────────────────────────────────────
  sendBrowserAttach:
    action: send
    channel:
      $ref: '#/channels/browser'
    summary: 'Bind this browser-live connection to a session''s browser and start watching it for control-lock and tab-strip
      bookkeeping. Sent after the auth frame. The server responds with browser_status(attached), then browser_tabs and
      browser_webrtc_state — video is carried exclusively by WebRTC (ADR-047/ADR-061), offered once browser_webrtc_state
      reports available=true.

      '
    messages:
    - $ref: '#/channels/browser/messages/BrowserAttachFrame'
  sendBrowserInput:
    action: send
    channel:
      $ref: '#/channels/browser'
    summary: 'Inject a viewer input event (mouse/wheel/key/text) into the live browser. Honoured only while the viewer holds
      control (browser_control action=take).

      '
    messages:
    - $ref: '#/channels/browser/messages/BrowserInputFrame'
  sendBrowserControl:
    action: send
    channel:
      $ref: '#/channels/browser'
    summary: 'Take or release interactive control of the live browser. The server replies with browser_status(controlling)
      or browser_status(released).

      '
    messages:
    - $ref: '#/channels/browser/messages/BrowserControlFrame'
  sendBrowserDetach:
    action: send
    channel:
      $ref: '#/channels/browser'
    summary: 'Detach this viewer; the server stops watching the session when the last viewer leaves. Sent when the live
      panel closes.

      '
    messages:
    - $ref: '#/channels/browser/messages/BrowserDetachFrame'
  sendBrowserTabAction:
    action: send
    channel:
      $ref: '#/channels/browser'
    summary: 'Switch the active tab, close a tab, or open a new blank tab in this session''s browsing context. The server
      replies with browser_tabs. Switch re-binds the live view (and the WebRTC capture) to the new active tab. See ADR-041.

      '
    messages:
    - $ref: '#/channels/browser/messages/BrowserTabActionFrame'
  sendBrowserViewport:
    action: send
    channel:
      $ref: '#/channels/browser'
    summary: 'Report the panel''s render box so the gateway can size the captured tab to match it. Sent on attach and
      debounced on resize. The server applies the metrics and triggers a recapture so the encoder rebuilds at the new
      geometry.

      '
    messages:
    - $ref: '#/channels/browser/messages/BrowserViewportFrame'
  receiveBrowserStatus:
    action: receive
    channel:
      $ref: '#/channels/browser'
    summary: 'Lifecycle / control status for the live browser (attached, controlling, released, detached, idle, error).

      '
    messages:
    - $ref: '#/channels/browser/messages/BrowserStatusFrame'
  receiveBrowserTabs:
    action: receive
    channel:
      $ref: '#/channels/browser'
    summary: 'The current set of open tabs + the active index, broadcast on any tab open/close/switch/title-change. The SPA
      renders the tab strip; the WebRTC capture always follows the active tab. See ADR-041.

      '
    messages:
    - $ref: '#/channels/browser/messages/BrowserTabsFrame'
  sendBrowserWebRTCOffer:
    action: send
    channel:
      $ref: '#/channels/browser'
    summary: 'Offer to start (or restart) WebRTC media for this live-browser connection. Sent after browser_attach, once browser_webrtc_state
      has reported available=true. The server responds with browser_webrtc_answer, or a browser_webrtc_state frame reporting
      why it could not honour the offer. See ADR-047 D1/D4.

      '
    messages:
    - $ref: '#/channels/browser/messages/BrowserWebRTCOfferFrame'
  receiveBrowserWebRTCAnswer:
    action: receive
    channel:
      $ref: '#/channels/browser'
    summary: 'Pion SDP answer to a browser_webrtc_offer. Once applied, the SPA''s viewer PeerConnection begins receiving media
      (and the "input" data channel opens for viewer input). See ADR-047 D1/D4.

      '
    messages:
    - $ref: '#/channels/browser/messages/BrowserWebRTCAnswerFrame'
  receiveBrowserWebRTCState:
    action: receive
    channel:
      $ref: '#/channels/browser'
    summary: 'Availability / lifecycle state for the WebRTC media path: whether the SPA may offer WebRTC at all, whether it
      is currently active, and whether the captured tab currently has audio. WebRTC is the ONLY live-browser video path
      (ADR-061) — a false/unavailable/inactive state means the panel has no video, and the SPA must show that honestly
      rather than silently degrading to another stream. See ADR-047 D1, ADR-061.

      '
    messages:
    - $ref: '#/channels/browser/messages/BrowserWebRTCStateFrame'
  sendBrowserCaptureHello:
    action: send
    channel:
      $ref: '#/channels/browserCaptureIngest'
    summary: 'Authenticate the capture-ingest connection. Must be the first frame sent by the encoder page after the connection
      opens. The gateway validates the per-stream capability token and audits the outcome; an invalid/missing/expired token
      closes the connection. See ADR-047 D6.

      '
    messages:
    - $ref: '#/channels/browserCaptureIngest/messages/BrowserCaptureHelloFrame'
  sendBrowserCaptureOffer:
    action: send
    channel:
      $ref: '#/channels/browserCaptureIngest'
    summary: 'SDP offer from the encoder page''s self-consuming tabCapture PeerConnection, sent after a successful browser_capture_hello.
      The gateway responds with browser_capture_answer. See ADR-047 D1/D2.

      '
    messages:
    - $ref: '#/channels/browserCaptureIngest/messages/BrowserCaptureOfferFrame'
  receiveBrowserCaptureAnswer:
    action: receive
    channel:
      $ref: '#/channels/browserCaptureIngest'
    summary: 'Pion SDP answer to a browser_capture_offer. Once applied, the encoder page''s captured media (video, plus audio
      when present) flows into the gateway''s shared relay tracks. See ADR-047 D1/D2.

      '
    messages:
    - $ref: '#/channels/browserCaptureIngest/messages/BrowserCaptureAnswerFrame'
  sendBrowserCaptureControl:
    action: send
    channel:
      $ref: '#/channels/browserCaptureIngest'
    summary: 'Gateway → encoder page control command: recapture (the agent''s active tab changed and the tabCapture stream
      must be re-bound) or shutdown (the capture session is ending). See ADR-047 D2.

      '
    messages:
    - $ref: '#/channels/browserCaptureIngest/messages/BrowserCaptureControlFrame'
  receiveBrowserCaptureControl:
    action: receive
    channel:
      $ref: '#/channels/browserCaptureIngest'
    summary: 'Encoder page → gateway health beacon (action=ping), sent periodically so the gateway''s reconnect watchdog can
      detect a stuck or crashed encoder page. See ADR-047 D2.

      '
    messages:
    - $ref: '#/channels/browserCaptureIngest/messages/BrowserCaptureControlFrame'
