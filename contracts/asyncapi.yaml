  schemas:
    WsFrameType:
      title: WsFrameType
      description: Enum of all WebSocket frame type discriminator strings.
      type: string
      enum:
      - auth
      - message
      - cancel
      - ping
      - attach_session
      - device_pairing_response
      - session_close
      - session_started
      - token
      - done
      - error
      - tool_call_start
      - tool_call_result
      - tool_result_projection
      - subagent_start
      - subagent_message
      - subagent_state
      - subagent_end
      - task_status_changed
      - task_run_status
      - replay_message
      - replay_error
      - rate_limit
      - media
      - agent_switched
      - tool_approval_required
      - session_state
      - system_overload
      - replay_warning
      - cancel_stage
      - pong
      - session_close_ack
      - device_pairing_request
      - whatsapp_pairing
      - whatsapp_pairing_subscribe
      - notification
      - browser_attach
      - browser_input
      - browser_control
      - browser_detach
      - browser_status
      - browser_tab_action
      - browser_tabs
      - browser_viewport
      - browser_webrtc_offer
      - browser_webrtc_answer
      - browser_webrtc_state
      - browser_capture_hello
      - browser_capture_offer
      - browser_capture_answer
      - browser_capture_control
      - goal_status
      - loop_status
      - plan_status
      - judge_verdict
    AuthFrame:
      title: AuthFrame
      description: Client → server authentication frame.
      type: object
      required:
      - type
      - token
      additionalProperties: false
      properties:
        type:
          type: string
          const: auth
        token:
          type: string
          minLength: 72
          maxLength: 81
          pattern: ^omnipus_([a-f0-9]{8}_)?[a-f0-9]{64}$
          description: Bearer token from /api/v1/auth/login. Id-tagged "omnipus_<8hex>_<64hex>" (81) or legacy "omnipus_<64hex>"
            (72).
    MessageFrame:
      title: MessageFrame
      description: >
        Client → server user chat message. Omit session_id to start a new
        session; include to continue an existing one. content must always
        be present as a key, but MAY be an empty string when media is also
        present and non-empty — an attachment-only send legitimately has no
        caption (UAT Issue 5). The anyOf below enforces the actual
        invariant: content has at least 1 character, OR media has at least
        1 entry — a message with neither is still rejected.
      type: object
      required:
      - type
      - content
      additionalProperties: false
      anyOf:
      - properties:
          content:
            minLength: 1
      - required:
        - media
        properties:
          media:
            minItems: 1
      properties:
        type:
          type: string
          const: message
        content:
          type: string
          maxLength: 5242880
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        agent_id:
          type: string
          minLength: 1
          maxLength: 128
        media:
          type: array
          description: 'Optional media:// refs for files the user attached to this message (e.g. images uploaded via POST
            /api/v1/upload). The server threads each ref into the LLM content array as a multimodal content block so the agent
            can see the attachment. Empty or omitted for text-only messages.

            '
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 256
        metadata:
          type: object
          additionalProperties: true
          description: 'Optional per-message metadata. Typed keys today: `model_name` (Phase 1, FR-010) — when the user picks
            a model in the chat composer, the picker value is sent as `metadata.model_name` so the server routes this turn
            to the chosen model, falling back to the agent''s `model` config when absent; `workspace_id` — the active workspace
            this chat belongs to; and `workspace_setup_kickoff` (boolean) — a one-time marker that this message is the workspace
            setup kickoff for `metadata.workspace_id`.

            '
          properties:
            model_name:
              type: string
              minLength: 1
              maxLength: 256
              description: 'Model identifier for this turn. Server honors when present, falls back to agent config otherwise.
                Empty string is treated as absent.

                '
              example: z-ai/glm-5-turbo
            workspace_id:
              type: string
              minLength: 1
              maxLength: 128
              description: 'Active workspace this chat belongs to (M4 workspace→turn binding). When the user sends a message
                from a workspace chat, the SPA sets this so the server tags the session with the workspace and any task the
                agent creates during the turn (task_create / delegation) lands on THIS workspace''s board instead of the agent''s
                default workspace. Stamped onto the session meta on first use; absent for the global (non-workspace) chat,
                where created tasks fall back to the default workspace.

                '
              example: 01JXDEFAULT000000000000001
            workspace_setup_kickoff:
              type: boolean
              description: 'One-time marker that this message is the workspace-setup kickoff turn for `metadata.workspace_id`.
                When true, the server treats the frame as the one-time workspace-setup kickoff — the frame''s `content` is
                ignored and replaced by a server-composed instruction; a system-role entry is recorded; the workspace''s `setup_pending`
                flag is cleared exactly once (idempotency-guarded); duplicate and malformed kickoffs are rejected with an
                error frame. Absent/false for ordinary messages.

                '
              example: true
    CancelFrame:
      title: CancelFrame
      description: Client → server cancel in-progress turn.
      type: object
      required:
      - type
      - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: cancel
        session_id:
          type: string
          minLength: 1
          maxLength: 128
    PingFrame:
      title: PingFrame
      description: Client → server heartbeat.
      type: object
      required:
      - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: ping
    PongFrame:
      title: PongFrame
      description: 'Server → client heartbeat acknowledgement. Emitted in response to every client PingFrame so the SPA''s
        "any frame received recently" liveness check observes a server frame during idle and does not force-close after 60
        s of silence.

        '
      type: object
      required:
      - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: pong
    AttachSessionFrame:
      title: AttachSessionFrame
      description: 'Client → server request to attach to an existing session. When `since` is provided, the server skips replay
        frames whose timestamp <= `since`, sending only frames the SPA has not yet seen. Omitting `since` requests a full
        replay (legacy behaviour).

        '
      type: object
      required:
      - type
      - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: attach_session
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        since:
          type: string
          format: date-time
          description: 'ISO 8601 timestamp of the most recent frame the SPA has already processed. Server replays only frames
            with timestamp > this value. Used to keep reconnect replay traffic O(missed window) instead of O(full session
            history).

            '
    DevicePairingResponseFrame:
      title: DevicePairingResponseFrame
      description: Client → server device pairing decision.
      type: object
      required:
      - type
      - device_id
      - decision
      additionalProperties: false
      properties:
        type:
          type: string
          const: device_pairing_response
        device_id:
          type: string
          minLength: 1
        decision:
          type: string
          enum:
          - approve
          - reject
    SessionStartedFrame:
      title: SessionStartedFrame
      description: >
        Server → client new session minted. Session-scoped (registered in
        SESSION_SCOPED_FRAME_TYPES); class (b) per the ADR-057 W5 audit
        (FR-089) — a chat-lifecycle frame, not turn output — so
        producing_session_id is absent (FR-013).
      type: object
      required:
      - type
      - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: session_started
        session_id:
          type: string
          minLength: 1
        agent_id:
          type: string
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Present iff it differs from session_id.
            Class (b) (FR-089): absent for this frame type.
    TokenFrame:
      title: TokenFrame
      description: >
        Server → client partial LLM response token. Session-scoped
        (registered in SESSION_SCOPED_FRAME_TYPES); class (a) per the
        ADR-057 W5 audit (FR-089) — genuinely child-turn-produced.
      type: object
      required:
      - type
      - session_id
      - content
      additionalProperties: false
      properties:
        type:
          type: string
          const: token
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        content:
          type: string
          maxLength: 65536
        agent_id:
          type: string
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Present iff it differs from session_id.
            Class (a) (FR-089): the child turn's own session id when this
            frame crosses the wire from a delegated child.
    DoneStats:
      title: DoneStats
      description: 'Per-turn statistics in a done frame. additionalProperties are allowed for replay extras (frames_emitted,
        orphan_count, etc.).

        '
      type: object
      additionalProperties: true
      properties:
        tokens:
          type: number
          minimum: 0
        cost:
          type: number
          minimum: 0
        duration_ms:
          type: number
          minimum: 0
        tokens_dropped:
          type: number
          minimum: 0
        frames_emitted:
          type: number
          minimum: 0
        orphan_count:
          type: number
          minimum: 0
        duplicate_tool_call_id_count:
          type: number
          minimum: 0
        truncated_result_count:
          type: number
          minimum: 0
        replay_error:
          type: boolean
        turn_failed:
          type: boolean
    DoneFrame:
      title: DoneFrame
      description: >
        Server → client turn complete. Session-scoped (registered in
        SESSION_SCOPED_FRAME_TYPES); class (a) per the ADR-057 W5 audit
        (FR-089) — genuinely child-turn-produced.
      type: object
      required:
      - type
      - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: done
        session_id:
          type: string
          minLength: 1
        stats:
          $ref: '#/components/schemas/DoneStats'
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Present iff it differs from session_id.
            Class (a) (FR-089): the child turn's own session id when this
            frame crosses the wire from a delegated child.
    LLMError:
      title: LLMError
      description: Translated provider/LLM error safe for the live WebSocket boundary.
      type: object
      required:
        - code
        - message
        - retryable
      additionalProperties: false
      # ── Fault attribution vocabulary ─────────────────────────────────────────────
      # Who owns the fault behind a code. The generators (scripts/gen-asyncapi-go and
      # scripts/_gen-asyncapi-types.mjs) emit this as a closed Go/TS type and HARD-FAIL
      # when an x-user-messages entry names an attribution that is not on this list —
      # so a typo'd tag ("providr") breaks codegen instead of silently shipping.
      #
      #   model      — the model itself refused or mishandled the request.
      #   provider   — the hosting provider (not the model) blocked or throttled us.
      #   product    — WE built a bad request. Omnipus is at fault, not the user.
      #   config     — an operator-fixable setting (credentials, workspace membership).
      #   ambiguous  — could be either side; the copy must say where to look.
      #   unknown    — genuinely unclassified.
      #   user       — the user ended the turn themselves (Stop button, shutdown).
      #                Rendered as a neutral notice, never an error toast (ADR-066 D7).
      x-user-message-attributions:
        - model
        - provider
        - product
        - config
        - ambiguous
        - unknown
        - user
      # ── User-facing copy catalogue (SINGLE SOURCE OF TRUTH) ──────────────────────
      # Every enum value below MUST appear here exactly once, with a non-empty message
      # and an attribution drawn from x-user-message-attributions. Both generators
      # validate that bijection and abort on any gap, so "every code has a message and
      # an attribution" is true by construction rather than by review.
      #
      # The Go catalogue (pkg/api/generated/llm_error_messages.gen.go, consumed by
      # pkg/agent/translate_error.go) and the TS catalogue
      # (src/lib/api/generated/llm-error-messages.ts, consumed by src/lib/llm-error.ts)
      # are BOTH generated from this block. Do not hand-write either one.
      #
      # Copy rules enforced by test (pkg/agent/translate_error_test.go and
      # src/lib/llm-error.test.ts):
      #   - a `product` or `config` message never tells the user to switch models,
      #     never asks them to rephrase their content, and — for `config` — never
      #     tells them to retry (a credentials/membership fault will not self-heal).
      #   - no message anywhere tells the user to contact support.
      #
      # There is deliberately NO blanket "From the model:" prefix: attribution is
      # written into each sentence instead, so the copy stays readable and each
      # message names the real owner of the fault.
      x-user-messages:
        media_unsupported:
          message: "This model can’t use that kind of attachment. Try a different file format, or switch to a model that supports it."
          attribution: model
        provider_rejected:
          message: "The model declined to respond to this request. Try rephrasing it, or switch models."
          attribution: model
        request_too_large:
          message: "We built a request that was too large for this model to accept. Try shortening your message, or switch to a model with a larger limit."
          attribution: product
        provider_auth_failed:
          message: "The model provider rejected our credentials. Check this provider’s API key in Settings."
          attribution: config
        rate_limited:
          message: "The model provider is temporarily overloaded. Wait a moment, then retry."
          attribution: provider
        network:
          message: "We couldn’t reach the model provider. Check your internet connection and retry."
          attribution: ambiguous
        content_policy:
          message: "The model provider blocked this request under its content policy. Try rephrasing to remove the flagged content."
          attribution: provider
        context_too_long:
          message: "This turn needed more context than the model can hold, even after trimming older turns automatically. Try a model with a larger context window, or shorten this message."
          attribution: product
        tool_args:
          message: "The model filled in a tool’s arguments incorrectly. Retry — Verbose chat shows which tool and what went wrong."
          attribution: model
        schema:
          message: "We sent the model provider a request it couldn’t process — that’s a bug on our side, not yours. Retry the turn, or open Verbose chat for technical details."
          attribution: product
        agent_not_configured:
          message: "This agent isn’t on any workspace yet, so it has nowhere to work. Add it to a workspace team to get started."
          attribution: config
        workspace_unavailable:
          message: "This agent’s working folder could not be opened. Check that the disk has space and the folder is writable."
          attribution: config
        model_unavailable:
          message: "The model you picked isn’t available for this turn, so this reply used the previous model. Check the model in Settings."
          attribution: config
        needs_provider:
          # ADR-068 FR-046 (2026-08-23 §8b, T068-32) — kept in lockstep with
          # contracts/components/schemas/LLMError.yaml; see that file's comment.
          message: "Your sign-in for this provider expired. Sign in again under Settings → Providers."
          attribution: user
        model_unassigned:
          message: "This agent has no model. Pick one in the agent's settings."
          attribution: config
        turn_canceled:
          message: "This turn was stopped before it finished."
          attribution: user
        turn_timed_out:
          message: "The model provider didn’t finish this turn in time, so it was stopped. Retry — if it keeps happening, open Verbose chat for details."
          attribution: provider
        context_unrecoverable:
          message: "We couldn’t fit this turn into the model’s context even after clearing older tool results — that’s a bug on our side, not yours. Start a new session, or open Verbose chat for technical details."
          attribution: product
        context_window_unknown:
          message: "This endpoint did not report a context length for this model. Set it under Settings → Models → Model overrides → Context length."
          attribution: config
        unknown:
          message: "This turn didn’t finish, and we can’t tell why. Retry — if it keeps happening, open Verbose chat for details, or try a different model."
          attribution: unknown
      properties:
        code:
          type: string
          enum:
            - media_unsupported
            - provider_rejected
            - request_too_large
            - provider_auth_failed
            - rate_limited
            - network
            - content_policy
            - context_too_long
            - tool_args
            - schema
            - agent_not_configured
            - workspace_unavailable
            - model_unavailable
            - needs_provider
            - model_unassigned
            - turn_canceled
            - turn_timed_out
            - context_unrecoverable
            - context_window_unknown
            - unknown
        message:
          type: string
          minLength: 1
          maxLength: 4096
        retryable:
          type: boolean
        detail:
          type: string
          maxLength: 2048
          description: Live-only technical detail; never persisted or replayed.
    LLMErrorReplay:
