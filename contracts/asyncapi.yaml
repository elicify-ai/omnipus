asyncapi: 3.0.0

info:
  title: Omnipus WebSocket API
  version: 0.1.0
  description: >
    Bidirectional WebSocket protocol for the Omnipus gateway.

    The SPA (browser client) connects to /api/v1/chat/ws, authenticates
    with an auth frame, then exchanges structured JSON frames for chat
    streaming, tool call tracking, session replay, tool approvals,
    rate limiting, and cancel progress.

    All frames are JSON objects with a "type" discriminator field.

    Frame naming convention:
      Client → server ("send" from SPA perspective)
      Server → client ("receive" from SPA perspective)

    Nil-safety contract (Ava-chat bug lesson):
      Fields that the SPA reads via Object.keys(), .map(), .length, or spread
      MUST be required and typed as object/array in this spec so the contract
      test (Phase 4) catches any backend regression where Go emits null.
      Specifically: args in ToolApprovalRequiredFrame, pending_approvals in
      SessionStateFrame, parts in MediaFrame, params in ToolCallStartFrame.

  contact:
    name: Omnipus contributors
    url: https://omnipus.ai
  license:
    name: MIT

servers:
  gateway:
    host: localhost:6060
    pathname: /api/v1/chat/ws
    protocol: ws
    description: >
      Main WebSocket endpoint. Serves the SPA chat stream. The host and port
      are governed by gateway.port in config.json (default 6060). For TLS
      deployments behind a reverse proxy, this becomes wss:// at the public
      hostname.
  gateway-preview:
    host: localhost:6061
    pathname: /ws
    protocol: ws
    description: >
      Preview-port WebSocket endpoint (gateway.preview_port, default 6061).
      Serves the iframe-preview channel. The same frame protocol applies.
      Only active when gateway.preview_listener_enabled is true (default).

defaultContentType: application/json

channels:
  chat:
    address: /api/v1/chat/ws
    description: >
      Primary bidirectional chat channel. Carries all client→server send frames
      and all server→client receive frames. Upgraded from HTTP by the gateway
      on GET /api/v1/chat/ws with Upgrade: websocket.
    servers:
      - $ref: '#/servers/gateway'
    messages:
      # ── Client → server ───────────────────────────────────────────────────────
      AuthFrame:
        $ref: '#/components/messages/AuthFrame'
      MessageFrame:
        $ref: '#/components/messages/MessageFrame'
      CancelFrame:
        $ref: '#/components/messages/CancelFrame'
      PingFrame:
        $ref: '#/components/messages/PingFrame'
      AttachSessionFrame:
        $ref: '#/components/messages/AttachSessionFrame'
      DevicePairingResponseFrame:
        $ref: '#/components/messages/DevicePairingResponseFrame'
      SessionCloseFrame:
        $ref: '#/components/messages/SessionCloseFrame'
      WhatsAppPairingSubscribeFrame:
        $ref: '#/components/messages/WhatsAppPairingSubscribeFrame'
      # ── Server → client ───────────────────────────────────────────────────────
      SessionStartedFrame:
        $ref: '#/components/messages/SessionStartedFrame'
      TokenFrame:
        $ref: '#/components/messages/TokenFrame'
      DoneFrame:
        $ref: '#/components/messages/DoneFrame'
      ErrorFrame:
        $ref: '#/components/messages/ErrorFrame'
      ToolCallStartFrame:
        $ref: '#/components/messages/ToolCallStartFrame'
      ToolCallResultFrame:
        $ref: '#/components/messages/ToolCallResultFrame'
      SubagentStartFrame:
        $ref: '#/components/messages/SubagentStartFrame'
      SubagentEndFrame:
        $ref: '#/components/messages/SubagentEndFrame'
      TaskStatusChangedFrame:
        $ref: '#/components/messages/TaskStatusChangedFrame'
      ReplayMessageFrame:
        $ref: '#/components/messages/ReplayMessageFrame'
      ReplayErrorFrame:
        $ref: '#/components/messages/ReplayErrorFrame'
      RateLimitFrame:
        $ref: '#/components/messages/RateLimitFrame'
      MediaFrame:
        $ref: '#/components/messages/MediaFrame'
      AgentSwitchedFrame:
        $ref: '#/components/messages/AgentSwitchedFrame'
      ToolApprovalRequiredFrame:
        $ref: '#/components/messages/ToolApprovalRequiredFrame'
      SessionStateFrame:
        $ref: '#/components/messages/SessionStateFrame'
      SystemOverloadFrame:
        $ref: '#/components/messages/SystemOverloadFrame'
      ReplayWarningFrame:
        $ref: '#/components/messages/ReplayWarningFrame'
      CancelStageFrame:
        $ref: '#/components/messages/CancelStageFrame'
      PongFrame:
        $ref: '#/components/messages/PongFrame'
      SessionCloseAckFrame:
        $ref: '#/components/messages/SessionCloseAckFrame'
      DevicePairingRequestFrame:
        $ref: '#/components/messages/DevicePairingRequestFrame'
      WhatsAppPairingFrame:
        $ref: '#/components/messages/WhatsAppPairingFrame'
      NotificationFrame:
        $ref: '#/components/messages/NotificationFrame'

  browser:
    address: /api/v1/browser/ws
    description: >
      Live interactive browser channel (ADR-038). A dedicated WebSocket, separate
      from the chat channel, carrying CDP screencast frames (server → client) and
      viewer input / control frames (client → server) for the live browser panel.
      Authenticated with the same first-message auth frame as the chat channel.
    servers:
      - $ref: '#/servers/gateway'
    messages:
      # ── Client → server ───────────────────────────────────────────────────────
      AuthFrame:
        $ref: '#/components/messages/AuthFrame'
      BrowserAttachFrame:
        $ref: '#/components/messages/BrowserAttachFrame'
      BrowserInputFrame:
        $ref: '#/components/messages/BrowserInputFrame'
      BrowserControlFrame:
        $ref: '#/components/messages/BrowserControlFrame'
      BrowserDetachFrame:
        $ref: '#/components/messages/BrowserDetachFrame'
      BrowserTabActionFrame:
        $ref: '#/components/messages/BrowserTabActionFrame'
      # ── Server → client ───────────────────────────────────────────────────────
      ErrorFrame:
        $ref: '#/components/messages/ErrorFrame'
      BrowserScreencastFrame:
        $ref: '#/components/messages/BrowserScreencastFrame'
      BrowserStreamInitFrame:
        $ref: '#/components/messages/BrowserStreamInitFrame'
      BrowserVideoChunkFrame:
        $ref: '#/components/messages/BrowserVideoChunkFrame'
      BrowserAudioChunkFrame:
        $ref: '#/components/messages/BrowserAudioChunkFrame'
      BrowserStatusFrame:
        $ref: '#/components/messages/BrowserStatusFrame'
      BrowserTabsFrame:
        $ref: '#/components/messages/BrowserTabsFrame'

  browser-ingest:
    address: /api/v1/browser/capture-ingest
    description: >
      Capture-ingest channel (FR-012). A distinct, loopback-only WebSocket the
      gateway's controlled encoder page (running inside the managed headful
      Chrome, never the SPA and never externally reachable) connects to: it
      authenticates with a per-stream capability token via browser_ingest_init
      (FR-013), then streams encoded video/audio chunks upstream as binary
      browser_ingest_chunk messages. The gateway pushes CDP
      Page.startScreencast JPEG frames downstream as binary browser_frame_feed
      messages for the encoder page's WebCodecs pipeline to encode. The
      endpoint enforces loopback-only RemoteAddr and is never an external
      listener. See ADR-044 §6.0.2/§6.3, spec R7 FR-012/013/014.
    servers:
      - $ref: '#/servers/gateway'
    messages:
      # ── Encoder page → gateway ───────────────────────────────────────────────
      BrowserIngestInitFrame:
        $ref: '#/components/messages/BrowserIngestInitFrame'
      BrowserIngestChunkFrame:
        $ref: '#/components/messages/BrowserIngestChunkFrame'
      # ── Gateway → encoder page ───────────────────────────────────────────────
      BrowserFrameFeedFrame:
        $ref: '#/components/messages/BrowserFrameFeedFrame'

operations:
  # ── Client → server (action: send from SPA perspective) ─────────────────────

  sendAuth:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: >
      Authenticate the WebSocket connection. Must be the first frame sent
      after the connection opens. The server validates the token and emits a
      session_state frame on success, or an error frame on failure.
    messages:
      - $ref: '#/channels/chat/messages/AuthFrame'

  sendMessage:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: >
      Send a user chat message. Omit session_id to start a new session
      (server responds with session_started); include session_id to continue
      an existing session.
    messages:
      - $ref: '#/channels/chat/messages/MessageFrame'

  sendCancel:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: >
      Request cancellation of the in-progress agent turn for a session. The
      server responds with cancel_stage frames (graceful → hard → detached)
      and eventually a done frame.
    messages:
      - $ref: '#/channels/chat/messages/CancelFrame'

  sendPing:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: >
      Heartbeat ping sent every 30 seconds by the SPA to keep the connection
      alive through proxies. The server responds with a PongFrame so the SPA
      observes a server-originated frame during idle periods (without it, the
      client liveness check would force-close after 60 s of silence). The
      gorilla/websocket protocol-level ping/pong cycle continues to run
      independently as defense-in-depth NAT-keepalive.
    messages:
      - $ref: '#/channels/chat/messages/PingFrame'

  sendAttachSession:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: >
      Attach to an existing session and replay its transcript. The server
      emits replay_message, tool_call_start, tool_call_result, subagent_start,
      subagent_end, and media frames in order, then a done frame.
    messages:
      - $ref: '#/channels/chat/messages/AttachSessionFrame'

  sendDevicePairingResponse:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: >
      Admin's approval or rejection of a pending device pairing request.
      Sent in response to a device_pairing_request frame.
    messages:
      - $ref: '#/channels/chat/messages/DevicePairingResponseFrame'

  sendSessionClose:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: >
      Explicit session close request. The server unregisters the session,
      fires CloseSession on the agent loop, and responds with session_close_ack.
    messages:
      - $ref: '#/channels/chat/messages/SessionCloseFrame'

  sendWhatsAppPairingSubscribe:
    action: send
    channel:
      $ref: '#/channels/chat'
    summary: >
      Start or stop receiving whatsapp_pairing (QR/status) frames for a channel
      on THIS connection. The SPA sends active:true when an operator opens a
      channel's pairing UI and active:false when they leave, so the QR pairing
      secret is delivered only to the connection that is watching it (#283).
    messages:
      - $ref: '#/channels/chat/messages/WhatsAppPairingSubscribeFrame'

  # ── Server → client (action: receive from SPA perspective) ──────────────────

  receiveSessionStarted:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      New session ID minted by the server. Emitted when the SPA sent a message
      frame without a session_id. The SPA must store this as activeSessionId.
    messages:
      - $ref: '#/channels/chat/messages/SessionStartedFrame'

  receiveToken:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      Partial LLM response text. Multiple token frames are emitted per turn.
      The SPA appends each to the current assistant message bubble.
    messages:
      - $ref: '#/channels/chat/messages/TokenFrame'

  receiveDone:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      Terminal frame for a turn (live or replay). Exactly one done frame per
      turn. Contains per-turn token/cost/duration statistics.
    messages:
      - $ref: '#/channels/chat/messages/DoneFrame'

  receiveError:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      Error notification. May be global (auth failure) or session-scoped. Does
      NOT terminate the WebSocket connection.
    messages:
      - $ref: '#/channels/chat/messages/ErrorFrame'

  receiveToolCallStart:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      A tool execution has begun. The SPA renders a "running" tool call badge
      on the current assistant message.
    messages:
      - $ref: '#/channels/chat/messages/ToolCallStartFrame'

  receiveToolCallResult:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      A tool execution has completed. The SPA updates the badge status to
      success or error and records the result.
    messages:
      - $ref: '#/channels/chat/messages/ToolCallResultFrame'

  receiveSubagentStart:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      Opening bracket of a subagent span (FR-H-004). The SPA creates a
      collapsible span container in the assistant message.
    messages:
      - $ref: '#/channels/chat/messages/SubagentStartFrame'

  receiveSubagentEnd:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      Closing bracket of a subagent span (FR-H-004). The SPA transitions the
      span to a terminal status with duration and optional result.
    messages:
      - $ref: '#/channels/chat/messages/SubagentEndFrame'

  receiveTaskStatusChanged:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      A task's status changed. The SPA invalidates its tasks query cache.
    messages:
      - $ref: '#/channels/chat/messages/TaskStatusChangedFrame'

  receiveReplayMessage:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      One replayed transcript entry during a session attach. The SPA
      reconstructs the conversation from these frames.
    messages:
      - $ref: '#/channels/chat/messages/ReplayMessageFrame'
      - $ref: '#/channels/chat/messages/ReplayErrorFrame'

  receiveRateLimit:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      A rate-limit denial was applied to an agent action (SEC-26). The SPA
      displays an inline rate-limit indicator.
    messages:
      - $ref: '#/channels/chat/messages/RateLimitFrame'

  receiveMedia:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      One or more media attachments generated by a tool. The SPA renders
      them inline in the assistant message bubble.
    messages:
      - $ref: '#/channels/chat/messages/MediaFrame'

  receiveAgentSwitched:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      The active agent for a session changed (handoff or return_to_default).
      The SPA updates the active agent in the session store.
    messages:
      - $ref: '#/channels/chat/messages/AgentSwitchedFrame'

  receiveToolApprovalRequired:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      A tool call is paused for ask-policy approval (FR-011, FR-082). The SPA
      enqueues it in the tool approval store and shows a modal to the admin.
      CRITICAL: args must never be null — see nil-safety contract in schema.
    messages:
      - $ref: '#/channels/chat/messages/ToolApprovalRequiredFrame'

  receiveSessionState:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      One-shot approval state snapshot emitted on every WS reconnect (FR-052,
      FR-073, FR-081). The SPA reconciles its approval store against this.
      pending_approvals is always an array, never null.
    messages:
      - $ref: '#/channels/chat/messages/SessionStateFrame'

  receiveSystemOverload:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      System at capacity — an agent action was blocked (FR-016, MAJ-009). The
      SPA shows a warning toast.
    messages:
      - $ref: '#/channels/chat/messages/SystemOverloadFrame'

  receiveReplayWarning:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      Transcript contained duplicate tool_call_ids. Emitted just before
      the terminal done frame during replay. The SPA shows a one-shot warning
      toast.
    messages:
      - $ref: '#/channels/chat/messages/ReplayWarningFrame'

  receiveCancelStage:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      Cancel progress notification (B3). Three stages: graceful → hard →
      detached. The SPA updates the stop-button label based on the stage.
      CRITICAL: stage must be validated — invalid values are dropped by isValidFrame().
    messages:
      - $ref: '#/channels/chat/messages/CancelStageFrame'

  receivePong:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      Pong response to a client PingFrame. Lets the SPA's liveness check see a
      server-originated frame during idle so it does not force-close after 60 s
      of inactivity. Carries no payload beyond the type discriminator.
    messages:
      - $ref: '#/channels/chat/messages/PongFrame'

  receiveSessionCloseAck:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      Acknowledgement of a session_close client request. The server confirms
      the session has been closed.
    messages:
      - $ref: '#/channels/chat/messages/SessionCloseAckFrame'

  receiveDevicePairingRequest:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      A remote device is requesting pairing and needs admin approval. The SPA
      shows a pairing modal. The admin responds with device_pairing_response.
    messages:
      - $ref: '#/channels/chat/messages/DevicePairingRequestFrame'

  receiveWhatsAppPairing:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      The WhatsApp native/QR channel published a pairing update (a QR code to scan
      or a status change). The SPA renders the QR and live waiting → linked status
      (#283).
    messages:
      - $ref: '#/channels/chat/messages/WhatsAppPairingFrame'

  receiveNotification:
    action: receive
    channel:
      $ref: '#/channels/chat'
    summary: >
      A notification was raised for the authenticated user (e.g. a scheduled
      run failed). The SPA adds it to the header notification center and bumps
      the unread badge. Delivered only to the recipient user's connections (#264).
    messages:
      - $ref: '#/channels/chat/messages/NotificationFrame'

  # ── Browser live channel (ADR-038) ──────────────────────────────────────────

  sendBrowserAttach:
    action: send
    channel:
      $ref: '#/channels/browser'
    summary: >
      Bind this browser-live connection to a session's browser and start the
      screencast. Sent after the auth frame. The server responds with
      browser_status(attached) then a stream of browser_screencast frames.
    messages:
      - $ref: '#/channels/browser/messages/BrowserAttachFrame'

  sendBrowserInput:
    action: send
    channel:
      $ref: '#/channels/browser'
    summary: >
      Inject a viewer input event (mouse/wheel/key/text) into the live browser.
      Honoured only while the viewer holds control (browser_control action=take).
    messages:
      - $ref: '#/channels/browser/messages/BrowserInputFrame'

  sendBrowserControl:
    action: send
    channel:
      $ref: '#/channels/browser'
    summary: >
      Take or release interactive control of the live browser. The server replies
      with browser_status(controlling) or browser_status(released).
    messages:
      - $ref: '#/channels/browser/messages/BrowserControlFrame'

  sendBrowserDetach:
    action: send
    channel:
      $ref: '#/channels/browser'
    summary: >
      Detach this viewer; the server stops the screencast when the last viewer
      leaves. Sent when the live panel closes.
    messages:
      - $ref: '#/channels/browser/messages/BrowserDetachFrame'

  sendBrowserTabAction:
    action: send
    channel:
      $ref: '#/channels/browser'
    summary: >
      Switch the active tab, close a tab, or open a new blank tab in this
      session's browsing context. The server replies with browser_tabs. Switch
      re-binds the live screencast to the new active tab. See ADR-041.
    messages:
      - $ref: '#/channels/browser/messages/BrowserTabActionFrame'

  receiveBrowserScreencast:
    action: receive
    channel:
      $ref: '#/channels/browser'
    summary: >
      One CDP screencast frame (JPEG + coordinate metadata) for the live browser.
      Repaint-driven, not fixed-FPS. The SPA blits it and maps input coordinates.
    messages:
      - $ref: '#/channels/browser/messages/BrowserScreencastFrame'

  receiveBrowserStreamInit:
    action: receive
    channel:
      $ref: '#/channels/browser'
    summary: >
      Sent once before the first browser_video_chunk (and browser_audio_chunk,
      if has_audio), announcing the negotiated codec, resolution, keyframe
      interval, and audio availability for this viewer's stream (FR-005/006).
    messages:
      - $ref: '#/channels/browser/messages/BrowserStreamInitFrame'

  receiveBrowserVideoChunk:
    action: receive
    channel:
      $ref: '#/channels/browser'
    summary: >
      One encoded video chunk (binary WS frame) for the live browser, relayed
      from the encoder page's WebCodecs VideoEncoder via the capture-ingest
      channel. Fixed compact envelope, no fragment field (FR-002/003/017).
    messages:
      - $ref: '#/channels/browser/messages/BrowserVideoChunkFrame'

  receiveBrowserAudioChunk:
    action: receive
    channel:
      $ref: '#/channels/browser'
    summary: >
      One encoded Opus audio chunk (binary WS frame) for the live browser, when
      negotiated and the PulseAudio sidecar is available. Absence of audio
      chunks is never an error — video streams normally either way (FR-011).
    messages:
      - $ref: '#/channels/browser/messages/BrowserAudioChunkFrame'

  receiveBrowserStatus:
    action: receive
    channel:
      $ref: '#/channels/browser'
    summary: >
      Lifecycle / control status for the live browser (attached, controlling,
      released, detached, idle, error).
    messages:
      - $ref: '#/channels/browser/messages/BrowserStatusFrame'

  receiveBrowserTabs:
    action: receive
    channel:
      $ref: '#/channels/browser'
    summary: >
      The current set of open tabs + the active index, broadcast on any tab
      open/close/switch/title-change. The SPA renders the tab strip; the live
      screencast always reflects the active tab. See ADR-041.
    messages:
      - $ref: '#/channels/browser/messages/BrowserTabsFrame'

  # ── Capture-ingest channel (FR-012) ─────────────────────────────────────────
  # Naming convention mirrors the chat/browser channels above, but "send"/
  # "receive" are from the encoder page's perspective (the client of this
  # channel), not the SPA's.

  sendBrowserIngestInit:
    action: send
    channel:
      $ref: '#/channels/browser-ingest'
    summary: >
      First frame on the capture-ingest connection: presents the per-stream
      capability token and announces the stream id + codec(s)/caps the
      encoder is about to produce. Rejected before any relay if the token is
      absent, invalid, or mis-scoped (FR-013, US-9/AC-1).
    messages:
      - $ref: '#/channels/browser-ingest/messages/BrowserIngestInitFrame'

  sendBrowserIngestChunk:
    action: send
    channel:
      $ref: '#/channels/browser-ingest'
    summary: >
      One encoded video or audio chunk (binary WS frame) from the encoder
      page's WebCodecs VideoEncoder/AudioEncoder, relayed by the gateway to
      attached viewers as browser_video_chunk/browser_audio_chunk. Oversize
      chunks are rejected and trigger an encoder step-down, never fragmented
      (FR-014, M-4).
    messages:
      - $ref: '#/channels/browser-ingest/messages/BrowserIngestChunkFrame'

  receiveBrowserFrameFeed:
    action: receive
    channel:
      $ref: '#/channels/browser-ingest'
    summary: >
      One CDP Page.startScreencast JPEG frame of the agent's tab, pushed by
      the gateway to the encoder page for createImageBitmap → VideoFrame →
      VideoEncoder processing (mechanism (b), FR-001/016).
    messages:
      - $ref: '#/channels/browser-ingest/messages/BrowserFrameFeedFrame'

components:
  messages:
    # ── Client → server messages ───────────────────────────────────────────────

    AuthFrame:
      name: AuthFrame
      title: auth
      summary: WebSocket authentication frame (client → server).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AuthFrame'

    MessageFrame:
      name: MessageFrame
      title: message
      summary: User chat message (client → server).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MessageFrame'

    CancelFrame:
      name: CancelFrame
      title: cancel
      summary: Cancel in-progress turn (client → server).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CancelFrame'

    PingFrame:
      name: PingFrame
      title: ping
      summary: Heartbeat keepalive (client → server).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PingFrame'

    AttachSessionFrame:
      name: AttachSessionFrame
      title: attach_session
      summary: Request session replay (client → server).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AttachSessionFrame'

    DevicePairingResponseFrame:
      name: DevicePairingResponseFrame
      title: device_pairing_response
      summary: Admin decision on device pairing request (client → server).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DevicePairingResponseFrame'

    SessionCloseFrame:
      name: SessionCloseFrame
      title: session_close
      summary: Explicit session close request (client → server).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SessionCloseFrame'

    WhatsAppPairingSubscribeFrame:
      name: WhatsAppPairingSubscribeFrame
      title: whatsapp_pairing_subscribe
      summary: Subscribe/unsubscribe this connection to a channel's pairing frames (client → server).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WhatsAppPairingSubscribeFrame'

    # ── Server → client messages ───────────────────────────────────────────────

    SessionStartedFrame:
      name: SessionStartedFrame
      title: session_started
      summary: New session minted (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SessionStartedFrame'

    TokenFrame:
      name: TokenFrame
      title: token
      summary: Partial LLM response token (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TokenFrame'

    DoneFrame:
      name: DoneFrame
      title: done
      summary: Turn complete (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DoneFrame'

    ErrorFrame:
      name: ErrorFrame
      title: error
      summary: Error notification (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ErrorFrame'

    ToolCallStartFrame:
      name: ToolCallStartFrame
      title: tool_call_start
      summary: Tool execution started (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ToolCallStartFrame'

    ToolCallResultFrame:
      name: ToolCallResultFrame
      title: tool_call_result
      summary: Tool execution completed (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ToolCallResultFrame'

    SubagentStartFrame:
      name: SubagentStartFrame
      title: subagent_start
      summary: Subagent span opened (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubagentStartFrame'

    SubagentEndFrame:
      name: SubagentEndFrame
      title: subagent_end
      summary: Subagent span closed (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubagentEndFrame'

    TaskStatusChangedFrame:
      name: TaskStatusChangedFrame
      title: task_status_changed
      summary: Task status updated (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TaskStatusChangedFrame'

    ReplayMessageFrame:
      name: ReplayMessageFrame
      title: replay_message
      summary: Replayed transcript entry (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReplayMessageFrame'

    ReplayErrorFrame:
      name: ReplayErrorFrame
      title: replay_error
      summary: >
        Replayed system-error transcript entry (server → client). Emitted by
        the replay path when the underlying TranscriptEntry is a system error
        (Status="error"). The SPA renders a typed error component based on
        the `kind` discriminant (rate_limit → rate-limit banner, error →
        generic error component) instead of falling back to a regular
        assistant message render (the previous bug).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReplayErrorFrame'

    RateLimitFrame:
      name: RateLimitFrame
      title: rate_limit
      summary: Rate limit applied (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RateLimitFrame'

    MediaFrame:
      name: MediaFrame
      title: media
      summary: Media attachments from a tool (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MediaFrame'

    AgentSwitchedFrame:
      name: AgentSwitchedFrame
      title: agent_switched
      summary: Active agent changed (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AgentSwitchedFrame'

    ToolApprovalRequiredFrame:
      name: ToolApprovalRequiredFrame
      title: tool_approval_required
      summary: Tool approval needed (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ToolApprovalRequiredFrame'

    SessionStateFrame:
      name: SessionStateFrame
      title: session_state
      summary: Reconnect approval state snapshot (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SessionStateFrame'

    SystemOverloadFrame:
      name: SystemOverloadFrame
      title: system_overload
      summary: System at capacity (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SystemOverloadFrame'

    ReplayWarningFrame:
      name: ReplayWarningFrame
      title: replay_warning
      summary: Duplicate tool_call_ids detected in transcript (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReplayWarningFrame'

    CancelStageFrame:
      name: CancelStageFrame
      title: cancel_stage
      summary: Cancel progress notification (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CancelStageFrame'

    PongFrame:
      name: PongFrame
      title: pong
      summary: Heartbeat pong response to a client PingFrame (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PongFrame'

    SessionCloseAckFrame:
      name: SessionCloseAckFrame
      title: session_close_ack
      summary: Session close acknowledged (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SessionCloseAckFrame'

    DevicePairingRequestFrame:
      name: DevicePairingRequestFrame
      title: device_pairing_request
      summary: Device pairing request (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DevicePairingRequestFrame'

    WhatsAppPairingFrame:
      name: WhatsAppPairingFrame
      title: whatsapp_pairing
      summary: WhatsApp pairing QR / status (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WhatsAppPairingFrame'

    NotificationFrame:
      name: NotificationFrame
      title: notification
      summary: A user notification raised live (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NotificationFrame'

    # ── Browser live channel (ADR-038) ─────────────────────────────────────────

    BrowserAttachFrame:
      name: BrowserAttachFrame
      title: browser_attach
      summary: Attach to a session's live browser and start the screencast (client → server).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BrowserAttachFrame'

    BrowserInputFrame:
      name: BrowserInputFrame
      title: browser_input
      summary: Inject a viewer input event into the live browser (client → server).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BrowserInputFrame'

    BrowserControlFrame:
      name: BrowserControlFrame
      title: browser_control
      summary: Take or release control of the live browser (client → server).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BrowserControlFrame'

    BrowserDetachFrame:
      name: BrowserDetachFrame
      title: browser_detach
      summary: Detach this viewer from the live browser (client → server).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BrowserDetachFrame'

    BrowserTabActionFrame:
      name: BrowserTabActionFrame
      title: browser_tab_action
      summary: Switch / close / open a tab in the live browser (client → server).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BrowserTabActionFrame'

    BrowserScreencastFrame:
      name: BrowserScreencastFrame
      title: browser_screencast
      summary: One CDP screencast frame of the live browser (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BrowserScreencastFrame'

    BrowserStreamInitFrame:
      name: BrowserStreamInitFrame
      title: browser_stream_init
      summary: >-
        Negotiated codec/resolution/keyframe-interval/audio-availability for
        this viewer's live-browser video stream (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BrowserStreamInitFrame'

    BrowserVideoChunkFrame:
      name: BrowserVideoChunkFrame
      title: browser_video_chunk
      summary: >-
        One encoded video chunk for the live browser (server → client,
        binary WS frame — compact envelope, no fragment field).
      contentType: application/octet-stream
      payload:
        $ref: '#/components/schemas/BrowserChunkEnvelope'

    BrowserAudioChunkFrame:
      name: BrowserAudioChunkFrame
      title: browser_audio_chunk
      summary: >-
        One encoded Opus audio chunk for the live browser (server → client,
        binary WS frame — same envelope shape as browser_video_chunk).
      contentType: application/octet-stream
      payload:
        $ref: '#/components/schemas/BrowserChunkEnvelope'

    BrowserStatusFrame:
      name: BrowserStatusFrame
      title: browser_status
      summary: Live browser lifecycle / control status (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BrowserStatusFrame'

    BrowserTabsFrame:
      name: BrowserTabsFrame
      title: browser_tabs
      summary: Current open tabs + active index for the live browser (server → client).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BrowserTabsFrame'

    # ── Capture-ingest channel messages (FR-012) ───────────────────────────────

    BrowserIngestInitFrame:
      name: BrowserIngestInitFrame
      title: browser_ingest_init
      summary: >-
        First frame on the capture-ingest connection: per-stream capability
        token + stream id + codec(s)/caps the encoder will produce
        (encoder page → gateway).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BrowserIngestInitFrame'

    BrowserIngestChunkFrame:
      name: BrowserIngestChunkFrame
      title: browser_ingest_chunk
      summary: >-
        One encoded video or audio chunk from the encoder page (encoder page
        → gateway, binary WS frame — same envelope as browser_video_chunk).
      contentType: application/octet-stream
      payload:
        $ref: '#/components/schemas/BrowserChunkEnvelope'

    BrowserFrameFeedFrame:
      name: BrowserFrameFeedFrame
      title: browser_frame_feed
      summary: >-
        One CDP screencast JPEG frame pushed to the encoder page for
        WebCodecs encoding (gateway → encoder page, binary WS frame).
      contentType: application/octet-stream
      payload:
        $ref: '#/components/schemas/BrowserFrameFeedEnvelope'

  schemas:
    WsFrameType:
      title: WsFrameType
      description: Enum of all WebSocket frame type discriminator strings.
      type: string
      enum:
        - auth
        - message
        - cancel
        - ping
        - attach_session
        - device_pairing_response
        - session_close
        - session_started
        - token
        - done
        - error
        - tool_call_start
        - tool_call_result
        - subagent_start
        - subagent_end
        - task_status_changed
        - replay_message
        - replay_error
        - rate_limit
        - media
        - agent_switched
        - tool_approval_required
        - session_state
        - system_overload
        - replay_warning
        - cancel_stage
        - pong
        - session_close_ack
        - device_pairing_request
        - whatsapp_pairing
        - whatsapp_pairing_subscribe
        - notification
        - browser_attach
        - browser_input
        - browser_control
        - browser_detach
        - browser_screencast
        - browser_stream_init
        - browser_status
        - browser_tab_action
        - browser_tabs
        - browser_ingest_init

    AuthFrame:
      title: AuthFrame
      description: Client → server authentication frame.
      type: object
      required:
        - type
        - token
      additionalProperties: false
      properties:
        type:
          type: string
          const: auth
        token:
          type: string
          minLength: 72
          maxLength: 81
          pattern: '^omnipus_([a-f0-9]{8}_)?[a-f0-9]{64}$'
          description: Bearer token from /api/v1/auth/login. Id-tagged "omnipus_<8hex>_<64hex>" (81) or legacy "omnipus_<64hex>" (72).

    MessageFrame:
      title: MessageFrame
      description: >
        Client → server user chat message. Omit session_id to start a new
        session; include to continue an existing one.
      type: object
      required:
        - type
        - content
      additionalProperties: false
      properties:
        type:
          type: string
          const: message
        content:
          type: string
          minLength: 1
          maxLength: 5242880
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        agent_id:
          type: string
          minLength: 1
          maxLength: 128
        media:
          type: array
          description: >
            Optional media:// refs for files the user attached to this message
            (e.g. images uploaded via POST /api/v1/upload). The server threads
            each ref into the LLM content array as a multimodal content block so
            the agent can see the attachment. Empty or omitted for text-only
            messages.
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 256
        metadata:
          type: object
          # additionalProperties: true — forward-compat. The metadata
          # object is the wire's extension channel (currently model_name,
          # but future fields like request_id, traceparent, etc. land
          # here). strict() would silently reject future fields and break
          # the SPA mid-rollout.
          additionalProperties: true
          description: >
            Optional per-message metadata. Phase 1 (FR-010) adds `model_name`:
            when the user picks a model in the chat composer, the picker
            value is sent as `metadata.model_name` so the server routes
            THIS turn to the chosen model. The server falls back to the
            agent's `model` config when this field is absent.
          properties:
            model_name:
              type: string
              minLength: 1
              maxLength: 256
              description: >
                Model identifier for this turn. Server honors when present,
                falls back to agent config otherwise. Empty string is
                treated as absent.
              example: "z-ai/glm-5-turbo"

    CancelFrame:
      title: CancelFrame
      description: Client → server cancel in-progress turn.
      type: object
      required:
        - type
        - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: cancel
        session_id:
          type: string
          minLength: 1
          maxLength: 128

    PingFrame:
      title: PingFrame
      description: Client → server heartbeat.
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: ping

    PongFrame:
      title: PongFrame
      description: >
        Server → client heartbeat acknowledgement. Emitted in response to every
        client PingFrame so the SPA's "any frame received recently" liveness
        check observes a server frame during idle and does not force-close after
        60 s of silence.
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: pong

    AttachSessionFrame:
      title: AttachSessionFrame
      description: >
        Client → server request to attach to an existing session.
        When `since` is provided, the server skips replay frames whose
        timestamp <= `since`, sending only frames the SPA has not yet seen.
        Omitting `since` requests a full replay (legacy behaviour).
      type: object
      required:
        - type
        - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: attach_session
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        since:
          type: string
          format: date-time
          description: >
            ISO 8601 timestamp of the most recent frame the SPA has already
            processed. Server replays only frames with timestamp > this value.
            Used to keep reconnect replay traffic O(missed window) instead of
            O(full session history).

    DevicePairingResponseFrame:
      title: DevicePairingResponseFrame
      description: Client → server device pairing decision.
      type: object
      required:
        - type
        - device_id
        - decision
      additionalProperties: false
      properties:
        type:
          type: string
          const: device_pairing_response
        device_id:
          type: string
          minLength: 1
        decision:
          type: string
          enum:
            - approve
            - reject

    SessionStartedFrame:
      title: SessionStartedFrame
      description: Server → client new session minted.
      type: object
      required:
        - type
        - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: session_started
        session_id:
          type: string
          minLength: 1
        agent_id:
          type: string

    TokenFrame:
      title: TokenFrame
      description: Server → client partial LLM response token.
      type: object
      required:
        - type
        - session_id
        - content
      additionalProperties: false
      properties:
        type:
          type: string
          const: token
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        content:
          type: string
          maxLength: 65536
        agent_id:
          type: string

    DoneStats:
      title: DoneStats
      description: >
        Per-turn statistics in a done frame. additionalProperties are allowed
        for replay extras (frames_emitted, orphan_count, etc.).
      type: object
      additionalProperties: true
      properties:
        tokens:
          type: number
          minimum: 0
        cost:
          type: number
          minimum: 0
        duration_ms:
          type: number
          minimum: 0
        tokens_dropped:
          type: number
          minimum: 0
        frames_emitted:
          type: number
          minimum: 0
        orphan_count:
          type: number
          minimum: 0
        duplicate_tool_call_id_count:
          type: number
          minimum: 0
        truncated_result_count:
          type: number
          minimum: 0
        replay_error:
          type: boolean
        turn_failed:
          type: boolean

    DoneFrame:
      title: DoneFrame
      description: Server → client turn complete.
      type: object
      required:
        - type
        - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: done
        session_id:
          type: string
          minLength: 1
        stats:
          $ref: '#/components/schemas/DoneStats'

    ErrorFrame:
      title: ErrorFrame
      description: Server → client error notification.
      type: object
      required:
        - type
        - message
      additionalProperties: false
      properties:
        type:
          type: string
          const: error
        session_id:
          type: string
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 4096

    ToolCallStartFrame:
      title: ToolCallStartFrame
      description: >
        Server → client tool execution started. params MUST be object (never null) —
        nil-safety contract to prevent Object.keys(params) crash.
      type: object
      required:
        - type
        - session_id
        - tool
        - call_id
        - params
      additionalProperties: false
      properties:
        type:
          type: string
          const: tool_call_start
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        tool:
          type: string
          minLength: 1
          maxLength: 128
        call_id:
          type: string
          minLength: 1
        params:
          type: object
          additionalProperties: true
          description: Tool arguments. Always object, never null.
        parent_call_id:
          type: string
        agent_id:
          type: string

    TruncatedResult:
      title: TruncatedResult
      description: Sentinel for tool results exceeding 1 MiB (FR-I-011).
      type: object
      required:
        - _truncated
        - original_size_bytes
        - preview
      additionalProperties: false
      properties:
        _truncated:
          type: boolean
          const: true
        original_size_bytes:
          type: integer
        preview:
          type: string

    MarshalErrorResult:
      title: MarshalErrorResult
      description: Sentinel for tool results that failed json.Marshal.
      type: object
      required:
        - _marshal_error
      additionalProperties: false
      properties:
        _marshal_error:
          type: string
          minLength: 1

    ToolResultRef:
      title: ToolResultRef
      description: >
        Sentinel for tool results > 50 KiB but <= 1 MiB whose full body is
        preserved server-side. SPA fetches via GET /api/v1/tool-results/{ref}.
      type: object
      required:
        - _ref
        - ref
        - original_size_bytes
        - preview
      additionalProperties: false
      properties:
        _ref:
          type: boolean
          const: true
        ref:
          type: string
          minLength: 1
          maxLength: 128
        original_size_bytes:
          type: integer
          minimum: 0
        preview:
          type: string

    DelegationFailure:
      title: DelegationFailure
      description: >
        Structured tool-result payload emitted in the `result` field of a
        tool_call_result frame (status="error") when a delegation tool
        (spawn / subagent / task_create) is denied by the delegation policy
        (trust set / mode / depth). The SPA matches on the fixed
        error="delegation_denied" discriminator and renders a distinct
        delegation-failure block — it does NOT rely on the LLM to narrate the
        denial. The frame's top-level `error` field carries the same `reason`.
      type: object
      required:
        - error
        - reason
        - policy
        - tool
      additionalProperties: false
      properties:
        error:
          type: string
          const: delegation_denied
          description: Fixed discriminator the SPA matches on.
        reason:
          type: string
          minLength: 1
          description: Human-readable explanation of the denial.
        policy:
          type: string
          enum:
            - trust_set
            - mode
            - depth
          description: >
            The delegation-policy axis that rejected the call. trust_set = target
            not in the caller's 'to' allowlist (or no permitted targets); mode =
            the delegation mode (await/background/task) is not permitted; depth =
            the delegation-chain depth cap was reached.
        tool:
          type: string
          minLength: 1
          description: The delegation tool that was denied (spawn / subagent / task_create).
        target_agent_id:
          type: string
          description: The requested delegation target, when one was named.

    ToolCallResultFrame:
      title: ToolCallResultFrame
      description: Server → client tool execution completed.
      type: object
      required:
        - type
        - session_id
        - tool
        - call_id
        - result
        - status
      additionalProperties: false
      properties:
        type:
          type: string
          const: tool_call_result
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        tool:
          type: string
          minLength: 1
          maxLength: 128
        call_id:
          type: string
          minLength: 1
        result:
          description: >
            Tool return value. Any JSON type or null (null is the contract for error frames).
            Sentinels TruncatedResult, MarshalErrorResult, and ToolResultRef are alternative shapes.
          oneOf:
            - type: ["object", "array", "string", "number", "boolean", "null"]
            - $ref: '#/components/schemas/TruncatedResult'
            - $ref: '#/components/schemas/MarshalErrorResult'
            - $ref: '#/components/schemas/ToolResultRef'
            - $ref: '#/components/schemas/DelegationFailure'
        status:
          type: string
          enum:
            - success
            - error
        duration_ms:
          type: integer
        error:
          type: string
        parent_call_id:
          type: string
        agent_id:
          type: string

    SubagentStartFrame:
      title: SubagentStartFrame
      description: Server → client subagent span opened (FR-H-004).
      type: object
      required:
        - type
        - session_id
        - span_id
        - parent_call_id
        - task_label
      additionalProperties: false
      properties:
        type:
          type: string
          const: subagent_start
        session_id:
          type: string
          minLength: 1
        span_id:
          type: string
          minLength: 1
        parent_call_id:
          type: string
          minLength: 1
        task_label:
          type: string
          maxLength: 100
        agent_id:
          type: string

    SubagentEndFrame:
      title: SubagentEndFrame
      description: >
        Server → client subagent span closed (FR-H-004). status MUST be one of
        the five allowed values — the SPA drops frames with invalid status (W4-6).
      type: object
      required:
        - type
        - session_id
        - span_id
        - status
      additionalProperties: false
      properties:
        type:
          type: string
          const: subagent_end
        session_id:
          type: string
          minLength: 1
        span_id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - success
            - error
            - cancelled
            - interrupted
            - timeout
        duration_ms:
          type: integer
        final_result:
          type: string
        reason:
          type: string
          enum:
            - parent_timeout
            - parent_cancelled
            - parent_done_early
            - unknown
        agent_id:
          type: string
        parent_call_id:
          type: string
        message:
          type: string

    TaskStatusChangedFrame:
      title: TaskStatusChangedFrame
      description: Server → client task status updated.
      type: object
      required:
        - type
        - session_id
        - task_id
        - status
      additionalProperties: false
      properties:
        type:
          type: string
          const: task_status_changed
        session_id:
          type: string
          minLength: 1
        task_id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - inbox
            - next
            - planning
            - in_progress
            - blocked
            - done
            - failed
        agent_id:
          type: string

    ReplayMessageFrame:
      title: ReplayMessageFrame
      description: Server → client replayed transcript entry.
      type: object
      required:
        - type
        - session_id
        - content
        - role
      additionalProperties: false
      properties:
        type:
          type: string
          const: replay_message
        session_id:
          type: string
          minLength: 1
        content:
          type: string
        role:
          type: string
          enum:
            - user
            - assistant
            - system
            - turn_canceled
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        agent_id:
          type: string
        model:
          type: string
          maxLength: 256
          description: >
            Model identifier that produced this assistant message (Phase 1B, FR-013/FR-014).
            Omitted for legacy entries written before per-turn model recording landed.
        turn_id:
          type: string
          description: >
            Turn-correlation identifier (from TranscriptEntry.TurnID), stamped on
            assistant entries and turn-cancellation entries. Lets the client match
            a replayed turn_canceled entry to the specific preceding assistant
            message it cancels, without relying on stream adjacency (async
            delegation can interleave other agents'/turns' frames in between).
            Omitted for legacy entries written before turn-id stamping landed.

    ReplayErrorFrame:
      title: ReplayErrorFrame
      description: >
        Server → client. Replay of a system-error transcript entry (Phase 1B,
        FR-014). The SPA renders this frame's `kind` discriminant to dispatch
        to the rate-limit banner or generic error component — without this
        typed frame the SPA previously rendered rate-limit text as a regular
        assistant message (Role="" fallback path).
      type: object
      required:
        - type
        - session_id
        - entry_id
        - timestamp
        - kind
        - message
      additionalProperties: false
      properties:
        type:
          type: string
          const: replay_error
        session_id:
          type: string
          minLength: 1
        entry_id:
          type: string
        timestamp:
          type: string
          format: date-time
        kind:
          type: string
          enum:
            - rate_limit
            - error
        message:
          type: string
        agent_id:
          type: string
        payload:
          type: object
          additionalProperties: false
          properties:
            retry_after_seconds:
              type: number
            policy_rule:
              type: string
            scope:
              type: string
            resource:
              type: string
            tool:
              type: string
            stage:
              type: string

    RateLimitFrame:
      title: RateLimitFrame
      description: Server → client rate limit applied (SEC-26).
      type: object
      required:
        - type
        - session_id
        - scope
        - resource
        - policy_rule
        - retry_after_seconds
      additionalProperties: false
      properties:
        type:
          type: string
          const: rate_limit
        session_id:
          type: string
        scope:
          type: string
          enum:
            - agent
            - channel
            - global
        resource:
          type: string
          minLength: 1
        policy_rule:
          type: string
          minLength: 1
        retry_after_seconds:
          type: number
          minimum: 0
        agent_id:
          type: string
        tool:
          type: string
          maxLength: 128

    MediaPart:
      title: MediaPart
      description: One media attachment.
      type: object
      required:
        - type
        - url
        - filename
        - content_type
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - image
            - audio
            - video
            - file
        url:
          type: string
          minLength: 1
        filename:
          type: string
          minLength: 1
        content_type:
          type: string
          minLength: 1
        caption:
          type: string

    MediaFrame:
      title: MediaFrame
      description: >
        Server → client media attachments. parts MUST be a non-empty array (never
        null) — nil-safety contract to prevent parts.map() crash.
      type: object
      required:
        - type
        - session_id
        - parts
      additionalProperties: false
      properties:
        type:
          type: string
          const: media
        session_id:
          type: string
          minLength: 1
        parts:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/MediaPart'

    AgentSwitchedFrame:
      title: AgentSwitchedFrame
      description: Server → client active agent changed.
      type: object
      required:
        - type
        - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: agent_switched
        session_id:
          type: string
          minLength: 1
        agent_id:
          type: string
        message:
          type: string

    ToolApprovalRequiredFrame:
      title: ToolApprovalRequiredFrame
      description: >
        Server → client tool approval needed (FR-011, FR-082).
        CRITICAL: args MUST be object (never null). Backend coerces nil → {}.
        SPA calls Object.keys(args) — null crashes at render time (Ava-chat bug).
      type: object
      required:
        - type
        - approval_id
        - tool_call_id
        - tool_name
        - args
        - agent_id
        - session_id
        - turn_id
        - expires_in_ms
      additionalProperties: false
      properties:
        type:
          type: string
          const: tool_approval_required
        approval_id:
          type: string
          minLength: 1
        tool_call_id:
          type: string
          minLength: 1
        tool_name:
          type: string
          minLength: 1
          maxLength: 128
        args:
          type: object
          additionalProperties: true
          description: >
            Tool invocation arguments. Always object, never null. Required +
            object type so the Phase 4 contract test catches any nil regression.
        agent_id:
          type: string
          minLength: 1
        session_id:
          type: string
          minLength: 1
        turn_id:
          type: string
          minLength: 1
        expires_in_ms:
          type: integer
          minimum: 0
          maximum: 86400000

    SessionStatePendingApproval:
      title: SessionStatePendingApproval
      description: One pending approval entry in a SessionStateFrame.
      type: object
      required:
        - approval_id
        - session_id
        - tool_name
        - agent_id
        - expires_in_ms
      additionalProperties: false
      properties:
        approval_id:
          type: string
          minLength: 1
        session_id:
          type: string
          minLength: 1
        tool_name:
          type: string
          minLength: 1
          maxLength: 128
        agent_id:
          type: string
          minLength: 1
        expires_in_ms:
          type: integer
          minimum: 0
          maximum: 86400000

    SessionStateFrame:
      title: SessionStateFrame
      description: >
        Server → client reconnect approval snapshot (FR-052, FR-073, FR-081).
        pending_approvals MUST be an array (never null). Backend coerces nil → [].
        SPA calls pending_approvals.map() — null crashes at render time.
      type: object
      required:
        - type
        - user_id
        - pending_approvals
        - emitted_at
      additionalProperties: false
      properties:
        type:
          type: string
          const: session_state
        user_id:
          type: string
        pending_approvals:
          type: array
          items:
            $ref: '#/components/schemas/SessionStatePendingApproval'
          maxItems: 1000
          description: Always array, never null. Capped at 1000.
        emitted_at:
          type: string
          format: date-time

    SystemOverloadFrame:
      title: SystemOverloadFrame
      description: Server → client system at capacity (FR-016, MAJ-009).
      type: object
      required:
        - type
        - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: system_overload
        session_id:
          type: string
          minLength: 1
        message:
          type: string

    ReplayWarningStats:
      title: ReplayWarningStats
      description: Diagnostic counters in a ReplayWarningFrame.
      type: object
      additionalProperties: true
      properties:
        duplicate_tool_call_id_count:
          type: integer

    ReplayWarningFrame:
      title: ReplayWarningFrame
      description: Server → client duplicate tool_call_ids detected.
      type: object
      required:
        - type
        - session_id
        - message
      additionalProperties: false
      properties:
        type:
          type: string
          const: replay_warning
        session_id:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        stats:
          $ref: '#/components/schemas/ReplayWarningStats'

    CancelStageFrame:
      title: CancelStageFrame
      description: >
        Server → client cancel progress notification (B3). stage MUST be one of
        three values — SPA validates via isValidFrame() and drops invalid stages.
      type: object
      required:
        - type
        - session_id
        - stage
      additionalProperties: false
      properties:
        type:
          type: string
          const: cancel_stage
        session_id:
          type: string
          minLength: 1
        stage:
          type: string
          enum:
            - graceful
            - hard
            - detached

    SessionCloseAckFrame:
      title: SessionCloseAckFrame
      description: Server → client session close acknowledged.
      type: object
      required:
        - type
        - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: session_close_ack
        session_id:
          type: string
          minLength: 1
        id:
          type: string

    DevicePairingRequestFrame:
      title: DevicePairingRequestFrame
      description: Server → client device pairing request needs admin approval.
      type: object
      required:
        - type
        - device_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: device_pairing_request
        device_id:
          type: string
          minLength: 1
        fingerprint:
          type: string
        pairing_code:
          type: string
        device_name:
          type: string
        session_id:
          type: string

    WhatsAppPairingFrame:
      title: WhatsAppPairingFrame
      description: >
        Server → client WhatsApp native/QR pairing update (QR code + live status)
        so the SPA can pair in-browser without the gateway terminal (#283).
      type: object
      required:
        - type
        - channel_id
        - status
      additionalProperties: false
      properties:
        type:
          type: string
          const: whatsapp_pairing
        channel_id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - waiting
            - code
            - linked
            - timeout
            - error
        qr:
          type: string
        message:
          type: string

    SessionCloseFrame:
      title: SessionCloseFrame
      description: Client → server explicit session close request.
      type: object
      required:
        - type
        - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: session_close
        session_id:
          type: string
          minLength: 1

    WhatsAppPairingSubscribeFrame:
      title: WhatsAppPairingSubscribeFrame
      description: >
        Client → server. Registers or clears this connection's interest in a
        channel's whatsapp_pairing frames so the QR is delivered only to the
        operator viewing that channel's pairing UI (#283).
      type: object
      required:
        - type
        - channel_id
        - active
      additionalProperties: false
      properties:
        type:
          type: string
          const: whatsapp_pairing_subscribe
        channel_id:
          type: string
          minLength: 1
        active:
          type: boolean

    NotificationFrame:
      title: NotificationFrame
      description: >
        Server → client. A notification raised for the recipient user (e.g. a
        scheduled run failed). Delivered only to that user's connections; the SPA
        adds it to the header notification center (#264).
      type: object
      required:
        - type
        - id
        - notification_type
        - title
        - severity
        - read
        - created_at_ms
      additionalProperties: false
      properties:
        type:
          type: string
          const: notification
        id:
          type: string
          minLength: 1
        notification_type:
          type: string
          enum:
            - schedule_failed
        title:
          type: string
          minLength: 1
        body:
          type: string
        severity:
          type: string
          enum:
            - info
            - warning
            - error
        read:
          type: boolean
        created_at_ms:
          type: integer
          format: int64
        schedule_id:
          type: string
        session_id:
          type: string
        agent_id:
          type: string

    # ── Browser live channel schemas (ADR-038) ─────────────────────────────────

    BrowserAttachFrame:
      title: BrowserAttachFrame
      description: >
        Client → server. Binds this browser-live WebSocket connection to a
        session's browser and starts the screencast. Per ADR-043 agents browse
        concurrently in isolated per-agent browser contexts within one shared
        Chrome; agent_id is the binding key (selects which agent's
        BrowserManager + browser context the live view attaches to), and
        session_id is correlation-only (the server binds to the active tab in
        that agent's context).
      type: object
      required:
        - type
        - session_id
        - agent_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_attach
        video_caps:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: >-
            Video codec strings this viewer's VideoDecoder.isConfigSupported
            reports as decodable (e.g. "avc1.4D401E", "vp8"), most-preferred
            first. Optional for wire-compat with clients that predate the
            video relay (treated as an empty array by the gateway); the SPA
            MUST send it once it advertises capabilities (FR-005). An
            empty/absent array means no video-capable codec is available; if
            it intersects no codec the active/negotiable encoder can produce,
            the viewer gets the unavailable state, never JPEG or an A1
            fallback (FR-006, US-5, US-6, DS-1).
        audio_caps:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: >-
            Audio codec strings this viewer's AudioDecoder.isConfigSupported
            reports as decodable (e.g. "opus"). Optional, same wire-compat
            rationale as video_caps. An empty/absent array means audio is
            silently unavailable to this viewer — video streams normally
            either way (FR-005, FR-011, US-4).
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        agent_id:
          type: string
          minLength: 1
          maxLength: 128

    BrowserInputFrame:
      title: BrowserInputFrame
      description: >
        Client → server. A viewer input event to inject into the live browser via
        CDP Input.dispatch*. Only honoured while the viewer holds control
        (browser_control action=take). Coordinates are device (CSS) pixels of the
        screencast frame.
      type: object
      required:
        - type
        - kind
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_input
        kind:
          type: string
          enum:
            - mouse_move
            - mouse_down
            - mouse_up
            - wheel
            - key_down
            - key_up
            - text
            - navigate
            - navigate_back
            - reload
        x:
          type: number
        y:
          type: number
        button:
          type: string
          enum:
            - none
            - left
            - middle
            - right
            - back
            - forward
        delta_x:
          type: number
        delta_y:
          type: number
        key:
          type: string
          maxLength: 64
        code:
          type: string
          maxLength: 64
        key_code:
          type: integer
          minimum: 0
          maximum: 255
          description: >-
            Windows virtual key code for key_down/key_up (DOM
            KeyboardEvent.keyCode) — required for CDP to perform editing/nav key
            actions and modifier shortcuts. See ADR-039.
        text:
          type: string
          maxLength: 8192
        modifiers:
          type: integer
          minimum: 0
          maximum: 15
        url:
          type: string
          maxLength: 2048

    BrowserControlFrame:
      title: BrowserControlFrame
      description: >
        Client → server. Take or release interactive control of the live browser.
        While a viewer holds control, the agent's own browser tools defer
        (cooperative turn-coordination, ADR-038 D6).
      type: object
      required:
        - type
        - action
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_control
        action:
          type: string
          enum:
            - take
            - release

    BrowserDetachFrame:
      title: BrowserDetachFrame
      description: >
        Client → server. Detach this viewer from the live browser; the server
        stops the screencast when the last viewer detaches. Sent when the panel
        closes.
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_detach
        session_id:
          type: string
          maxLength: 128

    BrowserScreencastFrame:
      title: BrowserScreencastFrame
      description: >
        Server → client. One CDP screencast frame (a JPEG snapshot of the live
        browser tab) plus the metadata needed to map viewer input coordinates back
        to the page. Screencast is repaint-driven, not fixed-FPS.
      type: object
      required:
        - type
        - session_id
        - seq
        - data
        - width
        - height
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_screencast
        session_id:
          type: string
          minLength: 1
        seq:
          type: integer
          minimum: 0
        data:
          type: string
          minLength: 1
          description: Base64-encoded JPEG image (no data URI prefix).
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        page_scale:
          type: number
        offset_top:
          type: number
        scroll_offset_x:
          type: number
        scroll_offset_y:
          type: number

    BrowserStreamInitFrame:
      title: BrowserStreamInitFrame
      description: >
        Server → client. Sent once, immediately before the first
        browser_video_chunk (and browser_audio_chunk, if has_audio),
        announcing the negotiated codec and encode parameters for this
        viewer's stream (FR-005, FR-006, US-6). A viewer MAY receive a fresh
        browser_stream_init if the stream is re-negotiated (e.g. after an
        encoder-page relaunch, CRIT-002) — the new values supersede the prior
        ones for this connection.
      type: object
      required:
        - type
        - codec
        - width
        - height
        - keyframe_interval
        - has_audio
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_stream_init
        session_id:
          type: string
          maxLength: 128
          description: >-
            Correlation-only, echoed back from the attach request (mirrors
            browser_status/browser_screencast). Does not select the stream.
        codec:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The negotiated video codec string for this stream's
            browser_video_chunk payloads, e.g. "avc1.4D401E" (H.264 main) or
            "vp8" (FR-006). A single active encoder serves one codec per
            source (v1, no ABR/multi-encode).
        width:
          type: integer
          minimum: 1
          description: Encoded video width in pixels.
        height:
          type: integer
          minimum: 1
          description: Encoded video height in pixels.
        keyframe_interval:
          type: integer
          minimum: 1
          description: >-
            Encoder GOP size: the number of encoded video frames between
            forced keyframes. The relay's own GOP cache bound is independent
            (FR-003).
        has_audio:
          type: boolean
          description: >-
            True if this stream also emits browser_audio_chunk (Opus) frames
            to this viewer; false if audio is unavailable/not negotiated —
            video streams normally either way (FR-011, US-4).

    BrowserChunkEnvelope:
      title: BrowserChunkEnvelope
      description: >
        Binary AsyncAPI message payload (contentType application/octet-stream,
        NOT JSON) shared by browser_video_chunk, browser_audio_chunk, and
        browser_ingest_chunk (FR-002, FR-011, FR-012, FR-017). Documents the
        logical field layout of the fixed compact envelope carried by each
        binary WebSocket message: a header of seq (u32), ts (u64), key (u8,
        boolean keyframe flag), kind (u8, 0=video/1=audio discriminator), len
        (u32), followed by exactly `len` trailing payload bytes. `kind` lets a
        single connection (in particular browser_ingest_chunk, which
        multiplexes video and audio over one ingest connection) distinguish
        the two without inspecting the payload; `payload` is always the raw
        codec bytes with no additional leading tag. Deliberately no fragment
        field (M-4): a chunk is always sent whole in one binary WS message. An
        ingest-leg chunk exceeding the endpoint's configured max-message bound
        (>= 2 MB default, FR-014) MUST be rejected outright rather than
        fragmented; a zero-length payload MUST also be rejected.
      type: object
      required:
        - seq
        - ts
        - key
        - kind
        - len
        - payload
      additionalProperties: false
      properties:
        seq:
          type: integer
          minimum: 0
          description: >-
            Monotonic chunk sequence number for this stream connection. Wire
            width u32 (wraps at 2^32-1).
        ts:
          type: integer
          minimum: 0
          description: >-
            Monotonic capture timestamp (milliseconds), injected source-side
            for glass-to-glass measurement (SC-002). Wire width u64 (R3/m-3) —
            beyond the JSON/JS safe-integer range; documented here, fixed-
            width binary on the wire, not JSON-parsed.
        key:
          type: boolean
          description: >-
            True when this chunk is a keyframe (encoded as a single byte, u8,
            on the wire: 1=keyframe, 0=delta). Video only — always false/0 for
            an audio chunk. A newly attached viewer's GOP replay always starts
            from the most recent key=true chunk (FR-003, FR-015).
        kind:
          type: integer
          minimum: 0
          maximum: 1
          description: >-
            Video/audio discriminator for this chunk (u8 wire width): 0 =
            video, 1 = audio. Lets browser_ingest_chunk multiplex both kinds
            over one connection, and lets every consumer of this shared
            envelope route a chunk without depending on which named message
            type carried it.
        len:
          type: integer
          minimum: 0
          description: >-
            Byte length of the trailing payload field (u32 wire width).
            Chunks whose actual payload exceeds the endpoint's configured
            bound are rejected, never fragmented (FR-014, M-4).
        payload:
          type: string
          format: binary
          description: >-
            The encoded chunk bytes: H.264/VP8 video or Opus audio, of length
            `len`. Framed as the trailing bytes of one binary WS message
            (FR-017) — never base64/JSON-embedded.

    BrowserFrameFeedEnvelope:
      title: BrowserFrameFeedEnvelope
      description: >
        Binary AsyncAPI message payload (contentType application/octet-stream,
        NOT JSON) for browser_frame_feed: one CDP Page.startScreencast JPEG
        frame of the agent's tab, pushed by the gateway down the authenticated
        loopback ingest connection to the encoder page for createImageBitmap →
        VideoFrame → VideoEncoder processing (FR-001, FR-016; mechanism (b)).
        Same fixed-header shape as BrowserChunkEnvelope minus the keyframe
        flag (every screencast frame is a complete JPEG still) — a header of
        seq (u32), ts (u64), len (u32), followed by exactly `len` trailing
        JPEG bytes. No fragment field (M-4).
      type: object
      required:
        - seq
        - ts
        - len
        - payload
      additionalProperties: false
      properties:
        seq:
          type: integer
          minimum: 0
          description: >-
            Monotonic screencast frame sequence number for this ingest
            connection. Wire width u32 (wraps at 2^32-1).
        ts:
          type: integer
          minimum: 0
          description: >-
            Monotonic capture timestamp (milliseconds) from the CDP
            screencast frame, carried through so the encoder page can
            preserve source timing when constructing VideoFrame instances.
            Wire width u64 (m-3) — beyond the JSON/JS safe-integer range.
        len:
          type: integer
          minimum: 0
          description: Byte length of the trailing payload field (u32 wire width).
        payload:
          type: string
          format: binary
          description: >-
            Raw JPEG bytes of the CDP screencast frame, of length `len`.
            Framed as the trailing bytes of one binary WS message.

    BrowserStatusFrame:
      title: BrowserStatusFrame
      description: >
        Server → client. Lifecycle / control status for the live browser
        connection. state=controlling means this viewer holds interactive control;
        released means control was dropped; error carries a human-readable message.
      type: object
      required:
        - type
        - state
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_status
        state:
          type: string
          enum:
            - attached
            - idle
            - controlling
            - released
            - detached
            - error
        message:
          type: string
          maxLength: 512
        controller:
          type: string
          maxLength: 128
        controlled_by_other:
          type: boolean
          description: >-
            Server-computed per-connection: true when some OTHER connection on
            this session holds interactive control. Keeps the docked panel and
            the pop-out window in agreement about who is driving.
        control_only:
          type: boolean
          description: >-
            True on a frame whose sole purpose is to update control-ownership on
            other viewers (take/release/detach) — carries no lifecycle/error
            meaning; the SPA applies only controlled_by_other and leaves its
            status/error banner untouched.
        session_id:
          type: string

    BrowserTabActionFrame:
      title: BrowserTabActionFrame
      description: >
        Client → server. A tab-management action on a live-browser session:
        switch the active tab, close a tab, or open a new (blank) tab. Honoured
        the same way as browser_input/browser_control — switch/close target the
        active browsing context's tab set. index is required for switch/close,
        ignored for open. See ADR-041.
      type: object
      required:
        - type
        - action
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_tab_action
        session_id:
          type: string
          maxLength: 128
        agent_id:
          type: string
          maxLength: 128
        action:
          type: string
          enum:
            - switch
            - close
            - open
        index:
          type: integer
          minimum: 0
          description: Tab index for switch/close (ignored for open).

    BrowserTabsFrame:
      title: BrowserTabsFrame
      description: >
        Server → client. The current set of open tabs for a live-browser session
        and which one is active, broadcast whenever a tab is opened (e.g. a
        target=_blank click or window.open the agent/user followed), closed,
        switched, or its title/url changes. The SPA renders this as the panel's
        tab strip; the live screencast always reflects the active tab. See
        ADR-041.
      type: object
      required:
        - type
        - tabs
        - active_index
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_tabs
        session_id:
          type: string
          maxLength: 128
        active_index:
          type: integer
          minimum: 0
          description: Index into tabs of the currently-active (screencasted) tab.
        tabs:
          type: array
          maxItems: 32
          items:
            type: object
            required:
              - index
            additionalProperties: false
            properties:
              index:
                type: integer
                minimum: 0
                description: >-
                  0-based position of this tab in the CURRENT tab list. NOT a
                  persistent identifier — indices shift down when an earlier tab
                  closes; always re-read from the latest browser_tabs /
                  browser_list_tabs before acting on a specific index.
              title:
                type: string
                maxLength: 512
                description: The tab's document.title, when known.
              url:
                type: string
                maxLength: 4096
                description: The tab's current URL, when known.
              active:
                type: boolean
                description: True for the active tab (mirrors active_index).

    # ── Capture-ingest channel schemas (FR-012) ────────────────────────────────

    BrowserIngestInitFrame:
      title: BrowserIngestInitFrame
      description: >
        Encoder-page → gateway. First frame sent on the loopback
        capture-ingest connection (/api/v1/browser/capture-ingest, FR-012),
        presenting the per-stream capability token (FR-013) and announcing
        the stream id plus the codec(s)/caps the encoder is about to produce.
        A connection presenting no, an invalid, or a mis-scoped token MUST be
        rejected before any chunk is relayed (US-9/AC-1, DS-4). This token is
        a distinct capability-token model, never a user bearer token — the
        encoder page holds no user credential.
      type: object
      required:
        - type
        - stream_id
        - token
        - video_codec
        - has_audio
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_ingest_init
        stream_id:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Unguessable per-stream key this connection is registering encoded
            chunks for (never the human tab title, FR-016). Mis-scoped or
            post-stream-end tokens for this id are rejected (DS-4).
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            The per-stream capability token minted by the gateway and
            delivered to the encoder page out-of-band via CDP
            addScriptToEvaluateOnNewDocument (FR-013) — never via URL.
            Stream-lifecycle-scoped with a single connection: invalidated
            when the stream ends, and NOT reusable for a same-token reconnect
            (a transient drop causes the gateway to re-mint a fresh token and
            relaunch the encoder page instead, CRIT-002).
        video_codec:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The video codec the encoder's WebCodecs VideoEncoder is
            configured to produce for this stream, e.g. "avc1.4D401E" (H.264
            main) or "vp8" (FR-006).
        has_audio:
          type: boolean
          description: >-
            True if the encoder will also emit browser_ingest_chunk carrying
            Opus audio (getUserMedia on the PulseAudio sink monitor, FR-023);
            false if this stream is video-only.
        audio_codec:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The audio codec the encoder's WebCodecs AudioEncoder is
            configured to produce, e.g. "opus". Present only when has_audio
            is true.
