    ErrorFrame:
      title: ErrorFrame
      description: 'Server → client. Error notification. May be global (no session_id, e.g., auth failure) or session-scoped.
        The SPA displays the message as a toast or inline error. Does NOT terminate the WebSocket connection.

        '
      type: object
      required:
      - type
      - message
      additionalProperties: false
      properties:
        type:
          type: string
          const: error
        session_id:
          type: string
          maxLength: 128
          description: 'Session this error relates to. Optional: global errors (auth, connection) are not tied to a specific
            session.

            '
        message:
          type: string
          minLength: 1
          maxLength: 4096
          description: Human-readable error description.
        payload:
          # Inline mirror of components.schemas.ErrorPayload
          # (contracts/components/schemas/ErrorPayload.yaml). Kept inline
          # because the Zod codegen evaluates schemas eagerly at module load
          # (Zod expressions, not lazy type aliases) — a $ref forward reference
          # trips a TDZ error in generated schemas.ts. The Go-side pointer fix
          # lives in asyncapi_types.gen.go (hand-adjusted Payload → *ErrorPayload
          # so omitempty works; search for the ADR-051 B2 comment there).
          type: object
          required:
          - llm_error
          additionalProperties: false
          properties:
            llm_error:
              $ref: '#/components/schemas/LLMError'
    ToolCallStartFrame:
      title: ToolCallStartFrame
      description: >
        Server → client tool execution started. params MUST be object (never null) —
        nil-safety contract to prevent Object.keys(params) crash. Session-scoped
        (registered in SESSION_SCOPED_FRAME_TYPES); class (a) per the ADR-057
        W5 audit (FR-089) — genuinely child-turn-produced.
      type: object
      required:
      - type
      - session_id
      - tool
      - call_id
      - params
      additionalProperties: false
      properties:
        type:
          type: string
          const: tool_call_start
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        tool:
          type: string
          minLength: 1
          maxLength: 128
        call_id:
          type: string
          minLength: 1
        params:
          type: object
          additionalProperties: true
          description: Tool arguments. Always object, never null.
        parent_call_id:
          type: string
        agent_id:
          type: string
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Present iff it differs from session_id.
            Class (a) (FR-089): the child turn's own session id when this
            frame crosses the wire from a delegated child.
    TruncatedResult:
      title: TruncatedResult
      description: Sentinel for tool results exceeding 1 MiB (FR-I-011).
      type: object
      required:
      - _truncated
      - original_size_bytes
      - preview
      additionalProperties: false
      properties:
        _truncated:
          type: boolean
          const: true
        original_size_bytes:
          type: integer
        preview:
          type: string
    MarshalErrorResult:
      title: MarshalErrorResult
      description: Sentinel for tool results that failed json.Marshal.
      type: object
      required:
      - _marshal_error
      additionalProperties: false
      properties:
        _marshal_error:
          type: string
          minLength: 1
    ToolResultRef:
      title: ToolResultRef
      description: 'Sentinel for tool results > 50 KiB but <= 1 MiB whose full body is preserved server-side. SPA fetches
        via GET /api/v1/tool-results/{ref}.

        '
      type: object
      required:
      - _ref
      - ref
      - original_size_bytes
      - preview
      additionalProperties: false
      properties:
        _ref:
          type: boolean
          const: true
        ref:
          type: string
          minLength: 1
          maxLength: 128
        original_size_bytes:
          type: integer
          minimum: 0
        preview:
          type: string
    DelegationFailure:
      title: DelegationFailure
      description: 'Structured tool-result payload emitted in the `result` field of a tool_call_result frame (status="error")
        when a delegation tool (spawn / subagent / task_create) is denied by the delegation policy (trust set / mode / depth).
        The SPA matches on the fixed error="delegation_denied" discriminator, but (policy 2026-07-16) only renders a distinct
        delegation-failure block in verbose chat or an ActivityPanel step context — the default thread presentation is the
        calling agent''s own narration of the denial, not a dedicated SPA-rendered block. The frame''s top-level `error` field
        carries the same `reason`.

        '
      type: object
      required:
      - error
      - reason
      - policy
      - tool
      additionalProperties: false
      properties:
        error:
          type: string
          const: delegation_denied
          description: Fixed discriminator the SPA matches on.
        reason:
          type: string
          minLength: 1
          description: Human-readable explanation of the denial.
        policy:
          type: string
          enum:
          - trust_set
          - mode
          - depth
          description: 'The delegation-policy axis that rejected the call. trust_set = target not in the caller''s ''to''
            allowlist (or no permitted targets); mode = the delegation mode (await/background/task) is not permitted; depth
            = the delegation-chain depth cap was reached.

            '
        tool:
          type: string
          minLength: 1
          description: The delegation tool that was denied (spawn / subagent / task_create).
        target_agent_id:
          type: string
          description: The requested delegation target, when one was named.
    FileExistsRefusal:
      title: FileExistsRefusal
      description: 'Structured tool-result payload emitted in the `result` field of a tool_call_result frame (status="error")
        when write_file refuses because the target path already exists and overwrite was not requested. This is a PRECONDITION
        REFUSAL, not an I/O failure: nothing went wrong, the file is simply already there. Before this existed the refusal
        was prose shaped exactly like a genuine write failure, so neither the calling agent nor the SPA could tell "a sibling
        already wrote this, no action needed" from "the write broke" without matching on wording. The calling agent reads
        the same JSON as its tool result (it is the tool''s ForLLM verbatim), which is the point — a Go-side field would be
        invisible to a language model. The frame''s top-level `error` field carries the same `reason`.

        '
      type: object
      required:
      - error
      - reason
      - tool
      - path
      additionalProperties: false
      properties:
        error:
          type: string
          const: file_exists
          description: Fixed discriminator distinguishing a precondition refusal from an I/O failure.
        reason:
          type: string
          minLength: 1
          description: Human-readable explanation, including how to proceed (set overwrite=true).
        tool:
          type: string
          minLength: 1
          description: The tool that refused (write_file).
        path:
          type: string
          minLength: 1
          description: The path that already exists, as the caller supplied it.
    PermissionDenied:
      title: PermissionDenied
      description: 'Structured tool-result payload emitted when a tool call is refused for permission reasons. TWO
        producers share this one shape and one discriminator (issue #618): pkg/agent''s tool-policy denial path
        (approval outcomes — user/timeout/saturated/policy_denied/no_approver_configured/... — and the headless
        ask-policy auto-deny) and pkg/tools'' filesystem-scope denial path (ResolvePath rejecting a path outside the
        effective scope, or on a protected carve-out). Before this schema existed, both producers hand-built this
        JSON with fmt.Sprintf''s %q verb, which is Go-string quoting, not JSON quoting, and silently produced invalid
        JSON for a path or approval-tool name containing invalid UTF-8 or a C0/C1 control byte outside \n\t\r.


        The two producers do NOT reach the SPA the same way. pkg/tools'' filesystem-scope producer
        (PermissionDeniedResult) writes this payload as the tool''s ForLLM verbatim, which flows through the normal
        tool_call_result frame (live) and the persisted ToolCall.Error field (replay) — parseStructuredToolFailure
        lifts `reason` into the frame''s top-level `error` field there, and the SPA can render it. pkg/agent''s
        tool-policy producer (denialPayloadJSON) embeds the SAME JSON shape as plain message content
        (providers.Message{Role:"tool"/"system"}) on a EventKindToolExecSkipped event, never inside a
        tool_call_result frame''s `result`; the persisted transcript entry for that denial
        (settleAskToolCallTranscript) records status "denied" with a boolean `Result["error"]=true`, not this typed
        payload, and leaves ToolCall.Error empty. parseStructuredToolFailure is therefore never invoked on the
        tool-policy producer''s bytes — that path is LLM-facing only today; no SPA rendering claim should be made for
        it without a corresponding code change.

        '
      type: object
      required:
      - error
      - message
      - tool
      - reason
      - permanent
      additionalProperties: false
      properties:
        error:
          type: string
          const: permission_denied
          description: Fixed discriminator the SPA matches on.
        message:
          type: string
          minLength: 1
          description: Model-facing guidance on how to proceed (e.g. "do not retry; stop and report the blocker").
        tool:
          type: string
          minLength: 1
          description: The tool call that was denied.
        reason:
          type: string
          minLength: 1
          description: 'The denial reason: an approval-flow reason code (user / timeout / saturated / policy_denied /
            ...) for a tool-policy denial, or the filesystem-scope classification error''s message (e.g. "access denied:
            path is outside the effective filesystem scope") for a ResolvePath denial.

            '
        permanent:
          type: boolean
          description: 'Whether the model should treat this denial as terminal for the rest of the turn. True for
            essentially every reason; false only for the transient "saturated" approval-queue condition, which may
            succeed on a later retry within the same turn. A filesystem-scope denial is always true — the same path
            against the same effective scope fails identically on retry.

            '
    ToolAssemblyDuplicate:
      title: ToolAssemblyDuplicate
      description: 'Structured payload emitted (as message content, role="system", with no ToolCallID) when
        pkg/agent/loop.go''s tool-call dedup invariant guard (checkToolDedupInvariant) finds the assembled tools[]
        list is not name-unique right before an LLM call, and aborts the turn rather than feeding the LLM a
        malformed tool list. Before this schema existed the payload was hand-built with fmt.Sprintf''s %q verb (the
        same defect PermissionDenied fixes — see its description) and carried no contract schema, no allow-list
        entry, and no length budget at all (issue #618, the fourth ungoverned member).


        ADR-060 D2/D3: this is a `message`-channel payload — it is appended directly to session history and never
        becomes a tool_call_result frame, so parseStructuredToolFailure can never be invoked on it and it has no
        SPA detector, BY DESIGN, not as a gap. It is admitted to this file''s `oneOf` and to
        pkg/gateway/tool_result_store.go''s structuredFailureDiscriminators allow-list anyway (ADR-060 §7 item 3,
        "defensive over-provisioning"): the allow-list entry is what enrolls it in the coverage test''s
        schema-and-budget assertions, and the `oneOf` entry keeps the union a complete catalogue of the family even
        though this member can never actually arrive in a ToolCallResultFrame.result. It is LLM-facing only.

        '
      type: object
      required:
      - error
      - message
      additionalProperties: false
      properties:
        error:
          type: string
          const: tool_assembly_duplicate
          description: Fixed discriminator identifying this payload family. Unlike its siblings, this one is never
            delivered via ToolCallResultFrame.result, so the SPA has no matcher for it — see the schema description.
        message:
          type: string
          minLength: 1
          description: Human-readable explanation of the duplicate tool-assembly refusal.
    ToolArgumentRefusal:
      title: ToolArgumentRefusal
      description: >
        ADR-066 D4 / spec FR-016 (T066-01 schema, T066-04 producer): structured tool-result payload returned
        INSTEAD of executing a tool call whose serialised arguments exceed the builtin success cap
        (ContextSettings.builtin_success_cap, 64,000 chars by default). The tool does not run, the turn is not
        fatal, and the model sees the refusal — naming the tool, the size it sent and the cap — so it can retry
        smaller. ADR-060 family member: inline schema with a const `error` discriminator, one exported *Code
        constant in pkg/tools/result.go, a single producer routed through marshalWithinBudget, and an entry in
        scripts/check-no-handwritten-wire-types.sh's KNOWN_STRUCTURED_FAILURE_DISCRIMINATORS register.


        toolResult-channel (ADR-060 D2): the refusal IS the tool's result, so it passes the D4 choke point like
        any other result (US-5.AC3) and flows through ToolCallResultFrame.result live and ToolCall.Error on
        replay — hence its entry in ToolCallResultFrame.result's oneOf below and in
        pkg/gateway/tool_result_store.go's allow-list (derived from pkg/tools.AllStructuredFailureCodes()). The
        SPA detector is stream B5's.
      type: object
      required:
      - error
      - reason
      - tool
      - size_chars
      - cap_chars
      additionalProperties: false
      properties:
        error:
          type: string
          const: tool_arguments_too_large
          description: Fixed discriminator the SPA and the gateway allow-list match on.
        reason:
          type: string
          minLength: 1
          description: Human-readable explanation naming the tool, the serialised size and the cap, and telling
            the model to retry with smaller arguments. The one field marshalWithinBudget may shrink.
        tool:
          type: string
          minLength: 1
          maxLength: 128
          description: The tool whose call was refused, as the model named it.
        size_chars:
          type: integer
          minimum: 1
          description: Length in characters of the serialised arguments the model sent.
        cap_chars:
          type: integer
          minimum: 1
          description: The cap the arguments exceeded — the live builtin success cap at the time of the call
            (quoted so a retry can target it; the cap is operator-editable without restart).
    ToolResultRecallMark:
      title: ToolResultRecallMark
      description: >
        ADR-066 D5 (and D4, which shares it) / spec FR-018 (T066-01 schema, T066-04 producer): the short
        deterministic mark that REPLACES a tool result's content in the model's window when the result is
        emptied in place (content_state=emptied) or admitted head-and-tail capped (content_state=capped). The
        archive keeps the full content; recall_conversation(tool_call_id=…, archive_line=…) returns it in pages.
        One schema, one producer (pkg/agent/recall_mark.go via pkg/tools' marshalWithinBudget), two states —
        the model gets one vocabulary for "this was bigger than what you see" (ADR-066 §5).


        ADR-060 family member: inline schema, const `error` discriminator, *Code constant, register entry. It is
        NOT a failure — `error` is the family's discriminator key, nothing more; the tool call succeeded and
        ToolResult.IsError stays false. Channel (ADR-060 D2): the mark lives in the in-memory window (the
        providers.Message the LLM reads) and reaches the SPA as ToolResultProjectionFrame.mark (string) and, for
        a D4-capped result, inside the capped tool_call_result text — so its oneOf entry below is defensive
        over-provisioning on the ToolAssemblyDuplicate precedent (ADR-060 §7 item 3), keeping the union a
        complete catalogue of the family. Rendered in the chat thread only under Verbose chat (ADR-066 §12).
      type: object
      required:
      - error
      - tool
      - tool_call_id
      - archive_line
      - size_chars
      - turn
      - content_state
      - hint
      additionalProperties: false
      properties:
        error:
          type: string
          const: tool_result_recall_mark
          description: Fixed discriminator identifying this payload family. Not a failure — see the schema
            description.
        tool:
          type: string
          minLength: 1
          maxLength: 64
          description: Tool name, sanitised by the producer to at most 64 printable characters (FR-018).
        tool_call_id:
          type: string
          minLength: 1
          maxLength: 64
          description: The result's tool_call_id, sanitised the same way. Provider-generated ids are not unique
            across an archive — pair with archive_line, exactly as ToolResultProjectionFrame does.
        archive_line:
          type: integer
          minimum: 0
          description: Zero-based index of the tool-result line in the session archive; with tool_call_id it is
            the key recall_conversation and the meta projection state both use.
        size_chars:
          type: integer
          minimum: 1
          description: Length in characters of the full result as written to the archive.
        turn:
          type: integer
          minimum: 1
          description: Turn number = 1 + the count of role:user archive lines preceding the result's line — the
            same number recall_conversation's turn_range mode addresses.
        content_state:
          type: string
          enum:
          - capped
          - emptied
          description: Which projection the mark stands in for. `full` is never a mark (it is
            ToolCall.content_state's default and only ever read from the transcript).
        hint:
          type: string
          minLength: 1
          description: The recall hint — the literal recall_conversation call (tool_call_id + archive_line) that
            returns the content in pages. The one field marshalWithinBudget may shrink.
    ToolCallResultFrame:
      title: ToolCallResultFrame
      description: >
        Server → client tool execution completed. Session-scoped
        (registered in SESSION_SCOPED_FRAME_TYPES); class (a) per the
        ADR-057 W5 audit (FR-089) — genuinely child-turn-produced.
      type: object
      required:
      - type
      - session_id
      - tool
      - call_id
      - result
      - status
      additionalProperties: false
      properties:
        type:
          type: string
          const: tool_call_result
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        tool:
          type: string
          minLength: 1
          maxLength: 128
        call_id:
          type: string
          minLength: 1
        result:
          description: 'Tool return value. Any JSON type or null (null is the contract for error frames). Sentinels TruncatedResult,
            MarshalErrorResult, and ToolResultRef are alternative shapes.


            Real oneOf (round-2 hardening, ADR-060 finding F1). The previous revision switched this to `anyOf`
            reasoning that branch 1''s permissive `type: [object, array, ...]` already matched every object, so a
            genuine oneOf would double-match every $ref sentinel/family member against its own union. That
            diagnosis was correct but `anyOf` was the wrong fix: under `anyOf` nothing is ever rejected, including a
            malformed PermissionDenied missing `permanent` — the seven $refs below became unreachable as
            constraints, which nullifies ADR-060 §7 item 2''s own rationale for admitting new members ("when the
            union is ever made executable, a member missing from it would be the silent-drop failure ADR-058 §7
            item 4 warned about" — an anyOf over a universal branch can never be made executable).

            Fixed here with a real `oneOf`: the single permissive branch is split into (a) an unconditional
            non-object catch-all (array/string/number/boolean/null — the JSON Schema `required` keyword is
            inapplicable to non-object instances, so no exclusion is needed there) and (b) an object catch-all that
            excludes every reserved discriminator key the nine $refs below use (seven at ADR-060 time; ADR-066 T066-01 added ToolArgumentRefusal and ToolResultRecallMark) — `_truncated`, `_marshal_error`,
            `_ref`, `error` — via `not: {anyOf: [{required: [...]}, ...]}`. With that split, exactly one branch
            matches a plain scalar/array/object and exactly one matches a valid named shape; a payload carrying a
            reserved key but failing its own $ref (e.g. PermissionDenied missing `permanent`) matches none and is
            correctly rejected, rather than silently passing through branch (b). ADR-034''s external-file-$ref
            constraint does not block this — these are internal `#/components/schemas/...` refs (D4).

            Verified by compiling this exact file with santhosh-tekuri/jsonschema/v6:
            pkg/api/generated/contract_test.go wraps one fixture per family member in a real ToolCallResultFrame and
            validates it end-to-end; pkg/gateway/structured_failure_discriminator_coverage_test.go validates each
            producer''s output standalone and asserts a malformed member is rejected.

            F13 follow-up hardening: the object catch-all''s `error` exclusion below now keys on `error` being a
            STRING, not merely present — see that branch''s own description for why (settleAskToolCallTranscript /
            spawnSubTurn persist a boolean `error` flag on an ordinary object, which is not an attempt at any of the
            four `error`-keyed $refs and must still match the catch-all). Regression fixture:
            pkg/api/generated/tool_call_result_error_key_contract_test.go.

            Still documentary in the generated artifacts (ADR-060 D6): the asyncapi->Go converter
            (scripts/gen-asyncapi-go) and the TS/Zod generator both key off "is this schema a oneOf/anyOf with no
            top-level type", which is unchanged by this edit — TS still emits `result: z.unknown()`, Go still emits
            `Result any`. So this is a spec-correctness fix (the union now actually constrains what a conformant
            producer may emit) with no generated-code behavior change; the hand-written detectors
            (isPermissionDenied and friends) remain the real enforcement at the SPA read boundary.

            '
          oneOf:
          - type:
            - array
            - string
            - number
            - boolean
            - 'null'
            description: Catch-all for a non-object tool result. Unconditional — the `required` keyword used
              by the object catch-all's exclusion below does not apply to non-object instances, so no reserved-key
              exclusion is needed on this branch.
          - type: object
            not:
              anyOf:
              - required:
                - _truncated
              - required:
                - _marshal_error
              - required:
                - _ref
              - required:
                - error
                properties:
                  error:
                    type: string
            description: 'Catch-all for an ordinary object tool result carrying none of the nine $refs'' reserved
              discriminator keys (_truncated, _marshal_error, _ref, error) below.


              The `error` exclusion is keyed on `error` being a STRING (F13 hardening) — matching the
              const-string discriminator every one of the six `error`-keyed $refs below actually uses
              (DelegationFailure, FileExistsRefusal, PermissionDenied, ToolAssemblyDuplicate) — not merely on
              `error` being present. `error` is not a reserved key in practice: pkg/agent/approval_transcript.go''s
              settleAskToolCallTranscript and pkg/agent/subturn.go''s spawnSubTurn both persist plain
              map[string]any results carrying a BOOLEAN `"error": true` flag (alongside `text`/`reason`/`permanent`),
              which is a legitimate ordinary object, not an attempted use of any of the six typed discriminator
              shapes. Excluding on bare presence of `error` made every such object match NO branch of this oneOf
              (excluded from the catch-all, but not shaped like any $ref), so a replayed denied-approval or
              failed-delegation frame was unconditionally schema-invalid. Keying the exclusion on `error` being a
              string lets a boolean-error object fall through to this catch-all (valid, matches only this branch)
              while a string-`error` object still gets checked against the six typed $refs as before (matches
              this branch only if it also fails every $ref, which is correctly rejected as malformed).

              '
          - $ref: '#/components/schemas/TruncatedResult'
          - $ref: '#/components/schemas/MarshalErrorResult'
          - $ref: '#/components/schemas/ToolResultRef'
          - $ref: '#/components/schemas/DelegationFailure'
          - $ref: '#/components/schemas/FileExistsRefusal'
          - $ref: '#/components/schemas/PermissionDenied'
          - $ref: '#/components/schemas/ToolAssemblyDuplicate'
          - $ref: '#/components/schemas/ToolArgumentRefusal'
          - $ref: '#/components/schemas/ToolResultRecallMark'
        status:
          type: string
          enum:
          - success
          - error
        duration_ms:
          type: integer
        error:
          type: string
        parent_call_id:
          type: string
        agent_id:
          type: string
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Present iff it differs from session_id.
            Class (a) (FR-089): the child turn's own session id when this
            frame crosses the wire from a delegated child.
    SubagentStartFrame:
      title: SubagentStartFrame
      description: >
        Server → client subagent span opened (FR-H-004). Session-scoped
        (registered in SESSION_SCOPED_FRAME_TYPES); class (b) per the
        ADR-057 W5 audit (FR-089) — emitted by the PARENT about the child
        (pkg/agent/subturn.go); FR-017 pins its SessionID to the routing
        key, so producing_session_id would equal session_id and is
        therefore absent (FR-013's "iff it differs").
      type: object
      required:
      - type
      - session_id
      - span_id
      - parent_call_id
      - task_label
      additionalProperties: false
      properties:
        type:
          type: string
          const: subagent_start
        session_id:
          type: string
          minLength: 1
        span_id:
          type: string
          minLength: 1
        parent_call_id:
          type: string
          minLength: 1
        task_label:
          type: string
          maxLength: 100
        agent_id:
          type: string
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Present iff it differs from session_id.
            Class (b) (FR-089): absent for this frame type — producing ==
            routing by construction (FR-017).
    SubagentEndFrame:
      title: SubagentEndFrame
      description: >
        Server → client subagent span closed (FR-H-004). status MUST be one of
        the six allowed values — the SPA drops frames with invalid status (W4-6).
        Session-scoped (registered in SESSION_SCOPED_FRAME_TYPES); class (b)
        per the ADR-057 W5 audit (FR-089) — emitted by the PARENT about the
        child (pkg/agent/subturn.go); FR-017 pins its SessionID to the
        routing key, so producing_session_id would equal session_id and is
        therefore absent (FR-013's "iff it differs"). Kept in sync by hand
        with components/schemas/SubagentEndFrame.yaml for the full shape —
        see that file for the per-value description (including "parked",
        ADR-057 UAT defect C2 fix).
      type: object
      required:
      - type
      - session_id
      - span_id
      - status
      additionalProperties: false
      properties:
        type:
          type: string
          const: subagent_end
        session_id:
          type: string
          minLength: 1
        span_id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - success
            - error
            - cancelled
            - interrupted
            - timeout
            - parked
        duration_ms:
          type: integer
        final_result:
          type: string
        reason:
          type: string
          enum:
          - parent_timeout
          - parent_cancelled
          - parent_done_early
          - unknown
        agent_id:
          type: string
        parent_call_id:
          type: string
        message:
          type: string
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Present iff it differs from session_id.
            Class (b) (FR-089): absent for this frame type — producing ==
            routing by construction (FR-017).
    SubagentMessageFrame:
      title: SubagentMessageFrame
      description: >
        Server → client (ADR-053 §Contract Surface — "Mid-span subagent
        frames"). A flat, UI-facing PROJECTION of the underlying
        SessionMessage riding between subagent_start/subagent_end — see
        components/schemas/SubagentMessageFrame.yaml for the full shape-
        decision rationale (why this is not a full embedded SessionMessage
        oneOf). Canonical copy — keep in sync by hand.
      type: object
      required:
        - type
        - session_id
        - span_id
        - message_id
        - kind
        - sender_identity
        - untrusted_origin
        - created_at
      additionalProperties: false
      properties:
        type:
          type: string
          const: subagent_message
        session_id:
          type: string
          minLength: 1
        span_id:
          type: string
          minLength: 1
        message_id:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - progress
            - checkpoint
            - artifact
            - blocker
            - question
            - decision_request
            - error
            - handback
            - steer
            - respond
        text:
          type: string
        pct:
          type: integer
          minimum: 0
          maximum: 100
        correlation_id:
          type: string
        sender_identity:
          type: string
          minLength: 1
        untrusted_origin:
          type: boolean
        created_at:
          type: string
          format: date-time

    SubagentStateFrame:
      title: SubagentStateFrame
      description: >
        Server → client (ADR-053 §Contract Surface — "Mid-span subagent
        frames"). A flat projection of SessionLifecycleRecord.state riding
        between subagent_start/subagent_end, plus an optional steering-
        receipt. Canonical copy — keep in sync by hand.
      type: object
      required:
        - type
        - session_id
        - span_id
        - state
        - created_at
      additionalProperties: false
      properties:
        type:
          type: string
          const: subagent_state
        session_id:
          type: string
          minLength: 1
        span_id:
          type: string
          minLength: 1
        state:
          type: string
          enum:
            - queued
            - running
            - needs_input
            - paused
            - completed
            - failed
            - cancelled
            - timed_out
        steering_receipt:
          type: object
          nullable: true
          required:
            - correlation_id
            - applied_at
          additionalProperties: false
          properties:
            correlation_id:
              type: string
            applied_at:
              type: string
              format: date-time
        created_at:
          type: string
          format: date-time
    TaskStatusChangedFrame:
      title: TaskStatusChangedFrame
      description: >
        Server → client task status updated. Session-scoped (registered in
        SESSION_SCOPED_FRAME_TYPES); class not yet assigned by the ADR-057
        W5 audit (FR-089) — do not assume presence or absence of
        producing_session_id for this type until the audit classifies it.
      type: object
      required:
      - type
      - session_id
      - task_id
      - status
      additionalProperties: false
      properties:
        type:
          type: string
          const: task_status_changed
        session_id:
          type: string
          minLength: 1
        task_id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - inbox
            - next
            - in_progress
            - blocked
            - done
            - failed
        agent_id:
          type: string
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Class not yet assigned by the W5 audit
            (FR-089) — see TaskStatusChangedFrame's description.
    TaskRunStatusFrame:
      title: TaskRunStatusFrame
      description: 'Server → client task RUN status updated (open or close). Additive alongside TaskStatusChangedFrame (ADR-050
        / task-run-history-spec §3.8) — emitted at run open and close so the calendar''s per-occurrence chip can update live
        without a full refetch.

        '
      type: object
      required:
      - type
      - task_id
      - run_id
      - status
      additionalProperties: false
      properties:
        type:
          type: string
          const: task_run_status
        task_id:
          type: string
          minLength: 1
        run_id:
          type: string
          minLength: 1
        occurrence_ms:
          type: integer
          format: int64
          nullable: true
          description: 'The scheduled RRULE instant this run realizes (the calendar join key). Null for an ad-hoc/once/manual
            run.

            '
        status:
          type: string
          enum:
          - in_progress
          - done
          - failed
          - skipped
    ReplayMessageFrame:
      title: ReplayMessageFrame
      description: >
        Server → client replayed transcript entry. Session-scoped
        (registered in SESSION_SCOPED_FRAME_TYPES); class (b) per the
        ADR-057 W5 audit (FR-089) — emitted by the gateway replay path,
        not by a turn, so producing_session_id is absent (FR-013).
      type: object
      required:
      - type
      - session_id
      - content
      - role
      additionalProperties: false
      properties:
        type:
          type: string
          const: replay_message
        session_id:
          type: string
          minLength: 1
        content:
          type: string
        role:
          type: string
          enum:
          - user
          - assistant
          - system
          - turn_canceled
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        agent_id:
          type: string
        model:
          type: string
          maxLength: 256
          description: 'Model identifier that produced this assistant message (Phase 1B, FR-013/FR-014). Omitted for legacy
            entries written before per-turn model recording landed.

            '
        turn_id:
          type: string
          description: 'Turn-correlation identifier (from TranscriptEntry.TurnID), stamped on assistant entries and turn-cancellation
            entries. Lets the client match a replayed turn_canceled entry to the specific preceding assistant message it cancels,
            without relying on stream adjacency (async delegation can interleave other agents''/turns'' frames in between).
            Omitted for legacy entries written before turn-id stamping landed.
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Present iff it differs from session_id.
            Class (b) (FR-089): absent for this frame type — emitted by the
            gateway replay path, not by a turn.

            '
    ReplayErrorFrame:
      title: ReplayErrorFrame
      description: 'Server → client. Replay of a system-error transcript entry (Phase 1B, FR-014). Emitted by the replay path
        when the server encounters a TranscriptEntry with Type=system AND Status="error" — produced by appendErrorTranscript
        for rate-limit denials (kind=rate_limit) and provider LLM call failures (kind=error).

        The SPA uses this frame''s `kind` discriminant to render the rate-limit-denial component or the generic error component
        instead of falling back to the default "assistant" bubble render path. Without this typed frame, replay treats the
        entry as a normal assistant message (the previous bug — empty Role falls back to "assistant" via ReplayMessageFrame.Role,
        so the SPA renders rate-limit text as a regular assistant message).

        '
      type: object
      required:
      - type
      - session_id
      - entry_id
      - timestamp
      - kind
      - message
      additionalProperties: false
      properties:
        type:
          type: string
          const: replay_error
        session_id:
          type: string
          minLength: 1
          description: Session being replayed.
        entry_id:
          type: string
          description: 'Server-assigned transcript entry ID. Matches TranscriptEntry.ID from the JSONL partition so the SPA
            can dedup against live entries on WS reconnect.

            '
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the original error event.
        kind:
          type: string
          enum:
          - rate_limit
          - error
          description: 'Error category. The SPA renders a different component per kind: "rate_limit" → rate-limit-denial banner
            with retry-after countdown, "error" → generic error component. Add new kinds here as new error categories are
            introduced (the enum keeps the wire contract tight).

            '
        message:
          type: string
          minLength: 1
          maxLength: 4096
          description: 'Human-readable error description (the same text previously written to TranscriptEntry.Content). Kept
            verbatim for backward compat with the existing replay_message rendering path.

            '
        agent_id:
          type: string
          description: Agent that was active when the error fired.
        payload:
          # Inline mirror of components.schemas.ReplayErrorPayload
          # (contracts/components/schemas/ReplayErrorPayload.yaml). Kept inline
          # because the Zod codegen evaluates schemas eagerly at module load
          # (Zod expressions, not lazy type aliases) — a $ref forward reference
          # trips a TDZ error in generated schemas.ts. The Go-side pointer fix
          # lives in asyncapi_types.gen.go (hand-adjusted Payload →
          # *ReplayErrorPayload so omitempty works; search for the ADR-051 B2
          # comment there).
          type: object
          required:
          - llm_error
          additionalProperties: false
          properties:
            llm_error:
              $ref: '#/components/schemas/LLMErrorReplay'
    ToolResultProjectionFrame:
      title: ToolResultProjectionFrame
      description: >
        Server → client (ADR-066 D5): a tool result already delivered to this
        session was capped or emptied in place in the model's window. The archive
        keeps the full content; the SPA updates its rendering of the matching
        tool call (recall mark shown only under Verbose chat) and, on reload,
        learns the same state from ToolCall.content_state on the transcript.
        Session-scoped (registered in SESSION_SCOPED_FRAME_TYPES).
        Canonical copy — keep in sync by hand with
        components/schemas/ToolResultProjectionFrame.yaml.
      type: object
      required:
      - type
      - session_id
      - tool_call_id
      - archive_line
      - content_state
      additionalProperties: false
      properties:
        type:
          type: string
          const: tool_result_projection
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        tool_call_id:
          type: string
          minLength: 1
          description: The projected tool call. Provider-generated ids are not unique across an archive — pair with archive_line.
        archive_line:
          type: integer
          minimum: 0
          description: Zero-based index of the tool-result line in the session archive; together with tool_call_id it keys the projection state.
        content_state:
          type: string
          enum:
          - capped
          - emptied
          description: The new projection state. "full" is never pushed — it is the default state and is only ever read from the transcript.
        mark:
          type: string
          maxLength: 2048
          description: The recall mark left in the window (names the tool, the id and the recall_conversation call that restores it). Rendered only under Verbose chat.
        producing_session_id:
          type: string
          minLength: 1
          description: ADR-057 FR-012/FR-013 — present iff the projection was produced by a delegated child session different from session_id.
    RateLimitFrame:
      title: RateLimitFrame
      description: >
        Server → client rate limit applied (SEC-26). Session-scoped
        (registered in SESSION_SCOPED_FRAME_TYPES); class (c) per the
        ADR-057 W5 audit (FR-089) — a DOCUMENTED PRE-EXISTING GAP, audited
        and recorded here rather than fixed (operator decision 11): the
        underlying RateLimitPayload (pkg/agent/events.go) carries no
        SessionID field at all, so there is no child-provenance signal to
        stamp a producing_session_id from; this frame's session_id is
        reconstructed downstream from the connection's chat→session map at
        serialization time. No producing_session_id property is added to
        this schema.
      type: object
      required:
      - type
      - session_id
      - scope
      - resource
      - policy_rule
      - retry_after_seconds
      additionalProperties: false
      properties:
        type:
          type: string
          const: rate_limit
        session_id:
          type: string
        scope:
          type: string
          enum:
          - agent
          - channel
          - global
        resource:
          type: string
          minLength: 1
        policy_rule:
          type: string
          minLength: 1
        retry_after_seconds:
          type: number
          minimum: 0
        agent_id:
          type: string
        tool:
          type: string
          maxLength: 128
    MediaPart:
      title: MediaPart
      description: One media attachment.
      type: object
      required:
      - type
      - url
      - filename
      - content_type
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - image
          - audio
          - video
          - file
        url:
          type: string
          minLength: 1
        filename:
          type: string
          minLength: 1
        content_type:
          type: string
          minLength: 1
        caption:
          type: string
    MediaFrame:
      title: MediaFrame
      description: >
        Server → client media attachments. parts MUST be a non-empty array (never
        null) — nil-safety contract to prevent parts.map() crash. Session-scoped
        (registered in SESSION_SCOPED_FRAME_TYPES); class (a) per the ADR-057
        W5 audit (FR-089) — genuinely child-turn-produced.
      type: object
      required:
      - type
      - session_id
      - parts
      additionalProperties: false
      properties:
        type:
          type: string
          const: media
        session_id:
          type: string
          minLength: 1
        parts:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/MediaPart'
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Present iff it differs from session_id.
            Class (a) (FR-089): the child turn's own session id when this
            frame crosses the wire from a delegated child.
    AgentSwitchedFrame:
      title: AgentSwitchedFrame
      description: >
        Server → client active agent changed. Session-scoped (registered
        in SESSION_SCOPED_FRAME_TYPES); class not yet assigned by the
        ADR-057 W5 audit (FR-089) — do not assume presence or absence of
        producing_session_id for this type until the audit classifies it.
      type: object
      required:
      - type
      - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: agent_switched
        session_id:
          type: string
          minLength: 1
        agent_id:
          type: string
        message:
          type: string
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Class not yet assigned by the W5 audit
            (FR-089) — see this frame's description.
    ToolApprovalRequiredFrame:
      title: ToolApprovalRequiredFrame
      description: >
        Server → client tool approval needed (FR-011, FR-082).
        CRITICAL: args MUST be object (never null). Backend coerces nil → {}.
        SPA calls Object.keys(args) — null crashes at render time (Ava-chat bug).
        Session-scoped (registered in SESSION_SCOPED_FRAME_TYPES); class (a)
        per the ADR-057 W5 audit (FR-089) — genuinely child-turn-produced.
      type: object
      required:
      - type
      - approval_id
      - tool_call_id
      - tool_name
      - args
      - agent_id
      - session_id
      - turn_id
      - expires_in_ms
      additionalProperties: false
      properties:
        type:
          type: string
          const: tool_approval_required
        approval_id:
          type: string
          minLength: 1
        tool_call_id:
          type: string
          minLength: 1
        tool_name:
          type: string
          minLength: 1
          maxLength: 128
        args:
          type: object
          additionalProperties: true
          description: 'Tool invocation arguments. Always object, never null. Required + object type so the Phase 4 contract
            test catches any nil regression.

            '
        agent_id:
          type: string
          minLength: 1
        session_id:
          type: string
          minLength: 1
        turn_id:
          type: string
          minLength: 1
        expires_in_ms:
          type: integer
          minimum: 0
          maximum: 86400000
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Present iff it differs from session_id.
            Class (a) (FR-089): the child turn's own session id when this
            frame crosses the wire from a delegated child.
    SessionStatePendingApproval:
      title: SessionStatePendingApproval
      description: One pending approval entry in a SessionStateFrame.
      type: object
      required:
      - approval_id
      - session_id
      - tool_name
      - agent_id
      - expires_in_ms
      additionalProperties: false
      properties:
        approval_id:
          type: string
          minLength: 1
        session_id:
          type: string
          minLength: 1
        tool_name:
          type: string
          minLength: 1
          maxLength: 128
        agent_id:
          type: string
          minLength: 1
        expires_in_ms:
          type: integer
          minimum: 0
          maximum: 86400000
    SessionStateFrame:
      title: SessionStateFrame
      description: 'Server → client reconnect approval snapshot (FR-052, FR-073, FR-081). pending_approvals MUST be an array
        (never null). Backend coerces nil → []. SPA calls pending_approvals.map() — null crashes at render time.

        '
      type: object
      required:
      - type
      - user_id
      - pending_approvals
      - emitted_at
      additionalProperties: false
      properties:
        type:
          type: string
          const: session_state
        user_id:
          type: string
        pending_approvals:
          type: array
          items:
            $ref: '#/components/schemas/SessionStatePendingApproval'
          maxItems: 1000
          description: Always array, never null. Capped at 1000.
        emitted_at:
          type: string
          format: date-time
    SystemOverloadFrame:
      title: SystemOverloadFrame
      description: >
        Server → client system at capacity (FR-016, MAJ-009). Session-scoped
        (registered in SESSION_SCOPED_FRAME_TYPES); class not yet assigned
        by the ADR-057 W5 audit (FR-089) — do not assume presence or
        absence of producing_session_id for this type until the audit
        classifies it.
      type: object
      required:
      - type
      - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: system_overload
        session_id:
          type: string
          minLength: 1
        message:
          type: string
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Class not yet assigned by the W5 audit
            (FR-089) — see this frame's description.
    ReplayWarningStats:
      title: ReplayWarningStats
      description: Diagnostic counters in a ReplayWarningFrame.
      type: object
      additionalProperties: true
      properties:
        duplicate_tool_call_id_count:
          type: integer
    ReplayWarningFrame:
      title: ReplayWarningFrame
      description: Server → client duplicate tool_call_ids detected.
      type: object
      required:
      - type
      - session_id
      - message
      additionalProperties: false
      properties:
        type:
          type: string
          const: replay_warning
        session_id:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        stats:
          $ref: '#/components/schemas/ReplayWarningStats'
    CancelStageFrame:
      title: CancelStageFrame
      description: >
        Server → client cancel progress notification (B3). stage MUST be one of
        three values — SPA validates via isValidFrame() and drops invalid stages.
        Session-scoped (registered in SESSION_SCOPED_FRAME_TYPES); class not
        yet assigned by the ADR-057 W5 audit (FR-089) — do not assume
        presence or absence of producing_session_id for this type until the
        audit classifies it.
      type: object
      required:
      - type
      - session_id
      - stage
      additionalProperties: false
      properties:
        type:
          type: string
          const: cancel_stage
        session_id:
          type: string
          minLength: 1
        stage:
          type: string
          enum:
            - graceful
            - hard
            - detached
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Class not yet assigned by the W5 audit
            (FR-089) — see this frame's description.
    SessionCloseAckFrame:
      title: SessionCloseAckFrame
      description: >
        Server → client session close acknowledged. Session-scoped
        (registered in SESSION_SCOPED_FRAME_TYPES); class (b) per the
        ADR-057 W5 audit (FR-089) — a chat-lifecycle frame, not turn
        output, so producing_session_id is absent (FR-013).
      type: object
      required:
      - type
      - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: session_close_ack
        session_id:
          type: string
          minLength: 1
        id:
          type: string
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Present iff it differs from session_id.
            Class (b) (FR-089): absent for this frame type.
    DevicePairingRequestFrame:
      title: DevicePairingRequestFrame
      description: Server → client device pairing request needs admin approval.
      type: object
      required:
      - type
      - device_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: device_pairing_request
        device_id:
          type: string
          minLength: 1
        fingerprint:
          type: string
        pairing_code:
          type: string
        device_name:
          type: string
        session_id:
          type: string
    WhatsAppPairingFrame:
      title: WhatsAppPairingFrame
      description: 'Server → client WhatsApp native/QR pairing update (QR code + live status) so the SPA can pair in-browser
        without the gateway terminal (#283).

        '
      type: object
      required:
      - type
      - channel_id
      - status
      additionalProperties: false
      properties:
        type:
          type: string
          const: whatsapp_pairing
        channel_id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - waiting
          - code
          - linked
          - timeout
          - error
        qr:
          type: string
        message:
          type: string
    SessionCloseFrame:
      title: SessionCloseFrame
      description: Client → server explicit session close request.
      type: object
      required:
      - type
      - session_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: session_close
        session_id:
          type: string
          minLength: 1
    WhatsAppPairingSubscribeFrame:
      title: WhatsAppPairingSubscribeFrame
      description: 'Client → server. Registers or clears this connection''s interest in a channel''s whatsapp_pairing frames
        so the QR is delivered only to the operator viewing that channel''s pairing UI (#283).

        '
      type: object
      required:
      - type
      - channel_id
      - active
      additionalProperties: false
      properties:
        type:
          type: string
          const: whatsapp_pairing_subscribe
        channel_id:
          type: string
          minLength: 1
        active:
          type: boolean
    NotificationFrame:
      title: NotificationFrame
      description: 'Server → client. A notification raised for the recipient user (e.g. a scheduled run failed). Delivered
        only to that user''s connections; the SPA adds it to the header notification center (#264).

        '
      type: object
      required:
      - type
      - id
      - notification_type
      - title
      - severity
      - read
      - created_at_ms
      additionalProperties: false
      properties:
        type:
          type: string
          const: notification
        id:
          type: string
          minLength: 1
        notification_type:
          type: string
          enum:
          - schedule_failed
        title:
          type: string
          minLength: 1
        body:
          type: string
        severity:
          type: string
          enum:
          - info
          - warning
          - error
        read:
          type: boolean
        created_at_ms:
          type: integer
          format: int64
        schedule_id:
          type: string
        session_id:
          type: string
        agent_id:
          type: string
    BrowserAttachFrame:
      title: BrowserAttachFrame
      description: 'Client → server. Binds this browser-live WebSocket connection to a workspace''s browser and starts watching
        it for control-lock and tab-strip bookkeeping (video is carried exclusively by WebRTC — see BrowserWebRTCStateFrame,
        ADR-061). Per ADR-075 a browser belongs to a WORKSPACE, not to an agent: one workspace, one Chrome, one profile
        directory, one cookie jar, shared by every agent on that workspace''s team. session_id RESOLVES the browsing context
        — the gateway reads the named chat session''s own workspace_id from the session meta, server-side, and attaches to
        that workspace''s browser. agent_id names who is asking and is checked for membership of that workspace; it is NO
        LONGER the binding key. When the session names no workspace the gateway falls back to the agent''s own workspace
        membership, and REFUSES rather than tie-breaking when that is ambiguous (ADR-075 FR-033).

        '
      type: object
      required:
      - type
      - session_id
      - agent_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_attach
        session_id:
          type: string
          minLength: 1
          maxLength: 128
        agent_id:
          type: string
          minLength: 1
          maxLength: 128
    BrowserInputFrame:
      title: BrowserInputFrame
      description: 'Client → server. A viewer input event to inject into the live browser via CDP Input.dispatch*. Only honoured
        while the viewer holds control (browser_control action=take). Coordinates are device (CSS) pixels of the WebRTC video
        frame, UNLESS capture_width/capture_height are present — then x/y are in that capture-frame pixel space and the
        server rescales them into the tab''s real CSS viewport before dispatch (root cause 2026-07-31, fault 3).

        '
      type: object
      required:
      - type
      - kind
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_input
        kind:
          type: string
          enum:
          - mouse_move
          - mouse_down
          - mouse_up
          - wheel
          - key_down
          - key_up
          - text
          - navigate
          - navigate_back
          - reload
        x:
          type: number
        y:
          type: number
        capture_width:
          type: number
          minimum: 1
          maximum: 16384
          description: Intrinsic pixel width of the capture frame the client mapped x/y into (the <video>'s videoWidth in
            WebRTC mode). With capture_height, the server rescales x/y into the tab's actual CSS viewport before CDP
            dispatch. Absent (older client) means x/y are already CSS pixels.
        capture_height:
          type: number
          minimum: 1
          maximum: 16384
          description: Intrinsic pixel height of the capture frame the client mapped x/y into. See capture_width.
        button:
          type: string
          enum:
          - none
          - left
          - middle
          - right
          - back
          - forward
        delta_x:
          type: number
        delta_y:
          type: number
        key:
          type: string
          maxLength: 64
        code:
          type: string
          maxLength: 64
        key_code:
          type: integer
          minimum: 0
          maximum: 255
          description: Windows virtual key code for key_down/key_up (DOM KeyboardEvent.keyCode) — required for CDP to perform
            editing/nav key actions and modifier shortcuts. See ADR-039.
        text:
          type: string
          maxLength: 8192
        modifiers:
          type: integer
          minimum: 0
          maximum: 15
        url:
          type: string
          maxLength: 2048
    BrowserControlFrame:
      title: BrowserControlFrame
      description: 'Client → server. Take or release interactive control of the live browser. While a viewer holds control,
        the agent''s own browser tools defer (cooperative turn-coordination, ADR-038 D6).

        '
      type: object
      required:
      - type
      - action
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_control
        action:
          type: string
          enum:
          - take
          - release
    BrowserDetachFrame:
      title: BrowserDetachFrame
      description: 'Client → server. Detach this viewer from the live browser; the server stops watching the session when
        the last viewer detaches. Sent when the panel closes.

        '
      type: object
      required:
      - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_detach
        session_id:
          type: string
          maxLength: 128
    BrowserStatusFrame:
      title: BrowserStatusFrame
      description: 'Server → client. Lifecycle / control status for the live browser connection. state=controlling means this
        viewer holds interactive control; released means control was dropped; error carries a human-readable message.

        '
      type: object
      required:
      - type
      - state
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_status
        state:
          type: string
          enum:
          - attached
          - idle
          - controlling
          - released
          - detached
          - error
        message:
          type: string
          maxLength: 512
        controller:
          type: string
          maxLength: 128
        controlled_by_other:
          type: boolean
          description: 'Server-computed per-connection: true when some OTHER connection on this session holds interactive
            control. Keeps the docked panel and the pop-out window in agreement about who is driving.'
        control_only:
          type: boolean
          description: True on a frame whose sole purpose is to update control-ownership on other viewers (take/release/detach)
            — carries no lifecycle/error meaning; the SPA applies only controlled_by_other and leaves its status/error banner
            untouched.
        session_id:
          type: string
    BrowserViewportFrame:
      title: BrowserViewportFrame
      description: 'Client → server. Reports the live-browser panel''s current render box so the gateway can size the
        captured tab to match it. The captured tab was pinned to a hardcoded 1280x720 while the docked panel is an
        arbitrary resizable shape, so object-fit:contain could only ever fill one dimension and letterboxed the rest
        (operator UAT 2026-07-31). device_scale_factor addresses the same report''s second half, blur: the managed
        headless Chrome renders at DPR 1, so a capture displayed larger than its CSS size upscales. Sent on attach and
        debounced on resize; the server applies the metrics then triggers browser_capture_control{action: recapture} so
        the encoder rebuilds its stream at the new geometry (capture constraints are pinned per stream).

        '
      type: object
      required:
      - type
      - width
      - height
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_viewport
        session_id:
          type: string
        agent_id:
          type: string
        width:
          type: integer
          minimum: 1
          maximum: 8192
          description: Panel render-box width in CSS pixels. Bounded so a malformed or hostile frame cannot ask Chromium
            for an absurd allocation.
        height:
          type: integer
          minimum: 1
          maximum: 8192
          description: Panel render-box height in CSS pixels.
        device_scale_factor:
          type: number
          minimum: 1
          maximum: 3
          description: Viewer devicePixelRatio, used as Chromium's deviceScaleFactor so the capture renders at display
            resolution rather than upscaling. Capped at 3 because cost scales with the SQUARE of this value. Omitted
            means 1.
    BrowserTabActionFrame:
      title: BrowserTabActionFrame
      description: 'Client → server. A tab-management action on a live-browser session: switch the active tab, close a tab,
        or open a new (blank) tab. Honoured the same way as browser_input/browser_control — switch/close target the active
        browsing context''s tab set. index is required for switch/close, ignored for open. See ADR-041.

        '
      type: object
      required:
      - type
      - action
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_tab_action
        session_id:
          type: string
          maxLength: 128
        agent_id:
          type: string
          maxLength: 128
        action:
          type: string
          enum:
          - switch
          - close
          - open
        index:
          type: integer
          minimum: 0
          description: Tab index for switch/close (ignored for open).
    BrowserTabsFrame:
      title: BrowserTabsFrame
      description: 'Server → client. The current set of open tabs for a live-browser session and which one is active, broadcast
        whenever a tab is opened (e.g. a target=_blank click or window.open the agent/user followed), closed, switched, or
        its title/url changes. The SPA renders this as the panel''s tab strip; the WebRTC capture always follows the active
        tab. See ADR-041.

        '
      type: object
      required:
      - type
      - tabs
      - active_index
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_tabs
        session_id:
          type: string
          maxLength: 128
        active_index:
          type: integer
          minimum: 0
          description: Index into tabs of the currently-active (WebRTC-captured) tab.
        tabs:
          type: array
          maxItems: 32
          items:
            type: object
            required:
            - index
            additionalProperties: false
            properties:
              index:
                type: integer
                minimum: 0
                description: 0-based position of this tab in the CURRENT tab list. NOT a persistent identifier — indices shift
                  down when an earlier tab closes; always re-read from the latest browser_tabs / browser_list_tabs before
                  acting on a specific index.
              title:
                type: string
                maxLength: 512
                description: The tab's document.title, when known.
              url:
                type: string
                maxLength: 4096
                description: The tab's current URL, when known.
              active:
                type: boolean
                description: True for the active tab (mirrors active_index).
    BrowserWebRTCOfferFrame:
      title: BrowserWebRTCOfferFrame
      description: 'Client → server. Viewer SDP offer to start (or restart) a WebRTC media session for a workspace''s live
        browser, sent on the existing /api/v1/browser/ws channel after browser_attach. Non-trickle: the SPA gathers all ICE
        candidates locally before sending, so `sdp` is the complete offer. The gateway''s Pion relay (ADR-047 D1) resolves
        the browsing context exactly as browser_attach does under ADR-075: session_id names the chat session whose
        workspace_id the gateway reads server-side, and the capture session it ensures/creates belongs to THAT WORKSPACE''s
        browser — one capture per workspace browser, shared by every agent on the team (ADR-075 FR-016a), started on the
        first WebRTC-capable viewer offer (ADR-047 D2) and fed to each new viewer PeerConnection from the shared media
        tracks. agent_id names who is asking and is checked for membership of that workspace; it is NO LONGER the binding
        key, and two agents on one workspace no longer contend for a capture. See ADR-075 and ADR-047 D1/D4.

        '
      type: object
      required:
      - type
      - agent_id
      - session_id
      - sdp
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_webrtc_offer
        agent_id:
          type: string
          minLength: 1
          maxLength: 128
          description: The agent this panel is open on. It names WHO is asking and must be a member of the workspace session_id
            resolves to; it does not by itself select a capture session, because the capture belongs to the workspace's browser
            and every agent on that team shares it.
        session_id:
          type: string
          minLength: 1
          maxLength: 128
          description: The client's chat session id. Exactly as in BrowserAttachFrame, it RESOLVES the browsing context under
            ADR-075 FR-017 — the gateway reads this session's own workspace_id server-side and targets that workspace's browser
            and its single capture session. It is still echoed back on browser_webrtc_answer / browser_webrtc_state so the
            client can match them to this offer. A session that names no workspace degrades to the agent's own unambiguous
            membership, and to FR-033's refusal when the agent is on more than one workspace. agent_id is no longer the binding
            key.
        sdp:
          type: string
          minLength: 1
          maxLength: 131072
          description: Complete SDP offer (application/sdp body), gathered with ICE candidates already resolved (non-trickle,
            ADR-047 D4).
    BrowserWebRTCAnswerFrame:
      title: BrowserWebRTCAnswerFrame
      description: 'Server → client. Pion SDP answer to a browser_webrtc_offer, sent once the gateway''s relay has created
        the viewer PeerConnection and gathered its own ICE candidates (non-trickle — the answer is complete, no separate candidate
        frames follow). See ADR-047 D1/D4.

        '
      type: object
      required:
      - type
      - sdp
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_webrtc_answer
        session_id:
          type: string
          maxLength: 128
          description: Echoes the session_id from the triggering browser_webrtc_offer, for client-side correlation only.
        sdp:
          type: string
          minLength: 1
          maxLength: 131072
          description: Complete SDP answer (application/sdp body) from the gateway's Pion viewer PeerConnection, ICE-gathering-complete
            (non-trickle).
    BrowserWebRTCStateFrame:
      title: BrowserWebRTCStateFrame
      description: 'Server → client. Availability / lifecycle state for the WebRTC media path on a live-browser connection,
        distinct from the general lifecycle carried by browser_status. `available` tells the SPA whether it may attempt a
        browser_webrtc_offer at all (feature flag off, platform/build not capable, or a runtime error takes it out of service);
        `active` tells the SPA whether a WebRTC session is currently flowing media for this connection. Per ADR-061, WebRTC
        is the ONLY live-browser video path — there is no screencast fallback to degrade to. available=false or active
        dropping to false after being true (e.g. ICE failure) means the panel genuinely has no video right now, and the
        SPA must show that honestly rather than silently substituting another stream. See ADR-047 D1/D7 (lite builds
        compile WebRTC out entirely), ADR-061.

        '
      type: object
      required:
      - type
      - available
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_webrtc_state
        session_id:
          type: string
          maxLength: 128
          description: Echoes the session_id from the triggering browser_webrtc_offer / browser_attach, for client-side correlation
            only.
        available:
          type: boolean
          description: True if the gateway currently offers WebRTC for this connection (the webrtc_enabled config flag is
            on, the platform/build supports it, and no runtime error has taken it out of service). False means the SPA
            must not send browser_webrtc_offer — there is no video for this connection until it becomes true.
        reason:
          type: string
          enum:
          - disabled
          - not_capable
          - lite_build
          - error
          - multi_agent_capture_denied
          - ingest_timeout
          description: 'Present when available=false (or when active unexpectedly drops to false): disabled = tools.browser.webrtc_enabled
            is off; not_capable = platform/managed-Chrome capability classification is below WebRTC eligibility (ADR-047 D5,
            e.g. chrome-headless-shell only, no full Chrome); lite_build = binary built with -tags lite (Pion compiled out,
            ADR-047 D7); error = a runtime failure (capture/encoder/ICE) took the WebRTC path out of service for this session;
            multi_agent_capture_denied = another agent''s capture is already being viewed (ADR-048 condition 2; v1 is single-capture);
            ingest_timeout = the capture pipeline produced no video track within waitForTracksTimeout (webrtc.ErrNoIngestVideoTrack)
            — distinct from error because the cause sits UPSTREAM of ICE, the encoder page never delivered frames, so retrying
            the viewer connection is usually futile while restarting capture is not.'
        reason_detail:
          type: string
          maxLength: 512
          description: 'Optional free-text cause that accompanies `reason`, for the operator to read and act on. `reason` is a
            CLOSED enum and four of its six values collapse wildly different causes into one token, so on its own it cannot say
            WHY video failed — an operator saw "capture session: create encoder target: browser: timed out after 20s waiting
            for the browser to attach the tab" in gateway.log while the panel showed only "the live browser reported an error
            starting video". ADR-061 deleted the silent JPEG fallback precisely so a failure would be visible AND specific; a
            visible failure naming no cause gives back what that deletion bought. The browser_attach path already sends its
            full error chain as free text on browser_status; this field closes the same gap for the start-video route.
            Server-side the text is whitespace-collapsed, credential-redacted (labelled secrets, bearer tokens and bare long
            hex runs — the capture token''s shape) and length-bounded before it is sent; URLs, CDP target ids, ports and
            timeouts are deliberately KEPT, because they are what makes the sentence actionable. Absent when the enum alone
            fully explains the state (disabled / lite_build / not_capable) or on a success frame.'
        has_audio:
          type: boolean
          description: True if the active (or about-to-be-offered) media includes an audio track from the captured tab. Absent/false
            when audio is unavailable or not yet known.
        active:
          type: boolean
          description: 'True while a WebRTC PeerConnection for this viewer is currently connected and flowing media. False
            (or absent) means this viewer currently has no video — WebRTC not yet offered, not yet negotiated, or lost
            after an ICE/connection failure (ADR-061 — there is no fallback tier to degrade to).'
        ice_servers:
          type: array
          maxItems: 8
          description: 'ADR-062 tier 3: the ICE servers this viewer should configure, including short-lived TURN
            credentials minted for it. Present only when the gateway runs the embedded relay.'
          items:
            type: object
            additionalProperties: false
            required:
            - urls
            properties:
              urls:
                type: array
                maxItems: 4
                items:
                  type: string
                  maxLength: 256
              username:
                type: string
                maxLength: 256
              credential:
                type: string
                maxLength: 256
    BrowserCaptureHelloFrame:
      title: BrowserCaptureHelloFrame
      description: 'Client (capture extension) → server (gateway). First frame on the loopback-only /api/v1/browser/capture-ingest
        WebSocket, analogous to AuthFrame on the public channels. `token` is the per-stream capability token the gateway minted
        for this capture session and injected into the extension''s encoder page out-of-band via CDP Page.addScriptToEvaluateOnNewDocument
        — never a URL query param, never recoverable from the CDP transport. Loopback is NOT a trust boundary (a co-tenant
        process could reach it), so this token is mandatory; the gateway audits any hello with a missing/invalid/expired token
        as a rejected ingest-auth attempt and closes the connection. See ADR-047 D6.

        '
      type: object
      required:
      - type
      - token
      - ext_version
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_capture_hello
        token:
          type: string
          minLength: 16
          maxLength: 256
          description: Opaque per-stream capability token minted by the gateway for this capture session (not the SPA bearer
            auth token — a distinct, single-purpose credential scoped to one ingest connection). See ADR-047 D6.
        ext_version:
          type: string
          minLength: 1
          maxLength: 32
          description: The capture extension's manifest version string, reported so the gateway can log/reject a mismatched
            build (e.g. after a seeded extension upgrade) without guessing from behavior.
    BrowserCaptureOfferFrame:
      title: BrowserCaptureOfferFrame
      description: 'Client (capture extension) → server (gateway). SDP offer from the encoder page''s self-consuming tabCapture
        PeerConnection (ADR-047 D2), sent after a successful browser_capture_hello. Non-trickle: the encoder page gathers
        all ICE candidates before sending, so `sdp` is the complete offer. The gateway''s Pion relay answers with browser_capture_answer
        and publishes the resulting media/audio tracks to every attached viewer PC. See ADR-047 D1/D2/D6.

        '
      type: object
      required:
      - type
      - sdp
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_capture_offer
        sdp:
          type: string
          minLength: 1
          maxLength: 131072
          description: Complete SDP offer (application/sdp body) from the encoder page's ingest PeerConnection, ICE-gathering-complete
            (non-trickle).
    BrowserCaptureAnswerFrame:
      title: BrowserCaptureAnswerFrame
      description: 'Server (gateway) → client (capture extension). Pion SDP answer to a browser_capture_offer, completing
        the ingest leg''s non-trickle offer/answer exchange. Once applied, the encoder page''s tabCapture MediaStream (video,
        plus audio when the tab produces sound) flows into the gateway''s shared TrackLocalStaticRTP tracks for relay to viewers.
        See ADR-047 D1/D2.

        '
      type: object
      required:
      - type
      - sdp
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_capture_answer
        sdp:
          type: string
          minLength: 1
          maxLength: 131072
          description: Complete SDP answer (application/sdp body) from the gateway's Pion ingest PeerConnection, ICE-gathering-complete
            (non-trickle).
    BrowserCaptureControlFrame:
      title: BrowserCaptureControlFrame
      description: 'Bidirectional control frame on the /api/v1/browser/capture-ingest channel. Server (gateway) → client (extension)
        for `recapture` (the agent''s active tab changed — chrome.tabs.query({active:true}) must be re-bound; triggered by
        the same live.go onTabsChanged/rebindWatch tab-follow logic that also drives the live-view session/control-lock
        bookkeeping, ADR-047 D2) and `shutdown` (the capture session is ending — last viewer detached past
        the grace period, or the gateway is stopping the stream); client (extension) → server (gateway) for `ping`, the encoder
        page''s periodic health beacon / reconnect-watchdog signal. `reason` is an optional human-readable note (e.g. why
        shutdown was requested).

        '
      type: object
      required:
      - type
      - action
      additionalProperties: false
      properties:
        type:
          type: string
          const: browser_capture_control
        action:
          type: string
          enum:
          - recapture
          - shutdown
          - ping
          - adapt_reset
          - set_bitrate
        reason:
          type: string
          maxLength: 512
          description: Optional human-readable context for the action (e.g. shutdown cause).
        max_bitrate:
          type: integer
          minimum: 50000
          maximum: 40000000
          description: "set_bitrate only, server -> extension: the video sender's maximum bitrate in bits per\
            \ second, derived from the VIEWER leg's own RTCP receiver reports (ADR-062 Finding 2)."
        expected_width:
          type: integer
          minimum: 1
          maximum: 16384
          description: 'recapture only, server → extension: the CDP-verified CSS viewport width the tab was just resized
            to. chrome.tabs.get lags the OS window reflow, so a recapture racing a resize can pin the stream to a stale
            size — the encoder polls tabs.get until it converges on this, falling back to it on timeout.'
        expected_height:
          type: integer
          minimum: 1
          maximum: 16384
          description: 'recapture only: expected CSS viewport height. See expected_width.'
        capture_scale:
          type: number
          minimum: 1
          maximum: 4
          description: 'recapture only, server → extension: the deviceScaleFactor the captured tab renders at (driven by
            the controlling viewer''s window.devicePixelRatio via the viewport frame). The encoder multiplies its
            tabCapture width/height constraints by this so captured frames carry PHYSICAL pixels, not CSS pixels. Absent
            or 1 = CSS resolution. Without it a Retina (dpr=2) viewer gets a 1x capture stretched over 2x display pixels
            — uniformly blurry video (live report, macOS 2026-08-12). The tabs.get convergence check stays in CSS px;
            only the media constraints scale.'

    # ── Planning & Goals (ADR-049) ──────────────────────────────────────────────

    GoalStatusFrame:
      title: GoalStatusFrame
      description: >
        Server → client. Status push for a session's active /goal loop
        (ADR-049 D6/D7/US-8; state enum + goal_id extended by ADR-053
        §Contract Surface — "Pill-state enum"/R§8.10). Emitted on round
        completion, state change, and clear/stop. Session-scoped
        (registered in SESSION_SCOPED_FRAME_TYPES). Canonical copy — keep
        in sync by hand with components/schemas/GoalStatusFrame.yaml.
        Class not yet assigned by the ADR-057 W5 audit (FR-089) — do not
        assume presence or absence of producing_session_id until the audit
        classifies it.
      type: object
      required:
        - type
        - session_id
        - condition
        - round
        - max_rounds
        - latest_reason
        - active_loops
        - cap
        - state
      additionalProperties: false
      properties:
        type:
          type: string
          const: goal_status
        session_id:
          type: string
          minLength: 1
        goal_id:
          type: string
          minLength: 1
          description: >
            ADR-053 R§8.11 — the specific goal-id this pill/timer/round-
            budget belongs to (a session may carry multiple independent
            goals). Optional — see components/schemas/GoalStatusFrame.yaml
            for the shape decision.
        condition:
          type: string
        round:
          type: integer
          minimum: 0
          description: >
            Adjudications consumed so far (ADR-053 R§8.9 — one round = one
            adjudication, claim-triggered OR idle-settled).
        max_rounds:
          type: integer
          minimum: 1
        latest_reason:
          type: string
        active_loops:
          type: integer
          minimum: 0
        cap:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
            - queued
            - active
            - waiting_on_user
            - judge_unavailable
            - re-planning
            - judging
            - done
            - failed
            - cleared
          description: >
            ADR-053 §Contract Surface — "Pill-state enum"/R§8.10 crosswalk
            (originally 8 states, superseding the earlier 4-value
            active/paused_judge_unavailable/brake_fired/cleared set — no
            back-compat at the time; `cleared` re-added as a 9th value by
            the UAT S3 fix so a user-initiated `/goal clear` no longer
            collapses into `failed`). See
            components/schemas/GoalStatusFrame.yaml for the full
            per-state crosswalk description.
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Class not yet assigned by the W5 audit
            (FR-089) — see this frame's description.

    LoopStatusFrame:
      title: LoopStatusFrame
      description: >
        Server → client. Status push for a session's active /loop (ADR-049
        D6/D7/US-9). Emitted on run completion, state change, and stop.
        Session-scoped (registered in SESSION_SCOPED_FRAME_TYPES). Class
        not yet assigned by the ADR-057 W5 audit (FR-089) — do not assume
        presence or absence of producing_session_id until the audit
        classifies it.
      type: object
      required:
        - type
        - session_id
        - mode
        - run
        - max_runs
        - state
      additionalProperties: false
      properties:
        type:
          type: string
          const: loop_status
        session_id:
          type: string
          minLength: 1
        mode:
          type: string
          enum:
            - interval
            - self_paced
        run:
          type: integer
          minimum: 0
        max_runs:
          type: integer
          minimum: 1
        next_delay:
          type: integer
          format: int64
          description: >
            Milliseconds until the next scheduled run. Present for
            `interval` mode and once a `self_paced` run has scheduled its
            next one-shot fire.
        state:
          type: string
          description: >
            Current state of this loop. Runtime vocabulary owned by the
            loop engine (ADR-049 Part B); kept a plain string in this
            contract wave rather than a closed enum (unlike
            GoalStatusFrame.state) so naming it does not require a
            breaking change once Part B's implementation lands.
        producing_session_id:
          type: string
          minLength: 1
          description: >
            ADR-057 FR-012/FR-013. Class not yet assigned by the W5 audit
            (FR-089) — see this frame's description.

    PlanStatusFrame:
      title: PlanStatusFrame
      description: >
        Server → client. Status push for a Plan (ADR-049 D4/D7/US-7).
        Emitted on phase change, state transition, progress change, and
        pause/resume. Not session-scoped — a Plan is a standalone
        workspace-scoped entity, not tied to one chat session.
      type: object
      required:
        - type
        - plan_id
        - state
        - plan_phase
        - progress
      additionalProperties: false
      properties:
        type:
          type: string
          const: plan_status
        plan_id:
          type: string
        state:
          type: string
          enum:
            - draft
            - approved
            - running
            - done
            - failed
        plan_phase:
          type: string
          enum:
            - dispatching
            - judging
            - synthesizing
            - idle
            - awaiting_supervision
            - stalled
        progress:
          type: number
          minimum: 0
          maximum: 1
        paused_reason:
          type: string

    JudgeVerdictFrame:
      title: JudgeVerdictFrame
      description: >
        Server → client. Live push of a judge adjudication (ADR-049
        D2/D4/NFR-5) — the WS carrier of a judge verdict. The other carrier
        is the persisted session-transcript entry
        (Message.type=judge_verdict / Message.verdict, contract C12); both
        carry the same shape so they cannot silently disagree.
      type: object
      required:
        - type
        - id
        - scope
        - round
        - met
        - per_criterion
        - model
        - judged_at
        - judge_agent_id
      additionalProperties: false
      properties:
        type:
          type: string
          const: judge_verdict
        id:
          type: string
        scope:
          type: string
          enum:
            - task
            - plan
            - goal
        task_id:
          type: string
        plan_id:
          type: string
        round:
          type: integer
          minimum: 1
        met:
          type: boolean
        per_criterion:
          type: array
          items:
            type: object
            required:
              - criterion_id
              - met
              - reason
            additionalProperties: false
            properties:
              criterion_id:
                type: string
                minLength: 1
              met:
                type: boolean
              reason:
                type: string
              evidence_quote:
                type: string
                maxLength: 500
        model:
          type: string
        judged_at:
          type: string
          format: date-time
        judge_agent_id:
          type: string

    ErrorPayload:
      title: ErrorPayload
      description: Structured payload for a live error frame.
      type: object
      required:
      - llm_error
      additionalProperties: false
      properties:
        llm_error:
          $ref: '#/components/schemas/LLMError'
    ReplayErrorPayload:
      title: ReplayErrorPayload
      description: Structured replay-safe payload for a replay error frame.
      type: object
      required:
      - llm_error
      additionalProperties: false
      properties:
        llm_error:
          $ref: '#/components/schemas/LLMErrorReplay'
