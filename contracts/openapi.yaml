  /tasks/{id}/todos:
    put:
      operationId: setTaskTodos
      summary: Replace a task's checklist
      description: >
        Replaces the task's `todos` array atomically (Tier-1 checklist; Detail #3
        of the three-tier model). Returns the updated task.
