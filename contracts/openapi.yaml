  /workspaces/{id}:
    get:
      operationId: getWorkspace
      summary: Get a workspace by ID
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
    put:
      operationId: updateWorkspace
      summary: Update a workspace (partial update — absent fields unchanged)
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdateRequest'
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
    delete:
      operationId: deleteWorkspace
      summary: Delete a workspace and cascade-delete its tasks and session links
      description: >
        The workspace record itself is removed atomically under a per-ID
        lock. Task-scan and channel-unbind cascade failures abort the whole
        delete (500) before that removal happens. A media-library cascade
        failure is detected AFTER the workspace record is already gone
        (best-effort cleanup step) — a genuine cascade failure (the media
        library could not be opened, or the manifest itself could not be
        updated) also returns 500, but unlike the two HARD steps above, the
        workspace itself has already been deleted by the time it is
        reported; a follow-up GET on the same id returns 404. A cascade
        outcome where the manifest was fully and correctly updated but a
        final on-disk cleanup step for an already-removed entry failed is
        NOT reported as a failure (204): every such leftover lives under the
        workspace's own directory, which this same delete unconditionally
        removes immediately afterward, so it never survives the request.
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'

