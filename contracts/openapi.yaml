  /stats/tokens:
    get:
      operationId: getTokenStats
      summary: Get per-agent token usage summary
      description: >
        Aggregates token usage from SessionMeta.Stats across all session files
        for the requested period. period=month means the current calendar month UTC.
        No dollar estimates — token counts only.
      tags:
      - Stats
      security:
      - BearerAuth: []
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
          enum: [day, week, month, all]
          default: month
        description: >
          Aggregation period. day=current calendar day UTC; week=current ISO
          week (Mon–Sun) UTC; month=current calendar month UTC; all=all time.
      responses:
        '200':
          description: Token usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenUsageSummary'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /system/cli-detect:
    get:
      operationId: getHostCliDetect
      summary: Probe host PATH for the three external-CLI runners
      description: >
        Reports whether the gateway process can locate each of the three
        external-CLI runners on its PATH. Read-only, idempotent, and
        unaudited — the SPA roster uses this to grey-out CLIs the host
        cannot run instead of letting the operator hit a wizard failure at
        runtime. Pure Go probe (no shell-out).
      tags:
      - system
      security:
      - BearerAuth: []
      responses:
        '200':
          description: CLI availability probe result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliDetect'
        '401':
          $ref: '#/components/responses/401Unauthorized'

security:
- BearerAuth: []
