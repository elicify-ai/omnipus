  /tasks/{id}/dependencies:
    put:
      operationId: setTaskDependencies
      summary: Replace a task's dependencies
      description: >
        Replaces the task's `blocked_by` set atomically. A write-time DAG cycle
        validator rejects self-edges and cycles (max depth 50). Returns the
        updated task.
      tags:
      - Tasks
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Task ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              description: Task IDs this task is blocked by.
      responses:
        '200':
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
  /tasks/{id}/evidence:
    get:
      operationId: listTaskEvidence
      summary: List a task's judge-check evidence
      description: >
        Returns every persisted EvidenceRecord for this task (ADR-049 D2,
        spec Part A §C) — one record per (criterion_id, attempt) machine-check
        execution, redacted and size-capped at write time. Read-only surface;
        evidence is written only by the evidence-ladder judge, never via this
        endpoint. Returns an empty array for a task with no machine checks.
      tags:
      - Tasks
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Task ID.
      responses:
        '200':
          description: Evidence records for this task.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvidenceRecord'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
  /tasks/{id}/runs:
    get:
      operationId: listTaskRuns
      summary: List a task's run history
      description: >
        Returns every execution record (TaskRun) for a task, newest first
        (ADR-050 / task-run-history-spec §3.6) — the authoritative history
        list, independent of whether the task's current trigger can still
        project a run's occurrence_ms (a series whose schedule was edited
        still lists every past run). Retention-bounded (day-partitioned
        sweep with a keep-newest-day floor); full result strings. Read-only;
        no state change. Rate-limited by the same dedicated taskReadLimiter
        (240 requests/min) as GET /tasks/occurrences.
      tags:
      - Tasks
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Task ID.
      responses:
        '200':
          description: Array of run records, newest first. Empty array when the task has no runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskRun'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
    post:
      operationId: runTaskNow
      summary: Start a task run now ("Run now")
      description: >
        Opens a new run for the task and dispatches it immediately (ADR-050
        RD7 / task-run-history-spec §3.4). With `occurrence_ms`, runs that
        specific recurring occurrence (materialize-on-demand); without it,
        re-runs a normal/once task as a fresh run (prior runs are preserved).
        Idempotent per (task, occurrence_ms) against a concurrent scheduler
        fire. Returns 202 — the run executes asynchronously; observe progress
        via the task_run_status WS frame or GET /tasks/{id}/runs.
      tags:
      - Tasks
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Task ID.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunNowRequest'
      responses:
        '202':
          description: Run accepted and dispatched asynchronously.
        '400':
          description: Invalid task ID or request body.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '503':
          description: Task executor unavailable (gateway degraded).
  /tasks/{id}/verdicts:
    get:
      operationId: listTaskVerdicts
      summary: List a task's judge verdicts
      description: >
        Returns every judge_verdict transcript entry recorded for this task's
        goal-loop attempts (ADR-049 D2, spec Part A §C / Round-1
        Reconciliation R3), oldest first. Read from the task's session
        transcript (the durable carrier — the live JudgeVerdictFrame WS push
        is the other, ephemeral carrier of the same shape). Returns an empty
        array for a task that has not yet been judged (e.g. no criteria, or
        no attempt has completed).
      tags:
      - Tasks
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Task ID.
      responses:
        '200':
          description: Judge verdicts for this task, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JudgeVerdict'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
  /tasks/{id}/stop:
    post:
      operationId: stopTask
      summary: Stop a task's running goal-loop
      description: >
        Cancels the task's in-flight worker turn (if any, via the same
        cancellation path as a chat /cancel) and transitions the task to
        `failed` with a `stopped by user` result (SD-C5 — Stop/Clear may be
        optimistic client-side, as this cannot validation-fail). Rejected 400
        when the task is already terminal (`done`/`failed`) or `blocked`
        (nothing running to stop).
      tags:
      - Tasks
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Task ID.
      responses:
        '200':
          description: Stopped task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
  /tasks/{id}/restart:
    post:
      operationId: restartTask
      summary: Restart a stopped standalone task
      description: >
        Restarts a standalone (non-plan-member) task previously stopped by
        the user (`status: failed`, `cancel_reason: stopped_by_user`) — the
        Play route (ADR-052 FR-026). Resets `attempt_count` to 0, clears
        `cancel_reason`, and transitions the task to `next` so the goal loop
        picks it up again. Rejected 409 when the task belongs to a plan
        (restart the plan instead, via POST /plans/{id}/restart, which
        re-runs its non-done members) or is not in a restartable state (not
        `failed`, or `failed` for a reason other than `stopped_by_user`).
      tags:
      - Tasks
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Task ID.
      responses:
        '200':
          description: Restarted task (status `next`, `cancel_reason` cleared).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
