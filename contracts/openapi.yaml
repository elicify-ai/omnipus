          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionScopeUpdateResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: >
        Returns HTTP 200 with status "ok" when the gateway is serving, and HTTP
        503 with status "degraded" plus a reason on a gateway-fatal condition
        (agent loop dead, config reload failed, default agent unloadable). The
        audit_* and catalog fields describe a degraded SUBSYSTEM while the
        gateway itself is still serving and never change the status code — a
        stale provider catalog (ADR-067 FR-037) makes the model picker less
        accurate, it does not take the process out of rotation. No
        authentication required.
      security: []
      tags:
      - Health
      responses:
        '200':
          description: Gateway is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Gateway is degraded; the body names the reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '404':
          description: "Not used \u2014 gateway is always healthy or not reachable."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /about:
    get:
      operationId: getAbout
      summary: Gateway metadata
      description: 'Returns version, runtime, uptime, PID, and the live preview_enabled flag. The SPA uses preview_enabled to decide whether to surface preview links, which resolve against the main gateway origin at /preview/ (no separate preview listener/port/origin exists — ADR-044).

        '
      tags:
      - About
      responses:
        '200':
          description: Gateway metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutResponse'
