    # ── ADR-053 unified goal/plan/subagent system — §6 wire-contract set ────
    # docs/internal/specs/unified-goal-plan-subagent-spec.md §Contract
    # Surface is the field-level source of truth. SessionMessage,
    # DelegateActionRequest, and MessageParentRequest are discriminated
    # unions hosted INLINE here (not in a schema file) — same ADR-034
    # pattern as AgentCreateRequest above: oapi-codegen only generates
    # named variant types + As/From accessors when the oneOf members are
    # internal component refs; external file refs inside a oneOf are
    # inlined as anonymous structs and the generated code does not
    # compile. The variant files remain the single source of truth for
    # each member's field set.
    SessionMessage:
      description: >
        The typed, schema-validated envelope carried over the existing
        pkg/bus MessageBus (no new transport) that derives every
        control/visibility surface of the session-control plane (ADR-053
        S6/US-6). Discriminated by `kind` — 12 variants covering
        child->parent reporting (progress/checkpoint/artifact/blocker/
        question/decision_request/error/handback), engine-emitted control
        (revision_entry), session->UI propagation (goal_status), and
        parent->child control (steer/respond). `direction` is one of
        `child_to_parent | parent_to_child | session_to_ui | engine` — the
        historical `human` value is dropped (M8); every kind variant maps
        to exactly one of the four. Every field/kind/direction pairing is
        the ratified shape from the spec's Contract Surface table — see
        the individual variant files for full per-kind documentation and
        caps (10 msgs/min, 32 KiB, depth <=5 for child sends; 6/min, 16
        KiB for steer; per-child unacked ceiling 20 open question+blocker,
        D15).
      oneOf:
        - $ref: '#/components/schemas/SessionMessageProgress'
        - $ref: '#/components/schemas/SessionMessageCheckpoint'
        - $ref: '#/components/schemas/SessionMessageArtifact'
        - $ref: '#/components/schemas/SessionMessageBlocker'
        - $ref: '#/components/schemas/SessionMessageQuestion'
        - $ref: '#/components/schemas/SessionMessageDecisionRequest'
        - $ref: '#/components/schemas/SessionMessageError'
        - $ref: '#/components/schemas/SessionMessageHandback'
        - $ref: '#/components/schemas/SessionMessageRevisionEntry'
        - $ref: '#/components/schemas/SessionMessageGoalStatus'
        - $ref: '#/components/schemas/SessionMessageSteer'
        - $ref: '#/components/schemas/SessionMessageRespond'
      discriminator:
        propertyName: kind
        mapping:
          progress: '#/components/schemas/SessionMessageProgress'
          checkpoint: '#/components/schemas/SessionMessageCheckpoint'
          artifact: '#/components/schemas/SessionMessageArtifact'
          blocker: '#/components/schemas/SessionMessageBlocker'
          question: '#/components/schemas/SessionMessageQuestion'
          decision_request: '#/components/schemas/SessionMessageDecisionRequest'
          error: '#/components/schemas/SessionMessageError'
          handback: '#/components/schemas/SessionMessageHandback'
          revision_entry: '#/components/schemas/SessionMessageRevisionEntry'
          goal_status: '#/components/schemas/SessionMessageGoalStatus'
          steer: '#/components/schemas/SessionMessageSteer'
          respond: '#/components/schemas/SessionMessageRespond'
    SessionMessageProgress:
      $ref: ./components/schemas/SessionMessageProgress.yaml
    SessionMessageCheckpoint:
      $ref: ./components/schemas/SessionMessageCheckpoint.yaml
    SessionMessageArtifact:
      $ref: ./components/schemas/SessionMessageArtifact.yaml
    SessionMessageBlocker:
      $ref: ./components/schemas/SessionMessageBlocker.yaml
    SessionMessageQuestion:
      $ref: ./components/schemas/SessionMessageQuestion.yaml
    SessionMessageDecisionRequest:
      $ref: ./components/schemas/SessionMessageDecisionRequest.yaml
    SessionMessageError:
      $ref: ./components/schemas/SessionMessageError.yaml
    SessionMessageHandback:
      $ref: ./components/schemas/SessionMessageHandback.yaml
    SessionMessageRevisionEntry:
      $ref: ./components/schemas/SessionMessageRevisionEntry.yaml
    SessionMessageGoalStatus:
      $ref: ./components/schemas/SessionMessageGoalStatus.yaml
    SessionMessageSteer:
      $ref: ./components/schemas/SessionMessageSteer.yaml
    SessionMessageRespond:
      $ref: ./components/schemas/SessionMessageRespond.yaml
    RevisionEntry:
      $ref: ./components/schemas/RevisionEntry.yaml
