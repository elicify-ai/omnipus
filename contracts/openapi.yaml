    OnboardingCompleteResponse:
      $ref: ./components/schemas/LoginResponse.yaml
    ProbeProviderRequest:
      $ref: ./components/schemas/ProbeProviderRequest.yaml
    ProbeProviderResponse:
      $ref: ./components/schemas/ProbeProviderResponse.yaml
    Session:
      $ref: ./components/schemas/Session.yaml
    SessionStats:
      $ref: ./components/schemas/SessionStats.yaml
    SessionDetail:
      $ref: ./components/schemas/SessionDetail.yaml
    # SessionPage is the paged envelope for GET /sessions (ADR-057 FR-091,
    # grill2 M2-10). It REPLACES the historic two-variant oneOf (a bare
    # Session array, or {sessions, partial_errors}) with one shape. Hosted
    # INLINE here (not in its own contracts/components/schemas/ file),
    # following the ADR-034 precedent for the AgentCreateRequest wrapper:
    # this schema is no longer itself a oneOf, but the spec (ADR-057 FR-091)
    # explicitly pins its physical location to match that precedent rather
    # than introduce a new one.
    SessionPage:
      title: SessionPage
      description: >
        Paged envelope for GET /sessions (ADR-057 US-19/FR-091/FR-098).
        `sessions` is this page's rows: root sessions by default, that
        node's direct children when parent_session_id is supplied, or every
        session (roots and subordinates) when flat=true (FR-104).
        `partial_errors` composes with paging: a page whose merge hit a
        failing legacy per-agent store still returns its healthy rows,
        still returns next_cursor, and populates partial_errors — a failing
        store contributes zero rows and does not halt the page or
        invalidate the cursor (FR-098).
      type: object
      required:
      - sessions
      additionalProperties: false
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type: string
          description: >
            Opaque pagination cursor for the next page. Absent when this is
            the last page.
          example: "20"
        partial_errors:
          type: array
          items:
            type: string
          description: >
            Opaque error tokens (agent ID + sanitized reason) from any
            store that failed during this page's merge. Present only when
            at least one store failed.
    SessionCreateRequest:
      $ref: ./components/schemas/SessionCreateRequest.yaml
    SessionRenameRequest:
      $ref: ./components/schemas/SessionRenameRequest.yaml
    Message:
      $ref: ./components/schemas/Message.yaml
    ToolCall:
      $ref: ./components/schemas/ToolCall.yaml
    Attachment:
      $ref: ./components/schemas/Attachment.yaml
    MediaLibraryEntry:
      $ref: ./components/schemas/MediaLibraryEntry.yaml
    MediaAttachmentRequest:
      $ref: ./components/schemas/MediaAttachmentRequest.yaml
    LibraryWorkspaceNode:
      $ref: ./components/schemas/LibraryWorkspaceNode.yaml
    HostFolderListing:
      $ref: ./components/schemas/HostFolderListing.yaml
    HostFolderEntry:
      $ref: ./components/schemas/HostFolderEntry.yaml
    LibraryEntry:
      $ref: ./components/schemas/LibraryEntry.yaml
    LibraryEntryMount:
      $ref: ./components/schemas/LibraryEntryMount.yaml
    LibraryContentResponse:
      $ref: ./components/schemas/LibraryContentResponse.yaml
    LibraryContentRequest:
      $ref: ./components/schemas/LibraryContentRequest.yaml
    LibraryBinaryContentRequest:
      $ref: ./components/schemas/LibraryBinaryContentRequest.yaml
    CreateVaultRequest:
      $ref: ./components/schemas/CreateVaultRequest.yaml
    LibraryRenameRequest:
      $ref: ./components/schemas/LibraryRenameRequest.yaml
    LibraryUploadResponse:
      $ref: ./components/schemas/LibraryUploadResponse.yaml
    LibraryTransferRequest:
      $ref: ./components/schemas/LibraryTransferRequest.yaml
    LibraryMkdirRequest:
      $ref: ./components/schemas/LibraryMkdirRequest.yaml
    LibraryInlineDisposition:
      $ref: ./components/schemas/LibraryInlineDisposition.yaml
    LibraryPreviewTokenRequest:
      $ref: ./components/schemas/LibraryPreviewTokenRequest.yaml
    LibraryPreviewTokenResponse:
      $ref: ./components/schemas/LibraryPreviewTokenResponse.yaml
    KnowledgeBaseInfo:
      $ref: ./components/schemas/KnowledgeBaseInfo.yaml
    KnowledgeSearchRequest:
      $ref: ./components/schemas/KnowledgeSearchRequest.yaml
    KnowledgeSearchResponse:
      $ref: ./components/schemas/KnowledgeSearchResponse.yaml
    KnowledgeSearchHit:
      $ref: ./components/schemas/KnowledgeSearchHit.yaml
    KnowledgeSearchIncompleteness:
      $ref: ./components/schemas/KnowledgeSearchIncompleteness.yaml
    KnowledgeGraphResponse:
      $ref: ./components/schemas/KnowledgeGraphResponse.yaml
    KnowledgeGraphNode:
      $ref: ./components/schemas/KnowledgeGraphNode.yaml
    KnowledgeGraphEdge:
      $ref: ./components/schemas/KnowledgeGraphEdge.yaml
    KnowledgeGraphSkip:
      $ref: ./components/schemas/KnowledgeGraphSkip.yaml
    KnowledgeBaseViews:
      $ref: ./components/schemas/KnowledgeBaseViews.yaml
    KnowledgeBaseView:
      $ref: ./components/schemas/KnowledgeBaseView.yaml
    KnowledgeOutline:
      $ref: ./components/schemas/KnowledgeOutline.yaml
    KnowledgeOutlineHeading:
