      operationId: getMemorySettings
      summary: Get global memory and recap/retention settings
      description: >
        Returns the global memory/recap and retention settings (agents.defaults.*
        and storage.retention fields). Readable by any authenticated user.
        Never exposes secrets.
      tags:
        - Settings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current memory settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySettings'
        '401':
          $ref: '#/components/responses/401Unauthorized'
    put:
      operationId: updateMemorySettings
      summary: Update global memory and recap/retention settings
      description: >
        Writes the global memory/recap and retention settings. Reads/writes
        ONLY the MemorySettings fields — no merge of sibling config sections
        or secrets (A2/G-02). Writable by any authenticated user (operator
        decision, no admin gate). Uses safeUpdateConfigJSON server-side to
        preserve all other config fields including API keys.
      tags:
        - Settings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySettings'
      responses:
        '200':
          description: Updated memory settings (echoes the stored values).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySettings'
        '400':
          description: Invalid field value (e.g. negative session_days).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
  /settings/context:
    get:
      operationId: getContextSettings
      summary: Get the global context-budget settings (ADR-066 D9)
      description: >
        Returns the per-surface tool-result caps, the absolute trigger, the
        ingest bound, the global default context window and the per-(provider,
        model) window overrides. User-facing location: Settings → Models.
        Readable by any authenticated user (withAuth, the /settings/memory
        precedent — not RequireNotBypass).
      tags:
        - Settings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current context settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSettings'
        '401':
          $ref: '#/components/responses/401Unauthorized'
    put:
      operationId: updateContextSettings
      summary: Update the global context-budget settings (ADR-066 D9)
      description: >
        Partial update — an omitted field is unchanged; model_overrides, when
        present, replaces the whole list; default_context_window null clears
        it. 400 naming the field and the limit on: any cap > 150,000 or < 1;
        absolute_trigger_chars < 1; ingest_bound_bytes ≥ 8,388,608 or < 1;
        model_overrides[].context_window < 1. Every 200 write triggers a
        registry reload so the next turn uses the new values without a
        restart; overrides whose provider no longer exists are pruned on
        write. Writable by any authenticated user (withAuth).
      tags:
        - Settings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextSettingsUpdate'
      responses:
        '200':
          description: The stored settings after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSettings'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
  /channels:
    get:
      operationId: listChannels
      summary: List all channels
      description: 'Returns the full list of communication channels with their ID, name, transport, enabled state, and description. webchat is always enabled.

        '
      tags:
      - Channels
      responses:
        '200':
          description: Array of channel entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelEntry'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createChannelInstance
      summary: Create a new channel instance
      description: >
        Creates a new channel instance with key "<type>.<slug>" (ADR-029 FR-017).
        The instance starts disabled (enabled: false). Returns 409 if the
        instance key already exists, 400 if the type is unknown or the slug
        is malformed.
      tags:
      - Channels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelCreateRequest'
      responses:
        '201':
          description: Instance created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelCreateResponse'
        '400':
          description: Unknown channel type or malformed slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Instance key already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Config write failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /channels/{id}:
    get:
      operationId: getChannelConfig
      summary: Get a channel's configuration
      description: 'Returns the channel''s config with credential fields redacted (replaced with "[configured]" if set).

        '
      tags:
      - Channels
      parameters:
      - name: id
        in: path
        required: true
        description: Channel ID.
        schema:
          type: string
        example: telegram
      responses:
        '200':
          description: Channel configuration (credentials redacted).
          content:
            application/json:
              schema:
                type: object
                description: 'Channel-specific configuration object. Structure varies by channel type. Credential fields contain "[configured]" when set.

                  '
                additionalProperties: true
        '404':
          description: Channel ID not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteChannelInstance
      summary: Delete a channel instance
      description: >
        Deletes a channel instance: removes its config entry, credential refs,
        any stale channel-wildcard binding, and its per-instance state directory
        (e.g. WhatsApp store). Returns 404 for unknown instances and 400 for
        malformed ids. Bare-type keys (e.g. "telegram") can be deleted;
        "webchat" is a built-in and cannot be deleted.
      tags:
      - Channels
      parameters:
      - name: id
        in: path
        required: true
        description: Channel instance ID to delete.
        schema:
          $ref: '#/components/schemas/ChannelId'
        example: whatsapp.eu
      responses:
        '204':
          description: Instance deleted successfully.
        '400':
          description: Malformed channel id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Instance not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Config write failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /channels/{id}/enable:
