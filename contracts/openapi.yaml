  /library/move:
    post:
      operationId: moveLibraryEntry
      summary: Move a file or directory, optionally across two workspaces
      description: >
        Moves the entry at from_path (inside from_workspace_id's work
        tree) to to_path (inside to_workspace_id's work tree). Not scoped
        under {workspace_id} like the other Library operations because
        source and destination can be different workspaces — see
        LibraryTransferRequest. A same-workspace move (from_workspace_id
        == to_workspace_id) is exactly what
        POST /library/{workspace_id}/rename does as same-workspace sugar
        over this operation. Cross-workspace transfer is permitted for the
        authenticated UI/CLI user only — never for an agent tool; agents
        stay confined to their own workspace's work tree (enforced
        server-side). Returns 403 if either path resolves outside its
        workspace's work tree; 404 if from_workspace_id/to_workspace_id
        does not exist, nothing exists at from_path, OR to_path's parent
        directory does not exist yet — this operation deliberately does NOT
        auto-create missing destination directories (matching `mv`
        semantics), but the 404 message names the specific missing
        directory rather than a bare "not found"; create it first with
        POST /library/{workspace_id}/mkdir. 409 if an entry already exists
        at to_path.
      tags:
      - Library
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryTransferRequest'
      responses:
        '200':
          description: The moved entry, at its new workspace and path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /library/copy:
    post:
      operationId: copyLibraryEntry
      summary: Copy a file or directory, optionally across two workspaces
      description: >
        Copies the entry at from_path (inside from_workspace_id's work
        tree) to to_path (inside to_workspace_id's work tree), leaving the
        source in place. Directory copies are recursive. Not scoped under
        {workspace_id} for the same reason as /library/move — see
        LibraryTransferRequest. Cross-workspace transfer is permitted for
        the authenticated UI/CLI user only — never for an agent tool;
        agents stay confined to their own workspace's work tree (enforced
        server-side). Returns 403 if either path resolves outside its
        workspace's work tree; 404 if from_workspace_id/to_workspace_id
        does not exist, nothing exists at from_path, OR to_path's parent
        directory does not exist yet — this operation deliberately does NOT
        auto-create missing destination directories (matching `cp`
        semantics), but the 404 message names the specific missing
        directory rather than a bare "not found"; create it first with
        POST /library/{workspace_id}/mkdir. 409 if an entry already exists
        at to_path.
      tags:
      - Library
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryTransferRequest'
      responses:
        '201':
          description: The new copy, at its destination workspace and path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /library/{workspace_id}/entries:
    get:
      operationId: listLibraryEntries
      summary: List a directory inside a workspace's work tree
      description: >
        Lists the entries directly inside the given workspace-relative
        directory path (library-spec.md D-2 — entries are paths, not
        UUIDs). Omit path or pass an empty string to list the work-tree
        root — the Library explorer shows the WHOLE work/ directory, not
        merely the reserved work/.library/ upload directory (that is just
        one entry inside it). By default, entries whose name begins with a
        dot (".") are omitted from the listing — see include_hidden to
        include them and LibraryEntry.is_hidden for the definition. Returns
        403 if path resolves outside the workspace's work tree (traversal
        or an out-of-root symlink); 404 if the workspace or the directory
        itself does not exist.
      tags:
      - Library
      security:
      - BearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      - name: path
        in: query
        required: false
        schema:
          type: string
          default: ""
        description: >
          Workspace-relative directory path to list. Empty or absent lists
          the work-tree root.
        example: "notes"
      - name: include_hidden
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: >
          When true, also returns entries whose name begins with a dot
          (".") — e.g. the reserved work/.library/ upload directory.
          Defaults to false (hidden entries omitted) so the explorer's
          default view matches a conventional file browser.
        example: false
      responses:
        '200':
          description: Entries directly inside the requested directory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryEntry'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    delete:
      operationId: deleteLibraryEntry
      summary: Delete a file or directory from a workspace's work tree
      description: >
        Deletes the file or directory at the given workspace-relative path.
        Deleting a directory removes it and everything under it. Returns
        403 if path resolves outside the workspace's work tree; 404 if
        nothing exists at path.
      tags:
      - Library
      security:
      - BearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      - name: path
        in: query
        required: true
        schema:
          type: string
        description: Workspace-relative path of the file or directory to delete.
        example: "uploads/draft.md"
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /library/{workspace_id}/content:
    get:
      operationId: getLibraryContent
      summary: Read a file's text content for the Library editor/viewer
      description: >
        Returns the text content of the file at path for the SPA editor
        (library-spec.md D-5), with explicit is_text / too_large fields so
        the SPA falls back to GET .../download rather than guessing from
        the content field. Returns 403 if path resolves outside the
        workspace's work tree; 404 if path does not exist or names a
        directory.
      tags:
      - Library
      security:
      - BearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      - name: path
        in: query
        required: true
        schema:
          type: string
        description: Workspace-relative path of the file to read.
        example: "uploads/report.md"
      responses:
        '200':
          description: File text content (or the is_text/too_large signal that it cannot be inlined).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryContentResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    put:
      operationId: putLibraryContent
      summary: Write a file's text content from the Library editor
      description: >
        Writes text content to the file at the given workspace-relative
        path (library-spec.md D-5), creating the file if it does not
        already exist and overwriting any existing content entirely.
        Returns 403 if path resolves outside the workspace's work tree;
        404 if the path's parent directory does not exist.
      tags:
      - Library
      security:
      - BearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryContentRequest'
      responses:
        '200':
          description: The written file's updated entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /library/{workspace_id}/upload:
    post:
      operationId: uploadLibraryFiles
      summary: Upload files into a directory in a workspace's work tree
      description: >
        Streams a multipart upload directly into the given workspace-relative
        directory (library-spec.md D-1 — uploads land as real, named files
        inside the work tree, de-duplicated with a numeric suffix on
        collision). Omit path or pass an empty string to upload into the
        work-tree root. Returns 403 if path resolves outside the
        workspace's work tree; 404 if the target directory does not exist.
      tags:
      - Library
      security:
      - BearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      - name: path
        in: query
        required: false
        schema:
          type: string
          default: ""
        description: >
          Workspace-relative directory to upload into. Empty or absent
          uploads into the work-tree root.
        example: "uploads"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more files to upload.
      responses:
        '201':
          description: Files uploaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryUploadResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /library/{workspace_id}/mkdir:
    post:
      operationId: createLibraryDirectory
      summary: Create a directory in a workspace's work tree
      description: >
        Creates the directory at path, creating any missing intermediate
        directories along the way (mkdir -p semantics) — the sole
        directory-creation primitive the Library API exposes. Idempotent:
        returns 200 if a directory already exists at path; 201 if a new
        directory (or chain of directories) was created. Returns 403 if path
        resolves outside the workspace's work tree; 409 if a regular FILE
        already exists at path.
      tags:
      - Library
      security:
      - BearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryMkdirRequest'
      responses:
        '200':
          description: The directory already existed — no change made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '201':
          description: The directory (and any missing intermediate directories) was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /library/{workspace_id}/rename:
    post:
      operationId: renameLibraryEntry
      summary: Rename or move a file or directory within one workspace
      description: >
        Renames or moves the entry at "from" to "to" within this single
        workspace's work tree (library-spec.md D-2). "to" may name a
        different parent directory than "from", so this operation doubles
        as an in-workspace move. This is same-workspace sugar over
        POST /library/move (equivalent to calling it with
        from_workspace_id == to_workspace_id == {workspace_id}) — kept as
        a dedicated operation, alongside /library/move, so a caller doing
        only in-workspace renames never needs to know its own workspace id
        twice. Returns 400 if "to" begins with a ".." segment anywhere in
        the path (rejected outright as a sanity check — such a name isn't a
        traversal, but this package's hidden-entry heuristic also matches
        it, so it would otherwise succeed and immediately vanish from the
        default listing); 403 if either path resolves outside the
        workspace's work tree; 404 if nothing exists at "from" OR "to"'s
        parent directory does not exist yet (this operation deliberately
        does NOT auto-create missing destination directories — the message
        names the specific missing directory; create it first with
        POST /library/{workspace_id}/mkdir); 409 if an entry already exists
        at "to".
      tags:
      - Library
      security:
      - BearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryRenameRequest'
      responses:
        '200':
          description: The renamed entry, reflecting its new path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /library/{workspace_id}/download:
    get:
      operationId: downloadLibraryFile
      summary: Download the raw bytes of a file in a workspace's work tree
      description: >
        Streams the raw bytes of the file at path with a best-effort
        Content-Type and a Content-Disposition attachment filename. The
        binary counterpart to GET .../content — used for non-text files
        and for text files GET .../content reports as too_large. Returns
        403 if path resolves outside the workspace's work tree; 404 if
        path does not exist or names a directory.
      tags:
      - Library
      security:
      - BearerAuth: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      - name: path
        in: query
        required: true
        schema:
          type: string
        description: Workspace-relative path of the file to download.
        example: "uploads/Copy of elicify_company_profile.pptx"
      responses:
        '200':
          description: File content streamed with a best-effort Content-Type.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /workspaces/{id}/delegation:
    get:
      operationId: getWorkspaceDelegation
      summary: Get a workspace's delegation graph
      description: >
        Returns the per-workspace delegation graph (M5): the directed delegation
        edges plus the computed team node set. Returns 200 with an empty edges
        array when the workspace exists but has no delegation configured.
        Returns 404 when the workspace does not exist.
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      responses:
        '200':
          description: The workspace delegation graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDelegation'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
    put:
      operationId: updateWorkspaceDelegation
      summary: Replace a workspace's delegation graph
      description: >
        Replaces the workspace's delegation edge set wholesale (full replace).
        Validates that every from_agent / to_agent resolves to a known agent,
        rejects self-edges, and rejects depths above the global subturn ceiling.
        Returns the updated graph.
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceDelegationUpdateRequest'
      responses:
        '200':
          description: The updated workspace delegation graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDelegation'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /workspaces/{id}/mounts:
    post:
      operationId: createWorkspaceMount
      summary: Create a workspace mount (a named write-grant on a real local folder)
      description: >
        FR-7.1/FR-5, ADR-063 D4/D6. Validates the name shape and uniqueness
        (400 on an invalid name, a collision with an existing mount, or a
        collision with an existing entry in work/; 400 also when host_path
        does not resolve to an existing, real, on-disk directory), resolves
        host_path to its realpath, and refuses (403) a target that IS or lies
        INSIDE $OMNIPUS_HOME (FR-7.5 — checked on the realpath-resolved
        target, so a symlink to it is refused too) — this is a policy
        refusal, not malformed input. Otherwise creates the mount and
        materialises it as a symlink under the workspace's work/ directory. A
        target that is broad but not refused (the operator's own home
        directory, the filesystem root, or a location that CONTAINS
        $OMNIPUS_HOME) still succeeds (201) but returns a non-empty `warning`
        (FR-7.4/FR-7.6) — the secret set is subtracted from every grant
        regardless of where it came from, so a broad mount is allowed, but the
        operator must be told what it covers. Takes effect immediately for
        every agent on the workspace — no restart (FR-8.1).
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMountCreateRequest'
      responses:
        '201':
          description: The created mount, with a warning field when the target was broad but not refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMountCreateResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /workspaces/{id}/mounts/{name}:
    delete:
      operationId: deleteWorkspaceMount
      summary: Delete a workspace mount (revoke a write-grant)
      description: >
        FR-7.3/FR-8.6. Removes the mount's symlink under work/ and its record
        from the workspace. The operator's real folder at the mount's
        host_path, and everything inside it, is never touched — only the
        symlink and the mount record are removed. Returns 404 both when id
        does not name a known workspace and when name does not name any
        mount on it. Takes effect immediately for every agent on the
        workspace — no restart (FR-8.1).
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: The mount's name.
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Unknown workspace ID, or name does not name any mount on this workspace.
          $ref: '#/components/responses/404NotFound'

  /workspaces/{id}/instructions:
    get:
      operationId: getWorkspaceInstructions
      summary: Get a workspace's Project Instructions (AGENT.md content)
      description: >
        Returns the current content of the workspace's AGENT.md (Workspace /
        Project Instructions) from workspaces/<id>/AGENT.md. This text is injected
        as a per-turn context layer for every agent acting in the workspace.
        Returns empty string when the file does not exist. Returns 404 when the
        workspace does not exist. Requires authentication.
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      responses:
        '200':
          description: Current AGENT.md content (may be empty string).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInstructionsResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    put:
      operationId: putWorkspaceInstructions
      summary: Set a workspace's Project Instructions (replace AGENT.md content)
      description: >
        Replaces the entire content of the workspace's AGENT.md
        (workspaces/<id>/AGENT.md) with the provided string. Passing an empty
        string clears the file. The new content is returned in the response.
        Returns 404 when the workspace does not exist. Requires authentication.
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInstructionsRequest'
      responses:
        '200':
          description: Updated AGENT.md content (echoed back).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInstructionsResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /workspaces/{id}/plans:
    get:
      operationId: listWorkspacePlans
      summary: List plans in a workspace
      description: >
        Returns every Plan whose workspace_id matches, newest-first by
        created_at, with `progress`/`plan_phase`/`failed_reason` server-computed
        (ADR-049 D1, mirrors the removed MilestoneListResponse).
      tags:
      - Plans
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      responses:
        '200':
          description: Plans for this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
    post:
      operationId: createWorkspacePlan
      summary: Create a plan in a workspace
      description: >
        Creates a new Plan in `draft` state (ADR-049 D1). Member tasks are
        linked afterward via `Task.plan_id` (same-workspace FK, validated).
      tags:
      - Plans
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreateRequest'
      responses:
        '201':
          description: Created plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /plans/{id}:
    get:
      operationId: getPlan
      summary: Get a plan by ID
      description: >
        Returns a single plan with `progress`/`plan_phase`/`failed_reason`
        server-computed read-time (ADR-049 D1).
      tags:
      - Plans
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Plan ID.
      responses:
        '200':
          description: Plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
    put:
      operationId: updatePlan
      summary: Update a plan
      description: >
        Partially updates plan fields (PATCH semantics — only provided fields
        change). `state` drives the canonical 5-value state machine; illegal
        transitions are rejected 400. Use POST /plans/{id}/approve for the
        tiered-DoD-checked draft->approved transition rather than setting
        `state` directly here (this endpoint applies
        `plan.ValidateStateTransition` with no DoD/criteria gating).
      tags:
      - Plans
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Plan ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanUpdateRequest'
      responses:
        '200':
          description: Updated plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
    delete:
      operationId: deletePlan
      summary: Delete a plan
      description: >
        Deletes a plan by ID. A `running` plan cannot be deleted (409) — stop
        it first via POST /plans/{id}/stop. Deleting a non-running plan clears
        `plan_id` on its member tasks (best-effort, SD-A5).
      tags:
      - Plans
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Plan ID.
      responses:
        '204':
          description: Plan deleted.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /plans/{id}/approve:
    post:
      operationId: approvePlan
      summary: Approve a draft plan
      description: >
        Transitions a `draft` plan to `approved` (ADR-049 D1/D5, Round-1 Grill
        Reconciliation R1). Runs the tiered Definition-of-Done check (strict
        for agent-authored plans, soft for human/UI-authored plans) and the
        UNCONDITIONAL member-task-criteria gate (FR-084 — every member task
        must carry >=1 criterion in every tier). On success the single
        plan-engine instance auto-advances `approved` -> `running` on its next
        tick and begins dispatch — there is no separate "start" action.
      tags:
      - Plans
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Plan ID.
      responses:
        '200':
          description: Approved plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          description: >
            Approval rejected — either a plan-level gate (not in draft state,
            or a strict-tier plan with an empty Definition of Done) or the
            unconditional per-task criteria gate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanApproveError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /plans/{id}/stop:
    post:
      operationId: stopPlan
      summary: Stop a running plan
      description: >
        Transitions a `running` plan to `failed` with
        `failed_reason: stopped_by_user` (ADR-049 D4, SD-C5 — Stop/Clear may
        be optimistic client-side, as this cannot validation-fail). Rejected
        400 when the plan is not currently `running`.
      tags:
      - Plans
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Plan ID.
      responses:
        '200':
          description: Stopped plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /plans/{id}/restart:
    post:
      operationId: restartPlan
      summary: Restart a stopped plan
      description: >
        Restarts a plan previously stopped by the user (`state: failed`,
        `failed_reason: stopped_by_user`) — the Play route (ADR-052
        FR-026). Resets every non-`done` member task to `next`/`blocked`
        with `attempt_count` reset to 0, resets the plan's `judge_rounds`
        to 0, preserves `done` members and their evidence, clears
        `failed_reason`, and transitions the plan to `approved` (NOT
        directly to `running`) via a store-level reason-aware guard that
        permits only `failed[stopped_by_user] -> approved` — the engine
        then promotes `approved -> running` under the global active-loop
        cap on its next tick, exactly like a first execute (restarting
        straight to `running` would skip cap admission). Rejected 409 when
        the plan is not `failed`, or its `failed_reason` is not
        `stopped_by_user` (e.g. `judge_rounds_exhausted` or `idle_expired`
        are not restartable — no Play offered for those). Rejected 400 on
        a malformed request.
      tags:
      - Plans
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Plan ID.
      responses:
        '200':
          description: Restarted plan (state `approved`, `failed_reason` cleared).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /stats/tokens:
    get:
      operationId: getTokenStats
      summary: Get per-agent token usage summary
      description: >
        Aggregates token usage from SessionMeta.Stats across all session files
        for the requested period. period=month means the current calendar month UTC.
        No dollar estimates — token counts only.
      tags:
      - Stats
      security:
      - BearerAuth: []
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
          enum: [day, week, month, all]
          default: month
        description: >
          Aggregation period. day=current calendar day UTC; week=current ISO
          week (Mon–Sun) UTC; month=current calendar month UTC; all=all time.
      responses:
        '200':
          description: Token usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenUsageSummary'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /system/folders:
    get:
      operationId: listHostFolders
      summary: List directories on the operator's machine, for the mount folder picker
      description: >
        Returns the directories directly inside `path`, each with a verdict on
        whether it may be mounted into a workspace.

        It exists because a web page cannot open the native folder picker and
        learn a real filesystem path — the browser withholds it — so without a
        server-side listing the only way to add a mount is to type an absolute
        path from memory.

        It exposes nothing new: post-ADR-062 reading is open, so an agent can
        already read anywhere on this machine. This gives the OPERATOR the same
        view. Admin-authenticated, read-only, and deliberately not reachable
        from any agent tool — an agent that wants a folder asks for it and the
        operator approves, rather than browsing for one itself.
      tags:
      - system
      security:
      - BearerAuth: []
      parameters:
      - name: path
        in: query
        required: false
        description: >
          Absolute path to list. Defaults to the operator's home directory,
          which is where a folder picker should sensibly open.
        schema:
          type: string
      responses:
        '200':
          description: The directory listing.
          content:
            application/json:
              schema:
                $ref: './components/schemas/HostFolderListing.yaml'
        '400':
          description: The path was relative, malformed, or not a directory.
          content:
            application/json:
              schema:
                $ref: './components/schemas/ErrorResponse.yaml'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: './components/schemas/ErrorResponse.yaml'
        '404':
          description: The path does not exist.
          content:
            application/json:
              schema:
                $ref: './components/schemas/ErrorResponse.yaml'
  /system/cli-detect:
    get:
      operationId: getHostCliDetect
      summary: Probe host PATH and well-known locations for the three external-CLI runners
      description: >
        Reports, per external-CLI runner (claude-code/codex/opencode), whether
        the gateway process can locate its binary — searching $PATH first,
        then a curated per-OS well-known-install-location list — and returns
        the resolved absolute path plus which strategy found it. Read-only,
        idempotent, and unaudited (no subprocess spawned). The SPA roster uses
        this to grey-out CLIs the host cannot run, and the create wizard /
        edit form use the returned path to prefill executor.cli_path. Pure Go
        probe (no shell-out).
      tags:
      - system
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Per-CLI detection result (installed, resolved path, source).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliDetect'
        '401':
          $ref: '#/components/responses/401Unauthorized'
  /system/cli-validate:
    post:
      operationId: postSystemCliValidate
      summary: Validate that an external-CLI binary runs at a given path
      description: >
        Stateless, create-time validation for an external-executor CLI:
        confirms the binary at cli_path actually runs and reports a version,
        before the operator saves the subagent_3p agent. Reuses
        runner.TestConnectionWithPath verbatim (the same handshake as
        POST /agents/{id}/runner/test) — the only requirement is that the
        binary runs and returns a valid version-shaped response; no per-CLI
        identity/name match is performed. Gated withAuth at create-parity
        (the same authorization as createAgent).
        Rejects a target that is not a regular, executable file before
        spawning it (classified "missing-binary", no spawn attempt). Applies
        a dedicated rate limiter and a small per-caller in-flight
        concurrency cap, and emits one audit event {cli, resolved_path,
        reason} per call — validation spawns a caller-supplied path, unlike
        the unaudited cli-detect probe.
      tags:
      - system
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliValidateRequest'
      responses:
        '200':
          description: >
            Validation classification. Always 200 (even for missing-binary /
            handshake-failed / unknown-cli) — the classification result is
            carried in the response body's `reason` field, not the HTTP
            status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliValidateResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'

security:
- BearerAuth: []
