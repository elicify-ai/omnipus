  /workspaces/{id}/media/{media_id}:
    get:
      operationId: getWorkspaceMedia
      summary: Get a workspace media-library entry
      tags:
      - Workspace Media
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      - name: media_id
        in: path
        required: true
        schema:
