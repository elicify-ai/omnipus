                    type: string
                    enum:
                    - restored
                    example: restored
                  filename:
                    type: string
                    example: backup-20260516T103000Z.tar.gz
        '400':
          description: Invalid filename (path traversal, missing .tar.gz).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Backup file not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Filename field is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /storage/stats:
    get:
      operationId: getStorageStats
      summary: Get storage statistics
      description: 'Returns session count, workspace size, and memory entry count. May include partial warnings if some agent stores could not be read.

        '
      tags:
      - Settings
      responses:
        '200':
          description: Storage statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageStats'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/all:
    delete:
      operationId: clearAllSessions
      summary: Delete all sessions for all agents
      description: 'Removes all session directories across all agent stores. Returns the count of removed sessions and any per-agent warnings.

        '
      tags:
      - Settings
      responses:
        '200':
          description: Sessions cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearAllSessionsResponse'
        '405':
