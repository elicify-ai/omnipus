          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /credentials/rotate:
    post:
      operationId: rotateCredentials
      summary: Rotate the credential vault key via a new passphrase
      description: >
        Re-encrypts the entire credential vault under a new Argon2id key derived
        from new_passphrase (and a fresh salt). Sensitive change — requires a
        re-auth consent token in the X-Reauth-Token header (Spec-6 FR-12.2 /
        ADR-022). No restart is required; the in-memory key is updated in place.
      tags:
      - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRotateRequest'
      responses:
        '200':
          description: Vault re-encrypted under the new passphrase.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - rotated
                    example: rotated
        '400':
          description: Invalid request (e.g. empty passphrase).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Re-auth required or invalid consent token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Credential store locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /backup:
    post:
      operationId: createBackup
      summary: Create a backup archive
      description: 'Creates a tar.gz of ~/.omnipus/ excluding logs and backups directories. The archive is written atomically to ~/.omnipus/backups/.

        '
      tags:
      - Settings
      responses:
        '200':
          description: Backup created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupCreateResponse'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /backups:
    get:
      operationId: listBackups
      summary: List backup archives
      description: 'Lists all .tar.gz files in ~/.omnipus/backups/ with filename, size, and creation time. Returns an empty array when no backups exist.

        '
      tags:
      - Settings
      responses:
        '200':
          description: List of backup archive entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - filename
                  - size_bytes
                  - created_at
                  properties:
                    filename:
                      type: string
                      example: backup-20260516T103000Z.tar.gz
                    size_bytes:
                      type: integer
                      format: int64
                      minimum: 0
                      example: 1048576
                    created_at:
                      type: string
                      format: date-time
                      example: '2026-05-16T10:30:00Z'
        '405':
