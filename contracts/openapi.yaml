  /security/exec-allowlist:
    get:
      operationId: getExecAllowlist
      summary: Get exec binary allowlist (SEC-05)
      description: 'Returns the current exec allowlist and approval mode.

        '
      tags:
      - Security
      responses:
        '200':
          description: Current exec allowlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecAllowlist'
