openapi: 3.0.3
info:
  title: Omnipus REST API
  version: 0.1.0
  description: 'REST API surface for the Omnipus agentic gateway. All endpoints are under /api/v1. Authentication uses Bearer tokens issued by /auth/login or /onboarding/complete. State-changing requests must include the X-CSRF-Token header echoing the __Host-csrf cookie value (double-submit cookie, issue #97). See src/lib/api.ts for the CSRF_EXEMPT_PATHS list (endpoints that issue the cookie and cannot require it to be present yet).

    '
  contact:
    name: Omnipus contributors
    url: https://omnipus.ai
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:5000/api/v1
  description: Local development gateway (default port 5000)
tags:
- name: auth
  description: "Authentication \u2014 login, logout, token validation, password management."
- name: onboarding
  description: "First-run onboarding wizard \u2014 provider probe and atomic setup."
- name: sessions
  description: Chat/task/channel session CRUD and transcript access.
- name: agents
  description: Agent configuration CRUD and per-agent session listing.
- name: security
  description: Security configuration endpoints (session scope, etc.).
- name: Health
  description: Health check endpoint
- name: About
  description: Gateway metadata and version information
- name: Tools
  description: Tool registry, per-agent tool policies, and tool approval resolution
- name: Security
  description: Security configuration endpoints (exec allowlist, skill trust, prompt guard, rate limits, sandbox, retention)
- name: Audit
  description: Audit log entries and audit logging toggle
- name: Channels
  description: Communication channel configuration and management
- name: Commands
  description: Surface-aware slash-command registry (web palette source of truth)
- name: Config
  description: Config state introspection (pending restarts)
- name: Workspace
  description: Agent workspace file access
- name: Library
  description: >
    File explorer over the FULL workspace work tree (library-spec.md D-2)
    — list, read, write, rename/move, copy, delete, upload, download, and
    create-directory operations by workspace-relative path. Entries are
    paths, not UUIDs, distinct from the UUID-keyed Workspace Media library.
    Move and copy additionally support transferring an entry across two
    DIFFERENT workspaces (user-only, never agent-invoked). Dot-prefixed
    entries (e.g. the reserved work/.library/ upload directory) are hidden
    from directory listings by default; a name beginning with a ".."
    segment is rejected outright (not merely hidden) since that heuristic
    would otherwise also match it.
- name: Preview
  description: Agent-generated preview content served on the main gateway listener at /preview/ (token-authenticated, ADR-044)
- name: Agents
  description: Agent management endpoints
- name: Settings
  description: Credentials, backup/restore, and storage management
- name: Workspaces
  description: Workspace management — create, list, update, delete, and session linking.
- name: Tasks
  description: >
    The unified workspace task surface (Sprint 2) — one entity covering capture,
    triage, dependencies, todos, triggers, and delegation. Replaces the former
    split between workflow /tasks and GTD /board/tasks.
- name: Plans
  description: >
    Plan entities (ADR-049) — group an executable task DAG under a goal,
    Definition of Done, owner agent, and state machine. Replaces Milestones.
- name: Stats
  description: Usage statistics and aggregations.
- name: system
  description: System-level probes (e.g. host-CLI availability) — read-only diagnostics used by the SPA roster UI.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Programmatic/CLI bearer token. The browser SPA does NOT use this: since ADR-044 it authenticates via the HttpOnly `omnipus-session` cookie (set by /auth/login and /onboarding/complete, sent automatically with credentials:include) and stores no JS-readable token. Bearer remains accepted server-side as an additive path for CLI/programmatic clients.

        '
  schemas:
    ErrorResponse:
      $ref: ./components/schemas/ErrorResponse.yaml
    LoginRequest:
      $ref: ./components/schemas/LoginRequest.yaml
    LoginResponse:
      $ref: ./components/schemas/LoginResponse.yaml
    BrowserInspectRequest:
      $ref: ./components/schemas/BrowserInspectRequest.yaml
    BrowserInspectResponse:
      $ref: ./components/schemas/BrowserInspectResponse.yaml
    ChangePasswordRequest:
      $ref: ./components/schemas/ChangePasswordRequest.yaml
    # OnboardingCompleteRequest is hosted INLINE here because its `provider`
    # member is a discriminated union (ADR-068 MAJ-014) and oapi-codegen only
    # emits named variant structs + As*/From* accessors for a oneOf over
    # INTERNAL component refs (ADR-034 precedent, AgentCreateRequest). The
    # inbound-validator twin lives in
    # contracts/components/schemas/OnboardingCompleteRequest.yaml with file
    # refs over the same two variants — keep both in lockstep.
    OnboardingCompleteRequest:
      type: object
      title: OnboardingCompleteRequest
      description: >
        Body for POST /onboarding/complete. Atomically sets up the first LLM
        provider and creates the initial admin account. CSRF-exempt (no cookie
        exists at this point). `provider` is discriminated by `auth_method`:
        `api_key` requires `api_key`; `sign_in` forbids it (ADR-068 MAJ-014).
      required:
        - provider
        - admin
      additionalProperties: false
      properties:
        provider:
          description: LLM provider configuration to persist, discriminated by `auth_method`.
          oneOf:
            - $ref: '#/components/schemas/OnboardingProviderApiKey'
            - $ref: '#/components/schemas/OnboardingProviderSignIn'
          discriminator:
            propertyName: auth_method
            mapping:
              api_key: '#/components/schemas/OnboardingProviderApiKey'
              sign_in: '#/components/schemas/OnboardingProviderSignIn'
        admin:
          type: object
          description: Initial admin account credentials.
          required:
            - username
            - password
          properties:
            username:
              type: string
              minLength: 2
              maxLength: 63
              pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{1,62}$'
              description: Admin login name.
              example: "admin"
            password:
              type: string
              minLength: 8
              description: Admin password. Minimum 8 characters.
              example: "s3cr3tpassword"
    OnboardingProviderApiKey:
      $ref: ./components/schemas/OnboardingProviderApiKey.yaml
    OnboardingProviderSignIn:
      $ref: ./components/schemas/OnboardingProviderSignIn.yaml
    # SignInStartResponse is a discriminated union hosted INLINE here (not in
    # a schema file), following the ADR-034 precedent for AgentCreateRequest:
    # oapi-codegen only generates named variant types + As/From accessors for
    # a oneOf over INTERNAL component refs. The two variants remain one file
    # each under contracts/components/schemas/.
    SignInStartResponse:
      description: >
        Response from POST /providers/{id}/sign-in (ADR-068 FR-008, amended
        2026-08-23 §8b). `cli_login` for codex-cli / github-copilot: the
        vendor CLI's own login command, run by the operator in a terminal.
        `device_code` for openai-chatgpt (and xai once its catalog row
        carries sign_in): Omnipus requests a device code itself and the SPA
        shows the verification link and user code. Discriminated by
        `method`.
      oneOf:
        - $ref: '#/components/schemas/SignInStartResponseCliLogin'
        - $ref: '#/components/schemas/SignInStartResponseDeviceCode'
      discriminator:
        propertyName: method
        mapping:
          cli_login: '#/components/schemas/SignInStartResponseCliLogin'
          device_code: '#/components/schemas/SignInStartResponseDeviceCode'
    SignInStartResponseCliLogin:
      $ref: ./components/schemas/SignInStartResponseCliLogin.yaml
    SignInStartResponseDeviceCode:
      $ref: ./components/schemas/SignInStartResponseDeviceCode.yaml
    SignInStatus:
      $ref: ./components/schemas/SignInStatus.yaml
    SignInPollRequest:
      $ref: ./components/schemas/SignInPollRequest.yaml
    SignInPollResponse:
      $ref: ./components/schemas/SignInPollResponse.yaml
    OnboardingCompleteResponse:
      $ref: ./components/schemas/LoginResponse.yaml
    ProbeProviderRequest:
      $ref: ./components/schemas/ProbeProviderRequest.yaml
    ProbeProviderResponse:
      $ref: ./components/schemas/ProbeProviderResponse.yaml
    Session:
      $ref: ./components/schemas/Session.yaml
    SessionStats:
      $ref: ./components/schemas/SessionStats.yaml
    SessionDetail:
      $ref: ./components/schemas/SessionDetail.yaml
    # SessionPage is the paged envelope for GET /sessions (ADR-057 FR-091,
    # grill2 M2-10). It REPLACES the historic two-variant oneOf (a bare
    # Session array, or {sessions, partial_errors}) with one shape. Hosted
    # INLINE here (not in its own contracts/components/schemas/ file),
    # following the ADR-034 precedent for the AgentCreateRequest wrapper:
    # this schema is no longer itself a oneOf, but the spec (ADR-057 FR-091)
    # explicitly pins its physical location to match that precedent rather
    # than introduce a new one.
    SessionPage:
      title: SessionPage
      description: >
        Paged envelope for GET /sessions (ADR-057 US-19/FR-091/FR-098).
        `sessions` is this page's rows: root sessions by default, that
        node's direct children when parent_session_id is supplied, or every
        session (roots and subordinates) when flat=true (FR-104).
        `partial_errors` composes with paging: a page whose merge hit a
        failing legacy per-agent store still returns its healthy rows,
        still returns next_cursor, and populates partial_errors — a failing
        store contributes zero rows and does not halt the page or
        invalidate the cursor (FR-098).
      type: object
      required:
      - sessions
      additionalProperties: false
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type: string
          description: >
            Opaque pagination cursor for the next page. Absent when this is
            the last page.
          example: "20"
        partial_errors:
          type: array
          items:
            type: string
          description: >
            Opaque error tokens (agent ID + sanitized reason) from any
            store that failed during this page's merge. Present only when
            at least one store failed.
    SessionCreateRequest:
      $ref: ./components/schemas/SessionCreateRequest.yaml
    SessionRenameRequest:
      $ref: ./components/schemas/SessionRenameRequest.yaml
