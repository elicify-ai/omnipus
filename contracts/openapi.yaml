  /upload:
    post:
      operationId: uploadFiles
      summary: Upload files for a session
      description: "Streams multipart file uploads to disk under ~/.omnipus/uploads/{session_id}/.\nMax file size per part: 100 MB. Data is streamed directly to disk; the full file is never buffered in memory.\nsession_id may be supplied as a query parameter or as a form field before the file parts.\nReturns HTTP 201 on success.\n"
