      - name: ref
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
        description: Opaque ref id from the matching ToolResultRef sentinel.
      responses:
        '200':
          description: The original tool result body.
          content:
            application/json:
              schema:
                description: Original tool return value of any JSON type.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
