  /agents/{id}/mailboxes/{workspaceId}:
    get:
      operationId: getAgentMailbox
      summary: Get one (agent, workspace) email mailbox account (M11)
      description: >
        Returns the mailbox the agent holds in the given workspace. An agent can
        hold a different mailbox in each workspace it belongs to (different
        roles, different inboxes). Email is a TOOL surface (read_inbox,
        search_email, read_message, send_email, reply), not a conversational
        channel. The mailbox password is never returned; the `configured` flag
        reports whether a password is on file in the credential store.
      tags:
      - Agents
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Agent ID.
        schema:
          type: string
        example: mia
      - name: workspaceId
        in: path
        required: true
        description: Workspace ID the mailbox surfaces in.
        schema:
          type: string
        example: ws_my_workspace
      responses:
        '200':
          description: The (agent, workspace) mailbox account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mailbox'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Agent not found, or no mailbox configured for the agent in this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    put:
      operationId: setAgentMailbox
      summary: Configure one (agent, workspace) email mailbox account (M11)
      description: >
        Configures the mailbox the agent holds in the given workspace. Every
        (agent, workspace) pair may have its own mailbox — an agent plays
        different roles in different workspaces and can have a distinct inbox in
        each. The password, when present, is routed into the encrypted
        credential store and persisted only as a reference — it is never
        written to config.json. Unhandled inbound mail becomes Board tasks in
        THIS workspace, assigned to the owning agent. The email tools resolve
        the active workspace from the turn context at execution time — never
        from a model-supplied parameter.
      tags:
      - Agents
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Agent ID.
        schema:
          type: string
        example: mia
      - name: workspaceId
        in: path
        required: true
        description: Workspace ID the mailbox surfaces in.
        schema:
          type: string
        example: ws_my_workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailboxConfigureRequest'
      responses:
        '200':
          description: The saved (agent, workspace) mailbox account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mailbox'
        '400':
          description: Missing or invalid required field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    delete:
      operationId: deleteAgentMailbox
      summary: Remove one (agent, workspace) email mailbox account (M11)
      description: >
        Removes the mailbox the agent holds in the given workspace from config
        and deletes its stored password from the credential store. The agent's
        email tools for this workspace are de-registered on the next reload;
        mailboxes the agent holds in OTHER workspaces are untouched.
      tags:
      - Agents
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Agent ID.
        schema:
          type: string
        example: mia
      - name: workspaceId
        in: path
        required: true
        description: Workspace ID the mailbox surfaces in.
        schema:
          type: string
        example: ws_my_workspace
      responses:
        '200':
          description: Mailbox removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Agent not found, or no mailbox configured for the agent in this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /mailboxes:
    get:
      operationId: listMailboxes
      summary: List all configured email mailbox accounts (M11)
      description: >
        Returns every configured mailbox account (one per (agent, workspace)
        pair). The mailbox password is never returned; each
        entry's `configured` flag reports whether a password is on file in the
        credential store. An empty list means no mailbox is configured — this
        endpoint never 404s, so the SPA can show mailbox status without
        per-agent probe requests.
      tags:
      - Agents
      security:
      - BearerAuth: []
      responses:
        '200':
          description: All configured mailboxes (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxListResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /config/gateway/rotate-token:
    post:
      operationId: rotateGatewayToken
      summary: Rotate the gateway bearer token
      description: >
        Generates a new cryptographically random 64-hex-character gateway bearer
        token, persists it to config.json, triggers a hot reload, and returns the
        new token. The previous token is immediately invalidated. Use after
        security incidents or on a regular rotation schedule.
      tags:
      - Config
      security:
      - BearerAuth: []
      responses:
        '200':
          description: New gateway token (valid immediately).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateTokenResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /config/pending-restart:
    get:
      operationId: getPendingRestart
      summary: Get pending restart-gated config changes
      description: 'Returns an array of config keys whose persisted (disk) value differs from the boot-time applied value. Only RestartGatedKeys are checked; hot-reload keys never appear here. An empty array means no restart is needed.

        '
      tags:
      - Config
      responses:
        '200':
          description: Array of pending restart entries (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingRestartEntry'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/503BypassActive'
  /gateway/restart:
    post:
      operationId: restartGateway
      summary: Gracefully restart the gateway process
      description: >
        Triggers a graceful self-restart: the gateway replies immediately, then
        drains in-flight work and re-execs the process (or exits cleanly for a
        supervisor). Used to apply restart-gated settings from the UI without a
        manual process bounce. The response gives the SPA a status + drain
        estimate so it can poll /health (and reconnect the WS) to detect the
        gateway going down and coming back up. High blast radius,
        secured by RequireNotBypass; dev_mode_bypass returns 503.
      tags:
      - Config
      security:
      - BearerAuth: []
      responses:
        '202':
          description: Restart accepted and scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayRestartResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          description: Restart unavailable (dev_mode_bypass active).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /gateway/god-mode:
    get:
      operationId: getGodMode
      summary: Get the global god-mode runtime state (O14)
      description: >
        Returns whether god mode ("bypass-permissions") is currently active
        (`enabled`), whether it is available in this build/boot
        (`available`), and whether this build supports it at all
        (`supported`).
      tags:
      - Config
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current god-mode state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GodModeStatus'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          description: Unavailable (dev_mode_bypass active).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: setGodMode
      summary: Toggle the global god-mode switch (O14, password step-up)
      description: >
        Flips the global god-mode ("bypass-permissions") switch. When the build
        supports god mode AND this boot was already authorized (see
        GodModeStatus.available), the toggle applies or reverts the override
        live (no restart) — every agent's tool policy is floored at "allow",
        the kernel sandbox is off, network egress is open, and the shell guard
        is off, regardless of per-agent profiles. When enabling from a boot
        that was NOT yet authorized, this call persists authorization
        (sandbox.god_mode_allowed) and the runtime switch (sandbox.god_mode) to
        config and returns restart_required=true — the override only takes
        effect after the gateway restarts. Disabling is always applied live.
        Audit logging, the prompt-injection guard, and rate limiting stay on.
        High blast radius — secured by RequireNotBypass
        (dev_mode_bypass returns 503) AND a single-use password re-auth consent
        token (X-Reauth-Token header; call POST /api/v1/auth/reauth first, 403
        otherwise). Returns 403 when enabling and god mode is not SUPPORTED in
        this build (compiled with nogodmode). Every toggle is audit-logged
        with the acting user.
      tags:
      - Config
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GodModeUpdateRequest'
      responses:
        '200':
          description: Toggle applied. Returns the persisted state and whether a restart is required to activate it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GodModeUpdateResponse'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          description: Unavailable (dev_mode_bypass active).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspace/{agent_id}/{path}:
    get:
      operationId: getWorkspaceFile
      summary: Read a file from an agent's workspace
      description: 'Serves the file at the given path within the agent''s workspace. Requires session-cookie-or-bearer authentication and ownership check. Returns 503 when the agent has no owner (ErrAgentOrphan). Path traversal beyond the agent workspace returns 403. Security headers: Referrer-Policy, Content-Security-Policy, X-Content-Type-Options. Files > 1MB are streamed; smaller files are buffered.

        '
      tags:
      - Workspace
      parameters:
      - name: agent_id
        in: path
        required: true
        description: Agent ID.
        schema:
          type: string
        example: jim
      - name: path
        in: path
        required: true
        description: 'File path relative to the agent''s workspace root.

          '
        schema:
          type: string
        example: output/report.html
      responses:
        '200':
          description: File content with appropriate Content-Type header.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid agent ID or missing file path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Path outside agent workspace or access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent or file not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Agent has no owner and must be reassigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /preview/{agent_id}/{token}/{path}:
    get:
      operationId: getPreview
      summary: Serve agent-generated preview content (token-auth)
      description: "Serves static files or proxies dev-server requests for the given agent and token. No bearer authentication required \u2014 the path token IS the credential (FR-023). Served on the MAIN gateway listener at the /preview/ path prefix (ADR-044) \u2014 there is no separate preview listener/port/origin. Gated by the live gateway.preview_enabled flag: when disabled the endpoint returns 404 with no restart required. Unknown or expired tokens return 404. All HTTP methods are proxied (previewed apps may POST). Static files: path-traversal guard, MIME detection, buffered/streaming. Dev-server: reverse-proxied to loopback port with CSP injection; the proxy strips inbound Cookie/Authorization and neutralizes reserved Set-Cookie so a previewed app cannot read or plant the gateway session/CSRF cookies.\n"
      security: []
      tags:
      - Preview
      parameters:
      - name: agent_id
        in: path
        required: true
        description: Agent ID.
        schema:
          type: string
        example: jim
      - name: token
        in: path
        required: true
        description: 'One-time preview token minted by the web_serve tool. The token is the only credential required.

          '
        schema:
          type: string
        example: abc123def456ghij
      - name: path
        in: path
        required: true
        description: File path or sub-path within the preview root.
        schema:
          type: string
        example: index.html
      responses:
        '200':
          description: Preview file content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Malformed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Token does not match the agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Token not found or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /credentials:
    get:
      operationId: listCredentials
      summary: List credential key names
      description: 'Lists all credential key names without values. Returns an empty array when no credentials are stored.

        '
      tags:
