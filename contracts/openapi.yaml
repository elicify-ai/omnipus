      responses:
        '200':
          description: Updated sandbox configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxConfig'
        '400':
          description: Validation error (invalid mode, profile, or path).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/503BypassActive'
  /security/sandbox-status:
    get:
      operationId: getSandboxStatus
      summary: Get sandbox backend runtime status (SEC-01/02/03)
      description: 'Returns the active sandbox backend, kernel capabilities, enforcement flags, and bind-port-rule count. Lets operators distinguish enforce from permissive from off states.

        '
      tags:
      - Security
      responses:
        '200':
          description: Sandbox backend runtime status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxStatus'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Agent loop not initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /audit-log:
    get:
      operationId: getAuditLog
      summary: Get recent audit log entries
      description: "Returns the last 100 audit log entries in reverse-chronological order (read from ~/.omnipus/system/audit.jsonl) wrapped with the HMAC tamper-evident chain-verification result (chain_status). entries is an empty array when no entries exist.\n"
      tags:
      - Audit
      responses:
        '200':
          description: Audit log entries (reverse-chronological, max 100) plus HMAC chain-integrity status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /security/audit-log:
    get:
      operationId: getAuditLogToggle
      summary: Get audit logging enable/disable state
      description: 'Returns whether audit logging is currently enabled. Note: this is distinct from GET /api/v1/audit-log which returns entries. This endpoint controls the audit_log config flag.

        '
      tags:
      - Audit
      responses:
        '200':
          description: Audit log enable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogToggle'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateAuditLogToggle
      summary: Enable or disable audit logging
      description: "Persists sandbox.audit_log to config.json. Requires restart \u2014 the response includes applied_enabled which reflects the value before this save (currently running state). Changes are audit-logged before disabling.\n"
      tags:
      - Audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditLogToggleRequest'
      responses:
        '200':
          description: Audit log state saved (restart required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogUpdateResponse'
        '400':
          description: Missing or invalid enabled field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/503BypassActive'
  /security/retention:
    get:
      operationId: getRetention
      summary: Get session retention configuration
      description: 'Returns session_days and disabled flag from storage.retention.

        '
      tags:
      - Security
      responses:
        '200':
          description: Current retention configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionConfig'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateRetention
      summary: Update session retention configuration
      description: "Partial update \u2014 any subset of session_days and disabled. session_days must be a non-negative integer (floats and strings rejected). disabled must be a JSON boolean (string \"true\"/\"false\" rejected). Empty body is accepted as a no-op. Hot-reloaded (requires_restart: false).\n"
      tags:
      - Security
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionConfig'
      responses:
        '200':
          description: Updated retention configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionUpdateResponse'
        '400':
          description: Type mismatch (float for session_days, string for disabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/503BypassActive'
  /security/retention/sweep:
    post:
      operationId: triggerRetentionSweep
      summary: Trigger on-demand retention sweep
      description: 'Immediately purges session directories older than the configured retention window. Returns 409 if a sweep is already in progress. Returns skipped_reason="disabled" when retention is disabled. Emits audit with resource="storage.retention.sweep".

        '
      tags:
      - Security
      responses:
        '200':
          description: Sweep result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionSweepResult'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sweep already in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/503BypassActive'
  /performance:
    get:
      operationId: getPerformanceSettings
      summary: Get agent concurrency settings
      description: >
        Returns the max-parallel-agents cap and the effective (resolved,
        auto-detected or explicit) value currently in use.
      tags:
        - Settings
      responses:
        '200':
          description: Current performance settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceSettings'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/503BypassActive'
    put:
      operationId: updatePerformanceSettings
      summary: Update agent concurrency settings
      description: >
        Updates max_parallel_agents. An explicit value is honored exactly as
        given — there is no ceiling, only a floor of 1; a value is never
        silently lowered. Set to 0 to restore the auto-detected default
        (available memory / ~3.5 MB per agent, floored at 2, physically
        bounded around 2000). Requires a gateway restart to take effect
        (requires_restart: false — the semaphore is resized in-memory on PUT).
      tags:
        - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceSettingsUpdate'
      responses:
        '200':
          description: Updated performance settings (including effective value).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceSettings'
        '400':
          description: Invalid value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/503BypassActive'
  /settings/memory:
    get:
      operationId: getMemorySettings
      summary: Get global memory and recap/retention settings
      description: >
        Returns the global memory/recap and retention settings (agents.defaults.*
        and storage.retention fields). Readable by any authenticated user.
        Never exposes secrets.
      tags:
        - Settings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current memory settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySettings'
        '401':
          $ref: '#/components/responses/401Unauthorized'
    put:
      operationId: updateMemorySettings
      summary: Update global memory and recap/retention settings
      description: >
        Writes the global memory/recap and retention settings. Reads/writes
        ONLY the MemorySettings fields — no merge of sibling config sections
        or secrets (A2/G-02). Writable by any authenticated user (operator
        decision, no admin gate). Uses safeUpdateConfigJSON server-side to
        preserve all other config fields including API keys.
      tags:
        - Settings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySettings'
      responses:
        '200':
          description: Updated memory settings (echoes the stored values).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySettings'
        '400':
          description: Invalid field value (e.g. negative session_days).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
  /channels:
    get:
      operationId: listChannels
      summary: List all channels
      description: 'Returns the full list of communication channels with their ID, name, transport, enabled state, and description. webchat is always enabled.

        '
      tags:
      - Channels
      responses:
        '200':
          description: Array of channel entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelEntry'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createChannelInstance
      summary: Create a new channel instance
      description: >
        Creates a new channel instance with key "<type>.<slug>" (ADR-029 FR-017).
        The instance starts disabled (enabled: false). Returns 409 if the
        instance key already exists, 400 if the type is unknown or the slug
        is malformed.
      tags:
      - Channels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelCreateRequest'
      responses:
        '201':
          description: Instance created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelCreateResponse'
        '400':
          description: Unknown channel type or malformed slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Instance key already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Config write failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /channels/{id}:
    get:
      operationId: getChannelConfig
      summary: Get a channel's configuration
      description: 'Returns the channel''s config with credential fields redacted (replaced with "[configured]" if set).

        '
      tags:
      - Channels
      parameters:
      - name: id
        in: path
        required: true
        description: Channel ID.
        schema:
          type: string
        example: telegram
      responses:
        '200':
          description: Channel configuration (credentials redacted).
          content:
            application/json:
              schema:
                type: object
                description: 'Channel-specific configuration object. Structure varies by channel type. Credential fields contain "[configured]" when set.

                  '
                additionalProperties: true
        '404':
          description: Channel ID not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteChannelInstance
      summary: Delete a channel instance
      description: >
        Deletes a channel instance: removes its config entry, credential refs,
        any stale channel-wildcard binding, and its per-instance state directory
        (e.g. WhatsApp store). Returns 404 for unknown instances and 400 for
        malformed ids. Bare-type keys (e.g. "telegram") can be deleted;
        "webchat" is a built-in and cannot be deleted.
      tags:
      - Channels
      parameters:
      - name: id
        in: path
        required: true
        description: Channel instance ID to delete.
        schema:
          $ref: '#/components/schemas/ChannelId'
        example: whatsapp.eu
      responses:
        '204':
          description: Instance deleted successfully.
        '400':
          description: Malformed channel id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Instance not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Config write failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /channels/{id}/enable:
    put:
      operationId: enableChannel
      summary: Enable a channel
      description: Sets the channel's enabled flag to true in config.
      tags:
      - Channels
      parameters:
      - name: id
        in: path
        required: true
        description: Channel ID.
        schema:
          type: string
        example: telegram
      responses:
        '200':
          description: Channel enable state updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelEnabledResponse'
        '404':
          description: Channel ID not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /channels/{id}/disable:
    put:
      operationId: disableChannel
      summary: Disable a channel
      description: Sets the channel's enabled flag to false in config.
      tags:
      - Channels
      parameters:
      - name: id
        in: path
        required: true
        description: Channel ID.
        schema:
          type: string
        example: telegram
      responses:
        '200':
          description: Channel disable state updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelEnabledResponse'
        '404':
          description: Channel ID not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /channels/{id}/configure:
    put:
      operationId: configureChannel
      summary: Configure a channel
      description: 'Merges request body fields into the channel''s config section. Fields absent from the request body are not touched (merge, not replace). The "enabled" field is reserved and ignored if sent. Returns the updated config with credential fields redacted.

        '
      tags:
      - Channels
      parameters:
      - name: id
        in: path
        required: true
        description: Channel ID.
        schema:
          type: string
        example: telegram
      requestBody:
        required: true
        description: 'Channel-specific configuration fields to merge. Structure varies by channel type.

          '
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              example:
                token: your-telegram-bot-token
      responses:
        '200':
          description: Updated channel configuration (credentials redacted).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Channel ID not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /channels/{id}/test:
    post:
      operationId: testChannel
      summary: Test a channel configuration
      description: 'Verifies required credential fields are configured without starting the channel. Returns success=false with missing field list if required credentials are absent.

        '
      tags:
      - Channels
      parameters:
      - name: id
        in: path
        required: true
        description: Channel ID.
        schema:
          type: string
        example: telegram
      responses:
        '200':
          description: Test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelTestResponse'
        '404':
          description: Channel ID not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /channels/{id}/routing:
    get:
      operationId: getChannelRouting
      summary: Get channel routing configuration
      description: >
        Returns the routing configuration for the specified channel, including
        which agent handles its inbound messages.
      tags:
      - Channels
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Channel ID.
        schema:
          type: string
        example: telegram
      responses:
        '200':
          description: Channel routing configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelRouting'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Channel ID not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    put:
      operationId: setChannelRouting
      summary: Set channel routing configuration
      description: >
        Sets the routing configuration for the specified channel. The
        default_agent_id field controls which agent handles inbound messages
        arriving on this channel. Omit it or leave it empty to fall back to the
        global default agent.
      tags:
      - Channels
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Channel ID.
        schema:
          type: string
        example: telegram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelRouting'
      responses:
        '200':
          description: Updated channel routing configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelRouting'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Channel ID not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /agents/{id}/mailboxes/{workspaceId}:
    get:
      operationId: getAgentMailbox
      summary: Get one (agent, workspace) email mailbox account (M11)
      description: >
        Returns the mailbox the agent holds in the given workspace. An agent can
        hold a different mailbox in each workspace it belongs to (different
        roles, different inboxes). Email is a TOOL surface (read_inbox,
        search_email, read_message, send_email, reply), not a conversational
        channel. The mailbox password is never returned; the `configured` flag
        reports whether a password is on file in the credential store.
      tags:
      - Agents
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Agent ID.
        schema:
          type: string
        example: mia
      - name: workspaceId
        in: path
        required: true
        description: Workspace ID the mailbox surfaces in.
        schema:
          type: string
        example: ws_my_workspace
      responses:
        '200':
          description: The (agent, workspace) mailbox account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mailbox'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Agent not found, or no mailbox configured for the agent in this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    put:
      operationId: setAgentMailbox
      summary: Configure one (agent, workspace) email mailbox account (M11)
      description: >
        Configures the mailbox the agent holds in the given workspace. Every
        (agent, workspace) pair may have its own mailbox — an agent plays
        different roles in different workspaces and can have a distinct inbox in
        each. The password, when present, is routed into the encrypted
        credential store and persisted only as a reference — it is never
        written to config.json. Unhandled inbound mail becomes Board tasks in
        THIS workspace, assigned to the owning agent. The email tools resolve
        the active workspace from the turn context at execution time — never
        from a model-supplied parameter.
      tags:
      - Agents
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Agent ID.
        schema:
          type: string
        example: mia
      - name: workspaceId
        in: path
        required: true
        description: Workspace ID the mailbox surfaces in.
        schema:
          type: string
        example: ws_my_workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailboxConfigureRequest'
      responses:
        '200':
          description: The saved (agent, workspace) mailbox account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mailbox'
        '400':
          description: Missing or invalid required field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    delete:
      operationId: deleteAgentMailbox
      summary: Remove one (agent, workspace) email mailbox account (M11)
      description: >
        Removes the mailbox the agent holds in the given workspace from config
        and deletes its stored password from the credential store. The agent's
        email tools for this workspace are de-registered on the next reload;
        mailboxes the agent holds in OTHER workspaces are untouched.
      tags:
      - Agents
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Agent ID.
        schema:
          type: string
        example: mia
      - name: workspaceId
        in: path
        required: true
        description: Workspace ID the mailbox surfaces in.
        schema:
          type: string
        example: ws_my_workspace
      responses:
        '200':
          description: Mailbox removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Agent not found, or no mailbox configured for the agent in this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /mailboxes:
    get:
      operationId: listMailboxes
      summary: List all configured email mailbox accounts (M11)
      description: >
        Returns every configured mailbox account (one per (agent, workspace)
        pair). The mailbox password is never returned; each
        entry's `configured` flag reports whether a password is on file in the
        credential store. An empty list means no mailbox is configured — this
        endpoint never 404s, so the SPA can show mailbox status without
        per-agent probe requests.
      tags:
      - Agents
      security:
      - BearerAuth: []
      responses:
        '200':
          description: All configured mailboxes (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxListResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /config/gateway/rotate-token:
    post:
      operationId: rotateGatewayToken
      summary: Rotate the gateway bearer token
      description: >
        Generates a new cryptographically random 64-hex-character gateway bearer
        token, persists it to config.json, triggers a hot reload, and returns the
        new token. The previous token is immediately invalidated. Use after
        security incidents or on a regular rotation schedule.
      tags:
      - Config
      security:
      - BearerAuth: []
      responses:
        '200':
          description: New gateway token (valid immediately).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateTokenResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /config/pending-restart:
    get:
      operationId: getPendingRestart
      summary: Get pending restart-gated config changes
      description: 'Returns an array of config keys whose persisted (disk) value differs from the boot-time applied value. Only RestartGatedKeys are checked; hot-reload keys never appear here. An empty array means no restart is needed.

        '
      tags:
      - Config
      responses:
        '200':
          description: Array of pending restart entries (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingRestartEntry'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/503BypassActive'
  /gateway/restart:
    post:
      operationId: restartGateway
      summary: Gracefully restart the gateway process
      description: >
        Triggers a graceful self-restart: the gateway replies immediately, then
        drains in-flight work and re-execs the process (or exits cleanly for a
        supervisor). Used to apply restart-gated settings from the UI without a
        manual process bounce. The response gives the SPA a status + drain
        estimate so it can poll /health (and reconnect the WS) to detect the
        gateway going down and coming back up. High blast radius,
        secured by RequireNotBypass; dev_mode_bypass returns 503.
      tags:
      - Config
      security:
      - BearerAuth: []
      responses:
        '202':
          description: Restart accepted and scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayRestartResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          description: Restart unavailable (dev_mode_bypass active).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /gateway/god-mode:
    get:
      operationId: getGodMode
      summary: Get the global god-mode runtime state (O14)
      description: >
        Returns whether god mode ("bypass-permissions") is currently active
        (`enabled`), whether it is available in this build/boot
        (`available`), and whether this build supports it at all
        (`supported`).
      tags:
      - Config
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current god-mode state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GodModeStatus'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          description: Unavailable (dev_mode_bypass active).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: setGodMode
      summary: Toggle the global god-mode switch (O14, password step-up)
      description: >
        Flips the global god-mode ("bypass-permissions") switch. When the build
        supports god mode AND this boot was already authorized (see
        GodModeStatus.available), the toggle applies or reverts the override
        live (no restart) — every agent's tool policy is floored at "allow",
        the kernel sandbox is off, network egress is open, and the shell guard
        is off, regardless of per-agent profiles. When enabling from a boot
        that was NOT yet authorized, this call persists authorization
        (sandbox.god_mode_allowed) and the runtime switch (sandbox.god_mode) to
        config and returns restart_required=true — the override only takes
        effect after the gateway restarts. Disabling is always applied live.
        Audit logging, the prompt-injection guard, and rate limiting stay on.
        High blast radius — secured by RequireNotBypass
        (dev_mode_bypass returns 503) AND a single-use password re-auth consent
        token (X-Reauth-Token header; call POST /api/v1/auth/reauth first, 403
        otherwise). Returns 403 when enabling and god mode is not SUPPORTED in
        this build (compiled with nogodmode). Every toggle is audit-logged
        with the acting user.
      tags:
      - Config
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GodModeUpdateRequest'
      responses:
        '200':
          description: Toggle applied. Returns the persisted state and whether a restart is required to activate it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GodModeUpdateResponse'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          description: Unavailable (dev_mode_bypass active).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspace/{agent_id}/{path}:
    get:
      operationId: getWorkspaceFile
      summary: Read a file from an agent's workspace
      description: 'Serves the file at the given path within the agent''s workspace. Requires session-cookie-or-bearer authentication and ownership check. Returns 503 when the agent has no owner (ErrAgentOrphan). Path traversal beyond the agent workspace returns 403. Security headers: Referrer-Policy, Content-Security-Policy, X-Content-Type-Options. Files > 1MB are streamed; smaller files are buffered.

        '
      tags:
      - Workspace
      parameters:
      - name: agent_id
        in: path
        required: true
        description: Agent ID.
        schema:
          type: string
        example: jim
      - name: path
        in: path
        required: true
        description: 'File path relative to the agent''s workspace root.

          '
        schema:
          type: string
        example: output/report.html
      responses:
        '200':
          description: File content with appropriate Content-Type header.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid agent ID or missing file path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Path outside agent workspace or access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent or file not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Agent has no owner and must be reassigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /preview/{agent_id}/{token}/{path}:
    get:
      operationId: getPreview
      summary: Serve agent-generated preview content (token-auth)
      description: "Serves static files or proxies dev-server requests for the given agent and token. No bearer authentication required \u2014 the path token IS the credential (FR-023). Served on the MAIN gateway listener at the /preview/ path prefix (ADR-044) \u2014 there is no separate preview listener/port/origin. Gated by the live gateway.preview_enabled flag: when disabled the endpoint returns 404 with no restart required. Unknown or expired tokens return 404. All HTTP methods are proxied (previewed apps may POST). Static files: path-traversal guard, MIME detection, buffered/streaming. Dev-server: reverse-proxied to loopback port with CSP injection; the proxy strips inbound Cookie/Authorization and neutralizes reserved Set-Cookie so a previewed app cannot read or plant the gateway session/CSRF cookies.\n"
      security: []
      tags:
      - Preview
      parameters:
      - name: agent_id
        in: path
        required: true
        description: Agent ID.
        schema:
          type: string
        example: jim
      - name: token
        in: path
        required: true
        description: 'One-time preview token minted by the web_serve tool. The token is the only credential required.

          '
        schema:
          type: string
        example: abc123def456ghij
      - name: path
        in: path
        required: true
        description: File path or sub-path within the preview root.
        schema:
          type: string
        example: index.html
      responses:
        '200':
          description: Preview file content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Malformed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Token does not match the agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Token not found or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /credentials:
    get:
      operationId: listCredentials
      summary: List credential key names
      description: 'Lists all credential key names without values. Returns an empty array when no credentials are stored.

        '
      tags:
      - Settings
      responses:
        '200':
          description: Array of credential key names.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example:
                - OPENAI_API_KEY
                - TELEGRAM_TOKEN
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: setCredential
      summary: Add or update a credential
      description: 'Stores an encrypted credential. The key must be non-empty. Returns 201 Created on success.

        '
      tags:
      - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialSetRequest'
      responses:
        '201':
          description: Credential stored.
          content:
            application/json:
              schema:
                type: object
                required:
                - key
                properties:
                  key:
                    type: string
                    example: OPENAI_API_KEY
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Key field is required (empty key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Credential store locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /credentials/{key}:
    delete:
      operationId: deleteCredential
      summary: Delete a credential
      description: Removes a credential by key. Returns 404 if not found.
      tags:
      - Settings
      parameters:
      - name: key
        in: path
        required: true
        description: Credential key name.
        schema:
          type: string
        example: OPENAI_API_KEY
      responses:
        '200':
          description: Credential removed.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - key
                properties:
                  status:
                    type: string
                    enum:
                    - removed
                    example: removed
                  key:
                    type: string
                    example: OPENAI_API_KEY
        '404':
          description: Credential key not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Credential store locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /credentials/rotate:
    post:
      operationId: rotateCredentials
      summary: Rotate the credential vault key via a new passphrase
      description: >
        Re-encrypts the entire credential vault under a new Argon2id key derived
        from new_passphrase (and a fresh salt). Sensitive change — requires a
        re-auth consent token in the X-Reauth-Token header (Spec-6 FR-12.2 /
        ADR-022). No restart is required; the in-memory key is updated in place.
      tags:
      - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRotateRequest'
      responses:
        '200':
          description: Vault re-encrypted under the new passphrase.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - rotated
                    example: rotated
        '400':
          description: Invalid request (e.g. empty passphrase).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Re-auth required or invalid consent token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Credential store locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /backup:
    post:
      operationId: createBackup
      summary: Create a backup archive
      description: 'Creates a tar.gz of ~/.omnipus/ excluding logs and backups directories. The archive is written atomically to ~/.omnipus/backups/.

        '
      tags:
      - Settings
      responses:
        '200':
          description: Backup created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupCreateResponse'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /backups:
    get:
      operationId: listBackups
      summary: List backup archives
      description: 'Lists all .tar.gz files in ~/.omnipus/backups/ with filename, size, and creation time. Returns an empty array when no backups exist.

        '
      tags:
      - Settings
      responses:
        '200':
          description: List of backup archive entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - filename
                  - size_bytes
                  - created_at
                  properties:
                    filename:
                      type: string
                      example: backup-20260516T103000Z.tar.gz
                    size_bytes:
                      type: integer
                      format: int64
                      minimum: 0
                      example: 1048576
                    created_at:
                      type: string
                      format: date-time
                      example: '2026-05-16T10:30:00Z'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /restore:
    post:
      operationId: restoreBackup
      summary: Restore from a backup archive
      description: 'Extracts a backup tar.gz over ~/.omnipus/, skipping config.json to preserve current settings. The filename must not contain path separators or traversal sequences.

        '
      tags:
      - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreBackupRequest'
      responses:
        '200':
          description: Backup restored.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - filename
                properties:
                  status:
                    type: string
                    enum:
                    - restored
                    example: restored
                  filename:
                    type: string
                    example: backup-20260516T103000Z.tar.gz
        '400':
          description: Invalid filename (path traversal, missing .tar.gz).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Backup file not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Filename field is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /storage/stats:
    get:
      operationId: getStorageStats
      summary: Get storage statistics
      description: 'Returns session count, workspace size, and memory entry count. May include partial warnings if some agent stores could not be read.

        '
      tags:
      - Settings
      responses:
        '200':
          description: Storage statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageStats'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/all:
    delete:
      operationId: clearAllSessions
      summary: Delete all sessions for all agents
      description: 'Removes all session directories across all agent stores. Returns the count of removed sessions and any per-agent warnings.

        '
      tags:
      - Settings
      responses:
        '200':
          description: Sessions cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearAllSessionsResponse'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /status:
    get:
      operationId: getGatewayStatus
      summary: Get gateway runtime status
      description: "Returns online status, agent/channel counts, daily cost, and the binary version.\nPolled by the SPA StatusBar every 15 seconds.\n"
      tags:
      - Gateway
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Gateway runtime status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayStatus'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /providers:
    get:
      operationId: listProviders
      summary: List configured LLM providers
      description: "Returns all configured LLM providers with connection status and available model list.\nModel lists are fetched live from each provider's upstream /models endpoint when an API key is present.\n"
      tags:
      - Providers
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Array of provider entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /providers/{id}:
    put:
      operationId: updateProvider
      summary: Add or update an LLM provider configuration
      description: >
        Adds or updates an LLM provider entry. On new providers, api_key is
        required. On existing providers, api_key may be omitted to keep the
        current key. The API key is stored encrypted (AES-256-GCM) in
        credentials.json. Available before and after onboarding.
      tags:
      - Providers
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Provider identifier (e.g. "anthropic", "openai", "openrouter").
        example: anthropic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderUpdateRequest'
      responses:
        '200':
          description: Provider updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '422':
          description: api_key required for new providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Credential store locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /providers/{id}/test:
    get:
      operationId: testProvider
      summary: Test provider API key configuration
      description: >
        Verifies that an API key is configured for the given provider without making an
        upstream call. Returns success=false with an error message if no key is configured.
        Available before and after onboarding.
      tags:
      - Providers
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Provider identifier (e.g. "anthropic", "openai").
        example: anthropic
      responses:
        '200':
          description: Provider test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '401':
          $ref: '#/components/responses/401Unauthorized'
  /providers/model-capabilities:
    get:
      operationId: listModelCapabilities
      summary: List declared input-modality capabilities per model
      description: >
        Returns the in-repo capability catalog (pkg/providers/capabilities) as
        a flat list of {id, modalities} pairs (D18). Model vision capability
        is not knowable client-side at all otherwise — the SPA resolves the
        target agent's model against this list to show a non-blocking warning
        before sending a vision attachment (e.g. a live-browser annotation, or
        an image attached via the composer) to a model that cannot accept
        images. Returns an empty array when the catalog is not constructed
        (never a 500) — the catalog is optional and the server-side capability
        gate remains the authoritative backstop regardless.
      tags:
      - Providers
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Array of per-model capability entries. Empty when the catalog is unavailable.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelCapabilities'
        '401':
          $ref: '#/components/responses/401Unauthorized'
  /commands:
    get:
      operationId: listCommands
      summary: List available slash commands for a surface
      description: "Returns the canonical slash commands available on the given surface (default web). Aliases and deprecated names are excluded. The web chat palette renders the web set as its single source of truth.\n"
      tags:
      - Commands
      security:
      - BearerAuth: []
      parameters:
      - name: surface
        in: query
        description: Which surface to list commands for. Defaults to web. Unknown values are treated as web.
        schema:
          type: string
          enum:
          - web
          - cli
          - channel
        example: web
      responses:
        '200':
          description: Array of available slash commands for the surface.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlashCommand'
        '401':
          $ref: '#/components/responses/401Unauthorized'
  /skills:
    get:
      operationId: listSkills
      summary: List installed skills
      description: "Returns all skills installed in ~/.omnipus/skills/. Returns an empty array when no skills are installed.\n"
      tags:
      - Skills
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Array of installed skills.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /skills/search:
    get:
      operationId: searchSkills
      summary: Search the skill marketplace
      description: >
        Searches configured skill registries (e.g. ClawHub) for skills matching
        the query. Returns an array of marketplace results (not installed skills).
        Install a result by its slug via POST /skills/install.
      tags:
      - Skills
      security:
      - BearerAuth: []
      parameters:
      - name: q
        in: query
        required: true
        description: Search query. Must be non-empty.
        schema:
          type: string
          minLength: 1
          maxLength: 256
        example: "web search"
      - name: limit
        in: query
        required: false
        description: Maximum number of results to return (default 20, capped at 50).
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        example: 20
      responses:
        '200':
          description: Array of skill marketplace search results (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillSearchResult'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '409':
          $ref: '#/components/responses/409Conflict'
        '502':
          $ref: '#/components/responses/502BadGateway'
  /skills/marketplace:
    get:
      operationId: getSkillMarketplaceStatus
      summary: Report skill marketplace availability
      description: >
        Reports whether any skill marketplace registry is enabled. The SPA gates
        its skill-browse UI on this: when enabled is false, search and
        install-by-slug are unavailable (those endpoints return 409) and the UI
        offers only "install from file".
      tags:
      - Skills
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Skill marketplace status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillMarketplaceStatus'
        '401':
          $ref: '#/components/responses/401Unauthorized'
  /skills/install:
    post:
      operationId: installSkill
      summary: Install a skill from the ClawHub registry
      description: >
        Installs a skill by its slug from the ClawHub registry. The slug is the
        identifier returned in a SkillSearchResult. An optional version pins the
        installed version; when omitted the latest version is installed.
      tags:
      - Skills
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillInstallRequest'
      responses:
        '200':
          description: Skill installed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '502':
          $ref: '#/components/responses/502BadGateway'
  /skills/{name}:
    delete:
      operationId: deleteSkill
      summary: Delete an installed skill
      description: >
        Removes an installed skill from the local skills directory. The skill
        must not be the default skill, in use by any agent, or required by a
        seeded dependency. On success the gateway removes the skill directory
        and returns 204 No Content.
      tags:
      - Skills
      security:
      - BearerAuth: []
      parameters:
      - name: name
        in: path
        required: true
        description: Skill slug (matches the `id` field on Skill).
        schema:
          type: string
      responses:
        '204':
          description: Skill removed.
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
