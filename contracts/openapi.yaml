        schema:
          type: string
          enum:
            - user
            - heartbeat
        description: >
          Filter by UI surface (Detail #5). Defaults to `user` when omitted —
          dedicated-UI tasks (e.g. heartbeat) are excluded from general listings.
      - name: parent_task_id
        in: query
        required: false
        schema:
          type: string
        description: >
          When set, returns the subtasks of this parent (equivalent to
          GET /tasks/{id}/subtasks). When omitted, only top-level tasks are
          returned.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 200
          maximum: 1000
        description: Maximum items to return.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
        description: Pagination offset.
      responses:
        '200':
          description: Array of tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
    post:
      operationId: createTask
      summary: Create a task
      description: >
        Creates a new task. Lands in `inbox` regardless of input (Detail #8 landing
        rule). Workspace-scoped (workspace_id required in the body).
      tags:
      - Tasks
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Created task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
  /tasks/occurrences:
    get:
      operationId: listTaskOccurrences
      summary: Expand recurring task occurrences in a date range
      description: >
        Server-side occurrence expansion for the workspace calendar (Calendar
        Recurrence Redesign). Expands every recurring-capable trigger the
        scheduler would actually arm — non-terminal AND not
        `surface: heartbeat`, the same predicate `OnTaskUpserted` applies
        before registering a job — covering `rrule` (rrule-go, normalized per
        the Timezone Semantics DST policy), legacy `cron_expr` (gronx,
        expanded in the server's local zone, display-only per D8), and
        `every_ms` (a forward-only projection off the live job's next-run
        instant, FR-008a). `tz` is the viewer's IANA zone and is the
        day-boundary authority for bucketing — the >3-occurrences-per-day
        threshold and `day_start_ms` are evaluated on days in this zone for
        every trigger flavor, regardless of each rule's own `tz`. Range is
        half-open `[from_ms, to_ms)`. Responses are bucketed: spans ≤ 8×24h
        return raw instants for every day (Week/Day views); spans > 8×24h
        return one `DayBucket` per query-tz day with more than 3 occurrences,
        raw instants for days with 3 or fewer (Month/overview views, D6).
        Capped at 500 instants per task per request plus a 10,000-computed-
        occurrence total iteration budget per task per request (arithmetic
        derivation, not iteration, for provably regular triggers); `truncated`
        signals either cap was hit. Tasks with zero occurrences in range are
        omitted; the result is `[]`, never null. Read-only; no state change.
        Rate-limited by a dedicated `taskReadLimiter` (240 requests/min),
        distinct from `configLimiter` and from the unthrottled task CRUD
        routes.
      tags:
      - Tasks
      security:
      - BearerAuth: []
      parameters:
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
        description: Workspace to expand occurrences for. Tasks are workspace-scoped.
      - name: from_ms
        in: query
        required: true
        schema:
          type: integer
          format: int64
        description: >
          Start of the query range, Unix epoch milliseconds, inclusive
          (half-open range start).
        example: 1784592000000
      - name: to_ms
        in: query
        required: true
        schema:
          type: integer
          format: int64
        description: >
          End of the query range, Unix epoch milliseconds, exclusive
          (half-open range end). Must be strictly greater than `from_ms`;
          `from_ms >= to_ms` is rejected with 400. A span greater than 400
          days is also rejected with 400.
        example: 1787270400000
      - name: tz
        in: query
        required: true
        schema:
          type: string
        description: >
          IANA timezone name of the viewer (e.g. the browser's resolved
          zone) — the day-boundary authority for occurrence bucketing.
          Unloadable `tz` is rejected with 400.
        example: "Europe/Berlin"
      responses:
        '200':
          description: >
            One TaskOccurrenceSet per task with at least one occurrence in
            range. Tasks with zero occurrences in range are omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskOccurrenceSet'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
