          description: Forbidden — invalid or path-traversal ref_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Media store not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /media/workspace/{workspace_id}/{media_id}:
    get:
      operationId: serveWorkspaceMediaFile
      summary: Serve a workspace media-library file by workspace + media ID
      description: >
        Resolves a media://workspace/<workspace_id>/<media_id> ref through
        the owning workspace's media library and streams the underlying file
        with the correct Content-Type (FR-028). The split path shape keeps
        the workspace and media IDs independently validated while
        preserving the opaque ref for resolution. Returns 403 if the caller
        is not scoped to the owning workspace, 404 if the ref is unknown or
        no workspace library is available for it, and 500 if the workspace
        library exists but could not be opened (a genuine backend failure,
        distinct from a routine absent ref) or if the entry is stranded
        (manifest present, bytes quarantined — a server-side data-integrity
        fault).
      tags:
      - Workspace Media
      security: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID that owns the media-library entry.
        example: ws-123
      - name: media_id
        in: path
        required: true
        schema:
          type: string
        description: The opaque media-library entry ID (not a path — no slashes or dots).
        example: "a1b2c3d4-e5f6-4789-a123-b4c5d6e7f890"
      responses:
        '200':
          description: Media file content streamed with appropriate Content-Type.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request — invalid workspace_id or media_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — caller workspace does not own this media ref.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/404NotFound'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          description: Media store not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
