    delete:
      operationId: deleteWorkspaceMedia
      summary: Delete a workspace media-library entry (FR-008)
      description: >
        Removes a single media-library entry (raw bytes + manifest entry) from
        the workspace library. Emits a media.delete audit event (FR-033).
        Idempotent against a concurrently-deleted entry (404 if not found).
        Returns the deleted entry's projection — including a degraded-success
        case where the manifest entry was committed-removed but the final
        on-disk unlink of the already-quarantined file failed; from the
        client's perspective the item is gone (a follow-up GET 404s) even
        though a 500 is not returned for it, so the body is the only signal
        of exactly what was deleted.
      tags:
      - Workspace Media
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Workspace ID.
      - name: media_id
        in: path
        required: true
        schema:
          type: string
        description: Media-library entry ID.
      responses:
        '200':
          description: The media-library entry (bytes + manifest) was deleted. Body is the deleted entry's projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaLibraryEntry'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'

