        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /agents/{id}/runner/test:
    post:
      operationId: testAgentRunner
      summary: Test an external-CLI runner connection for an agent
      description: 'Connection/health check for the agent''s configured external-CLI runner (Spec-4 FR-4.2). Validates the CLI binary is present, runs, and is authenticated WITHOUT running real work (no tokens spent). Returns distinct reasons for missing-binary vs unauthenticated. Fails with reason "not-external-cli" when the agent''s executor is native/remote-a2a (no runner to test).

        '
      tags:
      - agents
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Agent ID.
        example: jim
      responses:
        '200':
          description: Connection test result (the test ran; ok indicates pass/fail).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerTestResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /security/session-scope:
    get:
      operationId: getSessionScope
      summary: Get the current DM session scoping strategy
      description: 'Returns the dm_scope configuration value. Controls how incoming direct messages from channels are routed to session threads. Defaults to "per-channel-peer" when not explicitly configured.

        '
