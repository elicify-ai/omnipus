title: BrowserAttachFrame
description: >
  Client → server. Binds this browser-live WebSocket connection to a session's
  browser and starts the screencast. session_id selects the browser tab (the
  agent's default browser session); agent_id selects which agent's BrowserManager
  the live view attaches to. See ADR-038.
type: object
required:
  - type
  - session_id
  - agent_id
additionalProperties: false
properties:
  type:
    type: string
    const: browser_attach
  session_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >-
      The client's chat session id, carried for context/correlation and
      logging only — echoed back on outgoing browser_screencast /
      browser_status frames so the client can match them to this attach
      request. It does NOT select which browser tab the live view attaches
      to: the server always binds to the target agent's single actual
      browser tab (its default browser session, the same one browser_navigate
      / browser_click / etc. drive), regardless of the value sent here.
  agent_id:
    type: string
    minLength: 1
    maxLength: 128
    description: Agent whose BrowserManager owns the live tab.
