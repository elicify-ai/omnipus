title: BrowserAttachFrame
description: >
  Client → server. Binds this browser-live WebSocket connection to a session's
  browser and starts the screencast. agent_id is the binding key — it selects
  which agent's BrowserManager (and, per ADR-043, which agent's own isolated
  browser context) the live view attaches to; session_id is carried for
  correlation only. See ADR-038 and ADR-043.
type: object
required:
  - type
  - session_id
  - agent_id
additionalProperties: false
properties:
  type:
    type: string
    const: browser_attach
  session_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >-
      The client's chat session id, carried for context/correlation and
      logging only — echoed back on outgoing browser_screencast /
      browser_status frames so the client can match them to this attach
      request. It does NOT select which browser tab the live view attaches
      to: the server binds to the active tab in the attaching agent's OWN
      browser context (per ADR-043, agents browse concurrently in isolated
      per-agent contexts within one shared Chrome — cookie/login state is
      not shared across agents), regardless of the value sent here.
      agent_id is the binding key.
  agent_id:
    type: string
    minLength: 1
    maxLength: 128
    description: Agent whose BrowserManager owns the live tab.
