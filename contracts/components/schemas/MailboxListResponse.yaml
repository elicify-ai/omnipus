title: MailboxListResponse
description: >
  All configured email mailbox accounts (M11) — one per (agent, workspace)
  pair. Returning a list (rather than a 404-on-absent single resource) lets
  the SPA learn "no mailbox is configured" without probing every pair's
  endpoint and generating console-visible 404s.
type: object
required:
- mailboxes
additionalProperties: false
properties:
  mailboxes:
    type: array
    description: Every configured mailbox, one entry per (agent, workspace) pair.
    items:
      $ref: ./Mailbox.yaml
