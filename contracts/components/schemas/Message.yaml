type: object
description: >
  The public CHAT PROJECTION of one entry of a session's single
  append-only archive, served by GET /sessions/{id}/messages and mapped
  to the Message interface in src/lib/api.ts. This is a projection of the
  canonical disk archive (session.TranscriptEntry on the Go side), never
  the raw private persistence record: the archive's private model payload
  (model_message), its body-free same-session consumption reference
  (type=model_ref / model_ref), its trusted source/return-route
  provenance, and its partition/encoded-byte/entry-id marks are disk-only
  and MUST NOT appear here (session-core C-ARCHIVE / U2; FR-004/FR-005).
  The one display-only exception (F15) is participant / reply_to_participant
  (ChatParticipant): a name, a kind and a source label, never an id or a route.
  Entries that belong to the model view only (view_membership="model")
  are excluded from this projection entirely.
required:
  - id
  - timestamp
  - agent_id
additionalProperties: false
properties:
  id:
    type: string
    description: Unique message identifier.
    example: "msg_01HXYZ"
  history_position:
    type: string
    readOnly: true
    minLength: 47
    maxLength: 47
    pattern: '^hp1_[A-Za-z0-9_-]{43}$'
    description: >
      Same-session occurrence fingerprint (chat history paging D2), present on every
      paged entry. Preserves the original recorded id separately. Stable across
      appends/restarts and reconstruction of unchanged final canonical bytes;
      opaque, not a live sequence, model ordinal, authorization grant or disk address.
  client_message_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      #823 catch-up redesign. Present on a user entry that was persisted with a
      client-supplied correlation id (mirrors MessageFrame.client_message_id /
      ReplayMessageFrame.client_message_id). Lets a client reconcile its own pending/sent
      bubble against this REST-loaded entry by id instead of by content+timestamp
      matching. Absent on entries written before this field existed and on non-user
      entries.
    example: "cmid_01HXYZ"
  input_disposition:
    type: object
    readOnly: true
    description: >
      Read-only record that this user input was DISCARDED by Stop before it was
      delivered into the agent's model input (session-core FR-024). Absent on
      every delivered message. There is no client action to release or discard
      it; the archived message bytes are unchanged and this only labels them.
    required:
      - message_id
      - state
      - reason
    additionalProperties: false
    properties:
      message_id:
        type: string
        minLength: 1
        maxLength: 255
        description: The original input message id (this entry's id).
      client_message_id:
        type: string
        minLength: 1
        maxLength: 128
        description: The sender's client_message_id, when the input carried one.
      state:
        type: string
        enum:
          - discarded
      reason:
        type: string
        enum:
          - stopped_before_delivery
  type:
    type: string
    enum:
      - message
      - compaction
      - system
      - tool_call
      - turn_canceled
      - judge_verdict
      - context_window_notice
      - provider_fallback
    description: >
      Entry classification. Absent or empty means "message" (backwards compatible).
      "compaction" entries summarize pruned context; "system" entries are internal
      markers; "tool_call" entries record tool invocations; "turn_canceled" entries
      mark a turn that was canceled mid-stream (FR-15); "judge_verdict" entries
      (ADR-049 D2/D4) record a Judge System Agent adjudication of a task attempt
      or plan round — written alongside the worker's ADR-043 completion marker
      so the two cannot silently disagree, and mirrored live by the
      `JudgeVerdictFrame` WS push (same `verdict` shape).
      "context_window_notice" entries retain a classified Verbose-only diagnostic
      (ADR-066 MAJ-CW-009), not a model-history message. Runtime validation requires
      their `context_window_notice` payload; live and replay carry the same
      payload as ContextWindowNoticeFrame.notice with the original entry id,
      timestamp, agent_id and turn_id.
      "provider_fallback" entries (chat-history paging spec D10 PF=A) are a
      persisted provider-fallback note written by the real fallback chain after
      its assistant answer: system-role system information with `content` equal
      to the saved note text verbatim and the optional `model` /
      `unavailable_model` / `unavailable_code` facts recorded at the time. The
      same note replays as a `replay_provider_fallback` ProviderFallbackNote and
      was announced live by the separate provider_fallback frame; a valid note
      must never be degraded to the malformed-item placeholder.
    example: "message"
  view_membership:
    type: string
    readOnly: true
    enum:
      - chat
      - model
      - both
    description: >
      C-ARCHIVE (session-core FR-004): which view(s) of the single append-only
      archive this entry belongs to — "chat" (rendered in the conversation),
      "model" (part of the model context window), or "both". Server-owned
      (readOnly): the server writes it and emits the entry's effective
      chat/both membership for included entries; clients never send it. An
      entry classified "model" is not part of the chat projection and is not
      returned here. Optional and additive: entries written before this field
      existed carry no value, and the server treats absent as unknown rather
      than re-deriving a view. This is a per-entry classification on the one
      archive, never by itself a second store.
    example: "both"
  role:
    type: string
    enum:
      - user
      - assistant
      - system
    description: Author role. Absent on compaction entries.
    example: "assistant"
  content:
    type: string
    description: Raw markdown/text content of the message.
    example: "I can help you with that!"
  summary:
    type: string
    description: Compaction summary text (present only on type=compaction entries).
    example: "Compacted 120 messages."
  timestamp:
    type: string
    format: date-time
    description: RFC3339 timestamp when this entry was recorded.
    example: "2026-05-16T10:01:00Z"
  tokens:
    type: integer
    minimum: 0
    description: Token count for this entry (input + output). Absent when zero.
    example: 150
  cost:
    type: number
    format: double
    minimum: 0
    description: USD cost for this entry. Absent when zero.
    example: 0.00045
  status:
    type: string
    enum:
      - ok
      - error
      - interrupted
    description: Completion status of this message turn.
    example: "ok"
  attachments:
    type: array
    items:
      $ref: './Attachment.yaml'
    description: File attachments associated with this message.
  tool_calls:
    type: array
    items:
      $ref: './ToolCall.yaml'
    description: Tool invocations made during this message turn.
  agent_id:
    type: string
    description: ID of the agent that produced this entry (FR-002). Always present.
    example: "jim"
  participant:
    $ref: ./ChatParticipant.yaml
  reply_to_participant:
    $ref: ./ChatParticipant.yaml
  reply_to_message_id:
    type: string
    minLength: 1
    readOnly: true
    description: >
      Present only on a guest reply (session-core FR-027): the message_id of
      the admitted request this entry answers. The guest author is the
      existing agent_id. Same value live and on replay.
    example: "msg_01HXYZ"
  messages_compacted:
    type: integer
    description: Number of messages compacted (present only on compaction entries).
    example: 120
  interruption_reason:
    type: string
    readOnly: true
    enum:
      - tool_limit
      - reconciliation_required
    description: >
      Server-produced cause of the current interruption. Omitted rather than null.
      Required for a newly recorded interrupted outcome; absent on other outcomes.
  truncated:
    type: boolean
    description: >
      Set to true on the last assistant entry when the entry is incomplete —
      see `truncation_reason` for why. Only present when true.
    example: true
  truncation_reason:
    type: string
    enum:
      - cancelled
      - max_output_tokens
    description: >
      Narrows why `truncated` is true: "cancelled" (the user canceled the
      turn mid-stream) or "max_output_tokens" (the provider's output-token
      limit cut the answer off before it finished). Absent on a
      `truncated: true` entry means the reason is not recorded: readers do
      not default it to "cancelled" or to anything else (ADR-087 D2;
      session-core DEL-F36).
    example: "max_output_tokens"
  turn_id:
    type: string
    description: >
      Turn identifier — present on type="turn_canceled" entries (FR-15) and
      type="context_window_notice" diagnostics (ADR-066 MAJ-CW-009).
      Retains the original turn identity in REST history, live delivery and replay.
    example: "turn-T3"
  goal_id:
    type: string
    description: >
      session-core FR-039 / C-GOAL. The goal the entry's producing turn was
      dispatched under (from session.TranscriptEntry.GoalID). REST history, live
      delivery and replay retain the SAME association so the SPA joins each
      message to its own exact keyed goal criteria. Absent means UNKNOWN
      association; a later goal's frame must never rebind an earlier message.
    example: "goal_01J3ZQK8N2H8VXNRP5T7C9M4WU"
  canceled_by_user:
    type: string
    description: >
      Username of the actor who triggered the cancel — present only on
      type="turn_canceled" entries (FR-15).
    example: "admin"
  canceled_by_channel:
    type: string
    description: >
      Channel that originated the cancel request — present only on
      type="turn_canceled" entries (FR-15).
    example: "webchat"
  cancel_method:
    type: string
    enum:
      - graceful
      - hard
    description: >
      How the cancel was applied — present only on type="turn_canceled" entries
      (FR-15). "graceful" lets the in-flight tool finish; "hard" interrupts
      immediately.
    example: "graceful"
  descendants_canceled:
    type: array
    items:
      type: string
    description: >
      IDs of descendant turns that were canceled in cascade — present only on
      type="turn_canceled" entries (FR-6a).
    example: ["turn-T3-sub-1"]
  model:
    type: string
    description: >
      Identifier of the model that produced this assistant turn (per-turn
      record). Present on assistant entries, and on a provider_fallback note
      it is the fallback model that actually answered (ProviderFallbackNote's
      answered_model). Absent on legacy turns recorded before the per-turn
      model field was added — those entries do not display any model info in
      the UI (no placeholder). Empty string is treated the same as absent for
      UI display.
    example: "z-ai/glm-5.2"
  unavailable_model:
    type: string
    readOnly: true
    minLength: 1
    maxLength: 256
    description: Recorded unavailable primary model on a provider_fallback note; omitted when unknown.
  unavailable_code:
    type: string
    readOnly: true
    enum:
      - rate_limited
      - model_retired
    description: Recorded fallback condition; model_retired controls the existing model-settings hint.
  verdict:
    $ref: './JudgeVerdict.yaml'
  context_window_notice:
    $ref: './ContextWindowNotice.yaml'
  system_subtype:
    type: string
    enum:
      - browser_handover_notice
      - expiry_notice
      - goal_outcome
      - helper_event
      - subagent_start
      - subagent_state
      - subagent_message
      - subagent_end
    description: >
      BROWSER-FR-043a (C-83) — a second, orthogonal axis on a
      `type: system` entry, discriminating WHICH kind of system entry this
      is without prefix-matching `content` (the `"Handoff:"` prefix match
      this pattern deliberately avoids repeating). Do NOT add a value here
      to the `type` enum above — the entry's `type` stays `system`; this
      field only narrows it further. OPTIONAL and ADDITIVE: absent on
      every system entry that predates this delivery and on every system
      entry that is not one of the subtypes below. A closed enum so a
      future subtype is a deliberate contract edit rather than a free-text
      field silently widening. `pkg/gateway/replay.go` discriminates on
      this stamped field (never on `content`) to emit the same frame type
      on replay as was emitted live: `browser_handover_notice` →
      `BrowserHandoverNoticeFrame` (BROWSER-FR-043a); `goal_outcome` →
      `GoalOutcomeFrame` (the goal outcome line, founder decision
      2026-09-14 — the entry also carries `goal_outcome`); `subagent_start`
      / `subagent_state` / `subagent_message` / `subagent_end` → the
      matching `SubagentStartFrame` / `SubagentStateFrame` /
      `SubagentMessageFrame` / `SubagentEndFrame` (ADR-091 D7/I-4 —
      steer_frames.go's persisted sub-agent lifecycle frames, carried on
      this `Message` by the dedicated `subagent_start` / `subagent_state`
      / `subagent_message` / `subagent_end` fields below, the same
      stamped-field convention `goal_outcome` already established).
      Hard Constraint #8: this closes the gap where the gateway served
      these four subtypes without the generated validator ever having
      learned them, failing every fetch of a session that delegated
      (the tester's own run only exercised three of the four —
      subagent_message persists through the identical path, steer_frames.go's
      persistSubagentEntry, so this fix covers it too rather than leaving
      the same defect for the next delegation that happens to emit one).
    example: "browser_handover_notice"
  goal_outcome:
    $ref: './GoalOutcome.yaml'
  helper_event:
    $ref: './HelperEvent.yaml'
  # subagent_start/state/message/end below are present only on the
  # matching `system_subtype` entry (ADR-091 D7/I-4) — steer_frames.go's
  # persisted sub-agent lifecycle frames. Plain $ref, no sibling
  # description: OAS 3.0.3 (this file's `openapi:` version) ignores keys
  # sibling to $ref, matching goal_outcome's own plain-$ref precedent
  # immediately above.
  subagent_start:
    $ref: './SubagentStartFrame.yaml'
  subagent_state:
    $ref: './SubagentStateFrame.yaml'
  subagent_message:
    $ref: './SubagentMessageFrame.yaml'
  subagent_end:
    $ref: './SubagentEndFrame.yaml'
  terminal_outcome:
    type: boolean
    description: >
      Present and true only on an assistant entry that is a turn's distinct
      terminal outcome sentence, separate from its preceding narration. Same
      value as ReplayMessageFrame.terminal_outcome; historical hydration must not
      merge this entry into the preceding same-turn assistant message. Absent on
      other entries, including older entries without this recorded field.
    example: true
  room_ref:
    $ref: './RoomRef.yaml'
    description: >
      Spec omnipus-system-agent K33 (FR-202, FR-215). Present when this
      main-session entry is a room request to this agent or this agent's
      answer into a room, so live, history and replay render the same
      collapsed entry.
