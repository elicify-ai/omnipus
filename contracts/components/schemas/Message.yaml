type: object
description: >
  A single transcript entry (session.TranscriptEntry on the Go side).
  Maps to the Message interface in src/lib/api.ts. The SPA reads this
  from GET /sessions/{id}/messages.
required:
  - id
  - timestamp
  - agent_id
additionalProperties: false
properties:
  id:
    type: string
    description: Unique message identifier.
    example: "msg_01HXYZ"
  client_message_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      #823 catch-up redesign. Present on a user entry that was persisted with a
      client-supplied correlation id (mirrors MessageFrame.client_message_id /
      ReplayMessageFrame.client_message_id). Lets a client reconcile its own pending/sent
      bubble against this REST-loaded entry by id instead of by content+timestamp
      matching. Absent on entries written before this field existed and on non-user
      entries.
    example: "cmid_01HXYZ"
  type:
    type: string
    enum:
      - message
      - compaction
      - system
      - tool_call
      - turn_canceled
      - judge_verdict
    description: >
      Entry classification. Absent or empty means "message" (backwards compatible).
      "compaction" entries summarize pruned context; "system" entries are internal
      markers; "tool_call" entries record tool invocations; "turn_canceled" entries
      mark a turn that was canceled mid-stream (FR-15); "judge_verdict" entries
      (ADR-049 D2/D4) record a Judge System Agent adjudication of a task attempt
      or plan round — written alongside the worker's ADR-043 completion marker
      so the two cannot silently disagree, and mirrored live by the
      `JudgeVerdictFrame` WS push (same `verdict` shape). The Go-side EntryType
      constant set is the source of truth (`pkg/session/daypartition.go`).
    example: "message"
  role:
    type: string
    enum:
      - user
      - assistant
      - system
    description: Author role. Absent on compaction entries.
    example: "assistant"
  content:
    type: string
    description: Raw markdown/text content of the message.
    example: "I can help you with that!"
  summary:
    type: string
    description: Compaction summary text (present only on type=compaction entries).
    example: "Compacted 120 messages."
  timestamp:
    type: string
    format: date-time
    description: RFC3339 timestamp when this entry was recorded.
    example: "2026-05-16T10:01:00Z"
  tokens:
    type: integer
    minimum: 0
    description: Token count for this entry (input + output). Absent when zero.
    example: 150
  cost:
    type: number
    format: double
    minimum: 0
    description: USD cost for this entry. Absent when zero.
    example: 0.00045
  status:
    type: string
    enum:
      - ok
      - error
      - interrupted
    description: Completion status of this message turn.
    example: "ok"
  attachments:
    type: array
    items:
      $ref: './Attachment.yaml'
    description: File attachments associated with this message.
  tool_calls:
    type: array
    items:
      $ref: './ToolCall.yaml'
    description: Tool invocations made during this message turn.
  agent_id:
    type: string
    description: ID of the agent that produced this entry (FR-002). Always present.
    example: "jim"
  messages_compacted:
    type: integer
    description: Number of messages compacted (present only on compaction entries).
    example: 120
  truncated:
    type: boolean
    description: >
      Set to true on the last assistant entry when the entry is incomplete —
      see `truncation_reason` for why. Only present when true.
    example: true
  truncation_reason:
    type: string
    enum:
      - cancelled
      - max_output_tokens
    description: >
      Narrows why `truncated` is true: "cancelled" (the user canceled the
      turn mid-stream) or "max_output_tokens" (the provider's output-token
      limit cut the answer off before it finished). Absent on a
      `truncated: true` entry means "cancelled" — every entry written
      before this field existed predates it and was always a cancel
      (ADR-087 D2).
    example: "max_output_tokens"
  turn_id:
    type: string
    description: >
      Turn identifier — present only on type="turn_canceled" entries (FR-15).
      Identifies the turn that was canceled.
    example: "turn-T3"
  canceled_by_user:
    type: string
    description: >
      Username of the actor who triggered the cancel — present only on
      type="turn_canceled" entries (FR-15).
    example: "admin"
  canceled_by_channel:
    type: string
    description: >
      Channel that originated the cancel request — present only on
      type="turn_canceled" entries (FR-15).
    example: "webchat"
  cancel_method:
    type: string
    enum:
      - graceful
      - hard
    description: >
      How the cancel was applied — present only on type="turn_canceled" entries
      (FR-15). "graceful" lets the in-flight tool finish; "hard" interrupts
      immediately.
    example: "graceful"
  descendants_canceled:
    type: array
    items:
      type: string
    description: >
      IDs of descendant turns that were canceled in cascade — present only on
      type="turn_canceled" entries (FR-6a).
    example: ["turn-T3-sub-1"]
  model:
    type: string
    description: >
      Identifier of the model that produced this assistant turn (per-turn
      record). Present on assistant entries only. Absent on legacy turns
      recorded before the per-turn model field was added — those entries do
      not display any model info in the UI (no placeholder). Empty string
      is treated the same as absent for UI display.
    example: "z-ai/glm-5.2"
  verdict:
    $ref: './JudgeVerdict.yaml'
  system_subtype:
    type: string
    enum:
      - browser_handover_notice
      - goal_outcome
      - subagent_start
      - subagent_state
      - subagent_message
      - subagent_end
    description: >
      BROWSER-FR-043a (C-83) — a second, orthogonal axis on a
      `type: system` entry, discriminating WHICH kind of system entry this
      is without prefix-matching `content` (the `"Handoff:"` prefix match
      this pattern deliberately avoids repeating). Do NOT add a value here
      to the `type` enum above — the entry's `type` stays `system`; this
      field only narrows it further. OPTIONAL and ADDITIVE: absent on
      every system entry that predates this delivery and on every system
      entry that is not one of the subtypes below. A closed enum so a
      future subtype is a deliberate contract edit rather than a free-text
      field silently widening. `pkg/gateway/replay.go` discriminates on
      this stamped field (never on `content`) to emit the same frame type
      on replay as was emitted live: `browser_handover_notice` →
      `BrowserHandoverNoticeFrame` (BROWSER-FR-043a); `goal_outcome` →
      `GoalOutcomeFrame` (the goal outcome line, founder decision
      2026-09-14 — the entry also carries `goal_outcome`); `subagent_start`
      / `subagent_state` / `subagent_message` / `subagent_end` → the
      matching `SubagentStartFrame` / `SubagentStateFrame` /
      `SubagentMessageFrame` / `SubagentEndFrame` (ADR-091 D7/I-4 —
      steer_frames.go's persisted sub-agent lifecycle frames, carried on
      this `Message` by the dedicated `subagent_start` / `subagent_state`
      / `subagent_message` / `subagent_end` fields below, the same
      stamped-field convention `goal_outcome` already established).
      Hard Constraint #8: this closes the gap where the gateway served
      these four subtypes without the generated validator ever having
      learned them, failing every fetch of a session that delegated
      (the tester's own run only exercised three of the four —
      subagent_message persists through the identical path, steer_frames.go's
      persistSubagentEntry, so this fix covers it too rather than leaving
      the same defect for the next delegation that happens to emit one).
    example: "browser_handover_notice"
  goal_outcome:
    $ref: './GoalOutcome.yaml'
  # subagent_start/state/message/end below are present only on the
  # matching `system_subtype` entry (ADR-091 D7/I-4) — steer_frames.go's
  # persisted sub-agent lifecycle frames. Plain $ref, no sibling
  # description: OAS 3.0.3 (this file's `openapi:` version) ignores keys
  # sibling to $ref, matching goal_outcome's own plain-$ref precedent
  # immediately above.
  subagent_start:
    $ref: './SubagentStartFrame.yaml'
  subagent_state:
    $ref: './SubagentStateFrame.yaml'
  subagent_message:
    $ref: './SubagentMessageFrame.yaml'
  subagent_end:
    $ref: './SubagentEndFrame.yaml'
