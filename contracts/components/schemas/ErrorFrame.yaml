title: ErrorFrame
description: >
  Server → client. Error notification. May be global (no session_id, e.g.,
  auth failure) or session-scoped. The SPA displays the message as a toast or
  inline error. Does NOT terminate the WebSocket connection.
type: object
required:
  - type
  - message
additionalProperties: false
properties:
  type:
    type: string
    const: error
  session_id:
    type: string
    maxLength: 128
    description: >
      Session this error relates to. Optional: global errors (auth, connection)
      are not tied to a specific session.
  message:
    type: string
    minLength: 1
    maxLength: 4096
    description: Human-readable error description.
  payload:
    $ref: ./ErrorPayload.yaml

  seq:
    type: integer
    format: int64
    minimum: 0
    description: >-
      Per-session sequence number of this frame. Strictly increasing and gap-free within
      the session, assigned by the gateway as the frame is emitted. The client stores the
      highest seq it has applied per session and sends it back as since_seq on
      attach_session; frames at or below that cursor are ignored, which makes re-delivery
      idempotent. 0 means the session has no numbered event yet.
