title: McpServerTestResponse
description: >
  Result of POST /mcp-servers/{id}/test — an on-demand connectivity probe that
  attempts to connect to the configured MCP server via a temporary connection
  and reports whether it succeeded and which tools it exposed. On success, if
  the server is enabled in config, the global MCP kill-switch
  (tools.mcp.enabled) is also on, and the server is not currently connected in
  the live manager, this additionally triggers a live reconciliation pass to
  bring the real connection in line with what the test just proved reachable.
  When the global kill-switch is off, the message notes that MCP is globally
  disabled instead of silently skipping reconciliation. A failed test never
  changes any state.
type: object
required:
  - success
  - message
additionalProperties: false
properties:
  success:
    type: boolean
    description: True when the gateway connected and initialized the server.
    example: true
  message:
    type: string
    description: Human-readable result (connection summary, or the failure reason).
    example: "Connected to 'everything' (stdio); 5 tools."
  tool_count:
    type: integer
    minimum: 0
    description: Number of tools enumerated on success.
    example: 5
  tools:
    type: array
    items:
      type: string
    description: Tool names enumerated on success.
    example:
      - "search"
      - "fetch"
