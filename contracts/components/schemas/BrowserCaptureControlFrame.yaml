title: BrowserCaptureControlFrame
description: >
  Bidirectional control frame on the /api/v1/browser/capture-ingest
  channel. Server (gateway) → client (extension) for `recapture` (the
  agent's active tab changed — chrome.tabs.query({active:true}) must be
  re-bound; triggered by the same live.go onTabsChanged/rebindWatch
  tab-follow logic that also drives the live-view session/control-lock
  bookkeeping, ADR-047 D2) and `shutdown` (the capture session is ending — last viewer
  detached past the grace period, or the gateway is stopping the stream);
  client (extension) → server (gateway) for `ping`, the encoder page's
  periodic health beacon / reconnect-watchdog signal. `reason` is an
  optional human-readable note (e.g. why shutdown was requested).
type: object
required:
  - type
  - action
additionalProperties: false
properties:
  type:
    type: string
    const: browser_capture_control
  action:
    type: string
    enum:
      - recapture
      - shutdown
      - ping
  reason:
    type: string
    maxLength: 512
    description: Optional human-readable context for the action (e.g. shutdown cause).
  expected_width:
    type: integer
    minimum: 1
    maximum: 16384
    description: >-
      recapture only, server → extension: the CDP-verified CSS viewport width
      the tab was just resized to (SetViewport's getLayoutMetrics read-back).
      chrome.tabs.get lags the OS window reflow, so a recapture racing a
      resize can pin the whole stream to a stale size (measured live
      2026-07-31: capture stuck at launch geometry while the tab was already
      verified at 615x744). With this present the encoder polls tabs.get
      until it converges on the expected size, falling back to the expected
      value itself on timeout — it is the CDP-verified truth.
  expected_height:
    type: integer
    minimum: 1
    maximum: 16384
    description: 'recapture only: expected CSS viewport height. See expected_width.'
  capture_scale:
    type: number
    minimum: 1
    maximum: 4
    description: >-
      recapture only, server → extension: the deviceScaleFactor the captured
      tab renders at (Emulation.setDeviceMetricsOverride, driven by the
      controlling viewer's window.devicePixelRatio). The encoder multiplies
      its tabCapture width/height constraints by this so the captured frames
      carry PHYSICAL pixels, not CSS pixels. Absent or 1 = capture at CSS
      resolution. Without it a Retina (dpr=2) viewer receives a 1x capture
      stretched over 2x display pixels — uniformly blurry video, reported
      from live use on macOS 2026-08-12. The tabs.get convergence check
      stays in CSS pixels; only the media constraints scale.
