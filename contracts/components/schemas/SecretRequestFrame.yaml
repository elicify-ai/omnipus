title: SecretRequestFrame
description: >
  Server → client (spec omnipus-system-agent K1; FR-061, FR-078, FR-240).
  A secure secret card: an agent asks the person to type one or more secret
  values. The frame is value-free; values travel only in the authenticated
  REST submit (POST /api/v1/secret-requests/{id}/submit). Every field is
  server-derived from the request record — the request id is never
  authority by itself (§6.7). The card renders in the chat whose session id
  is `root_session_id` (or `session_id` when omitted), the same root-origin
  rule as approvals (L1-AMENDMENTS-20261013 §1.3, R7). THIS FILE EXISTS for
  the Constraint #8 5-step process and the pkg/gateway/inboundschemas/ sync
  — the GENERATING copy is the inline schema in contracts/asyncapi.yaml.
  Keep both copies in sync by hand. Landing 1, WU-4 produces it.
type: object
required:
  - type
  - request_id
  - session_id
  - acting_agent_id
  - acting_agent_name
  - purpose
  - recipient
  - fields
additionalProperties: false
properties:
  type:
    type: string
    const: secret_request
  request_id:
    type: string
    minLength: 1
    maxLength: 128
    description: Server-minted id of the secret request.
  session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: The acting session that asked for the secret.
  root_session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: >
      Server-derived root of the acting session's chain (the chat the card
      renders in). Omitted when equal to session_id.
  acting_agent_id:
    type: string
    minLength: 1
    maxLength: 128
    description: The agent that asked.
  acting_agent_name:
    type: string
    minLength: 1
    maxLength: 128
    description: Display name of the agent that asked.
  origin_label:
    type: string
    minLength: 1
    maxLength: 200
    description: >
      Server-derived turn origin label (§6.18), e.g. "for group <name>" when
      the work came from a room. Omitted for a plain web turn.
  workspace_id:
    type: string
    minLength: 1
    maxLength: 128
    description: Workspace of the acting session, when it has one.
  owner:
    $ref: './AgentAddress.yaml'
    description: >
      The owning (workspace, agent) pair — present only for the
      agent_private kind.
  purpose:
    type: string
    minLength: 1
    maxLength: 500
    description: Why the agent needs the secret, in the agent's words.
  recipient:
    $ref: './SecretRecipientDisplay.yaml'
  fields:
    type: array
    minItems: 1
    maxItems: 8
    items:
      $ref: './SecretRequestField.yaml'
    description: The fields to fill, in order. Never null, never empty.
