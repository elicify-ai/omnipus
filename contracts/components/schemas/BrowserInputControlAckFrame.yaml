title: BrowserInputControlAckFrame
description: ADR-081 attachment-scoped dedicated input signaling. Never starts or replaces media capture.
type: object
required:
  - type
  - session_id
  - input_epoch
  - control_epoch
  - ok
additionalProperties: false
properties:
  type:
    type: string
    const: browser_input_control_ack
  session_id:
    type: string
    minLength: 1
    maxLength: 128
  input_epoch:
    type: integer
    minimum: 0
    maximum: 9007199254740991
  control_epoch:
    type: integer
    minimum: 0
    maximum: 9007199254740991
  ok:
    type: boolean
  reason:
    type: string
    maxLength: 512
  capture_id:
    type: string
    minLength: 1
    maxLength: 128
  capture_generation:
    type: integer
    minimum: 1
    maximum: 9007199254740991
