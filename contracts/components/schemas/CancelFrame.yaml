title: CancelFrame
description: >
  Client → server. Request the server to cancel the in-progress turn for the
  given session. The server acknowledges with one or more cancel_stage frames
  (graceful → hard → detached) and eventually a done frame. A cancel that
  finds nothing to stop is answered with cancel_idle (#1841) to the sending
  connection only.
type: object
required:
  - type
  - session_id
additionalProperties: false
properties:
  type:
    type: string
    const: cancel
  session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: >
      Session whose in-progress turn should be cancelled. This is the frame's
      target; compare `origin`.
  origin:
    $ref: ./SendOrigin.yaml
    description: >
      #1428 step 2. The chat the Stop or typed /cancel came from (see
      SendOrigin). The gateway checks it against the target before any side
      effect and refuses a mismatch with send_refused; nothing is cancelled.
      A consistency control, not authorization. Optional on the wire: on a
      browser connection (WebSocket upgrade with an Origin header, not the CLI
      token) a cancel without the origin key is refused with an out-of-date
      reply; on other connections it is accepted as before. `origin: null` is
      malformed, not absent.
  client_frame_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      #1428 step 2. Client-generated correlation id for this command. When it
      is present and valid, the server answers with exactly one
      command_received (accepted and handed to the cancel handler, before any
      cancel_stage or cancel_idle frame for it) or one send_refused carrying
      it. Optional for compatibility with older clients; a current client
      sets it on every cancel it sends (Stop button, Esc, Stop all, typed
      /cancel and /stop).
  scope:
    type: string
    enum:
      - session
      - tree
    default: session
    description: >
      How far the cancellation reaches. `session` — stop the named
      session's in-progress turn only. `tree` — also cascade-stop the
      named session's reachable non-terminal descendant subtree (each
      live turn cancelled with its own stamped generation). Both scopes
      end turns, never goals.
  shown:
    type: object
    additionalProperties: false
    required:
      - code_points
    description: >
      #1534 (founder 2026-10-31, Q3 = A). What this client's screen showed of the
      answer being stopped when Stop was pressed. The server saves the stopped
      answer only up to this point. Sent only by a first Stop that froze a
      streaming answer. Absent: the server cuts at the moment it receives Stop.
    properties:
      turn_id:
        type: string
        minLength: 1
        maxLength: 1024
        description: turn_id of the stopped answer's tokens, when the client knows it.
      message_id:
        type: string
        minLength: 1
        maxLength: 1024
        description: >
          Wire message_id of the last token frame the client applied to the
          stopped answer. Absent when no token had been applied (nothing shown).
      code_points:
        type: integer
        format: int64
        minimum: 0
        description: >
          Unicode code points of token content applied for message_id (a
          replace token resets the count). Client-inserted separators are not
          counted. 0 with no message_id means nothing of this turn was shown.
