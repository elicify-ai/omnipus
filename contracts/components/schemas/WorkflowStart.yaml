title: WorkflowStart
description: >
  Optional target data on a MessageFrame that starts an Omnipus workflow
  from a screen (spec omnipus-system-agent K8; FR-012). Target data only —
  it names which workflow and which workspace the user picked; it is never
  an instruction and grants nothing. The server treats it as data for the
  Omnipus turn (landing 1, WU-10). Mirrored inline in
  contracts/asyncapi.yaml (components.schemas.WorkflowStart) — keep both
  copies in sync by hand.
type: object
required:
  - workflow
additionalProperties: false
properties:
  workflow:
    type: string
    enum:
      - W1
      - W5
      - W18
    description: >
      W1 — create an agent in a workspace; W5 — write a skill (Skills &
      Tools spec C-8, started from the Skills & Tools page); W18 — set up a
      whole team.
    example: W5
  target_workspace_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      The workspace the workflow targets. Required for W1 and W18 (the
      server refuses a W1 or W18 start without it with 400); optional for
      W5, where it is absent when started from Skills & Tools (the
      write-skill card proposes a global skill and still lets the person
      pick a workspace's project shelf). OpenAPI 3.0 cannot express the
      per-workflow requirement, so the server enforces it (C-8).
    example: ws_research
