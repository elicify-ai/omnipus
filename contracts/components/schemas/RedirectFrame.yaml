title: RedirectFrame
description: >
  Client → server. Redirect one session — the wire transport of the
  `/stop-redirect` chat command (ADR-20260928 sub-agent control plane, D2
  redirect sequence, D9 row 2): stop the named session's in-progress turn,
  then resume it on the same generation with `instruction` as the newest
  instruction. The SPA sends this frame from its client-side interception of
  the typed command — never as chat text, which mid-stream would only enter
  the steering queue. Scope is fixed by D9: the named session only, its
  subtree keeps working; there is deliberately no scope field. The server's
  redirect handler (a later unit) owns the runtime checks a JSON Schema
  cannot express: the 16384-byte instruction ceiling (maxLength counts
  characters, not UTF-8 bytes), the authoritative Unicode-aware trim behind
  the nonblank rule, helper-identity resolution (root chats are refused with
  guidance), and D4's existing redirect rate/body-cap semantics — this frame
  adds no cap or rate behavior of its own.
type: object
required:
  - type
  - session_id
  - instruction
additionalProperties: false
properties:
  type:
    type: string
    const: redirect
  session_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      The helper session to redirect. A root chat is refused with guidance
      server-side (D9 row 3); the frame cannot express a root redirect.
  instruction:
    type: string
    minLength: 1
    maxLength: 16384
    pattern: '\S'
    description: >
      The redirect instruction; becomes the newest instruction of the resumed
      turn. Must be nonblank after whitespace trimming — a blank or
      whitespace-only instruction gets a usage reply and changes nothing
      (D9 row 2). `pattern: '\S'` is only a client-side approximation (any
      non-whitespace character anywhere); the authoritative check is the
      server's Unicode-aware trim. Ceiling: 16384 UTF-8 bytes (16 KiB, the
      D4/T22 steer-body ceiling — exactly 16 KiB accepted, over refused).
      JSON Schema maxLength counts characters (UTF-16 code units), not bytes,
      so maxLength: 16384 does NOT prove byte-bound enforcement; the server
      redirect handler MUST enforce the byte ceiling at runtime.
    example: "Skip the xlsx shard, export the CSV now."
