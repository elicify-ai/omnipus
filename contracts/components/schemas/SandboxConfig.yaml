title: SandboxConfig
description: >
  Sandbox configuration returned by GET /api/v1/security/sandbox-config and
  as part of PUT /api/v1/security/sandbox-config responses.
type: object
properties:
  mode:
    type: string
    description: Configured sandbox enforcement mode.
    enum:
      - off
      - permissive
      - enforce
    example: enforce
  applied_mode:
    type: string
    description: >
      The mode the gateway is currently enforcing. Differs from `mode` when
      the operator saved a change but has not restarted yet.
    example: permissive
  allow_network_outbound:
    type: boolean
    description: Whether outbound network access is permitted from the sandbox.
    example: false
  allowed_paths:
    type: array
    items:
      type: string
    description: >
      File system paths the sandboxed process may access.
      Empty array means use only default allowed paths.
    example:
      - /tmp/workspace
  ssrf_enabled:
    type: boolean
    description: Whether SSRF (server-side request forgery) protection is active.
    example: true
  ssrf_allow_internal:
    type: array
    items:
      type: string
    description: >
      IP addresses, hostnames, or CIDR ranges that are allowed to receive
      outbound requests even when SSRF protection is enabled.
      Empty array means block all internal addresses.
    example:
      - 192.168.1.100
  ssrf:
    type: object
    description: Nested SSRF config block for backward-compatible clients.
    properties:
      enabled:
        type: boolean
      allow_internal:
        type: array
        items:
          type: string
  god_mode:
    type: boolean
    description: >
      O14 global god-mode ("bypass-permissions") runtime state. When true, every
      agent's tool policy is floored at "allow", the kernel sandbox is off,
      network egress is open, and the shell guard is off — regardless of
      per-agent profiles. Audit logging, the prompt-injection guard, and rate
      limiting stay on. Toggled via POST /api/v1/gateway/god-mode (password
      step-up). Always false when god mode is unavailable.
    example: false
  god_mode_available:
    type: boolean
    description: >
      Whether god mode CAN be enabled in this gateway: the build supports it
      (not compiled with the nogodmode tag) AND --allow-god-mode was passed at
      boot. The runtime god_mode switch is a no-op when this is false.
    example: false
  shell_deny_patterns:
    type: array
    items:
      type: string
    description: >
      Global fallback shell command deny-list (regex entries).
      Per-agent custom patterns extend this list.
    example:
      - "^curl\\s"
      - "^wget\\s"
  requires_restart:
    type: boolean
    description: >
      Present in PUT responses. True when the change requires a gateway
      restart to take effect (mode, allowed_paths).
  saved:
    type: boolean
    description: Present in PUT responses. Always true on success.
