title: SandboxConfig
description: >
  Sandbox configuration returned by GET /api/v1/security/sandbox-config and
  as part of PUT /api/v1/security/sandbox-config responses.
type: object
properties:
  mode:
    type: string
    description: Configured sandbox enforcement mode.
    enum:
      - off
      - permissive
      - enforce
    example: enforce
  filesystem_model:
    type: string
    enum:
      - confined
      - open
    description: >
      The ADR-062 filesystem model this installation is configured for.
      "confined" enumerates the paths that may be read and executed; "open"
      leaves reads and execution unrestricted apart from the secret set. It
      never changes what an agent may WRITE — writes are confined to the
      workspace and its mounts under both models.

      Reported here, and settable via SandboxConfigUpdate, because the two
      postures are indistinguishable from outside: an operator cannot tell from
      behaviour whether a read succeeded because the model is open or because
      that path happened to be on the enumerated list. Without a control, the
      only way to change it was to hand-edit config.json.
    example: open
  applied_mode:
    type: string
    description: >
      The mode the gateway is currently enforcing. Differs from `mode` when
      the operator saved a change but has not restarted yet.
    example: permissive
  allow_network_outbound:
    type: boolean
    description: Whether outbound network access is permitted from the sandbox.
    example: false
  allowed_paths:
    type: array
    items:
      type: string
    description: >
      File system paths the sandboxed process may access.
      Empty array means use only default allowed paths.
    example:
      - /tmp/workspace
  ssrf_enabled:
    type: boolean
    description: Whether SSRF (server-side request forgery) protection is active.
    example: true
  ssrf_allow_internal:
    type: array
    items:
      type: string
    description: >
      IP addresses, hostnames, or CIDR ranges that are allowed to receive
      outbound requests even when SSRF protection is enabled.
      Empty array means block all internal addresses.
    example:
      - 192.168.1.100
  ssrf:
    type: object
    description: Nested SSRF config block for backward-compatible clients.
    properties:
      enabled:
        type: boolean
      allow_internal:
        type: array
        items:
          type: string
  god_mode:
    type: boolean
    description: >
      O14 global god-mode ("bypass-permissions") runtime state. When true,
      every agent's tool-policy ceiling is floored at "allow" (for every
      tool, not just bash) — which also makes `auto_approve` below moot for
      that agent, since Auto only ever applies to a tool resolved to "ask"
      and nothing is left in "ask" state once the ceiling is floored. The
      kernel sandbox is off and network egress is open. Operator `deny`
      command rules (ADR-092 D3) still apply — the floor cannot erase them.
      Audit logging, the prompt-injection guard, and rate limiting stay on.
      Toggled via POST /api/v1/gateway/god-mode (password step-up). Always
      false when god mode is unavailable. Independent of `auto_approve` —
      the two are separate mechanisms.
    example: false
  god_mode_available:
    type: boolean
    description: >
      Whether god mode CAN be enabled in this gateway: the build supports it
      (not compiled with the nogodmode tag) AND --allow-god-mode was passed at
      boot. The runtime god_mode switch is a no-op when this is false.
    example: false
  workspace_path_guard:
    type: boolean
    description: >
      ADR-068 §6. Whether the bash tool confines filesystem paths to the agent's
      working directory. This is NOT the kernel sandbox (`mode`) — it is a
      separate, app-layer guard that runs in-process before any child is
      spawned, and the two were previously confusable because only the kernel
      one had a control (UAT defect 002). When true, a WRITE outside the working
      directory needs an approved workspace mount; reads outside it are allowed
      either way. Resolves into AgentDefaults.RestrictToWorkspace. Defaults to
      true (fail-closed) when unset.
    example: true
  workspace_path_guard_env_override:
    type: boolean
    description: >
      True when OMNIPUS_AGENTS_DEFAULTS_RESTRICT_TO_WORKSPACE is set in the
      gateway's environment and is therefore outranking the saved value. While
      it is true a change to workspace_path_guard would persist and change
      nothing at runtime, so the UI must present the control as locked rather
      than offering a write that silently does nothing.
    example: false
  auto_approve:
    type: boolean
    description: >
      ADR-092's global default for Auto-approve (fresh-install default:
      true). Auto is NOT a tool-policy value — every tool, including bash,
      keeps the ordinary three-value policy ("allow" runs unprompted with
      none of this machinery, "deny" makes the tool invisible to the
      agent, "ask" is where Auto applies). For every tool currently
      resolved to "ask", Auto-approve ON auto-approves the cases the
      pre-flight/rule matcher can positively clear against the kernel
      sandbox (ADR-092 D3/D7/D8) and still prompts for everything else;
      Auto-approve OFF means an "ask" tool always prompts. Auto never
      touches an "allow" or "deny" tool, and never reaches past what the
      kernel sandbox can actually confine (no active kernel sandbox ⇒
      nothing can be positively cleared ⇒ every "ask" call prompts
      regardless of this setting — see SandboxStatus.kernel_sandbox_active).

      This is the GLOBAL default only. Two narrower scopes layer on top,
      neither stored here: a per-agent setting
      (Agent.auto_approve_disabled) that may only turn Auto OFF for that
      agent, and a per-chat session modifier
      (SessionModeUpdateFrame, asyncapi.yaml) that may turn Auto ON OR OFF
      for that one chat — deliberately allowed to loosen, since a human is
      present in that session; every other scope in this contract is
      tighten-only.

      Deliberately named `auto_approve`, not `mode` — this schema's
      existing `mode` field is the unrelated kernel sandbox enforcement
      mode (off/permissive/enforce); reusing that key for a different
      value domain would collide. Hot-reloaded, like the rest of this
      handler's fields — no restart required.
    example: true
  command_rules:
    type: array
    maxItems: 1000
    items:
      $ref: './CommandRule.yaml'
    description: >
      ADR-092 D3 operator shell command rules (sandbox.command_rules),
      in stored order. Always present on GET — an empty array means no
      operator rules are configured, and bash then follows its tool policy
      and the Auto-approve setting unmodified. Evaluated for every bash call
      in every mode, God Mode included; deny beats ask beats allow. See
      CommandRule for the matching semantics.
  requires_restart:
    type: boolean
    description: >
      Present in PUT responses. True when the change requires a gateway
      restart to take effect (mode, allowed_paths).
  saved:
    type: boolean
    description: Present in PUT responses. Always true on success.
