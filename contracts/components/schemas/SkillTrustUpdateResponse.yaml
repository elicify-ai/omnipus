title: SkillTrustUpdateResponse
description: >
  Response from PUT /api/v1/security/skill-trust. Updated skill trust level.
type: object
required:
  - saved
  - requires_restart
  - applied_level
properties:
  saved:
    type: boolean
    example: true
  requires_restart:
    type: boolean
    example: false
  applied_level:
    type: string
    enum:
      - block_unverified
      - warn_unverified
      - allow_all
    example: block_unverified
  warning:
    type: string
    description: Present when allow_all is selected — warns that hash verification is disabled.
