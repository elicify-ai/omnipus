title: WhatsAppPairingFrame
description: >
  Server → client. Emitted by the WhatsApp native/QR channel during linked-device
  pairing so the SPA can render the QR code and live status in the browser instead
  of requiring the operator to read the gateway terminal (#283). Fields map to the
  generated WhatsAppPairingFrame type in pkg/api/generated/.
type: object
required:
  - type
  - channel_id
  - status
additionalProperties: false
properties:
  type:
    type: string
    const: whatsapp_pairing
  channel_id:
    type: string
    minLength: 1
    description: The channel emitting the pairing event (e.g. "whatsapp_native").
  status:
    type: string
    enum:
      - waiting
      - code
      - linked
      - timeout
      - error
      - stopped
    description: >
      Pairing lifecycle: waiting (connecting to WhatsApp), code (a QR is available to
      scan), linked (device successfully paired), timeout (the displayed QR expired
      and a fresh one follows), error (pairing failed — see message), stopped (the
      user pressed Stop in the chat that started the pairing; no further codes
      follow — spec omnipus-system-agent BDD-8.8, FR-081).
  qr:
    type: string
    description: >
      The QR payload to render (whatsmeow linked-device pairing code). Present when
      status is "code"; empty otherwise. Transient pairing secret — the SPA holds it
      only while the config panel is open and never persists it.
  message:
    type: string
    description: Optional human-readable detail, e.g. the error reason when status is "error".
  request_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      Spec omnipus-system-agent K10 (FR-081). Correlates the pairing with
      the chat request that started it (QR pairing in chat, WU-7).
  session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: >
      Spec K10. The chat session the pairing belongs to, when it was
      started from a chat.
