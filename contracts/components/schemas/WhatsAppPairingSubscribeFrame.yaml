title: WhatsAppPairingSubscribeFrame
description: >
  Client → server. Registers or clears THIS connection's interest in a channel's
  whatsapp_pairing (QR/status) frames. The SPA sends active:true when an operator
  opens a channel's pairing UI and active:false when they leave, so the QR pairing
  secret is delivered only to the connection that is watching rather than every
  authenticated connection (#283). Subscribing (including the automatic re-subscribe on reconnect) only observes pairing frames: it never restores chat ownership of a pairing and never restarts pairing. A chat Retry claims ownership through PUT /api/v1/channels/{id}/enable with pairing_retry.
type: object
required:
  - type
  - channel_id
  - active
additionalProperties: false
properties:
  type:
    type: string
    const: whatsapp_pairing_subscribe
  channel_id:
    type: string
    minLength: 1
    description: The channel whose pairing frames this connection wants (e.g. "whatsapp_native").
  active:
    type: boolean
    description: true to start receiving pairing frames for channel_id on this connection, false to stop.
  request_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      Spec omnipus-system-agent K10 (FR-081). Correlation hint naming the
      chat request that started the pairing (QR pairing in chat, WU-7).
      It is not authority: subscribing never restores ownership.
  session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: >
      Spec K10. Correlation hint naming the chat session the pairing
      belongs to, when it was started from a chat. It is not authority:
      subscribing never restores ownership.
