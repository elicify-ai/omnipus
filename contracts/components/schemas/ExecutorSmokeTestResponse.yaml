type: object
description: >
  The result of actually running a trivial test prompt through an
  external-CLI worker's real dispatch path. Always 200 (even for a failed
  run) — the outcome is carried in `ok`/`error`, not the HTTP status,
  matching POST /system/cli-validate's convention of using the body for
  domain-level failure rather than 4xx/5xx.
required:
  - ok
  - duration_ms
  - used_agent_workspace
additionalProperties: false
properties:
  ok:
    type: boolean
    description: Whether the CLI produced a real response before the bounded timeout/turn cap was reached.
  response_text:
    type: string
    description: >
      The CLI's actual final response text. Present when ok is true; absent
      (or empty) otherwise.
  error:
    type: string
    description: >
      A human-readable reason the run did not succeed (process failed to
      start, authentication failed, timed out, exceeded the bounded turn
      cap, or the CLI itself reported an error). Present when ok is false.
  duration_ms:
    type: integer
    description: Wall-clock time the run actually took, in milliseconds.
  used_agent_workspace:
    type: boolean
    description: >
      True when the request's agent_id resolved to a real, saved agent and
      the run happened in that agent's own dedicated directory
      ($OMNIPUS_HOME/agents/{id}/, AgentConfig.Workspace — a per-agent
      folder, NOT the separate, multi-agent pkg/workspace.Workspace
      feature — this field name refers only to the former) — the same
      place a genuine delegation to it would run. False means the run
      happened in a disposable ephemeral scratch directory instead
      (agent_id was omitted, blank, or didn't resolve to an existing
      agent — e.g. testing from the create wizard before the agent has
      been saved).
