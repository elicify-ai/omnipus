title: MailboxConfigureRequest
description: >
  Request body to configure one (agent, workspace) mailbox account (M11). The
  target agent and workspace are both path parameters
  (PUT /agents/{id}/mailboxes/{workspaceId}) — an agent can hold a different
  mailbox in each workspace it belongs to. The password, when present, is routed
  into the encrypted credential store and persisted only as a credential
  reference — it is never written to config.json. Omitting the password leaves
  any existing stored password unchanged; sending an empty string clears it.
type: object
required:
- enabled
- imap_host
- smtp_host
- username
additionalProperties: false
properties:
  enabled:
    type: boolean
    description: Whether to register the email tools for the owning agent.
  imap_host:
    type: string
    description: IMAP server hostname (implicit TLS / IMAPS).
    example: "imap.example.com"
  imap_port:
    type: integer
    description: IMAP server port. Defaults to 993 when omitted.
    example: 993
  smtp_host:
    type: string
    description: SMTP server hostname.
    example: "smtp.example.com"
  smtp_port:
    type: integer
    description: SMTP server port. Defaults to 587 (STARTTLS); 465 selects implicit TLS.
    example: 587
  username:
    type: string
    description: The email address / login used for IMAP and SMTP authentication.
    example: "assistant@example.com"
  password:
    type: string
    description: >
      Mailbox password (or app password). Routed to the encrypted credential
      store; never persisted inline. Omit to keep the existing stored password;
      send an empty string to clear it.
  signature_html:
    type: string
    maxLength: 16384
    description: >
      Optional per-mailbox HTML signature (D2). Sanitized on save with the
      dedicated signature policy before it is persisted. A value longer than
      16,384 characters is rejected with HTTP 400. The plain-text signature
      part is derived at compose time, never stored. Absent or empty means no
      signature is applied.
  sent_folder_name:
    type: string
    description: >
      Advanced override for the mailbox's Sent folder name. Empty (default)
      means the folder is auto-resolved by its standard name.
  drafts_folder_name:
    type: string
    description: >
      Advanced override for the mailbox's Drafts folder name. Empty (default)
      means the folder is auto-resolved by its standard name.
