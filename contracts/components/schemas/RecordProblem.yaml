title: RecordProblem
description: >
  One thing a record operation could not do, named rather than dropped
  (ADR-068 D13). This is the type the whole ADR exists to serve: the failure
  mode being corrected is SILENCE — a query that quietly omits the records it
  could not understand and returns a confident total over what is left.

  A problem names the records affected, the reason, and where possible the
  expected shape and the remedy. The community's accepted debugging advice for
  the incumbent tools today is "keep testing until something is returned";
  that is what a system with no error channel forces on people.

  A RecordProblem is NOT an HTTP error. Bounded, refused and partially
  evaluated answers all arrive as a normal response carrying `complete: false`
  and one or more of these (D15.1b).
type: object
additionalProperties: false
required:
  - code
  - reason
  - records
properties:
  code:
    type: string
    enum:
      - missing_schema_version
      - duplicate_type_declaration
      - unknown_property
      - unknown_enum_value
      - missing_required
      - arity_violation
      - enum_violation
      - type_mismatch
      - dangling_relation
      - relation_type_mismatch
      - cardinality_violation
      - duplicate_id
      - integer_not_whole
      - integer_out_of_range
      - candidate_cap_exceeded
      - hop_limit_exceeded
      - hop_traversal_bound_exceeded
      - page_size_clamped
      - scope_truncated
      - text_search_truncated
      - aggregate_refused
      - index_unavailable
      - evaluation_bound_exceeded
      - unsupported_operator
      - unsupported_parameter
      - empty_like_pattern
      - empty_in_list
      - literal_type_mismatch
      - ordering_on_many_property
      - comparison_undefined
      - date_format_ambiguous
      - decimal_scale_exceeded
      - stale_record
      - orphan_row
      - stale_cursor
      - unknown_view
      - unknown_record_type
      - view_part_ineligible
    description: >
      Machine-readable cause, so a caller can branch without parsing prose.
      "missing_schema_version" — a schema file lacking schema_version; no
      records of that type are validated against it (FR-002).
      "duplicate_type_declaration" — two schema files declare the same record
      type; both paths are named in `paths` (FR-003).
      "unknown_property" / "unknown_enum_value" — a query named something the
      schema does not declare. The query is REJECTED with the valid names
      listed; it never returns an empty result set (FR-024).
      "missing_required" — a required property is absent from a record.
      "arity_violation" — a list where a scalar was declared, or the reverse
      (FR-006).
      "enum_violation" — a value outside the declared, closed set (FR-011).
      "type_mismatch" — the stored value cannot be read as its declared type.
      "dangling_relation" — the relation target does not exist (FR-033).
      "relation_type_mismatch" — the target exists but is not of the declared
      target type (FR-034).
      "cardinality_violation" — more values than the declared cardinality
      permits (FR-035).
      "duplicate_id" — two records share an identifier; both paths are named
      (FR-039).
      "integer_not_whole" — a fractional value in an "integer" property. It is
      a DIFFERENT cause from "type_mismatch" because the value parses perfectly
      well as a number: the fault is the declared type, and the remedy is to
      declare the property "decimal", not to fix the digits (FR-013).
      "integer_out_of_range" — a whole number outside signed 64-bit range in an
      "integer" property. REFUSED naming the bound, never saturated to the
      maximum and never widened to a binary float (FR-013).
      "candidate_cap_exceeded" — the candidate set exceeded the 10,000-record
      materialisation bound; the query is refused with a narrowing instruction
      and NO partial answer is returned (FR-064).
      "hop_limit_exceeded" — more than two relation hops were requested
      (FR-065).
      "hop_traversal_bound_exceeded" — building the relation graph `near`/`hops`
      walks (undirected, every resolved edge in workspace scope, because a path
      between two record types crosses the query's own `type`/`kind` narrowing
      by definition) visited more than 50,000 relation-edge rows before the scan
      that assembles it finished. A DIFFERENT cause from "evaluation_bound_exceeded"
      and "candidate_cap_exceeded", which both count RECORDS; this counts EDGES,
      and the store exposes no pre-scan count over them (ruling R-A keeps every
      aggregate off the SQL path), so it is a streaming abort in FR-064's B2
      pattern that borrows FR-065a's B1-sized ceiling of 50,000 — "the same
      ceiling ... so there is one number to reason about". No partial
      neighbourhood is ever returned; the remedy narrows `near` or drops a hop
      level, never "add a filter", which does not shrink the graph scan at all
      (FR-076).
      "page_size_clamped" — the requested page size exceeded the cap and was
      reduced; the clamp is REPORTED, never silent (FR-063).
      "scope_truncated" — workspace scope resolution was itself incomplete
      (ADR-067 Scope.Truncated), so a whole mounted folder may be missing. The
      answer MUST NOT claim success (FR-062a).
      "text_search_truncated" — code review A, F6. `words` is answered by the
      text index FIRST and intersected with the typed filter SECOND (the typed
      half cannot run until it knows which paths the text half kept), so the
      text index is asked for more candidates than the page size — a fanout —
      to leave room for the typed filter to narrow afterward. When the corpus
      holds more matching documents than the fanout, the text half is cut off
      before the typed filter ever sees the rest, and a record that would have
      matched everything, ranked outside the fanout, is silently absent —
      indistinguishable from "nothing in the vault matches". Reported, with
      Complete: false, whenever the fanout was exhausted; the zero-hit path
      (NearestTerms, "did you mean") is refused to a truncated query for the
      same reason — it would suggest vocabulary as though the search had
      actually seen the whole corpus. The remedy is real: a typed `filter`
      (unlike `words`) is evaluated by the properties index over the FULL
      narrowed candidate population (bounded by candidate_cap_exceeded /
      evaluation_bound_exceeded, not by this fanout), so replacing or
      narrowing `words` with an equivalent typed condition on a declared
      property is not answered by this same bound.
      "aggregate_refused" — no aggregate is returned over a refused candidate
      set; it is never partial (FR-066).
      "index_unavailable" — the index predates record support and cannot hold
      the properties queried. A silent no-op returning complete:true over zero
      properties is impossible (FR-020a).
      "evaluation_bound_exceeded" — FR-064's B1. The narrowed CANDIDATE
      population exceeded 50,000 before anything was retrieved. It is a
      DIFFERENT cause from "candidate_cap_exceeded", which is B2 and counts
      SURVIVORS during evaluation, and the two must stay distinct because they
      name different remedies: B1 is reduced by narrowing the scope or the
      kind, and NOT by adding a filter, which does not change the number that
      fired. B1's count is exact and is quoted; B2's is not, because the count
      aborts at the cap and never reaches a true total — quoting one would
      state a number nobody computed.
      "unsupported_operator" — a SQL construct the filter does not implement
      (JOIN, BETWEEN, COALESCE, CASE, a subquery, a function call). REFUSED
      naming the ten supported operators and the parameter that does the job
      instead (FR-022c) — never parsed, never silently dropped.
      "unsupported_parameter" — an argument name the request does not declare,
      refused with the accepted names listed rather than ignored (FR-022c).
      "empty_like_pattern" — a LIKE pattern of '' or '%', which matches every
      record; refused naming IS NOT NULL as the operator that means it
      (FR-022a).
      "empty_in_list" — IN was given an empty list, which can match nothing
      (FR-022d).
      "literal_type_mismatch" — a literal that cannot be read in the property's
      declared type (FR-022e). Never coerced.
      "ordering_on_many_property" — an ordering comparison against a list-
      valued property, which section 8 R-13 leaves undefined; refused naming
      =, IN and LIKE as the operators that are defined there.
      "comparison_undefined" — the comparison oracle could not decide this
      pair: a non-conforming value (R-4), an unresolved relation (R-8), or an
      operator no rule defines for the declared type. The record is EXCLUDED
      and NAMED, and it is not re-admitted by negation — counting a corrupt
      value as "not done" by double negation would be a silent wrong answer.
      "date_format_ambiguous" — a date whose format cannot be read without
      guessing, or whose month or day is not zero-padded (FR-021d). It is
      never guessed.
      "decimal_scale_exceeded" — more decimal places than a decimal property
      carries. The value is NOT rounded to fit (FR-013).
      "stale_record" — this row's source_hash and the text index's disagree, or
      one side holds none (FR-020c). Reported as a DISAGREEMENT, never as "the
      properties index is stale": the comparison establishes that the two
      differ, not which is behind.
      "orphan_row" — the properties index holds a row for a path where no
      indexed note exists (D16.5).
      "stale_cursor" — the cursor was issued against a different index epoch.
      An ERROR, never a silent restart from page one.
      "unknown_view" — a saved view name the vault does not define, refused
      with the views in scope listed.
      "unknown_record_type" — a record type the schema set does not declare,
      refused with the declared types listed (FR-024).
      "view_part_ineligible" — a saved view declares a part whose BINDINGS do
      not satisfy what that part requires: a `figures` or `chart` part with no
      number, a `chart` whose `date` names something the record type does not
      declare as a date, a `tiles` part bound to a property that is not
      image-capable, a `columns` part bound to something that is not a small
      enum. The part draws NOTHING, and this is the renderer saying so
      (view-kinds-design-2026-09-03 D6). The composer (op=create_view) refuses
      to write such a part; this code exists because a parts-bearing file can
      reach the renderer by other routes — a hand-edited file, an import, or a
      binary written before D6 closed op=write_view — and a part that computes
      nothing because its bindings are absent must never be served as an empty
      but clean rendering.
    example: "type_mismatch"
  reason:
    type: string
    minLength: 1
    description: >
      Human-readable statement of what went wrong, ready to render. Never
      empty — a problem with no reason is indistinguishable from silence,
      which is the failure this type exists to end.
    example: "company is text, not a relation — cannot be resolved"
  records:
    type: array
    description: >
      Record identifiers this problem applies to. Always present — an empty
      array, never null — so a caller may render it without a nil check. Empty
      when the problem is a property of the QUERY rather than of particular
      records (a clamp, a refusal, a truncated scope).
    items:
      type: string
      minLength: 1
    example: ["CO-0052"]
  property:
    type: string
    minLength: 1
    description: >
      The property at fault, when the problem is attributable to one.
    example: "company"
  expected:
    type: string
    description: >
      The shape that WAS expected, stated plainly. A rejection that does not
      say what correct looks like leaves the caller guessing (FR-042).
    example: "expected a link to a company record"
  fix:
    type: string
    description: >
      The remedy. For a refusal this is the narrowing instruction naming the
      filter that would help (FR-064) — a bound is never reported without one.
    example: "add a status filter, or narrow the date range"
  permitted:
    type: array
    description: >
      The permitted values or valid names, listed so the caller can correct
      itself. Populated for unknown_property, unknown_enum_value and
      enum_violation (FR-011, FR-024). Scope is resolved BEFORE this list is
      built, so it can never reveal schemas outside the caller's workspace
      (FR-024, FR-062).
    items:
      type: string
    example: ["prospect", "active", "dormant", "churned"]
  paths:
    type: array
    description: >
      Vault-relative paths implicated. Carries BOTH paths for a duplicate type
      declaration (FR-003) or a duplicate identifier (FR-039), where naming
      only one leaves the conflict unfixable.
    items:
      type: string
      minLength: 1
    example:
      - ".omnipus-vault/records/company.yaml"
      - ".omnipus-vault/records/companies.yaml"
