title: AgentOwnershipUpdateRequest
description: >
  Request body for PATCH /api/v1/agents/{id}/ownership. Updates the
  owner_username field on a custom agent. Admin-only. System and core agents
  cannot have an owner assigned. Clearing the owner (empty string) requires
  the X-Confirm-Demote: 1 header.
type: object
additionalProperties: false
properties:
  owner_username:
    type: string
    description: >
      Username of the new owner. Empty string clears ownership (requires
      X-Confirm-Demote: 1 header to prevent accidents).
    example: "alice"
