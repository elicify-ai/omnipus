title: ScheduleUpdate
description: >
  Request body to update a schedule (#264). All fields optional; only provided
  fields are changed. Changing owner_agent_id is re-authorized.
type: object
additionalProperties: false
properties:
  name:
    type: string
    minLength: 1
  owner_agent_id:
    type: string
    minLength: 1
  trigger:
    $ref: ./ScheduleTrigger.yaml
  message:
    type: string
    minLength: 1
  run_isolated:
    type: boolean
    default: false
    description: >
      Optional. True forces every run of this work into a fresh independent
      chat, for either role (session-core FR-017). Default false: a task whose
      assignee owns an eligible main runs as a fresh child of that main; a
      worker runs isolated once or continues its own chat when recurring. There
      is no other session-mode choice.
    example: false
  session_mode:
    type: string
    enum:
      - isolated
      - continue
      - main
  timeout_seconds:
    type: integer
    minimum: 0
  enabled:
    type: boolean