title: ProviderStatusFrame
description: >
  Server → client (issues #1478 and #1280). The state of the model-provider
  call a running turn is waiting on, so the chat can tell a slow answer from a
  stalled one and say when an automatic retry worked. `waiting`: nothing has
  arrived from the provider since silent_since (the call is still open; the
  silence limit ends it at stall_at when known; Stop stays available).
  `responding`: data arrives again, or the call returned, after a `waiting`
  notice — the client clears the notice. `recovered`: the call succeeded after
  `retries` automatic retries (the "reconnected" note). Built from named fields
  only, never provider text. The SPA keys one per-turn item on turn_id; each
  newer frame for the turn replaces the previous one and the turn-end frame
  clears it. A main-chat copy is cleared by the helper's `ended` or
  `responding` frame, never by the main chat's own turn end.

  Issue #1537: a helper's status is published twice — once to the helper's
  own chat (no child fields) and once to the top chat with `child_session_id`
  and `agent_id` set; the copies are equal except `session_id`,
  `child_session_id`, `agent_id` and `seq`. When a helper's model answers
  after an announced retry without a `recovered` note, only the top chat
  receives a `responding` copy. `ended`: sent only on a top-chat copy when
  that helper turn has ended (finished, failed or stopped); the main chat
  removes that helper's named row. Both identity fields are present or both
  absent, and `ended` never appears without them (the anyOf below).
type: object
required:
  - type
  - session_id
  - turn_id
  - state
  - sent_at
additionalProperties: false
anyOf:
  - required:
      - child_session_id
      - agent_id
  - properties:
      child_session_id: false
      agent_id: false
      state:
        enum:
          - waiting
          - responding
          - recovered
properties:
  type:
    type: string
    const: provider_status
  session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: Session whose turn is waiting on the provider.
  child_session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: >-
      Issue #1537. Set only on the top chat's copy of a helper's notice: the
      helper's own chat (the session whose model call this is). Sent together
      with agent_id. Absent on a frame about the chat's own turn and on the
      copy sent to the helper's own chat.
  agent_id:
    type: string
    minLength: 1
    maxLength: 255
    description: >-
      Issue #1537. Set only on the top chat's copy of a helper's notice: the
      helper's agent. Sent together with child_session_id. An id, never shown;
      the browser looks the display name up in its own agent list.
  turn_id:
    type: string
    minLength: 1
    maxLength: 128
    description: Turn the status belongs to; keys the per-turn projection item.
  state:
    type: string
    enum:
      - waiting
      - responding
      - recovered
      - ended
    description: The provider-call state (see the frame description). `ended` only with child_session_id and agent_id.
  sent_at:
    type: string
    format: date-time
    description: RFC 3339 server wall clock at frame publication; the client measures elapsed silence against it, skew-immune like provider_retry.
  silent_since:
    type: string
    format: date-time
    description: State `waiting` only — RFC 3339 server time of the last data from the provider (or the start of the call when nothing arrived yet).
  stall_at:
    type: string
    format: date-time
    description: >-
      State `waiting` only, when known — RFC 3339 server time at which this
      attempt ends. Before the first response byte it is the attempt start plus
      the provider's request timeout (the configured request_timeout, default
      120 s; issue #1664); once the stream has started it is the last activity
      plus the stream's silence limit (issue #1478).
  attempt:
    type: integer
    minimum: 1
    description: >-
      State `waiting` only, when known — the 1-based number of the provider call
      this notice belongs to (issue #1664: "attempt N of max_attempts"). Absent
      when the call is not counted by the agent loop's timeout recovery.
  max_attempts:
    type: integer
    minimum: 1
    description: >-
      State `waiting` only, when known — how many calls the agent loop makes in
      total before the turn ends with an error (today 3; issue #1664). Sent
      together with attempt.
  retries:
    type: integer
    minimum: 1
    description: State `recovered` only — how many automatic retries the successful call needed.
  seq:
    type: integer
    format: int64
    minimum: 1
    description: >-
      Per-session sequence number of this frame (#823 catch-up redesign). Optional:
      absent on an unsequenced copy of this frame. This seq is dedup state, never
      itself the resume cursor.
