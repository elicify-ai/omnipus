title: RoomSnapshotFrame
description: >
  Server → client (spec omnipus-system-agent K45, K26, K27). The answer to
  attach_room: the room entries after the cursor in seq order (at most the
  newest 10,000; `has_older` is true when older entries after the cursor
  were left out), the members, mutes, member states, pause state,
  generation and allocated cost. THIS FILE EXISTS for the Constraint #8 5-step process and the
  pkg/gateway/inboundschemas/ sync — the GENERATING copy is the inline
  schema in contracts/asyncapi.yaml. Keep both copies in sync by hand.
  Landing 1, WU-15 produces it.
type: object
required:
  - type
  - room_id
  - seq
  - entries
  - members
  - muted
  - member_states
  - paused
  - generation
  - allocated_cost_micro_usd
  - allocated_cost_unpriced
  - complete
additionalProperties: false
properties:
  type:
    type: string
    const: room_snapshot
  room_id:
    type: string
    minLength: 1
    maxLength: 128
  seq:
    type: integer
    format: int64
    minimum: 0
    description: Room stream position this snapshot is current to.
  entries:
    type: array
    maxItems: 10000
    items:
      $ref: './RoomEntry.yaml'
    description: Entries after the cursor, in seq order. Never null.
  members:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 128
  muted:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 128
  member_states:
    type: array
    items:
      $ref: './RoomDeliveryState.yaml'
    description: >-
      Every outstanding (non-terminal) delivery state plus the latest terminal
      state of each member. Never null. Live states are never dropped (ruling
      Q2), so this array has no fixed upper bound.
  paused:
    type: boolean
  generation:
    type: integer
    format: int64
    minimum: 0
  read_only_reason:
    type: string
    minLength: 1
    maxLength: 200
  allocated_cost_micro_usd:
    type: integer
    format: int64
    minimum: 0
  allocated_cost_unpriced:
    type: boolean
  complete:
    type: boolean
    description: always true; reserved.
  has_older:
    type: boolean
    description: >
      True when entries after the cursor older than the ones served were
      left out (a snapshot carries at most the newest 10,000 entries).
