type: object
title: DelegateRespondResponse
description: >
  Response to `delegate` `action: respond` (ADR-053 §5.1): acknowledgement
  only. A native answer routes into the child's turn; an external-CLI answer
  reaches the same CLI conversation by interrupt and resume, or is refused.
  No corrective session is created, so `corrective_session` is never set.
required:
  - acknowledged
additionalProperties: false
properties:
  acknowledged:
    type: boolean
    description: True when the response was accepted and routed by `correlation_id`.
    example: true
  corrective_session:
    $ref: './DelegateSessionResponse.yaml'
