title: RecordValue
description: >
  ONE value of one property, tagged with the property type that governs it
  (ADR-068 D3). Exactly one of the eight value fields is populated, and which
  one is named by `type`.

  THE COUNT IS EIGHT, AND IT MATCHES PropertyDef. `checkbox` (FR-004c,
  ADR-068 D24.5) joined the property types in spec Draft 11; this schema was
  left at seven, so `PropertyDef.type` accepted a type that had no wire
  representation at all — a property an operator could declare and the wire
  could never carry one value of. Do not "correct" the count back to seven.

  NUMBERS ARE CARRIED AS DECIMAL STRINGS, never as JSON numbers — both
  `integer` and `decimal`. A JSON `type: number` in this contract generates a
  Go float32 (float64 only with `format: double`) and a JavaScript number;
  binary floating point cannot represent 0.1 exactly, and it cannot represent
  2^53+1 at all, so a value would drift on a round trip nobody performed
  deliberately. FR-020b forbids a binary float anywhere in the storage or
  retrieval path, and the wire is part of that path.

  ABSENCE IS NOT A VALUE. A property with no value carries no RecordValue at
  all — its RecordPropertyValue.values array is empty (D3.2, FR-007). This
  matters: "days I did not meditate" must be answerable, and it is not
  answerable in a model where absent and false are the same state.
type: object
additionalProperties: false
required:
  - type
properties:
  type:
    type: string
    enum:
      - text
      - enum
      - relation
      - date
      - integer
      - decimal
      - person
      - checkbox
    # x-enum-varnames PINS these constant names. oapi-codegen derives an enum
    # constant's Go name from a GLOBAL collision scan across every enum in the
    # spec, so adding a value to an UNRELATED enum silently renames these —
    # observed: growing RecordAggregate.op to fifteen (FR-150) flipped this
    # enum from bare `Date`/`Text`/… to `RecordValueTypeDate`/… and flipped
    # RunnerTestResponseReason the other way, breaking pkg/gateway/rest.go on
    # a change that touched neither. The names below are what this enum has
    # always generated; pinning them makes that a decision rather than an
    # emergent property of what else happens to be in the file.
    x-enum-varnames:
      - Text
      - Enum
      - Relation
      - Date
      - Integer
      - Decimal
      - Person
      - Checkbox
    description: >
      Which of the eight property types governs this value, and therefore
      which field below is populated.
    example: "decimal"
  text:
    type: string
    description: Populated when type is "text". Prose; never compared for equality (D3).
    example: "Introduced by a mutual contact at a conference."
  enum:
    type: string
    minLength: 1
    description: >
      Populated when type is "enum". The declared token, which MUST appear in
      the property's declared value set; anything else is rejected with the
      permitted values named (FR-011).
    example: "active"
  relation:
    $ref: "./RecordRef.yaml"
    x-go-type: RecordRef
  date:
    type: string
    minLength: 8
    maxLength: 40
    description: >
      Populated when type is "date". Either a calendar day as YYYY-MM-DD or an
      instant as RFC 3339. Comparable in both forms — the failure this closes
      is a date stored as free text, which sorts and filters as nothing.
    example: "2026-08-25"
  integer:
    type: string
    minLength: 1
    maxLength: 20
    pattern: '^-?(0|[1-9][0-9]*)$'
    description: >
      Populated when type is "integer". A signed 64-bit whole number, carried
      as a decimal STRING: a JSON number becomes a binary float in both
      generated languages, and a float64 cannot represent 2^53+1 — precisely
      the large-identifier case this type exists to keep exact (FR-013). A
      value outside int64 is REFUSED, never saturated and never widened. The
      unit, if any, is declared once on the PropertyDef and is never glued into
      the value.
    example: "60"
  decimal:
    type: string
    minLength: 1
    maxLength: 128
    pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]{1,100})?$'
    description: >
      Populated when type is "decimal". An exact, arbitrary-precision number
      carried as a decimal STRING, for the same reason as `integer`: a quantity
      that cannot survive a round trip unchanged is not a quantity a caller can
      reconcile. At most 100 decimal places (FR-013) — deliberately generous;
      a value past the bound is refused naming it, never rounded, because
      rounding to satisfy a bound is a silent change to a number.

      THE 100-PLACE BOUND IS IN THE PATTERN, not only in `maxLength`, so the
      wire refuses exactly what the parser refuses. A `maxLength` alone cannot
      express it — the integer part has no fixed width, so any single length
      cap either admits a 110-place value with a short integer part or rejects
      a 2-place value with a long one. A boundary that accepts what the engine
      rejects is a value a caller can PUT and never read back. `maxLength` admits a 100-place
      value with a sign, a leading digit and the point. The unit, if any, is
      declared once on the PropertyDef and is never glued into the value.
    example: "349.98"
  person:
    $ref: "./RecordRef.yaml"
    x-go-type: RecordRef
  checkbox:
    type: boolean
    description: >
      Populated when type is "checkbox" (FR-004c, ADR-068 D24.5). A real JSON
      boolean, and that is deliberate rather than inconsistent with `integer`
      and `decimal` above: those are strings because a JSON number becomes a
      binary float and loses exactness, and a boolean has no such hazard —
      `true` round-trips as `true` in both generated languages.

      ABSENT IS THE THIRD STATE and it is NOT `false`. A property with no value
      carries no RecordValue at all (D3.2, FR-007), so a `checkbox: false` on
      the wire means the note WROTE `false`, never that it said nothing. "Days
      I did not meditate" is the days with no value; "days I recorded not
      meditating" is this field set to false. They are different questions and
      this schema keeps them different.
    example: true