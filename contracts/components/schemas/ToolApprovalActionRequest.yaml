title: ToolApprovalActionRequest
description: >
  Request body for POST /api/v1/tool-approvals/{approval_id}.
  Resolves a pending tool call approval by approving, denying, cancelling, or
  approving-and-remembering ("always") it.
type: object
additionalProperties: false
required:
  - action
properties:
  action:
    type: string
    description: >
      Action to take on this approval.
      approve — allow this single invocation.
      deny    — reject this single invocation.
      cancel  — cancel this invocation (e.g. modal dismissed / turn aborted).
      always  — allow this invocation AND record a session-scoped
      "Always Allow" grant for (session, agent, tool) so future matching
      calls in the same session auto-approve without re-prompting.
    enum:
      - approve
      - deny
      - cancel
      - always
    example: approve
