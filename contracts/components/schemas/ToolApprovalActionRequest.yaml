title: ToolApprovalActionRequest
description: >
  Request body for POST /api/v1/tool-approvals/{approval_id}.
  Resolves a pending tool call approval (ADR-092 D4). Renamed from the
  4-value approve|deny|cancel|always set: "approve" -> "allow_once",
  "always" -> "allow" (greenfield, no upgrade path). `deny` and `cancel`
  remain distinct non-approval resolution actions.
type: object
additionalProperties: false
required:
  - action
properties:
  action:
    type: string
    description: >
      Action to take on this approval.
      deny       — reject this single invocation.
      allow_once — allow this single invocation only, no grant recorded.
      allow      — allow this invocation AND record a session-scoped grant
      per `scope` below so future matching calls in the same session
      auto-approve without re-prompting. Refused with 400 for an
      always-ask tool (today exactly set_channel_outbound): its approvals
      are never remembered, so only allow_once, deny and cancel apply
      (channels spec FR-038).
      cancel    — dismiss this approval without approving the invocation.
      It remains a distinct wire value from deny.
    enum:
      - deny
      - allow_once
      - allow
      - cancel
    example: allow_once
  scope:
    type: string
    enum:
      - exact
      - prefix
    description: >
      Grant scope (ADR-092 D4/FR-024). Present only when action is "allow";
      ignored otherwise. "exact" (default when omitted) — command text +
      cwd, unchanged from the pre-ADR-092 "always" grant. "prefix" — a
      new {binary, arg_prefix} grant, ignores cwd, token-boundary matched
      (e.g. "npm run test" does not match "npm run testfoo").
      run_in_background is a separate match dimension for both scopes and
      is not carried here — it is read from the pending approval's own
      recorded tool-call args.

      Not meaningful for a D7 (filesystem) or D8 (network) pre-flight
      escalation shown via the same dialog — approving one of those records
      the path-widening or network-widening grant the frame described, not
      an exact/prefix command grant; `scope` is ignored for those approvals.

      When the pending approval covers a chained command (more than one
      entry in ToolApprovalRequiredFrame.segments), "prefix" is not
      available: the server records an exact grant for the whole chain
      and reports scope "exact" in ToolApprovalResponse. The server never
      records a prefix grant it did not offer (see
      CommandSegmentInfo.prefix_available).
    example: exact
