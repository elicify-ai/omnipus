title: ProgramCredentialRequest
description: >
  Save a program token (PUT /programs/{id}/credential, spec FR-003, FR-043).
  The value is 8 to 16,384 bytes after trimming surrounding whitespace; inner
  line breaks and NUL are refused. A stale `expected_generation` answers 409.
type: object
required:
  - value
additionalProperties: false
properties:
  value:
    type: string
  expected_generation:
    type: integer
    format: int64
    minimum: 0
