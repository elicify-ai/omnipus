title: SkillInstallRequest
description: >
  Request body for POST /api/v1/skills/install. Installs a skill from the
  ClawHub registry by its slug (the identifier returned in a SkillSearchResult).
  Replacing an installed skill requires its revision; an omitted revision requires
  target absence under the authoritative installation lock.
type: object
additionalProperties: false
required:
  - slug
properties:
  revision:
    $ref: './ConfigurationRevision.yaml'
  slug:
    type: string
    minLength: 1
    maxLength: 128
    pattern: '^[a-z0-9][a-z0-9._-]*$'
    description: Slug of the skill to install from the ClawHub registry.
    example: "web-search"
  version:
    type: string
    maxLength: 64
    description: >
      Optional version to pin. When omitted the latest published version is
      installed.
    example: "1.4.0"
