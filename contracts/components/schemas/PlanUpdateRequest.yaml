title: PlanUpdateRequest
description: >
  Request body for PUT /plans/{id} (ADR-049 D1). All fields are optional;
  only provided fields are updated. `state` drives the canonical 5-value
  plan state machine (draft/approved/running/done/failed) — illegal
  transitions are rejected 400 (`ErrIllegalPlanTransition`); approving with
  no `dod` and no member-task criteria is rejected per the tiered DoD rule
  (ADR D5, Round-1 Grill Reconciliation R1).
type: object
minProperties: 1
additionalProperties: false
properties:
  title:
    type: string
    minLength: 1
    maxLength: 200
    description: New plan title.
    example: "v1.0 Launch (delayed)"
  goal:
    type: string
    maxLength: 2000
    description: New plain-prose objective.
    example: "Ship the v1.0 release with all P0 issues closed and CI green."
  description:
    type: string
    maxLength: 2000
    description: New free-form description.
    example: "Coordinates the v1.0 release train across backend and SPA."
  state:
    type: string
    enum:
      - draft
      - approved
      - running
      - done
      - failed
    description: >
      Requested state transition. Validated against the canonical plan
      state machine (Plan.yaml `state` description); illegal transitions
      are rejected 400.
    example: "approved"
  owner_agent_id:
    type: string
    minLength: 1
    description: Reassign plan ownership to this agent.
    example: "jim"
  dod:
    type: array
    items:
      $ref: ./AcceptanceCriterion.yaml
    description: >
      Replacement Definition of Done set (replaces the current `dod`
      atomically).
  bounds:
    type: object
    additionalProperties: false
    description: Replacement per-plan bounds overrides.
    properties:
      plan_judge_max_rounds:
        type: integer
        minimum: 1
        example: 20
      idle_expiry_days:
        type: integer
        minimum: 1
        example: 7
