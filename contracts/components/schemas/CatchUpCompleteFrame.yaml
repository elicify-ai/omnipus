title: CatchUpCompleteFrame
description: >
  Server → client. #823 catch-up redesign. Terminal frame of an attach_session response,
  sent exactly once, after every frame the catch-up needed to send (the incremental
  journal tail, selected snapshot-page replay plus projection, or live-only controls)
  has already been enqueued to
  this connection. Frames published live while the attach was in progress are held (never
  dropped) and are flushed to the connection only after this frame, so they always arrive
  strictly after catch-up in seq order. The client uses this frame to: set its cursor for
  the session to seq; stop treating incoming frames as catch-up; and, when mode is
  snapshot, resolve whether the interrupted answer (if any) should show "couldn't be
  finished · Generate again" (see mode).
type: object
required:
  - type
  - session_id
  - seq
  - mode
additionalProperties: false
properties:
  type:
    type: string
    const: catch_up_complete
  session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: Session this catch-up response was for.
  seq:
    type: integer
    format: int64
    minimum: 1
    description: >
      The session's high-water sequence number at the moment this attach was answered
      (the same value as the preceding session_snapshot frame's seq on the snapshot path,
      or the hub's head at bind time on the incremental path). The client's cursor for
      this session becomes exactly this value.
  boot_id:
    type: string
    description: >
      The gateway process that answered this attach — same role as
      SessionStateFrame.boot_id / AttachSessionFrame.boot_id, stored alongside the seeded
      seq cursor above.
  mode:
    type: string
    enum:
      - incremental
      - snapshot
      - live_only
    description: >
      incremental delivers the complete servable journal tail, unaffected by history
      page limits. snapshot completes the selected bounded history page plus current
      projection, not lifetime history. live_only completes only authorized current
      controls/projection and the live cursor after an explicit history-only failure:
      keep cached history out-of-date, never wipe or claim history reconstruction,
      replayCompletedForSession, history-loaded/restart/unanswered sweep, successful
      first-send proof or attention seen acknowledgement. A later incremental catch-up
      while history_state remains unavailable still is not history-loaded proof.
      No mode completes if state/projection/socket delivery failed. Held live seq>W
      follows this frame in order. Replay done is not attach completion.
