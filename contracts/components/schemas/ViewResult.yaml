title: ViewResult
description: >
  The evaluated answer of one saved view — everything the SPA needs to draw
  it (view-kinds-design-2026-09-03 §7). The server evaluates the view's
  filter, grouping and aggregation through the SAME engine knowledge_find
  uses (there is exactly one query engine) and precomputes every aggregate
  under the gate rules, so the SPA only draws:

  G2 — a number with a companion unit totals once per unit value, never
  across units. Every total anywhere in this object is a LIST of per-unit
  entries (ViewUnitTotal); no field can hold a combined figure.

  G3 — a row whose unit is missing or unconfirmed is in `rows` (shown),
  excluded from every total, and counted in the owning part's
  excluded_count.

  A view that cannot be answered arrives as a 200 with `refusal` set and
  empty parts/rows — the SPA shows WHY, exactly as knowledge_describe's own
  "NOT SERVABLE" line would state it — never as a transport error and never
  as a silent empty table.
type: object
additionalProperties: false
required:
  - view
  - label
  - parts
  - rows
  - complete
  - problems
properties:
  view:
    type: string
    minLength: 1
    description: The view's name, exactly as addressed.
    example: unpaid--by-client
  label:
    type: string
    description: >
      The display label — the view's own `label` when declared, else the
      name, resolved server-side so no two renderers invent different
      fallbacks.
    example: "Unpaid, by client"
  kind:
    type: string
    description: >
      The view kind that authored this view (ViewDef.kind), echoed verbatim
      when declared. Provenance — the renderer walks `parts`, never this.
    example: summary
  type:
    type: string
    description: The record type the view queries. Absent for an untyped view.
    example: invoice
  refusal:
    description: >
      Present exactly when the view could not be answered; `parts` and `rows`
      are then empty and `complete` is false.
    allOf:
      - $ref: "./ViewResultRefusal.yaml"
        x-go-type: ViewResultRefusal
  parts:
    type: array
    description: >
      The resolved part stack in render order — the view's own `parts`, or
      the single part a legacy `layout`-only view maps to (a no-parts view
      still serves as one table part). Always present — an empty array,
      never null; empty exactly when `refusal` is set.
    items:
      $ref: "./ViewResultPart.yaml"
      x-go-type: ViewResultPart
  rows:
    type: array
    description: >
      Every evaluated row, in the view's own order, shared by all parts —
      one view answers one question about one row set (ViewDef.parts:
      `filter` is shared and never per-part). Groups and crosstabs reference
      these by path. Always present — an empty array, never null.
    items:
      $ref: "./VaultFindRow.yaml"
      x-go-type: VaultFindRow
  rows_truncated:
    type: boolean
    description: >
      True when the row set exceeded the server's render bound and `rows`
      holds only the first page of it. Totals and subtotals are then NOT
      computed (`complete` is false and complete_reason says why) — a total
      over a truncated set would be a wrong number that looks right, which is
      the one output this surface exists to make impossible.
  complete:
    type: boolean
    description: >
      True only when the evaluation covered everything the view asked to
      cover — the same verdict, with the same workspace-scope exception, as
      VaultFindResponse.complete, from which it is carried.
  complete_reason:
    type: string
    description: Why the verdict is what it is. Empty when `complete` is true.
  aggregates:
    type: array
    description: >
      The view's own `aggregates:` results — the LEGACY, pre-part-stack
      summary key, which 69 saved views still use — carried through from the
      engine with the scope clause it computed them with (FR-125).


      They are SEPARATE from a part's `totals`, and the shapes differ because
      the guarantees differ. A part total is a ViewUnitTotal: reduced once per
      unit value, never across units (G2), because this endpoint does that
      reduction itself. These come from the engine's `aggregate`, which is
      unit-blind — so an entry over a number with a DECLARED companion unit is
      NOT surfaced here at all; it is refused, and the refusal is in
      `problems`. Only summaries that cannot cross a unit (count, empty,
      filled, unique) and numbers no record type pairs with a unit appear.


      Absent when the view declares no `aggregates`.
    items:
      $ref: "./VaultFindTotal.yaml"
      x-go-type: VaultFindTotal
  problems:
    type: array
    description: >
      Everything the evaluation could not include, and why — carried through
      from the engine unchanged. Always present — an empty array, never null.
    items:
      $ref: "./RecordProblem.yaml"
      x-go-type: RecordProblem
