type: object
description: >
  Returned on successful login or onboarding/complete. Contains the bearer
  token to use in subsequent Authorization headers and the username.
required:
  - token
  - username
additionalProperties: false
properties:
  token:
    $ref: './BearerToken.yaml'
  username:
    type: string
    description: The authenticated user's login name.
    example: "admin"
  warning:
    type: string
    description: >
      Non-fatal advisory message. Present on onboarding/complete when
      the credential store is locked and the API key was stored in plaintext.
    example: "API key stored in plaintext — set OMNIPUS_MASTER_KEY for encrypted storage"
