type: object
description: >
  Per-agent token usage summary for a given time period.
  Aggregated from SessionMeta.Stats across all session files.
  subagent_3p (external CLI workers) are excluded — they run on a separate
  engine and their tokens are not tracked.
required:
  - agents
  - period_start
  - period_end
properties:
  agents:
    type: array
    items:
      $ref: './AgentTokenEntry.yaml'
  period_start:
    type: string
    format: date-time
    description: Start of the aggregation period (inclusive), UTC.
    example: "2026-06-01T00:00:00Z"
  period_end:
    type: string
    format: date-time
    description: End of the aggregation period (exclusive), UTC.
    example: "2026-07-01T00:00:00Z"
  tokens_cache_read:
    type: integer
    minimum: 0
    description: Grand total cache-read tokens across all agents in the period.
    example: 8000
  tokens_cache_write:
    type: integer
    minimum: 0
    description: Grand total cache-write tokens across all agents in the period.
    example: 1200
  by_model:
    type: object
    description: >
      Cross-agent per-model breakdown for the period. Keys are model name strings.
      Absent when no model data is available.
    additionalProperties:
      $ref: './ModelTokens.yaml'
  by_provider:
    type: object
    description: >
      Per-provider token breakdown for the period. Same cell shape as by_model.
      Keys are catalog provider ids. Absent when no provider data is available.
    additionalProperties:
      $ref: './ModelTokens.yaml'
  unpriced_tokens:
    type: integer
    minimum: 0
    description: >
      Sum of unpriced token portions in the period. Counts only the unpriced
      portion of each call, not the whole call. A period with no priced cost and
      unpriced_tokens greater than zero is unpriced, not free.
    example: 0
  subscription_tokens:
    type: integer
    minimum: 0
    description: >
      Sum of tokens from ChatGPT sign-in calls in the period. Those tokens
      recorded no dollars and are excluded from any priced cost.
    example: 0
  partial:
    type: boolean
    description: >
      True when one or more session stores failed to load during aggregation, so
      the totals may under-count. Clients should surface a "some sessions could not
      be read" indicator rather than presenting the number as authoritative. Absent
      (or false) when every store loaded cleanly.
    example: false
  partial_error_count:
    type: integer
    minimum: 0
    description: Number of session-store load errors encountered (present only when partial is true).
    example: 0
