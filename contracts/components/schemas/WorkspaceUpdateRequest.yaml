type: object
description: >
  Request body for PUT /workspaces/{id}. Uses merge (partial-update) semantics —
  only fields present in the request body are updated; absent fields are unchanged.
required:
  - revision
properties:
  revision:
    $ref: './ConfigurationRevision.yaml'
  delegation:
    type: array
    description: Explicit replacement of the candidate graph. Omission preserves valid existing edges and applies the existing new-member seed rule; [] clears all edges.
    items:
      $ref: './WorkspaceDelegationEdge.yaml'
  name:
    type: string
    minLength: 1
    maxLength: 200
  description:
    type: string
    maxLength: 2000
  status:
    type: string
    enum: [active, archived]
    description: Archive or restore a workspace.
  pinned:
    type: boolean
  pin_order:
    type: integer
  core_team:
    type: array
    items:
      type: string
  member_configs:
    type: object
    additionalProperties:
      $ref: ./WorkspaceMemberConfig.yaml
    description: >
      Per-member (agentId → config) settings. Merge semantics: when present,
      replaces the config for each listed agent and garbage-collects entries
      for agents no longer on the core team. main_session_id is server-owned
      and read-only: a value sent here is ignored, and the server always
      reprojects its own computed main session id. There is no client-supplied
      session address of any kind.
additionalProperties: false
minProperties: 2
