type: object
additionalProperties: false
description: >
  Response body for POST /workspaces/{id}/mounts. Fields mirror
  WorkspaceMount.yaml verbatim (duplicated rather than composed via allOf —
  matches the ADR-034 precedent of keeping operation-facing schemas flat, one
  file per schema) plus an operator-facing `warning` string.

  FR-7.4/FR-7.6: a target that is broad but not refused (the operator's own
  home directory, the filesystem root, or a location that CONTAINS
  $OMNIPUS_HOME) still succeeds (201) but MUST warn — the warning has to
  cross the wire so the operator who made the call actually sees it, not just
  a server log. `warning` is absent (never an empty string) when the target
  warranted none.
required:
  - name
  - host_path
  - status
properties:
  name:
    type: string
    minLength: 1
    description: The mount's name, as created (see WorkspaceMountCreateRequest.name).
    example: "client-repo"
  host_path:
    type: string
    minLength: 1
    description: The realpath-resolved host path this mount grants write access to (FR-5.3).
    example: "/Users/operator/code/client-repo"
  status:
    type: string
    enum: [ok, broken]
    description: >
      Server-computed liveness of the mount target at creation time (FR-8.2).
      Always "ok" immediately after a successful create — included for shape
      symmetry with WorkspaceMount.yaml.
    example: "ok"
  warning:
    type: string
    minLength: 1
    description: >
      Present only when the resolved target is broad but not refused (FR-7.4/
      FR-7.6) — e.g. the operator's home directory, the filesystem root, or a
      folder that CONTAINS $OMNIPUS_HOME. Names exactly what the grant covers.
      Absent (not an empty string) when the target warranted no warning.
    example: >-
      mounting "/Users/operator" contains this Omnipus installation's own
      data directory (/Users/operator/.omnipus) — the installation's own
      secrets remain protected independently of this mount, but every OTHER
      file under /Users/operator becomes writable by any agent on this
      workspace
  skills_count:
    type: integer
    minimum: 1
    description: >
      ADR-072 D1.2/FR-074/FR-074a: how many project skills this mount's
      recognised skills directory contributes, as counted by
      pkg/skills/mount_threshold.go's EvaluateMountSkillsDisclosure at
      mount-creation time. Present only when the mount carries a recognised
      skills directory with at least one skill — absent (not zero) when the
      mount has none, mirroring `warning`'s own absent-not-empty convention.
    example: 3
  skills_grants_message:
    type: string
    minLength: 1
    description: >
      FR-074a: states, every time skills_count is present — even a
      single-digit count — that this mount's skills directory grants agents
      new, auto-loadable instructions in this workspace, not merely files
      sitting in the repository. Independent of skills_threshold_warning:
      set whenever skills_count is present, regardless of whether the
      threshold was exceeded. Absent exactly when skills_count is absent.
    example: >-
      This mount's skills directory grants 3 skills to every agent working
      in this workspace as auto-loadable agent instructions — not just files
      sitting in the repository. Any agent acting here may call and run
      them, with no separate grant needed.
  skills_threshold_warning:
    type: string
    minLength: 1
    description: >
      FR-074: present only when skills_count exceeds the mount-add-time
      threshold (pkg/skills/mount_threshold.go's
      DefaultMountSkillsWarnThreshold, spec default 500) — states the count
      and its per-turn consequence. The mount is still created either way
      (FR-075): this is information, never a refusal. Absent when the
      threshold was not exceeded, including whenever skills_count itself is
      absent.
    example: >-
      This mount would contribute 5000 skills — well beyond a plausible
      hand-authored collection (threshold: 500). Every one of them will
      appear in the skills menu on every turn in this workspace. The mount
      is being created anyway; you may want to confirm this isn't a
      vendored or generated tree before relying on it.
