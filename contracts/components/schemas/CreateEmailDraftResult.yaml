title: CreateEmailDraftResult
description: >
  Result of the create_email_draft agent tool (spec §2.4 — the tool returns
  exactly this shape). Crosses the gateway→SPA boundary: the chat tool-result
  renderer consumes the generated type (round-2 MIN-013). Property names are
  exactly as the tool emits them.
type: object
additionalProperties: false
required:
  - created
  - message_id
  - uid
  - uidvalidity
  - chat_link
  - chat_link_reason
properties:
  created:
    type: boolean
    description: Whether the draft was APPENDed (MC-11 asserts created=true).
    example: true
  message_id:
    type: string
    description: >
      The draft's Message-ID, generated by the tool itself
      (<random-128-bit@domain-of-the-mailbox's-From-address>, fallback
      omnipus.invalid) and kept through panel edits and the final send
      (round-1 MIN-004).
    example: "<9f3c...@example.com>"
  uid:
    type: integer
    description: IMAP UID of the APPENDed draft in the Drafts folder.
    example: 124
  uidvalidity:
    type: integer
    description: UIDVALIDITY of the Drafts folder.
    example: 456
  chat_link:
    type: string
    nullable: true
    description: >
      Absolute http(s) chat link built from gateway.public_url exactly like
      serve_web derives its origin — http allowed (round-1 MAJ-013;
      pkg/tools/web_serve.go precedent). Null when no origin is derivable
      (unset public_url, wildcard bind) — the tool still succeeds and
      chat_link_reason carries the stated reason.
    example: "http://localhost:5000/#/workspaces/ws_my_workspace/mail?mailbox=mia&folder=drafts&message=mid%3A%3C9f3c...%40example.com%3E"
  chat_link_reason:
    type: string
    nullable: true
    description: The stated reason when chat_link is null; null otherwise.
