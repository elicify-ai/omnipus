title: ViewUnitTotal
description: >
  One computed reduction over one number property, FOR ONE UNIT VALUE
  (view-kinds-design-2026-09-03 §3 G2).

  A number carrying a companion unit (PropertyDef.unit_property) totals ONCE
  PER UNIT VALUE and NEVER across units, so a view result carries a LIST of
  these — one entry per distinct unit value — and no field anywhere in the
  result can hold a combined figure. That is the load-bearing decision of this
  type: a sum across currencies is a wrong number that looks right, and the
  shape makes it inexpressible rather than merely discouraged.

  A number with NO companion unit produces exactly one entry with `unit`
  absent. The two cases are distinguished by the FIELD'S PRESENCE, never by a
  sentinel value, because an empty string is a legitimate enum value (R-3).
type: object
additionalProperties: false
required:
  - property
  - op
  - value
  - count
properties:
  property:
    type: string
    minLength: 1
    description: The number property this total reduces.
    example: amount
  op:
    description: The reduction applied.
    allOf:
      - $ref: "./ViewPartAggregate.yaml"
        x-go-type: ViewPartAggregate
  unit:
    type: string
    description: >
      The unit value this total covers (e.g. "SGD"). ABSENT when the number
      declares no companion unit property — then the single entry covers every
      included value. Present exactly when the total is unit-scoped.
    example: SGD
  value:
    type: string
    description: >
      The exact result as TEXT, never a JSON number: a decimal total that
      round-tripped through a binary float would state digits nobody computed
      — the same rule VaultFindTotal.value carries, for the same reason.
    example: "12480.00"
  count:
    type: integer
    description: >
      How many values were included in this total. Rows excluded under G3
      (missing/unconfirmed unit) are NOT in this count — they are in the
      enclosing scope's excluded_count.
    example: 7
