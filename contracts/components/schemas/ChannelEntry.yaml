title: ChannelEntry
description: >
  A communication channel entry returned by GET /api/v1/channels.
type: object
required:
  - id
  - name
  - transport
  - enabled
  - description
additionalProperties: false
properties:
  id:
    $ref: './ChannelId.yaml'
    description: Canonical channel identifier.
    example: telegram
  instance_id:
    type: string
    description: >
      The map key under which this instance is stored in config.json
      (currently equals the channel type in v0.1 cap-1). Included in responses
      so the SPA can address per-instance configure/enable/routing endpoints
      without hardcoding the key.
    example: telegram
  name:
    type: string
    description: Human-readable channel name.
    example: Telegram
  transport:
    type: string
    description: Transport mechanism used by this channel.
    enum:
      - websocket
      - webhook
      - bridge
      - native
      - tcp
      - http
      - serial
      - email
    example: webhook
  enabled:
    type: boolean
    description: Whether this channel is currently enabled.
    example: false
  description:
    type: string
    description: Short description of the channel.
    example: Telegram Bot API
  identity:
    $ref: './ChannelIdentity.yaml'
    description: >
      Optional routing identity override for this channel instance. When set,
      messages from this channel are routed as the specified agent or as the
      default user, overriding the normal per-sender routing rules.
  native_available:
    type: boolean
    description: >
      WhatsApp only: whether the native (whatsmeow) transport is compiled into
      this binary. False on a lite build or an architecture where it is excluded.
      Omitted for channels to which it does not apply. When false, clients MUST
      NOT offer native mode (the QR pairing flow cannot work).
    example: true
  degraded:
    type: boolean
    description: >
      True when the channel is enabled in config but failed to construct at
      runtime (e.g. native WhatsApp requested on a build without it, or an
      invalid credential) — the channel is NOT serving despite enabled=true —
      or when it dropped an inbound message it could not route
      (omnipus-system-agent FR-121, K15: unbound instance, missing or
      ineligible bound agent). A routing degradation is cleared when a valid
      binding is saved (FR-129).
    example: false
  degraded_reason:
    type: string
    description: >
      Human-readable reason the channel is degraded. Present only when degraded
      is true. For a routing drop it is the drop reason, e.g. "bind this
      channel to an agent in a workspace".
    example: "whatsapp native is not compiled into this build"
  last_dropped_at:
    type: string
    format: date-time
    description: >
      When this channel last dropped an inbound message it could not route
      (K15). Present only while the routing degradation is active.
    example: "2026-10-14T09:30:00Z"
  outbound_policy:
    type: string
    description: >
      The connection's outbound setting, for the row's summary text (channels
      spec "Contract Changes"). reply_only = "Only answer"; agent_may_start =
      "Answer and also start messages".
    enum:
      - reply_only
      - agent_may_start
    example: reply_only
  rejected_senders:
    $ref: './ChannelRejectedSenders.yaml'
    description: >
      Senders the running connection ignored because they are not on its
      allowed list. Present only when at least one message was ignored
      (FR-061).
