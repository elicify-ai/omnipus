type: object
description: >
  Per-agent tool configuration governing which builtin tools are accessible
  and which MCP servers are bound (config.AgentToolsCfg on the Go side,
  AgentToolsCfg interface in src/lib/api.ts).
properties:
  builtin:
    type: object
    description: Controls builtin tool visibility for this agent.
    required:
      - policies
    properties:
      policies:
        type: object
        description: >
          Complete per-tool policy map. Every static builtin tool name MUST be
          present as an explicit, literal key (e.g. "bash", "remember") with an
          "allow"/"ask"/"deny" value — this is not a sparse override set with a
          fallback default, and wildcard keys are not valid for the static
          builtin catalog. There is no default_policy field; every new custom
          agent is seeded fully deny-by-default (every static tool explicitly
          "deny"), with only a narrow, deliberately conservative allow-list for
          its actual needs.
        additionalProperties:
          type: string
          enum:
            - allow
            - ask
            - deny
        example:
          "bash": "deny"
          "remember": "allow"
  mcp:
    type: object
    description: MCP server bindings for this agent.
    properties:
      servers:
        type: array
        description: List of MCP server bindings.
        items:
          type: object
          required:
            - id
          properties:
            id:
              type: string
              description: MCP server identifier as registered in config.json.
              example: "my-mcp-server"
            tools:
              type: array
              items:
                type: string
              description: >
                Specific tool names to expose from this server. When absent,
                all tools from the server are available.
              example:
                - "search"
                - "fetch"
