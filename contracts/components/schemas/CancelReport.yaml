type: object
title: CancelReport
description: >
  Result of a cancel cascade operation (Stop request). Reports which sessions
  were reached by the stop, which were unreachable, and what was skipped
  (ADR-091 I-6). Partial walks are reported, never silent.
additionalProperties: false
required:
  - reached
  - partial
properties:
  reached:
    type: array
    items:
      type: string
    description: >
      Session ids that received the Stop marker and were reachable by the
      cascade walk. Includes the root session and all reachable descendants
      at the time of the walk.
    example:
      - "session-1"
      - "session-2"
  unreachable:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Session id that could not be reached.
          example: "session-3"
        reason:
          type: string
          description: Why this session was unreachable (e.g., store error).
          example: "session store read failed: permission denied"
    description: >
      Sessions that were enumerated but could not be reached — a partial
      walk failure. Each entry names the session and the reason it was
      unreachable. Non-empty when the walk hit an error mid-cascade
      (ADR-091 I-6, R01).
  skipped_newer_generation:
    type: integer
    minimum: 0
    description: >
      Count of live turns that were skipped because their registered
      generation was newer than the Stop marker's generation (a revival
      landed in between). These turns were NOT cancelled (ADR-091 I-6).
    example: 0
  skipped_terminal:
    type: integer
    minimum: 0
    description: >
      Count of terminal sessions that were skipped — a Stop over a
      terminal descendant writes nothing (terminal records are immutable).
      These sessions were already complete (ADR-091 I-6).
    example: 0
  partial:
    type: boolean
    description: >
      True when the cascade was incomplete — one or more descendants hit
      an error and are unreachable (check `unreachable` for details).
      False when the entire reachable tree was stamped. A partial stop
      is reported to the originating channel; partial walks are never
      silent (ADR-091 I-6, Q21).
    example: false
