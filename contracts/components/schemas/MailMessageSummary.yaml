title: MailMessageSummary
description: >
  Envelope row for one mail message as shown in a Mail panel list result
  (GET /workspaces/{id}/mail/{agentId}/folders/{folder}/messages). All fields
  are always serialized; nullable fields are the ones the mail server itself
  may leave unset (round-1 MIN-003 — types and nullability explicit). Fetches
  behind this row never change flags (BODY.PEEK / EXAMINE — round-2 MAJ-003).
type: object
additionalProperties: false
required:
  - message_id
  - uid
  - uidvalidity
  - folder
  - subject
  - from
  - from_name
  - to
  - cc
  - date
  - seen
  - is_draft
  - is_omnipus_draft
  - read_by_agent
properties:
  message_id:
    type: string
    nullable: true
    description: >
      The Message-ID header value, or null when the inbound mail carries none
      (some mail does). Mid-style refs cannot address such a message.
    example: "<abc123@example.com>"
  uid:
    type: integer
    format: int64
    minimum: 0
    maximum: 4294967295
    description: IMAP UID of the message within its folder (valid under uidvalidity).
    example: 123
  uidvalidity:
    type: integer
    format: int64
    minimum: 0
    maximum: 4294967295
    description: >
      IMAP UIDVALIDITY of the folder — the epoch the uid is valid in. A
      changed uidvalidity renumbers uids; the mid: ref form survives that
      (round-1 MAJ-005, D21).
    example: 456
  folder:
    type: string
    enum:
      - inbox
      - sent
      - drafts
    description: The folder slug the message was listed from (MC-5).
    example: "inbox"
  subject:
    type: string
    description: Decoded subject (RFC 2047 decoded).
    example: "Quarterly report"
  from:
    type: string
    description: The From address (addr-spec).
    example: "dana@example.com"
  from_name:
    type: string
    nullable: true
    description: Display name of the sender when present, else null.
    example: "Dana Example"
  to:
    type: array
    description: To addresses.
    items:
      type: string
  cc:
    type: array
    description: Cc addresses (D26 — recipient lists on every mail surface).
    items:
      type: string
  date:
    type: string
    format: date-time
    description: >
      Message date (RFC 3339). Deferred nullability (register row 8;
      acceptance recorded in mail-live-access-landing-order §8,
      2026-10-02): this schema cannot yet express the founder's #1175
      "No date" state — date is required and non-nullable here — and the
      W0 amendment that makes it nullable executes atomically with the
      Wave C/D consumer PRs. From that amendment on, the value may be
      absent on responses until the w4/w3 feature waves supply it; a
      consumer must treat an absent date as unknown (no date) and never
      as false or a zero/epoch value.
    example: "2026-09-26T10:30:00Z"
  seen:
    type: boolean
    description: Whether the message carries the \Seen flag.
  is_draft:
    type: boolean
    description: Whether the message carries the \Draft flag (MC-14).
  is_omnipus_draft:
    type: boolean
    description: >
      Whether the X-Omnipus-Draft header is present (FR-029) — an
      agent-created draft the approval panel can edit losslessly.
  read_by_agent:
    type: boolean
    description: >
      Whether the message's flag list carries the $OmnipusAgentRead keyword
      (D38, FR-039). Derived from the fetched flag list on every fetch —
      never stored by Omnipus (D6). When the mail server rejects custom
      keywords the value is false and nothing errors (MC-36).
  message_ref:
    type: string
    minLength: 5
    description: >
      Gateway-issued opaque message reference for this message
      (mail-live-access-landing-order register row 8; ADR correction I-03)
      — bound to the authorized pair, folder and configuration generation,
      carrying its folder epoch. Issued with the result that names the
      message and consumed unchanged by every follow-up operation
      (attachment preview, save, reply context, seen) — never a
      model-synthesized identity, never dependent on the optional
      Message-ID, and validated against the live folder epoch on the same
      lease that serves the follow-up. A mismatched epoch, pair or
      generation is the typed 409 stale-reference refusal, before any
      fetch or mutation. Optional on the wire until the issuing gateway
      work lands (the is_knowledge_base precedent); producers emit it
      always once landed.
    example: "uid:456:123"
  has_attachments:
    type: boolean
    description: >
      Paperclip indicator (F7, #1174 display half; register row 8) —
      producers serialize it always once the MIME classifier lands; absent
      on results predating it means not-yet-computed, and false (once
      present) is confirmed absence, never an omitted or uncomputed value.
      Derived from MIME structure/part headers in the bounded list fetch —
      never by downloading message or attachment bodies. Actual
      named/attachment parts count; inline CID resources alone and the
      dedicated Omnipus draft-body marker do not, but a genuine user
      message.md does. If metadata cannot be classified the read fails
      visibly rather than fabricating false. The indicator is inside the
      allowed header-cache field set; attachment bytes and lists are not.
    example: true
