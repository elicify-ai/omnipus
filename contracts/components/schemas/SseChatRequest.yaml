title: SseChatRequest
description: >
  Request body for POST /api/v1/chat (SSE streaming endpoint). Sends a
  user message to the agent and streams the response via Server-Sent Events.
type: object
additionalProperties: false
required:
  - message
properties:
  message:
    type: string
    description: >
      The user message to send to the agent. Must not be empty.
    example: "Hello, what can you help me with today?"
