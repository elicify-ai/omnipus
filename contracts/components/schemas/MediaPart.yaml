title: MediaPart
description: >
  One media attachment within a MediaFrame. Each part maps to a single file
  stored in the media registry and accessible via /api/v1/media/{ref}.
type: object
required:
  - type
  - url
  - filename
  - content_type
additionalProperties: false
properties:
  type:
    type: string
    enum:
      - image
      - audio
      - video
      - file
    description: Media category.
  url:
    type: string
    minLength: 1
    description: >
      Relative URL of the form /api/v1/media/{ref}. The SPA prefixes this with
      the gateway origin to construct the full URL for <img>, <video>, etc.
  filename:
    type: string
    minLength: 1
    description: Original filename as stored in the media registry.
  content_type:
    type: string
    minLength: 1
    description: MIME type of the file (e.g., "image/png").
  caption:
    type: string
    description: >
      Optional human-readable caption for display below the media. Display
      text only — clients never parse it (for page thumbnails it reads like
      "report.docx · page 3 of 12"; the page number travels in page_number).
  page_number:
    type: integer
    minimum: 1
    description: >
      1-based page number of the source document this part shows. Present on
      parts of a MediaFrame whose presentation is "page_thumbnails"; absent
      otherwise.
