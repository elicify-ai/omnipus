type: object
required:
  - name
properties:
  name:
    type: string
    minLength: 1
    maxLength: 200
    description: Milestone name. Required.
  description:
    type: string
    maxLength: 2000
    description: Optional free-text description.
  due_date:
    type: string
    nullable: true
    description: Optional due date (ISO 8601 date string or null).
