title: ToolRegistryEntry
description: >
  A single entry in the central tool registry snapshot returned by
  GET /api/v1/tools (FR-027).
type: object
required:
  - name
  - description
  - scope
  - category
  - source
properties:
  name:
    type: string
    description: Canonical tool name (e.g. "workspace_shell", "browser_navigate").
    example: workspace_shell
  description:
    type: string
    description: Human-readable description of what the tool does.
    example: Run a shell command in the agent workspace.
  scope:
    type: string
    description: Tool visibility scope.
    enum:
      - core
      - general
    example: general
  category:
    type: string
    description: >
      Tool domain category (e.g. "filesystem", "shell", "web", "browser",
      "communication", "delegation", "memory", "tasks", "skills",
      "tool_discovery", "agents", "workspaces", "channels", "providers",
      "platform", "mcp"). Legacy values "core" and "system" may appear
      for un-recategorized tools.
    example: filesystem
  source:
    type: string
    description: >
      Origin of the tool registration.
      "builtin" = compiled-in Go tool; "mcp" = MCP server tool.
    enum:
      - builtin
      - mcp
    example: builtin
  server_id:
    type: string
    description: >
      For MCP tools (source="mcp"), the originating MCP server id. Lets the SPA
      group MCP tools by server unambiguously instead of parsing the tool name
      (which is lossy when a server name contains underscores). Absent for
      builtin tools.
    example: github-mcp
  auto_approve:
    type: string
    description: >
      ADR-092 D9: this tool's verdict when Auto-approve is active and the
      tool's effective policy is "ask". "runs" = always runs with no prompt.
      "runs_if_args" = runs only when this call's arguments meet the tool's
      own condition (e.g. a file path resolves inside the workspace or a
      mount); otherwise it asks. "asks" = always asks under Auto, and is
      auto-denied in an unattended run. For source="builtin" this is read
      from the static classifier table (tools.AutoApproveClassOf); "bash" is
      excluded (its own per-command mechanism, D3/D7/D8) and never appears
      with this field set. For source="mcp" this reflects the server's tool
      annotations: "runs" when the server marks the tool read-only or
      explicitly not destructive, "asks" otherwise (including tools with no
      annotations at all).
    enum:
      - runs
      - runs_if_args
      - asks
    example: runs
