type: object
description: >
  Executor configuration for a sub-agent (READ model: returned by REST GET,
  the agent list, create and update echoes, and get_agent). Controls which
  runtime is used to execute the sub-agent's tasks. Write models are
  ExecutorConfigCreate (create) and ExecutorConfigUpdate (update). There is
  no per-agent program path: the program for each CLI is set by a person in
  Settings -> Third-party agents (effective_cli_path, effective_preset_args
  and program_warning report it here, read-only).

  "native" (default) runs the task inside the Omnipus agent loop — the existing
  behaviour, always available.

  "external-cli" drives an external CLI tool (claude-code, codex, or opencode)
  as a subprocess. There is no `--prompt` flag on any of the three supported
  CLIs: claude receives the soul+instructions prompt via stdin with NO
  positional prompt argument at all (a bare "-" is read by this CLI as a
  literal one-character prompt string, not a stdin sentinel, so none is
  appended — claude -p consumes all of stdin automatically when no
  positional prompt is given); codex also receives it via stdin, but signals
  that with a trailing "-" positional argument (a real stdin sentinel for
  this CLI); opencode receives it as a POSITIONAL argument after a literal
  "--" end-of-options separator (never via stdin). `--model <model>` IS
  passed as a real flag when a model
  is configured (opencode additionally requires it to be shaped like
  "provider/model" or it is omitted). See GET /api/v1/agents/executor-defaults
  for the full, byte-accurate per-CLI flag list. The CLI's auth, isolation,
  and retries are managed by the CLI itself (not Omnipus), so fields like
  shell_policy / tools_cfg / fallback_models / model_params
  / skills are hidden for subagent_3p agents and rejected
  400 on PUT if set.

  "cli" (required for subagent_3p agents when kind="external-cli") is locked
  after create — to switch CLIs, the user must create a new agent. Mutating
  attempts on PUT return 400 with "executor.cli is locked after create;
  create a new agent to switch CLIs."

  "remote-a2a" is RESERVED for future A2A protocol resolution. The schema
  accepts it for forward-compatibility, but dispatch rejects it in v0.1.0 with
  an error ("not available in v0.1.0").

  The "kind" field is derived server-side from the agent's type (Main -> native,
  Subagent -> native, subagent_3p -> external-cli). It is exposed in responses
  but is NOT a writable field on create/update — clients cannot choose kind
  directly. Server-side derive at the handler boundary per the agent-form spec.

  When the agent has no executor block, the default is "native".
additionalProperties: false
properties:
  kind:
    type: string
    enum:
      - native
      - external-cli
      - remote-a2a
    description: >
      Execution runtime selector. Derived from the agent's type: Main -> native,
      Subagent -> native, subagent_3p -> external-cli. Clients cannot set this
      directly on create/update; the server overrides any client-supplied value.
      "remote-a2a" is reserved for future A2A protocol resolution.
    example: "native"
  cli:
    $ref: './ExternalCli.yaml'
    x-go-type: ExternalCliTool
  effective_cli_path:
    type: string
    readOnly: true
    description: >
      Read-only. The program path saved in Settings -> Third-party agents for
      this agent's CLI, exactly as the person entered it. Absent when no path
      is saved for that CLI. A run uses only this Settings path (checked again
      at spawn, the resolved file is exec'd); there is no per-agent program
      path, no fallback to an old stored path and no $PATH lookup.
    example: "/opt/homebrew/bin/claude"
  effective_preset_args:
    type: string
    readOnly: true
    description: >
      Read-only. The standard parameters saved in Settings -> Third-party
      agents for this agent's CLI, exactly as typed. Absent when none are
      saved. Appended after this agent's cli_args at spawn, unfiltered.
    example: "--max-turns 40"
  program_warning:
    type: string
    readOnly: true
    description: >
      Read-only. The exact text a run of this agent would be refused with
      right now: "This agent cannot run: no program path is set for <Name>. A
      person can set it in Settings -> Third-party agents -> <Name>." or "This
      agent cannot run: the program set for <Name> in Settings -> Third-party
      agents does not pass its checks (<check> at <at>). A person can fix it
      there." Absent when a run would start.
  env_overrides:
    type: object
    additionalProperties:
      type: string
    description: >
      Environment variables merged into the spawned CLI process's environment
      alongside Omnipus's own (OMNIPUS_* names are reserved and refused). On
      every read (REST GET, list, create and update echoes, get_agent) each
      value is replaced by the fixed mask "••••••"; only the names are
      readable. Written through ExecutorConfigCreate (whole map) and
      ExecutorConfigUpdate (merge plus env_overrides_remove).
    example:
      ANTHROPIC_API_KEY: "••••••"
      DEBUG: "••••••"
  cli_args:
    type: string
    description: >
      Free-form additional CLI arguments as stored, appended to the spawn
      invocation after the driver's built-in flags. The spawn layer uses
      execve (no shell interpolation); flags the safety filter would drop are
      removed at run time.
    example: "--max-turns 5"
