title: ReplayMessageFrame
description: >
  Server → client. One replayed turn entry emitted during a session replay
  (attach_session). Each entry corresponds to a user, assistant, or system
  transcript entry. The SPA reconstructs the conversation from these frames.
type: object
required:
  - type
  - session_id
  - content
  - role
additionalProperties: false
properties:
  type:
    type: string
    const: replay_message
  session_id:
    type: string
    minLength: 1
    description: Session being replayed.
  content:
    type: string
    description: Message text.
  role:
    type: string
    enum:
      - user
      - assistant
      - system
      - turn_canceled
    description: >
      Turn role. The SPA renders bubbles for user/assistant/system and
      skips turn_canceled (metadata-only). Role is normalised to "assistant"
      if empty by the server before emitting. Single-l "turn_canceled"
      matches the Go EntryType value and the Message.type enum (canonical
      spelling across the wire).
  id:
    type: string
    description: >
      Server-assigned message ID for deduplication on WS reconnect. The SPA
      uses id-match dedup when present, falling back to content+role+timestamp
      tuple when absent.
  timestamp:
    type: string
    format: date-time
    description: ISO-8601 timestamp of the original message.
  agent_id:
    type: string
    description: Agent that produced this message (assistant messages only).
  model:
    type: string
    description: >
      Model identifier that produced this assistant message (Phase 1B, FR-013/FR-014).
      Populated from TranscriptEntry.Model by the server when the entry was written
      with a model field. Omitted for legacy entries written before per-turn model
      recording landed (the UI omits the model field entirely for those — no
      placeholder text, no "(model not recorded)" string).
    maxLength: 256
  turn_id:
    type: string
    description: >
      Turn-correlation identifier, populated from TranscriptEntry.TurnID. Stamped
      on assistant entries and turn-cancellation entries so the client can match a
      replayed turn_canceled entry to the specific preceding assistant message it
      cancels, without relying on unsafe positional/adjacency assumptions in the
      replay stream (async delegation can interleave other agents'/turns' frames
      in between). Omitted for legacy entries written before turn-id stamping
      landed.
  truncated:
    type: boolean
    description: >
      ADR-087 D2. Populated from TranscriptEntry.Truncated when replaying an
      incomplete assistant entry — see `truncation_reason` for why. Only
      present when true. Replay emits this even when `content` is empty
      (an entry with Truncated && Content == "" still passes through, so
      the SPA can render a suffix with no body).
    example: true
  truncation_reason:
    type: string
    enum:
      - cancelled
      - max_output_tokens
    description: >
      ADR-087 D2. Populated from TranscriptEntry.TruncationReason. Narrows
      why `truncated` is true: "cancelled" (the user canceled the turn
      mid-stream) or "max_output_tokens" (the provider's output-token limit
      cut the answer off before it finished). Absent on a `truncated: true`
      frame means "cancelled" — every entry written before this field
      existed predates it and was always a cancel.
    example: "max_output_tokens"
