title: PlantedCookieClearedError
description: >
  Typed body for a request whose Cookie header carried a duplicated reserved
  gateway cookie name (omnipus-session, csrf, __Host-csrf) — ADR-094 FR-015,
  the planted-cookie recovery. The gateway has already attached the clearing
  Set-Cookie lines and refused to trust any cookie value on the request.
  Status 403 on a state-changing request; status 401 on a read (GET/HEAD) to
  an authenticated or optional-auth API route (a top-level browser
  navigation to an optional-auth route is served anonymously instead). The
  client shows one Retry action that re-issues the same request once; the
  retry carries only the genuine cookie. Shares the error/code convention
  with ErrorResponse (a valid ErrorResponse), so routes that document
  ErrorResponse for 401/403 also carry this body.
type: object
required:
  - error
  - code
properties:
  error:
    type: string
    description: Human-readable message, safe to display (verbatim, FR-015 Q4).
    example: "Omnipus cleared cookies set by a preview — please retry"
  code:
    type: string
    enum:
      - planted_cookie_cleared
    description: Machine-readable discriminant the SPA transport matches on.
