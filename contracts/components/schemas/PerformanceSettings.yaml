title: PerformanceSettings
description: >
  Agent concurrency and fan-out settings returned by GET /api/v1/performance.
  Concurrency is bounded by LIVE available memory at the moment of admission,
  not by a number precomputed at startup.
type: object
additionalProperties: false
properties:
  max_parallel_agents:
    type: integer
    minimum: 1
    description: >
      Maximum number of tasks/subagents that may run concurrently on the
      dispatch path. There is no longer a computed default: 0 on disk means
      "not configured", and is surfaced here as the resolved effective value
      (see effective_max_parallel_agents and max_parallel_agents_configured)
      because 0 is an internal sentinel that is never a real concurrency
      value. When nothing is configured, concurrency is bounded by live
      available memory at the moment each agent turn is admitted, and the
      number reported here is a PHYSICAL OS-thread-safety backstop rather
      than an estimate of what this machine can run. There is NO policy
      ceiling: an explicitly configured value is always honored as given
      (never silently clamped — only a floor of 1 applies), including a value
      above the physical backstop, which is honored in full with a
      server-side warning logged rather than being lowered. Overridden by the
      OMNIPUS_MAX_PARALLEL_AGENTS env var.
    example: 4
  effective_max_parallel_agents:
    type: integer
    minimum: 1
    description: >
      The resolved value actually in use. When max_parallel_agents_configured
      is true this is the operator's own value (from config or the
      OMNIPUS_MAX_PARALLEL_AGENTS env var). When it is false, this is the
      physical OS-thread-safety backstop and NOT a capacity recommendation —
      a client must not present it as one; render the automatic,
      memory-bounded state instead. Always present in responses; absent in
      requests.
    example: 4
  max_parallel_agents_configured:
    type: boolean
    description: >
      Whether max_parallel_agents was actually set by an operator, in
      config.json or via the OMNIPUS_MAX_PARALLEL_AGENTS env var. false means
      nothing is configured and concurrency is bounded by live available
      memory; effective_max_parallel_agents then carries the physical
      backstop, which is not a number to show an operator as a
      recommendation. This field exists because the two cases are otherwise
      indistinguishable on the wire — max_parallel_agents substitutes the
      effective value whenever the configured value is below the schema
      floor, so an unconfigured host looks exactly like an explicitly
      configured one. Always present in responses; absent in requests.
    example: false
  tools_on_demand:
    type: boolean
    description: >
      Tool-loading mode. true (default) — agents load tools on demand to keep
      each message small (the compressed tool manifest); a load step is required
      before a non-core tool is callable. false — every allowed tool is sent on
      every message with no loading step (more tokens per message). Maps to
      tools.manifest.compressed. Always present in responses.
    example: true
  goal_max_rounds:
    type: integer
    minimum: 1
    description: >
      GOAL-FR-024/FR-045, MV-1, D-D/D-E (2026-09-11, operator-ratified) —
      the SINGLE, GLOBAL adjudication-round ceiling for EVERY goal, task
      and chat identically. Default 20. THERE IS NO PER-GOAL OVERRIDE
      anywhere in this delivery — GOAL-FR-046 ("a human-editable budget
      control for a goal's per-goal override") and GOAL-US-8 ("an operator
      can give a goal more room") are RETIRED in full. This is the ONE
      control: `Goal.max_rounds` on every goal record resolves from this
      value alone (`pkg/config/planning.go::EffectiveGoalMaxRounds`,
      unmodified signature — NQ-2). It bounds the tries a goal gets in chat
      and within one run of a task alike; it does NOT bound how many fresh
      runs a task gets (`Task.effective_max_attempts`, a separate limit —
      founder decision 2026-09-14, issue #710). A goal keeps the value in
      force when it started. Lives
      under Settings → Performance
      (`src/components/settings/PerformanceSection.tsx`, GOAL-FR-045) — no
      new settings tab. Always present in responses.
    example: 20
  max_tool_iterations:
    type: integer
    minimum: 1
    maximum: 1000
    description: >
      The global tool-iteration limit IN FORCE ("Max tool calls per turn",
      issue #904, tool-iteration-limit spec): the ceiling for every agent's
      turns. An agent's own value may only lower it. When the value saved in
      config.json is missing or out of range this is the value actually used,
      not the saved one (see max_tool_iterations_saved_state). Always present
      in responses.
    example: 200
  max_tool_iterations_saved_state:
    $ref: './MaxToolIterationsSavedState.yaml'
    x-go-type: MaxToolIterationsSavedState
  max_tool_iterations_saved_raw:
    type: integer
    description: >
      The global limit exactly as found in config.json. Present only when
      max_tool_iterations_saved_state is below_min or above_max (spec D13
      Settings warning); absent otherwise.
    example: 5000
  max_tool_iterations_lowered_agents:
    type: array
    items:
      $ref: './MaxToolIterationAgentChange.yaml'
      x-go-type: MaxToolIterationAgentChange
    description: >
      Agents whose own limit this request lowered to the new global (spec
      D11). Present only on a PUT response that lowered at least one agent;
      absent on GET and on every other PUT.
  pending_apply:
    $ref: './PerformancePendingApply.yaml'
    x-go-type: PerformancePendingApply
    description: >
      Present only while saved Performance settings are not in force yet
      (see PerformancePendingApply); absent when everything saved is applied.
      Returned on GET and on every successful PUT (a successful PUT clears
      it, so it is then absent).
