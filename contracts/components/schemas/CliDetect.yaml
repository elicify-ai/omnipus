title: CliDetect
type: object
description: >
  Host-side CLI detection result. Probes whether each external-CLI runner
  binary (claude-code/codex/opencode) is present for the gateway process —
  searching $PATH first, then a curated per-OS well-known-install-location
  list — and returns the resolved absolute path and how it was found. Used
  by the roster screen's "+ Add Subagent (External)" disclosure to grey-out
  CLIs the host cannot actually run, and by the create wizard / edit form to
  prefill the executor cli_path field. Read-only, unaudited — detection never
  spawns a subprocess.
required:
  - claude
  - codex
  - opencode
additionalProperties: false
properties:
  claude:
    $ref: './CliDetectEntry.yaml'
  codex:
    $ref: './CliDetectEntry.yaml'
  opencode:
    $ref: './CliDetectEntry.yaml'
