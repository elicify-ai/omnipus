type: object
description: Aggregated statistics for a session transcript.
required:
  - tokens_in
  - tokens_out
  - tokens_total
  - cost
  - tool_calls
  - message_count
properties:
  tokens_in:
    type: integer
    minimum: 0
    description: Total input tokens consumed across all messages in this session.
    example: 1200
  tokens_out:
    type: integer
    minimum: 0
    description: Total output tokens generated across all messages in this session.
    example: 450
  tokens_total:
    type: integer
    minimum: 0
    description: >
      Authoritative total tokens for this session, as reported by the
      provider. Once the provider's input/output split has been recorded
      (tokens_in and/or tokens_out non-zero from a split-aware entry),
      tokens_total = tokens_in + tokens_out + tokens_cache_read +
      tokens_cache_write — NOT just tokens_in + tokens_out, since cache
      tokens are an additional component, not folded into either. Legacy
      entries written before that split existed instead book their entire
      turn into tokens_out with tokens_in left at 0, so a session mixing
      legacy and split-aware entries can have tokens_in + tokens_out +
      cache fall short of (or, for a legacy entry whose cache was tracked
      separately, exceed) tokens_total for the legacy portion. Always read
      tokens_total directly rather than deriving it from the other fields.
    example: 1650
  cost:
    type: number
    format: double
    minimum: 0
    description: Total USD cost for this session (based on provider pricing).
    example: 0.0023
  tool_calls:
    type: integer
    minimum: 0
    description: Total number of tool calls made in this session.
    example: 3
  message_count:
    type: integer
    minimum: 0
    description: Number of transcript entries in this session.
    example: 8
  tokens_cache_read:
    type: integer
    minimum: 0
    description: >
      Total cache-read tokens across all assistant turns (tokens served from
      provider KV cache, not re-computed). 0 for sessions without caching or
      created before Wave 1 token tracking.
    example: 300
  tokens_cache_write:
    type: integer
    minimum: 0
    description: >
      Total cache-write tokens across all assistant turns (tokens written into
      a new cache entry, Anthropic only). 0 when the provider does not report them.
    example: 50
  by_model:
    type: object
    description: >
      Per-model token breakdown. Keys are model name strings (e.g.
      "claude-sonnet-4-6"). Absent for legacy sessions. subagent_3p turns
      are excluded (they run on a separate engine).
    additionalProperties:
      $ref: './ModelTokens.yaml'
