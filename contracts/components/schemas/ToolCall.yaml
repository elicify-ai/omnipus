type: object
description: >
  A single tool invocation recorded in a transcript entry.
  Maps to session.ToolCall on the Go side and ToolCall interface in src/lib/api.ts.
required:
  - id
  - tool
  - status
additionalProperties: false
properties:
  id:
    type: string
    description: Unique tool call identifier (ToolCallID type on the Go side).
    example: "tc_01HXYZ"
  tool:
    type: string
    description: Tool name as registered in the tool registry (e.g. "workspace.shell", "web_search").
    example: "workspace.shell"
  status:
    type: string
    enum:
      - success
      - error
      - pending
      - denied
      - running
      - cancelled
      - interrupted
      - parked
    description: >
      Outcome of the tool call. "interrupted" is written by spawnSubTurn
      (pkg/agent/subturn.go) onto a delegate/spawn tool call's own persisted
      record when the parent turn is canceled/aborted mid-flight while the
      sub-turn is still in progress (session.UnifiedStore.UpdateToolCallStatus).
      "parked" (ADR-057 UAT defect C2 fix) is written the same way when the
      child sub-turn instead stopped because a message_parent(kind="question",
      wait=true) call parked it awaiting the parent's answer.
      Mirrors SubagentEndFrame.yaml's status enum for the equivalent live-WS
      case. ToolCall carries no structured "reason" enum (that stays
      WS-frame-only, via SubTurnEndPayload), but it does carry a free-text
      "error" field describing why a failed call failed — see below.
    example: "success"
  duration_ms:
    type: integer
    format: int64
    minimum: 0
    description: Elapsed time in milliseconds. Absent when still running.
    example: 234
  error:
    type: string
    description: >
      Human-readable failure reason when status is "error". Mirrors the
      equivalent field on ToolCallResultFrame so a reloaded transcript carries
      the same explanation the live WS frame did.

      Previously this did not exist: the reason was computed in the agent loop
      and logged at ERROR level, but the persisted record kept only
      {tool, status, duration_ms, parameters} with a null result. Nothing —
      not the UI, not post-hoc analysis, and critically not the agent itself —
      could see WHY a call failed, so an orchestrating agent retried blindly
      against failures it had no way to understand.
    example: "file: a.svg already exists. Set overwrite=true to replace."
  parameters:
    type: object
    description: Input parameters passed to the tool.
    additionalProperties: true
    example:
      command: "ls -la"
  result:
    type: object
    description: Return value from the tool. Shape is tool-specific.
    additionalProperties: true
  parent_tool_call_id:
    type: string
    description: Parent tool call ID for nested subagent tool invocations.
    example: "tc_01HABC"
  content_state:
    type: string
    enum:
      - full
      - capped
      - emptied
    default: full
    description: >
      ADR-066 D4/D5 projection state of this call's result in the model's
      window, as persisted in window meta and returned on transcript read.
      "full" = the result entered unmodified; "capped" = it entered
      head-and-tail truncated with a mark (the archive line holds the full
      content); "emptied" = it was later emptied in place, leaving a recall
      mark. The transcript `result` is the PROJECTED content the model saw;
      the full content stays in the gateway tool_results/ store for Verbose
      chat. Absent = full.
    example: "full"
