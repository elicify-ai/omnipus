title: LLMError
description: Translated provider/LLM error safe for the live WebSocket boundary.
type: object
required:
  - code
  - message
  - retryable
additionalProperties: false
# ── Fault attribution vocabulary ─────────────────────────────────────────────
# Who owns the fault behind a code. The generators (scripts/gen-asyncapi-go and
# scripts/_gen-asyncapi-types.mjs) emit this as a closed Go/TS type and HARD-FAIL
# when an x-user-messages entry names an attribution that is not on this list —
# so a typo'd tag ("providr") breaks codegen instead of silently shipping.
#
#   model      — the model itself refused or mishandled the request.
#   provider   — the hosting provider (not the model) blocked or throttled us.
#   product    — WE built a bad request. Omnipus is at fault, not the user.
#   config     — an operator-fixable setting (credentials, workspace membership).
#   ambiguous  — could be either side; the copy must say where to look.
#   unknown    — genuinely unclassified.
#   user       — the user ended the turn themselves (Stop button, shutdown).
#                Rendered as a neutral notice, never an error toast (ADR-066 D7).
x-user-message-attributions:
  - model
  - provider
  - product
  - config
  - ambiguous
  - unknown
  - user
# ── User-facing copy catalogue (SINGLE SOURCE OF TRUTH) ──────────────────────
# Every enum value below MUST appear here exactly once, with a non-empty message
# and an attribution drawn from x-user-message-attributions. Both generators
# validate that bijection and abort on any gap, so "every code has a message and
# an attribution" is true by construction rather than by review.
#
# The Go catalogue (pkg/api/generated/llm_error_messages.gen.go, consumed by
# pkg/agent/translate_error.go) and the TS catalogue
# (src/lib/api/generated/llm-error-messages.ts, consumed by src/lib/llm-error.ts)
# are BOTH generated from this block. Do not hand-write either one.
#
# Copy rules enforced by test (pkg/agent/translate_error_test.go and
# src/lib/llm-error.test.ts):
#   - a `product` or `config` message never tells the user to switch models,
#     never asks them to rephrase their content, and — for `config` — never
#     tells them to retry (a credentials/membership fault will not self-heal).
#   - no message anywhere tells the user to contact support.
#
# There is deliberately NO blanket "From the model:" prefix: attribution is
# written into each sentence instead, so the copy stays readable and each
# message names the real owner of the fault.
#
# ── Templated provider variants (provider-messages spec §6, OBS-002) ──────────
# An entry MAY carry an optional sibling `provider_message` string: the
# templated sentence the agent assembles at the emit site when the failing
# attempt's facts (provider/model) are present (C-16); when facts are absent
# the plain `message` above is the fallback — never a blank. Slots come from
# the CLOSED vocabulary {provider} {model} {attempt} {max} {countdown}
# {answered_model} {unavailable_model}; both generators hard-fail on any other
# slot and on a template with unbalanced braces. The templates are emitted
# into BOTH catalogues (LLMErrorProviderMessages in Go, llmErrorProviderMessages
# in TS) — never hand-written in consumer code.
x-user-messages:
  media_unsupported:
    message: "This model can’t use that kind of attachment. Try a different file format, or switch to a model that supports it."
    attribution: model
  provider_rejected:
    message: "The model declined to respond to this request. Try rephrasing it, or switch models."
    attribution: model
  request_too_large:
    message: "We built a request that was too large for this model to accept. Try shortening your message, or switch to a model with a larger limit."
    attribution: product
  provider_auth_failed:
    message: "The model provider rejected our credentials. Check this provider’s API key in Settings."
    attribution: config
    # provider-messages spec §6: templated variant names the failing attempt's
    # provider (C-16); the plain message above is the facts-absent fallback.
    provider_message: "{provider} rejected the API key. Check the key in Settings → Providers."
  rate_limited:
    message: "The model provider is temporarily overloaded. Wait a moment, then retry."
    attribution: provider
    # provider-messages spec §6 (terminal row): the server-assembled line for the
    # facts-present turn-end display. The LIVE retry/countdown line is assembled
    # client-side from the provider_retry frame and is deliberately NOT a server
    # template (§6 mechanics, C-15).
    provider_message: "{provider} is busy right now. You can retry the turn."
  quota_billing:
    # provider-messages spec §7.1/D15: attribution config is FINAL (no placeholder).
    # Facts-absent sentence follows the house "The model provider…" pattern; the
    # templated variant substitutes the failing attempt's provider (C-16). Copy
    # carries no button, no link (D6).
    message: "The model provider says your account is out of credit."
    attribution: config
    provider_message: "{provider} says your account is out of credit."
  network:
    message: "We couldn’t reach the model provider. Check your internet connection and retry."
    attribution: ambiguous
  provider_stalled:
    # Founder decision 2026-09-14 (UAT E-15c): a streaming call that receives
    # no bytes of any kind for the silence limit (model_list[].stream_stall_timeout,
    # default 300 s) is ended as a provider stall. Retryable like `network`.
    message: "The model provider stopped responding: nothing arrived for 5 minutes (or the silence limit set for this provider), so the call was ended. Retry — if it keeps happening, open Verbose chat for details."
    attribution: provider
  content_policy:
    message: "The model provider blocked this request under its content policy. Try rephrasing to remove the flagged content."
    attribution: provider
  context_too_long:
    message: "This turn needed more context than the model can hold, even after trimming older turns automatically. Try a model with a larger context window, or shorten this message."
    attribution: product
  tool_args:
    message: "The model filled in a tool’s arguments incorrectly. Retry — Verbose chat shows which tool and what went wrong."
    attribution: model
  tool_call_truncated:
    message: "The model's tool call was cut off at its output limit before it finished. Ask for less in one step, or split the work."
    attribution: model
  schema:
    message: "We sent the model provider a request it couldn’t process — that’s a bug on our side, not yours. Retry the turn, or open Verbose chat for technical details."
    attribution: product
  agent_not_configured:
    message: "This agent isn’t on any workspace yet, so it has nowhere to work. Add it to a workspace team to get started."
    attribution: config
  workspace_unavailable:
    message: "This agent’s working folder could not be opened. Check that the disk has space and the folder is writable."
    attribution: config
  model_unavailable:
    message: "The model you picked isn’t available for this turn, so this reply used the previous model. Check the model in Settings."
    attribution: config
  model_retired:
    # provider-messages spec D9/D11: a provider retired or refused the configured
    # model DURING a real call (C-24 trigger). Never shares model_unavailable's
    # mid-session switch-failure meaning. attribution config (D15) — the
    # facts-absent sentence replaces {provider} with "its provider" (the exact
    # text §6 requires the catalogue to carry for facts-absent renders).
    message: "This model is no longer offered by its provider. Pick a new model in the agent's settings."
    attribution: config
    provider_message: "This model is no longer offered by {provider}. Pick a new model in the agent's settings."
  needs_provider:
    # ADR-068 FR-046 (2026-08-23 §8b, T068-32): the first real producer of
    # this code is a device-code provider (openai-chatgpt, xai) whose stored
    # sign-in could not be refreshed — copy and attribution are FR-046's,
    # not provider-specific, since the same closure and code serve every
    # device-code provider. attribution is deliberately `user` here (a
    # routine re-auth prompt, not an operator setup gap) — NOTE for whoever
    # wires an ADR-067 "no provider configured at all" pre-turn producer for
    # this same code later: that scenario reads as `config`, not `user`; the
    # two have not been reconciled and may need a distinct code instead of
    # sharing this one.
    message: "Your sign-in for this provider expired. Sign in again under Settings → Providers."
    attribution: user
  model_unassigned:
    message: "This agent has no model. Pick one in the agent's settings."
    attribution: config
  turn_canceled:
    message: "This turn was stopped before it finished."
    attribution: user
  turn_timed_out:
    message: "The model provider didn’t finish this turn in time, so it was stopped. Retry — if it keeps happening, open Verbose chat for details."
    attribution: provider
  delegated_task_limit:
    message: "A delegated task reached its configured limit before finishing. Open its task or session, then adjust the named limit if more work is needed."
    attribution: config
  context_unrecoverable:
    message: "We couldn’t fit this turn into the model’s context even after clearing older tool results — that’s a bug on our side, not yours. Start a new session, or open Verbose chat for technical details."
    attribution: product
  context_window_unknown:
    message: "This endpoint did not report a context length for this model. Set it under Settings → Models → Model overrides → Context length."
    attribution: config
  unknown:
    message: "This turn didn’t finish, and we can’t tell why. Retry — if it keeps happening, open Verbose chat for details, or try a different model."
    attribution: unknown
properties:
  code:
    type: string
    enum:
      - media_unsupported
      - provider_rejected
      - request_too_large
      - provider_auth_failed
      - rate_limited
      - quota_billing
      - network
      - provider_stalled
      - content_policy
      - context_too_long
      - tool_args
      - tool_call_truncated
      - schema
      - agent_not_configured
      - workspace_unavailable
      - model_unavailable
      - model_retired
      - needs_provider
      - model_unassigned
      - turn_canceled
      - turn_timed_out
      - delegated_task_limit
      - context_unrecoverable
      - context_window_unknown
      - unknown
  message:
    type: string
    minLength: 1
    maxLength: 4096
  retryable:
    type: boolean
  detail:
    type: string
    maxLength: 2048
    description: Live-only technical detail; never persisted or replayed.
  facts:
    type: object
    additionalProperties: false
    description: >-
      Structured facts about the FAILING attempt, assembled server-side
      (provider-messages spec §7.1 item 1). All fields optional — facts absent
      means the catalogue sentence renders. Deliberately closed to
      provider/model/request_id ONLY: no retry_after_seconds, no retry_at, no
      attempts, no max_attempts (OBS-103 — the SPA has no consumer for retry
      facts on the error frame; retry timing lives on the provider_retry frame,
      whose consumer is the indicator), no billing_url (D6), no error_id (no
      fetch path — §5/D1).
    properties:
      provider:
        type: string
        maxLength: 256
        description: Catalog display name of the provider of the FAILING attempt (C-16) — never unconditionally the primary.
      model:
        type: string
        maxLength: 256
        description: Model id of the failing attempt (C-16).
      request_id:
        type: string
        maxLength: 256
        description: >-
          Provider request id (x-request-id / request-id / x-amzn-requestid /
          cf-ray as labelled last resort, OBS-003). VERBOSE-RENDER-ONLY (C-20,
          PM-2): renders only under Verbose chat, never to a non-Verbose viewer.
  provider_message:
    type: boolean
    description: >-
      Server-authored subtype/trust flag (MAJ-104, C-14): when true, `message`
      carries the server-assembled provider-message sentence and the SPA renders
      it; when absent or false, the SPA keeps today's catalogue-copy rendering
      keyed on `code` (e.g. the own-limiter's internal rate_limited text — RG-2).
      Set at write time by the agent's assembly path; the replay shape carries
      the same flag so a reloaded session renders identically.
