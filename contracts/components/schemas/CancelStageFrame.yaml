title: CancelStageFrame
description: >
  Server → client (B3). Cancel progress notification sent by the gateway after
  the SPA sends a cancel frame. Three stages drive the progressive Stop-button
  label transition.
  NOTE: The field is "stage" (not "status") — see parallel gateway fix. The SPA
  validates stage values and drops frames with any value not in:
  {graceful, hard, detached}.
type: object
required:
  - type
  - session_id
  - stage
additionalProperties: false
properties:
  type:
    type: string
    const: cancel_stage
  session_id:
    type: string
    minLength: 1
    description: Session whose cancel state is being updated.
  stage:
    type: string
    enum:
      - graceful
      - hard
      - detached
    description: >
      graceful — cancel request acknowledged; agent is completing the current
                 tool call and will stop at the next safe checkpoint.
      hard     — graceful deadline expired; the agent turn is being force-killed.
      detached — the session has been detached from the running turn; the SPA
                 can now treat the session as idle.
      The SPA validates this field via isValidFrame() and drops frames with any
      other value (B3 fix for unknown-stage render crashes).
  reached:
    type: array
    items:
      type: string
    description: >
      ADR-091 I-6. Present on the `detached` stage of a Stop: every session the
      cascade stamped with a Stop marker (the stopped session and each reachable
      non-terminal descendant).
  unreachable:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - reason
      properties:
        id:
          type: string
          minLength: 1
        reason:
          type: string
    description: ADR-091 I-6. Descendants the cascade could not reach, with why.
  skipped_newer_generation:
    type: array
    items:
      type: string
    description: >
      ADR-091 I-6. Sessions whose live turn belonged to a newer generation than
      the one stamped (a revival landed first); their cancel was refused.
  skipped_terminal:
    type: array
    items:
      type: string
    description: ADR-091 I-6. Terminal descendants, left unwritten.
  partial:
    type: boolean
    description: >
      ADR-091 I-6. True when `unreachable` is non-empty — and ONLY then: the
      cascade could not reach part of the subtree, so this Stop must not be
      read as complete (WP-D FR-D-001).
      `skipped_newer_generation` deliberately does NOT set this flag. A session
      the cascade left alone because a revival had already carried it to a
      newer generation is a CORRECT outcome, not a failure (ADR-091 D8: "the
      later instruction wins, which is what the operator asked for"), and WP-D
      US-1/AS-9 specifies that case with no `partial` and no channel line.
      Read `skipped_newer_generation` itself to learn which sessions kept
      running — `partial: false` hides nothing.
