title: BrowserStatusFrame
description: >
  Server → client. Lifecycle / control status for the live browser connection.
  state=controlling means this viewer holds interactive control; released means
  control was dropped; error carries a human-readable message. See ADR-038.
type: object
required:
  - type
  - state
additionalProperties: false
properties:
  type:
    type: string
    const: browser_status
  state:
    type: string
    enum:
      - attached
      - idle
      - controlling
      - released
      - detached
      - error
  message:
    type: string
    maxLength: 512
  controller:
    type: string
    maxLength: 128
    description: >-
      The controlling user's display name/username, when state=controlling
      (the gateway sends the authenticated userID resolved for this
      connection, NOT an internal viewer/connection id). May be an empty
      string under token-based or dev-mode-bypass authentication, where no
      per-user identity is resolved — an empty controller does not mean
      nobody is in control.
  controlled_by_other:
    type: boolean
    description: >-
      Server-computed, per-connection: true when some OTHER connection on this
      same session currently holds interactive control (the server compares the
      session's controller viewerID against THIS connection's viewerID, so it is
      unambiguous even when `controller` display name is empty). The SPA uses
      this to keep every viewer of a shared session (docked panel + pop-out
      window) in agreement about who is driving — a viewer with
      controlled_by_other=true disables its Take-control affordance and shows
      "Someone else is driving" instead of offering control it cannot get.
      Absent/false means control is free or held by this very connection.
  session_id:
    type: string
