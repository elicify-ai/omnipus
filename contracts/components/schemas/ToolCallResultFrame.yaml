title: ToolCallResultFrame
description: >
  Server → client. Emitted at the end of a tool execution with the result and
  final status. The SPA updates the corresponding tool call badge from "running"
  to "success" or "error".
type: object
required:
  - type
  - session_id
  - tool
  - call_id
  - result
  - status
additionalProperties: false
properties:
  type:
    type: string
    const: tool_call_result
  session_id:
    type: string
    minLength: 1
    description: Session in which this tool call executed.
  tool:
    type: string
    minLength: 1
    maxLength: 128
    description: Name of the tool that was called.
  call_id:
    type: string
    minLength: 1
    description: Matches the call_id from the preceding tool_call_start frame.
  result:
    description: >
      The tool's return value. May be any non-sentinel JSON value (object, array,
      string, number, boolean, or null). null is the documented contract for
      error-status frames (status="error") — the SPA handles result as unknown
      and does not crash on null. When the result exceeded 1 MiB the value is a
      TruncatedResult sentinel. When marshaling the result failed the value is a
      MarshalErrorResult sentinel.


      anyOf, not oneOf: the bare `type: object` branch already matches any object,
      so a TruncatedResult/MarshalErrorResult-shaped value (itself an object)
      always matches BOTH that branch AND its own $ref — oneOf demands exactly
      one match and would make every sentinel-shaped result schema-invalid
      against this very union (pre-existing; not introduced by this change, see
      ADR-060 D6/§7 item 2 for the sibling fix on the AsyncAPI copy of this
      union). anyOf (at least one match) is correct here since this union
      catalogues possible shapes rather than asserting mutual exclusivity.
    anyOf:
      - type: object
      - type: array
        items: {}
      - type: string
      - type: number
      - type: boolean
      - nullable: true
        not:
          anyOf:
            - type: object
            - type: array
            - type: string
            - type: number
            - type: boolean
      - $ref: TruncatedResult.yaml
      - $ref: MarshalErrorResult.yaml
  status:
    type: string
    enum:
      - success
      - error
    description: Final execution status. Normalised from empty to "success" by the server.
  duration_ms:
    type: integer
    minimum: 0
    description: Tool execution wall-clock time in milliseconds.
  error:
    type: string
    description: Error message when status is "error".
  parent_call_id:
    type: string
    description: >
      For tool calls that fire inside a sub-turn: the spawn ToolCall.ID of the
      parent subagent. Empty string or absent for top-level tool calls.
  agent_id:
    type: string
    description: Agent that invoked this tool call.

  seq:
    type: integer
    format: int64
    minimum: 1
    description: >-
      Per-session sequence number of this frame (#823 catch-up redesign). Strictly
      increasing and gap-free within the session, assigned by the gateway's per-session
      hub as the single chokepoint through which every session-scoped frame is published.
      Optional: absent on an unsequenced copy of this frame (for example a broadcast
      delivered to a tab that is not bound to this session) — the client only advances its
      per-session cursor for frames that carry seq. The client stores the highest seq it
      has applied per session and sends it back as since_seq on attach_session; frames at
      or below that cursor are ignored, which makes re-delivery idempotent.
