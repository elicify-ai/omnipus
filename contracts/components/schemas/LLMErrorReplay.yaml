title: LLMErrorReplay
description: Replay-safe translated provider/LLM error with live-only detail omitted.
type: object
required:
  - code
  - message
  - retryable
additionalProperties: false
# ── Fault attribution vocabulary ─────────────────────────────────────────────
# Who owns the fault behind a code. The generators (scripts/gen-asyncapi-go and
# scripts/_gen-asyncapi-types.mjs) emit this as a closed Go/TS type and HARD-FAIL
# when an x-user-messages entry names an attribution that is not on this list —
# so a typo'd tag ("providr") breaks codegen instead of silently shipping.
#
#   model      — the model itself refused or mishandled the request.
#   provider   — the hosting provider (not the model) blocked or throttled us.
#   product    — WE built a bad request. Omnipus is at fault, not the user.
#   config     — an operator-fixable setting (credentials, workspace membership).
#   ambiguous  — could be either side; the copy must say where to look.
#   unknown    — genuinely unclassified.
#   user       — the user ended the turn themselves (Stop button, shutdown).
#                Rendered as a neutral notice, never an error toast (ADR-066 D7).
x-user-message-attributions:
  - model
  - provider
  - product
  - config
  - ambiguous
  - unknown
  - user
# ── User-facing copy catalogue (SINGLE SOURCE OF TRUTH) ──────────────────────
# Every enum value below MUST appear here exactly once, with a non-empty message
# and an attribution drawn from x-user-message-attributions. Both generators
# validate that bijection and abort on any gap, so "every code has a message and
# an attribution" is true by construction rather than by review.
#
# The Go catalogue (pkg/api/generated/llm_error_messages.gen.go, consumed by
# pkg/agent/translate_error.go) and the TS catalogue
# (src/lib/api/generated/llm-error-messages.ts, consumed by src/lib/llm-error.ts)
# are BOTH generated from this block. Do not hand-write either one.
#
# Copy rules enforced by test (pkg/agent/translate_error_test.go and
# src/lib/llm-error.test.ts):
#   - a `product` or `config` message never tells the user to switch models,
#     never asks them to rephrase their content, and — for `config` — never
#     tells them to retry (a credentials/membership fault will not self-heal).
#   - no message anywhere tells the user to contact support.
#
# There is deliberately NO blanket "From the model:" prefix: attribution is
# written into each sentence instead, so the copy stays readable and each
# message names the real owner of the fault.
#
# ── Templated provider variants (provider-messages spec §6, OBS-002) ──────────
# Kept in lockstep with contracts/components/schemas/LLMError.yaml (see that
# file's comment for the full mechanism): an entry MAY carry an optional sibling
# `provider_message` string — the templated sentence the agent assembles at the
# emit site when the failing attempt's facts are present (C-16); the plain
# `message` above is the facts-absent fallback. Slots come from the CLOSED
# vocabulary {provider} {model} {attempt} {max} {countdown} {answered_model}
# {unavailable_model}; both generators hard-fail on any other slot and on a
# template with unbalanced braces. Emitted into BOTH catalogues
# (LLMErrorProviderMessages / llmErrorProviderMessages) — never hand-written.
#
# ── Neutral twins (#1857 frontend round) ─────────────────────────────────────
# Kept in lockstep with LLMError.yaml (see that file for the rules): an entry
# MAY carry `neutral` / `neutral_variants`, the neutral-voice form of the chat
# sentence for surfaces outside a chat.
x-user-messages:
  media_unsupported:
    message: "This model can’t use that kind of attachment. Try a different file format, or switch to a model that supports it."
    attribution: model
  media_too_large:
    # Issue #1435/#1483: a provider "image too large / requires N patches" rejection is
    # its own cause, never relabelled media_unsupported. `model` attribution: the
    # ceiling belongs to the model; Omnipus has already resized automatically.
    message: "An image in this conversation is too large for this model’s size limit, even after Omnipus resized it automatically. Try a smaller image, or open Verbose chat for details."
    attribution: model
  provider_rejected:
    message: "The model declined to respond to this request. Try rephrasing it, or switch models."
    attribution: model
  request_too_large:
    message: "We built a request that was too large for this model to accept. Try shortening your message, or switch to a model with a larger limit."
    attribution: product
  provider_auth_failed:
    message: "The model provider rejected our credentials. Check this provider’s API key in Settings."
    attribution: config
    # Kept in lockstep with contracts/components/schemas/LLMError.yaml.
    provider_message: "{provider} rejected the API key. Check the key in Settings → Providers."
  rate_limited:
    message: "The model provider is temporarily overloaded. Wait a moment, then retry."
    attribution: provider
    # Kept in lockstep with contracts/components/schemas/LLMError.yaml. This is
    # the TERMINAL line's template (§6); the live countdown line is
    # client-assembled from the provider_retry frame, never a server template.
    provider_message: "{provider} is busy right now. You can retry the turn."
  quota_billing:
    # provider-messages spec §7.1/D15: attribution config is FINAL (no placeholder).
    # Facts-absent sentence follows the house "The model provider…" pattern; the
    # templated variant substitutes the failing attempt's provider (C-16). Copy
    # carries no button, no link (D6).
    message: "The model provider says your account is out of credit."
    attribution: config
    provider_message: "{provider} says your account is out of credit."
  network:
    message: "We couldn’t reach the model provider. Check your internet connection and retry."
    attribution: ambiguous
  provider_stalled:
    # Kept in lockstep with contracts/components/schemas/LLMError.yaml.
    message: "The model provider stopped responding: nothing arrived for 5 minutes (or the silence limit set for this provider), so the call was ended. Retry — if it keeps happening, open Verbose chat for details."
    attribution: provider
  provider_empty_reply:
    # Issue #1664 (founder decision 2026-11-07 Q3 A): the provider ended a streaming
    # answer with no finish_reason, no text and no tool call, on every attempt.
    # Same attempt rule as a silent call. Retryable like `provider_stalled`.
    message: "The model provider ended its answer without sending anything. Retry — if it keeps happening, open Verbose chat for details."
    attribution: provider
  content_policy:
    message: "The model provider blocked this request under its content policy. Try rephrasing to remove the flagged content."
    attribution: provider
  context_too_long:
    message: "This turn needed more context than the model can hold, even after trimming older turns automatically. Try a model with a larger context window, or shorten this message."
    attribution: product
  tool_args:
    message: "The model filled in a tool’s arguments incorrectly. Retry — Verbose chat shows which tool and what went wrong."
    attribution: model
  tool_call_truncated:
    message: "The model's tool call was cut off at its output limit before it finished. Ask for less in one step, or split the work."
    attribution: model
  schema:
    message: "We sent the model provider a request it couldn’t process — that’s a bug on our side, not yours. Retry the turn, or open Verbose chat for technical details."
    attribution: product
  agent_not_configured:
    message: "This agent isn’t on any workspace yet, so it has nowhere to work. Add it to a workspace team to get started."
    attribution: config
  workspace_unavailable:
    message: "This agent’s working folder could not be opened. Check that the disk has space and the folder is writable."
    attribution: config
  model_unavailable:
    message: "The model you picked isn’t available for this turn, so this reply used the previous model. Check the model in Settings."
    attribution: config
  model_retired:
    # Kept in lockstep with contracts/components/schemas/LLMError.yaml (D9/D11:
    # provider retired the configured model DURING a real call, C-24 trigger).
    message: "This model is no longer offered by its provider. Pick a new model in the agent's settings."
    attribution: config
    provider_message: "This model is no longer offered by {provider}. Pick a new model in the agent's settings."
  needs_provider:
    # ADR-068 FR-046 (2026-08-23 §8b, T068-32) — kept in lockstep with
    # contracts/components/schemas/LLMError.yaml; see that file's comment.
    message: "Your sign-in for this provider expired. Sign in again under Settings → Providers."
    attribution: user
  model_unassigned:
    message: "This agent has no model. Pick one in the agent's settings."
    attribution: config
  turn_canceled:
    message: "This turn was stopped before it finished."
    attribution: user
  turn_timed_out:
    message: "The model provider didn’t answer this request in time. Retry — if it keeps happening, open Verbose chat for details."
    attribution: provider
  judge_time_limit:
    message: "The Judge reached its own check time limit before it finished checking this work. Raise judge.timeout_sec in config.json if checks need longer, then check again."
    attribution: config
  judge_conclusion_failed:
    # Issue #1306 (SFH R2-3): an operational notice, not a turn exit — the
    # Judge's conclusion could not be fully saved or delivered. It ends no
    # turn. Not retryable; never a trusted provider message.
    message: "Omnipus could not fully save or deliver the Judge's conclusion. Check disk space, file permissions and the chat's channel connection, then reload the chat. Open Verbose chat for details."
    attribution: ambiguous
  delegated_task_limit:
    message: "A delegated task reached its configured limit before finishing. Open its task or session, then adjust the named limit if more work is needed."
    attribution: config
  context_window_unknown:
    message: "This endpoint did not report a context length for this model. Set it under Settings → Models → Model overrides → Context length."
    attribution: config
  bad_model:
    message: "The model configured for this agent is not offered by its provider (bad_model). Pick a new model in the agent's settings."
    attribution: config
    provider_message: "Model {model} is not offered by provider {provider} (bad_model). Pick a new model in the agent's settings."
  provider_request_rejected:
    message: "We sent the model provider a request it rejected (HTTP 400: Bad Request; format). Open Verbose chat for technical details."
    attribution: product
    provider_message: "Provider {provider} rejected the request for model {model} (HTTP 400: Bad Request; format). Open Verbose chat for technical details."
  model_route_unavailable:
    message: "The provider for this model could not be set up from its saved settings, so no request was sent. Check the provider's API key and endpoint settings."
    attribution: config
    provider_message: "{provider} cannot serve model {model}: no usable connection could be set up from its saved settings, so no request was sent. Check the provider's API key and endpoint settings."
  external_cli_invalid_args:
    # #1857 (§13.8): founder-approved 2026-11-18 — see docs/internal/specs/notifications-1857-pending-wording.md. W1 (C1).
    message: "I couldn't start {cli}: it rejected its own command line, so nothing ran. Check the worker's Additional CLI arguments setting."
    attribution: config
    neutral: "{cli} rejected its own command line, so nothing ran. Check the worker's Additional CLI arguments setting."
  external_cli_model_unavailable:
    # #1857 (§13.8): founder-approved 2026-11-18 — see docs/internal/specs/notifications-1857-pending-wording.md. W2 (C2).
    message: "I couldn't run the task in {cli}: it couldn't use the model {model}. Set this worker's model to one {cli} supports, in the agent's settings."
    attribution: config
    neutral: "The run in {cli} could not use the model {model}. Set this worker's model to one {cli} supports, in the agent's settings."
  external_cli_needs_signin:
    # #1857 (§13.8): founder-approved 2026-11-18 — see docs/internal/specs/notifications-1857-pending-wording.md. W3 (C3); one sentence serves both voices.
    message: "{cli} is not signed in on the machine it runs on, so the run stopped. Sign in to {cli} there, then retry the task."
    attribution: user
  external_cli_failed:
    # #1857 (§13.8): founder-approved 2026-11-18 — see docs/internal/specs/notifications-1857-pending-wording.md. W4 (C4); variants W6 (C6 stream_read), W7 (C7 start).
    message: "I couldn't finish the run in {cli}: it stopped with an error I couldn't identify. Retry the task; if it keeps happening, check that {cli} works on its own."
    attribution: ambiguous
    neutral: "The run in {cli} stopped with an error that could not be identified. Retry the task; if it keeps happening, check that {cli} works on its own."
    variants:
      stream_read: "I couldn't finish the run in {cli}: reading its output failed. Retry the task; if it keeps happening, check that {cli} works on its own."
      start: "I couldn't start {cli}: the program could not be launched. Check the CLI worker's program path in Settings."
    neutral_variants:
      stream_read: "The run in {cli} ended because reading its output failed. Retry the task; if it keeps happening, check that {cli} works on its own."
      start: "{cli} could not be launched. Check the CLI worker's program path in Settings."
  external_cli_turn_limit:
    # #1857 (§13.8): founder-approved 2026-11-18 — see docs/internal/specs/notifications-1857-pending-wording.md. W5 (C5).
    message: "I stopped the run in {cli}: it reached its limit of {n} turns for this task. Split the work into smaller steps, or raise the limit in the agent's settings."
    attribution: config
    neutral: "The run in {cli} reached its limit of {n} turns for this task. Split the work into smaller steps, or raise the limit in the agent's settings."
  external_cli_upstream_refused:
    # #1857 (§13.8): founder-approved 2026-11-18 — see docs/internal/specs/notifications-1857-pending-wording.md. W13 limit form (C9); variant W13 out-of-credit form; one sentence serves both voices.
    message: "The model {cli} uses is limiting requests right now. Try the task again in a moment."
    attribution: ambiguous
    variants:
      out_of_credit: "{cli}'s model provider account is out of credit. Top up that account to run tasks with {cli}."
  provider_error:
    # #1857 (§13.8): founder-approved 2026-11-18 — see docs/internal/specs/notifications-1857-pending-wording.md. no facts-absent W form (W12 needs {provider} and {host}) — existing generic sentence (A4/A5, R-4).
    message: "This turn didn’t finish, and we can’t tell why. Retry — if it keeps happening, open Verbose chat for details, or try a different model."
    attribution: provider
  agent_request_limit:
    # #1857 (§13.8): founder-approved 2026-11-18 — see docs/internal/specs/notifications-1857-pending-wording.md. W11 (B3, founder E2; W11 A).
    message: "I've reached my limit of model requests for this hour. I can continue in {minutes} minutes, or you can raise the limit in Settings."
    attribution: config
    neutral: "This agent reached its limit of model requests for this hour. It can continue in {minutes} minutes, or the limit can be raised in Settings."
  tool_assembly_duplicate:
    # #1857 (§13.8): founder-approved 2026-11-18 — see docs/internal/specs/notifications-1857-pending-wording.md. W21 (B10, no MCP tool involved — the fail-closed class); variant mcp W20 (B10, an MCP tool involved).
    message: "I couldn't get my tools ready because two of them have the same name, so this turn didn't run. We don't know why this happened; if it keeps happening, please report it to the Omnipus.ai team."
    attribution: ambiguous
    neutral: "The agent's tools could not be made ready because two of them have the same name, so the turn didn't run. Why this happened is not known; if it keeps happening, please report it to the Omnipus.ai team."
    variants:
      mcp: "I couldn't get my tools ready: two tools have the same name, and one comes from a connected MCP server. Check this agent's tools and MCP servers."
    neutral_variants:
      mcp: "The agent's tools could not be made ready: two tools have the same name, and one comes from a connected MCP server. Check the agent's tools and MCP servers."
  transcript_save_failed:
    # #1857 (§13.8): founder-approved 2026-11-18 — see docs/internal/specs/notifications-1857-pending-wording.md. W17 (B25 settlement).
    message: "This turn finished, but I couldn't save its final state. Recent messages may be missing from your history; check the answer above before repeating anything."
    attribution: ambiguous
    neutral: "The run finished, but its final state could not be saved. Recent messages may be missing from the history; check the result before repeating any part of the task."
  goal_state_unavailable:
    # #1857 (§13.8): founder-approved 2026-11-18 — see docs/internal/specs/notifications-1857-pending-wording.md. W18 (B26/B22).
    message: "I couldn't read the goal for this conversation, so I didn't continue working on it. Try again in a moment."
    attribution: ambiguous
    neutral: "The goal for this conversation could not be read, so the work did not continue. Try again in a moment."
  external_cli_not_found:
    # #1857 (§13.8): founder-approved 2026-11-18 — see docs/internal/specs/notifications-1857-pending-wording.md. W7 reused by chief ruling Q1 A (2026-11-18) (C8 program-path refusal).
    message: "I couldn't start {cli}: the program could not be launched. Check the CLI worker's program path in Settings."
    attribution: config
    neutral: "{cli} could not be launched. Check the CLI worker's program path in Settings."
  external_cli_invalid_config:
    # #1857 (§13.8): founder-approved 2026-11-18 — see docs/internal/specs/notifications-1857-pending-wording.md. W7 reused by chief ruling Q1 A (2026-11-18) (B16 config gap with a known program, B17b invalid turn cap); variant no_program W19 (B16 pre-checks, no program known).
    message: "I couldn't start {cli}: the program could not be launched. Check the CLI worker's program path in Settings."
    attribution: config
    neutral: "{cli} could not be launched. Check the CLI worker's program path in Settings."
    variants:
      no_program: "I couldn't start the coding program: its settings for this agent are missing or invalid. Check the agent's coding program settings."
    neutral_variants:
      no_program: "The coding program could not start: its settings for this agent are missing or invalid. Check the agent's coding program settings."
  delegation_not_resumable:
    # #1857 (§13.8): founder-approved 2026-11-18 — see docs/internal/specs/notifications-1857-pending-wording.md. W14 form 1 (B16a resume unavailable, selected by errExternalResumeUnavailable's identity; ARCHITECT-RULING-R4 D3); variant no_cli W14's no-fact form (no CLI display name known). The no_cli neutral twin applies W14's clause drop to the neutral form (the spec defines the no-fact chat form only).
    message: "I couldn't continue this delegation in {cli}: its previous conversation can't be resumed. Start a new delegation."
    attribution: ambiguous
    neutral: "This delegation could not continue in {cli}: its previous conversation can't be resumed. Start a new delegation."
    variants:
      no_cli: "I couldn't continue this delegation: its previous conversation can't be resumed. Start a new delegation."
    neutral_variants:
      no_cli: "This delegation could not continue: its previous conversation can't be resumed. Start a new delegation."
  unknown:
    message: "This turn didn’t finish, and we can’t tell why. Retry — if it keeps happening, open Verbose chat for details, or try a different model."
    attribution: unknown
properties:
  code:
    type: string
    description: >-
      Error code. `judge_conclusion_failed` is an operational notice that the Judge's conclusion could not be fully saved or delivered; it ends no turn, so a client must not treat it as the end of the chat's running turn (issue #1306).
    enum:
      - media_unsupported
      - media_too_large
      - provider_rejected
      - request_too_large
      - provider_auth_failed
      - rate_limited
      - quota_billing
      - network
      - provider_stalled
      - provider_empty_reply
      - content_policy
      - context_too_long
      - tool_args
      - tool_call_truncated
      - schema
      - agent_not_configured
      - workspace_unavailable
      - model_unavailable
      - model_retired
      - needs_provider
      - model_unassigned
      - turn_canceled
      - turn_timed_out
      - judge_time_limit
      - judge_conclusion_failed
      - delegated_task_limit
      - context_window_unknown
      - bad_model
      - provider_request_rejected
      - model_route_unavailable
      - external_cli_invalid_args
      - external_cli_model_unavailable
      - external_cli_needs_signin
      - external_cli_failed
      - external_cli_turn_limit
      - external_cli_upstream_refused
      - provider_error
      - agent_request_limit
      - tool_assembly_duplicate
      - transcript_save_failed
      - goal_state_unavailable
      - external_cli_not_found
      - external_cli_invalid_config
      - delegation_not_resumable
      - unknown
  message:
    type: string
    minLength: 1
    maxLength: 4096
  retryable:
    type: boolean
  provider_message:
    type: boolean
    description: >-
      Server-authored subtype/trust flag (MAJ-104, C-14), replay twin of the
      live LLMError flag: when true, `message` carries the persisted
      server-assembled catalogue sentence, every slot filled (any code),
      and the SPA renders it after reload; when
      absent or false, catalogue copy keyed on `code`, byte-identical to today
      (RG-2). No `facts` object on the replay shape (§7.1 item 3 — the persisted
      message itself carries the provider naming, C-13).
