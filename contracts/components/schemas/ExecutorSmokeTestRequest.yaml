type: object
description: >
  Runs a trivial, real prompt through an external-CLI worker's real
  dispatch path (the same driver.Run() a genuine subagent_3p delegation
  uses) and returns the real response. Distinct from the zero-token
  POST /agents/{id}/runner/test (binary-present → version handshake →
  credential-file-presence only, never spends a token) — this spawns a
  real, authenticated subprocess and costs real model usage, so it is an
  explicit operator action, never automatic. Mirrors POST
  /agents/executor-preview and POST /system/cli-validate's body-driven
  shape, so it needs no existing agent id; in the web app, Send a test
  message is on an existing external worker's Runtime tab. When agent_id
  identifies a saved agent, the test starts from that agent's resolved home
  folder. If workspace lookup finds the agent's workspace and its
  project-work folder can be prepared, that workspace folder is used
  instead. Otherwise the test keeps the agent home; if that chosen folder
  cannot be prepared either, the test returns a failure before starting the
  program. These are persistent folders and this handler does not remove
  them. If agent_id is omitted, blank or does not identify a saved agent,
  the test prepares a disposable scratch folder instead and cleans it up
  after the run. The used_agent_workspace flag distinguishes the prepared
  persistent branch from the scratch branch; a preparation failure can
  return before any program starts. There is no
  cli_path member (T11 C-B1): the program for the CLI is the path a person
  saved in Settings -> Third-party agents, and a request that carries
  cli_path is refused with 400 in every inbound-validation mode.
required:
  - cli
additionalProperties: false
properties:
  cli:
    $ref: './ExternalCli.yaml'
    x-go-type: ExternalCliTool
  agent_id:
    type: string
    maxLength: 128
    description: >
      Optional ID of an existing saved agent. When found, the run uses its
      resolved home, overridden by the workspace project-work folder only
      when workspace lookup and preparation succeed. Otherwise it keeps the
      agent home. That persistent folder is not removed by this handler. An
      omitted, blank or unrecognized ID selects disposable scratch
      preparation instead.
  model:
    type: string
    maxLength: 256
    description: Model slug/shape to run with, same semantics as ExecutorCommandPreviewRequest.model.
  cli_args:
    type: string
    maxLength: 4096
    description: Free-form additional CLI arguments, same tokenizer and safety filter as ExecutorConfig.cli_args.
