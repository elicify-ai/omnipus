title: VaultSearchNoteHit
description: >
  One note matched by body text (library-b-c-design-2026-09-07 §C1). The match
  decision and ranking come from the knowledge_find engine (hits arrive in that
  engine's relevance order); the snippet is a render-time excerpt of the note as
  it is on disk.
type: object
additionalProperties: false
required:
  - path
  - title
properties:
  path:
    type: string
    minLength: 1
    description: Collection-relative path of the matched note, forward-slash separated. Open it in the preview.
    example: "architecture/sandboxing.md"
  title:
    type: string
    description: >
      Display title — the note's frontmatter title or first heading, falling
      back to the basename. May be empty.
    example: "Sandboxing"
  snippet:
    type: string
    description: >
      A short excerpt of the note body around the first matched term, read from
      the file at query time. ABSENT when no term could be located in the
      current file (the match may have moved, or the file could not be read) —
      the hit is still returned with path and title rather than fabricating an
      excerpt or dropping the result.
    example: "…Landlock is per-thread and inherited, so the gateway and its children…"
  excerpt_unavailable:
    type: boolean
    description: >
      True when no excerpt could be produced for this hit (the match moved, or
      the file could not be re-read). A deliberate reduction of the retired
      surface's 5-reason enum to a boolean — the find path cannot attribute the
      old re-read reasons (spec R2-MIN-010). The hit still renders by title and
      path; an absent snippet with this flag false simply means no term was
      located.
