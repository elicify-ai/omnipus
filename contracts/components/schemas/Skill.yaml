type: object
description: >
  A single installed skill as returned by GET /skills.
  Skills are SKILL.md/package bundles loaded from ~/.omnipus/skills/ that extend
  agent capabilities. Each skill has an ID, version, and human-readable metadata.
required:
  - revision
  - id
  - name
  - version
  - verified
  - status
  - has_local_changes
  - category
  - trust_approved
additionalProperties: false
properties:
  has_local_changes:
    type: boolean
    description: >
      true when any of: (a) the newest version's kind is not install or
      install_replace (a restore of an install version counts as a change);
      (b) the live folder's current content revision differs from the newest
      version's revision (an outside change not yet recorded) — evaluated at
      read time, never by writing history; (c) history is missing or
      unreadable. Always false for built-ins.
  revision:
    $ref: './ConfigurationRevision.yaml'
    description: >
      Content revision of the installed folder (pkg/skills/capture.go
      ContentRevision). Server-derived; ignored if a client sends it (C-5).
  category:
    $ref: './SkillCategory.yaml'
    x-go-type: SkillCategory
    description: >
      Skills & Tools spec C-5. Set at install (or from the skill's own
      metadata.category for a built-in skill), stored in Omnipus's own data,
      never in the skill file. A skill stored as uncategorised can have it
      chosen once (PUT /skills/{name}/category, C-21).
  trust_approved:
    type: boolean
    description: >
      Skills & Tools spec C-24: true when the current revision has a stored
      trust approval. Server-derived; ignored if a client sends it.
    example: false
  load_error:
    type: string
    description: >
      Skills & Tools spec FR-063 (S-80, #1570): why this skill cannot be
      loaded, in plain words, when its files could not be read. Present only
      then, with status "error"; the rest of the list is unaffected. While it
      is set, revision is a placeholder that matches no stored state, so a
      write naming it is refused as stale.
    example: "a file in the skill folder is not readable (permission denied)"
  persistence_status:
    $ref: './ConfigurationPersistenceStatus.yaml'
  activation_status:
    $ref: './ConfigurationActivationStatus.yaml'
  changed_fields:
    type: array
    items:
      type: string
  error_stage:
    type: string
  message:
    type: string
  id:
    type: string
    description: Unique skill identifier (typically the skill directory name or npm package name).
    example: "web-research"
  name:
    type: string
    description: Human-readable skill name.
    example: "Web Research"
  version:
    type: string
    description: >
      Version string as declared by the skill's SKILL.md or its source registry.
      Often semver ("1.2.3") but NOT required to be — community/ClawHub skills use
      arbitrary version strings ("1.0", "v2", a date, etc.). Defaults to "0.0.0"
      when the skill declares no version. Treated as an opaque display label.
    example: "1.2.3"
  description:
    type: string
    description: Short description of what the skill does.
    example: "Gives the agent web search and page extraction capabilities."
  author:
    type: string
    description: Skill author or publisher name.
    example: "Omnipus Community"
  source:
    type: string
    enum:
      - builtin
      - global
      - workspace
    description: >
      Skill origin: "builtin" = pre-installed/system skill (cannot be deleted),
      "global"/"workspace" = user-installed (community/3rd-party).
    example: "builtin"
  full_tokens:
    type: integer
    minimum: 0
    readOnly: true
    description: >
      Skills & Tools spec C-14 "Page warning" (ruling spec-gaps-1): the
      estimate a chat turn charges for this skill's Full block
      ("### Skill: <id>" and its body), made with the turn's estimator.
      Served for every installed skill whatever its level. Absent when the
      skill file cannot be read (load_error is then set).
    example: 3240
  verified:
    type: boolean
    description: >
      Skills & Tools spec C-5: true for a built-in skill, or for a skill
      whose install was checked against a registry hash AND whose folder has
      no local changes since; false otherwise. Unverified skills follow the
      skill trust setting (allow / ask / deny, C-3).
    example: true
  status:
    type: string
    enum:
      - active
      - disabled
      - inactive
      - error
    description: >
      "active" when the skill is loaded and its tools are available to agents.
      "disabled" when the skill has been installed but deactivated.
      "inactive" when the skill is installed but not currently activated.
      "error" when the skill failed to load (malformed SKILL.md, missing dependency, etc.).
    example: "active"
  agent_assignment:
    type: string
    description: >
      ID of the agent this skill is assigned to, when the skill is bound to a
      specific agent rather than globally available. Absent for globally assigned skills.
    example: "jim"
  argument_hint:
    type: string
    description: >
      Optional placeholder shown in the slash-command menu and as ghost text after the
      user selects this skill from the composer palette (e.g. "[topic]", "<url>").
      Sourced from the SKILL.md frontmatter `argument-hint:` field (ClawHub convention).
      Absent when the skill does not declare a hint.
    example: "[topic]"
  last_invoked:
    type: string
    format: date-time
    nullable: true
    description: >
      ADR-072 D3.1: ISO 8601 timestamp of the most recent time this skill was
      requested by name through the Skill tool's load path (pkg/audit.Logger
      ::LastInvokedForSkill — both "loaded" and "denied" load outcomes count,
      a search match does not). Null when the skill has never been invoked by
      name, or its invocation history could not be determined.
    example: "2026-08-15T10:00:00Z"
