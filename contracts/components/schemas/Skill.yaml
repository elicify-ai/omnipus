type: object
description: >
  A single installed skill as returned by GET /skills.
  Skills are SKILL.md/package bundles loaded from ~/.omnipus/skills/ that extend
  agent capabilities. Each skill has an ID, version, and human-readable metadata.
required:
  - id
  - name
  - version
  - verified
  - status
additionalProperties: false
properties:
  id:
    type: string
    description: Unique skill identifier (typically the skill directory name or npm package name).
    example: "web-research"
  name:
    type: string
    description: Human-readable skill name.
    example: "Web Research"
  version:
    type: string
    description: >
      Version string as declared by the skill's SKILL.md or its source registry.
      Often semver ("1.2.3") but NOT required to be — community/ClawHub skills use
      arbitrary version strings ("1.0", "v2", a date, etc.). Defaults to "0.0.0"
      when the skill declares no version. Treated as an opaque display label.
    example: "1.2.3"
  description:
    type: string
    description: Short description of what the skill does.
    example: "Gives the agent web search and page extraction capabilities."
  author:
    type: string
    description: Skill author or publisher name.
    example: "Omnipus Community"
  source:
    type: string
    enum:
      - builtin
      - global
      - workspace
    description: >
      Skill origin: "builtin" = pre-installed/system skill (cannot be deleted),
      "global"/"workspace" = user-installed (community/3rd-party).
    example: "builtin"
  verified:
    type: boolean
    description: >
      True when the skill has been verified by the Omnipus team.
      Unverified skills require explicit trust grant before use.
    example: true
  status:
    type: string
    enum:
      - active
      - disabled
      - inactive
      - error
    description: >
      "active" when the skill is loaded and its tools are available to agents.
      "disabled" when the skill has been installed but deactivated.
      "inactive" when the skill is installed but not currently activated.
      "error" when the skill failed to load (malformed SKILL.md, missing dependency, etc.).
    example: "active"
  agent_assignment:
    type: string
    description: >
      ID of the agent this skill is assigned to, when the skill is bound to a
      specific agent rather than globally available. Absent for globally assigned skills.
    example: "jim"
  argument_hint:
    type: string
    description: >
      Optional placeholder shown in the slash-command menu and as ghost text after the
      user selects this skill from the composer palette (e.g. "[topic]", "<url>").
      Sourced from the SKILL.md frontmatter `argument-hint:` field (ClawHub convention).
      Absent when the skill does not declare a hint.
    example: "[topic]"
  last_invoked:
    type: string
    format: date-time
    nullable: true
    description: >
      ADR-072 D3.1: ISO 8601 timestamp of the most recent time this skill was
      requested by name through the Skill tool's load path (pkg/audit.Logger
      ::LastInvokedForSkill — both "loaded" and "denied" load outcomes count,
      a search match does not). Null when the skill has never been invoked by
      name, or its invocation history could not be determined.
    example: "2026-08-15T10:00:00Z"
