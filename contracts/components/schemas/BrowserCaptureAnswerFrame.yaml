title: BrowserCaptureAnswerFrame
description: >
  Server (gateway) → client (capture extension). Pion SDP answer to a
  browser_capture_offer, completing the ingest leg's non-trickle
  offer/answer exchange. Once applied, the encoder page's tabCapture
  MediaStream (video, plus audio when the tab produces sound) flows into
  the gateway's shared TrackLocalStaticRTP tracks for relay to viewers.
  See ADR-047 D1/D2.
type: object
required:
  - type
  - sdp
additionalProperties: false
properties:
  type:
    type: string
    const: browser_capture_answer
  sdp:
    type: string
    minLength: 1
    maxLength: 131072
    description: >-
      Complete SDP answer (application/sdp body) from the gateway's Pion
      ingest PeerConnection, ICE-gathering-complete (non-trickle).
  offer_id:
    type: integer
    minimum: 1
    maximum: 9007199254740991
    description: >-
      Encoder negotiation attempt identity on this ingest connection. The
      answer echoes this value; stale answers must never configure a newer
      peer even when the capture generation and target are unchanged.
  capture_generation:
    type: integer
    minimum: 1
    maximum: 9007199254740991
    description: Immutable accepted capture generation from the corresponding offer.
  target_id:
    type: string
    minLength: 1
    maxLength: 128
    description: Verified CDP page target from the corresponding offer.
