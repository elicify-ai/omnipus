title: ChannelConfigureRequest
description: >
  Request body for PUT /api/v1/channels/{id}/configure.
  Merges the supplied fields into the channel's config section. The "enabled"
  field is reserved and silently removed — use the separate enable/disable
  endpoints instead. Field names and value types are channel-specific; unknown
  fields are stored as-is and passed through to the channel implementation.
type: object
additionalProperties: true
properties:
  instance_id:
    type: string
    description: >
      Optional: the instance map key to configure. In v0.1 (cap-1/type) this
      equals the channel type and can be omitted. Reserved for v0.3 multi-instance
      support — the backend ignores this field today (the URL {id} is the key).
  identity:
    $ref: './ChannelIdentity.yaml'
    description: >
      Optional routing identity override for this channel instance. Persisted
      per instance; wired into ResolveRoute for inbound messages on this channel.
  token:
    type: string
    description: Channel authentication token (e.g. Telegram bot token, Discord bot token).
  bot_token:
    type: string
    description: Alias for token used by some channels.
  app_id:
    type: string
    description: Application ID (used by Slack, Discord).
  app_secret:
    type: string
    description: Application secret / signing secret.
  webhook_secret:
    type: string
    description: HMAC secret for verifying incoming webhook payloads.
  imap_host:
    type: string
    description: IMAP server hostname (email channel). TLS required.
    example: imap.gmail.com
  imap_port:
    type: integer
    description: IMAP server port (email channel). Defaults to 993 (IMAPS).
    example: 993
  smtp_host:
    type: string
    description: SMTP server hostname for outbound email (email channel). TLS required.
    example: smtp.gmail.com
  smtp_port:
    type: integer
    description: SMTP server port (email channel). Defaults to 587 (STARTTLS) or 465 (SMTPS).
    example: 587
  username:
    type: string
    description: Login username for IMAP and SMTP authentication (email channel).
    example: bot@example.com
  password:
    type: string
    description: >
      Login password for IMAP and SMTP authentication (email channel). Stored
      encrypted in the credential store — never returned in GET responses.
