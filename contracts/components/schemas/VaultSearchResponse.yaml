title: VaultSearchResponse
description: >
  The human vault search result (library-b-c-design-2026-09-07 §C1): three
  grouped hit lists for one query, plus an honest completeness verdict.

  An empty result is EMPTY, not an error — every hit array is always present and
  may be empty. When the index is not ready (never built, or still catching up
  with the files on disk), `complete` is false and `complete_reason` carries the
  engine's freshness signal, so the caller can say "still indexing" rather than
  "no results". A collection outside the caller's workspace scope returns this
  same empty-but-complete shape.
type: object
additionalProperties: false
required:
  - collection_id
  - complete
  - notes
  - records
  - views
properties:
  collection_id:
    type: string
    minLength: 1
    description: The collection this result covers, echoed from the request.
    example: "kb_3d1c9a7e5b2f4806"
  complete:
    type: boolean
    description: >
      True only when the search covered the whole vault: the index was built,
      current, and no kind's result was clamped or refused. False whenever the
      index is not ready — see complete_reason.
    example: true
  complete_reason:
    type: string
    description: >
      Why the verdict is false, ready to render (e.g. "the text index has never
      finished indexing this vault — it currently reflects 3 of 68 files…").
      Absent when complete is true.
    example: "the text index has never finished indexing this vault"
  notes:
    type: array
    description: Notes matched by body text. Always present — an empty array, never null.
    items:
      $ref: "./VaultSearchNoteHit.yaml"
      x-go-type: VaultSearchNoteHit
  records:
    type: array
    description: Records matched by their typed property values. Always present — an empty array, never null.
    items:
      $ref: "./VaultSearchRecordHit.yaml"
      x-go-type: VaultSearchRecordHit
  views:
    type: array
    description: Saved views whose name or label matched. Always present — an empty array, never null.
    items:
      $ref: "./VaultSearchViewHit.yaml"
      x-go-type: VaultSearchViewHit
  attachments:
    type: array
    description: >
      Attachments matched by FILENAME (ADR-081 attachment parity). The HANDLER
      always sends it (empty array, never null); it is wire-OPTIONAL only for
      additive compatibility with pre-existing clients and fixtures (MV-9's
      additive rule) — a consumer treats absence as []. PLATFORM CARVE-OUT (spec MV-9): on
      builds without the properties index (records_no_sqlite, mipsle, netbsd,
      freebsd-arm) this group is empty WITH complete=false and the engine's
      refusal reason in complete_reason — never a silently bare empty group.
    items:
      $ref: "./VaultSearchAttachmentHit.yaml"
      x-go-type: VaultSearchAttachmentHit
  notes_searched:
    type: integer
    minimum: 0
    description: >
      How many notes the engine actually searched for this answer (the "X" of
      the coverage statement). OMITTED when unknown — never fabricated
      (FR-036's never-invent-a-denominator rule).
  notes_total_known:
    type: integer
    minimum: 0
    description: >
      The engine's best-known total note count (the "Y"). OMITTED when the
      total is not known; a renderer must then say "X so far", not invent Y.
  notes_capped_at_limit:
    type: boolean
    description: >
      True when the notes group was cut at the per-kind limit — the count is a
      lower bound and the UI renders "N+", never an exact total.
  statement:
    type: string
    description: >
      Server-authored, render-ready coverage sentence (composed by the
      HANDLER, mirroring the retired surface's knowledgeStatement). The one
      string a UI may show verbatim for the partial-results notice.
  limit_clamped:
    type: boolean
    description: True when the requested limit exceeded the server cap and was clamped (the clamp is REPORTED, never silent).
  limit_requested:
    type: integer
    minimum: 1
    description: The limit the caller asked for, echoed when a clamp occurred.
