title: BrowserWebRTCStateFrame
description: >
  Server → client. Availability / lifecycle state for the WebRTC media path
  on a live-browser connection, distinct from the general lifecycle carried
  by browser_status. `available` tells the SPA whether it may attempt a
  browser_webrtc_offer at all (feature flag off, platform/build not
  capable, or a runtime error takes it out of service); `active` tells the
  SPA whether a WebRTC session is currently flowing media for this
  connection. Per ADR-061, WebRTC is the ONLY live-browser video path —
  there is no screencast fallback to degrade to. available=false or active
  dropping to false after being true (e.g. ICE failure) means the panel
  genuinely has no video right now, and the SPA must show that honestly
  rather than silently substituting another stream. See ADR-047 D1/D7
  (lite builds compile WebRTC out entirely), ADR-061.
type: object
required:
  - type
  - available
additionalProperties: false
properties:
  type:
    type: string
    const: browser_webrtc_state
  session_id:
    type: string
    maxLength: 128
    description: >-
      Echoes the session_id from the triggering browser_webrtc_offer /
      browser_attach, for client-side correlation only.
  available:
    type: boolean
    description: >-
      True if the gateway currently offers WebRTC for this connection (the
      webrtc_enabled config flag is on, the platform/build supports it, and
      no runtime error has taken it out of service). False means the SPA
      must not send browser_webrtc_offer — there is no video for this
      connection until it becomes true.
  reason:
    type: string
    enum:
      - disabled
      - not_capable
      - lite_build
      - error
      - multi_agent_capture_denied
      - ingest_timeout
    description: >-
      Present when available=false (or when active unexpectedly drops to
      false): disabled = tools.browser.webrtc_enabled is off; not_capable =
      platform/managed-Chrome capability classification is below WebRTC
      eligibility (ADR-047 D5, e.g. chrome-headless-shell only, no full
      Chrome); lite_build = binary built with -tags lite (Pion compiled
      out, ADR-047 D7); error = a runtime failure (capture/encoder/ICE)
      took the WebRTC path out of service for this session;
      multi_agent_capture_denied = another agent's capture is already
      being viewed (ADR-048 condition 2; v1 is single-capture);
      ingest_timeout = the capture pipeline produced no video track within
      waitForTracksTimeout (webrtc.ErrNoIngestVideoTrack) — distinct from
      error because the cause sits UPSTREAM of ICE, the encoder page never
      delivered frames, so retrying the viewer connection is usually futile
      while restarting capture is not.
  reason_detail:
    type: string
    maxLength: 512
    description: >-
      Optional free-text cause that accompanies `reason`, for the operator to
      read and act on. `reason` is a CLOSED enum and four of its six values
      collapse wildly different causes into one token, so on its own it
      cannot say WHY video failed — an operator saw "capture session: create
      encoder target: browser: timed out after 20s waiting for the browser to
      attach the tab" in gateway.log while the panel showed only "the live
      browser reported an error starting video". ADR-061 deleted the silent
      JPEG fallback precisely so a failure would be visible AND specific; a
      visible failure naming no cause gives back what that deletion bought.
      The browser_attach path already sends its full error chain as free text
      on browser_status; this field closes the same gap for the start-video
      route. Server-side the text is whitespace-collapsed, credential-redacted
      (labelled secrets, bearer tokens and bare long hex runs — the capture
      token's shape) and length-bounded before it is sent; URLs, CDP target
      ids, ports and timeouts are deliberately KEPT, because they are what
      makes the sentence actionable. Absent when the enum alone fully explains
      the state (disabled / lite_build / not_capable) or on a success frame.

  has_audio:
    type: boolean
    description: >-
      True if the active (or about-to-be-offered) media includes an audio
      track from the captured tab. Absent/false when audio is unavailable
      or not yet known.
  active:
    type: boolean
    description: >-
      True while a WebRTC PeerConnection for this viewer is currently
      connected and flowing media. False (or absent) means this viewer
      currently has no video — WebRTC not yet offered, not yet negotiated,
      or lost after an ICE/connection failure (ADR-061: there is no
      fallback tier to degrade to).
  ice_servers:
    type: array
    maxItems: 8
    description: >-
      ADR-062 tier 3. The ICE servers this viewer should configure, including
      short-lived TURN credentials minted for it. Present only when the
      gateway runs the embedded relay. The SPA previously hard-coded a public
      STUN server, which cannot help a client whose network blocks the
      hole-punch; a relay the gateway itself runs can. Credentials cannot be
      revoked per allocation (pion/turn exposes no teardown), so their
      guarantee is a bounded lifetime, not revocation.
    items:
      type: object
      additionalProperties: false
      required:
        - urls
      properties:
        urls:
          type: array
          maxItems: 4
          items:
            type: string
            maxLength: 256
        username:
          type: string
          maxLength: 256
        credential:
          type: string
          maxLength: 256
