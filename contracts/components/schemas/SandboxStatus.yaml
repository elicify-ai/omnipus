title: SandboxStatus
description: >
  Runtime sandbox backend status returned by
  GET /api/v1/security/sandbox-status.
type: object
required:
  - backend
  - available
  - kernel_level
  - policy_applied
  - seccomp_enabled
  - bind_ports_count
properties:
  backend:
    type: string
    description: Name of the active sandbox backend.
    example: landlock
  available:
    type: boolean
    description: Whether the backend is available on this platform.
    example: true
  kernel_level:
    type: boolean
    description: >
      Whether the backend can enforce at the kernel level. True for Landlock
      on Linux 5.13+. False for the fallback (app-level) backend.
    example: true
  policy_applied:
    type: boolean
    description: >
      Whether kernel-level enforcement is actually live on this process.
      A kernel-capable backend may not have policy applied if Apply() was
      not called yet (e.g. sandbox mode is off).
    example: true
  abi_version:
    type: integer
    description: Landlock ABI version. Present on Linux with Landlock support.
    example: 4
  issue_ref:
    type: string
    description: >
      Set when a known kernel incompatibility is flagged. Do NOT hard-code
      the literal issue number in the SPA.
    example: "https://github.com/elicify-ai/omnipus/issues/123"
  blocked_syscalls:
    type: array
    items:
      type: string
    description: >
      List of syscall names blocked by seccomp (when active).
  seccomp_enabled:
    type: boolean
    description: Whether seccomp BPF filtering is currently active.
    example: true
  landlock_features:
    type: array
    items:
      type: string
    description: Landlock feature flags active on this kernel.
  notes:
    type: array
    items:
      type: string
    description: Human-readable notes about the sandbox state or limitations.
  mode:
    type: string
    description: Current sandbox enforcement mode (from ApplyState).
    example: enforce
  filesystem_model:
    type: string
    enum: [confined, open]
    description: >
      Which ADR-062 filesystem model is active. "confined" enumerates the
      paths that may be read and executed; "open" leaves reads and execution
      unrestricted apart from the secret set, and confines writes exactly as
      "confined" does. This never affects what an agent may WRITE.
      Surfaced because the two postures are indistinguishable from the
      outside: an operator cannot tell from behaviour whether a read
      succeeded because the model is open or because the path happened to be
      on the enumerated list.
    example: confined
  disabled_by:
    type: string
    description: >
      Reason the sandbox is disabled, if applicable. E.g. "config" or "kernel".
  landlock_enforced:
    type: boolean
    description: Whether Landlock file-system access rules are enforced.
  seccomp_enforced:
    type: boolean
    description: Whether seccomp syscall filtering is enforced.
  audit_only:
    type: boolean
    description: >
      True when the sandbox is in permissive (audit-only) mode —
      policy violations are logged but not blocked.
  bind_ports_count:
    type: integer
    minimum: 0
    description: >
      Number of bind-port allow-list rules installed by the kernel.
      Zero on FallbackBackend, Mode=Off, or Landlock ABI < 4.
    example: 2
  kernel_sandbox_active:
    type: boolean
    description: >
      Whether a kernel sandbox is confining the processes agents spawn right
      now (sandbox.TurnPolicyBaseInstalled: the gateway registers a per-turn
      kernel policy base only once a kernel backend is enforcing for spawned
      children). Linux: true when Landlock was applied in enforce mode and
      not degraded (false in permissive mode). macOS: true when the Seatbelt
      boot profile was installed, so every spawned child is wrapped
      (policy_applied above reports the gateway's OWN confinement and is
      documented false on macOS by design). Windows, sandbox mode off, and
      the app-level fallback backend: always false. God Mode does not change
      this value, but under God Mode agents' children run without the
      per-turn kernel policy; see god_mode_active.
      [2026-09-24, founder decision] This no longer gates Auto-approve: Auto
      applies to every tool, bash included, whether or not this value is
      true. It is now purely informational — the input the UI uses to show
      the "Auto — no sandbox" warning badge/tooltip: without a kernel
      sandbox, shell commands under Auto now ask first (the D7/D8
      pre-flights plus the founder-decision-A no-sandbox gate,
      pkg/tools/shell_no_sandbox_gate.go) unless the command is read-only or
      fully covered by an operator allow rule. Always present from this
      gateway.
    example: true
  auto_approve_effective:
    type: boolean
    description: >
      The gateway-wide Auto-approve DEFAULT: exactly the live
      SandboxConfig.auto_approve value, reported here so the chat-header badge
      needs no second request. It is NOT combined with kernel_sandbox_active
      and NOT resolved for any agent or chat (this endpoint has no agent or
      session context). Auto actually takes effect for a call when the tool
      resolves to "ask", the resolved Auto-approve for that chat is on (this
      default, turned off by the agent's auto_approve_disabled, then
      overridden either way by the chat's own modifier —
      SessionModeUpdatedFrame / SessionStateFrame.auto_approve_modifier), and
      god_mode_active is false. [2026-09-24, founder decision] Auto no longer
      also requires kernel_sandbox_active — it now means exactly what the
      agent loop's autoApproveActive predicate computes (God Mode off, Auto
      resolved on), independent of kernel enforcement. Badge reading, before
      the per-agent and per-chat layers are folded in: god_mode_active=true
      shows "God Mode" whatever the other two fields say; else
      auto_approve_effective=false shows "Ask"; else kernel_sandbox_active=
      true shows "Auto"; else kernel_sandbox_active=false shows "Auto — no
      sandbox" with a warning tooltip (Auto is on and DOES clear "ask" calls
      for every tool except the shell; a shell command now asks first unless
      it is read-only or fully covered by an operator allow rule — there is
      no kernel confining what a disguised command can reach either way).
      There is no more "Auto → Ask" degraded state: Auto never silently
      becomes Ask for lack of a kernel sandbox. Always present from this
      gateway.
    example: true
  god_mode_active:
    type: boolean
    description: >
      Whether the global God Mode override is ACTIVE in this process right
      now — the same value as GodModeStatus.enabled (the persisted
      sandbox.god_mode switch AND availability in this boot). When true
      every agent's tool policy is floored at "allow": no approval prompts,
      no per-turn kernel sandbox for spawned children, network egress open;
      operator deny command rules, audit logging, the prompt-injection
      guard and rate limiting stay on. The chat-header badge shows God Mode
      whenever this is true, whatever auto_approve_effective and
      kernel_sandbox_active say. Always present from this gateway.
    example: false
