title: BrowserInspectRequest
description: >
  Resolve the DOM element at a point in the live browser so the SPA can attach
  the element's text/HTML as context when a user annotates a spot. Coordinates
  are device (CSS) pixels of the WebRTC video frame. Best-effort — see ADR-039.
type: object
required:
  - session_id
  - agent_id
  - x
  - y
additionalProperties: false
properties:
  session_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >-
      A BROWSER session id, carried for context/correlation and logging only.
      Unlike BrowserAttachFrame's and BrowserWebRTCOfferFrame's session_id
      this is NOT a chat session id and it gains no workspace semantics under
      ADR-072: browser_inspect resolves the browsing context from agent_id
      ALONE, so an agent that belongs to more than one workspace is REFUSED
      here (ADR-072 FR-033) rather than borrowing whichever workspace the
      live panel happened to resolve.
  agent_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >-
      The agent to resolve the browsing context from. This is the ONLY input
      that selects a browser on this endpoint, and the browser it selects
      belongs to the agent's workspace, not to the agent (ADR-072 FR-001).
  x:
    type: number
    minimum: 0
    description: Device (CSS) x of the point to inspect.
  y:
    type: number
    minimum: 0
    description: Device (CSS) y of the point to inspect.
