title: PerformanceSettingsUpdate
description: >
  Request body for PUT /api/v1/performance. Partial update — only supplied
  fields are modified.
type: object
additionalProperties: false
properties:
  max_parallel_agents:
    type: integer
    minimum: 0
    description: >
      New value for the maximum concurrent task/subagent dispatch cap — the
      SINGLE authority for agent concurrency (concurrency-gate consolidation,
      2026-08-04). Set to 0 to restore the auto-detected default (sized from
      available memory, floored so a small box still functions). Any other
      value is honored EXACTLY as given — there is no ceiling; a value is
      never silently lowered. (Fixed 2026-08-04: this field previously
      declared `minimum: 2`, which contradicted this very description's "set
      to 0" instruction and would have rejected 0 under schema validation —
      corrected alongside the ceiling removal since both are the same field.)
    example: 6
  tools_on_demand:
    type: boolean
    description: >
      New tool-loading mode. true = load tools on demand (fewer tokens per
      message); false = all allowed tools sent every message (no loading step).
      Maps to tools.manifest.compressed. Omitted = unchanged (partial update).
    example: true
  goal_max_rounds:
    type: integer
    minimum: 1
    description: >
      New value for the SINGLE, GLOBAL goal-adjudication-round ceiling
      (GOAL-FR-024/FR-045, D-D/D-E) — governs task goals and chat goals
      identically; there is no per-goal override anywhere (GOAL-FR-046/
      US-8 retired). Rejected below 1. Omitted = unchanged (partial
      update).
    example: 20
  max_tool_iterations:
    type: integer
    minimum: 1
    maximum: 1000
    description: >
      New global tool-iteration limit (issue #904). Omitted = unchanged
      (partial update). When the new value is below some agents' own values,
      confirmed_lowering must list exactly those agents (see below), or the
      PUT is refused with 409.
    example: 200
  confirmed_lowering:
    type: array
    items:
      $ref: './MaxToolIterationsConfirmedAgent.yaml'
      x-go-type: MaxToolIterationsConfirmedAgent
    description: >
      The exact agent snapshot (id + old value) the admin saw in
      GET /performance/max-tool-iterations/preview and confirmed (spec D11,
      D16). Absent = empty. At write time the server recomputes the set of
      agents whose own value is above the new max_tool_iterations; the PUT
      succeeds only if that set equals this list compared as a set keyed by
      agent_id — order-independent (same ids, and for each id the same old
      value). Naming the same agent_id twice is malformed (400). Any
      difference — an extra agent, a missing agent, a changed old value, or
      this field absent while agents would be lowered — is drift: nothing is
      written and the PUT answers 409 MaxToolIterationsLoweringConflict.
