title: McpServerCreate
description: >
  Request body for POST /mcp-servers. Adds a new MCP server to the gateway config.
  For stdio transport, `command` is required. For sse/http transport, `url` is required.
  Exactly one of `command` or `url` must be supplied depending on the transport.
type: object
required:
  - name
  - transport
additionalProperties: false
properties:
  name:
    type: string
    description: Human-readable server name.
    example: "My MCP Server"
  command:
    type: string
    description: >
      Command to start the MCP server process. Required when transport is "stdio".
      Must be omitted or empty when transport is "sse" or "http".
    example: "npx @modelcontextprotocol/server-everything"
  url:
    type: string
    description: >
      Endpoint URL for remote MCP servers. Required when transport is "sse" or "http".
      Must be an https:// URL, or http:// for loopback addresses only
      (localhost, 127.x.x.x, or ::1). Any other http:// URL is rejected with 422
      by both the SPA and the backend. Must be omitted when transport is "stdio".
    example: "https://mcp.example.com/sse"
  args:
    type: array
    items:
      type: string
    description: >
      Command-line arguments to pass to the server process.
      Only applicable for stdio transport.
    example:
      - "--port"
      - "3000"
  transport:
    type: string
    enum:
      - stdio
      - sse
      - http
    description: >
      Transport mechanism to use for this MCP server. Use "stdio" for local
      process-based servers, "sse" or "http" for remote HTTP-based servers
      (both are handled identically by the gateway).
    example: "stdio"
  env:
    type: object
    additionalProperties:
      type: string
    description: >
      Environment variable overrides passed to the MCP server process.
      Only applicable for stdio transport. Each key-value pair is injected
      into the server process environment at startup.
    example:
      PATH: "/usr/local/bin:/usr/bin"
