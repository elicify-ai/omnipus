title: FileSearchHit
description: >
  One file-search hit (ADR-081; spec MV-14). A hit is ONE matching line — the
  first match position on that line is what `line` reports; two matches on one
  line are still one hit. A name/path match is one hit with match_kind "name"
  and no line.
type: object
additionalProperties: false
required:
  - path
  - match_kind
properties:
  path:
    type: string
    description: Workspace-relative path of the matched file or directory (see is_dir).
    example: "01-Areas/Finance/Q3 report.md"
  match_kind:
    type: string
    enum: [name, content]
    description: Whether the file matched by its name/path or by a content line.
  is_dir:
    type: boolean
    description: >
      True when this hit is a directory rather than a file — always true (never
      omitted) for a directory hit; always false for a content hit (directories
      are never content-scanned). Deliberately carries no `default` keyword
      despite always being false-when-absent in practice: a `default` makes
      openapi-typescript emit this as a non-optional field regardless of the
      `required` list, which would force every existing FileSearchHit fixture
      built before this field existed to add it just to keep compiling. Absent
      (or false) means "this is a file" — an existing consumer keeps its
      prior, file-only reading with no changes required.
  line:
    type: integer
    minimum: 1
    description: 1-based line number of the matching line (content hits only).
  excerpt:
    type: string
    maxLength: 2048
    description: >
      Bounded window of the matching line around the first match — at most 512
      BYTES (MV-6; maxLength here is a character-level outer guard), always
      valid UTF-8 (runes never split). Omitted when unavailable.
  context_before:
    type: array
    items:
      type: string
      maxLength: 2048
    maxItems: 5
    description: Up to context_lines lines preceding the match, in file order.
  context_after:
    type: array
    items:
      type: string
      maxLength: 2048
    maxItems: 5
    description: Up to context_lines lines following the match, in file order.
