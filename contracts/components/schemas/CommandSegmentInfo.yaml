title: CommandSegmentInfo
description: >
  ADR-092 D3/D4. One segment of the bash command awaiting approval, split with
  the same splitter and program resolution the bash tool itself uses
  (splitShellSegments / shellCommandHeadDetailed, through the tool's own D3
  evaluator), listed inside ToolApprovalRequiredFrame.segments. Every segment
  of the command is listed, in order, because one decision approves or denies
  the whole call; the server records no per-segment grant for a chained
  command. On Windows the whole command is one segment (FR-041). Documentation
  copy — the canonical, code-generating definition is the inline schema of the
  same name in asyncapi.yaml (referenced from that file's
  ToolApprovalRequiredFrame), per the same ADR-034-precedent reasons
  ToolApprovalRequiredFrame itself is not $ref'd from openapi.yaml.
type: object
required:
  - segment_index
  - command_text
additionalProperties: false
properties:
  segment_index:
    type: integer
    minimum: 0
    description: >
      Zero-based position of this segment among the full chained command's
      segments (splitShellSegments order).
    example: 0
  command_text:
    type: string
    minLength: 1
    description: This segment's raw command text (post-split, pre-resolution).
    example: "rm -rf /etc/foo"
  resolved_binary:
    type: string
    description: >
      Absolute path the segment's leading token resolved to against the
      child's effective PATH/env (D3 resolve-and-verify, FR-040). Absent
      when the head could not be resolved to a literal executable — a
      normalised head (shellCommandHeadDetailed's third return), a
      quote-blind over-split, a redirection-only segment, or brace
      expansion (FR-020/FR-040 blind spots). Such a segment always routes
      to ask and offers no D3 rule match, only this dialog.
    example: "/bin/rm"
  args:
    type: array
    items:
      type: string
    description: Argument tokens following the resolved binary, as split.
    example:
      - "-rf"
      - "/etc/foo"
  classification:
    type: string
    enum:
      - read
      - write
      - read_write
      - none
    description: >
      FR-038 filesystem-operation classification for the path this
      segment's D7 pre-flight escalation concerns. "none" when this segment
      carries no filesystem escalation (an ordinary D3/D4 command-rule
      prompt, or a D8-only network escalation).
    example: write
  path:
    type: string
    description: >
      The filesystem path FR-038's classifier extracted for this segment.
      Present iff classification is read/write/read_write.
    example: "/etc/foo"
  network_required:
    type: boolean
    description: >
      FR-043's network-need classifier verdict for this segment — true
      when approving widens the session's ConnectPortRules to
      DefaultConnectPorts (D8/FR-044). Independent of `classification`: a
      segment can need both a filesystem and a network grant at once (e.g.
      `curl -o /etc/foo https://x`).
    example: false
  suggested_prefix:
    type: string
    description: >
      The command prefix a scope="prefix" grant would cover: the program as
      written plus the leading argument words the grant matches (FR-026).
      Example: "npm run test" covers "npm run test --watch" but not "npm run
      testfoo". The recorded grant matches the program by its resolved path
      (resolved_binary), not by this text. Present iff prefix_available is
      true.
    example: "rm"
  prefix_available:
    type: boolean
    description: >
      True exactly when choosing Allow with scope "prefix" would record a
      prefix grant. The server derives this with the same function it records
      the grant with (tools.BashPrefixGrantFor), so the dialog never offers a
      scope the server would downgrade to exact. That requires a
      single-segment command whose program resolves, whose suggested prefix is
      narrower than the bare program, and which does not start with a wrapper
      (sudo, env, timeout, xargs, sh -c). Always false for every segment of a
      chained command (a && b, a | b: the grant is recorded as exact for the
      whole chain) and on Windows (FR-041). The dialog omits the "prefix"
      scope option when false. Always present.
    example: true
