type: object
description: >
  Response from GET /api/v1/integrations/providers. Lists every configurable
  search and voice-input integration provider (FR-12.1), plus which provider is
  currently active for each kind.
required:
  - search
  - voice
additionalProperties: false
properties:
  search:
    type: array
    description: Configurable web-search providers.
    items:
      $ref: ./IntegrationProvider.yaml
  voice:
    type: array
    description: Configurable voice-input transcription providers.
    items:
      $ref: ./IntegrationProvider.yaml
  active_search:
    type: string
    description: id of the currently active search provider, when one is selected.
    example: "brave"
  active_voice:
    type: string
    description: id of the currently active voice transcriber, when one is configured.
    example: "elevenlabs"
