title: BrowserVideoHealthFrame
description: >
  Server → client. A prompt, specific statement about the live-browser
  video feed, pushed the moment the gateway learns of a change rather than
  left for the SPA to infer.

  Why it exists (issue #674): the gateway knows within microseconds when
  the capture ingest connection dies — it gets a terminal PeerConnection
  state from Pion — but the SPA used to learn only by exhausting its
  first-frame timeout, and the panel therefore sat on "Connecting…" for
  tens of seconds before saying anything true. Shortening that timeout is
  the wrong fix: its value was derived after a live incident in which a
  healthy-but-slow cold start showed a red error and then connected fine.
  This frame fixes the SIGNAL instead, so the honesty deadline stays where
  it is and simply stops being the only source of news.

  Per ADR-061, WebRTC is the ONLY live-browser video path — there is no
  screencast fallback to degrade to — so a failure here must be shown, not
  papered over. `state` says what is happening; `attempt`/`max_attempts`
  make the automatic recovery legible instead of an unbounded spinner; and
  `state: unrecoverable` is a terminal, named error rather than a retry
  that never ends.

  Distinct from browser_webrtc_state, which describes whether this VIEWER
  may offer / is negotiated (an availability and signalling concern). This
  frame describes the upstream CAPTURE feeding every viewer, and is
  delivered to all of them.
type: object
required:
  - type
  - state
additionalProperties: false
properties:
  type:
    type: string
    const: browser_video_health
  session_id:
    type: string
    maxLength: 128
    description: >-
      Echoes the chat session_id this viewer attached with, for client-side
      correlation only.
  state:
    type: string
    enum:
      - transitioning
      - lost
      - recovering
      - recovered
      - unrecoverable
    description: >-
      lost = the capture's ingest connection died and automatic recovery is
      starting; the panel has no video right now. recovering = an automatic
      recapture has just been issued (see `attempt`). recovered = video is
      flowing again; any error the panel was showing for this cause should
      be cleared. unrecoverable = the bounded recovery budget is spent and
      nothing further will be retried automatically — a terminal, named
      failure the operator must see.
  attempt:
    type: integer
    minimum: 0
    maximum: 16
    description: >-
      Which automatic recapture attempt this is, 1-based. 0 when the state
      is not part of an attempt sequence (recovered).
  max_attempts:
    type: integer
    minimum: 0
    maximum: 16
    description: >-
      The attempt budget the gateway will spend before declaring the feed
      unrecoverable. Present so the panel can say "2 of 3" rather than
      implying an unbounded retry.
  detail:
    type: string
    maxLength: 512
    description: >-
      Optional free-text cause for the operator to read and act on, carried
      on `lost` and `unrecoverable`. Server-side the text is
      whitespace-collapsed, credential-redacted and length-bounded before it
      is sent, exactly as browser_webrtc_state.reason_detail is; URLs, CDP
      target ids, ports and timeouts are deliberately KEPT, because they are
      what makes the sentence actionable. Absent when the state alone fully
      explains the situation.
  capture_generation:
    type: integer
    minimum: 1
    maximum: 9007199254740991
    description: >-
      Server-issued target and CSS geometry generation, scoped to the capture
      session. Input names the generation actually displayed; stale generations
      must be rejected. Viewer answers bind the negotiated stream to this value.
  target_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >-
      CDP page target identity for this capture generation. The encoder must
      verify its selected Chrome tab maps to this identity before offering.
  rtp_timestamp:
    type: integer
    minimum: 0
    maximum: 4294967295
    description: >-
      Forwarded video boundary for capture_generation. Zero is valid. Viewers
      must observe presentation of this or a later frame from the matching
      stream before enabling input. Serial comparison uses 32-bit wrap rules;
      attach requires a current boundary to avoid half-range ambiguity.
  capture_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >-
      Non-secret opaque capture-session identity. Generation claims are valid
      only within this capture; replacement invalidates all previous claims.
  css_width:
    type: integer
    minimum: 1
    maximum: 16384
    description: >-
      Confirmed source CSS viewport width for capture_generation. Together
      with css_height and decoded video dimensions, identifies padding inside
      the encoded frame; pointer coordinates must exclude that padding.
  css_height:
    type: integer
    minimum: 1
    maximum: 16384
    description: Confirmed source CSS viewport height for capture_generation.
