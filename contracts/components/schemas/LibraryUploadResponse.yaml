title: LibraryUploadResponse
description: >
  Response from POST /api/v1/library/{workspace_id}/upload (HTTP 201).
  Returns the work-tree entries created by the upload — mirrors
  UploadFilesResponse's shape for the session-scoped uploader, but with
  LibraryEntry (path-keyed) items rather than UploadedFile.
type: object
additionalProperties: false
required:
  - entries
properties:
  entries:
    type: array
    description: Entries created by this upload, in the order the multipart parts were received.
    items:
      $ref: './LibraryEntry.yaml'
      # x-go-type pins the Go shape to the named `gen.LibraryEntry` so the
      # generated entries element is the SAME struct the rest of the package
      # (library.EntryFromInfo, the GET .../entries handler) already returns —
      # without it oapi-codegen v2.7.0 inlines this $ref as an anonymous
      # struct whose nested enum types get prefix-named from the parent's
      # path (LibraryUploadResponseEntriesViewKind, ...) and no longer match
      # the named types on the library side (LibraryEntryViewKind, ...).
      # The comment at openapi.yaml:374 (and RecordQueryResponse's own use of
      # x-go-type on its `problems` array) record the same fix.
      x-go-type: LibraryEntry
