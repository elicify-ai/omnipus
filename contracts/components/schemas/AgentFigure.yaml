type: string
nullable: false
enum:
  - Robot
  - Man
  - Woman
  - Omnipus
  - Monogram
description: >
  Body of the agent mark. Product words, exact case. Default Omnipus,
  applied by the server when omitted on create or missing in stored config.
  Not the art-file keys.
  JSON null is not an identity value. On PUT, omission retains the stored value;
  an explicit null or any other invalid supplied value rejects the whole update
  with HTTP 400 before any write.
  Monogram draws the uppercased first letter or digit of the agent's display
  name as the mark, in the agent's colour; a first character that is not a
  letter or digit renders ?. The other values draw figure art.
example: Omnipus
