title: DayBucket
description: >
  One aggregated day of a recurring task's occurrences, returned by
  `GET /api/v1/tasks/occurrences` when a query-tz day has more than 3
  occurrences in an overview-range (span > 8×24h) request (D6). Occurrence
  counting and `day_start_ms` are both evaluated in the query's `tz` (the
  viewer's zone) regardless of the rule's own `tz` — the day-boundary
  authority for bucketing is always the caller's zone.
type: object
required:
  - day_start_ms
  - day_end_ms
  - count
  - first_ms
  - interval_ms
additionalProperties: false
properties:
  day_start_ms:
    type: integer
    format: int64
    description: >
      Midnight of this day in the QUERY `tz` (the viewer's zone), Unix epoch
      milliseconds.
    example: 1784592000000
  day_end_ms:
    type: integer
    format: int64
    description: >
      Exclusive end of this bucket's window: the QUERY `tz`'s civil next
      midnight after `day_start_ms` (`civilDayNext` in
      `pkg/gateway/task_occurrences.go`), DST-aware (23h/25h on a transition
      day) — NOT a fixed `day_start_ms + 24h` offset. This is the SAME window
      boundary `populateBucketRunCounts` uses to tally `run_counts`, carried
      on the wire so the client never recomputes it (delta-review HIGH: a
      client-side fixed-24h recomputation diverges from this DST-aware value
      on transition days, disagreeing with `run_counts` and the drilled-in
      run list). The client MUST use this value verbatim as the exclusive
      upper bound when filtering/joining runs for this bucket.
    example: 1784678400000
  count:
    type: integer
    format: int32
    description: Number of occurrences of the task on this day.
    example: 48
  first_ms:
    type: integer
    format: int64
    description: >
      The first occurrence instant on this day, Unix epoch milliseconds.
      Consumed by the aggregated-chip tooltip ("first at 09:00").
    example: 1784620800000
  interval_ms:
    type: integer
    format: int64
    nullable: true
    description: >
      Fixed spacing between this day's occurrences in milliseconds, when the
      rule is regular (used to derive the client label "· every 30 min").
      null when the rule is irregular (BY*-modified) and spacing varies — the
      client falls back to a "· {count}×/day" label.
    example: 1800000
  run_counts:
    type: object
    description: >
      Additive per-day run-status tally (ADR-050 RD6 / task-run-history-spec
      §3.7), computed by scanning this day's actual TaskRun records — NOT by
      enumerating RRULE members. Read-only, purely additive (ADR-050 RD11 —
      no migration); absent until the occurrence-overlay handler populates
      it. The client's worst-wins glyph (failed > skipped > in_progress >
      done > scheduled) and tooltip breakdown read this object when present.
    required:
      - scheduled
      - in_progress
      - done
      - failed
      - skipped
    additionalProperties: false
    properties:
      scheduled:
        type: integer
        format: int32
        description: Occurrences on this day with no run yet (future, or "no record").
        example: 26
      in_progress:
        type: integer
        format: int32
        example: 0
      done:
        type: integer
        format: int32
        example: 12
      failed:
        type: integer
        format: int32
        example: 2
      skipped:
        type: integer
        format: int32
        description: >
          Occurrences on this day whose fire was skipped by the overlap guard
          (the previous occurrence was still in_progress).
        example: 0
