title: SessionStatePendingApproval
description: >
  One entry in the pending_approvals list of a SessionStateFrame.
  Describes a tool approval that is currently awaiting a decision.
type: object
required:
  - approval_id
  - session_id
  - tool_name
  - agent_id
  - expires_in_ms
  - tool_call_id
  - turn_id
  - args
  - offered_actions
  - allow_durations
additionalProperties: false
properties:
  approval_id:
    type: string
    minLength: 1
    description: Unique UUID for this approval request.
  session_id:
    type: string
    minLength: 1
    description: Session in which the approval is pending.
  workspace_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      Workspace the pending approval's session belongs to — same value and
      semantics as ToolApprovalRequiredFrame.workspace_id. Omitted when the
      session belongs to no workspace.
  tool_name:
    type: string
    minLength: 1
    maxLength: 128
    description: Name of the tool awaiting approval.
  agent_id:
    type: string
    minLength: 1
    description: Agent that invoked the tool.
  expires_in_ms:
    type: integer
    minimum: 0
    maximum: 86400000
    description: Relative expiry in milliseconds from receipt. Minimum 0; maximum 86400000 (24 hours).
  tool_call_id:
    type: string
    minLength: 1
    description: >
      L1-AMENDMENTS-20261013 §1.3 (#1263). Same value as
      ToolApprovalRequiredFrame.tool_call_id, so a reloaded card is complete
      and approvable.
  turn_id:
    type: string
    minLength: 1
    description: >
      Same value as ToolApprovalRequiredFrame.turn_id.
  args:
    type: object
    additionalProperties: true
    description: >
      Same value as ToolApprovalRequiredFrame.args — an object, never null.
      The snapshot reaches exactly the
      connections the live frame reaches (same audience rule).
  segments:
    type: array
    items:
      $ref: './CommandSegmentInfo.yaml'
    description: Same value and rules as ToolApprovalRequiredFrame.segments.
  root_session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: >
      L1-AMENDMENTS-20261013 §1.3 (#1263). Server-derived root of the acting
      session's chain (ParentSessionID walk, 16 hops, cycle guard): the chat
      whose session id equals this value renders the inline approval.
      Omitted when equal to session_id.
  acting_agent_name:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      L1-AMENDMENTS-20261013 §1.3 (#1263; spec K7). Display name of the
      agent that made the call, named in the card header.
  origin_label:
    type: string
    minLength: 1
    maxLength: 200
    description: >
      Spec K7, §6.18. Server-derived turn origin, e.g. "while answering
      <person> on <connection>", "for group <name>", "asked by <Agent>".
      Omitted for a plain web turn.
  room_ref:
    $ref: './RoomRef.yaml'
    description: >
      Spec K7, FR-251. Present on a room's pre-admission approval card
      (request id = delivery id).
  offered_actions:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: './ToolApprovalOfferedAction.yaml'
    description: >
      Skills & Tools spec C-24, C-26. The answers this card offers,
      computed by the server when it raises the card; the server accepts
      only these (any other action gets 409). Examples: ordinary tool card
      [allow_once, allow_for, deny, cancel]; exact-action tool
      (environment_setup, request_mount, send_email, browser_evaluate,
      set_config) [allow_once, deny, cancel]; always-ask tool
      [allow_once, deny, cancel]; skill permission card [allow_once,
      allow_for, deny]; skill trust card [approve_version, deny]; skill
      combined card [approve_version, approve_version_allow_for, deny];
      unverified install card [allow_once, deny]. cancel is listed whenever
      the card shows Cancel; it stores nothing.
  allow_durations:
    type: array
    uniqueItems: true
    items:
      $ref: './ApprovalAllowDuration.yaml'
    description: >
      C-26. The time choices for allow_for / approve_version_allow_for:
      [1h, 3h, 1d] whenever one of those actions is in offered_actions,
      empty otherwise. Server-computed.
  skill:
    $ref: './ToolApprovalSkill.yaml'
    description: >
      C-9. The skill this card is about; present when the call loads a
      skill or installs one (install_skill, with the staged revision).
