title: SessionStatePendingApproval
description: >
  One entry in the pending_approvals list of a SessionStateFrame.
  Describes a tool approval that is currently awaiting a decision.
type: object
required:
  - approval_id
  - session_id
  - tool_name
  - agent_id
  - expires_in_ms
  - tool_call_id
  - turn_id
  - args
additionalProperties: false
properties:
  approval_id:
    type: string
    minLength: 1
    description: Unique UUID for this approval request.
  session_id:
    type: string
    minLength: 1
    description: Session in which the approval is pending.
  workspace_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      Workspace the pending approval's session belongs to — same value and
      semantics as ToolApprovalRequiredFrame.workspace_id. Omitted when the
      session belongs to no workspace.
  tool_name:
    type: string
    minLength: 1
    maxLength: 128
    description: Name of the tool awaiting approval.
  agent_id:
    type: string
    minLength: 1
    description: Agent that invoked the tool.
  expires_in_ms:
    type: integer
    minimum: 0
    maximum: 86400000
    description: Relative expiry in milliseconds from receipt. Minimum 0; maximum 86400000 (24 hours).
  tool_call_id:
    type: string
    minLength: 1
    description: >
      L1-AMENDMENTS-20261013 §1.3 (#1263). Same value as
      ToolApprovalRequiredFrame.tool_call_id, so a reloaded card is complete
      and approvable.
  turn_id:
    type: string
    minLength: 1
    description: >
      Same value as ToolApprovalRequiredFrame.turn_id.
  args:
    type: object
    additionalProperties: true
    description: >
      Same value as ToolApprovalRequiredFrame.args — an object, never null.
      The snapshot reaches exactly the
      connections the live frame reaches (same audience rule).
  segments:
    type: array
    items:
      $ref: './CommandSegmentInfo.yaml'
    description: Same value and rules as ToolApprovalRequiredFrame.segments.
  root_session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: >
      L1-AMENDMENTS-20261013 §1.3 (#1263). Server-derived root of the acting
      session's chain (ParentSessionID walk, 16 hops, cycle guard): the chat
      whose session id equals this value renders the inline approval.
      Omitted when equal to session_id.
  acting_agent_name:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      L1-AMENDMENTS-20261013 §1.3 (#1263; spec K7). Display name of the
      agent that made the call, named in the card header.
  origin_label:
    type: string
    minLength: 1
    maxLength: 200
    description: >
      Spec K7, §6.18. Server-derived turn origin, e.g. "while answering
      <person> on <connection>", "for group <name>", "asked by <Agent>".
      Omitted for a plain web turn.
  room_ref:
    $ref: './RoomRef.yaml'
    description: >
      Spec K7, FR-251. Present on a room's pre-admission approval card
      (request id = delivery id).
