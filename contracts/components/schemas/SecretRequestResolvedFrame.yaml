title: SecretRequestResolvedFrame
description: >
  Server → client (spec omnipus-system-agent K3; FR-074). Emitted once to
  every connected client when a secret request leaves the pending state.
  Value-free. THIS FILE EXISTS for the Constraint #8 5-step process and the
  pkg/gateway/inboundschemas/ sync — the GENERATING copy is the inline
  schema in contracts/asyncapi.yaml. Keep both copies in sync by hand.
  Landing 1, WU-4 produces it.
type: object
required:
  - type
  - request_id
  - state
additionalProperties: false
properties:
  type:
    type: string
    const: secret_request_resolved
  request_id:
    type: string
    minLength: 1
    maxLength: 128
    description: The request_id from the secret_request frame this resolves.
  state:
    type: string
    enum:
      - submitted
      - cancelled
      - stopped
      - interrupted
      - refused
    description: The terminal state the request reached.
  session_id:
    type: string
    minLength: 1
    maxLength: 255
    description: The acting session the request belonged to.
  root_session_id:
    type: string
    minLength: 1
    maxLength: 128
    description: >
      Root of the acting session's chain, so the root chat's card clears
      without a lookup. Omitted when equal to session_id.
