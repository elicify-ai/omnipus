title: RecordMoney
description: >
  A money value: amount, ISO-4217 currency and declared scale carried as ONE
  value (ADR-068 D3, FR-012). A value missing currency is REJECTED — two loose
  fields that nothing keeps together is the failure this type closes.

  The amount is an INTEGER STRING and never a JSON number. `type: number` in
  this contract generates a Go float32 (float64 only with `format: double`)
  and a JavaScript number, and binary floating point cannot represent 0.1
  exactly — so a total that must be exact
  would drift by an amount nobody can see until it is reconciled against a
  bank. FR-013 requires exact decimal arithmetic and FR-020b forbids a binary
  float ANYWHERE in the storage or retrieval path; a string is the only
  representation that survives both the wire and the two generated languages
  without a lossy hop.

  THE AMOUNT IS ALREADY IN MINOR UNITS (ADR-068 O-2's resolution). It carries
  no decimal point at all — `pattern` rejects one — and `scale` says where the
  reader must put it: value = amount x 10^-scale, exactly, with no rounding.
  {amount "1000", scale 2} is 10.00 USD; {amount "10", scale 0} is 10 USD; the
  two are distinguishable because `scale` differs, not because the amount is
  spelled differently. There is no "fractional digit count" rule to satisfy —
  a decimal amount such as "10.00" is schema-INVALID, not a scale mismatch.

  Corrected 2026-08-25, second pass: this paragraph previously required the
  fractional digits of `amount` to equal `scale`, illustrated it with the now
  ILLEGAL "10.00", and stated the conversion INVERTED (minor units = amount x
  10^scale). Read together with the corrected `amount` pattern below, the one
  artifact said two different things about the same three fields — the exact
  defect the minor-units fix was filed to end.

  Summing money is exact WITHIN one currency. A sum ACROSS currencies is
  REFUSED with the currencies present listed (FR-014) — see
  RecordAggregateResult.currencies_present. There is no FX conversion and no
  rate table in this ADR.
type: object
additionalProperties: false
required:
  - amount
  - currency
  - scale
properties:
  amount:
    type: string
    minLength: 1
    maxLength: 40
    pattern: '^-?(0|[1-9][0-9]*)$'
    description: >
      The amount as an INTEGER COUNT OF MINOR UNITS, rendered as a string.
      Never a JSON number, and never a decimal fraction: with `scale: 2`,
      "34998" means 349.98. Optional leading minus, no decimal point, no
      thousands separators, no exponent, no currency symbol.


      A string rather than a JSON number because a JSON number is an IEEE-754
      double in most parsers, and the whole point of this type is that no
      float ever touches an amount (ADR-068 D3, FR-020b).


      Corrected 2026-08-25: this field previously specified a decimal string
      whose fractional digits had to equal `scale` (example "1250000.00"),
      which contradicted ADR-068 O-2 and the Go parser. The same three-field
      object therefore meant 349.98 on disk and 3.4998 on the wire, with
      nothing to detect the disagreement.
    example: "34998"
  currency:
    type: string
    pattern: '^[A-Z]{3}$'
    description: >
      ISO-4217 alphabetic currency code, upper case. Mandatory: a money value
      without a currency is rejected (FR-012), because an amount alone cannot
      be compared, sorted or summed against anything.
    example: "USD"
  scale:
    type: integer
    minimum: 0
    maximum: 12
    description: >
      How many of `amount`'s trailing digits are FRACTIONAL — the power of ten
      that turns minor units back into the figure a person reads: value =
      amount x 10^-scale. 2 for most currencies, 0 for JPY, 3 for KWD, and
      higher where an operator's convention needs it. Declared rather than
      inferred from the currency, because the vault's convention — not the
      product — decides how precisely it records a figure (D0).


      It is NOT a constraint on how `amount` is spelled: `amount` never
      contains a decimal point, so scale cannot be checked against it and a
      "fractional digit count mismatch" is not a finding this type can raise.
    example: 2
