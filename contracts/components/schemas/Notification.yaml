title: Notification
description: >
  A user-facing notification (#264) surfaced in the header notification center.
  Raised on scheduled-run failures and on knowledge-base drift repair
  (ADR-067 FR-038a); the type is open for future sources. Coalesced per source
  where noted (e.g. one item per schedule, updated).
type: object
required:
  - id
  - type
  - title
  - severity
  - read
  - created_at_ms
additionalProperties: false
properties:
  id:
    type: string
  type:
    type: string
    enum:
      - schedule_failed
      - knowledge_drift
    description: >
      The event class. Extensible; consumers must tolerate unknown values.


      "knowledge_drift" (ADR-067 FR-038a) means the automatic drift check found
      that a knowledge base's search index no longer matched the folder on disk,
      and the index is being rebuilt from that folder. It is raised ONLY when
      something was actually wrong — a healthy check produces no notification —
      and it never reports a change to the operator's own files.
  title:
    type: string
    minLength: 1
  body:
    type: string
    description: Optional detail (e.g. the failure reason).
  severity:
    type: string
    enum:
      - info
      - warning
      - error
  read:
    type: boolean
    description: Per-user read state.
  created_at_ms:
    type: integer
    format: int64
  updated_at_ms:
    type: integer
    format: int64
    description: Set when a coalesced notification is updated (e.g. repeated schedule failure).
  schedule_id:
    type: string
    description: Click-through target when the notification concerns a schedule.
  session_id:
    type: string
    description: Click-through target when the notification concerns a run's session.
  agent_id:
    type: string
    description: The agent the notification concerns.
