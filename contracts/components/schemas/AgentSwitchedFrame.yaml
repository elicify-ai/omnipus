title: AgentSwitchedFrame
description: >
  Server → client. Emitted when the active agent for a session changes due to
  a successful switch_agent tool call (ADR-071 D4 merged the retired hand_off
  and return_to_default tools into this one). The SPA updates the
  activeAgentId in the session store.
type: object
required:
  - type
  - session_id
additionalProperties: false
properties:
  type:
    type: string
    const: agent_switched
  session_id:
    type: string
    minLength: 1
    description: Session whose active agent changed.
  agent_id:
    type: string
    description: >
      New active agent ID. Empty string means "returned to default agent"
      (e.g., after switch_agent(target: "default")).
  message:
    type: string
    description: >
      Display name of the new agent. Included by the backend so the SPA can
      show the agent name without an extra API round-trip. Mirrors the
      agent_name field from the TS interface for display-only purposes.

  seq:
    type: integer
    format: int64
    minimum: 1
    description: >-
      Per-session sequence number of this frame (#823 catch-up redesign). Strictly
      increasing and gap-free within the session, assigned by the gateway's per-session
      hub as the single chokepoint through which every session-scoped frame is published.
      Optional: absent on an unsequenced copy of this frame (for example a broadcast
      delivered to a tab that is not bound to this session) — the client only advances its
      per-session cursor for frames that carry seq. The client stores the highest seq it
      has applied per session and sends it back as since_seq on attach_session; frames at
      or below that cursor are ignored, which makes re-delivery idempotent.
