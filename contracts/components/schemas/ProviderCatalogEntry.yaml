type: object
description: >
  A single entry in the provider catalog — the curated, build-time-embedded
  registry of ~30 user-facing LLM provider variants. Each entry represents one
  billable endpoint (company × plan × region), not a raw protocol id.
  Delivered as a build-time go:embed artifact + a generated TypeScript catalog;
  never served from a live HTTP endpoint (FR-016, ADR-031 §6 G-2).
  The type is contract-defined (Constraint #8) so the same generated struct is
  used in the Go catalog SoT and the generated TS consumer. No secret fields.
required:
  - id
  - company
  - plan
  - wire
  - endpointHint
  - logoSlug
  - label
  - subtitle
additionalProperties: false
properties:
  id:
    type: string
    minLength: 1
    description: >
      Canonical protocol identifier — matches a knownProtocols entry and a
      member of the ProbeProviderRequest id enum. Used as the primary key for
      probe, configure, and drift-guard lookups.
    example: "z-ai-coding"
  company:
    type: string
    minLength: 1
    description: >
      Human-readable company/brand name. Used as the group header in the
      configured-providers list. Multiple catalog entries share the same
      company when one vendor exposes multiple endpoints (plan × region).
    example: "Zhipu / GLM"
  plan:
    type: string
    enum:
      - standard-api
      - coding-plan
    description: >
      Billing plan for this variant. "standard-api" = pay-as-you-go per-token
      API (formerly "api" in the onboarding PLAN_LABELS). "coding-plan" =
      subscription-based coding plan (unchanged label). The legacy "anthropic"
      plan value is NOT in this enum — it was a mislabeled wire protocol;
      the wire field carries that information instead (ADR-031 FR-006).
    example: "standard-api"
  region:
    type: string
    enum:
      - intl
      - china
      - us
    description: >
      Deployment region, when the provider has a regional split. Omitted for
      providers with a single global endpoint (e.g. OpenAI, DeepSeek).
    example: "intl"
  wire:
    type: string
    enum:
      - openai-compatible
      - anthropic
    description: >
      Wire protocol used to call this endpoint. Derived, not authored:
      "anthropic" when id matches /-anthropic$/ or id ∈ {anthropic,
      anthropic-messages, bedrock}; otherwise "openai-compatible" (ADR-031
      FR-005). Shown as a badge in the UI — not a plan option.
    example: "openai-compatible"
  endpointHint:
    type: string
    minLength: 1
    description: >
      Curated display host for this endpoint (e.g. "api.z.ai/api/coding/paas/v4").
      Hand-authored, NOT derived from GetDefaultAPIBase (which returns full URLs
      the display doesn't need). For deployment-configured providers, this is a
      placeholder template (e.g. "<resource>.openai.azure.com"). Shown in the
      subtitle and the variant config Sheet (ADR-031 R2-01/R2-03).
    example: "api.z.ai/api/coding/paas/v4"
  logoSlug:
    type: string
    minLength: 1
    description: >
      Asset key for the <BrandIcon> component. Maps to a vendored SVG in
      src/assets/brand-logos/p_<logoSlug>.svg. When no SVG exists for the slug,
      BrandIcon falls back to a lettermark chip (FR-011, FR-013). Companies with
      no vendored SVG use a short id (e.g. "cerebras", "nvidia") which triggers
      the lettermark path.
    example: "zhipu"
  label:
    type: string
    minLength: 1
    description: >
      Full human-readable label for this variant in the form
      "<Brand> — <Access Type> [(Region)]". Carried on the wire so onboarding
      and Settings render identical text from one catalog source (ADR-031 FR-007,
      G-3=C safety guarantee). Example: "Zhipu / GLM — Coding Plan (International)".
    example: "Zhipu / GLM — Coding Plan (International)"
  subtitle:
    type: string
    minLength: 1
    description: >
      Short billing-model description and endpoint hint. Shown below the label
      in the picker and Sheet. Format: "<billing model> · <endpointHint>".
      Example: "Subscription (Coding Plan) · api.z.ai/api/coding/paas/v4".
    example: "Subscription (Coding Plan) · api.z.ai/api/coding/paas/v4"
  aliases:
    type: array
    items:
      type: string
    description: >
      Additional protocol ids that map to this catalog entry. Derived from the
      GetDefaultAPIBase switch: ids grouped in the same case share a base URL
      and are aliases. The aliases list excludes the canonical id itself.
      Used by the migration resolver to normalize stored alias ids to the
      canonical catalog entry (ADR-031 §7 G-4, FR-012, US-8).
    example:
      - "glm-coding"
      - "zhipu-coding"
