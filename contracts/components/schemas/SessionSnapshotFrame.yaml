title: SessionSnapshotFrame
description: >
  Server → client. Answers attach_session when the position the client asked for
  (since_seq) can no longer be served as individual events. The client MUST
  replace its state for this session rather than merging: the gateway follows
  this frame with a full replay of the session (replay_message, tool_call_start,
  tool_call_result, subagent_start, subagent_end, media), terminated by a done
  frame whose seq is this frame's seq. Sending a snapshot is always safe — it
  costs more bytes than an incremental catch-up but never drops an event, which
  is why the gateway prefers it over guessing whenever it cannot prove the
  requested range is intact. Sent for a first load as well (no cursor at all),
  where it is the ordinary full-replay path.
type: object
required:
  - type
  - session_id
  - seq
additionalProperties: false
properties:
  type:
    type: string
    const: session_snapshot
  session_id:
    type: string
    minLength: 1
    maxLength: 128
    description: Session the client must rebuild state for.
  seq:
    type: integer
    format: int64
    minimum: 0
    description: >
      The session's current high-water sequence number. Once the full-state
      replay that follows this frame has been applied, the client's cursor for
      this session is exactly this value, and subsequent live frames continue
      from seq + 1.
  reason:
    type: string
    enum:
      - cursor_ahead
      - retention_exceeded
      - unknown_position
    description: >
      Why a snapshot was sent instead of an incremental catch-up.
      cursor_ahead — the client's since_seq is greater than any sequence number
      the gateway has emitted for this session (for example after a gateway
      restart, whose counter restarts); the client's position cannot be trusted.
      retention_exceeded — the gateway retains only the most recent sequence
      numbers for this session, so the range just after since_seq is already
      gone and serving it would leave a hole.
      unknown_position — the gateway has no emitted-frame record for this
      session at all, so it cannot confirm that since_seq + 1 exists.