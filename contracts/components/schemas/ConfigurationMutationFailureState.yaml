type: object
description: Mutation failure state. Revision is omitted when no live resource remains to read or revise.
additionalProperties: false
required: [persistence_status, activation_status, changed_fields, error_stage, message]
properties:
  revision:
    $ref: './ConfigurationRevision.yaml'
  persistence_status:
    $ref: './ConfigurationPersistenceStatus.yaml'
  activation_status:
    $ref: './ConfigurationActivationStatus.yaml'
  changed_fields:
    type: array
    items:
      type: string
  error_stage:
    type: string
  message:
    type: string
