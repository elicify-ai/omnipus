title: RateLimitsResponse
description: >
  Response from GET /api/v1/security/rate-limits.
  Returns the current per-agent sliding-window rate-limit configuration.
  Per ADR-053 D12 the SEC-26 USD cost cap was retired; the app-level spend
  brake (token budget) is set via /api/v1/settings/token-budget.
type: object
required:
  - enabled
  - max_agent_llm_calls_per_hour
  - max_agent_tool_calls_per_minute
properties:
  enabled:
    type: boolean
    example: true
  max_agent_llm_calls_per_hour:
    type: integer
    format: int64
    minimum: 0
    description: Maximum LLM calls per hour across all agents. 0 means unlimited.
    example: 100
  max_agent_tool_calls_per_minute:
    type: integer
    format: int64
    minimum: 0
    description: Maximum tool calls per minute across all agents. 0 means unlimited.
    example: 60
