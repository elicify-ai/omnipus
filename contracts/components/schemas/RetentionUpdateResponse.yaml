title: RetentionUpdateResponse
description: >
  Response from PUT /api/v1/security/retention. Updated retention configuration.
type: object
required:
  - saved
  - requires_restart
  - session_days
  - disabled
properties:
  saved:
    type: boolean
    example: true
  requires_restart:
    type: boolean
    example: false
  session_days:
    type: integer
    minimum: 0
    description: >
      Applied session retention in days. 0 means use the system default (90 days).
    example: 30
  disabled:
    type: boolean
    description: When true, retention sweeps are disabled and session logs are kept forever.
    example: false
