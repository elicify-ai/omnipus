title: SecretRequestState
description: >
  Value-free state of one secret request (spec omnipus-system-agent K5;
  FR-079). Returned by GET /api/v1/secret-requests/{id}, by a successful
  submit, and as the body of a 409 (request not pending) so the client
  learns the true current state. Absence is never read as success.
type: object
required:
  - request_id
  - state
  - updated_at
additionalProperties: false
properties:
  request_id:
    type: string
    minLength: 1
    maxLength: 128
  state:
    type: string
    enum:
      - pending
      - submitted
      - cancelled
      - stopped
      - interrupted
      - refused
  reference_names:
    type: array
    maxItems: 8
    items:
      type: string
      minLength: 1
      maxLength: 256
    description: >
      Reference names the values were stored under. Present only when state
      is `submitted`.
  updated_at:
    type: string
    format: date-time
