title: LibraryMoveConflictError
description: >
  Typed 409 body shared by POST /library/move, POST
  /library/{workspace_id}/rename, and DELETE /library/{workspace_id}/entries
  (FR-VA-031/FR-VA-032/FR-VA-036). All five codes carry error and code;
  each code's additional fields are:
    - already_exists / is_mount_root: none (move/rename).
    - view_tracked_transfer_refused: tracked_paths (move/rename).
    - move_incomplete: paths and pending_move_id (move/rename);
      retryable via POST /library/{workspace_id}/retry-move.
    - trash_incomplete: paths (delete); retry by trashing again, with no
      pending_move_id.
type: object
additionalProperties: false
required: [error, code]
properties:
  error: {type: string, minLength: 1, description: "Human-readable message, safe to display."}
  code:
    type: string
    enum: [already_exists, is_mount_root, view_tracked_transfer_refused, move_incomplete, trash_incomplete]
  tracked_paths: {type: array, items: {type: string}, description: "Only for view_tracked_transfer_refused."}
  paths: {type: array, items: {type: string, minLength: 1}, description: "Only for move_incomplete or trash_incomplete."}
  pending_move_id: {type: string, description: "Only for move_incomplete; pass to retry-move."}
