title: VaultFindSort
description: >
  One sort key (spec 4.1.2, ruling R-E). Computed in Go by the comparator, never
  by an emitted `ORDER BY` — SQLite's collations fold two of the fourteen case
  pairs the spec requires and none of the twelve non-ASCII ones, so a sort
  delegated to the store would order differently from the equality that grouped
  the same values.
type: object
additionalProperties: false
required:
  - property
properties:
  property:
    type: string
    minLength: 1
    description: >
      The declared property to sort on. Unknown → refusal listing the declared
      names (FR-024).
    example: "arr"
  direction:
    type: string
    enum: [asc, desc, ascending, descending]
    x-enum-varnames:
      - VaultFindSortDirectionAsc
      - VaultFindSortDirectionDesc
      - VaultFindSortDirectionAscending
      - VaultFindSortDirectionDescending
    description: >
      `ascending` / `descending` are exact aliases of `asc` / `desc` (UAT
      2026-09-13, D-10): a saved view written with the long spelling was
      accepted at write time and then refused at every query, so the two
      parsers now share one vocabulary. Anything else is still refused by name.


      Rows with NO value for the sorted property sort LAST in BOTH directions
      (UAT 2026-09-13, D-33), and the response's QUERY echo says so.


      Omitted means `asc`. Stated in prose rather than as a JSON Schema
      `default:` deliberately: openapi-typescript promotes a defaulted property
      to REQUIRED while oapi-codegen still emits an optional field, so a
      `default:` here would split the two generated languages on one field.
    example: "desc"
