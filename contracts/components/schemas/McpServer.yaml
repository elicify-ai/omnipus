title: McpServer
description: >
  An MCP server entry as returned by GET /mcp-servers and POST /mcp-servers.
type: object
required:
  - id
  - name
  - transport
  - status
  - tool_count
properties:
  id:
    type: string
    description: Unique MCP server identifier.
    example: "my-mcp-server"
  name:
    type: string
    description: Human-readable server name.
    example: "My MCP Server"
  transport:
    type: string
    enum:
      - stdio
      - sse
      - http
    description: >
      Transport mechanism used by this MCP server. "stdio" for local
      process-based servers, "sse" or "http" for remote HTTP-based servers.
    example: "stdio"
  status:
    type: string
    enum:
      - connected
      - disconnected
      - error
    description: Current connection status of the MCP server.
    example: "connected"
  tool_count:
    type: integer
    minimum: 0
    description: Number of tools exposed by this server.
    example: 5
  tools:
    type: array
    items:
      type: string
    description: >
      List of tool names exposed by this server. Absent when tool_count is 0
      or when the server has not yet enumerated its tools.
    example:
      - "search"
      - "fetch"
  enabled:
    type: boolean
    description: >
      Whether this server is enabled in config. A disabled server is not
      connected at agent-loop startup and exposes no tools.
    example: true
  command:
    type: string
    description: Command to start the server (stdio). For edit pre-fill.
    example: "npx @modelcontextprotocol/server-everything"
  url:
    type: string
    description: Endpoint URL (sse/http). For edit pre-fill.
    example: "https://mcp.example.com/sse"
  args:
    type: array
    items:
      type: string
    description: Command-line args (stdio). For edit pre-fill.
  env_file:
    type: string
    description: Env-file path (stdio). For edit pre-fill.
    example: "/etc/omnipus/mcp.env"
  env_keys:
    type: array
    items:
      type: string
    description: >
      Names (keys only) of configured env-var overrides — VALUES ARE NEVER
      RETURNED (they may be secrets). The edit UI shows these as "set" and
      re-entry replaces them.
    example:
      - "API_KEY"
  header_names:
    type: array
    items:
      type: string
    description: >
      Names (keys only) of configured HTTP headers (sse/http) — VALUES ARE NEVER
      RETURNED (e.g. Authorization). The edit UI shows these as "set"; re-entry replaces.
    example:
      - "Authorization"
