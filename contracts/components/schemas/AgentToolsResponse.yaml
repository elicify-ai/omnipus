title: AgentToolsResponse
description: >
  Response from GET /api/v1/agents/{id}/tools and PUT /api/v1/agents/{id}/tools.
  Returns the agent's tool policy configuration plus the effective per-tool policy list.
type: object
required:
  - revision
  - override_names
  - config
  - tools
additionalProperties: false
properties:
  revision:
    $ref: './ConfigurationRevision.yaml'
  persistence_status:
    $ref: './ConfigurationPersistenceStatus.yaml'
  activation_status:
    $ref: './ConfigurationActivationStatus.yaml'
  changed_fields:
    type: array
    items:
      type: string
  error_stage:
    type: string
  message:
    type: string
  override_names:
    type: array
    uniqueItems: true
    items:
      type: string
  config:
    $ref: AgentToolsCfg.yaml
  tools:
    type: array
    description: Per-tool effective policy entries.
    items:
      $ref: AgentToolEntry.yaml
  agent_type:
    type: string
    description: >
      Agent classification. Built-in roster (Mia / Jim / Ava / Admin) returns
      "core" with locked=true; legacy operator-supplied "system" entries
      remain for backward compatibility. User-created chat colleagues are
      "Main", native workers are "Subagent", and external-CLI workers are
      "subagent_3p" (distinguished from Subagent by executor.kind=external-cli).
      Informs the UI whether policy editing is allowed.
    enum:
      - core
      - system
      - Main
      - Subagent
      - subagent_3p
    example: Main
