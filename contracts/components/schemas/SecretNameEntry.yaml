title: SecretNameEntry
description: >
  One stored secret version as listed by GET /api/v1/secrets (spec
  omnipus-system-agent K6; FR-073, FR-086, FR-241). Names and metadata
  only — never a value.
type: object
required:
  - reference
  - kind
  - version
  - recipient
  - consumers
  - state
additionalProperties: false
properties:
  reference:
    type: string
    minLength: 1
    maxLength: 256
    description: Reference name of this version.
  kind:
    type: string
    description: >
      Recorded recipient kind. `unbound` is a stored value with no recipient
      recorded (stored via Settings or boot configuration); it never carries
      `owner` or `available_in_channel_turns`, its version is 1, and where it
      is used is stated only by `consumers`. Not the retired unbound-channel
      routing mode.
    enum:
      - provider_key
      - mcp_env
      - channel_credential
      - mailbox_password
      - agent_private
      - unbound
  version:
    type: integer
    format: int64
    minimum: 1
  recipient:
    $ref: './SecretRecipientDisplay.yaml'
  owner:
    $ref: './AgentAddress.yaml'
    description: The owning (workspace, agent) pair — agent_private kind only.
  consumers:
    type: array
    maxItems: 64
    items:
      type: string
      minLength: 1
      maxLength: 200
    description: What uses this version (display labels). Never null.
  state:
    type: string
    enum:
      - stored
      - selected
      - superseded
  available_in_channel_turns:
    type: boolean
    description: >
      agent_private kind only (FR-241): whether the variable is injected
      into turns triggered by a channel person. Default false.
