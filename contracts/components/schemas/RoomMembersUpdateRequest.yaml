title: RoomMembersUpdateRequest
description: >
  Body of PATCH /api/v1/rooms/{id}/members (spec omnipus-system-agent K24;
  FR-204, FR-207). The team room accepts only mute and unmute; removing a
  member below two agents follows the two-agent rule (FR-204).
type: object
required:
  - action
  - agent_ids
additionalProperties: false
properties:
  action:
    type: string
    enum:
      - add
      - remove
      - mute
      - unmute
  agent_ids:
    type: array
    minItems: 1
    maxItems: 256
    items:
      type: string
      minLength: 1
      maxLength: 128
