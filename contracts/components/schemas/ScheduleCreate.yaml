title: ScheduleCreate
description: >
  Request body to create a schedule (#264). owner_agent_id must reference an
  existing, non-worker-restricted agent (single-user model — no per-caller
  ownership check). Omitted optional fields take their documented defaults.
type: object
required:
  - name
  - owner_agent_id
  - trigger
  - message
additionalProperties: false
properties:
  name:
    type: string
    minLength: 1
  owner_agent_id:
    type: string
    minLength: 1
  trigger:
    $ref: ./ScheduleTrigger.yaml
  message:
    type: string
    minLength: 1
  run_isolated:
    type: boolean
    default: false
    description: >
      Optional. True forces every run of this work into a fresh independent
      chat, for either role (session-core FR-017). Default false: a task whose
      assignee owns an eligible main runs as a fresh child of that main; a
      worker runs isolated once or continues its own chat when recurring. There
      is no other session-mode choice.
    example: false
  session_mode:
    type: string
    enum:
      - isolated
      - continue
      - main
    description: Default isolated.
  timeout_seconds:
    type: integer
    minimum: 0
    description: Per-run deadline; default 0 = use the global default.
  enabled:
    type: boolean
    description: Default true.