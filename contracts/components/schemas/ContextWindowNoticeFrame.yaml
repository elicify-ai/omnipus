title: ContextWindowNoticeFrame
description: >
  Server → client classified context-window diagnostic (ADR-066 MAJ-CW-009).
  Live and replay use the same frame with the original transcript entry_id
  and timestamp. Retained independently of the browser's Verbose chat
  preference; hidden notices still advance the session cursor.
type: object
required:
  - type
  - session_id
  - turn_id
  - agent_id
  - entry_id
  - timestamp
  - notice
additionalProperties: false
properties:
  type:
    type: string
    const: context_window_notice
  session_id:
    type: string
    minLength: 1
    maxLength: 128
  turn_id:
    type: string
    minLength: 1
    maxLength: 128
  agent_id:
    type: string
    minLength: 1
    maxLength: 128
  entry_id:
    type: string
    minLength: 1
    maxLength: 128
  timestamp:
    type: string
    format: date-time
  notice:
    $ref: './ContextWindowNotice.yaml'
  seq:
    type: integer
    format: int64
    minimum: 1
    description: >-
      Per-session sequence number of this frame (#823 catch-up redesign). Strictly
      increasing and gap-free within the session, assigned by the gateway's per-session
      hub as the single chokepoint through which every session-scoped frame is published.
      Optional: absent on an unsequenced copy of this frame (for example a broadcast
      delivered to a tab that is not bound to this session) — the client only advances its
      per-session cursor for frames that carry seq. The client stores the highest seq it
      has applied per session and sends it back as since_seq on attach_session; frames at
      or below that cursor are ignored, which makes re-delivery idempotent.
