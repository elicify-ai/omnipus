title: RetryMoveResult
type: object
required: [outcome, re_enrolled_paths]
properties:
  outcome:
    type: string
    enum: [re_enrolled, already_complete]
  re_enrolled_paths:
    type: array
    description: >
      Paths re-enrolled by this retry, WORKSPACE-RELATIVE (relative to the
      workspace root, not to the collection or the caller). May be empty
      when the outcome is `already_complete`.
    items:
      type: string
      minLength: 1
