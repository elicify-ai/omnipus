title: MessageStatusFrame
description: >
  Server → client delivery status for one user message. Session-scoped. The
  gateway emits received only after the user transcript entry is durably
  appended, working after the message is successfully admitted to the agent
  bus, and failed when processing stops before admission. Emitted only for a
  MessageFrame carrying client_message_id, preserving compatibility with older
  clients.
type: object
required:
  - type
  - session_id
  - client_message_id
  - state
additionalProperties: false
properties:
  type:
    type: string
    const: message_status
  session_id:
    type: string
    minLength: 1
    maxLength: 128
  client_message_id:
    type: string
    minLength: 1
    maxLength: 128
  state:
    type: string
    enum:
      - received
      - working
      - failed

  seq:
    type: integer
    format: int64
    minimum: 1
    description: >-
      Per-session sequence number of this frame (#823 catch-up redesign). Strictly
      increasing and gap-free within the session, assigned by the gateway's per-session
      hub as the single chokepoint through which every session-scoped frame is published.
      Optional: absent on an unsequenced copy of this frame (for example a broadcast
      delivered to a tab that is not bound to this session) — the client only advances its
      per-session cursor for frames that carry seq. The client stores the highest seq it
      has applied per session and sends it back as since_seq on attach_session; frames at
      or below that cursor are ignored, which makes re-delivery idempotent.
